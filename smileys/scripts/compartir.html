<!doctype html><meta charset="utf-8">
<!-- La imagen que sale al compartir la página por WhatsApp o Facebook (1200×630).
     La pinta scripts/compartir.mjs → img/compartir.jpg -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,800&family=Figtree:wght@700;800&display=swap">
<style>
body{margin:0} .t{position:relative; width:1200px; height:630px; overflow:hidden; background:#0E0B0A; color:#FFF6E8; font-family:Figtree}
.t img.p{position:absolute; right:-120px; top:-40px; width:760px; height:760px; object-fit:cover; border-radius:50%; box-shadow:0 0 0 18px #E3262B}
.t .in{position:absolute; left:64px; top:64px; width:560px}
.t .logo{width:300px; color:#FFF6E8}
.t h1{margin:34px 0 0; font:800 92px/.86 "Bricolage Grotesque"; font-variation-settings:"wdth" 76; text-transform:uppercase; letter-spacing:-.02em}
.t h1 em{font-style:normal; color:#FFC72C} .t h1 small{display:inline-block; margin-left:14px; font:700 26px/1 Figtree; text-transform:none; letter-spacing:0; color:#E9DCCB; vertical-align:middle}
.t p{margin:22px 0 0; font-size:30px; font-weight:700; color:#E9DCCB}
.t .wa{position:absolute; left:64px; bottom:58px; display:inline-flex; gap:12px; align-items:center; padding:18px 28px; border-radius:99px; background:#E3262B; font-size:28px; font-weight:800}
</style>
<div class="t">
  <img class="p" src="../img/hero-queso.webp" alt="">
  <div class="in">
    <svg class="logo" viewBox="@@VB@@">@@LOGO@@</svg>
    <h1>2 pizzas grandes <em>$289</em><small>en mostrador</small></h1>
    <p>Pizza, alitas y boneless en Querétaro. Arma tu pedido en un minuto.</p>
  </div>
  <div class="wa">Pide por WhatsApp</div>
</div>
