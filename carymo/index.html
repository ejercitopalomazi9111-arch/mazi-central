<script>/* SIN ZOOM (Carlos, 14 nov: «bloquea el zoom porque molesta»). Safari del iPhone no hace caso a user-scalable=no:
   se le corta el pellizco (gesturestart) y el doble toque (touch-action en el CSS). El pizarrón sigue acercándose con
   su propio pellizco, que no es el zoom de la página. */
for(const ev of ['gesturestart', 'gesturechange']) document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });</script>
<meta name="theme-color" content="#170A26">

<!-- CARYMO · antes «Estudio» (Carlos, 12 nov: «ahora la App se llamará CARYMO · Learn. Explore. Grow. · Todo lo que puedes
     aprender, en un solo lugar»). Lo que sigue es cómo nació (Carlos, 12 nov): «una app tipo Duolingo tipo Knowunity conectada a la sala», «con nuestro estilo pero
     enfócate más en el color vino, usa morado oscuro para detalles y el claro para resaltar, como algo más profesional».
     Plan de examen → camino por unidades → lección y cuestionario con combo → grado, XP, racha y ranking de la semana.
     La IA (Negro y Paulina) pasa por La Sala; el progreso vive en La Sala (servidor/estudio.js). Lógica en carymo.js; lo compartido con La Sala (pizarrón, sonidos, JSON de la IA) vive en ../sala/. -->
<style>
  html{ touch-action:manipulation; -webkit-text-size-adjust:100% }
  @font-face{ font-family:Titulo; src:url(../sala/letra/montserrat.woff2) format("woff2"); font-weight:100 900; font-display:swap }
  @font-face{ font-family:Texto; src:url(../sala/letra/nunito-600.woff2) format("woff2"); font-weight:600; font-display:swap }
  @font-face{ font-family:Texto; src:url(../sala/letra/nunito-700.woff2) format("woff2"); font-weight:700; font-display:swap }
  @font-face{ font-family:Dibujada; src:url(../sala/letra/caveat-700.woff2) format("woff2"); font-weight:700; font-display:swap }
  :root{
    --fondo:#170A26; --fondo-2:#1F1031; --sup:#2A1640; --sup-2:#351C4F; --borde:#ffffff14;
    --vino:#7E1735; --vino-2:#9A1F43; --vino-osc:#4E0E22;
    --claro:#AC27FF; --claro-txt:#C77DFF; --oro:#E8B54A; --oro-osc:#9A6B12;
    --hueso:#F1ECF4; --suave:#B3A5C4; --tenue:#7E6E92;
    --bien:#AC27FF; --mal:#E2506A;
    --r:18px;
  }
  *{ box-sizing:border-box; margin:0 }
  html{ -webkit-text-size-adjust:100%; overflow-x:clip; background:var(--fondo) }
  /* una palabra de 50 letras sin espacios (Carlos, 14 nov: «que se llenen de cosas… y arréglalo antes de que pase») se parte en vez de salirse */
  body{ overflow-wrap:anywhere; overflow-x:clip; background:var(--fondo); color:var(--hueso); font:600 16px/1.45 Texto, -apple-system, system-ui, sans-serif; min-height:100dvh;
    -webkit-tap-highlight-color:transparent }
  button, input, textarea, select{ font-family:inherit; font-size:16px; color:inherit }
  button{ cursor:pointer }
  .i{ width:1.2em; height:1.2em; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none }
  [hidden]{ display:none!important }
  h1, h2, h3, .titulo{ font-family:Titulo, Texto, sans-serif; letter-spacing:-.02em }
  :focus-visible{ outline:2px solid var(--claro-txt); outline-offset:2px }

  /* botones */
  .bt{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:0 18px; border-radius:14px; border:0;
    background:var(--sup); color:var(--hueso); font-weight:700; transition:transform .28s cubic-bezier(.3,1.6,.4,1), box-shadow .2s, background .2s, opacity .2s; -webkit-tap-highlight-color:transparent }
  /* al soltar, el botón rebota tantito (13 nov, «más smooth»); al apretar baja rápido */
  .bt:active, .nodo:active{ transition-duration:.07s }
  .bt:active{ transform:scale(.97) }
  .bt.fuerte{ background:var(--vino); color:#fff; box-shadow:0 4px 0 var(--vino-osc) }
  .bt.fuerte:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--vino-osc) }
  .bt.blanco{ background:#fff; color:#1B0D2A; box-shadow:0 4px 0 #CFC4DA }
  .bt.blanco:active{ transform:translateY(3px); box-shadow:0 1px 0 #CFC4DA }
  .bt.ancho{ width:100% }
  .bt:disabled{ opacity:.4; pointer-events:none }
  .bt.redondo{ width:44px; min-height:44px; padding:0; border-radius:50% }
  .bt.fantasma{ background:transparent; border:1px solid var(--borde) }

  /* ══ armazón ══ */
  .app{ min-height:100dvh; padding-bottom:calc(76px + env(safe-area-inset-bottom)) }
  .vista{ max-width:560px; margin:0 auto; padding:0 16px }
  .nav{ position:fixed; left:0; right:0; bottom:0; z-index:40; display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); padding:6px 12px calc(6px + env(safe-area-inset-bottom));
    background:#170A26f2; backdrop-filter:blur(12px); border-top:1px solid var(--borde) }
  .nav button{ display:flex; flex-direction:column; align-items:center; gap:2px; min-height:52px; border:0; background:none; color:var(--tenue); font-size:11px; font-weight:700; border-radius:12px }
  .nav button .i{ width:24px; height:24px }
  .nav button[aria-current="page"]{ color:var(--hueso) }
  .nav button[aria-current="page"] .i{ color:var(--claro-txt) }

  /* la barra de arriba del camino */
  .cabeza{ position:sticky; top:var(--muelle, 0px); z-index:30; padding:calc(8px + env(safe-area-inset-top)) 16px 10px; background:linear-gradient(var(--fondo) 75%, #170A2600) }
  .cabeza .fila{ display:flex; align-items:center; gap:8px; max-width:560px; margin:0 auto }
  .cabeza .plan-nombre{ flex:1; min-width:0; display:flex; align-items:center; justify-content:center; gap:6px; border:0; background:none; font:800 17px/1.1 Titulo; padding:8px 4px; min-height:44px }
  .cabeza .plan-nombre span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .pastilla{ display:inline-flex; align-items:center; gap:4px; padding:6px 10px; border-radius:999px; background:var(--sup); font:800 14px/1 Titulo; min-height:32px }
  .pastilla .i{ width:16px; height:16px }
  .pastilla.racha{ color:#FFB27A } .pastilla.racha.apagada{ color:var(--tenue) }
  .pastilla.xp{ color:var(--claro-txt) }
  /* ══ varios cursos y la sesión de estudio (sesion.js) ══ */
  .cursos-fila{ display:flex; gap:8px; overflow-x:auto; padding:4px 2px 12px; margin:0 -2px; scrollbar-width:none } .cursos-fila::-webkit-scrollbar{ display:none }
  .curso-chip{ flex:none; display:flex; align-items:center; gap:8px; padding:8px 12px 8px 8px; min-height:48px; border-radius:16px; border:2px solid #ffffff14; background:var(--fondo-2); color:inherit; font:inherit; text-align:left }
  .curso-chip[aria-selected="true"]{ border-color:var(--c, var(--claro)); background:color-mix(in srgb, var(--c, #AC27FF) 22%, var(--fondo-2)) }
  .curso-chip > i{ width:28px; height:28px; border-radius:50%; flex:none; background:conic-gradient(var(--c, #AC27FF) calc(var(--p) * 1%), #ffffff1f 0); -webkit-mask:radial-gradient(circle, transparent 52%, #000 54%); mask:radial-gradient(circle, transparent 52%, #000 54%) }
  .curso-chip span{ display:grid; gap:1px } .curso-chip b{ font:800 13.5px/1.15 Titulo; white-space:nowrap } .curso-chip small{ font-size:11.5px; color:var(--tenue); white-space:nowrap }
  .curso-chip.sesion{ border-style:dashed; border-color:#C77DFF77 } .curso-chip.sesion .i{ width:22px; height:22px; color:var(--claro-txt); margin-left:4px }
  .ses-cursos{ display:flex; flex-wrap:wrap; gap:8px } .ses-cursos .chip[aria-pressed="true"]{ background:color-mix(in srgb, var(--c, #AC27FF) 40%, transparent); border-color:var(--c, #AC27FF) }
  .ses-total{ text-align:center; color:var(--suave); font-weight:700; margin:16px 0 10px }
  .pomodoro{ position:relative; display:flex; align-items:center; gap:7px; max-width:calc(100vw - 32px); min-height:36px; padding:4px 14px 4px 10px; border:0; border-radius:99px;
    background:var(--vino); color:#fff; font:700 13px/1 Texto }
  .pomodoro .i{ width:17px; height:17px; flex:none } .pomodoro b{ font:800 15px/1 Titulo; font-variant-numeric:tabular-nums } .pomodoro span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:.92 }
  .pomodoro small{ font-size:11px; opacity:.8 } .pomodoro.descanso{ background:#1F6F5B } .pomodoro.pausado{ opacity:.75 }
  /* ══ EL MUELLE (muelle.js): lo que aparece vive en esta franja y empuja la página; nunca tapa nada (Carlos, 14 nov) ══ */
  .muelle{ position:fixed; left:0; right:0; top:0; z-index:98; display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:6px 8px; overflow:hidden;
    background:var(--fondo); pointer-events:none }
  .muelle.lleno{ padding:calc(6px + env(safe-area-inset-top)) 12px 8px; box-shadow:0 8px 18px -12px #000c }
  .muelle > *{ pointer-events:auto; max-width:100% }
  /* sin transición: si la página bajara poco a poco, el aviso taparía lo de arriba ese cuarto de segundo */
  body{ padding-top:var(--muelle, 0px); overflow-anchor:none }
  .muelle .pomodoro{ order:1 } .muelle .barra-sesion{ order:2 } .muelle .pv-asoma{ order:3 } .muelle .combo-vfx{ order:4 } .muelle .muelle-dice{ order:5 } .muelle .brindis{ order:6 }
  .muelle-dice{ flex-basis:100%; max-width:min(100%, 420px); padding:8px 14px; border-radius:14px; background:#fff; color:#2A1240; font:700 13.5px/1.3 system-ui, sans-serif; text-align:center; animation:brinda 2.8s cubic-bezier(.2,.9,.3,1) both }

  /* ══ apuntes (apuntes.js) y el editor de dibujo (trazo.js) ══ */
  #vApuntes .campo[type=search]{ margin-bottom:10px }
  .ap-filtro{ margin-bottom:12px }
  .ap-lista{ display:grid; gap:10px; margin:14px 0 30px }
  /* las carpetas de Apuntes: tipo → materia */
  .ap-arriba{ display:grid; grid-template-columns:minmax(0, 1fr) 48px; gap:8px; margin-bottom:14px } .ap-arriba .bt.redondo{ width:48px; height:48px }
  .ap-carpetas{ display:grid; gap:8px; margin-bottom:6px }
  .ap-carpeta{ display:grid; grid-template-columns:44px minmax(0, 1fr) auto 18px; gap:12px; align-items:center; padding:12px 14px 12px 12px; border-radius:18px; border:1px solid var(--borde); background:var(--fondo-2); color:inherit; font:inherit; text-align:left; min-height:68px }
  .ap-carpeta .ap-txt b{ display:block; font:800 16px/1.2 Titulo } .ap-carpeta .ap-txt small{ display:block; color:var(--tenue); font-size:13px; margin-top:2px }
  .ap-c-ico{ width:44px; height:44px; display:grid; place-items:center; border-radius:13px; background:#AC27FF22; color:var(--claro-txt) } .ap-c-ico .i{ width:22px; height:22px }
  .ap-n{ min-width:28px; padding:3px 8px; border-radius:99px; background:var(--sup); font:800 13px/1.2 Titulo; text-align:center; font-variant-numeric:tabular-nums } .ap-carpeta > .i{ width:18px; height:18px; color:var(--tenue) }
  .ap-migas{ display:flex; align-items:center; gap:10px; margin:2px 0 12px } .ap-migas b{ font:800 18px/1.2 Titulo; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .ap-card{ display:grid; grid-template-columns:64px minmax(0, 1fr); gap:12px; align-items:start; text-align:left; padding:12px; border-radius:18px; border:1px solid var(--borde); background:var(--fondo-2); color:inherit; font:inherit; min-height:64px }
  .ap-card img, .ap-ico{ width:64px; height:64px; border-radius:12px; object-fit:cover; background:#fff }
  .ap-ico{ display:grid; place-items:center; background:var(--sup); color:var(--claro-txt) } .ap-ico .i{ width:26px; height:26px }
  .ap-txt{ display:grid; gap:3px; min-width:0 } .ap-txt b{ font:800 16px/1.2 Titulo } .ap-txt small{ color:var(--tenue); font-size:12.5px }
  .ap-ext{ color:var(--suave); font-size:13.5px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
  .ap-vacio{ color:var(--suave); text-align:center; padding:26px 8px }
  .ap-tit{ flex:1; margin:0; font:800 19px/1.2 Titulo; min-width:0 }
  .ap-titulo{ flex:1; min-width:0; border:0; background:none; color:var(--hueso); font:800 20px/1.2 Titulo; padding:8px 4px; outline:none }
  .ap-de{ display:flex; align-items:center; gap:6px; color:var(--claro-txt); font-weight:700; font-size:13px } .ap-de .i{ width:16px; height:16px }
  .ap-puntos{ display:grid; gap:10px; padding-left:20px; margin:12px 0 20px; line-height:1.45 } .ap-puntos b{ color:var(--hueso) }
  .ap-texto{ min-height:180px; margin-top:10px; resize:none; line-height:1.5; font-size:16px }
  .ap-dibujo{ display:grid; gap:10px; margin-top:12px } .ap-dibujo img{ width:100%; border-radius:14px; background:#fff; box-shadow:0 0 0 1px #ffffff1a }
  .peligro-suave{ color:#FF9CAE }
  .capa.dibujo{ overflow:hidden; background:#170A26 }
  .dib-arriba{ display:flex; align-items:center; gap:4px; padding:calc(6px + env(safe-area-inset-top)) 8px 6px }
  .dib-arriba .bt[disabled]{ opacity:.35 }
  .dib-caja{ position:relative; flex:1 1 auto; min-height:0; overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none }
  .dib-vista{ position:absolute; inset:0; display:block }
  .dib-abajo{ display:grid; gap:8px; padding:8px 10px calc(10px + env(safe-area-inset-bottom)); background:var(--fondo-2); border-radius:20px 20px 0 0 }
  .dib-herr{ display:flex; align-items:center; gap:6px; overflow-x:auto }
  .dib-herr .bt[aria-pressed="true"]{ background:var(--vino); color:#fff }
  .dib-color{ position:relative; width:44px; height:44px; flex:none; border-radius:50%; overflow:hidden; box-shadow:0 0 0 2px #fff6 }
  .dib-color input{ position:absolute; inset:-8px; width:60px; height:60px; opacity:0; cursor:pointer } .dib-color span{ position:absolute; inset:0; pointer-events:none }
  .dib-pincel{ flex:1; min-width:0; gap:6px; min-height:44px; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .dib-sliders{ display:grid; grid-template-columns:1fr 1fr; gap:10px } .dib-sliders label{ display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:6px; font:700 12px/1 Texto; color:var(--suave) }
  .dib-sliders input{ width:100%; accent-color:#AC27FF; min-height:32px } .dib-sliders b{ min-width:34px; text-align:right; color:var(--hueso) }
  .dib-colores{ display:flex; gap:8px; overflow-x:auto; padding:2px } .dib-colores button{ flex:none; width:32px; height:32px; border-radius:50%; border:2px solid #ffffff55 }
  .pinceles{ display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:8px }
  .pincel-t{ display:grid; gap:4px; padding:8px; border-radius:14px; border:2px solid #ffffff1a; background:#fff; color:#2A1240; font:800 13px/1.2 Titulo } .pincel-t canvas{ width:100%; height:auto }
  .pincel-t[aria-pressed="true"]{ border-color:#AC27FF; box-shadow:0 0 0 3px #AC27FF55 }
  .pin-prev{ width:100%; height:auto; border-radius:14px; background:#fff; margin-bottom:10px }
  .pin-l{ display:grid; gap:4px; margin-bottom:8px; font:700 13px/1.2 Texto; color:var(--suave) }
  .pin-s{ display:grid; grid-template-columns:minmax(0, 1fr) 40px; gap:2px 8px; align-items:center; margin:6px 0; font:700 13px/1.2 Texto; color:var(--suave) }
  .pin-s input{ grid-column:1; width:100%; accent-color:#AC27FF; min-height:30px } .pin-s b{ grid-row:1 / span 2; grid-column:2; text-align:right; color:var(--hueso) }
  .capas-l{ display:grid; gap:8px }
  .capa-f{ display:grid; grid-template-columns:44px minmax(0, 1fr) 96px; gap:6px 8px; align-items:center; padding:8px; border-radius:14px; background:#ffffff0a; border:2px solid transparent }
  .capa-f.sel{ border-color:#AC27FF; background:#AC27FF1c }
  .capa-nom{ border:0; background:none; color:inherit; font:800 15px/1.2 Titulo; text-align:left; min-height:44px; display:flex; align-items:center; gap:6px } .capa-nom .i{ width:14px; height:14px }
  .capa-op{ display:grid; font:700 11px/1 Texto; color:var(--suave); gap:2px } .capa-op input{ width:100%; accent-color:#AC27FF }
  .capa-modo{ grid-column:2 / span 2; min-height:38px; font-size:14px }
  .capa-acc{ grid-column:1 / -1; display:flex; gap:4px; flex-wrap:wrap } .capa-acc .bt{ width:40px; height:40px; min-width:40px } .capa-acc .i{ width:17px; height:17px }

  /* ══ la cuenta (cuenta.js) y compartir planes ══ */
  .cuenta-aviso{ display:grid; gap:8px } .cuenta-aviso b{ font:800 17px/1.2 Titulo } .cuenta-aviso span{ color:var(--suave) }
  .fila-bt{ display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px } .fila-bt .bt{ min-height:48px }
  .con-llave summary{ color:var(--tenue); font-size:13px; cursor:pointer; padding:6px 0; min-height:32px }
  .form-cuenta{ display:grid; gap:12px } .form-cuenta label{ display:grid; gap:6px; font:700 14px/1.2 Texto; color:var(--suave) }
  .form-cuenta .campo{ font-size:16px }
  /* qué estudias, al crear la cuenta */
  .escolar{ border:0; padding:0; margin:0; min-width:0 } .escolar legend{ font:700 14px/1.2 Texto; color:var(--suave); margin-bottom:6px; padding:0 }
  .escolar-op{ display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:6px }
  .form-cuenta .escolar-op label{ display:block; gap:0; position:relative }
  .escolar-op input{ position:absolute; opacity:0; inset:0; margin:0 }
  .escolar-op span{ display:flex; align-items:center; min-height:44px; padding:8px 12px; border-radius:12px; border:2px solid #ffffff1a; background:#ffffff0d; color:var(--hueso, #fff); font-weight:700; font-size:14px; line-height:1.2; overflow-wrap:anywhere }
  .escolar-op input:checked + span{ border-color:var(--claro); background:#AC27FF22 }
  .escolar-op input:focus-visible + span{ outline:2px solid var(--claro); outline-offset:2px }
  .cuenta-txt{ color:var(--suave); margin:0 0 4px; line-height:1.45 }
  .cuenta-error{ color:#FF9CAE; font-weight:700; margin:0 }
  .cuenta-otras{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center } .cuenta-otras .bt{ min-height:44px; font-size:14px }
  .codigo-rec{ font:900 26px/1.2 Titulo; letter-spacing:.12em; text-align:center; padding:18px 12px; margin:10px 0 14px; border-radius:16px; background:#ffffff0d; border:2px dashed #C77DFF77; color:#F1DDFF; user-select:all; -webkit-user-select:all; overflow-wrap:anywhere }
  .codigo-rec.grande{ font-size:40px; letter-spacing:.24em; padding-left:.24em }

  /* ══ la animación de entrada (entrada.js) ══ */
  #entrada{ position:fixed; inset:0; z-index:200; background:radial-gradient(circle at 50% 38%, #4A1A6E 0, #2A0F45 34%, #170A26 70%); overflow:hidden; touch-action:none }
  .en-chispas i{ position:absolute; width:30px; height:30px; margin:-15px 0 0 -15px; opacity:0; filter:drop-shadow(0 0 6px #C77DFF);
    background:conic-gradient(from 45deg, transparent 0 20%, #F1DDFF 20% 30%, transparent 30% 45%, #F1DDFF 45% 55%, transparent 55% 70%, #F1DDFF 70% 80%, transparent 80%); clip-path:polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%) }
  .en-centro{ position:absolute; left:0; right:0; top:46%; translate:0 -50%; display:flex; flex-direction:column; align-items:center }
  .en-ico{ width:min(170px, 44vw); height:auto; border-radius:22%; opacity:0; box-shadow:0 22px 50px -16px #000, 0 0 60px -10px #AC27FF }
  .en-onda{ position:absolute; top:0; width:min(170px, 44vw); aspect-ratio:1; border-radius:50%; border:3px solid #C77DFF; opacity:0 }
  .en-nombre{ position:relative; display:flex; margin-top:26px; padding:4px 6px }
  .en-nombre i{ display:block; font:900 clamp(42px, 13vw, 60px)/1 Titulo; font-style:normal; color:#fff; letter-spacing:.06em; opacity:0; text-shadow:0 6px 24px #AC27FF77 }
  .en-nombre i:nth-child(4){ color:#E7CCFF }
  .en-brillo{ position:absolute; inset:0 auto 0 0; width:40%; background:linear-gradient(90deg, transparent, #ffffffb0, transparent); mix-blend-mode:overlay; opacity:0; pointer-events:none }
  .en-lema{ margin:12px 0 0; padding-left:.32em; font:800 13px/1 Titulo; letter-spacing:.32em; text-transform:uppercase; color:#C77DFF; opacity:0 }
  .en-masc{ margin-top:30px; opacity:0 }
  /* la dedicatoria (Carlos, 14 nov: «al abrir menciona que es un proyecto de Grupo Mazi dedicado con amor para Mónica») */
  .en-dedica{ position:absolute; left:16px; right:16px; bottom:max(28px, env(safe-area-inset-bottom)); margin:0; display:grid; justify-items:center; gap:6px; text-align:center; opacity:0 }
  .en-mazi{ display:inline-flex; align-items:center; gap:7px; font:800 12px/1 Titulo; letter-spacing:.18em; text-transform:uppercase; color:#E9E4E4 }
  .en-mazi svg{ width:18px; height:18px; flex:none }
  .en-amor{ font:700 24px/1.15 Dibujada, Texto; color:#C77DFF; overflow-wrap:anywhere }

  /* ══ palomium y el cuarto del compañero (companero.js, cosas.js) ══ */
  .pastilla.cubos{ border:0; color:#E7CCFF; font:800 14px/1 Titulo; cursor:pointer; gap:5px }
  .pastilla.cubos{ position:relative; padding:3px 12px 3px 3px; min-height:44px }
  .pm-aro{ --c:#4FD48A; position:relative; display:grid; place-items:center; width:40px; height:40px; border-radius:50%; flex:none;
    background:conic-gradient(var(--c) calc(var(--salud, 80) * 1%), #ffffff22 0) }
  .pm-aro::before{ content:""; position:absolute; inset:3px; border-radius:50%; background:var(--fondo-2, #24113A) }
  .pm-masc{ position:relative; display:grid; place-items:center; width:34px; height:34px; overflow:hidden; border-radius:50% }
  .pastilla.cubos[data-salud="baja"] .pm-aro{ --c:#F2C14E } .pastilla.cubos[data-salud="peligro"] .pm-aro{ --c:#FF5A72 }
  .pastilla.cubos.sin-masc .pm-aro{ display:none }
  .pm-cubos{ display:inline-flex; align-items:center; gap:4px } .pm-cubos b{ font:inherit }
  .pm-alerta{ display:none; position:absolute; left:28px; top:-4px; width:18px; height:18px; border-radius:50%; background:#FF5A72; color:#fff; font:900 13px/18px Titulo; text-align:center; box-shadow:0 0 0 2px var(--fondo) }
  .pastilla.cubos[data-salud="peligro"] .pm-alerta, .pastilla.cubos[data-salud="baja"] .pm-alerta{ display:block; animation:pmAlerta 1.1s ease-in-out infinite }
  .pastilla.cubos[data-salud="baja"] .pm-alerta{ background:#E8A33A }
  @keyframes pmAlerta{ 0%, 100%{ transform:translateY(0) scale(1) } 40%{ transform:translateY(-4px) scale(1.15) } }
  .pastilla.cubos.aviso{ box-shadow:none }
  .pastilla.cubos.gana{ animation:ganaCubo .7s cubic-bezier(.3,1.6,.4,1) }
  @keyframes ganaCubo{ 40%{ transform:scale(1.25) } }
  .cubo-ico{ display:inline-grid; width:18px; height:18px; flex:none } .cubo-ico svg{ width:100%; height:100% }
  .cubos-brindis{ flex-wrap:wrap; justify-content:center; text-align:center; row-gap:4px }
  .cubos-brindis small{ flex-basis:100%; font:700 12px/1.2 Texto; opacity:.85 }
  .cuarto{ position:relative; aspect-ratio:1 / .92; border-radius:24px; overflow:hidden; margin:4px 0 14px; box-shadow:0 0 0 1px #ffffff14, 0 18px 40px -22px #000 }
  .cuarto .pared{ position:absolute; inset:0 0 34% 0; background:linear-gradient(#3A1858, #2A1040); }
  .cuarto .pared::after{ content:""; position:absolute; inset:auto 0 0 0; height:12px; background:#4E0E22 }
  .cuarto .ventana{ position:absolute; left:42%; top:9%; width:20%; aspect-ratio:1; border-radius:12px; background:linear-gradient(#5E8CDB, #A9C8F5); box-shadow:inset 0 0 0 5px #6E3B2A, 0 0 0 2px #4A2418 }
  .cuarto .ventana::after{ content:""; position:absolute; left:50%; top:5px; bottom:5px; width:4px; margin-left:-2px; background:#6E3B2A }
  .cuarto .piso{ position:absolute; inset:66% 0 0 0; background:repeating-linear-gradient(90deg, #6E3B2A 0 22%, #7C4632 22% 44%); }
  .cuarto .muebles .mueble{ position:absolute; translate:-50% -50%; display:block; filter:drop-shadow(0 4px 4px #0006) } .mueble svg{ width:100%; height:auto; display:block }
  .masc-cuarto{ position:absolute; left:50%; bottom:6%; translate:-50% 0; z-index:2 }
  .barras-cuidado{ display:grid; gap:8px; margin-bottom:12px }
  .barra-c{ display:grid; grid-template-columns:118px minmax(0, 1fr) 30px; align-items:center; gap:10px; font:700 14px/1 Texto }
  .barra-c span{ display:flex; align-items:center; gap:6px } .barra-c .i{ width:16px; height:16px; color:var(--claro-txt) }
  .barra-c > i{ display:block; height:10px; border-radius:5px; background:#ffffff1a; overflow:hidden } .barra-c > i > i{ display:block; height:100%; border-radius:5px; background:linear-gradient(90deg, #AC27FF, #C77DFF); transition:width .6s cubic-bezier(.2,.9,.3,1) }
  .barra-c.baja > i > i{ background:linear-gradient(90deg, #C42A42, #FF6B7E) } .barra-c b{ text-align:right; color:var(--suave); font:800 13px/1 Titulo }
  .acciones-cuidado{ display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:8px; margin-bottom:6px }
  .acciones-cuidado .bt{ flex-direction:column; gap:4px; min-height:64px; font-size:13px; padding:8px 4px; text-align:center }
  .grupo-t{ font:800 14px/1.2 Titulo; color:var(--suave); margin:14px 0 8px }
  .tienda-g{ display:grid; grid-template-columns:repeat(auto-fill, minmax(104px, 1fr)); gap:8px }
  .cosa{ display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 8px; border-radius:16px; background:var(--fondo-2); border:1px solid var(--borde); text-align:center; color:inherit; font:inherit }
  .cosa-dib{ width:56px; height:56px } .cosa-dib svg{ width:100%; height:100% }
  .cosa b{ font:800 13px/1.15 Titulo } .cosa small{ font-size:11.5px; color:var(--tenue); min-height:2.4em; line-height:1.2 }
  .cosa .bt{ gap:4px; min-height:40px; width:100%; margin-top:auto } .cosa .bt[disabled]{ opacity:.45 } .cosa .bt.mini .cubo-ico{ display:inline-grid }
  .cosa small:empty{ display:none }
  .cosa.elegir{ cursor:pointer; min-height:44px }
  .como-ganar{ margin:20px 0 28px; padding:14px 16px; border-radius:16px; background:#ffffff0a; color:var(--suave); font-size:14px } .como-ganar b{ color:var(--hueso); display:block; margin-bottom:4px }
  .avance{ max-width:560px; margin:8px auto 0 }
  .avance .barra{ position:relative; height:26px; border-radius:999px; background:var(--sup); overflow:hidden }
  .avance .barra i{ position:absolute; inset:0 auto 0 0; width:0; border-radius:999px; background:linear-gradient(90deg, var(--vino), var(--vino-2)); transition:width .8s cubic-bezier(.2,.8,.2,1) }
  .avance .barra b{ position:relative; display:flex; align-items:center; height:100%; padding:0 12px; font:800 14px/1 Titulo; justify-content:space-between }
  .avance .pie{ display:flex; justify-content:space-between; font-size:12px; color:var(--suave); margin-top:5px; padding:0 4px }

  /* ══ el camino ══ */
  .camino{ position:relative; max-width:420px; margin:0 auto; padding:12px 0 40px }
  .unidad{ position:relative; margin:14px 0 6px }
  .unidad-cab{ display:flex; align-items:center; gap:10px; padding:14px 16px; border-radius:16px; color:#fff; box-shadow:0 4px 0 #0005 }
  .unidad-cab .t{ flex:1; min-width:0 } .unidad-cab small{ display:block; font-size:12px; opacity:.85; font-weight:700; letter-spacing:.06em; text-transform:uppercase }
  .unidad-cab h3{ font:800 18px/1.15 Titulo }
  .unidad-cab .anillo{ width:34px; height:34px; flex:none }
  .burbuja{ position:relative; display:inline-block; margin:14px 0 0 10px; padding:10px 14px; border-radius:14px; background:var(--sup); font-size:14px; color:var(--hueso); max-width:80% }
  .burbuja::before{ content:""; position:absolute; left:18px; top:-7px; width:14px; height:14px; background:inherit; transform:rotate(45deg); border-radius:3px }
  .nodos{ position:relative; height:var(--alto) }
  .nodos svg.senda{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none }
  .nodos svg.senda path{ fill:none; stroke:#2C173F; stroke-width:30; stroke-linecap:round }
  .nodos svg.senda path.hecha{ stroke:#3A1D55 }
  .nodo{ position:absolute; width:78px; height:78px; margin:-39px 0 0 -39px; border-radius:50%; border:0; display:grid; place-items:center; color:#fff;
    background:var(--color, var(--vino)); box-shadow:0 7px 0 #00000059, inset 0 -6px 0 #0003, inset 0 3px 0 #ffffff2a; transition:transform .3s cubic-bezier(.3,1.6,.4,1), box-shadow .2s, filter .3s; -webkit-tap-highlight-color:transparent }
  .nodo .i{ width:32px; height:32px; stroke-width:2.2 }
  .nodo:active{ transform:translateY(4px); box-shadow:0 3px 0 #00000059, inset 0 -6px 0 #0003 }
  .nodo.cerrado{ background:#2E1A44; color:#5E4B75; box-shadow:0 7px 0 #0000004d, inset 0 -6px 0 #0002 }
  .nodo.saltado{ background:#2E1A44; color:var(--claro-txt); box-shadow:0 7px 0 #0000004d, inset 0 0 0 3px #AC27FF66; border:2px dashed #AC27FF99 }
  .nodo.hecho{ background:radial-gradient(circle at 35% 30%, #FFE29A, var(--oro) 55%, #C98F22); color:#6B4508; box-shadow:0 7px 0 var(--oro-osc), inset 0 -5px 0 #0002 }
  .nodo.hecho::after{ content:""; position:absolute; inset:9px; border-radius:50%; border:3px solid #FFF1C866 }
  .nodo.actual{ animation:respira 2.4s ease-in-out infinite }
  .nodo.actual::before{ content:""; position:absolute; inset:-10px; border-radius:50%; border:4px solid var(--claro); opacity:.85 }
  .nodo.grande{ width:96px; height:96px; margin:-48px 0 0 -48px }
  /* las cátedras (pizarrón) son más chicas y de otro tono: se ven como «la clase antes del nivel» */
  .nodo.catedra{ width:64px; height:64px; margin:-32px 0 0 -32px; background:color-mix(in srgb, var(--color, var(--vino)) 55%, #170A26) }
  .nodo.catedra .i{ width:26px; height:26px }
  .nodo.catedra.cerrado{ background:#2A1840 }
  .nodo.grande .i{ width:40px; height:40px }
  @keyframes respira{ 0%,100%{ transform:scale(1) } 50%{ transform:scale(1.06) } }
  .nodo .etq{ position:absolute; top:calc(100% + 12px); left:50%; transform:translateX(-50%); width:max-content; max-width:150px; text-align:center; font-size:12px; line-height:1.2; color:var(--suave); font-weight:700; pointer-events:none }
  .nodo.actual .etq{ color:var(--hueso) }
  .nodo.recien{ animation:moneda .9s cubic-bezier(.3,1.5,.4,1) }
  @keyframes moneda{ 0%{ transform:scale(.6) rotateY(0) } 60%{ transform:scale(1.15) rotateY(360deg) } 100%{ transform:scale(1) rotateY(360deg) } }

  /* tarjeta de abajo del camino */
  .siguiente{ position:sticky; bottom:calc(84px + env(safe-area-inset-bottom)); z-index:20; max-width:560px; margin:0 auto; padding:16px; border-radius:20px;
    background:var(--vino); box-shadow:0 10px 30px #0008, 0 5px 0 var(--vino-osc); text-align:center }
  /* lo que queda entre la tarjeta y la barra de abajo se tapa: el camino no se asoma por debajo */
  .siguiente::after{ content:""; position:absolute; left:-16px; right:-16px; top:100%; height:120px; background:var(--fondo); pointer-events:none }
  .siguiente small{ display:block; font-size:12px; letter-spacing:.08em; text-transform:uppercase; opacity:.8 }
  .siguiente h3{ font:800 20px/1.15 Titulo; margin:2px 0 12px }

  /* vacío / portada de la app */
  .vacio{ text-align:center; padding:56px 8px 24px }
  .vacio h1{ font:900 34px/1.05 Titulo } .vacio h1 em{ font-style:normal; color:var(--claro-txt); display:block }
  .vacio p{ color:var(--suave); margin:14px auto 26px; max-width:340px }
  .sello{ width:120px; height:120px; margin:0 auto 22px; border-radius:32px; display:grid; place-items:center; background:linear-gradient(145deg, var(--vino-2), var(--vino)); box-shadow:0 8px 0 var(--vino-osc), 0 20px 40px #0007; color:#fff }
  .sello .i{ width:58px; height:58px; stroke-width:1.8 }

  /* ══ pantallas encima (alta, lección, quiz, resultado…) ══ */
  .capa{ position:fixed; inset:var(--muelle, 0px) 0 0 0; z-index:60; background:var(--fondo); overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; display:flex; flex-direction:column }
  .capa > *{ flex-shrink:0 }
  .capa .arriba{ display:flex; align-items:center; gap:12px; padding:calc(10px + env(safe-area-inset-top)) 16px 8px; max-width:560px; width:100%; margin:0 auto }
  .capa .cuerpo{ flex:1; max-width:560px; width:100%; margin:0 auto; padding:8px 16px 24px }
  .capa .abajo{ position:sticky; bottom:0; max-width:560px; width:100%; margin:0 auto; padding:12px 16px calc(14px + env(safe-area-inset-bottom)); background:linear-gradient(transparent, var(--fondo) 30%) }
  .progreso{ flex:1; height:14px; border-radius:999px; background:var(--sup); overflow:hidden; position:relative }
  .progreso i{ display:block; height:100%; width:0; background:var(--claro); border-radius:999px; transition:width .45s cubic-bezier(.2,.8,.2,1), background .3s }
  .entra{ animation:entra .45s cubic-bezier(.2,.8,.2,1) both }
  @keyframes entra{ from{ opacity:0; transform:translateY(14px) } to{ opacity:1; transform:none } }

  /* quien habla (sin mascota: un sello con chispa) */
  .habla{ display:flex; gap:12px; align-items:flex-start; margin:10px 0 18px }
  .habla .cara{ width:52px; height:52px; flex:none; border-radius:16px; display:grid; place-items:center; background:var(--vino); color:#fff; box-shadow:0 4px 0 var(--vino-osc) }
  .habla .cara .i{ width:26px; height:26px }
  .habla .dice{ position:relative; padding:12px 14px; border-radius:16px; background:var(--sup); font:800 17px/1.3 Titulo }
  .habla .dice::before{ content:""; position:absolute; left:-6px; top:18px; width:12px; height:12px; background:inherit; transform:rotate(45deg); border-radius:2px }

  /* alta: listas, fechas, material */
  .lista{ display:grid; gap:8px }
  .opcion-lista{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; min-height:56px; padding:10px 14px; border-radius:14px; border:2px solid var(--borde); background:var(--fondo-2); font-weight:700 }
  .opcion-lista .punto{ width:30px; height:30px; flex:none; border-radius:9px; display:grid; place-items:center; color:#fff }
  .opcion-lista .punto .i{ width:17px; height:17px }
  .opcion-lista[aria-pressed="true"]{ border-color:var(--claro); background:#2A1245 }
  .seccion-t{ font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--suave); margin:22px 0 10px }
  .chips{ display:flex; flex-wrap:wrap; gap:8px }
  .chip{ max-width:100%; text-align:left; border:1.5px solid var(--borde); background:var(--fondo-2); border-radius:999px; padding:9px 14px; min-height:40px; font-size:14px; font-weight:700 }
  .chip[aria-pressed="true"]{ border-color:var(--claro); background:#2A1245; color:#fff }
  .chip.agregar{ border-style:dashed; color:var(--claro-txt) }
  .campo{ width:100%; min-height:50px; border-radius:14px; border:2px solid var(--borde); background:var(--fondo-2); padding:0 14px; color:#fff }
  .campo:focus{ border-color:var(--claro); outline:0 }
  textarea.campo{ padding:12px 14px; min-height:96px; resize:vertical; line-height:1.4 }
  .fotos{ display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:10px }
  .foto-hueco{ aspect-ratio:1; border-radius:16px; border:2px dashed #ffffff30; background:none; display:grid; place-items:center; color:var(--suave); position:relative; overflow:hidden }
  .foto-hueco img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover }
  .foto-hueco .i{ width:30px; height:30px }
  .calendario{ width:170px; margin:26px auto 22px; border-radius:22px; overflow:hidden; background:#fff; color:#1B0D2A; text-align:center; box-shadow:0 14px 40px #0008; transform:rotate(-4deg) }
  .calendario .mes{ background:var(--vino); color:#fff; padding:8px; font:800 14px/1 Titulo; text-transform:lowercase }
  .calendario .num{ font:900 72px/1 Titulo; padding:10px 0 0 } .calendario .dia{ padding:0 0 14px; color:#6B5A80; font-weight:700 }
  .etiquetas{ display:flex; justify-content:center; flex-wrap:wrap; gap:14px; color:var(--suave); font-size:14px }
  .etiquetas span{ display:inline-flex; align-items:center; gap:5px } .etiquetas .i{ color:var(--claro-txt); width:16px; height:16px }

  /* preparando */
  .preparando{ text-align:center; padding:40px 0 }
  .preparando h2{ font:900 28px/1.1 Titulo; margin:22px 0 8px }
  .preparando .pct{ font:900 22px/1 Titulo; margin:18px 0 10px }
  .pasos-prep{ text-align:left; margin:22px auto 0; max-width:340px; border-radius:16px; background:var(--fondo-2); padding:8px 14px }
  .pasos-prep li{ list-style:none; display:flex; gap:10px; align-items:center; padding:10px 0; color:var(--tenue); transition:color .3s }
  .pasos-prep li .ca{ width:22px; height:22px; flex:none; border-radius:50%; border:2px solid currentColor; display:grid; place-items:center }
  .pasos-prep li .ca .i{ width:14px; height:14px; opacity:0 }
  .pasos-prep li.ya{ color:var(--hueso) } .pasos-prep li.ya .ca{ background:var(--claro); border-color:var(--claro) } .pasos-prep li.ya .ca .i{ opacity:1 }
  .mini-camino{ position:relative; height:150px; width:200px; margin:0 auto }
  .mini-camino i{ position:absolute; width:46px; height:46px; border-radius:50%; background:var(--claro); box-shadow:0 5px 0 #0006; opacity:0; transform:scale(.4); transition:opacity .4s, transform .5s cubic-bezier(.3,1.6,.4,1) }
  .mini-camino i.ve{ opacity:1; transform:none }

  /* lección */
  .leccion h1{ font:900 28px/1.1 Titulo; margin:6px 0 14px }
  .leccion p{ font-size:17px; line-height:1.55; color:#E6DDEE }
  .leccion b, .leccion strong{ color:#fff }
  .leccion ul{ padding:0; margin:16px 0; display:grid; gap:10px; list-style:none }
  .leccion li{ position:relative; padding-left:22px; font-size:17px; line-height:1.5; color:var(--tenue); transition:color .5s }
  .leccion li::before{ content:""; position:absolute; left:2px; top:.62em; width:8px; height:8px; border-radius:50%; background:currentColor }
  .leccion li.luz{ color:#E6DDEE } .leccion li.luz::before{ background:var(--claro) }
  .dato{ margin-top:18px; padding:14px 16px; border-radius:16px; background:var(--vino-osc); border:1px solid #ffffff12 }
  .dato small{ display:flex; gap:6px; align-items:center; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:#FFC1CF; margin-bottom:4px }
  .acciones-mini{ display:flex; gap:6px; margin-top:16px; color:var(--tenue) }
  .acciones-mini button{ border:0; background:none; min-width:44px; min-height:44px; border-radius:12px; display:grid; place-items:center; color:inherit }
  .acciones-mini button[aria-pressed="true"]{ color:var(--claro-txt) }

  /* cuestionario */
  .combo{ position:absolute; left:50%; top:-18px; transform:translateX(-50%); font:900 13px/1 Titulo; letter-spacing:.06em; color:var(--claro-txt); white-space:nowrap; transition:color .3s }
  .combo.oro{ color:var(--oro) }
  .combo-grande{ position:fixed; left:50%; top:42%; z-index:80; transform:translate(-50%, -50%); font:900 48px/1 Titulo; white-space:nowrap; color:var(--oro); -webkit-text-stroke:2px #5A3A06; pointer-events:none; animation:comboSube 1.1s cubic-bezier(.2,.9,.3,1) forwards }
  @keyframes comboSube{ 0%{ opacity:0; transform:translate(-50%, -40%) scale(.5) } 25%{ opacity:1; transform:translate(-50%, -50%) scale(1.15) } 70%{ opacity:1; transform:translate(-50%, -55%) scale(1) } 100%{ opacity:0; transform:translate(-50%, -80%) scale(.9) } }
  .pregunta{ font:800 22px/1.3 Titulo; margin:6px 0 22px }
  .opciones{ display:grid; gap:10px }
  .opc{ width:100%; text-align:left; min-height:58px; padding:12px 16px; border-radius:16px; border:2px solid var(--borde); background:var(--fondo-2); font-weight:700; font-size:16px; line-height:1.3; box-shadow:0 3px 0 #0004 }
  .opc[aria-pressed="true"]{ border-color:var(--claro); background:#2A1245 }
  .opc.bien{ border-color:var(--claro); background:var(--claro); color:#fff }
  .opc.mal{ border-color:var(--mal); background:#4A1222; color:#FFD6DE }
  .hueco-frase{ font:800 24px/1.6 Titulo; margin:10px 0 34px }
  .hueco{ display:inline-flex; align-items:center; justify-content:center; min-width:110px; min-height:44px; padding:0 12px; margin:0 4px; vertical-align:middle; border-bottom:3px solid var(--suave); border-radius:6px; transition:background .25s }
  .hueco.lleno{ border-bottom-color:transparent }
  .hueco.bien .ficha{ background:var(--claro); color:#fff; border-color:var(--claro) }
  .hueco.mal .ficha{ background:var(--mal); color:#fff; border-color:var(--mal) }
  .fichas{ display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px }
  .ficha-lugar{ min-height:52px; border-radius:14px; background:#ffffff08 }
  .ficha{ width:100%; min-height:52px; padding:8px 12px; border-radius:14px; border:2px solid var(--borde); background:var(--sup); font:800 17px/1.15 Titulo; box-shadow:0 3px 0 #0005 }
  .hueco .ficha{ width:auto; min-height:42px; box-shadow:none; background:var(--sup-2) }
  .pista{ margin-top:18px; padding:12px 14px; border-radius:14px; background:#2A1245; border:1px dashed var(--claro); font-size:15px }
  .botones-quiz{ display:grid; grid-template-columns:auto minmax(0, 1fr); gap:10px }
  /* la hoja de abajo después de verificar */
  .hoja-res{ position:fixed; left:0; right:0; bottom:0; z-index:70; padding:18px 16px calc(16px + env(safe-area-inset-bottom)); border-radius:24px 24px 0 0; animation:sube .35s cubic-bezier(.2,.9,.3,1) }
  .hoja-res .dentro{ max-width:560px; margin:0 auto }
  .hoja-res.bien{ background:#2B1146; border-top:2px solid var(--claro) } .hoja-res.mal{ background:#3A0F1E; border-top:2px solid var(--mal) }
  .hoja-res h3{ display:flex; align-items:center; gap:8px; font:900 22px/1 Titulo; margin-bottom:6px }
  .hoja-res.bien h3{ color:var(--claro-txt) } .hoja-res.mal h3{ color:#FF9DB0 }
  .hoja-res p{ color:#E6DDEE; font-size:15px; margin-bottom:12px }
  .hoja-res .bts{ display:grid; grid-template-columns:auto minmax(0, 1fr); gap:10px }
  @keyframes sube{ from{ transform:translateY(100%) } to{ transform:none } }
  .sacude{ animation:sacude .4s }
  @keyframes sacude{ 20%,60%{ transform:translateX(-7px) } 40%,80%{ transform:translateX(7px) } }

  /* resultado */
  .resultado{ text-align:center; padding:40px 0 10px }
  .resultado h1{ font:900 36px/1.05 Titulo; margin:20px 0 6px } .resultado p{ color:var(--suave) }
  .medallas{ display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:10px; margin:30px 0 }
  .medalla{ border-radius:16px; border:2px solid var(--c); overflow:hidden; background:var(--fondo-2); animation:entra .5s both }
  .medalla small{ display:block; background:var(--c); color:#fff; font:800 12px/1 Titulo; letter-spacing:.06em; padding:6px 0; text-transform:uppercase }
  .medalla b{ display:flex; align-items:center; justify-content:center; gap:5px; font:900 22px/1 Titulo; padding:14px 0; color:var(--c2, #fff) }
  .medalla b .i{ width:20px; height:20px }
  .estrellas{ display:flex; justify-content:center; gap:8px; margin:22px 0 }
  .estrellas button{ border:0; background:none; width:48px; height:48px; color:var(--tenue); display:grid; place-items:center }
  .estrellas button .i{ width:36px; height:36px }
  .estrellas button.on{ color:var(--oro) } .estrellas button.on .i{ fill:var(--oro) }

  /* ══ la pestaña Tú (yo.js) ══ */
  .oculto{ position:absolute; top:0; left:0; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap }
  .nav button{ font-size:12px }
  .sub-barra{ position:sticky; top:var(--muelle, 0px); z-index:30; display:flex; align-items:center; gap:10px; max-width:560px; margin:0 auto; padding:calc(8px + env(safe-area-inset-top)) 16px 6px; background:var(--fondo) }
  .sub-volver{ display:inline-flex; align-items:center; gap:2px; min-height:44px; padding:0 14px 0 6px; border:0; border-radius:99px; background:var(--sup); color:var(--hueso); font:800 15px/1 Titulo } .sub-volver .i{ width:20px; height:20px }
  .sub-barra + .vista, #subBarra:not([hidden]) ~ .vista{ padding-top:0 }
  #vYo{ max-width:560px; margin:0 auto; padding:calc(18px + env(safe-area-inset-top)) 16px 110px }
  .yo-cab{ display:flex; align-items:center; gap:14px; margin-bottom:14px }
  .yo-pj{ position:relative; flex:none; width:92px; height:92px; padding:0; border:0; border-radius:50%; background:var(--sup); box-shadow:0 0 0 4px var(--fondo), 0 0 0 6px var(--claro) }
  .yo-pj-dib, .yo-pj-dib svg{ display:block; width:100%; height:100%; border-radius:50% }
  .yo-pj-lapiz{ position:absolute; right:-2px; bottom:-2px; width:30px; height:30px; display:grid; place-items:center; border-radius:50%; background:var(--vino); color:#fff; box-shadow:0 0 0 3px var(--fondo) } .yo-pj-lapiz .i{ width:15px; height:15px }
  .yo-quien h2{ margin:0 0 8px; font:900 24px/1.1 Titulo }
  .yo-chips{ display:flex; flex-wrap:wrap; gap:6px }
  .yo-masc{ display:flex; align-items:center; gap:12px; width:100%; padding:8px 14px 8px 8px; margin-bottom:14px; border:0; border-radius:22px; background:linear-gradient(135deg, #3A1858, #2A1040); color:inherit; text-align:left; box-shadow:0 4px 0 #1c0b2c }
  .yo-masc.baja{ background:linear-gradient(135deg, #5a1630, #3a0f22); box-shadow:0 4px 0 #2a0816 }
  .yo-masc-dib{ flex:none; width:96px; height:96px; display:grid; place-items:center; color:var(--claro-txt) } .yo-masc-dib > .i{ width:40px; height:40px }
  .yo-masc-txt{ flex:1; display:grid; gap:2px } .yo-masc-txt b{ font:800 17px/1.2 Titulo } .yo-masc-txt small{ color:var(--suave); font-size:14px }
  .yo-masc.baja .yo-masc-txt small{ color:#FFB3C1 }
  .yo-rejilla{ display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px }
  .yo-bt{ display:grid; align-content:start; gap:10px; min-height:118px; padding:14px; border:0; border-radius:20px; background:var(--fondo-2); border:1px solid var(--borde); color:inherit; text-align:left; font:inherit }
  .yo-bt b{ display:block; font:800 16px/1.2 Titulo } .yo-bt small{ display:block; margin-top:3px; color:var(--tenue); font-size:13px; line-height:1.3 }
  .yo-ico{ width:40px; height:40px; display:grid; place-items:center; border-radius:13px; background:#AC27FF22; color:var(--claro-txt) } .yo-ico .i{ width:22px; height:22px }
  .yo-bt:active, .yo-masc:active, .yo-pj:active{ transform:scale(.97) }

  /* ══ tu personaje (vestidor.js): Avataaars de Pablo Stanley, libre para uso comercial ══ */
  .av.con-pj{ padding:0; overflow:hidden; background:var(--sup) !important; font-size:0 }
  .av.con-pj svg{ width:100%; height:100%; display:block }
  .perfil-cab .av{ cursor:pointer }
  .pj-grande{ width:min(200px, 52vw); aspect-ratio:1; margin:4px auto 14px; filter:drop-shadow(0 10px 18px #0007) } .pj-grande svg{ width:100%; height:100%; display:block }
  .pj-tabs{ display:grid; grid-template-columns:repeat(6, minmax(0, 1fr)); gap:4px; position:sticky; top:0; z-index:2; padding:6px 0; background:var(--fondo) }
  .pj-tabs button{ display:grid; justify-items:center; gap:3px; min-height:52px; padding:6px 2px; border:0; border-radius:14px; background:transparent; color:var(--suave); font:800 11.5px/1 Titulo }
  .pj-tabs button .i{ width:20px; height:20px }
  .pj-tabs button[aria-selected="true"]{ background:var(--sup); color:var(--claro-txt) }
  .pj-rejilla{ display:grid; grid-template-columns:repeat(auto-fill, minmax(78px, 1fr)); gap:8px }
  .pj-op{ position:relative; display:grid; justify-items:center; gap:4px; padding:6px 4px 8px; border-radius:16px; border:2px solid transparent; background:var(--fondo-2); color:inherit; font:inherit; min-height:44px }
  .pj-op[aria-pressed="true"]{ border-color:#AC27FF; background:#AC27FF1c }
  .pj-mini{ width:62px; height:62px; display:grid; place-items:center; color:var(--tenue) } .pj-mini svg{ width:100%; height:100% } .pj-mini .i{ width:24px; height:24px }
  .pj-op small{ font:700 11px/1.15 Texto; color:var(--suave); text-align:center }
  .pj-op.de-paga .pj-mini{ opacity:.72 }
  .pj-precio{ position:absolute; top:4px; right:4px; display:inline-flex; align-items:center; gap:2px; padding:2px 6px 2px 3px; border-radius:99px; background:#170A26e6; color:#fff; font:800 11px/1 Titulo; font-variant-numeric:tabular-nums }
  .pj-precio .cubo-ico{ width:13px; height:13px }
  .pj-colores{ display:flex; flex-wrap:wrap; gap:10px }
  .pj-color{ width:44px; height:44px; border-radius:50%; border:3px solid var(--fondo); background:var(--c); box-shadow:0 0 0 2px var(--borde) }
  .pj-color[aria-pressed="true"]{ box-shadow:0 0 0 3px #AC27FF }
  .pj-compra{ width:120px; height:120px } .pj-compra svg{ width:100%; height:100% }

  /* la racha con un amigo, junto a su nombre */
  .amigo .rj{ display:inline-flex; align-items:center; gap:2px; margin-left:6px; padding:1px 7px 1px 4px; border-radius:99px; background:rgba(255,178,122,.14); color:#FFB27A; font-size:13px; font-weight:800; vertical-align:2px; font-variant-numeric:tabular-nums }
  .amigo .rj .i{ width:14px; height:14px }
  /* ══ avisos (avisos.js) ══ */
  .ajuste.av-nota{ align-items:flex-start; line-height:1.45 }
  .ajuste.av-nota .i{ flex:none; margin-top:3px }
  .av-sub{ margin:8px 2px 4px; color:var(--tenue); font-size:14px; line-height:1.45 }
  /* ══ CARYMO: la marca ══ */
  .marca-carymo{ display:flex; flex-direction:column; align-items:center; gap:6px; margin:0 auto 6px }
  .marca-carymo b{ font:900 46px/1 Titulo; letter-spacing:.08em; color:#fff; padding-left:.08em;
    background:linear-gradient(100deg, #fff 30%, var(--claro-txt) 62%, #fff 90%); -webkit-background-clip:text; background-clip:text; color:transparent }
  .marca-carymo span{ font:800 13px/1 Titulo; letter-spacing:.32em; text-transform:uppercase; color:var(--claro-txt); padding-left:.32em }
  .vacio .lema{ color:var(--suave); margin:8px auto 34px; font-size:15px }
  .vacio h1{ font-size:28px }

  /* ══ la lección tipo historias: una idea por pantalla ══ */
  .segmentos{ flex:1; display:flex; gap:5px }
  .segmentos i{ flex:1; height:5px; border-radius:3px; background:#ffffff1f; overflow:hidden; position:relative }
  .segmentos i.ya{ background:var(--claro) }
  .segmentos i.ahora::after{ content:""; position:absolute; inset:0; background:var(--claro); transform-origin:left; animation:llena .5s ease-out forwards }
  @keyframes llena{ from{ transform:scaleX(0) } }
  .historia{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; min-height:calc(100dvh - 190px); padding-top:10px; cursor:pointer; user-select:none; -webkit-user-select:none }
  .historia .tema-hist{ font:800 12px/1.3 Titulo; letter-spacing:.14em; text-transform:uppercase; color:var(--claro-txt); margin-bottom:22px; max-width:300px }
  .aro-dib{ width:132px; height:132px; border-radius:50%; display:grid; place-items:center; margin-bottom:26px;
    background:radial-gradient(circle at 50% 40%, #3A1748, #23102F 70%); box-shadow:0 0 0 1px #ffffff14, 0 18px 40px -18px #AC27FF88 }
  .dib-idea{ width:70px; height:70px; fill:none; stroke:#fff; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; overflow:visible }
  .dib-idea > *{ stroke-dasharray:1; stroke-dashoffset:1; animation:trazo .55s cubic-bezier(.4,.1,.2,1) forwards; animation-delay:calc(.12s + var(--i, 0) * .16s) }
  @keyframes trazo{ to{ stroke-dashoffset:0 } }
  .historia h2{ font:900 27px/1.12 Titulo; margin:0 0 12px; max-width:340px }
  .historia .txt-hist{ font-size:20px; line-height:1.5; color:#E6DDEE; max-width:340px; text-wrap:balance }
  .historia .txt-hist b{ color:#fff; background:linear-gradient(transparent 62%, #AC27FF66 62%) }
  .historia.es-dato .aro-dib{ background:radial-gradient(circle at 50% 40%, #5A1530, #3A0D1F 70%); box-shadow:0 0 0 1px #ffffff14, 0 18px 40px -18px #7E1735 }
  .historia.es-dato h2{ color:#FFC1CF; font-size:15px; letter-spacing:.14em; text-transform:uppercase }
  .historia .acciones-mini{ justify-content:center; margin-top:26px }
  .entra-izq{ animation:entraIzq .4s cubic-bezier(.2,.8,.2,1) both }
  @keyframes entraIzq{ from{ opacity:0; transform:translateX(-24px) } to{ opacity:1; transform:none } }
  .historia.entra{ animation:entraDer .4s cubic-bezier(.2,.8,.2,1) both }
  @keyframes entraDer{ from{ opacity:0; transform:translateX(24px) } to{ opacity:1; transform:none } }
  .zona-atras{ position:fixed; left:0; top:70px; bottom:110px; width:22%; border:0; background:transparent; z-index:61; cursor:w-resize }

  /* ══ los ejercicios nuevos ══ */
  .tipo-ej{ font:800 12px/1 Titulo; letter-spacing:.14em; text-transform:uppercase; color:var(--claro-txt); margin:2px 0 12px }
  .instruccion{ font:800 21px/1.3 Titulo; margin:0 0 20px }
  /* escribir */
  .escribe{ display:block } .escribe span{ display:block; font-size:13px; color:var(--suave); margin-bottom:6px }
  .escribe input{ width:100%; min-height:58px; border-radius:16px; border:2px solid var(--borde); background:var(--fondo-2); color:#fff; padding:0 16px; font:700 20px/1 Texto }
  .escribe input:focus{ outline:0; border-color:var(--claro) }
  .escribe input.bien{ border-color:var(--claro); background:#2A1245 } .escribe input.mal{ border-color:var(--mal); background:#4A1222 }
  .nota-escribe{ font-size:13px; color:var(--tenue); margin-top:8px }
  /* conectar */
  .unir{ display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); gap:10px }
  .unir .col{ display:grid; gap:10px; align-content:start }
  .pieza-u{ min-height:56px; padding:8px 10px; border-radius:14px; border:2px solid var(--borde); background:var(--fondo-2); font:700 14.5px/1.25 Texto; box-shadow:0 3px 0 #0004; overflow-wrap:anywhere }
  .pieza-u.sel{ border-color:var(--claro); background:#2A1245 }
  .pieza-u.hecho{ border-color:var(--par); background:color-mix(in srgb, var(--par) 22%, var(--fondo-2)); color:#fff; box-shadow:none }
  /* imagen */
  /* diagramas: encontrar el error y armarlo */
  .flujo{ display:flex; flex-direction:column; align-items:stretch; gap:2px }
  .caja-f, .hueco-f{ min-height:52px; border-radius:14px; border:2px solid var(--borde); background:var(--fondo-2); padding:10px 14px; font:700 15.5px/1.3 Texto; text-align:center; position:relative }
  .caja-f.sel{ border-color:var(--claro); background:#2A1245 }
  .caja-f.mal-real{ border-color:var(--mal); background:#4A1222 } .caja-f.mal{ border-color:#ffffff55; opacity:.7 }
  .caja-f .corrige{ display:block; margin-top:6px; font:700 13px/1.3 Texto; color:#FFB3C2 }
  .flecha-f{ display:grid; place-items:center; color:var(--tenue); height:22px } .flecha-f .i{ width:18px; height:18px }
  .hueco-f{ border-style:dashed; display:grid; place-items:center; padding:6px; min-height:58px }
  .hueco-f .n-f{ position:absolute; left:10px; top:50%; transform:translateY(-50%); font:900 15px/1 Titulo; color:var(--tenue) }
  .hueco-f .ficha{ width:calc(100% - 26px); margin-left:20px }
  .hueco-f.bien{ border-color:var(--claro); border-style:solid } .hueco-f.mal{ border-color:var(--mal); border-style:solid }
  .fichas.sueltas{ margin-top:18px }
  /* clasificar */
  .grupos{ display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:10px; margin-bottom:6px }
  .grupo{ min-height:110px; border-radius:16px; border:2px dashed #ffffff30; background:#ffffff06; padding:10px; display:flex; flex-direction:column; gap:8px; text-align:left }
  .grupo b{ font:800 14px/1.2 Titulo; color:var(--claro-txt) }
  .grupo .dentro-g{ display:flex; flex-wrap:wrap; gap:6px } .grupo .dentro-g .ficha{ width:auto; min-height:38px; font-size:14px; padding:6px 10px }
  .ficha.sel{ border-color:var(--claro); background:#2A1245 } .ficha.bien{ border-color:var(--claro) } .ficha.mal{ border-color:var(--mal); background:#4A1222 }

  /* ══ EL COMBO: en cada acierto seguido ══ */
  .combo-vfx{ position:fixed; left:50%; top:40%; z-index:85; width:0; height:0; pointer-events:none }
  .muelle .combo-vfx{ position:relative; left:auto; top:auto; z-index:auto; width:auto; height:auto; min-width:120px; padding:2px 0; display:grid; place-items:center }
  .muelle .combo-vfx .combo-txt{ position:relative; font-size:26px; animation-name:comboMuelle } .muelle .combo-vfx.n2 .combo-txt{ font-size:30px } .muelle .combo-vfx.n3 .combo-txt{ font-size:34px }
  .muelle .combo-vfx .combo-txt small{ font-size:11px; margin-bottom:3px }
  .muelle .combo-vfx .onda, .muelle .combo-vfx .chispa{ left:50%; top:50% } .muelle .combo-vfx .onda{ animation-name:ondaMuelle }
  @keyframes ondaMuelle{ from{ transform:scale(.3); opacity:1 } to{ transform:scale(3); opacity:0 } }
  @keyframes comboMuelle{ 0%{ opacity:0; transform:scale(.3) rotate(-8deg) } 18%{ opacity:1; transform:scale(1.18) rotate(2deg) } 32%{ transform:none } 80%{ opacity:1 } 100%{ opacity:0 } }
  .combo-vfx .combo-txt{ position:absolute; left:0; top:0; transform:translate(-50%, -50%); white-space:nowrap; text-align:center; font:900 40px/1 Titulo; color:var(--c);
    text-shadow:0 0 18px var(--c), 0 3px 0 #0008; animation:comboPop 1.25s cubic-bezier(.2,.9,.3,1) forwards }
  .combo-vfx .combo-txt b{ font-size:1.25em } .combo-vfx .combo-txt small{ display:block; font:900 15px/1 Titulo; letter-spacing:.22em; color:#fff; margin-bottom:6px }
  .combo-vfx.n2 .combo-txt{ font-size:48px } .combo-vfx.n3 .combo-txt{ font-size:56px }
  .combo-vfx .onda{ position:absolute; left:0; top:0; width:40px; height:40px; margin:-20px 0 0 -20px; border-radius:50%; border:4px solid; animation:onda .7s ease-out forwards }
  .combo-vfx .chispa{ position:absolute; left:0; top:0; width:8px; height:8px; border-radius:2px }
  @keyframes comboPop{ 0%{ opacity:0; transform:translate(-50%, -50%) scale(.3) rotate(-8deg) } 18%{ opacity:1; transform:translate(-50%, -50%) scale(1.18) rotate(2deg) } 32%{ transform:translate(-50%, -50%) scale(1) rotate(0) } 75%{ opacity:1; transform:translate(-50%, -62%) scale(1) } 100%{ opacity:0; transform:translate(-50%, -90%) scale(.92) } }
  @keyframes onda{ from{ transform:scale(.3); opacity:1 } to{ transform:scale(7); opacity:0 } }

  /* ══ el pizarrón dentro de CARYMO ══ */
  #vPizarron{ position:fixed; left:0; right:0; top:var(--muelle, 0px); bottom:calc(64px + env(safe-area-inset-bottom)); max-width:none; padding:0 }
  #vPizarron iframe{ width:100%; height:100%; border:0; display:block; background:#100A18 }

  /* tarjetas */
  .mazo{ perspective:1200px; margin:20px 0 }
  .tarjeta{ position:relative; width:100%; min-height:300px; border:0; background:none; padding:0; transform-style:preserve-3d; transition:transform .55s cubic-bezier(.3,.9,.3,1) }
  .tarjeta.volteada{ transform:rotateY(180deg) }
  .tarjeta .cara{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; border-radius:24px; backface-visibility:hidden; -webkit-backface-visibility:hidden; text-align:center; box-shadow:0 8px 0 #0005 }
  .tarjeta .frente{ background:linear-gradient(160deg, var(--sup-2), var(--sup)); font:800 22px/1.3 Titulo }
  .tarjeta .reves{ background:linear-gradient(160deg, var(--vino-2), var(--vino)); transform:rotateY(180deg); font-size:17px; line-height:1.45; color:#fff }
  .tarjeta .reves b{ display:block; font:900 24px/1.2 Titulo; margin-bottom:10px }
  .tarjeta small{ position:absolute; bottom:16px; font-size:12px; color:#ffffffa0; font-family:Texto; font-weight:700 }

  /* pizarra (Explica dentro) */
  .capa.pizarra iframe{ flex:1; width:100%; border:0; background:#100A18 }
  /* la cabecera de la clase, doblada en una flechita para dejarle la pantalla al pizarrón */
  .capa.pizarra .arriba{ transition:margin .3s cubic-bezier(.2,.8,.2,1), opacity .2s }
  .capa.pizarra.plegada .arriba{ display:none }
  .piz-abrir{ display:none; position:absolute; z-index:5; left:10px; top:calc(10px + env(safe-area-inset-top)); width:40px; height:40px; border:0; border-radius:50%; place-items:center; background:#1E1428d9; color:var(--hueso); backdrop-filter:blur(8px); box-shadow:0 4px 14px #0005 }
  .piz-abrir .i{ width:20px; height:20px }
  .capa.pizarra.plegada .piz-abrir{ display:grid }

  /* hojas (menús de abajo) */
  .velo{ position:fixed; inset:0; z-index:90; background:#0009; animation:aparece .2s }
  @keyframes aparece{ from{ opacity:0 } }
  .hoja{ position:fixed; left:0; right:0; bottom:0; z-index:91; max-height:min(85dvh, calc(100dvh - var(--muelle, 0px) - 12px)); overflow-y:auto; padding:10px 16px calc(18px + env(safe-area-inset-bottom)); border-radius:24px 24px 0 0; background:var(--fondo-2); animation:sube .3s cubic-bezier(.2,.9,.3,1) }
  .hoja .dentro{ max-width:560px; margin:0 auto }
  .hoja .agarre{ width:46px; height:5px; border-radius:3px; background:#ffffff59; margin:0 auto 14px }
  .hoja h3{ font:800 18px/1.2 Titulo; text-align:center; margin-bottom:12px }
  .menu{ display:grid; gap:4px }

  /* avisos que se deslizan («¡Subiste de grado!») */

  /* celebraciones grandes (grado 10, racha congelada) */

  @keyframes expande{ to{ transform:translate(-50%, -50%) scale(120) } }

  /* ranking */

  /* la liga (ligas.js): cabecera chica para que la tabla se vea luego luego */

  .liga-txt small{ font:800 12px/1 Titulo; letter-spacing:.14em; text-transform:uppercase; color:var(--suave) }
  .liga-txt h1{ font:900 28px/1.05 Titulo; margin:2px 0 4px }
  .liga-txt p{ display:flex; align-items:flex-start; gap:6px; color:var(--suave); font-size:14px; line-height:1.3; margin:0 }

  .liga-txt p .i{ width:15px; height:15px }

  .rank-frase{ margin:8px 0 10px; padding:10px 14px; border-radius:14px; background:var(--fondo-2); font-weight:700; line-height:1.35; overflow-wrap:anywhere }
  .rank-tabs{ display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:6px; padding:4px; border-radius:16px; background:var(--fondo-2); margin-bottom:10px }
  .rank-tabs button{ min-height:42px; border:0; border-radius:12px; background:transparent; color:var(--suave); font-weight:800; font-family:inherit; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }

  .zona-rank{ display:flex; align-items:center; justify-content:center; gap:6px; padding:4px 0; font:800 12px/1.2 Titulo; letter-spacing:.06em; text-transform:uppercase; text-align:center }

  /* ── el nombre con estilo y las insignias (nombre.js; Carlos, 14 nov) ── */

  .nom-txt{ display:inline-flex; align-items:center; gap:4px; max-width:100% }
  /* Sandra, la artista: arcoíris en letra dibujada, que corre despacito */
  .nom-arcoiris{ font-family:Dibujada, Texto, cursive; font-weight:700; font-size:1.3em; line-height:1; letter-spacing:.01em; padding:0 2px;
    background:linear-gradient(90deg, #FF5A5F, #FFB13B, #F5E04A, #4CD97B, #3BA7FF, #9B6BFF, #FF5A5F) 0 0 / 200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:nom-arco 6s linear infinite; filter:drop-shadow(0 1px 0 #170A26) }

  /* Carlos: los colores de la casa con la M cubo */

    font-weight:800; animation:nom-perla 5s ease-in-out infinite alternate; filter:drop-shadow(0 0 5px #ffffff55) }
  @keyframes nom-perla{ to{ background-position:-120% 0 } }
  .nom-corazones{ display:inline-flex; align-items:center; gap:4px; max-width:100% } .nom-corazones .nom-perla{ min-width:0; overflow:hidden; text-overflow:ellipsis }
  .nom-corazon{ width:.95em; height:.95em; flex:none; animation:nom-late 1.6s ease-in-out infinite } .nom-corazon + .nom-perla + .nom-corazon{ animation-delay:.25s }
  @keyframes nom-late{ 0%, 60%, 100%{ transform:scale(1) } 20%{ transform:scale(1.22) } 35%{ transform:scale(.96) } }
  .ins-inspiracion{ color:#FFB3C8 } .ins-inspiracion .i{ color:#F0477A; fill:#F0477A }
  @media (prefers-reduced-motion: reduce){ .nom-arcoiris, .nom-perla, .nom-corazon{ animation:none } }
  .insignias{ display:inline-flex; flex-wrap:wrap; gap:4px; flex:none }

    background:#AC27FF22; color:var(--claro-txt); border:1px solid #AC27FF55 }

  .insignia.ins-artista{ background:#F5E04A1F; color:#F5E04A; border-color:#F5E04A55 }

  /* ── el perfil de otra persona (perfil-otro.js) ── */
  .fila-rank[role="button"]{ cursor:pointer; transition:transform .15s }
  .fila-rank[role="button"]:active{ transform:scale(.98) }
  .po-carga{ display:flex; align-items:center; gap:8px; color:var(--suave); padding:20px 0 }

  .hoja h5{ display:flex; align-items:center; gap:6px; margin:16px 0 8px; font:800 15px Titulo, sans-serif }

  .po-mascotas{ display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:8px }

  .fila-rank .nom small{ color:var(--suave); font-weight:600 }
  .fila-rank:has(.mini-liga){ grid-template-columns:minmax(30px, max-content) 40px minmax(0, 1fr) auto auto }

  @keyframes ligaCae{ 0%{ transform:translateY(-60px); opacity:0 } 70%{ transform:translateY(8px) } 100%{ transform:none; opacity:1 } }
  .pastilla.liga{ border:0; font:inherit; color:inherit; cursor:pointer; gap:4px }

  .vitrina{ display:grid; grid-template-columns:repeat(auto-fill, minmax(92px, 1fr)); gap:10px }
  .vitrina .vt{ display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 6px; border-radius:18px; background:var(--fondo-2); text-align:center; min-width:0 }

  .ranking{ display:grid; gap:8px }

  /* horario */
  .horario{ display:grid; gap:10px }
  .dia-h h4{ font:800 15px/1 Titulo; margin:6px 0 8px } .dia-h .clase-h{ grid-template-columns:52px minmax(0, 1fr); margin-bottom:6px }   /* la vista previa de la foto del horario */
  /* cada día plegado (Carlos, 13 nov: «se ve espantoso y atascadísimo»); hoy viene abierto */
  .hz-dia{ border-radius:16px; background:var(--fondo-2); border:1px solid var(--borde); overflow:hidden }
  .hz-dia.hoy{ border-color:color-mix(in srgb, var(--claro) 45%, transparent) }

  .clase-h .hr{ font:800 14px/1.15 Titulo; color:var(--hueso) } .clase-h .hr small{ display:block; font:700 12px/1.2 Texto; color:var(--tenue) }
  .clase-h b{ min-width:0; overflow-wrap:anywhere }
  .clase-h.ahora{ background:color-mix(in srgb, var(--vino) 55%, var(--sup)) } .clase-h.pasada{ opacity:.5 }
  .clase-h button{ display:none; border:0; background:none; color:var(--tenue); width:44px; height:44px; place-items:center; margin:-8px -6px -8px 0 }
  .horario.editando .clase-h button{ display:grid }
  .hz-chip{ font:800 11px/1 Titulo; letter-spacing:.06em; text-transform:uppercase; padding:5px 8px; border-radius:99px; background:var(--vino); color:#fff }
  .hz-chip.sig{ background:transparent; color:var(--claro-txt); box-shadow:inset 0 0 0 1.5px currentColor }
  .hz-cab{ display:flex; align-items:center; justify-content:space-between; gap:10px }

  .hz-sig{ display:flex; align-items:center; gap:6px; font-size:14px; color:#fff } .hz-sig .i{ width:16px; height:16px }
  .ahora-banner{ padding:16px; border-radius:18px; background:var(--vino); margin-bottom:16px }
  .ahora-banner small{ font-size:12px; letter-spacing:.08em; text-transform:uppercase; opacity:.8 } .ahora-banner b{ display:block; font:800 20px/1.2 Titulo }
  /* la línea de cada examen: de hoy a la fecha, un puntito por día */
  .cuentas-ex{ display:grid; gap:10px; margin-bottom:6px }
  .cuenta-ex{ padding:14px 16px 12px; border-radius:18px; background:var(--fondo-2); border:1px solid var(--borde) }
  .cuenta-ex.urge{ border-color:color-mix(in srgb, var(--c) 70%, transparent); background:color-mix(in srgb, var(--c) 14%, var(--fondo-2)) }
  .cx-cab{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:14px } .cx-cab > b{ font:800 16px/1.2 Titulo; min-width:0 }
  .cx-cab span{ flex:none; color:var(--suave); font-size:14px } .cx-cab span b{ color:var(--hueso); font:900 18px/1 Titulo; font-variant-numeric:tabular-nums }
  .cx-linea{ position:relative; height:28px; margin:0 14px 0 8px }
  .cx-riel{ position:absolute; left:0; right:0; top:50%; height:4px; margin-top:-2px; border-radius:2px; background:linear-gradient(90deg, var(--c), color-mix(in srgb, var(--c) 35%, #ffffff22)) }
  .cx-dia{ position:absolute; top:50%; width:6px; height:6px; margin:-3px 0 0 -3px; border-radius:50%; background:#ffffff55 }
  .cx-hoy{ position:absolute; left:0; top:50%; width:16px; height:16px; margin:-8px 0 0 -8px; border-radius:50%; background:var(--hueso); box-shadow:0 0 0 4px color-mix(in srgb, var(--c) 45%, transparent); animation:cxLate 1.8s ease-in-out infinite }
  @keyframes cxLate{ 50%{ box-shadow:0 0 0 8px color-mix(in srgb, var(--c) 18%, transparent) } }
  .cx-meta{ position:absolute; right:-14px; top:50%; width:28px; height:28px; margin-top:-14px; display:grid; place-items:center; border-radius:50%; background:var(--c); color:#fff } .cx-meta .i{ width:16px; height:16px }
  .cx-pie{ display:flex; justify-content:space-between; gap:10px; margin-top:8px; color:var(--tenue); font-size:12.5px }

  @media (prefers-reduced-motion:reduce){ .cx-hoy{ animation:none } }
  .examenes li{ list-style:none; display:flex; gap:12px; align-items:center; padding:12px; border-radius:14px; background:var(--fondo-2); margin-bottom:8px }

  /* buscar */
  .buscador{ display:flex; gap:8px; align-items:center; padding:0 14px; min-height:50px; border-radius:14px; background:var(--fondo-2); border:2px solid var(--borde); margin-bottom:18px }

  .perfil-cab{ display:flex; gap:16px; align-items:center; margin:calc(18px + env(safe-area-inset-top)) 0 18px }
  .perfil-cab .av{ width:76px; height:76px; border-radius:50%; display:grid; place-items:center; background:var(--vino); font:900 32px/1 Titulo; color:#fff; flex:none; box-shadow:0 0 0 4px var(--fondo), 0 0 0 6px var(--claro) }
  .perfil-cab h2{ font:900 24px/1.1 Titulo } .perfil-cab small{ color:var(--suave) }
  .stats{ display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px; margin-bottom:22px }
  .stat{ padding:14px; border-radius:16px; background:var(--fondo-2); display:flex; gap:12px; align-items:center }
  .stat .i{ width:26px; height:26px } .stat b{ display:block; font:900 20px/1 Titulo; white-space:nowrap } .stat small{ color:var(--suave); font-size:13px }

  .nota-ida{ position:relative; margin:4px 0 10px; padding:16px 18px 12px; border-radius:6px; background:#F4EEE6; color:#2A1B3D; transform:rotate(-1.2deg); box-shadow:0 0 0 1px #0000001a, 0 8px 18px #00000040; text-align:left; max-width:100% }
  .nota-ida .nota-txt{ margin:0; font:700 19px/1.35 Dibujada, Texto; overflow-wrap:anywhere } .nota-ida .nota-firma{ margin:8px 0 0; text-align:right; font:700 18px/1 Dibujada, Texto; color:#7E1735 }
  .nota-dato{ margin:0 0 10px; color:var(--suave); font-size:13.5px; line-height:1.4 }
  .nota-bts{ display:grid; gap:8px } .nota-bts .bt{ width:100%; white-space:nowrap }
  .nota-bts .bt svg:first-child{ width:18px; height:18px } .nota-bts .bt[aria-disabled="true"]{ opacity:.6 }
  .cielo-carta{ overflow:auto }
  .adopta-g{ display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:8px }
  .adopta, .prenda{ display:grid; justify-items:center; gap:3px; padding:8px 4px 10px; border-radius:18px; border:2px solid #ffffff1a; background:#ffffff0d; color:inherit; font:inherit; min-width:0; transition:transform .2s cubic-bezier(.3,1.6,.4,1), border-color .2s }
  .adopta:active, .prenda:active{ transform:scale(.93) } .adopta.elegida, .prenda.puesta{ border-color:#AC27FF; background:#AC27FF26 } .adopta[disabled]{ opacity:.5 }
  .adopta .ad-dib{ display:grid; place-items:end center; height:72px; pointer-events:none } .adopta b, .prenda b{ font:800 13px/1.15 Titulo; text-align:center } .adopta small, .prenda small{ display:inline-flex; align-items:center; gap:3px; font-size:12px; color:var(--tenue) }
  .vestir-vista{ display:grid; place-items:end center; height:150px; margin:-4px 0 6px; border-radius:20px; background:radial-gradient(circle at 50% 80%, #AC27FF33, transparent 65%) }
  .pestanas-v{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:10px } .pestanas-v button{ display:flex; align-items:center; justify-content:center; gap:6px; min-height:44px; border-radius:14px; border:0; background:#ffffff0d; color:inherit; font:800 14px/1 Titulo }
  .pestanas-v button[aria-selected="true"]{ background:#7E1735; color:#fff } .pestanas-v .i{ width:16px; height:16px }
  .vestir-g{ display:grid; grid-template-columns:repeat(auto-fill, minmax(84px, 1fr)); gap:8px; max-height:44vh; overflow-y:auto }
  .prenda .pr-dib{ display:grid; place-items:end center; height:54px; pointer-events:none } .prenda.sin .pr-dib{ opacity:.7 }
  .fiesta-crece .crece-masc{ height:200px; display:grid; place-items:end center; margin-bottom:8px }
  .fiesta-crece .crece-luz{ animation:creceLuz 1s ease-out both } @keyframes creceLuz{ 0%{ filter:brightness(1) } 45%{ filter:brightness(3) drop-shadow(0 0 30px #FFE28A) } 100%{ filter:brightness(1) } }
  @media (prefers-reduced-motion: reduce){ .fiesta-crece .crece-luz{ animation:none } }
  /* las 3 voces de la mascota */
  .voces-masc{ display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:8px; margin-bottom:10px }
  .voces-masc button{ display:grid; justify-items:center; gap:4px; padding:10px 6px; min-height:64px; border-radius:16px; border:2px solid #ffffff1a; background:#ffffff0d; color:inherit; font:800 14px/1.2 Titulo; text-align:center }
  .voces-masc button[aria-checked="true"]{ border-color:var(--claro, #AC27FF); background:#AC27FF22 }
  .voces-masc .i{ width:20px; height:20px; color:var(--claro-txt) } .voces-masc small{ display:block; font:700 11.5px/1.25 Texto; color:var(--tenue); margin-top:2px }
  @media (prefers-reduced-motion:reduce){ *, *::before, *::after{ animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important } }
</style>
