<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<title>CARYMO · estudiar ya no da flojera</title>
<!-- ANUNCIO DE CARYMO · ~32 s · 9:16 (Carlos, 13 nov: «haz un anuncio publicitario para ir publicándolo»).
     El teléfono enseña la app DE VERDAD, grabada con grabar.mjs (rec/<toma>): crear el plan, el pizarrón
     que se dibuja solo, la lección como juego y el modo Jefe con amigos. Los contenidos son de ejemplo.
     Voz: Piper (es_MX, local) porque Chris no tiene saldo; se rehace con Chris cambiando guion.json.
     Música: «Hyperfun», Kevin MacLeod (incompetech.com), CC BY 4.0: el crédito va en la descripción del post.
       python3 -m http.server 8765        (en la raíz del repo)
       node marca/anuncios/voces.mjs carymo/anuncio
       node herramientas/video/armar.mjs carymo/anuncio/anuncio.html carymo/anuncio/salida/carymo.mp4 -->
<style>
  @font-face{ font-family:T; src:url(../../sala/letra/montserrat.woff2) format("woff2"); font-weight:100 900; font-display:block }
  @font-face{ font-family:N; src:url(../../sala/letra/nunito-700.woff2) format("woff2"); font-weight:700; font-display:block }
  :root{ --oscuro:#170A26; --oscuro2:#22103A; --vino:#7E1735; --claro:#AC27FF; --claro-txt:#C77DFF; --hueso:#F1ECF4 }
  *{ box-sizing:border-box; margin:0 }
  html, body{ width:1080px; height:1920px; overflow:hidden; background:var(--oscuro); color:var(--hueso); font-family:N, sans-serif }
  .capa{ position:absolute; inset:0; overflow:hidden }
  #fondo{ background:radial-gradient(70% 50% at 50% 58%, #3a1460 0%, var(--oscuro) 70%) }
  .anillo{ position:absolute; border-radius:50%; border:2px solid rgba(172,39,255,.18) }
  /* el titular: una frase de la voz, con la parte importante en morado claro */
  #tit{ position:absolute; left:70px; right:70px; top:120px; height:290px; display:flex; align-items:center; justify-content:center; text-align:center;
    font:800 82px/1.02 T; letter-spacing:-.03em }
  #tit em{ font-style:normal; color:var(--claro-txt) }
  #tit .pal{ display:inline-block; will-change:transform }
  /* el teléfono */
  #tel{ position:absolute; left:50%; top:440px; width:640px; height:1344px; margin-left:-320px }
  #tel .caja{ position:absolute; inset:0; border-radius:92px; background:linear-gradient(145deg,#3d3150,#140c1f 40%,#2b2038); padding:20px;
    box-shadow:0 0 0 2px #4b3d5c, 0 60px 120px -30px rgba(0,0,0,.9), 0 0 160px -20px rgba(172,39,255,.5) }
  #tel .pantalla{ position:relative; width:600px; height:1299px; border-radius:72px; overflow:hidden; background:#000 }
  #tel .pantalla img{ width:100%; height:100%; display:block }
  #tel .isla{ position:absolute; top:22px; left:50%; width:170px; height:48px; margin-left:-85px; border-radius:30px; background:#000; z-index:2 }
  #tel .brillo{ position:absolute; inset:20px; border-radius:72px; background:linear-gradient(115deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,0) 32%); pointer-events:none }
  /* el gancho */
  #gancho{ background:var(--oscuro) }
  #gancho .uno{ position:absolute; left:60px; right:60px; top:560px; text-align:center; font:900 168px/.95 T; letter-spacing:-.04em }
  #gancho .dos{ position:absolute; left:70px; right:70px; top:980px; text-align:center; font:800 76px/1.08 T; letter-spacing:-.025em; color:var(--claro-txt) }
  #cuaderno{ position:absolute; left:50%; top:1300px; width:260px; height:260px; margin-left:-130px; color:var(--hueso) }
  #tache{ position:absolute; left:50%; top:1290px; width:300px; height:300px; margin-left:-150px }
  /* sin internet */
  #sinred{ background:radial-gradient(70% 50% at 50% 50%, #3a1460, var(--oscuro) 70%) }
  #sinred .ico{ position:absolute; left:50%; top:620px; width:360px; height:360px; margin-left:-180px; color:var(--claro-txt) }
  #sinred .txt{ position:absolute; left:60px; right:60px; top:1080px; text-align:center; font:900 120px/.95 T; letter-spacing:-.04em }
  #sinred .txt em{ font-style:normal; color:var(--claro-txt) }
  /* el cierre */
  #cierre{ background:radial-gradient(80% 55% at 50% 40%, #4a1870 0%, var(--oscuro) 72%) }
  #logo{ position:absolute; left:50%; top:430px; width:760px; height:760px; margin-left:-380px; object-fit:contain }
  #cierre .lema{ position:absolute; left:60px; right:60px; top:1180px; text-align:center; font:900 104px/.98 T; letter-spacing:-.04em }
  #cierre .lema em{ font-style:normal; color:var(--claro-txt) }
  #cierre .boton{ position:absolute; left:50%; top:1470px; transform:translateX(-50%); padding:30px 58px; border-radius:99px; background:var(--vino); color:#fff;
    font:800 44px/1 T; white-space:nowrap; box-shadow:0 20px 50px -14px rgba(126,23,53,.9) }
  #cierre .chico{ position:absolute; left:60px; right:60px; top:1600px; text-align:center; font:700 32px/1.4 N; color:#c9b9d8 }
  #flash{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none }
  svg.i{ fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round }
</style>
</head>
<body>
<div class="capa" id="fondo">
  <div class="anillo" id="an1" style="left:-200px;top:300px;width:700px;height:700px"></div>
  <div class="anillo" id="an2" style="right:-260px;top:1200px;width:820px;height:820px"></div>
  <div id="tit"></div>
  <div id="tel"><div class="caja"><div class="pantalla"><div class="isla"></div><img id="pant" alt=""></div><div class="brillo"></div></div></div>
</div>
<div class="capa" id="gancho">
  <div class="uno" id="g1">¿Examen<br>mañana?</div>
  <div class="dos" id="g2">…y no has abierto ni el cuaderno</div>
  <svg class="i" id="cuaderno" viewBox="0 0 24 24"><path d="M2 6h4"/><path d="M2 10h4"/><path d="M2 14h4"/><path d="M2 18h4"/><rect width="16" height="20" x="4" y="2" rx="2"/><path d="M9.5 8h5"/><path d="M9.5 12H16"/><path d="M9.5 16H14"/></svg>
  <svg id="tache" viewBox="0 0 100 100"><path id="tache1" d="M14 14 L86 86" stroke="#E2506A" stroke-width="9" stroke-linecap="round" fill="none"/><path id="tache2" d="M86 14 L14 86" stroke="#E2506A" stroke-width="9" stroke-linecap="round" fill="none"/></svg>
</div>
<div class="capa" id="sinred">
  <svg class="i ico" viewBox="0 0 24 24"><path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/></svg>
  <div class="txt">Funciona<br><em>sin internet</em></div>
</div>
<div class="capa" id="cierre">
  <img id="logo" src="../marca/logo-1024.png" alt="CARYMO">
  <div class="lema">Estudiar ya no<br><em>da flojera</em></div>
  <div class="boton">Pruébalo · link en la bio</div>
  <div class="chico">Hecho por Grupo Mazi</div>
</div>
<div id="flash"></div>
<script>
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, a, b) => cl((t - a) / (b - a));
const oc = (x) => 1 - Math.pow(1 - x, 3), ob = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const $ = (s) => document.querySelector(s), vis = (el, si) => { el.style.display = si ? '' : 'none'; };

/* ── la voz: cada renglón donde cae, y su texto para el titular ── */
const EN = { '01': 0.25, '02': 3.55, '03': 7.15, '04': 9.95, '05': 13.45, '06': 18.35, '07': 23.25, '08': 25.75 };
const DUR = 30.6;
const sonidos = Object.entries(EN).map(([id, t]) => ['voz/' + id + '.mp3', t, 1, 'voz']);
const FX = '../../herramientas/video/efectos/';
for(const t of [3.4, 9.8, 13.3, 18.2, 23.1, 25.6]) sonidos.push([FX + 'whoosh.wav', t - .12, .55, 'fx']);
sonidos.push([FX + 'golpe.wav', 1.65, .7, 'fx'], [FX + 'golpe.wav', 1.95, .7, 'fx'], [FX + 'subida.wav', 25.6, .6, 'fx'], [FX + 'ding.wav', 22.2, .7, 'fx']);
window.VIDEO = { w: 1080, h: 1920, fps: 60, dur: DUR, musica: { archivo: '/tmp/claude-0/musica/Hyperfun.mp3', desde: 0, vol: .38, fin: 1.8 }, sonidos };

/* ── qué tramo de qué grabación va en cada momento: [desde, hasta, toma, rec desde, rec hasta] ── */
let REC = {}, tramos = [];
const TIT = [ [3.4, 7.1, 'Dile de qué es<br><em>tu examen</em>'], [7.1, 9.8, 'Te arma tu plan,<br><em>tema por tema</em>'], [9.8, 13.3, 'Un pizarrón que<br><em>se dibuja solo</em>'],
  [13.3, 18.2, 'Practicas<br><em>como juego</em>'], [18.2, 23.1, 'Con tus amigos,<br><em>vencen al jefe</em>'] ];
async function cargar(){
  for(const t of ['crear', 'pizarron', 'leccion', 'juntos']) REC[t] = await (await fetch('rec/' + t + '.json')).json();
  const m = (t) => REC[t].marcas;
  tramos = [
    [3.4, 7.1, 'crear', m('crear').materias - .2, m('crear').preparando + .4],
    [7.1, 9.8, 'crear', m('crear').camino - .3, m('crear').fin],
    [9.8, 13.3, 'pizarron', m('pizarron').paso1 + .1, m('pizarron').paso4 - .4],
    [13.3, 18.2, 'leccion', m('leccion').preguntas - .6, m('leccion').fin - .4],
    [18.2, 23.1, 'juntos', m('juntos').camino + .4, m('juntos').fin],
  ];
}
const ultimo = { src: '' };
async function cuadro(toma, seg){
  const i = cl(Math.round(seg * 60), 0, REC[toma].cuadros - 1), src = `rec/${toma}/${String(i).padStart(5, '0')}.jpg`;
  if(ultimo.src === src) return; ultimo.src = src; $('#pant').src = src; try{ await $('#pant').decode(); }catch{}
}
/* el titular entra palabra por palabra, desde abajo */
let titActual = '';
function titular(html, t0, t){
  const el = $('#tit');
  /* cada palabra en su cajita (el titular es flex: las cajitas van dentro de un div para que no se coma los espacios) */
  if(titActual !== html){ titActual = html;
    el.innerHTML = '<div>' + html.split('<br>').map((r) => { const out = []; let morado = false;
      for(const tok of r.split(/(<em>|<\/em>|\s+)/)){ if(tok === '<em>'){ morado = true; continue; } if(tok === '</em>'){ morado = false; continue; } if(!tok) continue;
        out.push(/^\s+$/.test(tok) ? ' ' : `<span class="pal"${morado ? ' style="color:var(--claro-txt)"' : ''}>${tok}</span>`); }
      return out.join(''); }).join('<br>') + '</div>'; }
  [...el.querySelectorAll('.pal')].forEach((s, i) => { const k = ob(p(t, t0 + i * .06, t0 + i * .06 + .38)); s.style.transform = `translateY(${(1 - k) * 80}px)`; s.style.opacity = p(t, t0 + i * .06, t0 + i * .06 + .2); });
}

window.listo = (async () => { await document.fonts.ready; await cargar(); await new Promise((r) => { const i = $('#logo'); if(i.complete) r(); else i.onload = r; }); })();

window.pintar = async (t) => {
  /* gancho */
  const enG = t < 3.5; vis($('#gancho'), enG);
  if(enG){
    const k1 = ob(p(t, .1, .55)); $('#g1').style.transform = `scale(${.6 + .4 * k1}) rotate(${(1 - k1) * -6}deg)`; $('#g1').style.opacity = p(t, .1, .3);
    const k2 = oc(p(t, 1.0, 1.4)); $('#g2').style.transform = `translateY(${(1 - k2) * 60}px)`; $('#g2').style.opacity = k2;
    const k3 = ob(p(t, 1.35, 1.75)); $('#cuaderno').style.transform = `scale(${k3}) rotate(${Math.sin(t * 18) * 4 * p(t, 1.7, 2.2)}deg)`;
    $('#tache1').style.strokeDasharray = 102; $('#tache1').style.strokeDashoffset = 102 * (1 - p(t, 1.65, 1.85));
    $('#tache2').style.strokeDasharray = 102; $('#tache2').style.strokeDashoffset = 102 * (1 - p(t, 1.95, 2.15));
    /* un temblorcito de pánico cuando cae el tache */
    const sacude = p(t, 1.65, 2.4) > 0 && p(t, 1.65, 2.4) < 1 ? Math.sin(t * 70) * 10 * (1 - p(t, 1.65, 2.4)) : 0;
    $('#gancho').style.transform = `translateX(${sacude}px)`;
    $('#gancho').style.opacity = 1 - p(t, 3.3, 3.5);
  }
  /* el teléfono con la app */
  const tr = tramos.find(([a, b]) => t >= a && t < b);
  const enTel = t >= 3.4 && t < 23.2; vis($('#fondo'), enTel || t >= 23.1);
  if(tr){
    const [a, b, toma, r0, r1] = tr; await cuadro(toma, r0 + (r1 - r0) * ((t - a) / (b - a)));
    const ent = ob(p(t, 3.4, 3.9));
    $('#tel').style.transform = `translateY(${(1 - ent) * 900}px) rotate(${(1 - ent) * 8}deg)`;
    /* cada corte, un pequeño «salto» del teléfono */
    const k = p(t, a, a + .3); $('#tel').style.scale = String(1 + Math.sin(k * Math.PI) * .025);
  }
  const ti = TIT.find(([a, b]) => t >= a && t < b);
  if(ti) titular(ti[2], ti[0], t); else if(t >= 23.1) $('#tit').innerHTML = '';
  $('#an1').style.transform = `rotate(${t * 8}deg) scale(${1 + Math.sin(t * 1.3) * .05})`; $('#an2').style.transform = `scale(${1 + Math.sin(t * 1.1 + 1) * .06})`;
  /* sin internet */
  const enS = t >= 23.1 && t < 25.8; vis($('#sinred'), enS);
  if(enS){ const k = ob(p(t, 23.15, 23.6)); $('#sinred .ico').style.transform = `scale(${k}) rotate(${(1 - k) * -20}deg)`; const k2 = oc(p(t, 23.35, 23.75));
    $('#sinred .txt').style.transform = `translateY(${(1 - k2) * 70}px)`; $('#sinred .txt').style.opacity = k2; $('#sinred').style.opacity = 1 - p(t, 25.6, 25.8); }
  /* cierre */
  const enC = t >= 25.6; vis($('#cierre'), enC);
  if(enC){
    const k = ob(p(t, 25.65, 26.25)); $('#logo').style.transform = `scale(${.55 + .45 * k}) rotate(${(1 - k) * -10}deg)`; $('#logo').style.opacity = p(t, 25.65, 25.85);
    const k2 = oc(p(t, 26.6, 27.0)); $('#cierre .lema').style.transform = `translateY(${(1 - k2) * 60}px)`; $('#cierre .lema').style.opacity = k2;
    const k3 = ob(p(t, 27.4, 27.8)); $('#cierre .boton').style.transform = `translateX(-50%) scale(${k3 * (1 + Math.sin(Math.max(0, t - 28) * 5) * .03 * (t > 28 ? 1 : 0))})`;
    $('#cierre .chico').style.opacity = p(t, 27.9, 28.3);
  }
  $('#flash').style.opacity = Math.max(0, 1 - Math.abs(t - 25.62) / .12) * .55;
};
</script>
</body>
</html>
