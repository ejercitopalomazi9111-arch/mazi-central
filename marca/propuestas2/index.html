<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grupo Mazi · 50 logos, ronda 2</title>
<!--
  RONDA 2 DE LOGOS (24 de octubre de 2026). De las 200 de la ronda 1 no sirvió ninguna. Carlos:
  «hay que cambiar completamente el tiro… podemos quedarnos algún elemento, sea la pluma o una
  media aureola rota y un cuerno con líneas tipo corrupción pero similares a las de una placa
  madre; súper sencillos, incluso monocromáticos; algunos con un ala, la cola de un ave; algo
  que recuerde ligeramente a las vibras Iron Man; súper ligero, nada aglomerado, limpieza visual;
  50 logos que no se parezcan NADA entre sí, ni en tipografía ni en acomodo ni en elementos».

  Así que aquí: 50 letras distintas (ninguna repetida, ninguna de la ronda 1), 50 acomodos y un
  símbolo distinto por logo, dibujado a mano en vector (trazos, no imágenes) y de un solo color.
  ?hoja=1 trae del 01 al 25 y ?hoja=2 del 26 al 50. Se arma con armar.mjs.
  Todas las letras son de Google Fonts con licencia OFL: se pueden usar en un logo comercial.
-->
<style>
:root{ --vacio:#100A18; --violeta:#AC27FF; --lila:#C878FF; --hueso:#EAE5E3; --gris:#A79CB4; --linea:#2C2238 }
*{ box-sizing:border-box; margin:0 }
html, body{ background:var(--vacio); color:var(--hueso); font:400 16px/1.4 system-ui, sans-serif }
.hoja{ width:2120px; padding:56px 60px 48px }
.cab{ display:flex; align-items:end; gap:24px; margin-bottom:32px }
.cab h1{ font:800 44px/1.05 system-ui; letter-spacing:-.02em }
.cab p{ margin-top:6px; color:var(--gris); font-size:21px; max-width:80ch }
.cab .rango{ margin-left:auto; text-align:right; color:var(--gris); font-size:19px; white-space:nowrap }
.cab .rango b{ display:block; color:var(--hueso); font-size:30px }
.rej{ display:grid; grid-template-columns:repeat(5, 1fr); gap:16px }
.ficha{ position:relative; height:340px; border-radius:22px; overflow:hidden; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.07) }
.lienzo{ position:absolute; inset:34px 34px 58px; display:grid; place-items:center }
.logo{ white-space:nowrap; line-height:1 }
.num{ position:absolute; left:18px; bottom:15px; font:700 18px/1 ui-monospace, Menlo, monospace; opacity:.6 }
.fuente{ position:absolute; right:18px; bottom:16px; font:500 14px/1 system-ui; opacity:.5 }
.pie{ margin-top:26px; display:flex; justify-content:space-between; color:#6E6380; font-size:17px }
svg{ display:block; overflow:visible }
</style>
</head>
