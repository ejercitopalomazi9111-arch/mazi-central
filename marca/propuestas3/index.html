<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grupo Mazi · ronda 3 de logos</title>
<!--
  RONDA 3 DE LOGOS (24 de octubre de 2026). Carlos: «haz uno que sea la mitad una aureola rota y la
  otra mitad un cuerno, y haz otros 100 misma rúbrica, solo que mete ahora algunos que recuerden al
  personaje Temmie de Undertale y algunos que recuerden a Detroit: Become Human… e investiga a
  nuestra competencia para ver qué hay de logos en cada rubro».

  ?hoja=0  la principal (mitad aureola rota, mitad cuerno) con sus versiones y su ícono
  ?hoja=1…4  los 100, de 25 en 25, agrupados por familia (aureola, cuerno, pluma, ala, cola,
             circuito, Iron Man, Detroit, Temmie y otros)
  ?hoja=5  la competencia por rubro y qué hueco nos deja
  Se arma con armar.mjs. Rúbrica de la ronda 2: sencillos, de un solo color, sin nada encimado y
  ninguno parecido a otro: 100 letras distintas (ninguna de las rondas 1 y 2), acomodos y símbolos
  distintos. Los símbolos están dibujados a mano en vector (marcas.js); ningún modelo de imagen.
  De Temmie y de Detroit van GUIÑOS (criatura de garabato, el aro LED de la sien, la banda del
  brazo), nunca el personaje ni la marca: son de Toby Fox y de Quantic Dream.
  Letras de Google Fonts, licencia OFL: se pueden usar en un logo comercial.
-->
<style>
:root{ --vacio:#100A18; --violeta:#AC27FF; --lila:#C878FF; --hueso:#EAE5E3; --gris:#A79CB4; --linea:#2C2238 }
*{ box-sizing:border-box; margin:0 }
html, body{ background:var(--vacio); color:var(--hueso); font:400 16px/1.4 system-ui, sans-serif }
.hoja{ width:2120px; padding:56px 60px 48px }
.cab{ display:flex; align-items:end; gap:24px; margin-bottom:32px }
.cab h1{ font:800 44px/1.05 system-ui; letter-spacing:-.02em }
.cab p{ margin-top:6px; color:var(--gris); font-size:21px; max-width:84ch }
.cab .rango{ margin-left:auto; text-align:right; color:var(--gris); font-size:19px; white-space:nowrap }
.cab .rango b{ display:block; color:var(--hueso); font-size:30px }
.rej{ display:grid; grid-template-columns:repeat(5, 1fr); gap:16px }
.ficha{ position:relative; height:340px; border-radius:22px; overflow:hidden; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.07) }
.lienzo{ position:absolute; inset:40px 34px 58px; display:grid; place-items:center }
.logo{ white-space:nowrap; line-height:1 }
.num{ position:absolute; left:18px; bottom:15px; font:700 18px/1 ui-monospace, Menlo, monospace; opacity:.6 }
.fuente{ position:absolute; right:18px; bottom:16px; font:500 14px/1 system-ui; opacity:.5 }
.fam{ position:absolute; left:18px; top:15px; font:600 12px/1 system-ui; letter-spacing:.12em; text-transform:uppercase; opacity:.45 }
.pie{ margin-top:26px; display:flex; justify-content:space-between; color:#6E6380; font-size:17px }
svg{ display:block; overflow:visible }
/* la principal */
.heroe{ display:grid; grid-template-columns:1.25fr 1fr; gap:16px }
.panel{ position:relative; border-radius:22px; overflow:hidden; display:grid; place-items:center; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.07) }
.panel .et{ position:absolute; left:22px; top:18px; font:600 13px/1 system-ui; letter-spacing:.12em; text-transform:uppercase; opacity:.5 }
.der{ display:grid; grid-template-rows:repeat(3, 1fr); gap:16px }
.abajo{ display:grid; grid-template-columns:1fr 1fr 1fr 1.3fr; gap:16px; margin-top:16px }
/* la competencia */
.rubros{ display:grid; grid-template-columns:repeat(3, 1fr); gap:16px }
.rubro{ background:#1E1428; border-radius:22px; padding:30px 32px; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.06) }
.rubro h2{ font:800 28px/1.1 system-ui; letter-spacing:-.01em; margin-bottom:14px }
.rubro li{ margin:0 0 10px 1.1em; color:#D6CEDD; font-size:19px; line-height:1.4 }
.rubro li b{ color:var(--hueso) }
.rubro .hueco{ margin-top:16px; padding-top:14px; border-top:1.5px solid var(--linea); color:var(--lila); font-size:19px; line-height:1.4 }
.fuentes{ margin-top:22px; color:#8A7E99; font-size:16px; line-height:1.5 }
</style>
</head>

(async () => {
  await document.fonts.ready;
  for(const lz of document.querySelectorAll('.lienzo')){
    const g = lz.querySelector('.logo'), a = lz.getBoundingClientRect(), r = g.getBoundingClientRect();
    let u = { l:r.left, t:r.top, d:r.right, b:r.bottom };
    for(const e of g.querySelectorAll('*')){ const q = e.getBoundingClientRect(); if(!q.width || !q.height) continue;
      u = { l:Math.min(u.l, q.left), t:Math.min(u.t, q.top), d:Math.max(u.d, q.right), b:Math.max(u.b, q.bottom) }; }
    const s = Math.min(1, a.width / (u.d - u.l), a.height / (u.b - u.t)), cx = (u.l + u.d) / 2, cy = (u.t + u.b) / 2;
    g.style.transformOrigin = `${(cx - r.left).toFixed(1)}px ${(cy - r.top).toFixed(1)}px`;
    g.style.transform = `translate(${(a.left + a.width / 2 - cx).toFixed(1)}px, ${(a.top + a.height / 2 - cy).toFixed(1)}px) scale(${s.toFixed(3)})`;
  }
  document.body.dataset.listo = '1';
})();
