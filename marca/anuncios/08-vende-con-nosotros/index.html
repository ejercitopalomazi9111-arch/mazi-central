<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<title>Grupo Mazi · Vende con nosotros</title>
<!-- RECLUTAMIENTO 08 · ~28 s · 9:16 · voz Eric. Buscamos vendedores y comisionistas. Sólo lo que está
     confirmado (CLAUDE.md §1): los colaboradores cobran comisión por proyecto. Nada de montos, horarios
     ni promesas que Carlos no haya dicho.
     Música: «Getting it Done», Kevin MacLeod (incompetech.com), CC BY 4.0.
     node herramientas/video/armar.mjs marca/anuncios/08-vende-con-nosotros/index.html marca/anuncios/salida/08-vende-con-nosotros.mp4 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter+Tight:wght@600;800;900&display=block">
<link rel="stylesheet" href="../comun.css">
<script>window.listo = new Promise(r => window._listo = r);</script>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js" } }</script>
<style>
.rotulo{ position:absolute; font:800 34px/1 var(--s); letter-spacing:.08em; text-transform:uppercase; padding:14px 20px; border-radius:14px; background:#170A26E6; border:2px solid #ffffff22; transform:translateX(-50%); white-space:nowrap; opacity:0 }
.rotulo.v{ background:var(--vino) }
#flechas{ position:absolute; left:0; top:0 }
#servs{ position:absolute; left:80px; right:150px; top:560px; display:flex; gap:16px; justify-content:center }
#servs div{ display:flex; flex-direction:column; align-items:center; gap:10px; font:800 30px/1 var(--s); padding:20px 18px; border-radius:22px; background:#2A1A3A; width:220px; opacity:0 }
#comision{ position:absolute; left:80px; right:150px; top:250px; text-align:left; font:700 110px/.92 var(--t); letter-spacing:-.045em; text-transform:uppercase }
#comision span{ display:block } #comision .v{ color:#FF5C8A }
#numero{ position:absolute; left:0; right:0; top:760px; text-align:center; opacity:0 }
#numero .q{ font:700 40px/1 var(--t); letter-spacing:.18em; color:#25D366 }
#numero .n{ margin-top:20px; font:700 150px/1 var(--t); letter-spacing:-.04em }
#numero .s{ margin-top:30px; font:600 40px/1.25 var(--s); color:var(--gris) }
</style>
</head>
<body>
<div id="fondo" class="capa"></div>
<canvas id="gl" class="capa"></canvas>
<canvas id="c2" class="capa" width="1080" height="1920"></canvas>
<div id="ui" class="capa">
  <div id="titulo" class="grande"></div>
  <div id="comision"></div>
  <div id="servs"></div>
  <div class="rotulo" id="r1">Tú</div><div class="rotulo" id="r2">El cliente</div><div class="rotulo v" id="r3">Grupo Mazi</div>
  <div id="numero"><div class="q">WHATSAPP</div><div class="n">442 883 3786</div><div class="s">Escríbenos: «Quiero vender con Grupo Mazi».</div></div>
</div>
<div id="subs"></div>
<div id="grano"></div>
<script type="module">
import { THREE, PAL, W, H, tramo, suave, sale, entra, resorte, mezcla, vida, escena3d, cubo, telefono, Toma, guion, sonidosVoz, subtitulos, grano, logo2d } from '../motor.js';
import { cubito, parpadeo, salto, habla } from '../personajes.js';
import { icono } from '../iconos.js';
const $ = (s) => document.querySelector(s);
const G = await guion('.'), L = (id) => G.de(id);
const FIN = L('06').t1 + 2.6, fx = (n) => `../../../herramientas/video/efectos/${n}.wav`;
window.VIDEO = { w: W, h: H, fps: 30, dur: FIN, musica: { archivo: '/tmp/claude-0/musica/Getting_it_Done.mp3', desde: 0, vol: .3, entrada: .2, fin: 2 },
  sonidos: [...sonidosVoz(G, 1.08), [fx('whoosh'), L('03').t0 - .3, .5], [fx('ding'), L('04').t0 + .5, .6], [fx('ding'), L('04').t0 + .9, .5], [fx('subida'), L('06').t0 - .3, .45]] };
await Promise.all(['700 80px "Space Grotesk"', '800 60px "Inter Tight"'].map(f => document.fonts.load(f)));
const E = escena3d($('#gl'));
const yo = cubito({ color: '#8E1B3A', corbata: '#AC27FF', tam: .58 });
const cliente = cubito({ color: '#C68B3E', lentes: true, tam: .58 });
const mazi = cubo(.58);
E.s.add(yo, cliente, mazi);
/* monedas: cilindros dorados que brincan de Grupo Mazi al vendedor */
const monedas = [0, 1, 2].map(() => { const m = new THREE.Mesh(new THREE.CylinderGeometry(.13, .13, .035, 40), new THREE.MeshStandardMaterial({ color: '#E3B04B', metalness: .8, roughness: .25, emissive: '#5A3A00', emissiveIntensity: .3 })); m.rotation.x = Math.PI / 2; E.s.add(m); return m; });
const tS = new Toma('smileys-tel', { desde: 4 }); const tel = telefono(tS.tex); E.s.add(tel);
const sub = subtitulos($('#subs'), G), gr = grano($('#grano'), .05), c2 = $('#c2').getContext('2d');
const poner = (el, html) => { if(el.dataset.h !== html){ el.innerHTML = html; el.dataset.h = html; } };
$('#servs').innerHTML = [['monitor-smartphone', 'Página'], ['app-window', 'App'], ['video', 'Video']].map(([i, n]) => `<div>${icono(i, '#F4EEF2', 1.8, 64)}${n}</div>`).join('');
const aPantalla = (v) => { const p = v.clone().project(E.cam); return [(p.x + 1) / 2 * W, (1 - p.y) / 2 * H]; };

window.pintar = async (t) => {
  const l = Object.fromEntries(G.lineas.map(z => [z.id, z]));
  /* títulos */
  let tit = '', a = 0, b = 0;
  if(t < l['02'].t0 - .1){ tit = '<span>¿SE TE DA</span><span class="v xl">VENDER?</span>'; a = .3; b = l['02'].t0; }
  else if(t < l['03'].t0 - .2){ tit = '<span class="m">BUSCAMOS</span><span class="m v">VENDEDORES</span><span class="m">Y COMISIONISTAS</span>'; a = l['02'].t0 - .1; b = l['03'].t0 - .1; }
  poner($('#titulo'), tit); $('#titulo').style.opacity = tit ? vida(t, a, b, .3, .25) : 0;
  [...$('#titulo').children].forEach((s, i) => { const u = sale(tramo(t, a + i * .12, a + .4 + i * .12)); s.style.transform = `translateY(${(1 - u) * 60}px)`; s.style.opacity = u; });
  /* el vendedor: solo al principio, luego en la fila con el cliente y Grupo Mazi */
  const enFila = suave(tramo(t, l['03'].t0 - .4, l['03'].t0 + .3)), salFila = suave(tramo(t, l['06'].t0 - .4, l['06'].t0 + .2));
  const pYo = new THREE.Vector3(mezcla(0, -.74, enFila), mezcla(-.5, -.2, enFila), mezcla(1, .4, enFila)).lerp(new THREE.Vector3(0, -2.4, .4), salFila);
  const sj = salto(t, .5, .35, .45), sj2 = salto(t, l['04'].t0 + .9, .3, .4); const sj3 = sj.y ? sj : sj2;
  yo.position.copy(pYo); yo.visible = salFila < 1; yo.position.y += sj3.y; yo.userData.cuerpo.scale.set(sj3.sx, sj3.sy, sj3.sx); yo.rotation.set(.12, mezcla(-.3, .35, enFila) + Math.sin(t * 1.4) * .06, 0);
  yo.userData.cara({ boca: t < l['02'].t0 ? habla(t, l['01']) * .6 : 0, ojos: parpadeo(t, .2), ceja: t >= l['04'].t0 ? 'feliz' : 'normal', mira: enFila > .5 ? [.6, 0] : [0, 0], rubor: t >= l['04'].t0 ? .6 : 0 });
  const entraC = sale(tramo(t, l['03'].t0 - .2, l['03'].t0 + .4)), entraM = sale(tramo(t, l['03'].t0 + l['03'].dur * .45, l['03'].t0 + l['03'].dur * .45 + .5));
  cliente.visible = entraC > 0 && salFila < 1; cliente.position.set(0, -.2 + (1 - entraC) * 3, .2); cliente.rotation.set(.12, Math.sin(t * 1.1) * .08, 0);
  cliente.userData.cara({ ojos: parpadeo(t, 1.1), ceja: t >= l['03'].t0 + l['03'].dur * .7 ? 'feliz' : 'normal', mira: [t < l['03'].t0 + l['03'].dur * .45 ? -.6 : .6, 0] });
  mazi.visible = entraM > 0 && salFila < 1; mazi.position.set(.74, -.2 + (1 - entraM) * 3, .4); mazi.rotation.set(.45, -.6 + t * .4, 0);
  /* los rótulos debajo de cada uno */
  [[yo, '#r1', enFila], [cliente, '#r2', entraC], [mazi, '#r3', entraM]].forEach(([o, id, v]) => { const [x, y] = aPantalla(o.position.clone().add(new THREE.Vector3(0, -.48, 0))); const e = $(id);
    e.style.left = x + 'px'; e.style.top = y + 'px'; e.style.opacity = Math.min(v, 1 - tramo(t, l['04'].t0 - .3, l['04'].t0)) * (t < l['06'].t0 ? 1 : 0); });
  /* lo que hacemos nosotros: página, app o video */
  const vS = vida(t, l['03'].t0 + l['03'].dur * .5, l['04'].t0 - .1, .3, .3);
  [...$('#servs').children].forEach((d, i) => { const u = sale(tramo(t, l['03'].t0 + l['03'].dur * (.55 + i * .13), l['03'].t0 + l['03'].dur * (.55 + i * .13) + .3)); d.style.opacity = Math.min(u, vS); d.style.transform = `translateY(${(1 - u) * 40}px)`; });
  /* 04: la comisión, con monedas que brincan de Grupo Mazi al vendedor */
  poner($('#comision'), t >= l['04'].t0 - .2 && t < l['05'].t0 ? '<span>TÚ COBRAS</span><span class="v">COMISIÓN</span><span>POR PROYECTO</span>' : '');
  [...$('#comision').children].forEach((s, i) => { const u = sale(tramo(t, l['04'].t0 - .1 + i * .12, l['04'].t0 + .3 + i * .12)); s.style.transform = `translateY(${(1 - u) * 50}px)`; s.style.opacity = u * vida(t, l['04'].t0 - .2, l['05'].t0, .1, .25); });
  monedas.forEach((m, i) => { const u = tramo(t, l['04'].t0 + .3 + i * .35, l['04'].t0 + .9 + i * .35); m.visible = u > 0 && u < 1;
    m.position.set(mezcla(.74, -.74, u), -.2 + .3 + Math.sin(u * Math.PI) * 1.1, .7); m.rotation.z = u * 12; });
  /* 05: el trabajo real que enseña el vendedor */
  const vT = vida(t, l['05'].t0 - .3, l['06'].t0 - .2, .4, .3); tel.visible = vT > 0;
  tel.position.set(.55, mezcla(-2.5, .35, sale(vT)), 1); tel.rotation.set(-.05, -.45 + Math.sin(t) * .05, .05); tel.scale.setScalar(.8);
  await tS.en(Math.max(0, t - l['05'].t0 + 1));
  E.cam.position.set(Math.sin(t * .4) * .1, 0, 9); E.cam.lookAt(0, 0, 0); E.pintar();
  /* 06: el número en grande, y el logo */
  c2.clearRect(0, 0, W, H);
  const uN = sale(tramo(t, l['06'].t0 - .1, l['06'].t0 + .5)); $('#numero').style.opacity = uN; $('#numero').style.transform = `scale(${.9 + .1 * uN})`;
  if(uN > 0) logo2d(c2, { cx: W / 2, cy: 540, ancho: 620, alfa: uN });
  $('#fondo').style.background = `radial-gradient(70% 45% at 50% 55%, ${PAL.vino}66, transparent 70%), radial-gradient(120% 80% at 50% 0%, ${PAL.oscuro2}, ${PAL.oscuro} 70%)`;
  sub(t); gr(t);
};
await pintar(0); window._listo();
</script>
</body>
</html>
