<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>La tienda · Grupo Mazi</title>
<!-- ANUNCIO 26 · LA TIENDA EN LÍNEA (Carlos, 15 nov: «hazme un video de la tienda que hicimos tipo Amazon para poder
     presentarla», para el inversionista). Capturas reales de la app (tienda/video/capturas.mjs y llenas.mjs) dentro de
     un teléfono que flota; las pantallas se deslizan, los letreros llegan con una línea que termina en lo que señalan.
     Reglas de empresa/inversionista/ESTUDIO.md: gancho en el primer segundo, cámara quieta, todo entra con
     anticipación y rebote, y la firma de Grupo Mazi con el logo vivo al final. -->
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js" } }</script>
<style>
  html,body{ margin:0; background:#0E0618 }
  #v{ position:relative; width:1080px; height:1920px; overflow:hidden; color:#fff; font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    background:radial-gradient(110% 70% at 50% 30%, #2A1142 0%, #170A26 55%, #0B0513 100%) }
  .luz{ position:absolute; border-radius:50%; filter:blur(90px); opacity:.55 }
  #l1{ width:720px; height:720px; background:#7E1735; left:-220px; top:980px }
  #l2{ width:640px; height:640px; background:#5A1C9E; right:-200px; top:260px }
  #tit{ position:absolute; left:70px; right:70px; top:150px; height:330px; z-index:5 }
  .t{ position:absolute; left:0; right:0; top:0; font-weight:800; font-size:84px; line-height:1.03; letter-spacing:-.035em; text-align:center; visibility:hidden }
  .t .p{ display:inline-block; opacity:0 } .t em{ font-style:normal; color:#C77DFF }
  #tel{ position:absolute; left:50%; top:560px; width:600px; height:1298px; margin-left:-300px; border-radius:78px; background:#0c0c10;
    box-shadow:0 0 0 3px #3a2a52, 0 50px 120px rgba(0,0,0,.55); transform-origin:50% 70%; z-index:3 }
  #pant{ position:absolute; inset:16px; border-radius:64px; overflow:hidden; background:#fff }
  #pant img{ position:absolute; left:0; top:0; width:100%; height:auto; will-change:transform }
  #isla{ position:absolute; left:50%; top:30px; width:150px; height:42px; margin-left:-75px; border-radius:30px; background:#0c0c10; z-index:2 }
  .chip{ position:absolute; z-index:6; padding:18px 30px; border-radius:999px; background:#fff; color:#170A26; font-weight:800; font-size:38px;
    letter-spacing:-.01em; box-shadow:0 14px 40px rgba(0,0,0,.35); white-space:nowrap; visibility:hidden }
  .chip b{ color:#7E1735 }
  svg#lineas{ position:absolute; inset:0; z-index:5; pointer-events:none }
  svg#lineas path{ fill:none; stroke:#E2B8FF; stroke-width:5; stroke-linecap:round }
  svg#lineas circle{ fill:#E2B8FF }
  .mini{ position:absolute; width:300px; height:649px; border-radius:42px; background:#0c0c10; padding:9px; box-sizing:border-box; z-index:4; visibility:hidden;
    box-shadow:0 0 0 2px #3a2a52, 0 30px 70px rgba(0,0,0,.5) }
  .mini img{ width:100%; height:100%; object-fit:cover; object-position:top; border-radius:34px; display:block }
  /* el gancho: productos reales flotando, que luego vuelan adentro del teléfono */
  .ficha{ position:absolute; left:0; top:0; width:270px; border-radius:30px; overflow:hidden; background:#fff; z-index:2; visibility:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.45) }
  .ficha img{ display:block; width:100% }
  #gm{ position:absolute; inset:0; z-index:20; background:radial-gradient(120% 80% at 50% 38%, #2C1145 0%, #170A26 60%, #0E0618 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:44px; visibility:hidden }
  #gmLogo{ width:720px } #gmTxt{ font-weight:600; font-size:34px; letter-spacing:.2em; text-transform:uppercase; color:#E2B8FF; text-align:center }
  #gmTxt b{ display:block; font-weight:800; font-size:60px; letter-spacing:.03em; color:#fff; margin-top:10px; text-transform:none }
  #gmLema{ font-size:30px; color:#C9B6DA }
</style></head>
<body><div id="v">
  <div class="luz" id="l1"></div><div class="luz" id="l2"></div>
  <div id="tit"></div>
  <div id="fichas"></div>
  <div id="tel"><div id="isla"></div><div id="pant"></div></div>
  <div class="mini" id="m1"><img src="../../../tienda/video/cap/limpia-a.png"></div>
  <div class="mini" id="m2"><img src="../../../tienda/video/cap/limpia-a-inventario.png"></div>
  <svg id="lineas" viewBox="0 0 1080 1920"></svg>
  <div class="chip" id="c1">Lo de <b>siempre</b></div>
  <div class="chip" id="c2">$<b id="cuenta">0</b> · 3 piezas</div>
  <div class="chip" id="c3">Mostrador</div>
  <div class="chip" id="c4">En vivo</div>
  <div class="chip" id="c5"><b>90</b> por surtir</div>
  <div id="gm"><div id="gmLogo"></div><div id="gmTxt">Hecho por<b>Grupo Mazi</b></div><div id="gmLema">Si no existe la herramienta, se construye.</div></div>
</div>
<script type="module">
import { guion, sonidosVoz } from '../motor.js';
import { crearPaloma } from '../../paloma-2026/vivo.js';
const $ = (s) => document.querySelector(s);
const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), tramo = (t, a, b) => cl((t - a) / (b - a));
const sale = (u) => 1 - Math.pow(1 - u, 3), entra = (u) => u * u * u;
/* rebote con anticipación: baja un poco antes de salir y se pasa un poco al llegar (ESTUDIO.md §1) */
const rebote = (u) => { if(u <= 0) return 0; if(u >= 1) return 1; const c = 1.55; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
const ver = (el, o, tr) => { el.style.opacity = o; el.style.visibility = o > .002 ? 'visible' : 'hidden'; if(tr != null) el.style.transform = tr; };

/* LAS PANTALLAS, en orden; cada una entra deslizándose desde la derecha */
const CAP = '../../../tienda/video/cap/';
const PANT = [
  { a: 6.0,  img: 'limpia-buscar' }, { a: 11.0, img: 'inicio-bajado' }, { a: 15.0, img: 'producto' }, { a: 17.6, img: 'carrito-lleno' },
  { a: 20.0, img: 'limpia-v' }, { a: 24.6, img: 'limpia-a-repartidores' }, { a: 28.8, img: 'limpia-a-surtir' }, { a: 34.0, img: 'limpia-a' }];
const pant = $('#pant');
const imgs = PANT.map((p) => { const i = new Image(); i.src = CAP + p.img + '.png'; pant.appendChild(i); return i; });

/* LOS TÍTULOS: lo que dice la voz, en grande (casi todos lo ven sin sonido) */
const TITS = [
  { a: .3,  b: 2.7,  l: 'Tu cliente siempre <br>pide lo mismo.' },
  { a: 2.8, b: 5.9,  l: '¿Por qué lo haces <br><em>buscarlo</em> cada vez?' },
  { a: 6.3, b: 10.8, l: 'Una tienda como <br>las grandes. <em>Tuya.</em>' },
  { a: 11.1, b: 14.8, l: 'Lo de siempre, <br>en <em>dos toques.</em>' },
  { a: 14.9, b: 19.8, l: 'Toca, agrega. <br>El carrito <em>hace la cuenta.</em>' },
  { a: 19.9, b: 24.5, l: 'Cobras en el <br><em>mostrador</em> también.' },
  { a: 24.7, b: 28.7, l: 'Tus repartidores, <br><em>en vivo.</em>' },
  { a: 28.9, b: 33.9, l: 'Te avisa qué surtir <br><em>antes</em> de que se acabe.' },
  { a: 34.1, b: 39.0, l: 'Ventas, inventario, reparto. <br><em>Una sola app.</em>' }];
const tit = $('#tit');
tit.innerHTML = TITS.map((h) => `<div class="t">${h.l.split(/(<br>|<em>.*?<\/em>)/).filter(Boolean).flatMap((s) => s === '<br>' ? ['<br>'] : s.startsWith('<em>') ? [`<span class="p">${s}</span>`] : s.split(' ').filter(Boolean).map((w) => `<span class="p">${w}</span>`)).join(' ')}</div>`).join('');
const ts = [...tit.querySelectorAll('.t')];

/* LOS LETREROS: llegan con una línea que se dibuja desde el letrero hasta el punto que señalan */
const CHIPS = [
  { el: '#c1', a: 11.6, b: 14.6, x: 600, y: 760,  hx: 330, hy: 1180 },
  { el: '#c2', a: 18.1, b: 19.8, x: 120, y: 700,  hx: 760, hy: 1460 },
  { el: '#c3', a: 20.5, b: 24.4, x: 640, y: 690,  hx: 520, hy: 980 },
  { el: '#c4', a: 25.1, b: 28.6, x: 650, y: 700,  hx: 560, hy: 1150 },
  { el: '#c5', a: 29.4, b: 33.8, x: 110, y: 700,  hx: 380, hy: 1160 }];
const svg = $('#lineas');
CHIPS.forEach((c) => { c.p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); c.o = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); c.o.setAttribute('r', 11); svg.append(c.p, c.o); });

/* LAS FICHAS DEL GANCHO: dónde flotan (x, y, giro) y cuándo entran */
const FICHAS = [[0, 70, 560, -9], [1, 740, 520, 8], [4, 400, 900, -4], [5, 60, 1250, 6], [8, 760, 1180, -7], [9, 420, 1520, 5]]
  .map(([n, x, y, r], i) => { const d = document.createElement('div'); d.className = 'ficha'; d.innerHTML = `<img src="${CAP}ficha${n}.png">`; $('#fichas').appendChild(d); return { d, x, y, r, a: .15 + i * .14 }; });
let PALOMA = null;
window.listo = (async () => {
  window.G = await guion('.');
  await Promise.all(imgs.map((i) => i.decode().catch(() => {})));
  PALOMA = await crearPaloma($('#gmLogo'), { reloj: 'manual', puntero: false });
  PALOMA.abrir(1);
})();

const FIN = 44.2;
window.pintar = (t) => {
  /* las luces del fondo se mueven despacio (el fondo nunca está muerto) */
  $('#l1').style.transform = `translate(${Math.sin(t * .25) * 80}px, ${Math.cos(t * .2) * 60}px)`;
  $('#l2').style.transform = `translate(${Math.cos(t * .22) * 70}px, ${Math.sin(t * .27) * 50}px)`;

  /* las fichas: entran con rebote, flotan, y en 5.3–6.1 vuelan al centro del teléfono y se apagan */
  FICHAS.forEach((f, i) => { const e = rebote(tramo(t, f.a, f.a + .6)), v = sale(tramo(t, 5.2 + i * .05, 6.0 + i * .05));
    const x = f.x + (540 - 135 - f.x) * v, y = f.y + Math.sin(t * 1.3 + i) * 14 + (1250 - f.y) * v;
    ver(f.d, cl(e * 1.4) * (1 - tramo(t, 5.7 + i * .05, 6.1 + i * .05)), `translate(${x}px, ${y + (1 - e) * 80}px) rotate(${f.r * (1 - v) + Math.sin(t + i) * 2}deg) scale(${(.8 + .2 * e) * (1 - .7 * v)})`); });
  /* títulos: palabra por palabra al entrar (sube con rebote), todos juntos al salir */
  ts.forEach((el, k) => { const h = TITS[k]; if(t < h.a - .05 || t > h.b + .3){ el.style.visibility = 'hidden'; return; } el.style.visibility = 'visible';
    [...el.querySelectorAll('.p')].forEach((p, i) => { const e = rebote(tramo(t, h.a + i * .06, h.a + i * .06 + .5)), s = entra(tramo(t, h.b, h.b + .28));
      p.style.opacity = Math.min(cl(e * 1.4), 1 - s); p.style.transform = `translateY(${(1 - e) * 70 - s * 50}px)`; }); });

  /* el teléfono: sube desde abajo con un giro que se asienta, y luego flota */
  const sube = rebote(tramo(t, 5.6, 6.6)), sal = sale(tramo(t, 33.6, 34.3)), vaGM = tramo(t, 38.9, 39.5);
  const flota = Math.sin(t * 1.1) * 9, gira = Math.sin(t * .7) * 1.2;
  const telY = (1 - sube) * 1500 + flota, telR = (1 - sube) * 18 + gira, esc = 1 - sal * .22;
  ver($('#tel'), t < 5.5 ? 0 : 1 - vaGM, `translateY(${telY}px) perspective(2200px) rotateX(${(1 - sube) * 24}deg) rotate(${telR}deg) scale(${esc})`);

  /* las pantallas: la nueva entra desde la derecha; la vieja se corre a la izquierda y se oscurece */
  PANT.forEach((p, i) => { const sig = PANT[i + 1]; const e = i === 0 ? 1 : sale(tramo(t, p.a, p.a + .55)), s = sig ? sale(tramo(t, sig.a, sig.a + .55)) : 0;
    const x = (1 - e) * 100 - s * 32; const o = (t >= p.a - .01 || i === 0) && s < 1 ? 1 : 0;
    imgs[i].style.visibility = o ? 'visible' : 'hidden'; imgs[i].style.transform = `translateX(${x}%)`; imgs[i].style.filter = s > 0 ? `brightness(${1 - s * .5})` : 'none'; imgs[i].style.zIndex = i; });

  /* los letreros con su línea */
  CHIPS.forEach((c) => { const e = rebote(tramo(t, c.a, c.a + .5)), d = sale(tramo(t, c.a + .25, c.a + .75)), s = entra(tramo(t, c.b - .25, c.b));
    const el = $(c.el); ver(el, cl(e * 1.3) * (1 - s), `translate(${c.x}px, ${c.y + (1 - e) * 40}px) scale(${.85 + .15 * e})`);
    el.style.left = '0px'; el.style.top = '0px';
    const r = el.getBoundingClientRect(), x0 = c.x + r.width / 2, y0 = c.y + r.height + 8, mx = (x0 + c.hx) / 2 + (c.hx > x0 ? -60 : 60);
    c.p.setAttribute('d', `M${x0},${y0} Q${mx},${(y0 + c.hy) / 2} ${c.hx},${c.hy}`);
    const L = c.p.getTotalLength(); c.p.style.strokeDasharray = L; c.p.style.strokeDashoffset = L * (1 - d); c.p.style.opacity = 1 - s;
    c.o.setAttribute('cx', c.hx); c.o.setAttribute('cy', c.hy); c.o.style.opacity = (d > .95 ? 1 : 0) * (1 - s) * (.75 + .25 * Math.sin(t * 8)); });
  /* la cuenta del carrito sube a su número */
  $('#cuenta').textContent = (1564.30 * sale(tramo(t, 18.2, 19.2))).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  /* «una sola app»: el teléfono se achica y salen dos más a los lados */
  [['#m1', -1], ['#m2', 1]].forEach(([s, lado]) => { const e = rebote(tramo(t, 34.2 + (lado > 0 ? .12 : 0), 34.9 + (lado > 0 ? .12 : 0)));
    ver($(s), cl(e * 1.3) * (1 - vaGM), `translate(${540 - 150 + lado * (40 + 330 * e)}px, ${900 + Math.sin(t * 1.1 + lado) * 9}px) rotate(${lado * 7 * e}deg) scale(${.82 + .1 * e})`); });

  /* la firma de Grupo Mazi, con el logo vivo */
  ver($('#gm'), vaGM, null);
  if(PALOMA && t > 38.8){ if(t > 39.3) PALOMA.abrir(0); PALOMA.paso(t);
    const tx = sale(tramo(t, 40.2, 40.8)); ver($('#gmTxt'), tx, `translateY(${(1 - tx) * 30}px)`); ver($('#gmLema'), sale(tramo(t, 41.2, 41.8)), null); }
};

const fx = (n) => `../../../herramientas/video/efectos/${n}.wav`;
window.VIDEO = { w: 1080, h: 1920, fps: 30, dur: FIN,
  musica: { archivo: '/tmp/claude-0/mus/173.mp3', desde: 8, vol: .45, entrada: .3, fin: 2.2 },
  get sonidos(){ return [...sonidosVoz(window.G, 1.05),
    ...FICHAS.map((f) => [fx('toque'), f.a + .05, .22]), [fx('whoosh'), 5.65, .4], ...PANT.slice(1).map((p) => [fx('whoosh'), p.a - .05, .25]),
    ...CHIPS.map((c) => [fx('toque'), c.a + .05, .35]), [fx('ding'), 19.2, .3],
    [fx('subida'), 37.4, .3], [fx('whoosh'), 38.9, .35], [fx('golpe'), 39.5, .5]]; } };
</script></body></html>
