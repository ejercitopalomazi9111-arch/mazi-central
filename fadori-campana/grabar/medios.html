<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Medios para la pantalla del comercial</title>
<!-- Los videos que pasa la tele en el comercial: un episodio de Radio
     Divergentes y el partido. Se pintan cuadro por cuadro con pintar(t) y
     clip.mjs los vuelve WebM. ?que=ep | partido -->
<style>
@font-face{font-family:Pop;src:url(../f/Poppins-Black.ttf);font-weight:900}
@font-face{font-family:Pop;src:url(../f/Poppins-SemiBold.ttf);font-weight:600}
@font-face{font-family:Serif;src:url(../f/DMSerifDisplay-Regular.ttf)}
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0E0B0D}
#ep,#partido{position:absolute;inset:0;display:none}
.que-ep #ep,.que-partido #partido{display:block}
#ep{background:radial-gradient(120% 90% at 30% 40%,#6A1C26 0%,#4A1219 38%,#0E0B0D 100%);color:#EDE6DC;font-family:Pop}
#logo{position:absolute;left:50px;top:150px;width:390px;height:390px}
#frase{position:absolute;left:470px;top:520px;font:600 18px Pop;color:#D9A5AE;letter-spacing:.04em}
#tag{position:absolute;left:470px;top:110px;font:600 20px Pop;letter-spacing:.22em;opacity:.8}
#titulo{position:absolute;left:470px;top:150px;width:740px;font:46px/1.12 Serif}
#sillas{position:absolute;left:470px;top:330px;display:flex;gap:16px}
.silla{width:170px;height:118px;border-radius:16px;background:rgba(237,230,220,.08);border:1px solid rgba(237,230,220,.18);display:grid;place-items:center;text-align:center;font:600 15px/1.2 Pop}
.silla i{display:block;width:44px;height:44px;border-radius:50%;margin:0 auto 8px;background:rgba(237,230,220,.25)}
.silla.habla{background:rgba(237,230,220,.2);border-color:#EDE6DC}
.silla.habla i{background:#EDE6DC}
#onda{position:absolute;left:0;right:0;bottom:70px;height:120px;display:flex;align-items:center;justify-content:center;gap:5px}
#onda b{width:8px;border-radius:4px;background:#EDE6DC;opacity:.85}
#vivo{position:absolute;left:470px;top:478px;font:600 18px Pop;display:flex;gap:10px;align-items:center}
#vivo s{width:12px;height:12px;border-radius:50%;background:#E8443A;text-decoration:none;display:inline-block}
#partido img{position:absolute;left:0;top:0;width:1280px;height:1008px;transform-origin:50% 40%}
#partido .vin{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45))}
</style></head><body>
<div id="ep">
  <img id="logo" src="../../podcast/marca/radio-divergentes.png" alt="">
  <div id="tag">RADIO DIVERGENTES · EPISODIO 7</div>
  <div id="titulo">¿Es mejor saber la verdad o vivir feliz?</div>
  <div id="sillas"><div class="silla"><div><i></i>Presenta</div></div><div class="silla"><div><i></i>Invitado 1</div></div><div class="silla"><div><i></i>Invitado 2</div></div><div class="silla"><div><i></i>Invitado 3</div></div></div>
  <div id="vivo"><s></s>Grabado en el 3.1 · Ética</div>
  <div id="frase">Para quien piensa diferente · Para la comunidad</div>
  <div id="onda"></div>
</div>
<div id="partido"><img id="foto" src="" alt=""><div class="vin"></div></div>
<script>
const q = new URLSearchParams(location.search).get('que') || 'ep';
document.body.className = 'que-' + q;
window.DUR = 20;
const onda = document.getElementById('onda'), barras = [];
for(let i = 0; i < 96; i++){ const b = document.createElement('b'); onda.appendChild(b); barras.push(b); }
const sillas = [...document.querySelectorAll('.silla')];
/* ruido suave y repetible: la onda parece voz (sílabas y pausas), no un ecualizador */
const r = (x) => { const s = Math.sin(x * 12.9898) * 43758.5453; return s - Math.floor(s); };
function voz(t){ const sil = Math.floor(t * 5.5); return r(sil) > .22 ? .35 + .65 * r(sil + .5) : .08; }
window.pintar = (t) => {
  if(q === 'ep'){
    const quien = Math.floor(t / 4.3) % 4;
    sillas.forEach((s, k) => s.classList.toggle('habla', k === quien));
    const a = voz(t);
    barras.forEach((b, i) => { const c = 1 - Math.abs(i - 48) / 52, v = a * c * (.45 + .55 * r(i + Math.floor(t * 24))); b.style.height = Math.max(6, 110 * v) + 'px'; });
    document.getElementById('logo').style.transform = 'translateY(' + (Math.sin(t * 1.3) * 6) + 'px) scale(' + (1 + a * .02) + ')';
    document.querySelector('#vivo s').style.opacity = .4 + .6 * (Math.sin(t * 6) > 0);
  } else {
    const k = t / window.DUR, e = k * k * (3 - 2 * k);
    document.getElementById('foto').style.transform = 'translate(' + (-60 * e) + 'px,' + (-150 - 40 * e) + 'px) scale(' + (1.12 + .14 * e) + ') translate(' + (Math.sin(t * 7) * 1.2) + 'px,' + (Math.cos(t * 9) * 1.2) + 'px)';
  }
};
const foto = new URLSearchParams(location.search).get('foto'); if(foto) document.getElementById('foto').src = foto;
window.listo = document.fonts.ready.then(() => new Promise(si => { const im = [...document.images].filter(i => i.src); let n = im.length; if(!n) return si(); im.forEach(i => i.complete ? (--n || si()) : i.onload = i.onerror = () => (--n || si())); }));
</script>
</body></html>
