<!doctype html><meta charset=utf-8><body>
<script type=module>
import { cargarModelo, alfaDeConfianza, afinar, suavizar, descontaminar } from '../../presentaciones/recorte.js';
window.recortar = async (src, puntos) => {
  const s = await cargarModelo();
  const img = new Image(); img.src = src; await img.decode();
  const esc = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
  const W = Math.round(img.naturalWidth * esc), H = Math.round(img.naturalHeight * esc);
  const base = document.createElement('canvas'); base.width = W; base.height = H;
  const g = base.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0, W, H);
  const px = g.getImageData(0, 0, W, H).data;
  let m = null;
  for (const [x, y] of puntos) {
    let conf; s.segment(base, { keypoint: { x, y } }, (r) => { conf = r.confidenceMasks[0].getAsFloat32Array().slice(); r.close?.(); });
    const a = afinar(px, W, H, alfaDeConfianza(conf)).mascara;
    if (!m) m = a.slice(); else for (let i = 0; i < m.length; i++) if (a[i] > m[i]) m[i] = a[i];
  }
  let area = 0; for (const v of m) if (v > 127) area++;
  const ms = suavizar(m, W, H, 1);
  const rgb = descontaminar(px, W, H, ms);
  const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  const d = x.createImageData(W, H), o = d.data;
  let x0 = W, y0 = H, x1 = 0, y1 = 0;
  for (let i = 0, j = 0; i < W * H; i++, j += 4) { o[j] = rgb[j]; o[j+1] = rgb[j+1]; o[j+2] = rgb[j+2]; o[j+3] = ms[i];
    if (ms[i] > 40) { const xx = i % W, yy = (i / W) | 0; if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (yy < y0) y0 = yy; if (yy > y1) y1 = yy; } }
  x.putImageData(d, 0, 0);
  const pad = 8; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(W - 1, x1 + pad); y1 = Math.min(H - 1, y1 + pad);
  const out = document.createElement('canvas'); out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
  out.getContext('2d').drawImage(c, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
  return { png: out.toDataURL('image/png'), frac: area / (W * H), caja: [x0 / W, y0 / H, x1 / W, y1 / H] };
};
window.listo = true;
</script>
