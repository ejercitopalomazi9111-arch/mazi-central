<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>All's fashion · comercial</title>
<!--
  EL COMERCIAL DE ALL'S FASHION, versión 2 (16 de octubre).
  Carlos: «hazlo más tipo fadori y usa imágenes que pases por la herramienta de
  carteles y publicidad y algunos sin fondo y busca fotos extra de fuera y no
  repitas tanto el mismo plano y hazlo muy variado».

  Del de Fadori se tomó el oficio, no el dibujo: fondos de color con rayas que
  corren al tempo, cortina de color en cada corte, cámara que nunca se queda
  quieta, cosas recortadas que flotan, teléfonos con lo de verdad adentro, letra
  Anton grande con una palabra de otro color, historia (la duda → la tienda →
  cómo se compra) y créditos al final.

  Cada escena tiene su propio acomodo: palabra por palabra sobre foto, logo que
  cae, prenda que cambia en cada golpe, foto de ambiente a pantalla completa,
  tenis que giran, teléfonos con las historias, pantalla partida en tres,
  collage de accesorios, pared de anuncios inclinada, la bodega, la tanda y el
  cierre.

  Material (no vive en el repo, llega en window.FOTOS):
    r-NN.png  prendas sin fondo (carteles/recorte-lote.js)
    a-NN.jpg  anuncios hechos con la herramienta de carteles (pestaña Campaña)
    f-*.jpg   fotos de fuera, CC0 de StockSnap (ver créditos)
    N.jpg     fotos del banco de All's · logo-blanco.png · logo-negro.png

  Igual que antes: `pintar(t)` deja todo exacto en el segundo t y comercial.mjs
  saca 60 cuadros por segundo. ?f=h 1920×1080 · ?f=v 1080×1920.
  Lo que NO dice: ni precios, ni «originales», ni envíos, ni dirección.
-->
<style>
@font-face{font-family:Anton;src:url(../../fadori-campana/f/Anton-Regular.ttf)}
@font-face{font-family:Pop;font-weight:600;src:url(../../fadori-campana/f/Poppins-SemiBold.ttf)}
@font-face{font-family:Pop;font-weight:800;src:url(../../fadori-campana/f/Poppins-ExtraBold.ttf)}
@font-face{font-family:Play;font-style:italic;src:url(PlayfairItalic.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;background:#000}
#lienzo{position:relative;overflow:hidden;font-family:Pop,sans-serif;color:#fff;background:#0C0B0A}
#cam{position:absolute;inset:0;transform-origin:50% 50%}
.esc{position:absolute;inset:0;visibility:hidden;overflow:hidden}
.anton{font-family:Anton,sans-serif;text-transform:uppercase;line-height:.9;letter-spacing:.005em}
.play{font-family:Play,serif;font-style:italic;text-transform:none;letter-spacing:0;line-height:1.02}
.foto{position:absolute;overflow:hidden}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.prenda{position:absolute;object-fit:contain;filter:drop-shadow(0 30px 40px rgba(0,0,0,.35))}
.oro{color:#D4AE6E}
.rayas{position:absolute;left:-200px;top:-200px;right:-200px;bottom:-200px}
.tel{position:absolute;background:#0c0c0c;border-radius:56px;padding:12px;box-shadow:0 50px 110px rgba(0,0,0,.5),inset 0 0 0 3px #2c2c2c}
.tel .pant{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden}
.tel img{width:100%;height:100%;object-fit:cover;display:block}
.chip{position:absolute;font:800 30px/1 Pop;letter-spacing:.12em;text-transform:uppercase;padding:14px 24px;border-radius:999px;white-space:nowrap}
.pild{display:inline-block;background:#0C0B0A;color:#D4AE6E;font-weight:800;border-radius:999px;white-space:nowrap}
</style></head>
<body><div id="lienzo"><div id="cam"></div></div>
<script>
'use strict';
const V = new URLSearchParams(location.search).get('f') === 'v';
const W = V ? 1080 : 1920, H = V ? 1920 : 1080;
const L = document.getElementById('lienzo'), CAM = document.getElementById('cam');
L.style.width = W + 'px'; L.style.height = H + 'px';
document.body.style.width = W + 'px'; document.body.style.height = H + 'px';

/* ── el reloj de la música: Funkorama (Kevin MacLeod, CC BY 4.0), 100.97 golpes
   por minuto, medido con el detector de Palomazo. Todo se cuenta en golpes. */
const GOLPE = 60 / 100.97, F0 = 0.03;
const T = (k) => F0 + k * GOLPE;
const DUR = T(70);
window.DUR = DUR;

const RUTA = (n) => (window.FOTOS || 'web/') + n;
const LOGO_B = RUTA('logo-blanco.png'), LOGO_N = RUTA('logo-negro.png');
const ORO = '#D4AE6E', TINTA = '#0C0B0A', CREMA = '#F3EEE6', VINO = '#4A1622', VERDE = '#2F5419', MARINO = '#14213D';

/* ── ayudas ── */
const sat = (x) => Math.max(0, Math.min(1, x));
const eo = (x) => 1 - Math.pow(1 - sat(x), 3);
const eio = (x) => { x = sat(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const rebote = (x) => { x = sat(x); const c = 1.70158 * 1.4, c3 = c + 1; return 1 + c3 * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function el(tag, css, html, padre){ const e = document.createElement(tag); if(css) e.style.cssText = css; if(html != null) e.innerHTML = html; if(padre) padre.appendChild(e); return e; }
function img(src, css, cls, padre){ const i = el('img', css, null, padre); i.src = src; if(cls) i.className = cls; return i; }
function foto(src, css, padre){ const d = el('div', css, null, padre); d.className = 'foto'; d.img = img(src, '', '', d); return d; }
function texto(html, css, cls, padre){ const d = el('div', 'position:absolute;' + css, html, padre); d.className = cls; return d; }
/* rayas diagonales de un color, que corren parejas con el tempo (como las de Fadori) */
function rayas(padre, color, alfa = .18, ancho = 22, paso = 64){
  const r = el('div', `background:repeating-linear-gradient(45deg,${color} 0 ${ancho}px,transparent ${ancho}px ${paso}px);opacity:${alfa}`, null, padre);
  r.className = 'rayas'; r.paso = paso * Math.SQRT2; return r;
}
const mover = (r, t) => { r.style.transform = `translateX(${-(((t - F0) / GOLPE * 22) % r.paso)}px)`; };
const set = (e, o) => { for(const k in o) e.style[k] = o[k]; };

/* ── las escenas: [desde, hasta] en golpes ─────────────────────────────── */
const ESC = [];
function escena(de, a, fondo){ const s = el('section', 'background:' + fondo, null, CAM); s.className = 'esc'; const e = { de, a, s, pintar: () => {}, rayas: [] }; ESC.push(e); return e; }

/* 1 · la duda (0 → 6): palabra por palabra, sobre una silueta encapuchada */
{
  const e = escena(0, 6, TINTA);
  const f = foto(RUTA('f-sweater.jpg'), 'inset:-4%', e.s); f.img.style.filter = 'brightness(.55) saturate(.8)';
  el('div', 'position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,transparent 30%,rgba(0,0,0,.65))', null, e.s);
  const tam = V ? 170 : 200, y0 = V ? 560 : 170;
  const w = [
    texto('¿Otra vez', `left:0;right:0;top:${y0}px;text-align:center;font-size:${tam}px`, 'anton', e.s),
    texto('sin saber qué', `left:0;right:0;top:${y0 + tam * .95}px;text-align:center;font-size:${tam}px`, 'anton', e.s),
    texto('ponerte?', `left:0;right:0;top:${y0 + tam * 1.9}px;text-align:center;font-size:${tam * 1.25}px;color:${ORO}`, 'play', e.s),
  ];
  e.pintar = (l) => {
    f.img.style.transform = `scale(${1.16 - .1 * eo(l / 6)})`;
    w.forEach((x, i) => { const d = l - (.4 + i * 1.6), a = d >= 0 ? 1 : 0; x.style.opacity = a * (1 - sat((l - 5.6) / .4)); x.style.transform = `scale(${a ? 1.25 - .25 * eo(d * 3) : 1})`; });
  };
}

/* 2 · el logo cae sobre oro (6 → 10) */
{
  const e = escena(6, 10, ORO); e.rayas.push(rayas(e.s, TINTA, .1));
  const lw = V ? 820 : 900;
  const logo = img(LOGO_N, `position:absolute;left:50%;top:${V ? 46 : 44}%;width:${lw}px;transform:translate(-50%,-50%)`, '', e.s);
  /* el logo ya dice «clothes & more»: abajo va lo que se vende */
  const sub = texto('Ropa · Calzado · Accesorios', `left:0;right:0;top:${V ? 1270 : 830}px;text-align:center;font:800 ${V ? 40 : 38}px/1 Pop;letter-spacing:.3em;text-transform:uppercase;color:${TINTA}`, '', e.s);
  e.pintar = (l) => {
    const c = rebote(l / 1.1);
    logo.style.transform = `translate(-50%,${-50 - (1 - c) * 120}%) rotate(${(1 - c) * -6}deg)`; logo.style.opacity = sat(l * 3);
    sub.style.opacity = eo((l - 1.2) * 2); sub.style.letterSpacing = (.3 + .25 * (1 - eo((l - 1.2) * 1.5))) + 'em';
  };
}

/* 3 · sudaderas: la de en medio cambia en cada golpe (10 → 16) */
{
  const e = escena(10, 16, CREMA); e.rayas.push(rayas(e.s, ORO, .22));
  const lista = ['r-14', 'r-02', 'r-51', 'r-32', 'r-15', 'r-23', 'r-49', 'r-42'].map(n => RUTA(n + '.png'));
  const cx = V ? W / 2 : W * .7, cy = V ? 1120 : 560, alto = V ? 860 : 820;
  const disco = el('div', `position:absolute;left:${cx}px;top:${cy}px;width:${alto * .95}px;height:${alto * .95}px;border-radius:50%;background:${ORO};transform:translate(-50%,-50%)`, null, e.s);
  const lado = [img(RUTA('r-53.png'), '', 'prenda', e.s), img(RUTA('r-11.png'), '', 'prenda', e.s)];
  lado.forEach((p, i) => set(p, V
    ? { left: (i ? W - 360 : 40) + 'px', top: '1540px', width: '320px', height: '320px' }
    : { left: (cx + (i ? 1 : -1) * alto * .56 - alto * .24) + 'px', top: (cy - alto * .04) + 'px', width: alto * .48 + 'px', height: alto * .48 + 'px' }));
  const hero = lista.map(src => img(src, `left:${cx - alto / 2}px;top:${cy - alto / 2}px;width:${alto}px;height:${alto}px`, 'prenda', e.s));
  const t1 = texto('Sudaderas', V ? `left:70px;top:150px;font-size:180px;color:${TINTA}` : `left:110px;top:300px;font-size:190px;color:${TINTA}`, 'anton', e.s);
  const t2 = texto('de marca.', V ? `left:76px;top:330px;font-size:120px;color:#9A7638` : `left:116px;top:480px;font-size:130px;color:#9A7638`, 'play', e.s);
  e.pintar = (l, t) => {
    const n = Math.floor(l), f = l - n;
    hero.forEach((h, i) => { const on = i === n % hero.length; h.style.visibility = on ? 'visible' : 'hidden'; if(on) h.style.transform = `translateY(${(1 - eo(f * 3.5)) * 90}px) scale(${.92 + .08 * eo(f * 3.5)}) rotate(${(1 - eo(f * 3)) * (n % 2 ? 6 : -6)}deg)`; });
    disco.style.transform = `translate(-50%,-50%) scale(${1 + .05 * Math.exp(-f * 5)})`;
    lado.forEach((p, i) => p.style.transform = `translateY(${Math.sin(t * 1.6 + i * 2) * 14}px) rotate(${(i ? 8 : -8) + Math.sin(t + i) * 2}deg)`);
    const a = eo(l * 2.2); t1.style.opacity = a; t1.style.transform = `translateX(${(1 - a) * -80}px)`;
    const b = eo((l - .5) * 2.2); t2.style.opacity = b; t2.style.transform = `translateX(${(1 - b) * -60}px)`;
  };
}

/* 4 · ambiente: dos fotos de fuera a pantalla completa (16 → 20) */
{
  const e = escena(16, 20, TINTA);
  const a = foto(RUTA('f-alone.jpg'), 'inset:0', e.s), b = foto(RUTA('f-hoodie.jpg'), 'inset:0', e.s);
  el('div', 'position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.6),transparent 45%)', null, e.s);
  if(!V){ el('div', 'position:absolute;left:0;right:0;top:0;height:70px;background:#000', null, e.s); el('div', 'position:absolute;left:0;right:0;bottom:0;height:70px;background:#000', null, e.s); }
  const ta = texto('Para el frío.', `left:${V ? 70 : 120}px;bottom:${V ? 260 : 150}px;font-size:${V ? 130 : 140}px;text-shadow:0 6px 30px rgba(0,0,0,.5)`, 'play', e.s);
  const tb = texto('Y para salir.', `left:${V ? 70 : 120}px;bottom:${V ? 260 : 150}px;font-size:${V ? 130 : 140}px;text-shadow:0 6px 30px rgba(0,0,0,.5)`, 'play', e.s);
  e.pintar = (l) => {
    const seg = l >= 2;
    a.style.visibility = seg ? 'hidden' : 'visible'; b.style.visibility = seg ? 'visible' : 'hidden';
    a.img.style.transform = `scale(${1.08 + .06 * l / 2}) translateX(${-l * .8}%)`;
    b.img.style.transform = `scale(${1.18 - .06 * (l - 2) / 2}) translateX(${(l - 2) * .8}%)`;
    ta.style.opacity = seg ? 0 : eo((l - .3) * 2.5); ta.style.transform = `translateY(${(1 - eo((l - .3) * 2.5)) * 30}px)`;
    tb.style.opacity = seg ? eo((l - 2.2) * 2.5) : 0; tb.style.transform = `translateY(${(1 - eo((l - 2.2) * 2.5)) * 30}px)`;
  };
}

/* 5 · tenis que giran sobre negro, con la palabra corriendo atrás (20 → 26) */
{
  const e = escena(20, 26, TINTA); e.rayas.push(rayas(e.s, ORO, .07, 6, 40));
  const fila = texto('Tenis · Tenis · Tenis · Tenis · Tenis · Tenis ·', `left:0;top:${V ? 360 : 140}px;white-space:nowrap;font-size:${V ? 300 : 380}px;color:transparent;-webkit-text-stroke:3px rgba(212,174,110,.45)`, 'anton', e.s);
  const fila2 = texto('Botas · Tenis · Botas · Tenis · Botas · Tenis ·', `left:0;top:${V ? 1340 : 640}px;white-space:nowrap;font-size:${V ? 300 : 380}px;color:transparent;-webkit-text-stroke:3px rgba(212,174,110,.25)`, 'anton', e.s);
  const anillo = el('div', `position:absolute;left:50%;top:${V ? 52 : 54}%;width:${V ? 860 : 760}px;height:${V ? 860 : 760}px;border-radius:50%;border:4px dashed ${ORO};transform:translate(-50%,-50%)`, null, e.s);
  const lista = ['r-37', 'r-20', 'r-48', 'r-12', 'r-44', 'r-33', 'r-68', 'r-62'].map(n => RUTA(n + '.png'));
  const ancho = V ? 900 : 860, cy = V ? 1000 : 580;
  const hero = lista.map(src => img(src, `left:${(W - ancho) / 2}px;top:${cy - ancho * .4}px;width:${ancho}px;height:${ancho * .8}px`, 'prenda', e.s));
  const cont = texto('', `right:${V ? 70 : 100}px;bottom:${V ? 150 : 80}px;font:800 44px/1 Pop;letter-spacing:.2em;color:${ORO}`, '', e.s);
  e.pintar = (l, t) => {
    const n = Math.floor(l), f = l - n;
    hero.forEach((h, i) => { const on = i === n % hero.length; h.style.visibility = on ? 'visible' : 'hidden';
      if(on) h.style.transform = `translateX(${(1 - eo(f * 3)) * (n % 2 ? -260 : 260)}px) rotate(${(1 - eo(f * 3)) * (n % 2 ? 18 : -18) + Math.sin(t * 2) * 2}deg) scale(${.9 + .1 * eo(f * 3)})`; });
    anillo.style.transform = `translate(-50%,-50%) rotate(${l * 22}deg) scale(${1 + .04 * Math.exp(-f * 5)})`;
    fila.style.transform = `translateX(${-l * 110}px)`; fila2.style.transform = `translateX(${-900 + l * 110}px)`;
    cont.textContent = String(n % hero.length + 1).padStart(2, '0') + ' / ' + String(hero.length).padStart(2, '0');
  };
}

/* 6 · las historias de All's dentro de teléfonos (26 → 30) */
{
  const e = escena(26, 30, VINO); e.rayas.push(rayas(e.s, ORO, .12));
  const ads = ['a-05', 'a-17', 'a-13', 'a-29', 'a-40', 'a-09', 'a-21', 'a-55', 'a-37'].map(n => RUTA(n + '.jpg'));
  const tw = V ? 330 : 320, th = tw * 2.1;
  const xs = V ? [W / 2 - tw * 1.55, W / 2 - tw / 2, W / 2 + tw * .55] : [880, 1230, 1580];
  const y0 = V ? 820 : (H - th) / 2;
  const tels = xs.map((x, i) => { const tt = el('div', `left:${x}px;top:${y0}px;width:${tw}px;height:${th}px`, null, e.s); tt.className = 'tel';
    const p = el('div', '', null, tt); p.className = 'pant'; tt.ims = [0, 1, 2].map(j => img(ads[(i * 3 + j) % ads.length], 'position:absolute;inset:0', '', p)); return tt; });
  const t1 = texto('Algo nuevo', V ? `left:70px;top:180px;font-size:150px` : `left:110px;top:320px;font-size:150px`, 'anton', e.s);
  const t2 = texto('cada día.', V ? `left:76px;top:330px;font-size:120px;color:${ORO}` : `left:116px;top:470px;font-size:130px;color:${ORO}`, 'play', e.s);
  const t3 = texto('En nuestras historias', V ? `left:76px;top:500px;font:600 40px/1 Pop;color:#E9DCCB` : `left:118px;top:640px;font:600 40px/1 Pop;color:#E9DCCB`, '', e.s);
  e.pintar = (l, t) => {
    tels.forEach((tt, i) => {
      const a = eo((l - i * .25) * 2.2);
      tt.style.transform = `translateY(${(1 - a) * 500 + Math.sin(t * 1.3 + i) * 12}px) rotate(${(i - 1) * 4 + Math.sin(t + i) * .8}deg)`;
      const q = sat((l - .6 - i * .2) / 3) * 2.999, k = Math.floor(q);   /* cada teléfono pasa sus tres historias */
      tt.ims.forEach((im, j) => { im.style.visibility = j <= k ? 'visible' : 'hidden'; im.style.transform = j === k && k > 0 ? `translateX(${(1 - eo((q - k) * 3)) * 100}%)` : 'none'; });
    });
    [t1, t2, t3].forEach((x, i) => { const a = eo((l - i * .35) * 2.5); x.style.opacity = a; x.style.transform = `translateY(${(1 - a) * 40}px)`; });
  };
}

/* 7 · pantalla partida en tres: fotos de fuera que corren en contra (30 → 34) */
{
  const e = escena(30, 34, TINTA);
  const fs = ['f-shoes1', 'f-tenis', 'f-shoes2'];
  const pan = fs.map((n, i) => foto(RUTA(n + '.jpg'), V ? `left:0;width:100%;top:${i * H / 3}px;height:${H / 3 + 2}px` : `top:0;height:100%;left:${i * W / 3}px;width:${W / 3 + 2}px`, e.s));
  pan.forEach(p => { set(p.img, V ? { left: '-12%', width: '124%' } : { top: '-12%', height: '124%' }); p.img.style.filter = 'saturate(1.05) brightness(.82)'; });
  el('div', 'position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,.55),transparent 70%)', null, e.s);
  const t1 = texto('Tu estilo,', `left:0;right:0;top:${V ? 760 : 330}px;text-align:center;font-size:${V ? 170 : 190}px;text-shadow:0 8px 40px rgba(0,0,0,.6)`, 'anton', e.s);
  const t2 = texto('todos los días.', `left:0;right:0;top:${V ? 930 : 520}px;text-align:center;font-size:${V ? 120 : 140}px;color:${ORO};text-shadow:0 8px 40px rgba(0,0,0,.6)`, 'play', e.s);
  e.pintar = (l) => {
    pan.forEach((p, i) => { const s = (i % 2 ? 1 : -1) * (l / 4 - .5) * 9, a = eo((l - i * .2) * 3);
      p.img.style.transform = V ? `translateX(${s}%)` : `translateY(${s}%)`; p.style.clipPath = V ? `inset(0 ${(1 - a) * 100}% 0 0)` : `inset(${(1 - a) * 100}% 0 0 0)`; });
    const a = eo((l - .8) * 2.5); t1.style.opacity = a; t1.style.transform = `scale(${1.2 - .2 * a})`;
    const b = eo((l - 1.4) * 2.5); t2.style.opacity = b; t2.style.transform = `translateY(${(1 - b) * 30}px)`;
  };
}

/* 8 · collage de accesorios sobre azul marino: cada uno brinca en medio golpe (34 → 40) */
{
  const e = escena(34, 40, MARINO); e.rayas.push(rayas(e.s, ORO, .1));
  const items = V
    ? [['r-26', 90, 640, 470], ['r-34', 600, 600, 360], ['r-16', 560, 940, 420], ['r-00', 120, 1080, 330], ['r-45', 100, 1380, 420], ['r-57', 560, 1340, 360], ['r-30', 800, 1420, 240], ['r-36', 420, 1500, 330]]
    : [['r-26', 760, 120, 470], ['r-34', 1260, 90, 380], ['r-16', 1560, 360, 330], ['r-00', 720, 560, 320], ['r-45', 1040, 520, 420], ['r-57', 1440, 640, 320], ['r-30', 1700, 680, 200], ['r-36', 560, 180, 260]];
  const ps = items.map(([n, x, y, w]) => img(RUTA(n + '.png'), `left:${x}px;top:${y}px;width:${w}px;height:${w}px`, 'prenda', e.s));
  const t1 = texto('Bolsas,<br>perfumes', V ? `left:70px;top:150px;font-size:150px` : `left:110px;top:300px;font-size:150px`, 'anton', e.s);
  const t2 = texto('y termos.', V ? `left:76px;top:440px;font-size:110px;color:${ORO}` : `left:116px;top:590px;font-size:120px;color:${ORO}`, 'play', e.s);
  const chips = [['Bolsas', ORO, TINTA], ['Perfumes', '#fff', MARINO], ['Termos', ORO, TINTA]].map(([tx, bg, c], i) => { const ch = el('div', `background:${bg};color:${c};` + (V ? `left:${70 + i * 300}px;top:1810px` : `left:${116 + i * 290}px;top:820px`), tx, e.s); ch.className = 'chip'; return ch; });
  e.pintar = (l, t) => {
    ps.forEach((p, i) => { const a = rebote((l - i * .5) * 2.2); p.style.opacity = sat((l - i * .5) * 6); p.style.transform = `scale(${a}) translateY(${Math.sin(t * 1.4 + i) * 10}px) rotate(${Math.sin(t * .9 + i * 1.7) * 5}deg)`; });

/* ── la cortina de cada corte: color con rayas, barre la pantalla ── */
const COLORES = [ORO, TINTA, CREMA, ORO, VINO, TINTA, MARINO, ORO, VERDE, TINTA, ORO, '#111'];
const cort = el('div', `position:absolute;top:-10%;height:120%;width:${W * 1.5}px;left:0;z-index:50;overflow:hidden`, null, L);
const cortR = rayas(cort, '#000', .12);
const negro = el('div', 'position:absolute;inset:0;background:#000;opacity:0;z-index:60', null, L);

/* ═══ pintar(t): deja todo exacto en el segundo t ════════════════════════ */
window.pintar = function(t){
  const k = (t - F0) / GOLPE;
  for(const e of ESC){
    const on = k >= e.de && k < e.a;
    e.s.style.visibility = on ? 'visible' : 'hidden';
    if(!on) continue;
    const l = k - e.de, entra = eo(l / .8);
    e.s.style.transform = `scale(${1.04 - .04 * entra})`;      /* empujoncito de cámara al entrar */
    e.pintar(l, t);
    e.rayas.forEach(r => mover(r, t));
  }
  /* la cortina del corte más cercano: tapa el cambio de escena */
  let ci = -1, cp = 0;
  ESC.slice(1).forEach((e, i) => { const p = (k - (e.de - .5)) / 1; if(p > 0 && p < 1){ ci = i; cp = p; } });
  if(ci < 0) cort.style.transform = `translateX(${W * 1.2}px) skewX(-12deg)`;
  else { cort.style.background = COLORES[ci % COLORES.length]; cort.style.transform = `translateX(${W * 1.1 - (W * 2.7) * eio(cp)}px) skewX(-12deg)`; mover(cortR, t); }
  /* cámara en mano: un vaivén chiquito, nunca quieta del todo */
  CAM.style.transform = `translate(${Math.sin(t * .7) * 5}px,${Math.cos(t * .9) * 4}px) rotate(${Math.sin(t * .5) * .18}deg) scale(1.012)`;
  negro.style.opacity = sat((t - (DUR - .7)) / .7);
};

];
