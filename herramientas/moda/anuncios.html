<!doctype html><html lang="es"><meta charset="utf-8">
<title>All's fashion · anuncios</title>
<style>
@font-face{font-family:Playfair; src:url(../../carteles/fuentes/PlayfairDisplay.woff2) format('woff2'); font-weight:400 900; font-style:normal}
@font-face{font-family:Playfair; src:url(PlayfairItalic.woff2) format('woff2'); font-weight:400 900; font-style:italic}
@font-face{font-family:Mont; src:url(../../carteles/fuentes/Montserrat.woff2) format('woff2'); font-weight:100 900}
@font-face{font-family:Anton; src:url(../../carteles/fuentes/Anton-Regular.woff2) format('woff2')}
:root{--negro:#0B0B0C; --hueso:#F2EDE4; --hueso2:#E7DFD2; --oro:#CDAE74; --tinta:#141312; --gris:#6B655C}
*{box-sizing:border-box; margin:0; padding:0}
body{background:#333; font-family:Mont, sans-serif}
#c{position:relative; width:1080px; height:1350px; overflow:hidden; color:#fff}
#c.historia{height:1920px}
.t{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center}
.cab{padding-top:60px; display:flex; justify-content:center; width:100%; position:relative; z-index:3}
.historia .cab{padding-top:210px}
.logo{display:block}
.zona{flex:1; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; position:relative; z-index:2}
.zona{margin-bottom:18px}
.zona img.prod{width:86%; height:100%; object-fit:contain; filter:drop-shadow(0 38px 46px rgba(0,0,0,.55))}
.pie{width:100%; padding:0 80px 84px; text-align:center; position:relative; z-index:3}
.historia .pie{padding-bottom:330px}
.kicker{font:600 26px/1.2 Mont; letter-spacing:.34em; text-transform:uppercase; color:var(--oro)}
.titulo{font:italic 500 92px/1.02 Playfair; margin-top:20px; text-wrap:balance}
.sub{font:500 30px/1.35 Mont; margin-top:20px; opacity:.86; text-wrap:balance}
.cta{align-self:center; white-space:nowrap; display:inline-flex; align-items:center; gap:14px; margin-top:38px; padding:22px 46px; border-radius:999px; font:700 25px/1 Mont; letter-spacing:.2em; text-transform:uppercase}
.cta svg{width:30px; height:30px}
.cta.linea{border:2px solid var(--oro); color:var(--oro)}
.cta.negra{background:var(--tinta); color:#fff}
.cta.blanca{background:#fff; color:var(--tinta)}
.cta.oro{background:var(--oro); color:var(--tinta)}
.piso{position:absolute; left:50%; bottom:4%; width:62%; height:70px; transform:translateX(-50%); background:radial-gradient(closest-side, rgba(0,0,0,.55), transparent); z-index:1}

/* estudio */
.estudio{background:radial-gradient(ellipse 70% 55% at 50% 46%, #2c2a27 0%, #141413 58%, #070707 100%)}
.estudio .piso{background:radial-gradient(closest-side, rgba(0,0,0,.8), transparent)}
/* crema */
.crema{background:var(--hueso); color:var(--tinta)}
.crema .gigante{position:absolute; left:0; right:0; top:50%; transform:translateY(-58%); text-align:center; font:400 400px/0.86 Anton; text-transform:uppercase; color:var(--hueso2); z-index:1; white-space:nowrap; letter-spacing:-.01em}
.crema .cab{justify-content:space-between; padding-left:64px; padding-right:64px; align-items:flex-start}
.crema .num{font:600 24px/1.4 Mont; letter-spacing:.3em; color:var(--gris); text-align:right; text-transform:uppercase}
.crema .pie{text-align:left; display:flex; flex-direction:column; align-items:flex-start; gap:0}
.crema .pie .cta{align-self:flex-start; margin-top:30px}
.crema .titulo{font:900 84px/1 Playfair; font-style:normal; margin-top:12px}
.crema .sub{color:var(--gris); opacity:1; margin-top:14px}
.crema .kicker{color:#9A7B45}
.crema .zona img.prod{filter:drop-shadow(0 30px 34px rgba(60,40,10,.28))}
.crema .piso{background:radial-gradient(closest-side, rgba(70,50,20,.28), transparent)}
.historia .crema .pie{flex-direction:column; align-items:flex-start}
/* color */
.color .gigante{position:absolute; top:30%; left:0; right:0; text-align:center; font:400 330px/0.9 Anton; text-transform:uppercase; color:transparent; -webkit-text-stroke:3px rgba(255,255,255,.16); z-index:1; white-space:nowrap}
.color .titulo{font:900 88px/1 Playfair; font-style:normal}
.color .kicker{color:rgba(255,255,255,.75)}
/* foto */
.foto{background:#000}
.foto .fondo{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.foto .velo{position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,.92) 0%, rgba(0,0,0,.66) 30%, rgba(0,0,0,0) 58%), linear-gradient(to bottom, rgba(0,0,0,.62) 0%, rgba(0,0,0,0) 22%)}
.historia .foto .velo{background:linear-gradient(to top, rgba(0,0,0,.94) 0%, rgba(0,0,0,.7) 34%, rgba(0,0,0,0) 56%), linear-gradient(to bottom, rgba(0,0,0,.66) 0%, rgba(0,0,0,0) 26%)}
.foto .zona{pointer-events:none}
/* revista */
.revista{background:radial-gradient(ellipse 80% 60% at 50% 60%, #26231f, #0b0b0b 75%)}
.revista.claro{background:var(--hueso); color:var(--tinta)}
.revista .barra{width:100%; display:flex; justify-content:space-between; padding:56px 64px 0; font:600 22px/1 Mont; letter-spacing:.32em; text-transform:uppercase; color:var(--oro); z-index:3}
.historia .revista .barra{padding-top:200px}
.revista.claro .barra{color:#9A7B45}
.revista .mast{margin-top:26px; z-index:1}
.revista .zona{margin-top:-50px; margin-bottom:0; z-index:2; justify-content:flex-end; padding-right:20px}
.revista .lineas{position:absolute; left:64px; bottom:96px; z-index:3; display:flex; flex-direction:column; gap:26px; max-width:400px}
.revista:not(.claro) .lineas div{text-shadow:0 2px 12px rgba(0,0,0,.8)}
.historia .revista .lineas{bottom:340px}
.historia .revista .zona{margin-top:-110px}
.revista .lineas div{font:italic 500 46px/1.04 Playfair}
.revista .lineas b{display:block; font:700 20px/1 Mont; letter-spacing:.3em; color:var(--oro); text-transform:uppercase; margin-bottom:8px; font-style:normal}
.revista.claro .lineas b{color:#9A7B45}
.revista .zona img.prod{width:62%; height:100%; object-position:right bottom}
.revista .sello{position:absolute; right:60px; bottom:96px; z-index:4; width:210px; height:210px; border-radius:50%; background:var(--oro); color:var(--tinta); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; font:800 24px/1.15 Mont; letter-spacing:.12em; text-transform:uppercase; transform:rotate(-10deg)}
.historia .revista .sello{bottom:360px}
/* trio */
.trio{background:var(--hueso); color:var(--tinta)}
.trio.oscuro{background:radial-gradient(ellipse 80% 60% at 50% 50%, #26231f, #0b0b0b 75%); color:#fff}
.trio .zona{gap:0}
.trio .zona img.prod{width:40%; height:88%; margin:0 -40px}
.trio .zona img.prod:nth-child(2){z-index:2; height:96%}
.trio.dos .zona img.prod{width:50%; margin:0 -20px}
.trio .titulo{font:900 84px/1 Playfair; font-style:normal}
.trio:not(.oscuro) .kicker{color:#9A7B45}
.trio:not(.oscuro) .zona img.prod{filter:drop-shadow(0 26px 30px rgba(60,40,10,.3))}
.trio .arriba{text-align:center; padding:0 70px; margin-top:36px; z-index:3}
/* rejilla */
.rejilla{background:#000; display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px}
.rejilla > img{width:100%; height:100%; object-fit:cover; display:block; min-height:0}
.rejilla .medalla{position:absolute; left:50%; top:50%; width:330px; height:330px; transform:translate(-50%,-50%); border-radius:50%; background:#0B0B0C; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 10px #000, 0 0 0 12px var(--oro)}
.rejilla .tira{position:absolute; left:0; right:0; bottom:0; background:#0B0B0C; padding:30px 40px 34px; text-align:center; font:700 26px/1.2 Mont; letter-spacing:.24em; text-transform:uppercase; color:var(--oro)}
.historia .rejilla .tira{padding-bottom:300px}
/* etiqueta */
.etiq .zona img.prod{width:66%; margin-right:24%}
.etiq .tag{position:absolute; right:56px; top:52%; transform:translateY(-50%) rotate(8deg); width:330px; padding:96px 30px 46px; background:var(--hueso); color:var(--tinta); border-radius:22px 22px 30px 30px; text-align:center; z-index:4; box-shadow:0 26px 40px rgba(0,0,0,.45);
  clip-path:polygon(22% 0, 78% 0, 100% 14%, 100% 100%, 0 100%, 0 14%)}
.etiq .tag::before{content:''; position:absolute; left:50%; top:34px; width:34px; height:34px; margin-left:-17px; border-radius:50%; background:#1a1917}
.etiq .tag .l1{font:700 22px/1.3 Mont; letter-spacing:.28em; text-transform:uppercase; color:#9A7B45}
.etiq .tag .l2{font:italic 600 54px/1.02 Playfair; margin-top:14px}
.etiq .tag .l3{font:600 22px/1.3 Mont; letter-spacing:.2em; text-transform:uppercase; margin-top:18px; color:var(--gris)}
.etiq .hilo{position:absolute; right:240px; top:20%; width:3px; height:24%; background:linear-gradient(var(--oro), rgba(205,174,116,.2)); transform:rotate(-24deg); transform-origin:top; z-index:3}
/* tienda */
.tienda{background:#0B0B0C}
.tienda .marco{flex:1; min-height:0; width:calc(100% - 128px); margin:34px 64px 0; border-radius:28px; overflow:hidden; position:relative; box-shadow:0 0 0 2px var(--oro)}
.tienda .marco img{width:100%; height:100%; object-fit:cover; display:block}
.tienda .pie{padding-top:40px}
.tienda .lista{font:600 26px/1.5 Mont; letter-spacing:.22em; text-transform:uppercase; color:var(--oro); margin-top:22px}

/* tandas */
.tanda{background:radial-gradient(ellipse 90% 60% at 50% 40%, #24211d, #0a0a0a 78%)}
.tanda .titulo{font:italic 600 84px/1.02 Playfair}
.tanda .bloque{width:100%; padding:0 80px; text-align:center; z-index:3}
.tanda .puntos{display:grid; grid-template-columns:repeat(5, 1fr); gap:22px; width:760px; margin:44px auto 0}
.tanda .puntos div{aspect-ratio:1; border-radius:50%; border:2px solid rgba(205,174,116,.55); display:flex; align-items:center; justify-content:center; position:relative}
.tanda .puntos div svg{width:52%; height:52%; stroke:var(--oro)}
.tanda .puntos div.si{background:var(--oro); border-color:var(--oro)}
.tanda .puntos div.si svg{stroke:var(--tinta)}
.tanda .puntos div i{position:absolute; bottom:-34px; font:600 18px/1 Mont; letter-spacing:.14em; color:rgba(255,255,255,.55); font-style:normal}
.tanda .resumen{display:flex; justify-content:center; gap:0; margin-top:52px}
.tanda .resumen div{padding:0 34px; text-align:center}
.tanda .resumen div + div{border-left:1px solid rgba(205,174,116,.4)}
.tanda .resumen b{display:block; font:500 92px/1 Playfair; color:var(--oro)}
.tanda .resumen span{font:600 22px/1.3 Mont; letter-spacing:.24em; text-transform:uppercase}
.tanda .pasos{margin:48px auto 0; width:820px; display:flex; flex-direction:column; gap:22px; text-align:left}
.tanda .pasos div{display:flex; gap:26px; align-items:center; font:500 31px/1.3 Mont}
.tanda .pasos b{flex:none; width:66px; height:66px; border-radius:50%; background:var(--oro); color:var(--tinta); display:flex; align-items:center; justify-content:center; font:600 34px/1 Playfair}
.tanda .grande{margin-bottom:40px; font:500 560px/0.8 Playfair; color:var(--oro); letter-spacing:-.04em}
.tanda .formula{font:italic 500 150px/1.02 Playfair; margin-top:30px}
.tanda .formula em{color:var(--oro); font-style:normal; font-family:Mont; font-weight:300}
.tanda .cal{display:grid; grid-template-columns:repeat(5,1fr); gap:14px; width:900px; margin:46px auto 0}
.tanda .cal div{border:1.5px solid rgba(205,174,116,.45); border-radius:18px; padding:16px 0 18px; text-align:center}
.tanda .cal div b{display:block; font:700 18px/1 Mont; letter-spacing:.24em; color:rgba(255,255,255,.6)}
.tanda .cal div span{display:block; font:500 48px/1.1 Playfair; color:var(--oro); margin-top:6px}
.tanda .cal svg{width:44px; height:44px; stroke:#fff; margin-top:6px}
.tanda .versus{display:flex; width:100%; flex:1; min-height:0; margin-top:30px}
.tanda .versus > div{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; min-width:0}
.tanda .versus .fotos{display:flex; align-items:flex-end; justify-content:center; gap:10px; flex:1; min-height:0; width:100%}
.tanda .versus > div + div{border-left:2px solid rgba(205,174,116,.35)}
.tanda .versus img{max-width:88%; max-height:100%; object-fit:contain; filter:drop-shadow(0 26px 30px rgba(0,0,0,.6))}
.tanda .versus h3{font:italic 600 66px/1 Playfair; margin-top:24px}
.tanda .versus .letra{flex:none; margin-bottom:20px; width:84px; height:84px; border-radius:50%; background:var(--oro); color:var(--tinta); font:700 44px/84px Mont; text-align:center}
.tanda .dia{font:700 30px/1 Mont; letter-spacing:.3em; text-transform:uppercase; color:var(--oro)}
.tanda .entrega{font:italic 500 120px/1 Playfair; margin-top:30px}
.tanda .entrega b{font-style:normal; color:var(--oro); font-weight:600}
.tanda .boleto{margin:50px auto 0; width:800px; height:330px; position:relative; background:var(--hueso); color:var(--tinta); border-radius:26px; display:flex; align-items:center;
  -webkit-mask:radial-gradient(circle 34px at 0 50%, transparent 98%, #000) left/51% 100% no-repeat, radial-gradient(circle 34px at 100% 50%, transparent 98%, #000) right/51% 100% no-repeat}
.tanda .boleto .izq{flex:1; padding:0 30px 0 70px; text-align:left}
.tanda .boleto .izq b{font:700 22px/1.2 Mont; letter-spacing:.3em; color:#9A7B45; text-transform:uppercase}
.tanda .boleto .izq div{font:italic 600 66px/1.02 Playfair; margin-top:10px}
.tanda .boleto .der{width:240px; height:100%; border-left:3px dashed #C9BFAE; display:flex; flex-direction:column; align-items:center; justify-content:center}
.tanda .boleto .der span{font:600 22px/1 Mont; letter-spacing:.24em; color:var(--gris)}
.tanda .boleto .der b{display:block; width:120px; height:96px; border-bottom:4px solid var(--tinta); margin:4px 0 16px}
.tanda .fotofondo{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.32}
</style>
<body>
<div id="c"></div>
<script>
const ICON = {}; fetch('iconos.json').then(r => r.json()).then(j => Object.assign(ICON, j));
const svg = (n, extra = '') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${extra}>${ICON[n] || ''}</svg>`;
const logo = (w, negro) => `<img class="logo" src="${window.TRABAJO}/${negro ? 'logo-negro.png' : 'logo-blanco.png'}" style="width:${w}px">`;
const cta = (t, est = 'linea', ic = 'send') => `<div class="cta ${est}">${ic ? svg(ic) : ''}${t}</div>`;
const prod = (src, extra = '') => `<img class="prod" src="${src}" ${extra}>`;
const H = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;');

/* colores: el del producto, oscurecido para fondo */
function hsl(hex) { let [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255); const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let h = 0, s = 0, l = (mx + mn) / 2;
  if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn); h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; } return [h, s * 100, l * 100]; }
function fondoColor(hex) { const [h, s] = hsl(hex || '#555555'); const S = Math.min(s, 55); return [`hsl(${h} ${S}% 30%)`, `hsl(${h} ${S}% 13%)`, `hsl(${h} ${S}% 20%)`]; }

const T = {
  estudio: (o) => `<div class="t estudio">
    <div class="cab">${logo(o.h ? 330 : 240)}</div>
    <div class="zona"><div class="piso"></div>${prod(o.img)}</div>
    <div class="pie"><div class="kicker">${H(o.kicker)}</div><div class="titulo">${H(o.titulo)}</div>${o.sub ? `<div class="sub">${H(o.sub)}</div>` : ''}${cta(o.cta, 'linea')}</div></div>`,
  crema: (o) => `<div class="t crema">
    <div class="gigante">${H(o.palabra)}</div>
    <div class="cab">${logo(o.h ? 250 : 220, true)}<div class="num">${H(o.num || '')}</div></div>
    <div class="zona"><div class="piso"></div>${prod(o.img)}</div>
    <div class="pie"><div><div class="kicker">${H(o.kicker)}</div><div class="titulo">${H(o.titulo)}</div>${o.sub ? `<div class="sub">${H(o.sub)}</div>` : ''}</div>${cta(o.cta, 'negra')}</div></div>`,
  color: (o) => { const [a, b] = fondoColor(o.color); return `<div class="t color" style="background:radial-gradient(ellipse 75% 55% at 50% 48%, ${a}, ${b} 80%)">
    <div class="gigante">${H(o.palabra)}</div>
    <div class="cab">${logo(o.h ? 320 : 270)}</div>
    <div class="zona"><div class="piso"></div>${prod(o.img)}</div>
    <div class="pie"><div class="kicker">${H(o.kicker)}</div><div class="titulo">${H(o.titulo)}</div>${o.sub ? `<div class="sub">${H(o.sub)}</div>` : ''}${cta(o.cta, 'blanca')}</div></div>`; },
  foto: (o) => `<div class="t foto"><img class="fondo" src="${o.img}" style="object-position:${o.pos || '50% 50%'}"><div class="velo"></div>
    <div class="cab">${logo(o.h ? 320 : 270)}</div><div class="zona"></div>
    <div class="pie"><div class="kicker">${H(o.kicker)}</div><div class="titulo">${H(o.titulo)}</div>${o.sub ? `<div class="sub">${H(o.sub)}</div>` : ''}${cta(o.cta, 'oro')}</div></div>`,
  revista: (o) => `<div class="t revista ${o.claro ? 'claro' : ''}">
    <div class="barra"><span>${H(o.num)}</span><span>${H(o.temporada || 'Otoño · Invierno')}</span></div>
    <div class="mast">${logo(o.h ? 760 : 600, o.claro)}</div>
    <div class="zona">${prod(o.img)}</div>
    <div class="lineas">${o.lineas.map(([b, t]) => `<div><b>${H(b)}</b>${H(t)}</div>`).join('')}</div>
    <div class="sello">${o.sello}</div></div>`,
  trio: (o) => `<div class="t trio ${o.oscuro ? 'oscuro' : ''} ${o.imgs.length === 2 ? 'dos' : ''}">
    <div class="cab">${logo(o.h ? 280 : 230, !o.oscuro)}</div>
    <div class="arriba"><div class="kicker">${H(o.kicker)}</div><div class="titulo">${H(o.titulo)}</div></div>
    <div class="zona">${o.imgs.map(i => prod(i)).join('')}</div>
    <div class="pie">${o.sub ? `<div class="sub" style="margin:0 0 6px">${H(o.sub)}</div>` : ''}${cta(o.cta, o.oscuro ? 'linea' : 'negra')}</div></div>`,
  rejilla: (o) => `<div class="t rejilla" style="grid-template-rows:${o.h ? '1fr 1fr 1fr' : '1fr 1fr'}; ${o.h ? '' : 'padding-bottom:110px'}">
    ${o.imgs.map(i => `<img src="${i}">`).join('')}
    <div class="medalla">${logo(250)}</div><div class="tira">${H(o.tira)}</div></div>`,
  etiqueta: (o) => `<div class="t estudio etiq">
    <div class="cab">${logo(o.h ? 320 : 270)}</div>
    <div class="zona"><div class="piso" style="left:38%"></div>${prod(o.img)}</div>
    <div class="hilo"></div>
    <div class="tag"><div class="l1">${H(o.t1)}</div><div class="l2">${H(o.t2)}</div><div class="l3">${H(o.t3)}</div></div>
    <div class="pie"><div class="titulo" style="font-size:80px">${H(o.titulo)}</div>${cta(o.cta, 'linea')}</div></div>`,
  tienda: (o) => `<div class="t tienda">
    <div class="cab" style="padding-top:${o.h ? 200 : 60}px">${logo(o.h ? 320 : 250)}</div>
    <div class="marco"><img src="${o.img}" style="object-position:${o.pos || '50% 50%'}"></div>
    <div class="pie"><div class="titulo" style="font-size:84px">${H(o.titulo)}</div><div class="lista">${H(o.lista)}</div>${cta(o.cta, 'oro')}</div></div>`,

  /* ── tandas ── */
  'tanda-como': (o) => `<div class="t tanda">
    <div class="cab">${logo(o.h ? 300 : 230)}</div>
    <div class="bloque" style="margin-top:${o.h ? 70 : 34}px"><div class="kicker">${H(o.kicker)}</div><div class="titulo">${H(o.titulo)}</div>
      <div class="puntos" style="${o.h ? '' : 'width:620px; gap:18px; margin-top:34px'}">${Array.from({ length: 15 }, (_, i) => `<div>${svg(o.icono)}</div>`).join('')}</div>
      <div class="pasos" style="${o.h ? 'margin-top:90px' : 'margin-top:40px; gap:16px'}">${o.pasos.map((p, i) => `<div><b>${i + 1}</b><span>${H(p)}</span></div>`).join('')}</div>
      ${cta(o.cta, 'oro', 'message-circle')}</div></div>`,
  'tanda-15': (o) => `<div class="t tanda">${o.img ? `<img class="fotofondo" src="${o.img}">` : ''}
    <div class="cab">${logo(o.h ? 300 : 240)}</div>
    <div class="bloque" style="flex:1; display:flex; flex-direction:column; justify-content:center; padding-bottom:${o.h ? 300 : 70}px">
      <div class="kicker">${H(o.kicker)}</div><div class="grande">15</div>
      <div class="resumen"><div><b>15</b><span>personas</span></div><div><b>15</b><span>días</span></div><div><b>1</b><span>${H(o.cosa)}<br>c/u</span></div></div>
      <div class="sub" style="margin-top:44px">${H(o.sub)}</div>${cta(o.cta, 'oro', 'message-circle')}</div></div>`,
  'tanda-formula': (o) => `<div class="t tanda">
    <div class="cab">${logo(o.h ? 300 : 240)}</div>
    <div class="bloque" style="flex:1; display:flex; flex-direction:column; justify-content:center; padding-bottom:${o.h ? 300 : 70}px">
      <div class="kicker">${H(o.kicker)}</div>
      <div class="formula">1 ${H(o.cosa)}<br><em>÷</em> 15 días</div>
      <div class="titulo" style="margin-top:50px; font-size:80px; color:var(--oro)">${H(o.titulo)}</div>
      <div class="sub">${H(o.sub)}</div>${cta(o.cta, 'oro', 'message-circle')}</div></div>`,
  'tanda-cal': (o) => `<div class="t tanda">
    <div class="cab">${logo(o.h ? 300 : 220)}</div>
    <div class="bloque" style="margin-top:${o.h ? 70 : 30}px"><div class="kicker">${H(o.kicker)}</div><div class="titulo" style="font-size:${o.h ? 84 : 70}px">${H(o.titulo)}</div>
      <div class="cal" style="${o.h ? '' : 'gap:12px; margin-top:34px'}">${Array.from({ length: 15 }, (_, i) => `<div><b>DÍA</b><span>${i + 1}</span>${svg(o.icono)}</div>`).join('')}</div>
      <div class="sub" style="margin-top:${o.h ? 60 : 34}px">${H(o.sub)}</div>${cta(o.cta, 'oro', 'message-circle')}</div></div>`,
  'tanda-boleto': (o) => `<div class="t tanda">${o.img ? `<img class="fotofondo" src="${o.img}">` : ''}
    <div class="cab">${logo(o.h ? 300 : 240)}</div>
    <div class="bloque" style="flex:1; display:flex; flex-direction:column; justify-content:center; padding-bottom:${o.h ? 300 : 60}px">
      <div class="kicker">${H(o.kicker)}</div><div class="titulo">${H(o.titulo)}</div>
      <div class="boleto"><div class="izq"><b>${H(o.b1)}</b><div>${H(o.b2)}</div></div><div class="der"><span>LUGAR</span><b>__</b><span>DE 15</span></div></div>
      <div class="sub" style="margin-top:46px">${H(o.sub)}</div>${cta(o.cta, 'oro', 'message-circle')}</div></div>`,
  'tanda-versus': (o) => `<div class="t tanda">
    <div class="cab">${logo(o.h ? 300 : 230)}</div>
    <div class="bloque" style="margin-top:${o.h ? 60 : 26}px"><div class="kicker">${H(o.kicker)}</div><div class="titulo">${H(o.titulo)}</div></div>
    <div class="versus">${o.lados.map(([l, im, t]) => `<div><span class="letra">${l}</span><div class="fotos">${im.map(i => `<img src="${i}" style="${im.length > 1 ? 'max-width:46%' : ''}">`).join('')}</div><h3>${H(t)}</h3></div>`).join('')}</div>
    <div class="pie" style="padding-top:20px"><div class="sub" style="margin:0">${H(o.sub)}</div></div></div>`,
  'tanda-dia': (o) => `<div class="t tanda">
    <div class="cab">${logo(300)}</div>
    <div class="bloque" style="flex:1; display:flex; flex-direction:column; justify-content:center; padding-bottom:300px">
      <div class="dia">${H(o.kicker)}</div>
      <div class="entrega">Día <b>${o.n}</b><span style="font-size:60px"> de 15</span></div>
      <div class="puntos" style="margin-top:70px; row-gap:58px">${Array.from({ length: 15 }, (_, i) => `<div class="${i < o.n ? 'si' : ''}">${svg(o.icono)}<i>${i + 1}</i></div>`).join('')}</div>
      <div class="titulo" style="margin-top:90px; font-size:70px">${H(o.titulo)}</div>
      <div class="sub">${H(o.sub)}</div></div></div>`,
};

/* el título se encoge hasta caber en sus renglones */
function ajustar() {
  for (const el of document.querySelectorAll('#c .titulo, #c .formula, #c .revista .lineas div')) {
    const max = +(el.dataset.renglones || (el.closest('.revista') ? 3 : 3));
    let fs = parseFloat(getComputedStyle(el).fontSize); const lh = () => parseFloat(getComputedStyle(el).lineHeight) || fs * 1.05;
    while (el.scrollHeight > lh() * max + 4 && fs > 36) { fs -= 3; el.style.fontSize = fs + 'px'; }
  }
}
window.pintar = async (o) => {
  const c = document.getElementById('c');
  c.className = o.formato === 'historia' ? 'historia' : 'feed';
  o.h = o.formato === 'historia';
  c.innerHTML = T[o.tipo](o);
  await document.fonts.ready;
  await Promise.all([...c.querySelectorAll('img')].map(i => i.decode().catch(() => {})));
  ajustar();
  /* comprobaciones: nada se sale del lienzo y el texto no se encima */
  const W = c.clientWidth, Hh = c.clientHeight, malos = [];
  for (const el of c.querySelectorAll('.titulo,.sub,.cta,.kicker,.lineas,.sello,.tag,.pasos,.cal,.puntos,.resumen,.boleto,.tira,.lista')) {
    const r = el.getBoundingClientRect(); if (r.left < -1 || r.right > W + 1 || r.top < -1 || r.bottom > Hh + 1) malos.push(el.className + ' fuera');
  }
  const pie = c.querySelector('.pie'), zona = c.querySelector('.zona');
  if (zona && zona.clientHeight < 300 && !c.querySelector('.foto')) malos.push('poca foto ' + zona.clientHeight);
  return malos;
};
window.listo = true;
</script>
