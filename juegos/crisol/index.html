<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0B0712">
<!-- Sin esto el navegador pide /favicon.ico, se lleva un 404 y la pestaña sale
     en blanco. Va empotrado como SVG en la propia etiqueta: cero peticiones. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B0712'/%3E%3Cpath d='M8 7h16l-3 9 3 9H8l3-9z' fill='%23AC27FF'/%3E%3Ccircle cx='16' cy='19' r='3' fill='%23FFC53D'/%3E%3C/svg%3E">
<title>CRISOL — el sandbox de reacciones</title>
<meta name="description" content="Sandbox de píxeles con química, termodinámica y electricidad de verdad. 48 elementos, reacciones reales, circuitos y compuertas lógicas.">
<style>
:root{
  --vacio:#0B0712; --sup:#1A1424; --sup2:#241B32; --violeta:#AC27FF;
  --hueso:#E9E4E4; --oro:#FFC53D; --menta:#3DFFC5;
  --ab:env(safe-area-inset-bottom,0px); --ar:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* ⚠ EL MENÚ SE LE SUBÍA A CARLOS EN SU NAVEGADOR, y la causa es de manual en
   iPhone: `height:100%` mide el viewport SIN contar que la barra de
   direcciones de Safari aparece y desaparece al hacer scroll. Cuando se
   recoge, el documento mide más que la ventana y el panel de abajo se va
   hacia arriba de la pantalla.
   `100dvh` —dynamic viewport height— sí sigue a la barra. Va con `100vh` de
   respaldo primero, para los navegadores que no lo conocen: el orden importa,
   porque el segundo pisa al primero sólo donde se entiende. */
html{height:100%}
body{
  margin:0; overflow:hidden; overscroll-behavior:none;
  height:100vh; height:100dvh;
  background:var(--vacio);color:var(--hueso);
  font:14px/1.4 ui-rounded,-apple-system,"Segoe UI",system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;
  display:flex;flex-direction:column;
  padding-top:var(--ar);
}

/* ── barra de arriba ───────────────────────────────────────────────────── */
#barra{
  display:flex;align-items:center;gap:8px;padding:7px 10px;
  background:var(--sup);flex:0 0 auto;
}
#barra b{font-size:15px;letter-spacing:.06em}
#datos{margin-left:auto;font-size:11.5px;color:#9C93AB;text-align:right;line-height:1.3}
.icono{
  border:0;background:var(--sup2);color:var(--hueso);border-radius:11px;
  width:44px;height:44px;font-size:17px;cursor:pointer;flex:0 0 auto;
}
.icono.on{background:var(--violeta);color:#fff}
.icono:focus-visible{outline:3px solid var(--oro);outline-offset:2px}

/* ── el mundo ──────────────────────────────────────────────────────────── */
#zona{flex:1 1 auto;position:relative;min-height:0;background:#07040D}
#mundo{
  position:absolute;inset:0;width:100%;height:100%;
  image-rendering:pixelated;touch-action:none;display:block;
}

/* ── panel de abajo ────────────────────────────────────────────────────── */
/* ⚠ EL PANEL SE COMÍA EL SUELO DE LA HABITACIÓN, y Carlos lo reportó dos
   veces: «tu menú aún en oculto se encima al suelo y no lo deja ver, así que
   parece que se cae al vacío lo que pones». Y era literal: con `position:
   fixed` el panel flota ENCIMA, y el lienzo del mundo seguía midiendo la
   pantalla entera y dibujando debajo. Las últimas cincuenta filas del mundo
   existían y se simulaban — simplemente no se veían nunca.
   Ahora el panel vive en el FLUJO, así que el mundo se encoge de verdad y la
   cámara recalcula su área visible. Lo de `fixed` estaba para que la barra de
   Safari no lo moviera, y eso ya lo resuelve el `100dvh` del body. */
#panel{
  position:relative; z-index:8; flex:0 1 auto; min-height:0;
  background:var(--sup); display:flex; flex-direction:column;
  max-height:52dvh;
  padding-bottom:var(--ab);
  box-shadow:0 -10px 30px rgba(0,0,0,.5);
}
/* Plegado: el panel se queda en su tirador y el mundo se lleva el resto. Se
   hace con `display:none` en el contenido y no con `translateY`, justamente
   porque mover algo con transform NO cambia el espacio que ocupa — y ese era
   medio problema. */
#panel.plegado > *:not(#tirador){ display:none !important }
#tirador{
  height:52px; flex:0 0 auto; display:flex; align-items:center; gap:10px;
  padding:0 12px; cursor:pointer; background:none; border:0; color:inherit;
  font:inherit; font-weight:700; width:100%; text-align:left;
}
#tirador .asa{
  width:38px; height:5px; border-radius:99px; background:#6E6880; flex:0 0 auto;
}
#tirador .qual{ font-size:13px; color:#B9B0C8; flex:1; }
#tirador .flecha{ font-size:13px; color:#9C93AB }
@media (prefers-reduced-motion: reduce){ #panel{transition:none} }
#pestanas{display:flex;gap:4px;padding:6px 8px 0;overflow-x:auto;flex:0 0 auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:thin}
.pes{
  border:0;background:transparent;color:#9C93AB;font:inherit;font-weight:700;
  font-size:12.5px;padding:0 13px;height:44px;border-radius:9px;cursor:pointer;
  white-space:nowrap;flex:0 0 auto;
}
.pes.sel{background:var(--sup2);color:var(--hueso)}
.pes:focus-visible{outline:3px solid var(--oro);outline-offset:-2px}

/* ⚠ `overflow-y:auto` NO BASTA DENTRO DE UN FLEX, y por eso Carlos decía que
   «el menú de abajo no hace scroll en los elementos cuando está muy lleno».
   Un hijo de flex tiene `min-height:auto` por defecto, o sea que se niega a
   encogerse por debajo de su contenido: la lista crecía y crecía, se salía
   del panel, y el `auto` no llegaba a activarse nunca porque nunca había
   desbordamiento QUE MEDIR. El `min-height:0` es lo que le da permiso de ser
   más chica que lo que lleva dentro, y ahí sí aparece el scroll.
   `touch-action:pan-y` es la otra mitad: el lienzo de al lado lo tiene en
   `none` para pintar, y sin decirlo aquí el dedo tampoco arrastra la lista. */
#cuerpoPanel{display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
#lista{
  overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y;
  flex:1 1 auto; min-height:0; overscroll-behavior:contain;
  padding:8px; display:flex; flex-wrap:wrap; gap:6px; align-content:flex-start;
}
.el{
  display:flex;align-items:center;gap:7px;border:0;cursor:pointer;font:inherit;
  background:var(--sup2);color:var(--hueso);border-radius:11px;
  padding:0 11px 0 8px;height:44px;font-size:12.5px;font-weight:600;
}
.el .ico{font-size:15px;line-height:1;flex:0 0 auto}
.el i{width:17px;height:17px;border-radius:5px;display:block;flex:0 0 auto;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.el.sel{box-shadow:inset 0 0 0 2px var(--menta)}
.el:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
.el.nuevo::after{content:'nuevo';font-size:9.5px;color:var(--oro);font-weight:800}

#herr{display:flex;gap:6px;padding:0 8px 8px;align-items:center;flex-wrap:wrap}
#herr label{font-size:11.5px;color:#9C93AB}
input[type=range]{flex:1 1 90px;min-width:80px;accent-color:var(--violeta);height:34px}

.aviso{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:12px;background:rgba(26,20,36,.95);padding:9px 15px;border-radius:11px;
  font-size:13px;box-shadow:inset 0 0 0 1px rgba(255,197,61,.35);
  pointer-events:none;opacity:0;transition:opacity .25s ease;max-width:88%;
  text-align:center;
}
.aviso.va{opacity:1}
/* Carlos: «pon un indicador de la escala que llevo en el zoom porque es
   difícil saber cuándo tengo y cuándo no tengo zoom». */
#escala{
  margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;
  font-size:13px;color:#B9B0C8;background:var(--sup2);
  padding:0 11px;height:44px;display:flex;align-items:center;border-radius:11px;
}
/* La ficha del termómetro. Sale pegada al mensaje y se lee de un vistazo. */
#ficha{
  position:absolute;left:10px;right:10px;bottom:10px;z-index:6;
  background:rgba(26,20,36,.97);border-radius:13px;padding:11px 13px;
  box-shadow:inset 0 0 0 1px rgba(172,39,255,.4);font-size:12.5px;
  display:none;max-height:52%;overflow-y:auto;
}
#ficha.va{display:block}
#salas,
#grav{
  position:absolute;left:10px;right:10px;bottom:10px;z-index:7;display:none;
  background:rgba(26,20,36,.98);border-radius:13px;padding:12px 13px 10px;
  box-shadow:inset 0 0 0 1px rgba(61,255,197,.4);font-size:12.5px;
  max-height:76%;overflow-y:auto;touch-action:pan-y;
}
#salas.va,
#grav.va{display:block}
/* ⚠ EL PANEL TAPABA LA HABITACIÓN. Mientras estaba abierto ocupaba tres
   cuartos de la sala, así que «dibuja una zona» o «toca para poner el punto»
   eran imposibles: el dedo caía en el panel. Cuando hay algo que colocar se
   encoge a una tira con la instrucción, y la sala queda libre. */
#grav.mini{max-height:none;top:auto}
#grav.mini > *:not(h4):not(.cerrar):not(#gPista){display:none}
#gPista{display:none;color:var(--menta);margin-top:2px;line-height:1.35}
#grav.mini #gPista{display:block}
#grav h4{margin:0 0 8px;font-size:14.5px}
.gfila{display:flex;align-items:center;gap:6px;margin-bottom:7px;flex-wrap:wrap}
.gfila > label{color:#9C93AB;min-width:64px}
.gfila .gu{color:#9C93AB;font-size:11.5px}
.gfila input[type=number]{width:74px;height:38px;border-radius:9px;border:0;
  background:var(--sup2);color:var(--hueso);font:inherit;padding:0 9px;text-align:right}
.gfila select{height:38px;border-radius:9px;border:0;background:var(--sup2);
  color:var(--hueso);font:inherit;padding:0 8px;flex:1;min-width:130px}
.gb{border:0;background:var(--sup2);color:var(--hueso);border-radius:9px;
  min-width:44px;height:38px;font:inherit;font-weight:600;cursor:pointer;padding:0 12px}
.gb.ancho{flex:1;min-width:130px}
.gb.on{background:var(--menta);color:#0B0712}
.gb:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
#gLista{margin-top:4px}
.gcampo{display:flex;align-items:center;gap:7px;padding:5px 0;border-top:1px solid #2B2338}
.gcampo span{flex:1;color:#B9B0C8}
.gcampo button{border:0;background:var(--sup2);color:var(--hueso);border-radius:8px;
  height:34px;min-width:38px;font:inherit;cursor:pointer;padding:0 9px}
#ficha h4{margin:0 0 6px;font-size:14.5px}
#ficha table{border-collapse:collapse;width:100%}
#ficha td{padding:2px 0;vertical-align:top}
#ficha td:first-child{color:#9C93AB;padding-right:10px;white-space:nowrap}
#ficha .cerrar{position:absolute;top:6px;right:8px;background:none;border:0;
  color:#9C93AB;font-size:19px;cursor:pointer;width:34px;height:34px}
@media (prefers-reduced-motion: reduce){ .aviso{transition:none} }
</style>

<body>
<div id="barra">
  <b>CRISOL</b>
  <button class="icono" id="bPausa" aria-label="Pausar">❚❚</button>
  <button class="icono" id="bDeshace" aria-label="Deshacer" title="Deshacer lo último que pintaste">↩</button>
  <button class="icono" id="bGuarda" aria-label="Guardar y cargar" title="Guardar esta sala o cargar una guardada">💾</button>
  <button class="icono" id="bBorra" aria-label="Vaciar" title="Vaciar la sala. Pregunta antes">🗑</button>
  <div id="datos"></div>
</div>

<div id="zona">
  <canvas id="mundo"></canvas>
  <div class="aviso" id="aviso"></div>
  <div id="ficha" role="status"><button class="cerrar" id="fichaX" aria-label="Cerrar">✕</button><div id="fichaC"></div></div>
  <div id="salas" role="dialog" aria-label="Salas guardadas">
    <button class="cerrar" id="salasX" aria-label="Cerrar">✕</button>
    <h4>Salas guardadas</h4>
    <div id="salasLista"></div>
    <p style="margin:8px 0 0;opacity:.7">Se guardan en este teléfono. Sólo los materiales: lo que esté cayendo o ardiendo empieza de nuevo.</p>
  </div>
  <div id="grav" role="dialog" aria-label="Gravedad">
    <button class="cerrar" id="gravX" aria-label="Cerrar">✕</button>
    <h4>Gravedad</h4>
    <div class="gfila">
      <label for="gMag">Fuerza</label>
      <input type="number" id="gMag" value="9.81" step="0.5" min="-100" max="100">
      <span class="gu">m/s²</span>
    </div>
    <div class="gfila gdir">
      <span>Dirección</span>
      <button class="gb" data-dir="abajo" title="Hacia abajo">↓</button>
      <button class="gb" data-dir="arriba" title="Hacia arriba">↑</button>
      <button class="gb" data-dir="izq" title="Hacia la izquierda">←</button>
      <button class="gb" data-dir="der" title="Hacia la derecha">→</button>
    </div>
    <div class="gfila">
      <button class="gb ancho" id="gGlobal">Aplicar a toda la sala</button>
      <button class="gb ancho" id="gNormal">Volver a 9.81 ↓</button>
    </div>
    <div class="gfila">
      <button class="gb ancho" id="gZona">Dibujar una zona</button>
      <select id="gModo" aria-label="Cómo actúa la zona">
        <option value="reemplaza">reemplaza la global</option>
        <option value="suma">se suma a la global</option>
      </select>
    </div>
    <div class="gfila">
      <button class="gb ancho" id="gPunto">Poner un punto que atrae</button>
      <button class="gb" id="gRepele" title="Atrae o repele">atrae</button>
      <input type="number" id="gRadio" value="40" min="4" max="400" step="4" aria-label="Radio">
      <span class="gu">radio</span>
    </div>
    <div class="gfila">
      <button class="gb ancho" id="gObjeto">Pintar gravedad en un objeto</button>
      <input type="number" id="gMul" value="0" step="0.5" min="-4" max="6" aria-label="Multiplicador">
      <span class="gu">×</span>
    </div>
    <div class="gfila"><label><input type="checkbox" id="gFlechas" checked> Ver las flechas del campo</label></div>
    <div id="gPista"></div>
    <div id="gLista"></div>
  </div>
</div>

<div id="panel">
  <button id="tirador" aria-expanded="true" aria-controls="cuerpoPanel">
    <span class="asa"></span>
    <span class="qual" id="qual">Arena</span>
    <span class="flecha" id="flecha">▾ ocultar</span>
  </button>
  <div id="cuerpoPanel">
  <div id="pestanas"></div>
  <div id="lista"></div>
  <div id="herr">
    <label>Pincel <span id="tamN">4</span></label>
    <input type="range" id="tam" min="1" max="14" value="4">
    <label id="flexL" hidden>Cuerda <span id="flexN">tiesa</span></label>
    <input type="range" id="flex" min="0" max="100" value="0" hidden>
    <button class="icono" id="bCalor" aria-label="Calentar" title="Calentar">🔥</button>
    <button class="icono" id="bFrio" aria-label="Enfriar" title="Enfriar">❄️</button>
    <button class="icono" id="bMano" aria-label="Mover la vista" title="Mover la vista: arrastra con un dedo">🖐</button>
    <button class="icono" id="bAgarra" aria-label="Agarrar y arrastrar" title="Agarrar un sólido y arrastrarlo con fuerza">✊</button>
    <button class="icono" id="bMide" aria-label="Termómetro" title="Termómetro: material, temperatura y cambios de estado">🌡</button>
    <button class="icono" id="bGrav" aria-label="Gravedad" title="Gravedad: global, por zona, por objeto y puntos que atraen o repelen">🌍</button>
    <button class="icono" id="bSolda" aria-label="Soldar estructura" title="Soldar: pinta encima lo que quieras que sea UNA pieza. Vuelve a tocarlo con el botón para despegarlo">🔗</button>
    <button class="icono" id="bNido" aria-label="Poner un hormiguero" title="Hormiguero: toca para poner un nido. Vuelve a tocar el botón para cambiar de raza">🐜</button>
    <button class="icono" id="bSer" aria-label="Poner una personita" title="Personitas: toca para soltar una. Vuelve a tocar el botón para cambiar entre persona y bicho">🚶</button>
    <button class="icono" id="bPistola" aria-label="Poner una pistola" title="Pistola: toca para ponerla armada y cargada. Tócala otra vez para disparar. Vuelve a tocar el botón para voltearla o cambiarle el cañón">🔫</button>
    <button class="icono on" id="bRigido" aria-label="Cuerpos rígidos" title="Cuerpos rígidos: lo que está pegado cae junto. Apágalo y vuelve a ser grano por grano">🧱</button>
    <button class="icono" id="bMas" aria-label="Acercar">＋</button>
    <button class="icono" id="bMenos" aria-label="Alejar">－</button>
    <span id="escala" title="Zoom actual">×4.0</span>
  </div>
  </div>
</div>

<script type="module">
import { Mundo, IDS, IDX, EL, VACIO, AMBIENTE } from './motor.js';
import { instalaHormigas, RAZAS, NOMBRES } from './hormigas.js';
import { instalaVida } from './vida.js';
import * as PIEZAS from './piezas.js';

/* ═══════════════════════════════════════════════════════════════════════════
   LA PANTALLA
   ⚠ El motor tiene sus 26 pruebas en verde, y eso NO garantiza que esto
   funcione: en Guerra de Puercos las 74 del motor pasaban con el modo a
   distancia muerto. Esta parte se prueba con un navegador de verdad.
   ═════════════════════════════════════════════════════════════════════════ */

const cv = document.getElementById('mundo');
const ctx = cv.getContext('2d', { alpha:false });
const $ = id => document.getElementById(id);

/* ── LA SALA ───────────────────────────────────────────────────────────
   Carlos: «quiero una sala de crisol mucho más grande para que me quepan
   todas mis locuras» y «que pueda hacer zoom». Van juntas: una sala grande
   sin zoom es una sala que no se ve.

   El mundo tiene AHORA UN TAMAÑO PROPIO, mucho mayor que la pantalla, y lo
   que ves es una ventana que se mueve por encima. El dibujo se hace al mundo
   entero en un lienzo aparte y luego se recorta — así el zoom no cuesta nada,
   porque es la misma imagen mirada más de cerca. */
const SALA_AN = 320, SALA_AL = 480;
let M, img, datos, an = SALA_AN, al = SALA_AL;
let HOR = null;                       /* la colonia de hormigas */
let SER = null;                       /* las personitas y los bichos */
let quienSer = 'persona';             /* cuál se suelta al tocar */
let serPuesto = false;
let razaNido = 'negra';               /* cuál se suelta al tocar */
let nidoPuesto = false;               /* un nido por trazo, no uno por celda */
/* Las pistolas puestas, con su chispa. Sin esta lista no hay gatillo: una
   pistola de la que no se sabe dónde tiene la culata es un adorno. */
let pistolas = [];
let pistolaPuesta = false;            /* una por trazo, no una por celda */
let miraPistola = 1;                  /* hacia dónde apunta la siguiente */
let canonPistola = 'metal';
let lienzoMundo = null, ctxMundo = null;
/* la ventana: qué trozo del mundo se ve */
const vista = { x:0, y:0, esc:4 };

function limitaVista(){
  const z = document.getElementById('zona').getBoundingClientRect();
  vista.esc = Math.max(1.2, Math.min(14, vista.esc));
  const anVis = z.width / vista.esc, alVis = z.height / vista.esc;
  vista.x = Math.max(0, Math.min(an - anVis, vista.x));
  vista.y = Math.max(0, Math.min(al - alVis, vista.y));
  if(anVis >= an) vista.x = (an - anVis) / 2;
  if(alVis >= al) vista.y = (al - alVis) / 2;
}

function medir(){
  const z = document.getElementById('zona').getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(z.width * dpr); cv.height = Math.round(z.height * dpr);
  cv.style.width = z.width + 'px'; cv.style.height = z.height + 'px';
  if(M){ limitaVista(); return; }
  const nuevo = new Mundo(an, al);
  M = nuevo;
  /* Las hormigas se cuelgan del mundo desde fuera: si `hormigas.js` no
     cargara, todo lo demás seguiría igual. */
  HOR = instalaHormigas(M);
  /* las personitas y los bichos, también colgados desde fuera */
  SER = instalaVida(M);
  /* El mundo se dibuja completo aquí, y la pantalla sólo recorta. Al girar el
     teléfono no se pierde nada porque el mundo no cambia de tamaño: cambia la
     ventana. */
  lienzoMundo = document.createElement('canvas');
  lienzoMundo.width = an; lienzoMundo.height = al;
  ctxMundo = lienzoMundo.getContext('2d', { alpha:false });
  img = ctxMundo.createImageData(an, al);
  datos = img.data;
  for(let i = 3; i < datos.length; i += 4) datos[i] = 255;
  vista.x = an / 2 - 48; vista.y = al - 90;
  limitaVista();
}

/* colores precalculados: convertir '#RRGGBB' 30 000 veces por cuadro es
   exactamente como se pierden los fotogramas en un teléfono */
const RGB = EL.map(e => {
  const h = e.col.replace('#','');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
});
/* ruido fijo por celda, para que la arena no se vea como una mancha plana */
let RUIDO = null;

/* ── LA ONDA, PINTADA COMO UNA ONDA ────────────────────────────────────────
   Carlos mandó cuatro capturas de una explosión de nitroglicerina: «para que
   entiendas por qué está mal hecha». En todas se ve lo mismo — un pegote lila
   plano, opaco, del tamaño de la pantalla, sin forma y sin frente. Y en una de
   ellas el contador decía 148 CELDAS mientras media pantalla estaba morada,
   que es la pista: eso no era materia, era la capa de presión.

   El defecto era del tinte, no de la física. Se pintaba `min(1, P/70)`, así
   que TODO lo que pasara de 70 salía del mismo color: una onda cuyo frente
   vale 1 100 y cuya cola vale 80 se pinta entera igual, y en vez de un anillo
   se ve una mancha. Y el suelo estaba en 1.5, o sea que el rescoldo también
   pintaba: medido, a los 200 pasos el pico ya era 24 —la onda prácticamente
   no existe— y seguía tiñendo 21 557 celdas de lila.

   Ahora la escala es RELATIVA al pico que hay en la sala y el suelo sube con
   él: se ve el frente, se ve cómo se apaga, y cuando la onda se muere la sala
   vuelve a estar limpia. Y el tinte pesa la mitad, para que se vea A TRAVÉS
   de la onda lo que hay debajo. */
let picoVista = 0;
function pinta(){
  const { t, temp, car } = M;
  const hayLuz = M.hayLuz;
  const esc = picoVista > 25 ? picoVista : 25;
  const pisoP = esc * 0.10;
  const fuerzaP = P => { const f = (P - pisoP) / (esc - pisoP); return f > 1 ? 1 : f * f; };
  let picoAhora = 0;
  if(!RUIDO || RUIDO.length !== t.length){
    RUIDO = new Int8Array(t.length);
    for(let i = 0; i < RUIDO.length; i++) RUIDO[i] = ((Math.random()*22)|0) - 11;
  }
  for(let k = 0; k < t.length; k++){
    const tipo = t[k];
    const c = RGB[tipo];
    let r = c[0], g = c[1], b = c[2];
    { const a = M.pres[k]; if(a > picoAhora) picoAhora = a; }
    if(tipo === VACIO){
      /* ⚠ Carlos: «es difícil saber dónde está esa zona si no hay un material
         abajo». Y era literal: el vacío se pintaba siempre del mismo negro,
         así que una zona calentada o enfriada era INVISIBLE hasta que le
         echabas algo encima. Un campo que no se ve no se puede usar. */
      const T = M.temp[k];
      if(T > 40){ const f = Math.min(1, (T - 40) / 700);
        r += f*170; g += f*58; b += f*14; }
      else if(T < 8){ const f = Math.min(1, (8 - T) / 55);
        r += f*8; g += f*46; b += f*96; }
      const P = M.pres[k];
      if(P > pisoP){ const f = fuerzaP(P); r += f*70; g += f*70; b += f*95; }
    }
    if(tipo !== VACIO){
      const n = RUIDO[k];
      r += n; g += n; b += n;
      /* lo caliente se ve caliente y lo helado se ve helado: el calor es
         invisible si no se pinta, y entonces la termodinámica no existe
         para quien juega */
      const T = temp[k];
      if(T > 120){ const f = Math.min(1, (T - 120) / 900); r += f*170; g += f*55; }
      else if(T < 0){ const f = Math.min(1, -T / 60); b += f*70; g += f*30; }
      if(car[k]){ r += 70; g += 90; b += 30; }
      /* La presión SE PINTA. Una onda expansiva que no se ve no es una onda:
         es un número. Se tiñe de blanco hacia el azul según la fuerza. */
      const P = M.pres[k];
      if(P > pisoP){ const f = fuerzaP(P); r += f*95; g += f*95; b += f*120; }
      /* un interruptor cerrado se ve cerrado */
      if(EL[tipo].interruptor && M.vida[k]){ g += 60; }
    }
    /* ── LA LUZ, PINTADA ────────────────────────────────────────────────
       Carlos: «no tenemos iluminación… la lámpara no produce iluminación, de
       hecho es una textura o un icono que parpadea». Ahora el motor calcula un
       campo de luz de verdad y aquí se APLICA: lo iluminado se aclara y tira a
       cálido, y lo que queda en sombra se ve como lo que es, una sombra.
       Sólo se aplica si hay algún foco encendido — si no, la habitación se
       pinta igual que siempre y no se paga nada. */
    if(hayLuz){
      const lu = M.luz[k];
      if(lu > 0){
        const f = 1 + lu * 0.055;
        r = r * f + lu * 3.2; g = g * f + lu * 2.4; b = b * f + lu * 0.9;
      } else if(tipo !== VACIO){
        r *= 0.42; g *= 0.42; b *= 0.5;      /* en sombra, pero se ve */
      }
    }
    const p = k << 2;
    datos[p]   = r < 0 ? 0 : r > 255 ? 255 : r;
    datos[p+1] = g < 0 ? 0 : g > 255 ? 255 : g;
    datos[p+2] = b < 0 ? 0 : b > 255 ? 255 : b;
  }
  /* el pico de ESTE cuadro manda en el siguiente. Un cuadro de retraso no se
     ve y evita tener que recorrer la sala dos veces. */
  picoVista = picoVista * 0.88 + picoAhora * 0.12;
  if(picoAhora > picoVista) picoVista = picoAhora;
  /* ── LAS HORMIGAS, ENCIMA DE TODO ───────────────────────────────────────
     Se escriben directo en los píxeles del mundo, no con `fillRect` sobre el
     lienzo de la ventana: así crecen con el zoom como cualquier celda, en vez
     de quedarse de un tamaño fijo y desaparecer al alejarse. Y por eso miden
     uno o dos píxeles de verdad — el tamaño es el que pidió, no un adorno.
     La que va cargando comida lleva un punto claro encima: sin él no hay
     forma de ver que el acarreo existe, que es media función. */
  if(HOR && HOR.hormigas.length){
    for(const h of HOR.hormigas){
      if(!h.viva) continue;
      const R = RAZAS[h.raza], col = RGB_RAZA[h.raza];
      for(let dy = 0; dy < R.talla; dy++) for(let dx = 0; dx < R.talla; dx++){
        const nx = h.x + dx, ny = h.y + dy;
        if(nx < 0 || ny < 0 || nx >= an || ny >= al) continue;
        const p = ((ny * an + nx) << 2);
        datos[p] = col[0]; datos[p+1] = col[1]; datos[p+2] = col[2];
      }
      if(h.carga && h.y - 1 >= 0){
        const p = (((h.y - 1) * an + h.x) << 2);
        datos[p] = 236; datos[p+1] = 226; datos[p+2] = 150;
      }
    }
  }
  ctxMundo.putImageData(img, 0, 0);

  /* y ahora la ventana. `imageSmoothingEnabled` en falso o el zoom se ve
     como una foto borrosa en vez de píxeles. */
  const z = cv.width, w = cv.height;
  const dpr = cv.width / parseFloat(cv.style.width);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#07040D';
  ctx.fillRect(0, 0, cv.width, cv.height);
  const anVis = (cv.width / dpr) / vista.esc, alVis = (cv.height / dpr) / vista.esc;
  ctx.drawImage(lienzoMundo, vista.x, vista.y, anVis, alVis,
                0, 0, cv.width, cv.height);
  pintaSeres(dpr);
  pintaFlechas();
}

/* ── LAS PERSONITAS ───────────────────────────────────────────────────────
   ⚠ ÉSTAS NO SE PINTAN EN LOS PÍXELES DEL MUNDO, y es la diferencia con las
   hormigas. Una hormiga ES una casilla; un monigote son huesos con
   articulaciones a media casilla de precisión, y metido en la rejilla se
   convertiría en una mancha de cinco píxeles. Van sobre el lienzo de la
   VENTANA, con líneas de verdad, y por eso hay que pasar sus coordenadas de
   celdas a píxeles de pantalla a mano.

   `postura()` ya devuelve el esqueleto entero —caderas, hombros, cuello,
   cabeza, dos o cuatro patas, brazos y dónde va lo que carga—, así que aquí
   no se decide ninguna pose: sólo se traza lo que el módulo calculó. */
/* ── LAS PERSONITAS, VESTIDAS ─────────────────────────────────────────────
   Carlos: «prioriza desde aquí hacer más estéticas las personitas».

   Antes eran un alambre de un solo color: mismo tono para piernas, torso,
   brazos y cabeza, sin contorno. A tamaño de teléfono eso se lee como un
   garabato, y veinte de ellos se leen como el MISMO garabato veinte veces.

   Lo que cambia, y por qué cada cosa:

     · CONTORNO OSCURO DEBAJO. Un trazo más gordo y oscuro por detrás del
       dibujo. Es lo que hace que la figura se vea sobre lava, sobre agua y
       sobre tierra sin cambiar de color: sin él, un monigote de piel clara
       desaparece encima de la arena.
     · ROPA. Pantalón en las piernas, camisa en el torso y los brazos, piel
       sólo en cabeza y manos. Es lo que convierte un alambre en una persona.
     · PALETA POR PERSONA, sacada de su id. Cinco camisas, cuatro pantalones,
       cuatro pelos, cuatro pieles: una multitud deja de parecer clonada, y
       cada quien conserva su ropa toda la vida porque el id no cambia.
     · CARA. Un ojo del lado al que mira y pelo encima. Con eso se lee hacia
       dónde va sin dibujar una expresión.
     · Y EL QUE SUFRE SIGUE PONIÉNDOSE ROJO, que es lo que ya había y funciona:
       la piel vira, la ropa se apaga, y el muerto se va entero a gris. */
const CAMISAS   = ['#C2410C', '#1D4ED8', '#15803D', '#7C3AED', '#B91C1C'];
const PANTALONES = ['#334155', '#3F3F46', '#1E3A5F', '#44403C'];
const PELOS     = ['#2B2118', '#4A3524', '#12100F', '#6B4423'];
const PIELES    = [[236, 200, 168], [214, 168, 128], [176, 128, 92], [122, 84, 58]];

/* el gris al que todo tiende cuando el ser muere, y el apagado del que sufre */
const mezcla = (hex, r2, g2, b2, t) => {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return 'rgb(' + Math.round(r + (r2 - r) * t) + ',' + Math.round(g + (g2 - g) * t)
       + ',' + Math.round(b + (b2 - b) * t) + ')';
};

function pintaSeres(dpr){
  if(!SER || !SER.seres.length) return;
  const e = vista.esc * dpr;
  const aX = (wx) => (wx - vista.x) * e;
  const aY = (wy) => (wy - vista.y) * e;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for(const s of SER.seres){
    const P = SER.postura(s);
    /* el grosor del trazo va con la talla Y con el zoom: si fuera fijo, de
       lejos serían garabatos gordos y de cerca alambres */
    const gr = Math.max(1.1, P.T * e * 0.30);
    const mal = P.mal, muerto = P.muerto;

    /* la paleta de ESTE ser, estable de por vida */
    /* ⚠ `>>>` Y NO `>>`, y esto reventaba CADA CUADRO. `h` es un entero sin
       signo de 32 bits, así que pasa de 2³¹ la mitad de las veces; `h >> 3`
       lo lee CON signo y devuelve un número NEGATIVO. Índice negativo →
       `undefined` → `undefined.slice` dentro de `mezcla`. Y el nuevo renglón
       de la tabla de «lo que recuerdo»: las pruebas de pantalla decían «ni un
       error de consola» y era verdad — nunca ponían una personita. Una prueba
       que no provoca la pantalla no la está mirando. */
    const h = (P.id * 2654435761) >>> 0;
    const camisa = CAMISAS[h % CAMISAS.length];
    const pantalon = PANTALONES[(h >>> 3) % PANTALONES.length];
    const pelo = PELOS[(h >>> 6) % PELOS.length];
    const pl = PIELES[(h >>> 9) % PIELES.length];

    /* el que sufre se acalora y el muerto se va a gris: un solo mando para
       los tres colores, para que no se descoordinen */
    const gris = muerto ? 0.85 : 0;
    const piel = muerto ? '#6b6b73'
      : 'rgb(' + Math.round(pl[0] + mal * (255 - pl[0]) * 0.45) + ','
        + Math.round(pl[1] - mal * pl[1] * 0.42) + ','
        + Math.round(pl[2] - mal * pl[2] * 0.52) + ')';
    const cRopa = mezcla(camisa, 107, 107, 115, Math.max(gris, mal * 0.35));
    const cPant = mezcla(pantalon, 107, 107, 115, Math.max(gris, mal * 0.35));
    const cPelo = mezcla(pelo, 107, 107, 115, gris);

    /* ── 1 · el contorno, debajo de todo ──────────────────────────────── */
    const trazaPatas = () => {
      ctx.beginPath();
      for(const q of P.patas){
        ctx.moveTo(aX(q.ox), aY(q.oy)); ctx.lineTo(aX(q.rx), aY(q.ry)); ctx.lineTo(aX(q.fx), aY(q.fy));
      }
      ctx.stroke();
    };
    const trazaBrazos = () => {
      ctx.beginPath();
      for(const b of P.brazos){
        ctx.moveTo(aX(b.ox), aY(b.oy)); ctx.lineTo(aX(b.cx), aY(b.cy)); ctx.lineTo(aX(b.mx), aY(b.my));
      }
      ctx.stroke();
    };
    /* ⚠ EL TORSO ES UNA FORMA, NO UNA RAYA. Dibujado como una línea de cadera
       a hombro, el monigote se ve como una flecha: dos piernas, dos brazos y
       nada en medio. Con un trapecio de hombros a cadera —ancho arriba,
       estrecho abajo— aparece un cuerpo, y ES lo que convierte el alambre en
       persona. Los bichos no lo llevan: ellos tienen caparazón. */
    const trazaTronco = (engorda) => {
      const dx = P.homX - P.cadX, dy = P.homY - P.cadY;
      const L = Math.hypot(dx, dy) || 1;
      const nx = -dy / L, ny = dx / L;          /* perpendicular al torso */
      const ah = (P.bicho ? 0.9 : 1) * 0.5 * P.T * 2.10 + engorda;   /* medio hombro */
      const ac = (P.bicho ? 0.9 : 1) * 0.5 * P.T * 1.40 + engorda;   /* media cadera */
      ctx.beginPath();
      ctx.moveTo(aX(P.homX + nx * ah), aY(P.homY + ny * ah));
      ctx.lineTo(aX(P.homX - nx * ah), aY(P.homY - ny * ah));
      ctx.lineTo(aX(P.cadX - nx * ac), aY(P.cadY - ny * ac));
      ctx.lineTo(aX(P.cadX + nx * ac), aY(P.cadY + ny * ac));
      ctx.closePath();
      ctx.fill();
      /* el cuello, que si no la cabeza flota */
      ctx.beginPath();
      ctx.moveTo(aX(P.homX), aY(P.homY)); ctx.lineTo(aX(P.cueX), aY(P.cueY));
      ctx.lineWidth = Math.max(1, P.T * e * 0.34) + engorda * e * 1.4;
      ctx.stroke();
    };

    ctx.strokeStyle = 'rgba(10,8,14,.72)'; ctx.fillStyle = 'rgba(10,8,14,.72)';
    ctx.lineWidth = gr + Math.max(1, gr * 0.7);
    trazaPatas(); trazaBrazos();
    trazaTronco(P.T * 0.16);
    ctx.beginPath();
    ctx.arc(aX(P.cabX), aY(P.cabY), Math.max(1.4, P.cabR * e) + Math.max(1, gr * 0.5), 0, 6.2832);
    ctx.fillStyle = 'rgba(10,8,14,.72)'; ctx.fill();

    /* ── 2 · la ropa ──────────────────────────────────────────────────── */
    /* ⚠ EL ORDEN IMPORTA: primero piernas, luego tronco, luego brazos. Con los
       brazos antes del tronco, el relleno del torso se los comía enteros y la
       figura salía manca — se veía en la captura y no se ve leyendo. */
    ctx.lineWidth = gr;
    ctx.strokeStyle = P.bicho ? cPelo : cPant;  trazaPatas();
    /* zapatos: una pisada corta y oscura en la punta de cada pata. Es un
       detalle de dos renglones y es lo que asienta la figura en el suelo */
    if(!P.bicho){
      ctx.strokeStyle = '#1B1720'; ctx.lineWidth = gr * 1.25;
      ctx.beginPath();
      for(const q of P.patas){
        const vx = q.fx - q.rx, vy = q.fy - q.ry, L = Math.hypot(vx, vy) || 1;
        ctx.moveTo(aX(q.fx - vy / L * 0.10), aY(q.fy + vx / L * 0.10));
        ctx.lineTo(aX(q.fx + P.mirando * 0.55), aY(q.fy));
      }
      ctx.stroke();
      ctx.lineWidth = gr;
    }
    /* ⚠ LOS BRAZOS VAN DETRÁS DEL TORSO MIENTRAS NO CARGUE NADA. Pintados
       siempre delante, el antebrazo colgando cae justo por el centro del pecho
       y se lee como una franja de piel encima de la camisa — se ve en la
       captura, no en el código. Sólo pasan al frente cuando llevan algo, que
       es cuando de verdad están por delante del cuerpo. */
    const brazosDelante = !!P.carga;
    const pintaBrazos = () => {
      ctx.lineWidth = gr * 0.85;
      ctx.strokeStyle = P.bicho ? cPelo : piel;   trazaBrazos();
      /* la manga: el brazo va de piel, pero el trozo de arriba es camisa */
      if(!P.bicho){
        ctx.strokeStyle = cRopa; ctx.lineWidth = gr * 1.05;
        ctx.beginPath();
        for(const b of P.brazos){ ctx.moveTo(aX(b.ox), aY(b.oy)); ctx.lineTo(aX(b.cx), aY(b.cy)); }
        ctx.stroke();
      }
      ctx.lineWidth = gr;
    };
    if(!brazosDelante) pintaBrazos();
    ctx.fillStyle = P.bicho ? cPelo : cRopa;
    ctx.strokeStyle = P.bicho ? cPelo : piel;
    trazaTronco(0);
    if(brazosDelante) pintaBrazos();

    /* ── 3 · la cabeza: piel, pelo y un ojo ───────────────────────────── */
    const R = Math.max(1.4, P.cabR * e);
    const hx = aX(P.cabX), hy = aY(P.cabY);
    ctx.beginPath(); ctx.arc(hx, hy, R, 0, 6.2832);
    ctx.fillStyle = piel; ctx.fill();
    if(!P.bicho && R > 2.2){
      /* el pelo es media luna por arriba, girada hacia donde mira: así la nuca
         queda del lado de atrás y se lee la dirección aunque no haya cara */
      const g = Math.atan2(P.mira[1], P.mira[0]);
      ctx.beginPath();
      ctx.arc(hx, hy, R * 0.98, g + 0.55, g + Math.PI + 0.95);
      ctx.fillStyle = cPelo; ctx.fill();
    }
    if(!muerto && R > 3){
      /* un ojo, del lado al que va. Dos ojos a este tamaño se convierten en
         una mancha; uno se lee como una cara de perfil, que es lo que es. */
      ctx.beginPath();
      ctx.arc(hx + P.mira[0] * R * 0.45, hy + P.mira[1] * R * 0.45,
              Math.max(0.8, R * 0.20), 0, 6.2832);
      ctx.fillStyle = '#12100F'; ctx.fill();
    }

    /* lo que lleva en las manos se pinta del color de SU material: si no, un
       monigote cargando lava y otro cargando hielo se ven igual */
    if(P.carga){
      const c = RGB[P.carga.tipo] || [200, 200, 200];
      const l = Math.max(2, P.carga.lado * e);
      ctx.fillStyle = 'rgba(10,8,14,.72)';
      ctx.fillRect(aX(P.carga.x) - l / 2 - 1, aY(P.carga.y) - l / 2 - 1, l + 2, l + 2);
      ctx.fillStyle = 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
      ctx.fillRect(aX(P.carga.x) - l / 2, aY(P.carga.y) - l / 2, l, l);
    }
  }
}

/* ── la paleta y la mochila ─────────────────────────────────────────────── */
const GRUPOS = [...new Set(EL.map(e => e.grupo).filter(Boolean))];
let grupoSel = 'tierra', elSel = IDX.arena, tam = 4, modo = 'pintar';
let pausado = false;

const LLAVE = 'crisol.v1';
let guardado = { mochila:{}, vistos:{} };
try{ const s = localStorage.getItem(LLAVE); if(s) guardado = Object.assign(guardado, JSON.parse(s)); }catch(e){}
const salva = () => { try{ localStorage.setItem(LLAVE, JSON.stringify(guardado)); }catch(e){} };

function pestanas(){
  const c = $('pestanas'); c.innerHTML = '';
  const todos = ['mochila', ...GRUPOS];
  for(const g of todos){
    const b = document.createElement('button');
    b.className = 'pes' + (g === grupoSel ? ' sel' : '');
    const n = g === 'mochila' ? Object.keys(guardado.mochila).length : 0;
    b.textContent = g === 'mochila' ? ('🎒 Mochila' + (n ? ' ' + n : '')) : g;
    b.onclick = () => { grupoSel = g; pestanas(); paleta(); };
    c.appendChild(b);
  }
}

function paleta(){
  const c = $('lista'); c.innerHTML = '';
  let lista;
  if(grupoSel === 'mochila'){
    lista = Object.keys(guardado.mochila).map(id => EL[IDX[id]]).filter(Boolean);
    if(!lista.length){
      const p = document.createElement('p');
      p.style.cssText = 'color:#9C93AB;font-size:12.5px;margin:4px 8px;max-width:40ch';
      p.textContent = 'Aquí se van guardando solas las cosas que LOGRES, no las que pintes. '
        + 'Junta lava y agua y mira qué pasa.';
      c.appendChild(p); return;
    }
  } else {
    lista = EL.filter(e => e.grupo === grupoSel);
  }
  for(const e of lista){
    const b = document.createElement('button');
    const nuevo = guardado.mochila[e.id] === 1;
    b.className = 'el' + (IDX[e.id] === elSel ? ' sel' : '') + (nuevo ? ' nuevo' : '');
    const i = document.createElement('i'); i.style.background = e.col;
    b.appendChild(i);
    /* el icono delante del nombre: Carlos no reconocía las piezas sólo por el
       nombre, y con ciento ochenta y cinco elementos leer cada uno es un peaje */
    if(e.ico){
      const ic = document.createElement('span');
      ic.textContent = e.ico; ic.className = 'ico'; ic.setAttribute('aria-hidden','true');
      b.appendChild(ic);
    }
    const s = document.createElement('span'); s.textContent = e.nom;
    b.appendChild(s);
    if(e.ayuda) b.title = e.ayuda;
    b.onclick = () => {
      elSel = IDX[e.id]; modo = 'pintar';
      if(nuevo){ guardado.mochila[e.id] = 2; salva(); }
      for(const id of Object.values(BOTON_MODO)) $(id).classList.remove('on');
      $('ficha').classList.remove('va');
      if(e.ayuda) avisa(e.nom + ' · ' + e.ayuda);
      $('qual').textContent = e.nom;
      mandoCuerda();
      paleta();
    };
    c.appendChild(b);
  }
}

/* el color de cada raza pasado a números UNA vez: convertir '#23232B' a RGB
   dentro del bucle de pintado sería hacerlo por hormiga y por cuadro */
const RGB_RAZA = {};
for(const n of NOMBRES){
  const c = RAZAS[n].col;
  RGB_RAZA[n] = [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
}

let avisoT = 0;
function avisa(txt){
  const a = $('aviso');
  a.textContent = txt; a.classList.add('va');
  clearTimeout(avisoT);
  avisoT = setTimeout(() => a.classList.remove('va'), 2600);
}

/* Lo que se descubre. Es la mochila que pidió Carlos: si al juntar cosas
   sale arena, la arena queda guardada y se puede usar directo. */
function revisaDescubrimientos(){
  for(const id in M.nacidos){
    if(guardado.mochila[id]) continue;
    if(id === 'vacio') continue;
    guardado.mochila[id] = 1;
    salva(); pestanas();
    if(grupoSel === 'mochila') paleta();
    avisa('🎒 Descubriste ' + EL[IDX[id]].nom + ' — ya lo puedes usar');
  }
}

/* ── pintar con el dedo ─────────────────────────────────────────────────── */
const dedos = new Map();

/* ═══════════════════════════════════════════════════════════════════════════
   ZOOM Y DESPLAZAMIENTO
   Un dedo pinta. DOS dedos mueven el mundo: pellizcar acerca y aleja,
   arrastrar desplaza. Es el gesto que todo el mundo ya conoce de las fotos,
   así que no hay que explicarlo — y en una sala de 153 600 celdas es la
   diferencia entre poder trabajar y no.
   ═════════════════════════════════════════════════════════════════════════ */
let gesto = null;
const dist2 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const centro = (a, b) => ({ x:(a.x + b.x) / 2, y:(a.y + b.y) / 2 });

function puntos(){
  return [...dedos.values()].filter(d => d.pantalla).map(d => d.pantalla);
}

function empiezaGesto(){
  const ps = puntos();
  if(ps.length < 2){ gesto = null; return; }
  const c = centro(ps[0], ps[1]);
  gesto = { d0: dist2(ps[0], ps[1]) || 1, esc0: vista.esc,
            c0: c, vx0: vista.x, vy0: vista.y };
  /* al empezar a mover el mundo, lo que se haya pintado con el primer dedo
     ya está: se cancela el pintado para no dejar un rayón al hacer zoom */
  for(const d of dedos.values()) d.pintando = false;
}

function sigueGesto(){
  if(!gesto) return;
  const ps = puntos();
  if(ps.length < 2) return;
  const c = centro(ps[0], ps[1]);
  const escNueva = gesto.esc0 * (dist2(ps[0], ps[1]) / gesto.d0);
  /* el zoom se ancla al punto entre los dedos: si no, la imagen se va
     corriendo sola mientras pellizcas y marea */
  const r = cv.getBoundingClientRect();
  const mundoX = gesto.vx0 + (gesto.c0.x - r.left) / gesto.esc0;
  const mundoY = gesto.vy0 + (gesto.c0.y - r.top) / gesto.esc0;
  vista.esc = Math.max(1.2, Math.min(14, escNueva));
  vista.x = mundoX - (c.x - r.left) / vista.esc;
  vista.y = mundoY - (c.y - r.top) / vista.esc;
  limitaVista();
}

/* rueda del ratón, para quien esté en computadora */
cv.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = cv.getBoundingClientRect();
  const antes = vista.esc;
  vista.esc = Math.max(1.2, Math.min(14, vista.esc * (ev.deltaY < 0 ? 1.12 : 0.89)));
  const mx = vista.x + (ev.clientX - r.left) / antes;
  const my = vista.y + (ev.clientY - r.top) / antes;
  vista.x = mx - (ev.clientX - r.left) / vista.esc;
  vista.y = my - (ev.clientY - r.top) / vista.esc;
  limitaVista();
}, { passive:false });

function celdaDe(ev){
  const r = cv.getBoundingClientRect();
  return [Math.floor(vista.x + (ev.clientX - r.left) / vista.esc),
          Math.floor(vista.y + (ev.clientY - r.top) / vista.esc)];
}
function brocha(x, y){
  const r = tam - 1;
  for(let dy = -r; dy <= r; dy++) for(let dx = -r; dx <= r; dx++){
    if(dx*dx + dy*dy > r*r + r) continue;
    const nx = x+dx, ny = y+dy;
    if(!M.dentro(nx, ny)) continue;
    const k = M.i(nx, ny);
    if(modo === 'calor'){ M.temp[k] += 220; continue; }
    if(modo === 'frio'){ M.temp[k] -= 160; continue; }
    /* soldar es pintar una ESTRUCTURA: todo lo que pases con el dedo en un
       mismo trazo queda en la misma pieza. Por eso el grupo se guarda entre
       llamadas — si cada celda hiciera su propio grupo, soldar no soldaría. */
    if(modo === 'soldar'){ M.suelda(nx, ny, 0, grupoSolda); grupoSolda = M.soldadoUltimo; continue; }
    /* pintar vacío BORRA; pintar sobre algo sólo si hay hueco o es un borrado */
    if(elSel === VACIO || M.t[k] === VACIO || EL[elSel].estado === 'solido')
      M.pon(nx, ny, elSel);
  }
}
/* ── ARRASTRAR PARA MOVERSE ────────────────────────────────────────────────
   Carlos: «necesito una herramienta para poder moverme en la habitación de
   crisol arrastrando para moverme, pellizcando para hacer o deshacer zoom».
   El pellizco ya estaba; lo que faltaba era el dedo solo. Va como herramienta
   aparte —la mano 🖐— para que no se pelee con pintar: con la mano puesta, un
   dedo desplaza la vista y no deja un rayón. */
let paneo = null;
/* ── LA MANO FÍSICA ────────────────────────────────────────────────────────
   El agarre vive aquí pero la fuerza la aplica el MOTOR (`M.agarra`), que es
   quien sabe de masas. La pantalla sólo dice dónde está el dedo. */
let agarre = null;

cv.addEventListener('pointerdown', ev => {
  ev.preventDefault(); cv.setPointerCapture(ev.pointerId);
  const [x, y] = celdaDe(ev);
  dedos.set(ev.pointerId, { cx:x, cy:y, pantalla:{x:ev.clientX, y:ev.clientY}, pintando:true });
  if(dedos.size >= 2){ empiezaGesto(); paneo = null; return; }
  /* la foto se saca ANTES del trazo: después ya no queda qué recuperar */
  if(dedos.size === 1 && (modo === 'pintar' || modo === 'calor' || modo === 'frio')) apunta();

  if(modo === 'navegar'){
    paneo = { x0:ev.clientX, y0:ev.clientY, vx0:vista.x, vy0:vista.y };
    dedos.get(ev.pointerId).pintando = false;
    return;
  }
  if(modo === 'medir'){
    ficha(x, y);
    dedos.get(ev.pointerId).pintando = false;
    return;
  }
  if(modo === 'soldar') grupoSolda = 0;   /* cada trazo, una estructura */
  nidoPuesto = false;                    /* y cada trazo, un solo nido */
  serPuesto = false;                     /* y una sola personita */
  pistolaPuesta = false;                 /* y una sola pistola */
  if(modo === 'agarrar'){
    agarre = { cx:x, cy:y, fx:x, fy:y };
    dedos.get(ev.pointerId).pintando = false;
    return;
  }
  if(modo === 'zona'){
    gArrastre = { x0:x, y0:y, x1:x, y1:y };
    dedos.get(ev.pointerId).pintando = false;
    return;
  }
  if(modo === 'punto'){
    const [gx, gy] = gVector();
    M.puntoGravedad(x, y, Math.hypot(gx, gy) || 9.81,
                    parseInt($('gRadio').value, 10) || 40, !gRepele);
    avisa('Punto que ' + (gRepele ? 'repele' : 'atrae') + ' puesto');
    dedos.get(ev.pointerId).pintando = false;
    ponModo('pintar');
    return;
  }
  if(modo === 'gobjeto'){
    M.pintaGravedad(x, y, Math.max(1, tam - 1), parseFloat($('gMul').value));
    dedos.get(ev.pointerId).pintando = false;
    return;
  }
  if(modo === 'ser'){
    /* ⚠ UNA POR TOQUE, no una por celda arrastrada. Es el mismo cerrojo que
       el del nido y por la misma razón: sin él, un dedo que se mueve suelta
       cuarenta monigotes y el tope de población se llena de un trazo. */
    if(!serPuesto){
      const s2 = quienSer === 'bicho' ? SER.bicho(x, y) : SER.persona(x, y);
      avisa(s2 ? (quienSer === 'bicho' ? 'Bicho' : 'Personita') + ' · ' + SER.seres.length + ' en la sala'
               : 'Ya no caben más');
      serPuesto = true;
    }
    dedos.get(ev.pointerId).pintando = false;
    return;
  }
  if(modo === 'pistola'){
    /* ⚠ UNA POR TOQUE, igual que el nido y la personita.
       Y el orden importa: PRIMERO se mira si el toque cayó sobre una pistola
       ya puesta, porque si no, tocarla para dispararle le pinta otra encima y
       quien juega acaba con una torre de armas y ningún tiro. */
    if(!pistolaPuesta){
      pistolaPuesta = true;
      dedos.get(ev.pointerId).pintando = false;
      const p = pistolas.find(q => PIEZAS.tocada(q, x, y, 1));
      if(p){
        if(PIEZAS.dispara(M, p)) avisa('¡Pum!');
        else { PIEZAS.recarga(M, p); PIEZAS.dispara(M, p); avisa('Recargada · ¡Pum!'); }
        return;
      }
      /* la culata va donde cae el dedo, corrida media pieza para que el arma
         quede centrada en el toque y no colgando de él */
      const cx = x - Math.round(PIEZAS.RECETA.canon / 2) * miraPistola;
      const cy = y - Math.floor(PIEZAS.ALTO / 2);
      if(!PIEZAS.cabe(M, cx, cy, miraPistola)){
        avisa('Aquí no cabe: apunta hacia dentro de la sala');
        return;
      }
      const mat = PIEZAS.MATERIALES.includes(EL[elSel].id) ? EL[elSel].id : 'metal';
      pistolas.push(PIEZAS.pistola(M, cx, cy, miraPistola, mat));
      avisa('Pistola de ' + mat + ' apuntando a la ' +
            (miraPistola > 0 ? 'derecha' : 'izquierda') + ' · tócala para disparar');
      return;
    }
    dedos.get(ev.pointerId).pintando = false;
    return;
  }
  if(modo === 'nido'){
    /* ⚠ UN NIDO POR TRAZO. Sin el cerrojo, arrastrar el dedo dejaba un nido
       por celda tocada: cincuenta colonias de la misma raza peleando entre
       ellas que no son, y el tope de población lleno en dos segundos. */
    if(!nidoPuesto){
      HOR.nido(x, y, razaNido, 8);
      avisa('Nido ' + razaNido + ' · ' + HOR.hormigas.length + ' hormigas en la sala');
      nidoPuesto = true;
    }
    dedos.get(ev.pointerId).pintando = false;
    return;
  }
  /* Tocar un interruptor lo ACCIONA en vez de pintarle encima. Sin esto no
     había forma de operar un circuito: sólo de construirlo y mirarlo. */
  if(modo === 'pintar' && M.acciona(x, y)){
    avisa(M.vida[M.i(x,y)] ? 'Interruptor cerrado ⚡' : 'Interruptor abierto');
    dedos.get(ev.pointerId).pintando = false;
    return;
  }
  brocha(x, y);
}, { passive:false });

cv.addEventListener('pointermove', ev => {
  const d = dedos.get(ev.pointerId);
  if(!d) return;
  ev.preventDefault();
  d.pantalla = { x:ev.clientX, y:ev.clientY };
  if(dedos.size >= 2){ sigueGesto(); return; }
  if(paneo){
    /* el mundo se mueve al revés que el dedo: se arrastra el MUNDO, no la
       cámara, que es lo que se siente natural */
    vista.x = paneo.vx0 - (ev.clientX - paneo.x0) / vista.esc;
    vista.y = paneo.vy0 - (ev.clientY - paneo.y0) / vista.esc;
    limitaVista();
    return;
  }
  if(agarre){ const [gx, gy] = celdaDe(ev); agarre.fx = gx; agarre.fy = gy; return; }
  if(gArrastre){ const [zx, zy] = celdaDe(ev); gArrastre.x1 = zx; gArrastre.y1 = zy; return; }
  if(modo === 'gobjeto'){
    const [ox, oy] = celdaDe(ev);
    M.pintaGravedad(ox, oy, Math.max(1, tam - 1), parseFloat($('gMul').value));
    return;
  }
  if(modo === 'medir'){ const [mx, my] = celdaDe(ev); ficha(mx, my); return; }
  if(!d.pintando) return;
  const [x, y] = celdaDe(ev);
  const px = d.cx, py = d.cy;
  /* interpolar: sin esto, un dedo rápido pinta puntos sueltos y no una línea */
  const pasos = Math.max(Math.abs(x-px), Math.abs(y-py));
  for(let i = 0; i <= pasos; i++){
    brocha(Math.round(px + (x-px)*i/pasos), Math.round(py + (y-py)*i/pasos));
  }
  d.cx = x; d.cy = y;
}, { passive:false });

const suelta = ev => {
  dedos.delete(ev.pointerId);
  if(dedos.size < 2) gesto = null;
  if(!dedos.size){
    paneo = null; agarre = null;
    if(gArrastre){
      const { x0, y0, x1, y1 } = gArrastre;
      gArrastre = null;
      /* una zona de una sola celda es un dedazo, no una zona */
      if(Math.abs(x1-x0) > 1 || Math.abs(y1-y0) > 1){
        const [gx, gy] = gVector();
        M.zonaGravedad(x0, y0, x1, y1, gx, gy, $('gModo').value);
        avisa('Zona de gravedad creada');
        /* la herramienta se suelta al terminar: si no, el panel se queda
           encogido y la lista de campos —que es donde se apagan y se
           quitan— no se puede ni ver */
        ponModo('pintar');
      }
    }
  }
};
cv.addEventListener('pointerup', suelta);
cv.addEventListener('pointercancel', suelta);

/* ── botones ────────────────────────────────────────────────────────────── */
/* Botones de zoom: los gestos son cómodos pero no todo el mundo puede hacer
   un pellizco, y con teclado no hay pellizco que valga. */
const zoom = f => {
  const r = cv.getBoundingClientRect();
  const antes = vista.esc;
  vista.esc = Math.max(1.2, Math.min(14, vista.esc * f));
  const mx = vista.x + (r.width/2) / antes, my = vista.y + (r.height/2) / antes;
  vista.x = mx - (r.width/2) / vista.esc;
  vista.y = my - (r.height/2) / vista.esc;
  limitaVista();
  avisa('Zoom ' + vista.esc.toFixed(1) + '×');
};
$('bMas').onclick = () => zoom(1.35);
$('bMenos').onclick = () => zoom(0.74);

/* El tirador: plegar y desplegar. Y dice qué traes seleccionado, para que
   plegado sigas sabiendo con qué estás pintando. */
let plegado = false;
$('tirador').onclick = () => {
  plegado = !plegado;
  $('panel').classList.toggle('plegado', plegado);
  $('tirador').setAttribute('aria-expanded', String(!plegado));
  $('flecha').textContent = plegado ? '▴ materiales' : '▾ ocultar';
  /* ⚠ Y SE VUELVE A MEDIR. Plegar el panel cambia cuánto sitio le queda al
     mundo, y si no se re-mide, el lienzo conserva el tamaño de antes: la
     cámara sigue creyendo que ve un área que ya no es la suya y el suelo
     queda fuera de cuadro. Es la otra mitad de «parece que se cae al vacío». */
  medir();
};

$('bPausa').onclick = () => {
  pausado = !pausado;
  $('bPausa').textContent = pausado ? '▶' : '❚❚';
  $('bPausa').classList.toggle('on', pausado);
};
/* ── DESHACER, GUARDAR Y NO BORRAR SIN QUERER ──────────────────────────────
   Carlos, tres de un tirón: «el botón de borrar no hace confirmación»,
   «necesito un botón de regresar» y «necesito guardados».

   El deshacer guarda una foto ANTES de cada trazo, no después: después ya
   perdiste lo que querías recuperar. Seis niveles, que en una sala de 320×480
   son unos 4.6 MB — cabe, y más niveles empiezan a pesar en un teléfono.

   Y la confirmación de borrar es a DOS TOQUES en vez de un diálogo del
   sistema: en el teléfono un `confirm()` tapa la pantalla, se sale del tono
   de todo lo demás y encima bloquea la simulación. Dos toques con aviso hacen
   el mismo trabajo sin sacarte del juego. */
const historial = [];
function apunta(){
  historial.push(M.instantanea());
  if(historial.length > 6) historial.shift();
  $('bDeshace').classList.toggle('on', historial.length > 0);
}
$('bDeshace').onclick = () => {
  const f = historial.pop();
  if(!f){ avisa('No hay nada que deshacer'); return; }
  M.restaura(f);
  $('bDeshace').classList.toggle('on', historial.length > 0);
  avisa('Deshecho · quedan ' + historial.length);
};

let borrarArmado = 0;
$('bBorra').onclick = () => {
  const ahora = Date.now();
  if(ahora - borrarArmado > 3000){
    borrarArmado = ahora;
    $('bBorra').classList.add('on');
    avisa('¿Seguro? Toca el bote otra vez para vaciarlo todo');
    setTimeout(() => $('bBorra').classList.remove('on'), 3000);
    return;
  }
  borrarArmado = 0;
  $('bBorra').classList.remove('on');
  apunta();                       /* vaciar también se puede deshacer */
  M.limpia();
  /* ⚠ Y SE OLVIDAN LAS PISTOLAS. Sin esta línea, la lista guarda armas que ya
     no están pintadas: tocar ese hueco «dispara» un arma invisible, o peor,
     recarga pólvora en medio del aire. Es el mismo defecto de siempre —algo
     que informa un estado y está en otro—, ahora en una lista. */
  pistolas = [];
  avisa('Sala vacía · el botón ↩ la trae de vuelta');
};

/* ── GUARDADOS ────────────────────────────────────────────────────────────
   Tres ranuras, en el propio teléfono. La sala se guarda por RACHAS: una
   recién abierta son 150 mil celdas de aire seguidas, o sea dos números en
   vez de 150 mil, y así cabe de sobra en el almacenamiento del navegador. */
guardado.salas = guardado.salas || {};
function pintaSalas(){
  const c = $('salasLista');
  c.innerHTML = '';
  for(const r of ['1', '2', '3']){
    const g = guardado.salas[r];
    const fila = document.createElement('div');
    fila.className = 'gcampo';
    fila.innerHTML = '<span>Ranura ' + r + (g ? ' · ' + g.cuando : ' · vacía') + '</span>';
    const bg = document.createElement('button');
    bg.textContent = 'Guardar';
    bg.onclick = () => {
      guardado.salas[r] = { txt: M.aTexto(), cuando: new Date().toLocaleString('es-MX', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) };
      salva(); pintaSalas(); avisa('Guardado en la ranura ' + r);
    };
    fila.appendChild(bg);
    if(g){
      const bc = document.createElement('button');
      bc.textContent = 'Cargar';
      bc.onclick = () => {
        apunta();                 /* cargar también se puede deshacer */
        if(M.deTexto(g.txt)) avisa('Cargada la ranura ' + r);
        else avisa('Esa sala se guardó con otro tamaño de habitación');
        $('salas').classList.remove('va');
      };
      fila.appendChild(bc);
      const bb = document.createElement('button');
      bb.textContent = 'Borrar';
      bb.onclick = () => { delete guardado.salas[r]; salva(); pintaSalas(); };
      fila.appendChild(bb);
    }
    c.appendChild(fila);
  }
}
$('bGuarda').onclick = () => { pintaSalas(); $('salas').classList.toggle('va'); };
$('salasX').onclick = () => $('salas').classList.remove('va');
$('tam').oninput = e => { tam = +e.target.value; $('tamN').textContent = tam; };
/* ── QUÉ TAN FLOJA ES LA CUERDA ────────────────────────────────────────────
   Carlos lo pidió por su nombre y el mando sólo aparece cuando tienes la
   cuerda elegida: un deslizador más, visible siempre, es un deslizador que
   estorba el 95% del tiempo en un teléfono. */
$('flex').oninput = e => {
  M.flexCuerda = (+e.target.value) / 100;
  $('flexN').textContent = M.flexCuerda < 0.2 ? 'tiesa'
                         : M.flexCuerda < 0.6 ? 'normal' : 'floja';
};
function mandoCuerda(){
  const va = EL[elSel] && EL[elSel].cuerda;
  $('flexL').hidden = !va; $('flex').hidden = !va;
}
/* ── LAS HERRAMIENTAS ──────────────────────────────────────────────────────
   Un solo sitio decide qué modo está activo y apaga los demás. Antes cada
   botón se encargaba de apagar a los otros a mano, y con cinco herramientas
   eso son veinte líneas que se contradicen entre sí a la primera distracción. */
let grupoSolda = 0;
const BOTON_MODO = { calor:'bCalor', frio:'bFrio', navegar:'bMano', agarrar:'bAgarra', medir:'bMide', soldar:'bSolda', nido:'bNido', ser:'bSer', pistola:'bPistola' };
const MODOS_GRAVEDAD = ['zona', 'punto', 'gobjeto'];
function ponModo(m){
  modo = (modo === m) ? 'pintar' : m;
  for(const [k, id] of Object.entries(BOTON_MODO)) $(id).classList.toggle('on', modo === k);
  if(typeof gPinta === 'function') gPinta();
  if(modo !== 'medir') $('ficha').classList.remove('va');
  const dice = {
    navegar:'Mover la vista: arrastra con un dedo. Con dos, zoom',
    agarrar:'Agarra un sólido y arrástralo. Lo pesado va a costar',
    medir:'Toca algo para ver su material, su temperatura y sus cambios de estado',
    calor:'Calentando', frio:'Enfriando',
    soldar:'Pinta encima lo que quieras que sea UNA pieza. Lo que no pintes, no entra',
  }[modo];
  if(dice) avisa(dice);
}
$('bCalor').onclick  = () => ponModo('calor');
$('bFrio').onclick   = () => ponModo('frio');
$('bMano').onclick   = () => ponModo('navegar');
$('bAgarra').onclick = () => ponModo('agarrar');
$('bMide').onclick   = () => ponModo('medir');
$('bSolda').onclick  = () => { grupoSolda = 0; ponModo('soldar'); };
/* El mismo botón sirve de selector: si ya está armado, la siguiente pulsación
   cambia de raza en vez de apagarlo. Tres botones para tres razas se comen el
   ancho de un teléfono, y el emoji cambia de color para que se vea cuál va. */
const EMOJI_RAZA = { negra:'🐜', roja:'🔴', verde:'🟢' };
const EMOJI_SER = { persona:'🚶', bicho:'🐛' };
$('bSer').onclick = () => {
  if(modo === 'ser'){
    quienSer = quienSer === 'persona' ? 'bicho' : 'persona';
    $('bSer').textContent = EMOJI_SER[quienSer];
    avisa((quienSer === 'persona' ? 'Personita' : 'Bicho') + ' · toca la sala para soltarla');
    return;
  }
  serPuesto = false;
  ponModo('ser');
  $('bSer').textContent = EMOJI_SER[quienSer];
  if(modo === 'ser') avisa((quienSer === 'persona' ? 'Personita' : 'Bicho') + ' · toca la sala para soltarla');
};
/* El mismo botón sirve de veleta: si ya está armado, la siguiente pulsación
   voltea el arma. El cañón NO lleva botón aparte — lo decide el material que
   tengas elegido en la paleta, que es una cosa menos que explicar y una menos
   que estorbar en el ancho de un teléfono. */
$('bPistola').onclick = () => {
  if(modo === 'pistola'){
    miraPistola = -miraPistola;
    $('bPistola').style.transform = miraPistola > 0 ? '' : 'scaleX(-1)';
    avisa('Pistola apuntando a la ' + (miraPistola > 0 ? 'derecha' : 'izquierda'));
    return;
  }
  pistolaPuesta = false;
  ponModo('pistola');
  $('bPistola').style.transform = miraPistola > 0 ? '' : 'scaleX(-1)';
  if(modo === 'pistola')
    avisa('Toca la sala para poner la pistola · tócala otra vez para disparar');
};
$('bNido').onclick = () => {
  if(modo === 'nido'){
    const i = NOMBRES.indexOf(razaNido);
    razaNido = NOMBRES[(i + 1) % NOMBRES.length];
    $('bNido').textContent = EMOJI_RAZA[razaNido];
    avisa('Hormiguero ' + razaNido + ' · toca la sala para ponerlo');
    return;
  }
  nidoPuesto = false;
  ponModo('nido');
  $('bNido').textContent = EMOJI_RAZA[razaNido];
  if(modo === 'nido') avisa('Hormiguero ' + razaNido + ' · toca la sala para ponerlo');
};
/* el interruptor que pidió Carlos por su nombre: «que decidir si se tratan
   como partículas separadas sea un toggle» */
$('bRigido').onclick = () => {
  M.rigido = !M.rigido;
  $('bRigido').classList.toggle('on', M.rigido);
  avisa(M.rigido ? 'Cuerpos rígidos: lo que está pegado cae junto'
                 : 'Grano por grano: cada celda por su cuenta');
};
$('fichaX').onclick  = () => $('ficha').classList.remove('va');

/* ── el termómetro, en pantalla ────────────────────────────────────────────
   Los datos los da el motor (`informe`), aquí sólo se pintan. La fisión sale
   marcada aparte porque NO es un cambio de estado — lo corrigió Carlos. */
function ficha(x, y){
  const r = M.informe(x, y);
  if(!r) return;
  const fila = (a, b) => '<tr><td>' + a + '</td><td>' + b + '</td></tr>';
  let h = '<h4>' + r.nombre + (r.simbolo ? ' · ' + r.simbolo + (r.z ? ' (Z ' + r.z + ')' : '') : '') + '</h4><table>';
  h += fila('Temperatura', r.temperatura + ' °C');
  h += fila('Estado ahora', r.estado);
  h += fila('Densidad', r.densidad + (r.masa ? ' · ' + r.masa + ' g/cm³ de verdad' : ''));
  /* Carlos: «la presión no se nota». Se nota aquí o no se nota: en
     atmósferas, que es como se piensa, y diciendo si el sitio está sellado —
     que es lo único que permite que suba. */
  if(r.presion) h += fila('Presión', r.atmosferas + ' atm');
  if(r.sellado) h += fila('Recinto', 'SELLADO · aquí sí sube la presión');
  if(r.moles) h += fila('Gas metido', r.moles + '× (repinta encima para comprimir)');
  if(r.corriente) h += fila('Corriente', 'sí, le llega · ' + r.voltaje + ' V (apila pilas para subirlo)');
  const fases = r.cambios.filter(c => c.que !== 'fisión' && c.que !== 'combustión');
  if(fases.length){
    h += '<tr><td colspan="2" style="padding-top:6px;color:#B9B0C8"><b>Cambios de estado</b></td></tr>';
    for(const c of fases) h += fila(c.que, (c.a != null ? c.a + ' °C · ' : '') + c.nota);
  }
  const otros = r.cambios.filter(c => c.que === 'fisión' || c.que === 'combustión');
  for(const c of otros) h += fila(c.que, c.nota);
  h += '</table>';
  $('fichaC').innerHTML = h;
  $('ficha').classList.add('va');
}

/* ═══════════════════════════════════════════════════════════════════════════
   LA GRAVEDAD, EN PANTALLA
   ---------------------------------------------------------------------------
   Carlos pidió diez cosas por su nombre: global, por objeto, por zona,
   dibujar la zona, magnitud, dirección, atrae o repele, ver las flechas del
   campo, apagar un campo sin borrarlo, y quitarlo o cambiarlo. Están las diez.
   El cálculo vive en el motor; aquí sólo se elige y se dibuja.
   ═════════════════════════════════════════════════════════════════════════ */
let gDir = 'abajo', gRepele = false, gVerFlechas = true, gArrastre = null;
const DIRS = { abajo:[0,1], arriba:[0,-1], izq:[-1,0], der:[1,0] };

function gVector(){
  const mag = parseFloat($('gMag').value) || 0;
  const [dx, dy] = DIRS[gDir];
  return [dx * mag, dy * mag];
}
function gPinta(){
  for(const b of document.querySelectorAll('#grav .gb[data-dir]'))
    b.classList.toggle('on', b.dataset.dir === gDir);
  $('gRepele').textContent = gRepele ? 'repele' : 'atrae';
  $('gRepele').classList.toggle('on', gRepele);
  $('gPunto').textContent = gRepele ? 'Poner un punto que repele' : 'Poner un punto que atrae';
  for(const [id, m] of [['gZona','zona'],['gPunto','punto'],['gObjeto','gobjeto']])
    $(id).classList.toggle('on', modo === m);
  /* con una herramienta de colocar activa, el panel se aparta */
  const colocando = MODOS_GRAVEDAD.includes(modo);
  $('grav').classList.toggle('mini', colocando);
  $('gPista').textContent = {
    zona:   'Arrastra en la sala para dibujar la zona. Toca ✕ para salir.',
    punto:  'Toca en la sala para poner el punto. Toca ✕ para salir.',
    gobjeto:'Pinta encima de un objeto para darle su propia gravedad. ✕ para salir.',
  }[modo] || '';
  /* la lista de campos, con apagar y quitar */
  const c = $('gLista'); c.innerHTML = '';
  const campos = [
    ...M.zonas.map((z, i) => ({ o:z, txt:'Zona ' + (i+1) + ' · ' + (z.x1-z.x0+1) + '×' + (z.y1-z.y0+1) +
        ' · ' + M.constructor.name.slice(0,0) + gEnMetros(z.gx, z.gy) + ' · ' + z.modo, lista:M.zonas })),
    ...M.puntos.map((p, i) => ({ o:p, txt:'Punto ' + (i+1) + ' · ' + (p.atrae ? 'atrae' : 'repele') +
        ' · radio ' + p.radio, lista:M.puntos })),
  ];
  if(!campos.length){ c.innerHTML = '<div style="color:#6E6880;padding-top:6px">Sin zonas ni puntos todavía.</div>'; return; }
  for(const { o, txt, lista } of campos){
    const f = document.createElement('div'); f.className = 'gcampo';
    const t = document.createElement('span'); t.textContent = txt;
    const on = document.createElement('button');
    on.textContent = o.activa ? 'on' : 'off';
    on.title = o.activa ? 'Apagar sin borrar' : 'Encender';
    on.onclick = () => { o.activa = !o.activa; gPinta(); };
    const x = document.createElement('button');
    x.textContent = '✕'; x.title = 'Quitar';
    x.onclick = () => { lista.splice(lista.indexOf(o), 1); M.revisaCampo(); gPinta(); };
    f.append(t, on, x); c.appendChild(f);
  }
}
/* de celdas/paso² a m/s², para que la lista hable en las unidades que pidió */
function gEnMetros(gx, gy){
  const a = (v) => (9.81 * v / 0.28).toFixed(1);
  if(Math.abs(gx) < 1e-6) return a(gy) + ' m/s² ' + (gy >= 0 ? '↓' : '↑');
  if(Math.abs(gy) < 1e-6) return a(gx) + ' m/s² ' + (gx >= 0 ? '→' : '←');
  return a(Math.hypot(gx, gy)) + ' m/s² ⤢';
}

$('bGrav').onclick = () => {
  const abierto = $('grav').classList.toggle('va');
  if(abierto){ gPinta(); } else if(['zona','punto','gobjeto'].includes(modo)) ponModo('pintar');
};
$('gravX').onclick = () => { $('grav').classList.remove('va'); if(['zona','punto','gobjeto'].includes(modo)) ponModo('pintar'); };
for(const b of document.querySelectorAll('#grav .gb[data-dir]'))
  b.onclick = () => { gDir = b.dataset.dir; gPinta(); };
$('gRepele').onclick = () => { gRepele = !gRepele; gPinta(); };
$('gFlechas').onchange = e => { gVerFlechas = e.target.checked; };
$('gGlobal').onclick = () => {
  const [gx, gy] = gVector();
  M.ponGravedadGlobal(gx, gy);
  avisa('Gravedad de la sala: ' + gEnMetros(0.28*gx/9.81, 0.28*gy/9.81));
};
$('gNormal').onclick = () => {
  M.ponGravedadGlobal(0, 9.81);
  $('gMag').value = '9.81'; gDir = 'abajo'; gPinta();
  avisa('Gravedad normal, 9.81 m/s² hacia abajo');
};
$('gZona').onclick   = () => { ponModo('zona');    gPinta(); avisa('Arrastra en la sala para dibujar la zona'); };
$('gPunto').onclick  = () => { ponModo('punto');   gPinta(); avisa('Toca en la sala para poner el punto'); };
$('gObjeto').onclick = () => { ponModo('gobjeto'); gPinta(); avisa('Pinta encima de un objeto para darle su propia gravedad'); };

/* las flechas del campo: ayudan a entender, NO sustituyen la simulación */
function pintaFlechas(){
  if(!gVerFlechas) return;
  if(M._gSimple && Math.abs(M.gGlobal.x) < 1e-6 && M.gGlobal.y > 0) return;   /* normal: no estorbar */
  const dpr = cv.width / parseFloat(cv.style.width);
  const paso = 34;
  ctx.save();
  ctx.strokeStyle = 'rgba(61,255,197,.55)'; ctx.lineWidth = 1.4 * dpr;
  for(let py = paso; py < cv.height; py += paso * dpr){
    for(let px = paso; px < cv.width; px += paso * dpr){
      const mx = vista.x + (px / dpr) / vista.esc, my = vista.y + (py / dpr) / vista.esc;
      if(!M.dentro(Math.floor(mx), Math.floor(my))) continue;
      M.gravedadEn(Math.floor(mx), Math.floor(my), M.i(Math.floor(mx), Math.floor(my)));
      const gx = M._gx, gy = M._gy, mag = Math.hypot(gx, gy);
      if(mag < 0.004) continue;
      const l = Math.min(16, 7 + mag * 22) * dpr;
      const ux = gx / mag, uy = gy / mag;
      ctx.beginPath();
      ctx.moveTo(px - ux*l/2, py - uy*l/2);
      ctx.lineTo(px + ux*l/2, py + uy*l/2);
      /* la punta */
      ctx.lineTo(px + ux*l/2 - ux*4*dpr - uy*3*dpr, py + uy*l/2 - uy*4*dpr + ux*3*dpr);
      ctx.moveTo(px + ux*l/2, py + uy*l/2);
      ctx.lineTo(px + ux*l/2 - ux*4*dpr + uy*3*dpr, py + uy*l/2 - uy*4*dpr - ux*3*dpr);
      ctx.stroke();
    }
  }
  /* el contorno de las zonas y el radio de los puntos */
  const aPant = (mx, my) => [ (mx - vista.x) * vista.esc * dpr, (my - vista.y) * vista.esc * dpr ];
  ctx.setLineDash([6*dpr, 5*dpr]);
  for(const z of M.zonas){
    ctx.strokeStyle = z.activa ? 'rgba(61,255,197,.8)' : 'rgba(110,104,128,.6)';
    const [ax, ay] = aPant(z.x0, z.y0), [bx, by] = aPant(z.x1 + 1, z.y1 + 1);
    ctx.strokeRect(ax, ay, bx - ax, by - ay);
  }
  for(const p of M.puntos){
    ctx.strokeStyle = p.activa ? (p.atrae ? 'rgba(255,197,61,.8)' : 'rgba(255,59,78,.8)') : 'rgba(110,104,128,.6)';
    const [cx0, cy0] = aPant(p.x, p.y);
    ctx.beginPath(); ctx.arc(cx0, cy0, p.radio * vista.esc * dpr, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx0, cy0, 4*dpr, 0, Math.PI*2); ctx.stroke();
  }
  if(gArrastre){
    ctx.strokeStyle = 'rgba(61,255,197,.9)'; ctx.setLineDash([4*dpr, 4*dpr]);
    const [ax, ay] = aPant(Math.min(gArrastre.x0, gArrastre.x1), Math.min(gArrastre.y0, gArrastre.y1));
    const [bx, by] = aPant(Math.max(gArrastre.x0, gArrastre.x1) + 1, Math.max(gArrastre.y0, gArrastre.y1) + 1);
    ctx.strokeRect(ax, ay, bx - ax, by - ay);
  }
  ctx.restore();
}

/* ── el bucle ───────────────────────────────────────────────────────────── */
let ultimo = 0, fps = 0, acum = 0, cuadros = 0;
function cuadro(ms){
  requestAnimationFrame(cuadro);
  const dt = ms - ultimo; ultimo = ms;
  /* la mano tira ANTES del paso, para que la fuerza entre en la misma física
     de este cuadro y no en la del siguiente */
  if(agarre){
    const g = M.agarra(agarre.cx, agarre.cy, agarre.fx, agarre.fy, Math.max(2, tam - 1));
    agarre.cx = g.cx; agarre.cy = g.cy;
  }
  if(!pausado){ M.paso(); if(HOR) HOR.paso(); if(SER) SER.paso(); }
  pinta();
  $('escala').textContent = '×' + vista.esc.toFixed(1);
  cuadros++; acum += dt;
  if(acum > 500){
    fps = Math.round(cuadros * 1000 / acum); acum = 0; cuadros = 0;
    let vivas = 0, tmax = -999, pmax = 0;
    for(let k = 0; k < M.t.length; k++){
      if(M.t[k] !== VACIO) vivas++;
      if(M.temp[k] > tmax) tmax = M.temp[k];
      if(M.pres[k] > pmax) pmax = M.pres[k];
    }
    $('datos').innerHTML = an + '×' + al + ' · ' + fps + ' fps<br>' +
      vivas + ' celdas · ' + Math.round(tmax) + '° · ' + Math.round(pmax) + ' bar';
    revisaDescubrimientos();
  }
}

/* ⚠ NO BASTA CON MEDIR AL ARRANCAR Y AL REDIMENSIONAR, y esto sólo se ve en
   un navegador de verdad: `medir()` corría antes de que el navegador hubiera
   terminado de colocar el panel, así que el lienzo se quedaba con 610 px de
   alto metidos a mano mientras su zona medía 422. Resultado: el mundo se
   dibujaba 188 px por debajo del panel — o sea justo lo que Carlos reportó
   dos veces, «parece que se cae al vacío lo que pones».
   Un ResizeObserver no depende de adivinar CUÁNDO está lista la maqueta: se
   entera cada vez que cambia, venga de donde venga el cambio (girar el
   teléfono, plegar el panel, la barra de Safari, el teclado). */
addEventListener('resize', () => { medir(); });
if(window.ResizeObserver) new ResizeObserver(() => medir()).observe($('zona'));
medir(); pestanas(); paleta();
requestAnimationFrame(cuadro);
window.CRISOL = { M, EL, IDX, get mundo(){ return M; }, guardado, vista, zoom, apunta,
                  pon:(x,y,id)=>M.pon(x,y,IDX[id]),
                  /* para las pruebas de pantalla: la lista de armas puestas y
                     el modo, que es lo único que no se ve leyendo el lienzo */
                  get pistolas(){ return pistolas; }, get modo(){ return modo; },
                  get SER(){ return SER; }, get HOR(){ return HOR; },
                  PIEZAS };
</script>
