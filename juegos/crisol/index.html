<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0B0712">
<title>CRISOL — el sandbox de reacciones</title>
<meta name="description" content="Sandbox de píxeles con química, termodinámica y electricidad de verdad. 48 elementos, reacciones reales, circuitos y compuertas lógicas.">
<style>
:root{
  --vacio:#0B0712; --sup:#1A1424; --sup2:#241B32; --violeta:#AC27FF;
  --hueso:#E9E4E4; --oro:#FFC53D; --menta:#3DFFC5;
  --ab:env(safe-area-inset-bottom,0px); --ar:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* ⚠ EL MENÚ SE LE SUBÍA A CARLOS EN SU NAVEGADOR, y la causa es de manual en
   iPhone: `height:100%` mide el viewport SIN contar que la barra de
   direcciones de Safari aparece y desaparece al hacer scroll. Cuando se
   recoge, el documento mide más que la ventana y el panel de abajo se va
   hacia arriba de la pantalla.
   `100dvh` —dynamic viewport height— sí sigue a la barra. Va con `100vh` de
   respaldo primero, para los navegadores que no lo conocen: el orden importa,
   porque el segundo pisa al primero sólo donde se entiende. */
html{height:100%}
body{
  margin:0; overflow:hidden; overscroll-behavior:none;
  height:100vh; height:100dvh;
  background:var(--vacio);color:var(--hueso);
  font:14px/1.4 ui-rounded,-apple-system,"Segoe UI",system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;
  display:flex;flex-direction:column;
  padding-top:var(--ar);
}

/* ── barra de arriba ───────────────────────────────────────────────────── */
#barra{
  display:flex;align-items:center;gap:8px;padding:7px 10px;
  background:var(--sup);flex:0 0 auto;
}
#barra b{font-size:15px;letter-spacing:.06em}
#datos{margin-left:auto;font-size:11.5px;color:#9C93AB;text-align:right;line-height:1.3}
.icono{
  border:0;background:var(--sup2);color:var(--hueso);border-radius:11px;
  width:44px;height:44px;font-size:17px;cursor:pointer;flex:0 0 auto;
}
.icono.on{background:var(--violeta);color:#fff}
.icono:focus-visible{outline:3px solid var(--oro);outline-offset:2px}

/* ── el mundo ──────────────────────────────────────────────────────────── */
#zona{flex:1 1 auto;position:relative;min-height:0;background:#07040D}
#mundo{
  position:absolute;inset:0;width:100%;height:100%;
  image-rendering:pixelated;touch-action:none;display:block;
}

/* ── panel de abajo ────────────────────────────────────────────────────── */
/* Y el panel va CLAVADO abajo, no sólo «al final del flujo»: con position
   fixed no hay barra de navegador que lo mueva. */
#panel{
  position:fixed; left:0; right:0; bottom:0; z-index:8;
  background:var(--sup); display:flex; flex-direction:column;
  max-height:52dvh;
  padding-bottom:var(--ab);
  box-shadow:0 -10px 30px rgba(0,0,0,.5);
  transition:transform .22s ease;
}
/* Desplegable: Carlos lo pidió porque el panel se come media pantalla y a
   veces lo que quieres es MIRAR el mundo. */
#panel.plegado{ transform:translateY(calc(100% - 52px - var(--ab))) }
#tirador{
  height:52px; flex:0 0 auto; display:flex; align-items:center; gap:10px;
  padding:0 12px; cursor:pointer; background:none; border:0; color:inherit;
  font:inherit; font-weight:700; width:100%; text-align:left;
}
#tirador .asa{
  width:38px; height:5px; border-radius:99px; background:#6E6880; flex:0 0 auto;
}
#tirador .qual{ font-size:13px; color:#B9B0C8; flex:1; }
#tirador .flecha{ font-size:13px; color:#9C93AB }
@media (prefers-reduced-motion: reduce){ #panel{transition:none} }
#pestanas{display:flex;gap:4px;padding:6px 8px 0;overflow-x:auto}
.pes{
  border:0;background:transparent;color:#9C93AB;font:inherit;font-weight:700;
  font-size:12.5px;padding:0 13px;height:44px;border-radius:9px;cursor:pointer;
  white-space:nowrap;flex:0 0 auto;
}
.pes.sel{background:var(--sup2);color:var(--hueso)}
.pes:focus-visible{outline:3px solid var(--oro);outline-offset:-2px}

#lista{overflow-y:auto;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.el{
  display:flex;align-items:center;gap:7px;border:0;cursor:pointer;font:inherit;
  background:var(--sup2);color:var(--hueso);border-radius:11px;
  padding:0 11px 0 8px;height:44px;font-size:12.5px;font-weight:600;
}
.el i{width:17px;height:17px;border-radius:5px;display:block;flex:0 0 auto;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.el.sel{box-shadow:inset 0 0 0 2px var(--menta)}
.el:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
.el.nuevo::after{content:'nuevo';font-size:9.5px;color:var(--oro);font-weight:800}

#herr{display:flex;gap:6px;padding:0 8px 8px;align-items:center;flex-wrap:wrap}
#herr label{font-size:11.5px;color:#9C93AB}
input[type=range]{flex:1 1 90px;min-width:80px;accent-color:var(--violeta);height:34px}

.aviso{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:12px;background:rgba(26,20,36,.95);padding:9px 15px;border-radius:11px;
  font-size:13px;box-shadow:inset 0 0 0 1px rgba(255,197,61,.35);
  pointer-events:none;opacity:0;transition:opacity .25s ease;max-width:88%;
  text-align:center;
}
.aviso.va{opacity:1}
@media (prefers-reduced-motion: reduce){ .aviso{transition:none} }
</style>

<body>
<div id="barra">
  <b>CRISOL</b>
  <button class="icono" id="bPausa" aria-label="Pausar">❚❚</button>
  <button class="icono" id="bBorra" aria-label="Vaciar">🗑</button>
  <div id="datos"></div>
</div>

<div id="zona">
  <canvas id="mundo"></canvas>
  <div class="aviso" id="aviso"></div>
</div>

<div id="panel">
  <button id="tirador" aria-expanded="true" aria-controls="cuerpoPanel">
    <span class="asa"></span>
    <span class="qual" id="qual">Arena</span>
    <span class="flecha" id="flecha">▾ ocultar</span>
  </button>
  <div id="cuerpoPanel">
  <div id="pestanas"></div>
  <div id="lista"></div>
  <div id="herr">
    <label>Pincel <span id="tamN">4</span></label>
    <input type="range" id="tam" min="1" max="14" value="4">
    <button class="icono" id="bCalor" aria-label="Calentar" title="Calentar">🔥</button>
    <button class="icono" id="bFrio" aria-label="Enfriar" title="Enfriar">❄️</button>
    <button class="icono" id="bMas" aria-label="Acercar">＋</button>
    <button class="icono" id="bMenos" aria-label="Alejar">－</button>
  </div>
  </div>
</div>

<script type="module">
import { Mundo, IDS, IDX, EL, VACIO, AMBIENTE } from './motor.js';

/* ═══════════════════════════════════════════════════════════════════════════
   LA PANTALLA
   ⚠ El motor tiene sus 26 pruebas en verde, y eso NO garantiza que esto
   funcione: en Guerra de Puercos las 74 del motor pasaban con el modo a
   distancia muerto. Esta parte se prueba con un navegador de verdad.
   ═════════════════════════════════════════════════════════════════════════ */

const cv = document.getElementById('mundo');
const ctx = cv.getContext('2d', { alpha:false });
const $ = id => document.getElementById(id);

/* ── LA SALA ───────────────────────────────────────────────────────────
   Carlos: «quiero una sala de crisol mucho más grande para que me quepan
   todas mis locuras» y «que pueda hacer zoom». Van juntas: una sala grande
   sin zoom es una sala que no se ve.

   El mundo tiene AHORA UN TAMAÑO PROPIO, mucho mayor que la pantalla, y lo
   que ves es una ventana que se mueve por encima. El dibujo se hace al mundo
   entero en un lienzo aparte y luego se recorta — así el zoom no cuesta nada,
   porque es la misma imagen mirada más de cerca. */
const SALA_AN = 320, SALA_AL = 480;
let M, img, datos, an = SALA_AN, al = SALA_AL;
let lienzoMundo = null, ctxMundo = null;
/* la ventana: qué trozo del mundo se ve */
const vista = { x:0, y:0, esc:4 };

function limitaVista(){
  const z = document.getElementById('zona').getBoundingClientRect();
  vista.esc = Math.max(1.2, Math.min(14, vista.esc));
  const anVis = z.width / vista.esc, alVis = z.height / vista.esc;
  vista.x = Math.max(0, Math.min(an - anVis, vista.x));
  vista.y = Math.max(0, Math.min(al - alVis, vista.y));
  if(anVis >= an) vista.x = (an - anVis) / 2;
  if(alVis >= al) vista.y = (al - alVis) / 2;
}

function medir(){
  const z = document.getElementById('zona').getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(z.width * dpr); cv.height = Math.round(z.height * dpr);
  cv.style.width = z.width + 'px'; cv.style.height = z.height + 'px';
  if(M){ limitaVista(); return; }
  const nuevo = new Mundo(an, al);
  M = nuevo;
  /* El mundo se dibuja completo aquí, y la pantalla sólo recorta. Al girar el
     teléfono no se pierde nada porque el mundo no cambia de tamaño: cambia la
     ventana. */
  lienzoMundo = document.createElement('canvas');
  lienzoMundo.width = an; lienzoMundo.height = al;
  ctxMundo = lienzoMundo.getContext('2d', { alpha:false });
  img = ctxMundo.createImageData(an, al);
  datos = img.data;
  for(let i = 3; i < datos.length; i += 4) datos[i] = 255;
  vista.x = an / 2 - 48; vista.y = al - 90;
  limitaVista();
}

/* colores precalculados: convertir '#RRGGBB' 30 000 veces por cuadro es
   exactamente como se pierden los fotogramas en un teléfono */
const RGB = EL.map(e => {
  const h = e.col.replace('#','');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
});
/* ruido fijo por celda, para que la arena no se vea como una mancha plana */
let RUIDO = null;

function pinta(){
  const { t, temp, car } = M;
  if(!RUIDO || RUIDO.length !== t.length){
    RUIDO = new Int8Array(t.length);
    for(let i = 0; i < RUIDO.length; i++) RUIDO[i] = ((Math.random()*22)|0) - 11;
  }
  for(let k = 0; k < t.length; k++){
    const tipo = t[k];
    const c = RGB[tipo];
    let r = c[0], g = c[1], b = c[2];
    if(tipo === VACIO){
      /* ⚠ Carlos: «es difícil saber dónde está esa zona si no hay un material
         abajo». Y era literal: el vacío se pintaba siempre del mismo negro,
         así que una zona calentada o enfriada era INVISIBLE hasta que le
         echabas algo encima. Un campo que no se ve no se puede usar. */
      const T = M.temp[k];
      if(T > 40){ const f = Math.min(1, (T - 40) / 700);
        r += f*170; g += f*58; b += f*14; }
      else if(T < 8){ const f = Math.min(1, (8 - T) / 55);
        r += f*8; g += f*46; b += f*96; }
      const P = M.pres[k];
      if(P > 1.5){ const f = Math.min(1, P / 70); r += f*120; g += f*120; b += f*160; }
    }
    if(tipo !== VACIO){
      const n = RUIDO[k];
      r += n; g += n; b += n;
      /* lo caliente se ve caliente y lo helado se ve helado: el calor es
         invisible si no se pinta, y entonces la termodinámica no existe
         para quien juega */
      const T = temp[k];
      if(T > 120){ const f = Math.min(1, (T - 120) / 900); r += f*170; g += f*55; }
      else if(T < 0){ const f = Math.min(1, -T / 60); b += f*70; g += f*30; }
      if(car[k]){ r += 70; g += 90; b += 30; }
      /* La presión SE PINTA. Una onda expansiva que no se ve no es una onda:
         es un número. Se tiñe de blanco hacia el azul según la fuerza. */
      const P = M.pres[k];
      if(P > 1.5){ const f = Math.min(1, P / 70); r += f*150; g += f*150; b += f*190; }
      /* un interruptor cerrado se ve cerrado */
      if(EL[tipo].interruptor && M.vida[k]){ g += 60; }
    }
    const p = k << 2;
    datos[p]   = r < 0 ? 0 : r > 255 ? 255 : r;
    datos[p+1] = g < 0 ? 0 : g > 255 ? 255 : g;
    datos[p+2] = b < 0 ? 0 : b > 255 ? 255 : b;
  }
  ctxMundo.putImageData(img, 0, 0);

  /* y ahora la ventana. `imageSmoothingEnabled` en falso o el zoom se ve
     como una foto borrosa en vez de píxeles. */
  const z = cv.width, w = cv.height;
  const dpr = cv.width / parseFloat(cv.style.width);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#07040D';
  ctx.fillRect(0, 0, cv.width, cv.height);
  const anVis = (cv.width / dpr) / vista.esc, alVis = (cv.height / dpr) / vista.esc;
  ctx.drawImage(lienzoMundo, vista.x, vista.y, anVis, alVis,
                0, 0, cv.width, cv.height);
}

/* ── la paleta y la mochila ─────────────────────────────────────────────── */
const GRUPOS = [...new Set(EL.map(e => e.grupo).filter(Boolean))];
let grupoSel = 'tierra', elSel = IDX.arena, tam = 4, modo = 'pintar';
let pausado = false;

const LLAVE = 'crisol.v1';
let guardado = { mochila:{}, vistos:{} };
try{ const s = localStorage.getItem(LLAVE); if(s) guardado = Object.assign(guardado, JSON.parse(s)); }catch(e){}
const salva = () => { try{ localStorage.setItem(LLAVE, JSON.stringify(guardado)); }catch(e){} };

function pestanas(){
  const c = $('pestanas'); c.innerHTML = '';
  const todos = ['mochila', ...GRUPOS];
  for(const g of todos){
    const b = document.createElement('button');
    b.className = 'pes' + (g === grupoSel ? ' sel' : '');
    const n = g === 'mochila' ? Object.keys(guardado.mochila).length : 0;
    b.textContent = g === 'mochila' ? ('🎒 Mochila' + (n ? ' ' + n : '')) : g;
    b.onclick = () => { grupoSel = g; pestanas(); paleta(); };
    c.appendChild(b);
  }
}

function paleta(){
  const c = $('lista'); c.innerHTML = '';
  let lista;
  if(grupoSel === 'mochila'){
    lista = Object.keys(guardado.mochila).map(id => EL[IDX[id]]).filter(Boolean);
    if(!lista.length){
      const p = document.createElement('p');
      p.style.cssText = 'color:#9C93AB;font-size:12.5px;margin:4px 8px;max-width:40ch';
      p.textContent = 'Aquí se van guardando solas las cosas que LOGRES, no las que pintes. '
        + 'Junta lava y agua y mira qué pasa.';
      c.appendChild(p); return;
    }
  } else {
    lista = EL.filter(e => e.grupo === grupoSel);
  }
  for(const e of lista){
    const b = document.createElement('button');
    const nuevo = guardado.mochila[e.id] === 1;
    b.className = 'el' + (IDX[e.id] === elSel ? ' sel' : '') + (nuevo ? ' nuevo' : '');
    const i = document.createElement('i'); i.style.background = e.col;
    b.appendChild(i);
    const s = document.createElement('span'); s.textContent = e.nom;
    b.appendChild(s);
    if(e.ayuda) b.title = e.ayuda;
    b.onclick = () => {
      elSel = IDX[e.id]; modo = 'pintar';
      if(nuevo){ guardado.mochila[e.id] = 2; salva(); }
      $('bCalor').classList.remove('on'); $('bFrio').classList.remove('on');
      if(e.ayuda) avisa(e.nom + ' · ' + e.ayuda);
      $('qual').textContent = e.nom;
      paleta();
    };
    c.appendChild(b);
  }
}

let avisoT = 0;
function avisa(txt){
  const a = $('aviso');
  a.textContent = txt; a.classList.add('va');
  clearTimeout(avisoT);
  avisoT = setTimeout(() => a.classList.remove('va'), 2600);
}

/* Lo que se descubre. Es la mochila que pidió Carlos: si al juntar cosas
   sale arena, la arena queda guardada y se puede usar directo. */
function revisaDescubrimientos(){
  for(const id in M.nacidos){
    if(guardado.mochila[id]) continue;
    if(id === 'vacio') continue;
    guardado.mochila[id] = 1;
    salva(); pestanas();
    if(grupoSel === 'mochila') paleta();
    avisa('🎒 Descubriste ' + EL[IDX[id]].nom + ' — ya lo puedes usar');
  }
}

/* ── pintar con el dedo ─────────────────────────────────────────────────── */
const dedos = new Map();

/* ═══════════════════════════════════════════════════════════════════════════
   ZOOM Y DESPLAZAMIENTO
   Un dedo pinta. DOS dedos mueven el mundo: pellizcar acerca y aleja,
   arrastrar desplaza. Es el gesto que todo el mundo ya conoce de las fotos,
   así que no hay que explicarlo — y en una sala de 153 600 celdas es la
   diferencia entre poder trabajar y no.
   ═════════════════════════════════════════════════════════════════════════ */
let gesto = null;
const dist2 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const centro = (a, b) => ({ x:(a.x + b.x) / 2, y:(a.y + b.y) / 2 });

function puntos(){
  return [...dedos.values()].filter(d => d.pantalla).map(d => d.pantalla);
}

function empiezaGesto(){
  const ps = puntos();
  if(ps.length < 2){ gesto = null; return; }
  const c = centro(ps[0], ps[1]);
  gesto = { d0: dist2(ps[0], ps[1]) || 1, esc0: vista.esc,
            c0: c, vx0: vista.x, vy0: vista.y };
  /* al empezar a mover el mundo, lo que se haya pintado con el primer dedo
     ya está: se cancela el pintado para no dejar un rayón al hacer zoom */
  for(const d of dedos.values()) d.pintando = false;
}

function sigueGesto(){
  if(!gesto) return;
  const ps = puntos();
  if(ps.length < 2) return;
  const c = centro(ps[0], ps[1]);
  const escNueva = gesto.esc0 * (dist2(ps[0], ps[1]) / gesto.d0);
  /* el zoom se ancla al punto entre los dedos: si no, la imagen se va
     corriendo sola mientras pellizcas y marea */
  const r = cv.getBoundingClientRect();
  const mundoX = gesto.vx0 + (gesto.c0.x - r.left) / gesto.esc0;
  const mundoY = gesto.vy0 + (gesto.c0.y - r.top) / gesto.esc0;
  vista.esc = Math.max(1.2, Math.min(14, escNueva));
  vista.x = mundoX - (c.x - r.left) / vista.esc;
  vista.y = mundoY - (c.y - r.top) / vista.esc;
  limitaVista();
}

/* rueda del ratón, para quien esté en computadora */
cv.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = cv.getBoundingClientRect();
  const antes = vista.esc;
  vista.esc = Math.max(1.2, Math.min(14, vista.esc * (ev.deltaY < 0 ? 1.12 : 0.89)));
  const mx = vista.x + (ev.clientX - r.left) / antes;
  const my = vista.y + (ev.clientY - r.top) / antes;
  vista.x = mx - (ev.clientX - r.left) / vista.esc;
  vista.y = my - (ev.clientY - r.top) / vista.esc;
  limitaVista();
}, { passive:false });

function celdaDe(ev){
  const r = cv.getBoundingClientRect();
  return [Math.floor(vista.x + (ev.clientX - r.left) / vista.esc),
          Math.floor(vista.y + (ev.clientY - r.top) / vista.esc)];
}
function brocha(x, y){
  const r = tam - 1;
  for(let dy = -r; dy <= r; dy++) for(let dx = -r; dx <= r; dx++){
    if(dx*dx + dy*dy > r*r + r) continue;
    const nx = x+dx, ny = y+dy;
    if(!M.dentro(nx, ny)) continue;
    const k = M.i(nx, ny);
    if(modo === 'calor'){ M.temp[k] += 220; continue; }
    if(modo === 'frio'){ M.temp[k] -= 160; continue; }
    /* pintar vacío BORRA; pintar sobre algo sólo si hay hueco o es un borrado */
    if(elSel === VACIO || M.t[k] === VACIO || EL[elSel].estado === 'solido')
      M.pon(nx, ny, elSel);
  }
}
cv.addEventListener('pointerdown', ev => {
  ev.preventDefault(); cv.setPointerCapture(ev.pointerId);
  const [x, y] = celdaDe(ev);
  dedos.set(ev.pointerId, { cx:x, cy:y, pantalla:{x:ev.clientX, y:ev.clientY}, pintando:true });
  if(dedos.size >= 2){ empiezaGesto(); return; }
  /* Tocar un interruptor lo ACCIONA en vez de pintarle encima. Sin esto no
     había forma de operar un circuito: sólo de construirlo y mirarlo. */
  if(modo === 'pintar' && M.acciona(x, y)){
    avisa(M.vida[M.i(x,y)] ? 'Interruptor cerrado ⚡' : 'Interruptor abierto');
    dedos.get(ev.pointerId).pintando = false;
    return;
  }
  brocha(x, y);
}, { passive:false });

cv.addEventListener('pointermove', ev => {
  const d = dedos.get(ev.pointerId);
  if(!d) return;
  ev.preventDefault();
  d.pantalla = { x:ev.clientX, y:ev.clientY };
  if(dedos.size >= 2){ sigueGesto(); return; }
  if(!d.pintando) return;
  const [x, y] = celdaDe(ev);
  const px = d.cx, py = d.cy;
  /* interpolar: sin esto, un dedo rápido pinta puntos sueltos y no una línea */
  const pasos = Math.max(Math.abs(x-px), Math.abs(y-py));
  for(let i = 0; i <= pasos; i++){
    brocha(Math.round(px + (x-px)*i/pasos), Math.round(py + (y-py)*i/pasos));
  }
  d.cx = x; d.cy = y;
}, { passive:false });

const suelta = ev => { dedos.delete(ev.pointerId); if(dedos.size < 2) gesto = null; };
cv.addEventListener('pointerup', suelta);
cv.addEventListener('pointercancel', suelta);

/* ── botones ────────────────────────────────────────────────────────────── */
/* Botones de zoom: los gestos son cómodos pero no todo el mundo puede hacer
   un pellizco, y con teclado no hay pellizco que valga. */
const zoom = f => {
  const r = cv.getBoundingClientRect();
  const antes = vista.esc;
  vista.esc = Math.max(1.2, Math.min(14, vista.esc * f));
  const mx = vista.x + (r.width/2) / antes, my = vista.y + (r.height/2) / antes;
  vista.x = mx - (r.width/2) / vista.esc;
  vista.y = my - (r.height/2) / vista.esc;
  limitaVista();
  avisa('Zoom ' + vista.esc.toFixed(1) + '×');
};
$('bMas').onclick = () => zoom(1.35);
$('bMenos').onclick = () => zoom(0.74);

/* El tirador: plegar y desplegar. Y dice qué traes seleccionado, para que
   plegado sigas sabiendo con qué estás pintando. */
let plegado = false;
$('tirador').onclick = () => {
  plegado = !plegado;
  $('panel').classList.toggle('plegado', plegado);
  $('tirador').setAttribute('aria-expanded', String(!plegado));
  $('flecha').textContent = plegado ? '▴ materiales' : '▾ ocultar';
};

$('bPausa').onclick = () => {
  pausado = !pausado;
  $('bPausa').textContent = pausado ? '▶' : '❚❚';
  $('bPausa').classList.toggle('on', pausado);
};
$('bBorra').onclick = () => { M.limpia(); avisa('Mundo vacío'); };
$('tam').oninput = e => { tam = +e.target.value; $('tamN').textContent = tam; };
$('bCalor').onclick = () => {
  modo = modo === 'calor' ? 'pintar' : 'calor';
  $('bCalor').classList.toggle('on', modo === 'calor');
  $('bFrio').classList.remove('on');
};
$('bFrio').onclick = () => {
  modo = modo === 'frio' ? 'pintar' : 'frio';
  $('bFrio').classList.toggle('on', modo === 'frio');
  $('bCalor').classList.remove('on');
};

/* ── el bucle ───────────────────────────────────────────────────────────── */
let ultimo = 0, fps = 0, acum = 0, cuadros = 0;
function cuadro(ms){
  requestAnimationFrame(cuadro);
  const dt = ms - ultimo; ultimo = ms;
  if(!pausado) M.paso();
  pinta();
  cuadros++; acum += dt;
  if(acum > 500){
    fps = Math.round(cuadros * 1000 / acum); acum = 0; cuadros = 0;
    let vivas = 0, tmax = -999, pmax = 0;
    for(let k = 0; k < M.t.length; k++){
      if(M.t[k] !== VACIO) vivas++;
      if(M.temp[k] > tmax) tmax = M.temp[k];
      if(M.pres[k] > pmax) pmax = M.pres[k];
    }
    $('datos').innerHTML = an + '×' + al + ' · ' + fps + ' fps<br>' +
      vivas + ' celdas · ' + Math.round(tmax) + '° · ' + Math.round(pmax) + ' bar';
    revisaDescubrimientos();
  }
}

addEventListener('resize', () => { medir(); });
medir(); pestanas(); paleta();
requestAnimationFrame(cuadro);
window.CRISOL = { M, EL, IDX, get mundo(){ return M; }, guardado, vista, zoom,
                  pon:(x,y,id)=>M.pon(x,y,IDX[id]) };
</script>
