<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Avisos y tareas · 3.1</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7C1D24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Avisos 3.1">
<meta name="description" content="Arma los avisos y tareas del grupo y los convierte en una imagen lista para el chat.">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">

<!--
  AVISOS Y TAREAS · la herramienta de Carlos como jefe de grupo del 3.1
  ─────────────────────────────────────────────────────────────────────────
  EL PROBLEMA: cada tarde arma el aviso del grupo. Unas veces lo escribe a mano
  en una libreta y le toma foto; otras lo diseña, y eso le cuesta media hora.
  Las dos formas tienen el mismo defecto: la información se pierde, no se puede
  buscar y cada aviso se ve distinto del anterior.

  QUÉ HACE: se escriben los pendientes —materia, tipo, para cuándo— y escupe
  UNA IMAGEN lista para mandar al chat del grupo, con el formato de la escuela,
  un icono por materia y otro por tipo de pendiente.

  POR QUÉ IMAGEN Y NO TEXTO: el chat del grupo es de WhatsApp. Un texto largo
  se pierde entre mensajes; una imagen se ve completa de un vistazo, se guarda
  y se reenvía. Es el formato que ya usaba Carlos, no un invento.

  NADA EXTERNO: sin CDN, sin librerías, sin servidor. Los iconos los dibujamos
  nosotros (`iconos.js` explica por qué no son emoji) y la imagen la arma el
  propio navegador con canvas. Se guarda solo en el teléfono.
-->
<style>
  :root{
    /* La paleta salió de MEDIR los avisos que ya hizo Carlos y el escudo de la
       escuela, no de escogerla a ojo. El rojo #CA2229 es el del escudo. */
    --vino:#7C1D24;  --vino-hondo:#5A1319;  --rojo-escudo:#CA2229;
    --marino:#123A5E; --marino-vivo:#1E5083;
    --verde:#3F6B45;  --morado:#5D2469;  --dorado:#B98A2E;
    --crema:#FAF4EA;  --papel:#FFFDF8;   --linea:#E6DCCB;
    --tinta:#241A14;  --tenue:#6B5A4A;
    --fam:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:var(--fam); background:var(--crema); color:var(--tinta);
    padding:0 0 calc(28px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  .barra{
    background:var(--vino); color:#FFF6EC; padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
    display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:10;
  }
  .barra img{width:34px; height:34px; flex:0 0 auto}
  .barra h1{font-size:19px; margin:0; letter-spacing:-.02em}
  .barra p{margin:2px 0 0; font-size:12px; opacity:.8; letter-spacing:.12em; text-transform:uppercase}
  main{max-width:760px; margin:0 auto; padding:16px}
  h2{font-size:16px; margin:22px 0 10px; letter-spacing:.06em; text-transform:uppercase; color:var(--vino)}
  .tarjeta{background:var(--papel); border:1px solid var(--linea); border-radius:14px; padding:14px; margin-bottom:12px}
  label{display:block; font-size:13px; font-weight:700; margin:10px 0 5px; color:var(--tenue)}
  input,select,textarea{
    width:100%; font:inherit; font-size:16px;   /* 16px o iOS hace zoom al tocar */
    /* 46 px de alto mínimo: el dedo de un adolescente no atina a 43. Es la
       misma medida que pide Apple (44) con un pelo de margen. */
    min-height:46px; padding:12px; border:1.5px solid var(--linea); border-radius:10px;
    background:#fff; color:var(--tinta);
  }
  textarea{min-height:84px; resize:vertical; line-height:1.45}
  .fila{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .btn{
    font:inherit; font-weight:800; font-size:15px; min-height:48px; padding:12px 18px;
    border-radius:12px; border:1.5px solid var(--vino); background:#fff; color:var(--vino);
    cursor:pointer; width:100%;
  }
  .btn.fuerte{background:var(--vino); color:#FFF6EC; border-color:var(--vino)}
  .btn.chico{min-height:44px; padding:10px 14px; font-size:14px; width:auto}
  .btn.borrar{border-color:#B23A3A; color:#B23A3A}
  .acciones{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
  .marca-caja{
    display:flex; align-items:center; gap:10px; min-height:46px; margin:12px 0 0;
    background:#FFF3D6; border:1.5px solid var(--dorado); border-radius:10px;
    padding:8px 12px; font-size:14px; color:var(--tinta); cursor:pointer;
  }
  .marca-caja input{width:24px; height:24px; min-height:24px; flex:0 0 auto; margin:0; accent-color:var(--vino)}
  .pend{border-left:5px solid var(--vino)}
  .pend-cab{display:flex; align-items:center; gap:10px; margin-bottom:4px}
  .pend-cab svg{width:22px; height:22px; flex:0 0 auto}
  .pend-cab b{font-size:15px}
  .vacio{color:var(--tenue); font-size:14px; text-align:center; padding:22px 10px}
  canvas{width:100%; height:auto; display:block; border:1px solid var(--linea); border-radius:12px; background:#fff}
  .aviso-caja{
    background:#FFF3D6; border:1.5px solid var(--dorado); border-radius:12px;
    padding:12px 14px; font-size:14px; line-height:1.5; margin-top:12px;
  }
  #salida img{width:100%; height:auto; border-radius:12px; display:block; border:1px solid var(--linea)}
  .nota{font-size:13px; color:var(--tenue); line-height:1.5; margin:8px 0 0}
</style>
</head>
<body>

<header class="barra">
  <img src="escudo-rembrandt.png" alt="">
  <div>
    <h1>Avisos y tareas</h1>
    <p>Bachillerato Rembrandt · 3.1</p>
  </div>
</header>

<main>
  <h2>El encabezado</h2>
  <div class="tarjeta">
    <div class="fila">
      <div><label for="fFecha">Fecha</label><input type="date" id="fFecha"></div>
      <div><label for="fGrupo">Grupo</label><input id="fGrupo" value="3.1"></div>
    </div>
    <label for="fSemestre">Semestre</label>
    <input id="fSemestre" value="3er semestre">
  </div>

  <h2>Los pendientes</h2>
  <div id="lista"></div>
  <div class="acciones">
    <button class="btn fuerte" id="bAgregar" type="button">+ Agregar un pendiente</button>
  </div>
  <div class="acciones">
    <button class="btn borrar chico" id="bVaciar" type="button">Vaciar la lista</button>
  </div>

  <h2>La imagen</h2>
  <canvas id="lienzo" aria-label="Vista previa del aviso"></canvas>
  <div class="acciones">
    <button class="btn fuerte" id="bImagen" type="button">Crear la imagen para el chat</button>
  </div>
  <div id="salida"></div>

  <div class="aviso-caja">
    <b>Todo se guarda sólo en este teléfono.</b> No hay servidor ni cuenta: si
    borras los datos del navegador, se van. La imagen se arma aquí mismo.
  </div>
</main>

<script src="datos.js"></script>
<script src="iconos.js"></script>
<script>
const $ = s => document.querySelector(s);
const LLAVE = 'avisos_31_v1';

/* ══ EL ESTADO ═══════════════════════════════════════════════════════════ */
function hoyISO(){
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
let D = { fecha: hoyISO(), grupo:'3.1', semestre:'3er semestre', pendientes:[] };
try{ const g = JSON.parse(localStorage.getItem(LLAVE)); if(g && g.pendientes) D = g; }catch(e){}
function guardar(){ try{ localStorage.setItem(LLAVE, JSON.stringify(D)); }catch(e){} }

const materia = id => MATERIAS.find(m => m.id === id) || MATERIAS[MATERIAS.length-1];
const tipo    = id => TIPOS.find(t => t.id === id)    || TIPOS[TIPOS.length-1];

/* Orden del periódico: primero lo de mañana, luego la semana, luego lo demás.
   Dentro de cada bloque se respeta el orden en que Carlos los escribió. */
const ORDEN_CUANDO = { manana:0, semana:1, fecha:2, pronto:3 };
/* Lo destacado va HASTA ARRIBA, antes que lo de mañana. Es donde van los avisos
   de dirección y cualquier cosa que no se puede perder: si queda enterrado a la
   mitad del aviso, da igual haberlo puesto. */
const bloqueDe = p => p.destacado ? 'destacado' : p.cuando;
const ordenBloque = b => b === 'destacado' ? -1 : ORDEN_CUANDO[b];
function ordenados(){
  return D.pendientes
    .map((p,i) => ({ p, i }))
    .sort((a,b) => (ordenBloque(bloqueDe(a.p)) - ordenBloque(bloqueDe(b.p))) || (a.i - b.i))
    .map(x => x.p);
}

/* ══ EL EDITOR ═══════════════════════════════════════════════════════════ */
function opciones(lista, sel){
  return lista.map(x => `<option value="${x.id}"${x.id === sel ? ' selected':''}>${x.nombre}</option>`).join('');
}
function pintarLista(){
  const l = $('#lista');
  if(!D.pendientes.length){
    l.innerHTML = '<div class="tarjeta vacio">Todavía no hay pendientes.<br>Toca «Agregar un pendiente».</div>';
    return;
  }
  l.innerHTML = D.pendientes.map((p, i) => {
    const m = materia(p.materia), t = tipo(p.tipo);
    return `<div class="tarjeta pend" style="border-left-color:${m.color}" data-i="${i}">
      <div class="pend-cab">
        ${iconoSVG(m.icono, m.color, 2)}
        <b>${m.corto}</b>
        <span style="margin-left:auto; font-size:12px; color:var(--tenue)">${t.nombre}</span>
      </div>
      <label>Materia</label>
      <select data-c="materia">${opciones(MATERIAS, p.materia)}</select>
      <div class="fila">
        <div><label>Tipo</label><select data-c="tipo">${opciones(TIPOS, p.tipo)}</select></div>
        <div><label>Para cuándo</label><select data-c="cuando">${opciones(CUANDOS, p.cuando)}</select></div>
      </div>
      ${p.cuando === 'fecha'
        ? `<label>¿Qué día?</label><input type="date" data-c="dia" value="${p.dia||''}">` : ''}
      <label>Qué es</label>
      <input data-c="titulo" value="${(p.titulo||'').replace(/"/g,'&quot;')}"
        placeholder="Traer el juego de geometría">
      <label class="marca-caja"><input type="checkbox" data-c="destacado"
        ${p.destacado ? 'checked' : ''}> <span>Muy importante · lo sube hasta arriba</span></label>
      <label>Detalles · uno por renglón</label>
      <textarea data-c="detalles" placeholder="Escuadras&#10;Compás&#10;Transportador">${p.detalles||''}</textarea>
      <div class="acciones">
        <button class="btn chico" type="button" data-mover="-1">↑ Subir</button>
        <button class="btn chico" type="button" data-mover="1">↓ Bajar</button>
        <button class="btn chico borrar" type="button" data-borrar="1">Borrar</button>
      </div>
    </div>`;
  }).join('');
}

$('#lista').addEventListener('input', e => {
  const caja = e.target.closest('[data-i]'); if(!caja) return;
  const campo = e.target.getAttribute('data-c'); if(!campo) return;
  D.pendientes[+caja.dataset.i][campo] =
    e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  guardar();
  /* Cambiar materia, tipo o «cuándo» redibuja la ficha (el icono y el campo de
     fecha dependen de eso). Escribir el título NO: si se redibuja, el teclado
     se cierra a media palabra. Ya me pasó probándolo. */
  if(campo === 'materia' || campo === 'tipo' || campo === 'cuando' ||
     campo === 'destacado') pintarLista();
  dibujar();
});
$('#lista').addEventListener('click', e => {
  const caja = e.target.closest('[data-i]'); if(!caja) return;
  const i = +caja.dataset.i;
  if(e.target.hasAttribute('data-borrar')){ D.pendientes.splice(i,1); }
  else if(e.target.hasAttribute('data-mover')){
    const j = i + (+e.target.getAttribute('data-mover'));
    if(j < 0 || j >= D.pendientes.length) return;
    const [x] = D.pendientes.splice(i,1); D.pendientes.splice(j,0,x);
  } else return;
  guardar(); pintarLista(); dibujar();
});
$('#bAgregar').addEventListener('click', () => {
  D.pendientes.push({ materia:'general', tipo:'tarea', cuando:'manana', titulo:'', detalles:'' });
  guardar(); pintarLista(); dibujar();
  const cajas = document.querySelectorAll('#lista [data-i]');
  const ultima = cajas[cajas.length-1];
  if(ultima){ ultima.scrollIntoView({behavior:'smooth', block:'center'});
              const t = ultima.querySelector('[data-c="titulo"]'); if(t) t.focus(); }
});
$('#bVaciar').addEventListener('click', () => {
  if(!D.pendientes.length) return;
  /* Sin confirmación se pierde el trabajo de la tarde de un dedazo. Y no se usa
     `confirm()`: en el teléfono sale un cuadro del navegador que se ve ajeno a
     la app. Se pide tocar dos veces. */
  const b = $('#bVaciar');
  if(b.dataset.seguro !== '1'){
    b.dataset.seguro = '1'; b.textContent = '¿Seguro? Toca otra vez';
    setTimeout(() => { b.dataset.seguro = ''; b.textContent = 'Vaciar la lista'; }, 4000);
    return;
  }
  D.pendientes = []; b.dataset.seguro = ''; b.textContent = 'Vaciar la lista';
  guardar(); pintarLista(); dibujar();
});

['fFecha','fGrupo','fSemestre'].forEach(id => {
  $('#'+id).addEventListener('input', () => {
    D.fecha = $('#fFecha').value; D.grupo = $('#fGrupo').value;
    D.semestre = $('#fSemestre').value; guardar(); dibujar();
  });
});

/* ══ LA IMAGEN ═══════════════════════════════════════════════════════════ */
const ANCHO = 1080, ESC = 2;          /* 2160 px de ancho: nítido en cualquier teléfono */
const escudo = new Image(); escudo.src = 'escudo-rembrandt.png';

function fechaLarga(iso){
  if(!iso) return '';
  const [a,m,d] = iso.split('-').map(Number);
  const f = new Date(a, m-1, d);
  return DIAS[f.getDay()] + ' ' + d + ' de ' + MESES[m-1] + ' de ' + a;
}
function fechaCorta(iso){
  if(!iso) return '';
  const [a,m,d] = iso.split('-').map(Number);
  return DIAS[new Date(a,m-1,d).getDay()].slice(0,3).toUpperCase() + ' ' + d + ' ' + MESES[m-1].slice(0,3).toUpperCase();
}

/* Parte un texto en renglones que quepan en `ancho`. El canvas no envuelve
   solo: si no se hace esto, el texto se sale de la tarjeta y nadie se entera
   hasta que el aviso ya se mandó al chat. */
function envolver(ctx, texto, ancho){
  const palabras = String(texto).split(/\s+/).filter(Boolean);
  const out = []; let linea = '';
  for(const w of palabras){
    const prueba = linea ? linea + ' ' + w : w;
    if(ctx.measureText(prueba).width > ancho && linea){ out.push(linea); linea = w; }
    else linea = prueba;
  }
  if(linea) out.push(linea);
  return out.length ? out : [''];
}
function caja(ctx, x, y, w, h, r, relleno, borde){
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
  if(relleno){ ctx.fillStyle = relleno; ctx.fill(); }
  if(borde){ ctx.strokeStyle = borde; ctx.lineWidth = 1.5; ctx.stroke(); }
}

const F = (peso, tam) => peso + ' ' + tam + 'px ' + getComputedStyle(document.body).fontFamily;

/* Compone el aviso. Se corre DOS veces: la primera sólo mide (pintar=false)
   para saber qué alto necesita el lienzo, la segunda dibuja. Sin la pasada de
   medición habría que adivinar el alto, y con contenido variable eso siempre
   sale mal por un lado o por el otro. */
function componer(ctx, pintar){
  const M = 34;                     /* margen */
  let y = 0;

  /* ── el encabezado ── */
  const altoCab = 168;
  if(pintar){
    caja(ctx, 0, 0, ANCHO, altoCab, 0, '#7C1D24');
    if(escudo.complete && escudo.naturalWidth) ctx.drawImage(escudo, M, 28, 112, 112);
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = 'rgba(255,246,236,.82)';
    ctx.font = F(700, 22); ctx.letterSpacing = '3px';
    ctx.fillText('BACHILLERATO REMBRANDT', M + 138, 62);
    ctx.letterSpacing = '0px';
    ctx.fillStyle = '#FFF6EC'; ctx.font = F(900, 54);
    ctx.fillText('AVISOS Y TAREAS', M + 138, 116);
    ctx.fillStyle = 'rgba(255,246,236,.7)'; ctx.font = F(700, 18);
    ctx.letterSpacing = '4px';
    ctx.fillText('RESPETO · CULTURA · HONOR', M + 138, 146);
    ctx.letterSpacing = '0px';
  }
  y = altoCab;

  /* ── la fila de la fecha ── */
  const altoFila = 66;
  if(pintar){
    caja(ctx, 0, y, ANCHO, altoFila, 0, '#FFF3E2');
    ctx.fillStyle = '#5A1319'; ctx.font = F(800, 25);
    ctx.fillText(fechaLarga(D.fecha), M, y + 43);
    ctx.textAlign = 'right'; ctx.fillStyle = '#7C1D24'; ctx.font = F(800, 23);
    ctx.fillText('Grupo ' + D.grupo + '  ·  ' + D.semestre, ANCHO - M, y + 43);
    ctx.textAlign = 'left';
  }
  y += altoFila + 26;

  /* ── los bloques ── */
  const lista = ordenados();
  let bloqueActual = null;
  for(const p of lista){
    const b = bloqueDe(p);
    if(b !== bloqueActual){
      bloqueActual = b;
      const c = b === 'destacado' ? DESTACADO
                                  : (CUANDOS.find(x => x.id === b) || CUANDOS[3]);
      const fondo = b === 'destacado' ? '#5A1319' : (c.urgente ? '#7C1D24' : '#123A5E');
      if(pintar){
        caja(ctx, M, y, ANCHO - M*2, 52, 10, fondo);
        ctx.fillStyle = '#FFF6EC'; ctx.font = F(900, 26); ctx.letterSpacing = '2px';
        ctx.fillText(c.nombre.toUpperCase(), M + 20, y + 35);
        ctx.letterSpacing = '0px';
      }
      y += 52 + 14;
    }
    y += ficha(ctx, p, M, y, ANCHO - M*2, pintar) + 12;
  }

  if(!lista.length){
    if(pintar){
      ctx.fillStyle = '#6B5A4A'; ctx.font = F(600, 26); ctx.textAlign = 'center';
      ctx.fillText('Sin pendientes por hoy.', ANCHO/2, y + 50);
      ctx.textAlign = 'left';
    }
    y += 90;
  }

  /* ── el pie ── */
  y += 14;
  if(pintar){
    caja(ctx, 0, y, ANCHO, 62, 0, '#7C1D24');
    ctx.fillStyle = 'rgba(255,246,236,.9)'; ctx.font = F(800, 20);
    ctx.textAlign = 'center'; ctx.letterSpacing = '3px';
    ctx.fillText('RESPETO · CULTURA · HONOR', ANCHO/2, y + 39);
    ctx.letterSpacing = '0px'; ctx.textAlign = 'left';
  }
  return y + 62;
}

/* Una ficha de pendiente. Devuelve su alto. */
function ficha(ctx, p, x, y, w, pintar){
  const m = materia(p.materia), t = tipo(p.tipo);
  const pad = 20, sangria = 74;
  let alto = pad;

  ctx.font = F(800, 22);
  const encabezado = 34;
  alto += encabezado + 8;

  ctx.font = F(800, 30);
  const titulo = envolver(ctx, p.titulo || t.nombre, w - sangria - pad);
  alto += titulo.length * 38;

  const detalles = String(p.detalles || '').split('\n').map(s => s.trim()).filter(Boolean);
  ctx.font = F(500, 25);
  const renglones = [];
  for(const d of detalles){
    const ls = envolver(ctx, d, w - sangria - pad - 26);
    renglones.push(ls); alto += ls.length * 33;
  }
  if(detalles.length) alto += 8;
  alto += pad;

  if(pintar){
    /* Una ficha destacada se pinta A COLOR ENTERO, no sólo se sube de lugar.
       Si sólo cambiara de posición, en un aviso de doce pendientes nadie
       notaría cuál es el importante. */
    const D_ = !!p.destacado;
    const tintaFuerte = D_ ? '#FFF6EC' : '#241A14';
    const tintaSuave  = D_ ? 'rgba(255,246,236,.88)' : '#4A3B30';
    const tintaChica  = D_ ? 'rgba(255,246,236,.78)' : '#6B5A4A';

    caja(ctx, x, y, w, alto, 14, D_ ? m.color : '#FFFDF8', D_ ? m.color : '#E6DCCB');
    if(!D_){
      /* la banda de color de la materia, pegada a la izquierda */
      ctx.save();
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(x, y, w, alto, 14); else ctx.rect(x, y, w, alto);
      ctx.clip();
      caja(ctx, x, y, 7, alto, 0, m.color);
      ctx.restore();
    }

    /* el icono de la materia, en su cuadrito */
    caja(ctx, x + pad, y + pad - 2, 50, 50, 12, D_ ? 'rgba(255,246,236,.18)' : m.color + '1F');
    iconoCanvas(ctx, m.icono, x + pad + 10, y + pad + 8, 30, D_ ? '#FFF6EC' : m.color, 2);

    /* materia y tipo */
    ctx.fillStyle = D_ ? 'rgba(255,246,236,.92)' : m.color; ctx.font = F(800, 22);
    ctx.fillText(m.corto.toUpperCase(), x + sangria, y + pad + 20);
    ctx.textAlign = 'right';
    ctx.fillStyle = tintaChica; ctx.font = F(700, 20);
    const etiqueta = t.nombre + (p.cuando === 'fecha' && p.dia ? '  ·  ' + fechaCorta(p.dia) : '');
    ctx.fillText(etiqueta, x + w - pad, y + pad + 20);
    ctx.textAlign = 'left';

    /* el icono del tipo, chiquito, junto a la etiqueta */
    const anchoEti = ctx.measureText(etiqueta).width;
    iconoCanvas(ctx, t.icono, x + w - pad - anchoEti - 30, y + pad + 4, 21, tintaChica, 1.8);

    /* el título */
    let ty = y + pad + encabezado + 34;
    ctx.fillStyle = tintaFuerte; ctx.font = F(800, 30);
    for(const l of titulo){ ctx.fillText(l, x + sangria, ty); ty += 38; }

    /* los detalles */
    ctx.font = F(500, 25);
    ty += detalles.length ? 6 : 0;
    for(const ls of renglones){
      for(let i = 0; i < ls.length; i++){
        if(i === 0){
          ctx.fillStyle = D_ ? 'rgba(255,246,236,.75)' : m.color;
          ctx.beginPath(); ctx.arc(x + sangria + 6, ty - 8, 4.5, 0, Math.PI*2); ctx.fill();
        }
        ctx.fillStyle = tintaSuave;
        ctx.fillText(ls[i], x + sangria + 26, ty); ty += 33;
      }
    }
  }
  return alto;
}

function dibujar(){
  const c = $('#lienzo'), ctx = c.getContext('2d');
  /* pasada 1: medir con una fuente cualquiera puesta */
  c.width = ANCHO * ESC; c.height = 100;
  ctx.setTransform(ESC, 0, 0, ESC, 0, 0);
  const alto = componer(ctx, false);
  /* pasada 2: dibujar. Cambiar el tamaño BORRA el contexto, así que la escala
     se vuelve a poner después. */
  c.width = ANCHO * ESC; c.height = Math.round(alto * ESC);
  const g = c.getContext('2d');
  g.setTransform(ESC, 0, 0, ESC, 0, 0);
  g.fillStyle = '#FAF4EA'; g.fillRect(0, 0, ANCHO, alto);
  componer(g, true);
}

$('#bImagen').addEventListener('click', () => {
  dibujar();
  const c = $('#lienzo');
  const url = c.toDataURL('image/png');
  const nombre = 'avisos-' + D.grupo.replace(/[^\w.]/g,'') + '-' + (D.fecha || hoyISO()) + '.png';
  /* En iPhone el botón de descarga a veces no hace nada, así que además se
     enseña la imagen: manteniéndola apretada se guarda o se comparte. Esa vía
     funciona en todos lados. */
  $('#salida').innerHTML =
    '<h2>Lista</h2>' +
    '<img src="' + url + '" alt="Aviso del grupo">' +
    '<p class="nota"><b>Mantén apretada la imagen</b> para guardarla o mandarla al chat. ' +
    'Si tu teléfono deja descargar, también sirve el botón de abajo.</p>' +
    '<div class="acciones"><a class="btn" style="text-align:center; text-decoration:none; display:block" ' +
    'download="' + nombre + '" href="' + url + '">Descargar la imagen</a></div>';
  $('#salida').scrollIntoView({ behavior:'smooth', block:'start' });
});

/* ══════════════════════════════════════════════════════════════════════════
   PRUEBAS · corren solas al cargar. Si algo se rompió, sale en la consola
   antes de que Carlos mande un aviso mal hecho al grupo.
   ═════════════════════════════════════════════════════════════════════════ */
function pruebas(){
  let bien = 0, mal = 0;
  const ok = (q, c) => { if(c) bien++; else { mal++; console.error('✗ ' + q); } };
  /* Las pruebas escriben encima de lo que Carlos tenga escrito, así que se
     guarda todo y se repone tal cual al terminar. */
  const suyo = JSON.parse(JSON.stringify(D));

  /* ── los datos del grupo ── */
  ok('hay una materia por cada clase del horario', MATERIAS.length >= 11);
  ok('ninguna materia se quedó sin icono', MATERIAS.every(m => ICONOS[m.icono]));
  ok('ningún tipo se quedó sin icono',     TIPOS.every(t => ICONOS[t.icono]));
  ok('ningún id de materia repetido', new Set(MATERIAS.map(m=>m.id)).size === MATERIAS.length);
  ok('cada materia trae color propio', MATERIAS.every(m => /^#[0-9A-F]{6}$/i.test(m.color)));

  /* ── el orden del periódico ── */
  D.pendientes = [
    { materia:'ingles', tipo:'tarea', cuando:'pronto',  titulo:'C' },
    { materia:'fisica', tipo:'tarea', cuando:'manana',  titulo:'A' },
    { materia:'etica',  tipo:'tarea', cuando:'semana',  titulo:'B' },
    { materia:'tec',    tipo:'tarea', cuando:'manana',  titulo:'A2' },
  ];
  const o = ordenados().map(p => p.titulo).join('');
  ok('lo de mañana va primero y lo demás detrás', o === 'AA2BC');

  /* ── el texto que no cabe ── */
  const ctx = $('#lienzo').getContext('2d');
  ctx.font = '30px sans-serif';
  const largo = 'palabra '.repeat(40);
  ok('un texto largo se parte en renglones', envolver(ctx, largo, 400).length > 3);
  ok('un texto vacío no truena', envolver(ctx, '', 400).length === 1);
  /* Que ningún renglón se pase del ancho: si se pasa, el texto se sale de la
     tarjeta y eso NO se ve hasta que el aviso ya se mandó. */
  ok('ningún renglón se sale del ancho',
     envolver(ctx, largo, 400).every(l => ctx.measureText(l).width <= 400 || l.indexOf(' ') < 0));

  /* ── la imagen ── */
  D.fecha = '2026-08-24';
  dibujar();
  const c = $('#lienzo');
  ok('la imagen sale al doble de tamaño', c.width === ANCHO * ESC);
  ok('la imagen crece con el contenido', c.height > 600 * ESC);
  const altoConCuatro = c.height;
  D.pendientes.push({ materia:'redes', tipo:'aviso', cuando:'semana', titulo:'X',
                      detalles:'uno\ndos\ntres' });
  dibujar();
  ok('un pendiente más hace la imagen más alta', c.height > altoConCuatro);
  D.pendientes = [];
  dibujar();
  ok('sin pendientes también se dibuja algo', c.height > 200 * ESC);

  /* ── las fechas en español ── */
  ok('la fecha se escribe en español', fechaLarga('2026-08-24') === 'lunes 24 de agosto de 2026');
  ok('la fecha corta también', fechaCorta('2026-08-28') === 'VIE 28 AGO');
  ok('sin fecha no se inventa nada', fechaLarga('') === '');

  /* ── que no se pierda el trabajo ── */
  D.pendientes = [{ materia:'tec', tipo:'tarea', cuando:'manana', titulo:'guardado' }];
  guardar();
  ok('lo escrito se guarda en el teléfono', (function(){
    try{ return JSON.parse(localStorage.getItem(LLAVE)).pendientes[0].titulo === 'guardado'; }
    catch(e){ return false; }
  })());

  /* ── que los colores se lean ── */
  /* El color de la materia se usa como TEXTO chico sobre el papel, y en una
     ficha destacada el texto crema va encima del color. Las dos veces tiene que
     pasar 4.5:1. El dorado #B98A2E medía 3.07 y nadie lo iba a notar a ojo:
     salió midiendo. */
  const lum = h => { const c=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255)
      .map(v => v<=.03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4));
    return .2126*c[0] + .7152*c[1] + .0722*c[2]; };
  const contra = (a,b) => { const x=lum(a), y=lum(b);
    return (Math.max(x,y)+.05) / (Math.min(x,y)+.05); };
  const flojos = MATERIAS.filter(m => contra(m.color,'#FFFDF8') < 4.5 ||
                                      contra(m.color,'#FFF6EC') < 4.5);
  ok('todos los colores de materia se leen (4.5:1)', flojos.length === 0);
  if(flojos.length) console.error('   flojos:', flojos.map(m => m.corto + ' ' + m.color));
  ok('prefectura no se funde con la banda de «muy importante»',
     (MATERIAS.find(m => m.id === 'prefectura') || {}).color !== '#5A1319');

  /* ── de dónde viene el aviso ── */
  ok('se puede poner un aviso de dirección',
     MATERIAS.some(m => m.id === 'direccion' && m.oficial));
  ok('y de prefectura y de la sociedad de alumnos',
     ['prefectura','sociedad'].every(id => MATERIAS.some(m => m.id === id)));
  D.pendientes = [
    { materia:'ingles', tipo:'tarea', cuando:'manana', titulo:'normal' },
    { materia:'direccion', tipo:'aviso', cuando:'pronto', destacado:true, titulo:'de dirección' },
  ];
  ok('lo destacado se sube por encima de lo de mañana',
     ordenados()[0].titulo === 'de dirección');
  ok('sin destacar, «sin fecha» se va hasta abajo',
     (function(){ D.pendientes[1].destacado = false;
       return ordenados()[0].titulo === 'normal'; })());

  /* ── que se alcance con el dedo ── */
  /* Ya me pasó en Ligas Mazi: campos de 36 px que nadie atina. Aquí se mide,
     no se confía. */
  const chicos = [...document.querySelectorAll('button, select, input, textarea')]
    .filter(e => { const h = e.getBoundingClientRect().height; return h > 0 && h < 44; });
  ok('ningún control mide menos de 44 px de alto', chicos.length === 0);
  if(chicos.length) console.error('   chicos:', chicos.map(e => e.id || e.getAttribute('data-c')));

  /* ── lo que se lee en pantalla ── */
  const copia = document.body.cloneNode(true);
  copia.querySelectorAll('script, style').forEach(e => e.remove());
  const texto = copia.textContent;
  ok('dice que todo se guarda sólo en el teléfono', /sólo en este teléfono/i.test(texto));

  /* se repone lo de Carlos */
  D = suyo; guardar(); pintarLista(); dibujar();

  console.log('%cAvisos 3.1 · ' + bien + '/' + (bien+mal) + ' pruebas',
    'font-weight:700;color:' + (mal ? '#B23A3A' : '#3F6B45'));
}

/* ══ ARRANQUE ════════════════════════════════════════════════════════════ */
/* La fecha arranca SIEMPRE en hoy, aunque los pendientes de ayer sigan ahí.
   Si se guardara la fecha vieja, el error más fácil de cometer sería mandar el
   aviso de hoy fechado ayer — y nadie lo revisa antes de darle enviar.
   Los pendientes NO se borran a propósito: casi siempre el aviso de hoy es el
   de ayer con dos cosas cambiadas, y así sólo se editan. */
D.fecha = hoyISO(); guardar();
$('#fFecha').value = D.fecha;
$('#fGrupo').value = D.grupo;
$('#fSemestre').value = D.semestre;
pintarLista();
escudo.onload = dibujar;
dibujar();
pruebas();
</script>
