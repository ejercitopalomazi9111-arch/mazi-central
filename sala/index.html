const NOMBRE_FAM = {
  persona:'Persona', claude:'Claude', gpt:'GPT', gemini:'Gemini',
  llama:'Llama', mistral:'Mistral', deepseek:'DeepSeek', qwen:'Qwen',
  grok:'Grok', comando:'Cohere', perplexity:'Perplexity',
  copilot:'Copilot', groq:'Groq', local:'En tu máquina',
  otra:'Otra IA', agente:'No dijo cuál', ninguna:'Ya no está en la sala',
};

/* El gris de «ya no sé quién era». Pasa con un evento viejo de alguien que ya
   salió: la sala ya no lo tiene y el evento es de antes de que existieran
   estos campos. Se dice con un color apagado y un círculo punteado en vez de
   inventarle un modelo — inventarlo sería peor que no saber. */
const GRIS = '#6B5C7D';

/* El matiz de la sesión. Mantiene el tono de la cuenta y le mueve la luz: seis
   pasos, cargados hacia lo oscuro a propósito, porque la figura va en blanco
   encima y sobre un morado clarito el blanco deja de leerse. */
function matiz(hex, paso){
  if(!/^#[0-9a-f]{6}$/i.test(hex || '')) return GRIS;
  const n = parseInt(hex.slice(1), 16);
  const k = ((Number(paso) || 0) - 3.6) * 0.085;
  const mez = (c) => Math.max(0, Math.min(255,
    Math.round(k >= 0 ? c + (255 - c) * k : c * (1 + k))));
  return '#' + [(n >> 16) & 255, (n >> 8) & 255, n & 255]
    .map(c => mez(c).toString(16).padStart(2, '0')).join('');
}

/* La credencial de un evento. El evento manda —así un mensaje de hace dos días
   sigue pintándose como se pintó— y la sala sólo rellena lo que falte. */
function credencial(de){
  if(!de) return { id:'?', nombre:'?', tipo:'agente', familia:'ninguna', color:GRIS, sombra:3 };
  const p = gente[de.id] || {};
  const familia = de.familia || p.familia || (de.tipo === 'humano' || p.tipo === 'humano' ? 'persona' : 'ninguna');
  return {
    id: de.id,
    nombre: de.nombre || p.nombre || de.id,
    tipo:   de.tipo   || p.tipo   || 'agente',
    motor:  de.motor  || p.motor  || null,
    cuenta: de.cuenta || p.cuenta || null,
    padre:  de.padre  || p.padre  || null,
    familia,
    color:  de.color  || p.color  || GRIS,
    sombra: de.sombra ?? p.sombra ?? 3,
  };
}

/* ══ DE QUÉ CASA ES CADA QUIEN ═════════════════════════════════════════════
   La mesa tiene dos casas: Carlos y su Claude de un lado, Luis y el suyo del
   otro. Saber de cuál es cada quien es lo que decide de qué lado cae su
   burbuja.

   ⚠ LO BUENO ES `cuenta`, y ya existe: el servidor se la pone a cada quien
   según con qué llave entró. PERO mientras la sala no tenga llaves puestas
   TODOS entran como «invitado», y con eso las dos casas son una. Por eso hay
   un segundo camino: el nombre. Un agente que se llama «Claude de Luis» es
   de Luis, y eso se lee sin preguntarle a nadie.

   El orden importa: primero la cuenta —que es la verdad— y sólo si no dice
   nada, el nombre —que es una deducción. El día que se pongan las llaves,
   esto se apaga solo y nadie tiene que acordarse de venir a borrarlo. */
function bandoDe(c){
  if(!c) return '?';
  if(c.cuenta && c.cuenta !== 'invitado') return String(c.cuenta).toLowerCase();
  const n = String(c.nombre || c.id || '')
    .toLowerCase().replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim();
  /* «claude de luis», «claude-de-carlos», «el claude de Luis» → luis/carlos */
  const m = /\bde\s+([a-záéíóúñ]+)\s*$/.exec(n);
  if(m) return m[1];
  return n.replace(/[^a-záéíóúñ0-9]+/g, '') || String(c.id || '?');
}

/* El bando del que está mirando. Se recalcula cada vez que se pinta porque
   `yo` no existe hasta que se entra. */
function miBando(){
  return yo ? bandoDe(credencial(yo)) : '\u0000nadie';
}

/* ══ EL COLOR DE CADA QUIEN ════════════════════════════════════════════════
   Carlos lo pidió así: «que la burbuja tenga un color dependiendo de quién
   escriba para identificarlos más rápido».

   ⚠ EL COLOR DEL SERVIDOR NO ALCANZA HOY, y se descubrió pintándolo, no
   leyéndolo: `color` es por CUENTA, y mientras la sala no tenga llaves todos
   entran como «invitado» — así que los cuatro salían del MISMO violeta y las
   burbujas quedaban del mismo gris. Un color que es igual para todos no
   identifica a nadie.

   Entonces el tono se arma con lo que sí distingue:
     · el TINTE lo pone la casa (bando). Carlos y su Claude de un color, Luis
       y el suyo de otro — que es justo lo que se quiere cazar de reojo.
     · el MATIZ lo pone la sesión (`sombra`), así la persona y su Claude son
       parientes pero no gemelos.
   Y si algún día el servidor sí da colores de cuenta distintos, ganan ésos:
   la deducción sólo tapa el hueco mientras el hueco exista. */
const TINTES = ['#AC27FF','#E8B33A','#3ECF8E','#5AA9E6','#F0567F','#C77BFF','#7BE0C4'];
function revoltijo(t){
  let h = 0;
  for(const ch of String(t)) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return h;
}
function tonoDe(c){
  const propio = c && /^#[0-9a-f]{6}$/i.test(c.color || '') ? c.color : null;
  /* «El servidor dio un color de verdad» = hay más de un color en la mesa.
     Con uno solo, ese color no está diciendo de quién es nada. */
  const variados = new Set(Object.values(gente).map(p => p.color)).size > 1;
  const base = (propio && variados) ? propio : TINTES[revoltijo(bandoDe(c)) % TINTES.length];
  return matiz(base, c ? c.sombra : 3);
}

/* El avatar. `tam` es '', 'chico' o 'grande'. */
function avatarHtml(c, tam){
  const fondo = matiz(c.color, c.sombra);
  const fig = FIGURAS[c.familia] || FIGURAS.otra;
  const anillo = c.padre ? ' sub' : '';
  const quien = `${c.nombre} · ${c.motor || NOMBRE_FAM[c.familia] || 'agente'}` +
                (c.cuenta ? ` · cuenta de ${c.cuenta}` : '');
  return `<span class="avatar${tam ? ' ' + tam : ''}${anillo}" title="${esc(quien)}"` +
         ` style="background:${fondo}; color:${c.color}">` +
         `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1"` +
         ` stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${fig}</svg></span>`;
}

/* Cómo se dice el modelo en el renglón de abajo del nombre. Se prefiere el
   texto EXACTO que mandó el agente —«claude-opus-5» dice más que «Claude»—
   y la familia queda de respaldo. */
const comoSeLlama = (c) => c.tipo === 'humano' ? 'persona'
  : (c.motor || NOMBRE_FAM[c.familia] || 'agente');

/* ── LA CAJA DE CÓDIGO ─────────────────────────────────────────────────────
   Se usa desde dos lados: un adjunto `codigo` que manda un agente a propósito,
   y los bloques entre ``` que vienen dentro del texto de un mensaje normal. Lo
   segundo importa tanto como lo primero: nadie va a acordarse de mandar un
   adjunto estructurado cuando está contestando rápido, pero las comillas
   triples las escribe todo el mundo por costumbre.

   El código va con `textContent` a través de `esc`, y el original completo
   viaja en un `data-` para que copiar no dependa de leer del DOM ya pintado.

   ⚠ NO se le mete resaltado de sintaxis. Sería una librería de fuera —contra
   la regla de la casa— o cuatrocientas líneas propias para pintar de colores
   algo que ya se lee bien en monoespaciada sobre fondo oscuro. Lo que le
   faltaba a esto no era color: era poder copiarlo. */
function cajaDeCodigo(texto, lenguaje, archivo){
  const donde = archivo || (lenguaje ? String(lenguaje) : 'código');
  /* ⚠ TODO EN UN RENGLÓN, Y NO ES MANÍA DE FORMATO. El cuerpo del mensaje se
     pinta con `white-space: pre-wrap` —hace falta para respetar los saltos de
     quien escribe—, y eso significa que los saltos y la sangría que uno pone
     por legibilidad ENTRE las etiquetas se dibujan como renglones en blanco.
     Con el marcado bonito, la caja salía con un hueco vacío del alto de tres
     renglones encima del rótulo y otro debajo del código. Se vio en la
     captura; leyendo el HTML se ve perfectamente ordenado. */
  return '<div class="caja-codigo">' +
    '<div class="caja-codigo-cab">' +
      '<span class="donde">' + esc(donde) + '</span>' +
      '<button class="copiar" type="button" data-copiar="' + esc(texto) + '">' +
        '<span aria-hidden="true">⧉</span> Copiar</button>' +
    '</div>' +
    '<pre><code>' + esc(texto) + '</code></pre>' +
  '</div>';
}

/* Los bloques entre comillas triples dentro del texto de un mensaje. Se parte
   el texto en trozos y sólo los de código cambian de forma; lo demás sigue
   siendo texto escapado, como siempre. */
function conCodigo(texto){
  const crudo = String(texto == null ? '' : texto);
  if(!crudo.includes('\u0060\u0060\u0060')) return esc(crudo);
  const partes = [];
  const cerca = /\u0060\u0060\u0060([A-Za-z0-9_.+-]{0,24})[ \t]*\n([\s\S]*?)\u0060\u0060\u0060/g;
  let ultimo = 0, m;
  while((m = cerca.exec(crudo)) !== null){
    if(m.index > ultimo) partes.push(esc(crudo.slice(ultimo, m.index)));
    partes.push(cajaDeCodigo(m[2].replace(/\n$/, ''), m[1] || null, null));
    ultimo = cerca.lastIndex;
  }
  if(ultimo < crudo.length) partes.push(esc(crudo.slice(ultimo)));
  return partes.join('');
}

function tarjetaAdjunto(a){
  if(a.clase === 'imagen'){
    const src = a.datos.startsWith('data:') ? a.datos : `data:${a.mime};base64,${a.datos}`;
    /* El hueco se reserva con la proporción que ya venía en el adjunto. */
    const prop = (a.ancho && a.alto) ? ` style="aspect-ratio:${+a.ancho}/${+a.alto}"` : '';
    const med  = (a.ancho && a.alto) ? ` width="${+a.ancho}" height="${+a.alto}"` : '';
    return `<button class="foto" data-grande="${esc(src)}" title="Ver en grande">
      <img src="${esc(src)}"${med}${prop} alt="${esc(a.nombre || 'imagen')}" loading="lazy"></button>`;
  }
  if(a.clase === 'presentacion'){
    const uno = a.laminas[0];
    const src = `data:${uno.mime};base64,${uno.datos}`;
    return `<button class="presenta" data-diapos="${esc(a.id || '')}">
      <img src="${esc(src)}" alt="" loading="lazy">
      <span class="pie-p">📊 <span>${esc(a.titulo || 'Presentación')}</span>
      <b>${a.laminas.length} láminas</b></span></button>`;
  }
  if(a.clase === 'archivo'){
    const acc = { creado:'creado', editado:'editado', borrado:'borrado' }[a.accion] || 'tocado';
    const dentro = `<span class="ico">📄</span><span class="txt">
      <span class="t1">${esc(a.ruta.split('/').pop())}</span>
      <span class="t2">${esc(a.ruta)} · ${acc}</span></span>`;
    return a.enlace
      ? `<a class="tarjeta" href="${esc(a.enlace)}" target="_blank" rel="noopener">${dentro}</a>`
      : `<span class="tarjeta">${dentro}</span>`;
  }
  /* ── un trozo de código, en su caja y con botón de copiar ── */
  if(a.clase === 'codigo'){
    return cajaDeCodigo(a.texto, a.lenguaje, a.archivo);
  }

  /* ── el proceso: cómo lo pensó, con qué, y qué corrió ── */
  if(a.clase === 'pensamiento'){
    /* El resumen del renglón cerrado sale del título si lo mandaron, y si no,
       del primer renglón del propio razonamiento. Nunca de la palabra
       «pensamiento»: un resumen que no distingue un bloque de otro obliga a
       abrirlos todos, que es exactamente lo que se quería evitar. */
    const t = (a.titulo || String(a.texto).split(/\n/)[0] || 'Cómo lo pensó').slice(0, 120);
    return `<details class="proceso piensa">
      <summary><span class="marca">◈</span>
      <span class="de-que">${esc(t)}</span>
      <span class="flechita">›</span></summary>
      <div class="adentro">${esc(a.texto)}</div></details>`;
  }
  if(a.clase === 'skill'){
    const p = a.porque || a.que || '';
    return `<span class="skill-usada" title="${esc(p)}">` +
      `<span class="marca">⚡</span><span class="n">${esc(a.nombre)}</span>` +
      (p ? `<span class="p">· ${esc(p)}</span>` : '') + `</span>`;
  }
  if(a.clase === 'corrida'){
    /* Sin salida no hay nada que abrir: se pinta el renglón y ya. Un
       desplegable que se abre y está vacío es peor que no tenerlo. */
    if(!a.salida){
      return `<span class="proceso corre"><span class="sola">$ ${esc(a.orden)}</span></span>`;
    }
    const cod = Number.isInteger(a.codigo)
      ? `<span class="sello-cod ${a.codigo === 0 ? 'bien' : 'mal'}">` +
        `${a.codigo === 0 ? '✓ 0' : '✗ ' + a.codigo}</span>` : '';
    return `<details class="proceso corre">
      <summary><span class="marca">$</span>
      <span class="de-que">${esc(a.orden)}</span>${cod}
      <span class="flechita">›</span></summary>
      <div class="adentro">${esc(a.salida)}</div></details>`;
  }

  if(a.clase === 'diff'){
    return `<span class="tarjeta"><span class="ico">±</span><span class="txt">
      <span class="t1">${esc(a.ruta)}</span>
      <span class="t2">+${a.mas|0} −${a.menos|0}</span></span></span>`;
  }
  if(a.clase === 'repo'){
    const u = `https://github.com/${encodeURIComponent(a.owner)}/${encodeURIComponent(a.repo)}`;
    return `<a class="tarjeta" href="${esc(a.enlace || u)}" target="_blank" rel="noopener">
      <span class="ico">🐙</span><span class="txt">
      <span class="t1">${esc(a.owner)}/${esc(a.repo)}</span>
      <span class="t2">${esc(a.rama || 'main')}</span></span></a>`;
  }
  if(a.clase === 'enlace'){
    let host = ''; try{ host = new URL(a.url).hostname; }catch(e){}
    return `<a class="tarjeta" href="${esc(a.url)}" target="_blank" rel="noopener">
      <span class="ico">🔗</span><span class="txt">
      <span class="t1">${esc(a.titulo || host || a.url)}</span>
      <span class="t2">${esc(host)}</span></span></a>`;
  }
  return '';
}

const mismoDia = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
function nombreDia(ts){
  const d = new Date(ts), h = new Date();
  if(d.toDateString() === h.toDateString()) return 'Hoy';
  const ayer = new Date(h); ayer.setDate(h.getDate() - 1);
  if(d.toDateString() === ayer.toDateString()) return 'Ayer';
  return d.toLocaleDateString('es-MX', { weekday:'long', day:'numeric', month:'long' });
}

function pintarReacciones(e){
  const r = e.reacciones || {};
  const partes = Object.entries(r).map(([cual, quienes]) => {
    const mia = yo && quienes.includes(yo.id);
    return `<button class="reac ${mia ? 'mia' : ''}" data-reac="${esc(cual)}" data-sobre="${esc(e.id)}">` +
           `${FIGURA[cual] || '•'}<b>${quienes.length}</b></button>`;
  });
  partes.push(`<button class="reaccionar" data-abrir-reac="${esc(e.id)}" aria-label="Reaccionar">＋</button>`);
  /* Un botón POR MENSAJE, no un modo global: uno quiere que le expliquen ESTE
     mensaje, no que le cambien toda la junta. Y el original nunca se toca. */
  /* El mismo botón hace dos cosas distintas según el idioma, y por eso lo
     dice: en español SIMPLIFICA, en inglés TRADUCE. Ofrecer «simple» a quien
     puso la mesa en inglés sería prometerle lo que no va a recibir. */
  partes.push(`<button class="reaccionar simple" data-simple="${esc(e.id)}"
    aria-label="${IDIOMA === 'en' ? 'Read it in English' : 'Explícamelo simple'}">${
      IDIOMA === 'en' ? '🌐 english' : '💬 simple'}</button>`);
  return `<div class="reacciones">${partes.join('')}</div>`;
}

/* Un mensaje se pinta agrupado con el anterior si es del mismo autor, del
   mismo día y dentro de cinco minutos. Es la regla de cualquier app de
   mensajes y es lo que hace que un hilo de trabajo se pueda recorrer. */
function pintarHilo(){
  const c = $('hilo');
  const abajo = c.scrollHeight - c.scrollTop - c.clientHeight < 140;
  const evs = hilo;
  const partes = [];

  evs.forEach((e, i) => {
    const prev = evs[i - 1], sig = evs[i + 1];
    if(!prev || !mismoDia(prev.ts, e.ts)) partes.push(`<div class="dia">${esc(nombreDia(e.ts))}</div>`);

    if(e.tipo === 'sistema'){
      /* ── NO VAN EN EL HILO ─────────────────────────────────────────────
         Carlos: «el chat se atasca de mensajes de x entró x salió y así, pero
         siempre hasta abajo sin importar qué. Mejor haz que sea un letrerito
         que aparezca unos segundos y ya».

         Tenía razón y el defecto es peor de lo que se ve: como cada entrada y
         cada salida es un evento del hilo, EMPUJAN los mensajes de verdad
         hacia arriba y se llevan el final de la conversación. Con dos
         personas reconectándose, el último mensaje real puede quedar cuatro
         pantallas atrás.

         Ahora no se pintan aquí. Lo que llega EN VIVO sale como letrero de
         paso (ver `letrero()`); lo del historial no sale, porque «Luis entró»
         hace tres horas no es información, es ruido. */
      return;
      return;
    }

    const junta = (x, y) => x && y && x.tipo !== 'sistema' && y.tipo !== 'sistema'
      && x.de.id === y.de.id && mismoDia(x.ts, y.ts) && Math.abs(y.ts - x.ts) < 5 * 60_000;
    const conAnterior = junta(prev, e);
    const conSiguiente = junta(e, sig);
    const mio = yo && e.de.id === yo.id;

    const cred = credencial(e.de);
    /* La casa de quien habló contra la casa de quien mira. */
    const otrolado = bandoDe(cred) !== miBando();
    /* El color exacto de esa sesión: el MISMO que su avatar. Que la burbuja y
       el avatar digan lo mismo es lo que deja identificar a alguien sin leer
       su nombre, que es lo que pidió Carlos. */
    const tono = tonoDe(cred);
    /* ⚠ EL AVATAR SE MUDÓ ADENTRO DE LA BURBUJA. Lo pidió Carlos: «mete el
       icono de perfil al mensaje para que se note la separación de qué mensaje
       va de qué lado».

       Estaba afuera, en su propia columna, y eso tenía dos problemas que sólo
       se ven en un teléfono:
        · en los mensajes AGRUPADOS la columna quedaba vacía a propósito —así
          se hace en cualquier chat—, así que la mayoría de las burbujas no
          traía ninguna cara y había que subir a buscar de quién eran;
        · y la columna se comía ~38px de ancho en una pantalla de 390, que es
          justo lo que le falta a un mensaje largo para no partirse feo.

       Adentro del encabezado lo resuelve de los dos lados: cada mensaje con
       nombre trae su cara pegada al nombre, y el ancho vuelve al texto. */
    const av = '';

    /* Un subagente dice de quién salió. Sin eso, en la mesa aparece un nombre
       que nadie reconoce y no se sabe a quién reclamarle. */
    const dePadre = cred.padre
      ? `<span class="cta">↳ de ${esc(gente[cred.padre] ? gente[cred.padre].nombre : cred.padre)}</span>` : '';
    const cab = conAnterior ? '' :
      /* El nombre toma el color de la CUENTA, no un violeta fijo. Antes el
         Claude de Luis salía con nombre morado y avatar naranja: dos señales
         de la misma cosa diciendo cosas distintas. */
      `<div class="quien-dijo">` + avatarHtml(cred, 'chico') +
      `<span class="nom" style="color:${tono}">` +
      `${esc(cred.nombre)}</span><span class="cta">${esc(comoSeLlama(cred))}</span>` +
      /* La hora VA AQUÍ, al lado del nombre. Antes flotaba dentro del texto y
         partía renglones a media frase. En Discord vive junto al autor y por
         eso no estorba: se lee cuando la buscas y desaparece cuando no. */
      `<span class="hora-dijo">${hora(e.ts)}</span>${dePadre}</div>`;

    const etiqueta = (e.tipo && e.tipo !== 'mensaje')
      ? `<span class="tipo t-${esc(e.tipo)}">${esc(NOMBRE_TIPO[e.tipo] || e.tipo)}</span>` : '';

    const aQuien = e.a
      ? `<div class="para-quien">→ ${esc(gente[e.a] ? gente[e.a].nombre : e.a)}</div>` : '';

    let cuerpo = conCodigo(e.texto);
    if(e.tipo === 'limite' && e.limite){
      const v = e.limite.reanuda ? ` Puede seguir a las ${hora(e.limite.reanuda)}`
                                 : ' No dijo a qué hora vuelve.';
      cuerpo = esc(`Se topó con el límite (${e.limite.clase}).${v}`) +
               (e.texto ? '\n' + esc(e.texto) : '');
    }

    const adj = (e.adjuntos && e.adjuntos.length)
      ? `<div class="adjuntos${(e.adjuntos.filter(x => x.clase === 'imagen').length > 1)
          ? ' varias' : ''}">${e.adjuntos.map(tarjetaAdjunto).join('')}</div>` : '';
    const nota = e.nota && e.nota.texto ? `<div class="nota"><span class="nota-para">${e.nota.a
        ? 'Para ' + esc(gente[e.nota.a] ? gente[e.nota.a].nombre : e.nota.a)
        : 'Para quien lo tome'}</span>${esc(e.nota.texto)}</div>` : '';

    const llano = simples[e.id]
      ? `<div class="llano"><span class="llano-rot">${
          IDIOMA === 'en' ? 'In English' : 'En cristiano'}</span>${esc(simples[e.id])}</div>`
      : '';

    partes.push(
      `<div class="grupo ${mio ? 'mio' : ''} ${otrolado ? 'otrolado' : ''} ${
         conAnterior ? 'junto' : ''} ${conSiguiente ? '' : 'fin'}"` +
        ` style="--tono:${tono}; --baño:${tono}33; --halo:${tono}22">` +
      av +
      `<div class="burbuja ${esc(e.tipo)}" data-ev="${esc(e.id)}">` +
        cab + etiqueta + aQuien +
        `<div class="dicho">${cuerpo}${cab ? '' :
           `<span class="sello-hora">${hora(e.ts)}</span>`}</div>` +
        adj + nota + llano + pintarReacciones(e) +
      `</div></div>`);
  });

  c.innerHTML = partes.join('') ||
    '<p class="sistema">Todavía no se ha dicho nada. Empieza tú.</p>';
  if(abajo) c.scrollTop = c.scrollHeight;
}

/* ── reaccionar ─────────────────────────────────────────────────────────── */
let reaccionandoA = null;
/* Las traducciones viven sólo en esta pantalla: no entran al hilo ni las ven
   los demás. Es ayuda de lectura de quien la pidió. */
const simples = {};
$('paletaRejilla').innerHTML = REACCIONES.map(([k, f, q]) =>
  `<button type="button" data-poner="${k}"><span>${f}</span>${q}</button>`).join('');

document.addEventListener('click', (e) => {
  const simple = e.target.closest('[data-simple]');
  if(simple){ explicarSimple(simple.dataset.simple); return; }
  const abrir = e.target.closest('[data-abrir-reac]');
  if(abrir){ reaccionandoA = abrir.dataset.abrirReac; $('paleta').classList.add('abierta'); return; }
  const quitar = e.target.closest('[data-reac]');
  if(quitar) reaccionar(quitar.dataset.sobre, quitar.dataset.reac);
});
$('paletaRejilla').addEventListener('click', (e) => {
  const b = e.target.closest('[data-poner]');
  if(b && reaccionandoA){ reaccionar(reaccionandoA, b.dataset.poner); }
  $('paleta').classList.remove('abierta');
});
$('paleta').addEventListener('click', (e) => {
  if(e.target === $('paleta')) $('paleta').classList.remove('abierta');
});

async function reaccionar(sobre, cual){
  const ev = hilo.find(x => x.id === sobre);
  if(!ev) return;
  if(demo){
    ev.reacciones = ev.reacciones || {};
    const l = ev.reacciones[cual] || [];
    const i = l.indexOf(yo.id);
    if(i >= 0) l.splice(i, 1); else l.push(yo.id);
    if(l.length) ev.reacciones[cual] = l; else delete ev.reacciones[cual];
    return pintarHilo();
  }
  try{
    const r = await fetch(`${SERVIDOR}/api/sala/${sala}/reaccion`, {
      method:'POST', headers: conLlave({ 'content-type':'application/json' }),
      body: JSON.stringify({ de: yo.id, sobre, cual }),
    });
    const c = await r.json();
    if(r.ok){ ev.reacciones = c.reacciones; pintarHilo(); }
    else $('aviso').textContent = c.error;
  }catch(err){ marcarVivo(false); }
}

/* ── explícamelo simple ─────────────────────────────────────────────────── */
async function explicarSimple(id){
  if(simples[id]){ delete simples[id]; return pintarHilo(); }   /* segundo toque lo quita */
  const ev = hilo.find(x => x.id === id);
  if(!ev) return;
  if(demo){
    simples[id] = 'Ejemplo: aquí saldría el mismo mensaje dicho en palabras comunes. '
                + 'Hace falta configurar un traductor para que sea de verdad.';
    return pintarHilo();
  }
  simples[id] = 'Traduciendo…'; pintarHilo();
  try{
    const r = await fetch(`${SERVIDOR}/api/sala/${sala}/traducir`, {
      method:'POST', headers: conLlave({ 'content-type':'application/json' }),
      body: JSON.stringify({ sobre:id, idioma: IDIOMA }),
    });
    const c = await r.json();
    if(r.ok){ simples[id] = c.simple; }
    else {
      delete simples[id];
      /* Se dice la verdad: apagado no es lo mismo que roto. */
      $('aviso').textContent = c.apagado
        ? 'Todavía no hay traductor configurado. ' + (c.comoSePone || '')
        : (c.error || 'No se pudo traducir.');
    }
  }catch(err){
    delete simples[id]; marcarVivo(false);
  }
  pintarHilo();
}

/* ── la pantalla de cada agente ─────────────────────────────────────────── */
function verPantalla(id){
  const p = gente[id];
  if(!p) return;
  const cred = credencial(p);
  const t = p.trabajo;
  const cuantos = t ? (t.total ?? t.de ?? 0) : 0;   /* `de` era el nombre viejo */
  const pct = cuantos ? Math.round((t.va / cuantos) * 100) : 0;
  $('pantallaCaja').innerHTML =
    `<div class="pantalla-cab">
       ${avatarHtml(cred, 'grande')}
       <div><h3>${esc(p.nombre)}</h3>
       <span class="rol">${esc(comoSeLlama(cred))} · cuenta de ${esc(p.cuenta || '—')}</span>${
         cred.padre ? `<br><span class="rol">↳ subagente de ${
           esc(gente[cred.padre] ? gente[cred.padre].nombre : cred.padre)}</span>` : ''}</div>
     </div>` +
    (p.estado === 'topado' || p.estado === 'ocupado'
      ? `<div class="enque"><span class="rot">No puede trabajar</span>
         <div class="tit">${p.estado === 'topado' ? 'Se topó con su límite' : 'Ocupado'}</div>
         <div class="paso">${p.reanuda ? 'Puede seguir a las ' + hora(p.reanuda) : 'Sin hora de regreso'}${
           p.nota ? ' · ' + esc(p.nota) : ''}</div></div>`
      : '') +
    (!conectados.has(p.id) && Date.now() - (p.visto || 0) > 5 * 60_000 && !t
      ? `<div class="enque"><span class="rot">Sin señal</span>
         <div class="tit">Lleva ${Math.round((Date.now() - (p.visto || 0)) / 60_000)} min sin dar señales</div>
         <div class="paso">Entró a la sala, pero eso no quiere decir que esté corriendo.
         Si le mandas algo dirigido, puede que nadie lo lea.</div></div>` : '') +
    (t
      ? `<div class="enque"><span class="rot">Ahorita está en</span>
         <div class="tit">${esc(t.en)}</div>
         ${t.paso ? `<div class="paso">${esc(t.paso)}</div>` : ''}
         ${cuantos ? `<div class="riel-t"><i style="width:${pct}%"></i></div>
                   <div class="paso" style="margin-top:6px">${t.va} de ${cuantos} · ${pct}%</div>` : ''}
         </div>` +
        (t.pasos && t.pasos.length
          ? `<span class="rot" style="font-family:var(--dato);font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muy-tenue);display:block;margin:14px 0 8px">Lo que lleva</span>
             <ul class="bitacora">${t.pasos.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '')
      : `<div class="enque"><span class="rot">Ahorita</span>
         <div class="tit">No está trabajando en nada</div>
         <div class="paso">Un agente sólo aparece aquí mientras reporta con <code>/trabajando</code>.</div></div>`);
  $('pantalla').classList.add('abierta');
}

/* ── la leyenda ─────────────────────────────────────────────────────────
   Un alfabeto que nadie puede leer es decoración. Se marca primero lo que
   está EN LA MESA ahorita: nadie tiene que aprenderse las dieciséis figuras
   para entender a los tres que están adentro. */
function verLeyenda(){
  const dentro = Object.values(gente).map(credencial);
  const cuenta = {};
  for(const c of dentro) cuenta[c.familia] = (cuenta[c.familia] || 0) + 1;

  const familias = Object.keys(FIGURAS)
    .filter(f => f !== 'ninguna')
    .sort((a, b) => (cuenta[b] || 0) - (cuenta[a] || 0));

  const porCuenta = {};
  for(const c of dentro){
    if(!c.cuenta) continue;
    (porCuenta[c.cuenta] = porCuenta[c.cuenta] || { color:c.color, gente:[] }).gente.push(c);
  }

  $('leyendaCaja').innerHTML =
    `<h3>Quién es quién</h3>
     <p>La <b>figura</b> dice de qué modelo es. El <b>color</b>, de quién es la cuenta.
     El <b>anillo</b>, que es un subagente de alguien.</p>` +

    `<h4>De quién es cada color</h4>` +
    (Object.keys(porCuenta).length
      ? Object.entries(porCuenta).map(([nom, d]) =>
          `<div class="cuenta-fila">${
            avatarHtml({ ...d.gente[0], padre:null }, '')}<b>${esc(nom)}</b>
           <span class="sesiones">${d.gente.length} ${d.gente.length === 1 ? 'sesión' : 'sesiones'}${
             d.gente.some(g => g.padre) ? ' · con subagentes' : ''}</span></div>`).join('')
      : '<p>Todavía no hay nadie en la mesa.</p>') +

    `<h4>Qué figura es cada modelo</h4>
     <div class="rejilla-fam">` +
    familias.map(f => {
      const c = { familia:f, color: cuenta[f]
        ? (dentro.find(x => x.familia === f) || {}).color : GRIS, sombra:3 };
      return `<div class="fam${cuenta[f] ? ' aqui' : ''}">${avatarHtml(c, '')}
        <b>${esc(NOMBRE_FAM[f] || f)}</b>${
        cuenta[f] ? `<span class="cuantos">${cuenta[f]} aquí</span>` : ''}</div>`;
    }).join('') + '</div>' +

    `<h4>Las figuras son nuestras</h4>
     <p>No son los logos de cada empresa: son marcas registradas y esto vive en un repo
     público. Se distinguen igual, y nadie tiene nada que reclamar.</p>`;

  $('leyenda').classList.add('abierta');
}
/* ══ LAS LLAVES ═══════════════════════════════════════════════════════════
   Fundar cierra la sala y te da tu llave. Invitar acuña la de otra cuenta.
   Lo que se reparte NO es la llave pelona: es un LINK con la llave adentro,
   porque nadie teclea treinta caracteres bien a la primera. */
let estadoSala = { cerrada:false, dueno:null, yoSoy:null, cuentas:[] };

const ligaDe = (llave) =>
  `${location.origin}${location.pathname}?sala=${encodeURIComponent(sala)}&llave=${encodeURIComponent(llave)}`;

/* Para el Claude del compañero se manda la PUERTA, no la mesa: esa dirección
   se explica sola en texto plano y él se mete sin que nadie le traduzca. */
const ligaAgente = (llave) =>
  `${SERVIDOR}/entrar/${sala}?llave=${encodeURIComponent(llave)}`;

async function alServidor(ruta, cuerpo){
  const r = await fetch(`${SERVIDOR}/api/sala/${sala}/${ruta}`, {
    method:'POST', headers: conLlave({ 'content-type':'application/json' }),
    body: JSON.stringify(cuerpo || {}),
  });
  const d = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(d.error || `el servidor contestó ${r.status}`);
  return d;
}

function verLlaves(recado){
  const c = estadoSala;
  const mio = c.yoSoy;
  $('llavesCaja').innerHTML =
    `<h3>Llaves de la sala</h3>` +
    (recado ? `<div class="aviso-llaves">${esc(recado)}</div>` : '') +

    (!c.cerrada
      ? `<p>Esta sala está <b>abierta</b>: quien tenga el link entra y escribe.
           Está bien para empezar — así al Claude de tu compa le basta el link.</p>
         <h4>Cerrarla y quedarte con ella</h4>
         <p>Te da <b>tu llave</b> y desde ahí sólo entra quien invites.</p>
         <input class="campo" id="quienFunda" value="carlos" maxlength="24"
                autocapitalize="none" autocorrect="off">
         <button class="gordo" id="bFundar">Cerrar la sala y darme mi llave</button>`

      : `<p>Sala de <b>${esc(c.dueno)}</b>. Tú entras como <b>${esc(mio || '—')}</b>.</p>` +
        (mio === c.dueno
          ? `<h4>Invitar a alguien</h4>
             <p>Escribe su nombre y te doy un link con su llave adentro. Se lo
                mandas y ya — no tiene que escribir nada.</p>
             <input class="campo" id="quienInvita" placeholder="luis" maxlength="24"
                    autocapitalize="none" autocorrect="off">
             <button class="gordo" id="bInvitar">Dame el link para invitarlo</button>`
          : `<p style="color:var(--muy-tenue)">Sólo ${esc(c.dueno)} puede invitar.</p>`) +
        (c.cuentas.length
          ? `<h4>Ya tienen llave</h4><p>${c.cuentas.map(esc).join(' · ')}</p>` : '')) +

    `<h4>Este es tu link</h4>
     <div class="liga">${esc(LLAVE ? ligaDe(LLAVE) : ligaDe(''))}</div>
     <button class="gordo calma" id="bCopiarMio">Copiar mi link</button>

     <h4>Ojo con esto</h4>
     <p>El link lleva la llave adentro: <b>quien lo tenga, entra</b>. Es como el
        link de una videollamada con contraseña — se manda a quien va, no a un
        grupo. Si se te va a donde no debía, funda otra sala: son seis letras.</p>`;

  const b = (id, f) => { const e = $(id); if(e) e.addEventListener('click', f); };

  b('bFundar', async () => {
    const cuenta = ($('quienFunda').value || 'carlos').trim();
    $('bFundar').disabled = true; $('bFundar').textContent = 'cerrando…';
    try{
      const d = await alServidor('fundar', { cuenta });
      /* La llave se guarda ANTES de enseñarla: si el usuario cierra la hoja
         sin copiarla, ya está puesta en su teléfono y sigue adentro. Quedarse
         fuera de tu propia sala recién fundada sería lo peor que podría pasar
         aquí, y pasaría por un toque de más. */
      try{ localStorage.setItem('salaLlave', d.llave); }catch(e){}
      location.replace(ligaDe(d.llave));
    }catch(e){
      $('bFundar').disabled = false;
      $('bFundar').textContent = 'Cerrar la sala y darme mi llave';
      verLlaves('No se pudo: ' + e.message);
    }
  });

  b('bInvitar', async () => {
    const cuenta = ($('quienInvita').value || '').trim();
    if(!cuenta) return verLlaves('¿A nombre de quién? Escribe su nombre.');
    $('bInvitar').disabled = true; $('bInvitar').textContent = 'acuñando…';
    try{
      const d = await alServidor('invitar', { cuenta });
      $('llavesCaja').innerHTML =
        `<h3>Listo · llave de ${esc(d.cuenta)}</h3>
         ${d.reusada ? '<div class="aviso-llaves">Esa cuenta ya tenía llave, así que te doy la MISMA. Acuñar otra dejaría dos vivas y ninguna se podría retirar con confianza.</div>' : ''}
         <h4>Para una persona · abre la mesa</h4>
         <div class="liga">${esc(ligaDe(d.llave))}</div>
         <button class="gordo" id="bCopiarPersona">Copiar el de la persona</button>
         <h4>Para su Claude · se explica solo</h4>
         <p>Esta dirección le dice al agente, en texto plano, qué es la sala y
            cómo hablarle. No hace falta que nadie se lo traduzca.</p>
         <div class="liga">${esc(ligaAgente(d.llave))}</div>
         <button class="gordo calma" id="bCopiarAgente">Copiar el del agente</button>
         <button class="gordo calma" id="bVolverLlaves">Volver</button>`;
      const cop = (id, t) => $(id) && $(id).addEventListener('click', (e) => {
        navigator.clipboard.writeText(t).then(() => {
          e.target.textContent = '✓ copiado';
          setTimeout(() => e.target.textContent = 'Copiar otra vez', 1600);
        }).catch(() => { e.target.textContent = 'no se pudo — cópialo a mano'; });
      });
      cop('bCopiarPersona', ligaDe(d.llave));
      cop('bCopiarAgente', ligaAgente(d.llave));
      $('bVolverLlaves').addEventListener('click', () => abrirLlaves());
    }catch(e){
      $('bInvitar').disabled = false;
      $('bInvitar').textContent = 'Dame el link para invitarlo';
      verLlaves('No se pudo: ' + e.message);
    }
  });

  b('bCopiarMio', (e) => {
    navigator.clipboard.writeText(ligaDe(LLAVE)).then(() => {
      e.target.textContent = '✓ copiado';
      setTimeout(() => e.target.textContent = 'Copiar mi link', 1600);
    }).catch(() => { e.target.textContent = 'no se pudo — cópialo a mano'; });
  });

  $('llaves').classList.add('abierta');
}

/* ── conectarse ─────────────────────────────────────────────────────────── */
async function entrar(codigo, nombre){
  const base = `${SERVIDOR}/api/sala/${codigo}`;
  /* ══ LA IDENTIDAD SE RECUERDA, Y POR SALA — NO POR NOMBRE ═══════════════
     Lo reportó Carlos: «cada vez que salgo y entro me pide volver a ingresar
     con mi nombre y el código, y cada vez que lo hago me pone un nuevo
     usuario arriba».

     Eran DOS defectos encadenados, y el segundo lo hacía el arreglo del
     primero:

     1 · Antes el sufijo era `Math.random()`, así que recargar te convertía en
         otra persona. Eso se arregló guardando el id.
     2 · Pero se guardó bajo `sala:CÓDIGO:nombre` — con el NOMBRE dentro de la
         llave. La idea era poder prestar el teléfono. El efecto real fue que
         entrar con el campo del nombre vacío te daba «Alguien», que es OTRO
         nombre, que es OTRA llave, que es OTRA persona. Por eso en la barra
         salían Carlos, Carlos y Alguien: los tres eran él.

     La llave ahora es SÓLO la sala. Si entras con otro nombre no nace nadie
     nuevo: se te cambia el nombre y sigues siendo el mismo. Prestar el
     teléfono se resuelve con «Salir», que borra la memoria a propósito — un
     botón que se aprieta a conciencia, no un campo vacío por descuido. */
  const memoria = `sala-yo:${codigo}`;
  let id = null;
  try{
    const guardado = JSON.parse(localStorage.getItem(memoria) || 'null');
    if(guardado && guardado.id) id = guardado.id;
    /* Compatibilidad con la llave vieja, que sí traía el nombre. Sin esto,
       el arreglo estrenaría a todo mundo una vez más — que es exactamente lo
       que se está arreglando. */
    if(!id){
      const viejo = localStorage.getItem(
        `sala-yo:${codigo}:${nombre.toLowerCase().trim()}`);
      if(viejo) id = viejo;
    }
  }catch(e){}
  if(!id){
    id = `web-${nombre.toLowerCase().replace(/[^a-z0-9]+/g,'-')}-${Math.random().toString(36).slice(2,6)}`;
  }
  try{ localStorage.setItem(memoria, JSON.stringify({ id, nombre })); }catch(e){}

  const r = await fetch(`${base}/entrar`, {
    method:'POST', headers: conLlave({ 'content-type':'application/json' }),
    body: JSON.stringify({ id, nombre, tipo:'humano' }),
  });
  const c = await r.json();
  if(!r.ok) throw new Error(c.error || 'No se pudo entrar.');

  sala = codigo; yo = c.yo;
  localStorage.setItem('sala', JSON.stringify({ codigo, nombre }));
  recordarSala(codigo, nombre);
  pintarYo();
  /* ⚠ EL TALLER 3D SIN ESTO ABRE VACÍO. Lee `?sala=` y `?servidor=` de SU
     propia URL, y el link estaba yendo pelón a `../entorno/`: se veía un
     cuarto sin nadie y parecía que el 3D estaba roto. No estaba roto — es que
     nunca le dijimos a qué sala mirar. Se le pasa también `yo` para que sepa
     de quién es la cámara. */
  $('aTaller').href = `../entorno/?sala=${encodeURIComponent(codigo)}` +
    `&servidor=${encodeURIComponent(SERVIDOR)}&yo=${encodeURIComponent(yo.id)}`;

  const h = await (await fetch(`${base}/hilo`, { headers: conLlave() })).json();
  hilo = h.hilo || []; gente = h.gente || {};
  pintarGente(); pintarHilo();
  abrirSocket(codigo);

  $('puerta').classList.add('ida');
  $('tituloSala').textContent = codigo;
}

function abrirSocket(codigo){
  if(ws) try{ ws.close(); }catch(e){}
  /* Se identifica al conectarse. Sin esto el servidor no sabe de quién es el
     socket, y la mesa te pintaba «sin señal» a los cinco minutos de estar
     mirando sin escribir — con el indicador de la esquina en verde al mismo
     tiempo, porque ése sí veía el socket. */
  const url = `${SERVIDOR.replace(/^http/,'ws')}/api/sala/${codigo}/ws`
            + (yo ? `?de=${encodeURIComponent(yo)}` : '');
  ws = new WebSocket(url);
  /* ── letrero de paso ─────────────────────────────────────────────────────
     Aparece arriba, dura unos segundos y se va. Tres reglas que salieron de
     pensar en cómo se usa esto de verdad:

     1 · Sólo lo que llega EN VIVO. El historial no se anuncia: «Luis entró»
         hace tres horas no es información.
     2 · Máximo tres a la vez. Cuando alguien tiene mala señal, el servidor
         manda entra/sale/entra en ráfaga; sin tope, la pantalla se llena de
         letreros y volvemos al problema de origen con otra forma.
     3 · Si el mismo aviso se repite, se refresca el que ya está en vez de
         apilar otro igual. */
  const LETREROS = 3, DURA = 3600;
  function letrero(texto){
    const caja = $('letreros'); if(!caja) return;
    const ya = [...caja.children].find(x => x.dataset.txt === texto);
    if(ya){ clearTimeout(+ya.dataset.reloj); armarSalida(ya); return; }

    const el = document.createElement('div');
    el.className = 'letrero';
    el.dataset.txt = texto;
    el.innerHTML = texto;
    caja.appendChild(el);
    while(caja.children.length > LETREROS) caja.firstElementChild.remove();
    armarSalida(el);
  }
  function armarSalida(el){
    el.dataset.reloj = setTimeout(() => {
      el.classList.add('yendose');
      setTimeout(() => el.remove(), 320);
    }, DURA);
  }

  ws.onmessage = (m) => {
    const p = JSON.parse(m.data);
    if(p.que === 'hola'){
      hilo = p.hilo; gente = p.gente;
      if(Array.isArray(p.conectados)) conectados = new Set(p.conectados);
      pintarGente(); pintarHilo();
    }
    if(p.que === 'evento'){
      hilo.push(p.evento);
      if(p.evento.tipo === 'sistema'){
        const quien = esc(p.evento.de.nombre);
        letrero(`<b>${quien}</b> ${p.evento.accion === 'entra' ? 'entró' : 'salió'}`);
      }
      pintarHilo(); if(vistaTaller) pintarTaller(); avisarFreno(p.vueltas, p.tope);
    }
    if(p.que === 'gente'){
      gente = p.gente;
      if(Array.isArray(p.conectados)) conectados = new Set(p.conectados);
      pintarGente(); if(vistaTaller) pintarTaller();
    }
    if(p.que === 'reaccion'){
      const ev = hilo.find(x => x.id === p.id);
      if(ev){ ev.reacciones = p.reacciones; pintarHilo(); }
    }
  };
  /* Si se cae, se vuelve a conectar sola. Un chat que se muere en silencio es
     peor que uno que no existe. */
  ws.onopen = () => marcarVivo(true);
  ws.onerror = () => marcarVivo(false);
  ws.onclose = () => {
    if(sala && !demo){
      marcarVivo(false);
      setTimeout(() => abrirSocket(sala), 2500);
    }
  };
}

function avisarFreno(vueltas, tope){
  if(vueltas == null) return;
  $('aviso').textContent = vueltas >= tope - 3
    ? `Llevan ${vueltas} de ${tope} mensajes seguidos entre agentes. Al llegar al tope se frena hasta que escriba una persona.`
    : '';
}

function limpiar(){
  $('texto').value = ''; $('nota').value = '';
  pegados.length = 0; pintarPegados();
}

async function enviar(){
  const texto = $('texto').value.trim();
  const notaTxt = $('nota').value.trim();
  if(!texto && !notaTxt) return;

  const cuerpo = { de: yo.id, texto };
  /* `vista` es la copia con encabezado data: que usa la miniatura de aquí;
     al servidor sólo va el base64 pelón, que es lo que él sabe revisar. */
  if(pegados.length) cuerpo.adjuntos = pegados.map(({ vista, ...a }) => a);
  /* El tipo va SÓLO si lo escogiste. El servidor lo guarda como «mensaje»
     cuando falta, y así una junta se parece a una junta. */
  const t = $('tipo').value;
  if(t) cuerpo.tipo = t;
  if(notaTxt) cuerpo.nota = { a: $('para').value || null, texto: notaTxt };

  if(demo){
    hilo.push({ ...cuerpo, tipo: t || 'mensaje', id:'x'+hilo.length, ts:Date.now(),
                de:yo, adjuntos: cuerpo.adjuntos || [], nota: cuerpo.nota || null });
    limpiar(); pintarHilo(); if(vistaTaller) pintarTaller(); return;
  }
  $('bEnviar').disabled = true;
  try{
    const r = await fetch(`${SERVIDOR}/api/sala/${sala}/decir`, {
      method:'POST', headers: conLlave({ 'content-type':'application/json' }),
      body: JSON.stringify(cuerpo),
    });
    const c = await r.json();
    if(!r.ok){ $('aviso').textContent = c.error; return; }
    limpiar(); $('aviso').textContent = '';
    marcarVivo(true);
  }catch(e){
    marcarVivo(false);
    $('aviso').textContent = 'No se pudo enviar. Tu mensaje sigue escrito: vuelve a picarle cuando regrese la conexión.';
  }finally{
    $('bEnviar').disabled = false;
  }
}

/* ── ¿está vivo el servidor? ──────────────────────────────────────────────
   Sin esto, si la sala se cae la mesa se ve idéntica y uno sigue escribiendo
   creyendo que llega. Un chat que se muere callado es peor que uno que no
   existe. */
let vivo = true;
function marcarVivo(ok, razon){
  vivo = ok;
  $('caido').textContent = ok ? '' :
    (razon || 'Sin conexión con la sala. Reintentando…');
  /* ⚠ Lo cachó Carlos: «si está sin conexión el punto es gris, no verde».
     El punto de tu panel estaba clavado en verde y el renglón decía «En
     línea» pasara lo que pasara — o sea que la única señal de que sigues
     conectado seguía diciendo que sí justo cuando ya no. Un indicador que no
     puede decir que no, no es un indicador: es un adorno.
     Ahora lo mueve el socket, que es quien sabe. */
  pintarYo();
  /* Y el renglón de arriba tampoco puede presumir gente en línea cuando el
     que no está en línea eres tú: no te llegan sus señales. */
  const pv = $('puntoVivo');
  if(pv && !ok) pv.classList.remove('vivo');
}


/* ══ IMÁGENES ═════════════════════════════════════════════════════════════
   El servidor topa el evento en ~1.5 MB, y una foto de teléfono pesa cuatro.
   Entonces se encoge AQUÍ antes de mandarla: si se mandara tal cual, el
   servidor la rechazaría y el usuario nada más vería un error sin saber qué
   hacer. Encoger es la diferencia entre «no se pudo» y que funcione. */
const TOPE_LADO = 1600;
const pegados = [];

function encoger(archivo){
  return new Promise((listo, falla) => {
    const lector = new FileReader();
    lector.onerror = () => falla(new Error('No se pudo leer la imagen.'));
    lector.onload = () => {
      const img = new Image();
      img.onerror = () => falla(new Error('Ese archivo no es una imagen que se pueda abrir.'));
      img.onload = () => {
        const f = Math.min(1, TOPE_LADO / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * f); c.height = Math.round(img.height * f);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        /* PNG sólo si es chica; si no, JPEG, que para una captura o una foto
           pesa una fracción y no se nota. */
        let datos = c.toDataURL('image/jpeg', .82);
        let mime = 'image/jpeg';
        if(datos.length > 1_400_000) datos = c.toDataURL('image/jpeg', .6);
        listo({ clase:'imagen', mime, nombre: archivo.name || 'imagen',
                datos: datos.split(',')[1], ancho:c.width, alto:c.height, vista:datos });
      };
      img.src = lector.result;
    };
    lector.readAsDataURL(archivo);
  });
}

async function pegar(archivos){
  for(const a of [...archivos].slice(0, 6)){
    if(!/^image\//.test(a.type)) continue;
    try{ pegados.push(await encoger(a)); }
    catch(e){ $('aviso').textContent = e.message; }
  }
  pintarPegados();
}

function pintarPegados(){
  $('pegados').innerHTML = pegados.map((p, i) =>

}
$('pegados').addEventListener('click', (e) => {

});

/* ══ COMANDOS ═════════════════════════════════════════════════════════════ */
const COMANDOS = [
  { cmd:'/acta',   que:'Arma el acta con lo decidido y lo aprendido' },
  { cmd:'/imagen', que:'Adjuntar una imagen' },
  { cmd:'/quien',  que:'Quién está en la sala y quién puede trabajar' },
  { cmd:'/vista',  que:'Cambiar entre el chat y cómo trabajan' },
  { cmd:'/nota',   que:'Dejarle una nota a alguien al final' },
  { cmd:'/ayuda',  que:'Esta lista' },
];
let elegido = 0;

function verComandos(){
  const t = $('texto').value;
  const m = /(^|\n)\/([a-zá-ú]*)$/i.exec(t);
  const caja = $('comandos');
  if(!m){ caja.hidden = true; return; }
  const filtro = m[2].toLowerCase();
  const lista = COMANDOS.filter(c => c.cmd.slice(1).startsWith(filtro));
  if(!lista.length){ caja.hidden = true; return; }
  elegido = Math.min(elegido, lista.length - 1);
  caja.innerHTML = lista.map((c, i) =>
    `<button type="button" data-cmd="${c.cmd}" class="${i === elegido ? 'aqui' : ''}">` +
    `<b>${c.cmd}</b><span>${c.que}</span></button>`).join('');
  caja.hidden = false;
  const r = $('texto').getBoundingClientRect();
  caja.style.bottom = (innerHeight - r.top + 8) + 'px';
}

function correrComando(cmd){
  $('comandos').hidden = true;
  $('texto').value = $('texto').value.replace(/(^|\n)\/[a-zá-ú]*$/i, '$1');
  if(cmd === '/imagen') return $('archivo').click();
  if(cmd === '/vista')  return cambiarVista();
  if(cmd === '/acta')   return armarActa();
  if(cmd === '/nota'){ if($('extra').hidden) $('bMas').click(); return $('nota').focus(); }
  if(cmd === '/quien'){
    const l = Object.values(gente).map(p =>
      `· ${p.nombre} (${p.tipo === 'humano' ? 'persona' : 'claude'})` +
      (p.estado === 'topado' ? ` — topado, vuelve ${hora(p.reanuda)}` : ''));
    $('aviso').textContent = l.join('   ') || 'Nadie más todavía.';
    return;
  }
  if(cmd === '/ayuda'){
    $('aviso').textContent = COMANDOS.map(c => c.cmd).join('  ');
  }
}
$('texto').addEventListener('input', verComandos);
/* Si el cursor se va del cuadro, el menú se cierra. Sin esto se quedaba
   flotando encima del hilo y tapaba la conversación. El retardo es para que
   alcance a registrarse el clic en una opción antes de que desaparezca. */
$('texto').addEventListener('blur', () => setTimeout(() => { $('comandos').hidden = true; }, 160));
$('comandos').addEventListener('click', (e) => {
  const b = e.target.closest('[data-cmd]');
  if(b) correrComando(b.dataset.cmd);
});
$('texto').addEventListener('keydown', (e) => {
  if($('comandos').hidden) return;
  const botones = [...$('comandos').querySelectorAll('[data-cmd]')];
  if(e.key === 'ArrowDown'){ e.preventDefault(); elegido = (elegido + 1) % botones.length; verComandos(); }
  if(e.key === 'ArrowUp'){ e.preventDefault(); elegido = (elegido - 1 + botones.length) % botones.length; verComandos(); }
  if(e.key === 'Escape'){ $('comandos').hidden = true; }
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault(); correrComando(botones[elegido].dataset.cmd);
  }
});

/* ══ EL ACTA ══════════════════════════════════════════════════════════════
   El hilo largo se recorta solo; el acta es lo que queda. Se arma con lo que
   de verdad sirve después: lo decidido, lo que se ejecutó, y lo que los
   agentes escribieron como aprendizaje. Sale en Markdown para que se pueda
   guardar, mandar, o pasarle a `herramientas/acta.mjs` y sacar el PDF con
   avatares que ya existe. */
function textoActa(){
  const dia = new Date().toLocaleDateString('es-MX',
    { day:'2-digit', month:'long', year:'numeric' });
  const de = (t) => hilo.filter(e => e.tipo === t);
  const lineas = [`# Acta de la sala ${sala || ''}`, '', `_${dia}_`, ''];

  const quienes = Object.values(gente);
  if(quienes.length){
    lineas.push('## Quiénes estuvieron', '');
    quienes.forEach(p => lineas.push(
      `- **${p.nombre}** — ${p.tipo === 'humano' ? 'persona' : 'claude'} (${p.cuenta})`));
    lineas.push('');
  }
  const bloque = (titulo, evs, vacio) => {
    lineas.push(`## ${titulo}`, '');
    if(!evs.length){ lineas.push(`_${vacio}_`, ''); return; }
    evs.forEach(e => lineas.push(`- **${e.de.nombre}:** ${e.texto.replace(/\n/g, ' ')}`));
    lineas.push('');
  };
  bloque('Lo que se decidió', de('decision'), 'No se decidió nada todavía.');
  bloque('Lo que se hizo', de('ejecucion'), 'Nada ejecutado todavía.');
  bloque('Lo que quedó revisado', de('revision'), 'Sin revisiones.');
  bloque('Lo que aprendimos', de('acta'), 'Nadie escribió aprendizajes todavía.');

  const trabas = de('bloqueo').concat(de('limite'));
  if(trabas.length){
    lineas.push('## Lo que se atoró', '');
    trabas.forEach(e => lineas.push(`- **${e.de.nombre}:** ${
      e.tipo === 'limite'
        ? `se topó con su límite${e.limite && e.limite.reanuda ? `, vuelve ${hora(e.limite.reanuda)}` : ''}`
        : e.texto.replace(/\n/g, ' ')}`));
    lineas.push('');
  }
  lineas.push('---', '',
    `_${hilo.length} mensajes en el hilo. Armada desde La Sala._`);
  return lineas.join('\n');
}

function armarActa(){
  const txt = textoActa();
  /* Se descarga como archivo Y se deja en el cuadro de escribir, para que se
     pueda mandar a la sala tal cual si se quiere que quede en el hilo. */
  try{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], { type:'text/markdown' }));
    a.download = `acta-${sala || 'sala'}-${new Date().toISOString().slice(0,10)}.md`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    $('aviso').textContent = 'Acta descargada. También quedó escrita abajo por si quieres mandarla a la sala.';
  }catch(e){
    $('aviso').textContent = 'No se pudo descargar; quedó escrita abajo.';
  }
  $('texto').value = txt;
  if($('extra').hidden) $('bMas').click();
  $('tipo').value = 'acta';
}

/* ══ LAS TRES VISTAS ══════════════════════════════════════════════════════
   chat · hebras · taller 3D, todas en el mismo lugar. Antes eran dos apps y
   una perilla de dos posiciones; ahora es una pestaña por vista y el 3D dejó
   de vivir en otra pestaña del navegador. */
let vista = 'chat';
/* `vistaTaller` se conserva porque lo consultan tres lugares que refrescan la
   vista de hebras cuando llega algo nuevo. Es una vista de la misma verdad,
   no un segundo estado que haya que mantener a mano. */

/* ── el taller, sólo cuando de verdad se va a ver ────────────────────────
   Una escena de three.js con su vendor pesa más que toda la mesa. Cargarla al
   abrir la sala haría que quien nada más quiere escribir pague el motor 3D
   sin verlo nunca. Así que el <iframe> nace la primera vez que se toca la
   pestaña, y de ahí se queda vivo — recrearlo en cada cambio volvería a
   arrancar la escena y perdería la cámara donde uno la dejó. */
let marcoPuesto = false;
function prender3D(){
  if(marcoPuesto) return;
  const caja = $('marco3d');
  caja.innerHTML = '<div class="cargando">Levantando el taller…</div>';
  const m = document.createElement('iframe');
  m.title = 'El taller en 3D';
  m.allow = 'fullscreen';
  /* Se le pasa a QUÉ sala mirar. Sin esto abre un cuarto vacío y parece roto:
     el taller lee `?sala=` de su propia URL, no adivina. */
  /* ⚠ EN LA SALA DE EJEMPLO SE LE PASA `demo=1`, NO EL CÓDIGO. La sala de
     ejemplo se inventa el código «EJEMPL» para que la barra enseñe algo, pero
     esa sala NO EXISTE en el servidor: pasársela al taller lo dejaba pidiendo
     datos de la nada, y el resultado era un cuarto NEGRO sin error, sin aviso
     y sin panel. Se ve idéntico a que el 3D esté roto, y ahí se pierde la
     tarde buscando en el lugar equivocado. Costó una. */
  m.src = demo
    ? `../entorno/?demo=1&dentro=1`
    : `../entorno/?sala=${encodeURIComponent(sala || '')}` +
      `&servidor=${encodeURIComponent(SERVIDOR)}` +
      `&yo=${encodeURIComponent((yo && yo.id) || '')}&dentro=1`;
  m.addEventListener('load', () => { const c = caja.querySelector('.cargando');
                                     if(c) c.remove(); });
  caja.appendChild(m);
  marcoPuesto = true;
}

/* ── copiar un trozo de código ──────────────────────────────────────────────
   Va delegado en el documento y no colgado de cada botón: el hilo se repinta
   entero en cada mensaje, así que un escuchador por botón se pierde en el
   siguiente repintado —y peor, se acumula si alguien lo vuelve a colgar—.

   ⚠ DOS VÍAS, Y LA SEGUNDA NO SOBRA. `navigator.clipboard` sólo existe en
   contexto seguro: https o localhost. La mesa vive en https, pero abierta por
   IP en la red de casa —que es como se prueba entre dos aparatos— NO hay
   clipboard, y el botón se quedaría mudo sin decir por qué. La vía vieja
   (`execCommand`) es fea y funciona en todos lados.

   Y si las dos fallan, se DICE. Un botón de copiar que no copia y no avisa es
   peor que no tenerlo: te llevas el silencio creyendo que ya lo tienes. */
async function alPortapapeles(texto){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(texto);
      return true;
    }
  }catch(e){ /* se cae a la vía vieja */ }
  try{
    const c = document.createElement('textarea');
    c.value = texto;
    /* Fuera de pantalla pero SELECCIONABLE. Con `display:none` el navegador no
       deja seleccionar y `execCommand` no copia nada. */
    c.style.cssText = 'position:fixed; top:-1000px; left:0; opacity:0';
    c.setAttribute('readonly', '');
    document.body.appendChild(c);
    c.select(); c.setSelectionRange(0, texto.length);
    const bien = document.execCommand('copy');
    document.body.removeChild(c);
    return bien;
  }catch(e){ return false; }
}

document.addEventListener('click', async (e) => {
  const b = e.target.closest('.copiar');
  if(!b) return;
  const bien = await alPortapapeles(b.dataset.copiar || '');
  const antes = b.innerHTML;
  b.innerHTML = bien ? '<span aria-hidden="true">✓</span> Copiado'
                     : '<span aria-hidden="true">✕</span> No se pudo';
  b.classList.add(bien ? 'listo' : 'falló');
  /* El botón vuelve a su estado: si se quedara en «Copiado», la segunda vez no
     se sabría si el toque hizo algo. */
  clearTimeout(b.__t);
  b.__t = setTimeout(() => {
    b.innerHTML = antes; b.classList.remove('listo', 'falló');
  }, 1800);
});

function salirme(){
  /* ⚠ Salir NO borra la identidad, y el intento de que sí la borrara revivió
     el mismo defecto por otra puerta: al salir, la sala seguía en «Tus
     salas», tocarla volvía a entrar con el nombre recordado y —sin identidad
     guardada— nacía otra persona con el mismo nombre. Exactamente lo que
     Carlos reportó.

     Salir es «cierra la sala en esta pantalla», nada más. Ser otra persona se
     resuelve escribiendo otro nombre —que ahora RENOMBRA en vez de duplicar—
     y prestar el teléfono de verdad se resuelve quitando la sala de la lista
     con su ✕, que sí borra todo lo de esa sala.

     La banderita es de la pestaña (`sessionStorage`) y no del teléfono: sin
     ella, entrar solo te volvería a meter en el mismo instante y no habría
     manera de salirse. Al cerrar la app se olvida, que es lo que se quiere —
     mañana vuelve a entrar solo. */
  try{
    sessionStorage.setItem('sala-me-sali', '1');
    localStorage.removeItem('sala');
  }catch(e){}
  apagar3D();
  location.reload();
}

/* ══ LOS CAJONES ═══════════════════════════════════════════════════════════
   En teléfono los lados entran deslizándose y el chat se queda con toda la
   pantalla. En pantalla ancha ya están puestos y esto no hace nada visible —
   por eso el velo se apaga por CSS allá y no hay que preguntar el ancho aquí. */
function abrirCajon(cual){
  const otro = cual === 'ladoIzq' ? 'ladoDer' : 'ladoIzq';
  $(otro).classList.remove('abierto');

}

/* ══ TUS SALAS ═════════════════════════════════════════════════════════════
   Lo pidió Carlos: «un menú principal donde salgan las salas donde ya estás
   incluido y el botón para unirte a una nueva».

   El problema real: para volver a una sala había que acordarse de seis letras
   sin sentido. Un código que hay que recordar es un código que se pierde, y
   la sala se vuelve de un solo uso.

   Vive en el teléfono, no en el servidor: es la lista de ESTE aparato, y ni
   la llave ni el nombre salen de aquí. */
const SALAS = 'sala-mis-salas';

function misSalas(){
  try{
    const v = JSON.parse(localStorage.getItem(SALAS) || '[]');
    return Array.isArray(v) ? v.filter(x => x && x.codigo) : [];
  }catch(e){ return []; }
}
function escribirSalas(lista){
  try{ localStorage.setItem(SALAS, JSON.stringify(lista.slice(0, 12))); }catch(e){}
}
function recordarSala(codigo, nombre){
  const otras = misSalas().filter(x => x.codigo !== codigo);
  escribirSalas([{ codigo, nombre, ts: Date.now() }, ...otras]);
}
function olvidarSala(codigo){
  escribirSalas(misSalas().filter(x => x.codigo !== codigo));
  /* Quitar la sala se lleva TAMBIÉN quién eras en ella. Es el único borrado
     de identidad que hay, y está donde debe estar: en un botón que dice
     «quitar», no en el que dice «salir». */
  try{ localStorage.removeItem(`sala-yo:${codigo}`); }catch(e){}
  pintarSalas();
}

/* «hace 3 h», no una fecha: lo que importa es qué tan fresca está la sala. */
function desdeCuando(ts){
  if(!ts) return '';
  const min = Math.round((Date.now() - ts) / 60000);
  if(min < 2)    return 'ahorita';
  if(min < 60)   return `hace ${min} min`;
  const hrs = Math.round(min / 60);
  if(hrs < 24)   return `hace ${hrs} h`;
  const dias = Math.round(hrs / 24);
  return dias === 1 ? 'ayer' : `hace ${dias} días`;
}

function pintarSalas(){
  const lista = misSalas();
  const caja = $('listaSalas');
  caja.innerHTML = '';
  for(const s of lista){
    const fila = document.createElement('div');
    fila.className = 'sala-guardada';
    const ir = document.createElement('button');
    ir.className = 'ir';
    ir.type = 'button';
    ir.dataset.codigo = s.codigo;
    ir.innerHTML = `<b></b><span class="como"></span><small></small>`;
    ir.querySelector('b').textContent = s.codigo;
    ir.querySelector('.como').textContent = s.nombre ? `como ${s.nombre}` : '';
    ir.querySelector('.como').style.cssText =
      'color:var(--tenue); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap';
    ir.querySelector('small').textContent = desdeCuando(s.ts);
    const quitar = document.createElement('button');
    quitar.className = 'quitar-sala';
    quitar.type = 'button';
    quitar.dataset.quitar = s.codigo;
    quitar.setAttribute('aria-label', `Quitar ${s.codigo} de la lista`);
    quitar.textContent = '✕';
    fila.append(ir, quitar);
    caja.appendChild(fila);
  }
  /* Si hay salas guardadas, la puerta abre con la lista y el formulario se
     esconde detrás de «Entrar a otra sala» — que es el caso de todos los
     días. Si no hay ninguna, la puerta se ve igual que siempre. */
  $('misSalas').hidden = lista.length === 0;
  $('formEntrar').hidden = lista.length > 0;
}

$('listaSalas').addEventListener('click', (e) => {
  const q = e.target.closest('[data-quitar]');
  if(q){ olvidarSala(q.dataset.quitar); return; }
  const ir = e.target.closest('[data-codigo]');
  if(!ir) return;
  const guardada = misSalas().find(x => x.codigo === ir.dataset.codigo);
  if(!guardada) return;
  $('error').textContent = 'Entrando…';
  entrar(guardada.codigo, guardada.nombre || 'Alguien')
    .then(() => { $('error').textContent = ''; })
    .catch(err => { $('error').textContent = err.message; });
});

$('bOtraSala').addEventListener('click', () => {
  $('formEntrar').hidden = false;
  $('codigoIn').value = '';

});

/* El nombre con el que entraste la última vez a ESA sala. */
function nombreRecordado(codigo){
  try{
    const g = JSON.parse(localStorage.getItem(`sala-yo:${codigo}`) || 'null');
    if(g && g.nombre) return g.nombre;
  }catch(e){}
  const s = misSalas().find(x => x.codigo === codigo);
  return (s && s.nombre) || '';
}

/* ══ VOLVER A ENTRAR SOLO ══════════════════════════════════════════════════
   Carlos: «cada vez que salgo y entro a la app me pide volver a ingresar con
   mi nombre y el código».

   Tenía razón en que eso no debería pasar, y el diagnóstico es que la puerta
   sólo RELLENABA los campos — nunca entraba. En un navegador eso se nota
   poco; en una app de la pantalla de inicio, que se cierra y se abre veinte
   veces al día, es una puerta que hay que empujar veinte veces.

   Ahora: si ya entraste antes a esta sala en este teléfono, se entra solo. Si
   falla, no se cierra la puerta ni se traga el error — se queda con el
   formulario puesto y el motivo escrito. */
(async function(){
  pintarSalas();
  const g = (params.get('sala') || '').toUpperCase();
  let ultima = null;
  try{ ultima = JSON.parse(localStorage.getItem('sala') || 'null'); }catch(e){}

  /* Tres fuentes, en orden de qué tan explícitas son: el link, la última sala
     usada, y —la que salva el caso raro— la lista de tus salas. Sin la
     tercera, perder el apunte de «última sala» dejaba la identidad guardada
     pero sin saber a qué puerta llevarla, y la app volvía a pedir todo aunque
     tuviera con qué no pedirlo. Salió probando, no leyendo. */
  const guardadas = misSalas();
  const codigo = g || (ultima && ultima.codigo) ||
                 (guardadas[0] && guardadas[0].codigo) || '';
  const nombre = nombreRecordado(codigo) || (ultima && ultima.nombre) || '';
  if(codigo) $('codigoIn').value = codigo;
  if(nombre) $('nombreIn').value = nombre;

  /* Se entra solo únicamente si YA hay identidad guardada para esa sala: eso
     prueba que este teléfono ya estuvo adentro. Con un ?sala= de alguien más
     no se entra solo — ahí sí hay que decir quién eres. */
  let conocida = false;
  try{ conocida = !!JSON.parse(localStorage.getItem(`sala-yo:${codigo}`) || 'null'); }catch(e){}

  let meSali = false;
  try{ meSali = sessionStorage.getItem('sala-me-sali') === '1'; }catch(e){}
  if(meSali){ try{ sessionStorage.removeItem('sala-me-sali'); }catch(e){} }

  if(codigo.length === 6 && nombre && conocida && !meSali){
    $('error').textContent = 'Entrando…';
    try{ await entrar(codigo, nombre); $('error').textContent = ''; return; }
    catch(e){ $('error').textContent = `No se pudo entrar solo: ${e.message}`; }
  }

  if(g){ $('formEntrar').hidden = false; $('nombreIn').focus(); return; }
  /* Con salas guardadas NO se enfoca nada: en el teléfono, enfocar abre el
     teclado y tapa justo la lista que se acaba de pintar. */
  if(misSalas().length === 0) $('codigoIn').focus();
})();

   Luis: «necesito un toggle que traduzca TODO a inglés porque me gusta poder
   leer en inglés». Son DOS cosas y conviene no confundirlas, porque una
   funciona sola y la otra depende de que haya traductor:

   1 · LA INTERFAZ (botones, rótulos, vacíos, avisos). Se traduce aquí mismo,
       con un diccionario. Sin red, sin llave, sin costo y sin esperar.
   2 · LOS MENSAJES, que son texto que escribió una persona y no se pueden
       adivinar. Ésos van al traductor del servidor. Si está apagado se DICE,
       no se finge — igual que hace «explícamelo simple».

   ── POR QUÉ UN DICCIONARIO Y NO EDITAR CADA PINTADO ────────────────────
   La mesa arma HTML en veinte sitios distintos. Meter un `t(...)` en cada uno
   es mucho toque y, peor, se desincroniza en el primer cambio que alguien
   haga sin acordarse del inglés. Esto trabaja sobre el DOM ya pintado: lo que
   aparezca en pantalla se traduce, lo escriba quien lo escriba.

/* ── LO QUE LLEVA UN NÚMERO ADENTRO ──────────────────────────────────────
   «3 en línea» no está en el diccionario y no puede estarlo: el número cambia.
   El diccionario casa frases EXACTAS —que es lo que lo hace seguro— así que
   para éstas hace falta una regla aparte, y sólo para éstas. Van en pares:
   la de ida y la de vuelta, porque el botón tiene que regresar a español. */
const PAT_EN = [[/^(\d+) en línea$/, '$1 online']];
const PAT_ES = [[/^(\d+) online$/, '$1 en línea']];

/* El camino de vuelta. Se arma solo, y de paso avisa si dos frases distintas
   acabaron con la misma traducción: eso rompería el regreso a español y es el
   tipo de cosa que uno no nota hasta que ya la publicó. */
const ES = {};
for(const [es, en] of Object.entries(EN)){
  if(ES[en] && ES[en] !== es) console.warn('idioma: dos frases comparten traducción →', en);
  if(!ES[en]) ES[en] = es;
}

const ATRIBUTOS = ['placeholder', 'aria-label', 'title'];
let observador = null;

function cambiar(txt, mapa, patrones){
  const limpio = String(txt).trim();
  if(!limpio) return null;
  let puesto = mapa[limpio];
  if(puesto == null && patrones){
    for(const [re, con] of patrones){
      if(re.test(limpio)){ puesto = limpio.replace(re, con); break; }
    }
  }
  if(puesto == null || puesto === limpio) return null;
  /* Se conserva el espacio de alrededor: en el HTML hay saltos de línea y
     sangría que sostienen el diseño, y comérselos mueve cosas de lugar. */
  return String(txt).replace(limpio, puesto);
}

function recorrer(raiz, mapa, patrones){
  const paso = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      const p = n.parentNode;
      if(!p) return NodeFilter.FILTER_REJECT;
      const t = p.nodeName;
      /* Ni el código ni lo que la persona está escribiendo. */
      if(t === 'SCRIPT' || t === 'STYLE' || t === 'TEXTAREA') return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    },
  });
  const cambios = [];
  for(let n = paso.nextNode(); n; n = paso.nextNode()){
    const nuevo = cambiar(n.nodeValue, mapa, patrones);
    if(nuevo != null) cambios.push([n, nuevo]);
  }
  for(const [n, v] of cambios) n.nodeValue = v;

  const elems = raiz.querySelectorAll ? raiz.querySelectorAll('[placeholder],[aria-label],[title]') : [];
  for(const el of elems){
    for(const a of ATRIBUTOS){
      if(!el.hasAttribute(a)) continue;
      const nuevo = cambiar(el.getAttribute(a), mapa, patrones);
      if(nuevo != null) el.setAttribute(a, nuevo);
    }
  }
}

/* Traducir DISPARA mutaciones, así que el observador se apaga mientras se
   escribe y se vuelve a prender después. Sin esto se llama a sí mismo para
   siempre — y es de los bucles que no se ven en el código, sólo en el
   ventilador de la computadora. */
function traducirPantalla(mapa, patrones, raiz){
  if(observador) observador.disconnect();
  try{ recorrer(raiz || document.body, mapa, patrones); }
  finally{ if(observador && IDIOMA === 'en') observador.observe(document.body, { childList:true, subtree:true, characterData:true }); }
}

function aplicarIdioma(){
  const b = $('bIdioma');
  if(b){
    /* El botón dice A DÓNDE te lleva. En español ofrece «EN»; en inglés
       ofrece «ES». Poner el idioma actual confunde a la mitad de la gente. */
    b.textContent = IDIOMA === 'en' ? 'ES' : 'EN';
    b.setAttribute('aria-label', IDIOMA === 'en' ? 'Leer en español' : 'Read in English');
    b.setAttribute('aria-pressed', IDIOMA === 'en' ? 'true' : 'false');
  }
  document.documentElement.lang = IDIOMA;
  if(IDIOMA === 'en'){
    if(!observador) observador = new MutationObserver(() => {
      if(pendiente) return;
      pendiente = requestAnimationFrame(() => { pendiente = 0; traducirPantalla(EN, PAT_EN); });
    });
    traducirPantalla(EN, PAT_EN);
  } else {
    if(observador){ observador.disconnect(); }
    traducirPantalla(ES, PAT_ES);
  }
}
let pendiente = 0;

document.addEventListener('click', (e) => {
  if(!e.target.closest('#bIdioma')) return;
  IDIOMA = IDIOMA === 'en' ? 'es' : 'en';
  try{ localStorage.setItem('salaIdioma', IDIOMA); }catch(err){}
  /* Lo ya traducido quedó en el idioma anterior. Si no se tira, cambias a
     inglés y sigues leyendo la explicación en español debajo del mensaje —
     que es exactamente lo que uno acaba de pedir que no pase. */
  for(const k of Object.keys(simples)) delete simples[k];
  aplicarIdioma();
  if(typeof pintarHilo === 'function') pintarHilo();
});

aplicarIdioma();
