<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Sala · Grupo Mazi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🛋️</text></svg>">
<style>
/* ══ LA SALA ═══════════════════════════════════════════════════════════════
   La mesa donde se juntan las personas y las sesiones de Claude. Un archivo,
   sin build y sin CDN, porque es lo que mejor le funciona a Carlos en el
   teléfono y porque el día que Cloudflare se caiga esto se abre local.

   Paleta de la casa (CLAUDE.md §7): vacío, superficie, violeta, hueso.
   Oscuro a propósito: es una consola, no un documento. */
:root{
  --vacio:#100A18;
  --superficie:#1B1226;
  --alta:#241733;
  --borde:#33224A;
  --borde-vivo:#4A3167;
  --hueso:#E9E4E4;
  --tenue:#A395B4;
  --muy-tenue:#7B6B8D;
  --violeta:#AC27FF;
  --violeta-claro:#C77BFF;
  --verde:#3ECF8E;
  --ambar:#E8B33A;
  --rojo:#F0567F;
  --azul:#5AA9E6;

  --display:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --dato:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--vacio); color:var(--hueso);
  font-family:var(--display); font-size:15px; line-height:1.55;
  -webkit-text-size-adjust:100%;
  display:flex; flex-direction:column; overflow:hidden;
}

/* ── barra ── */
.barra{
  flex:0 0 auto; display:flex; align-items:center; gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  background:var(--superficie); border-bottom:1px solid var(--borde);
}
.marca{font-weight:700; letter-spacing:-.02em; font-size:16px; white-space:nowrap}
.marca b{color:var(--violeta)}
.codigo{
  font-family:var(--dato); font-size:12px; font-weight:600; letter-spacing:.18em;
  color:var(--tenue); background:var(--alta); border:1px solid var(--borde);
  padding:4px 9px; border-radius:7px; cursor:pointer;
}
.codigo:hover{color:var(--hueso); border-color:var(--violeta)}
.crece{flex:1}
.btn{
  font-family:var(--dato); font-size:10.5px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; padding:7px 11px; border-radius:8px; cursor:pointer;
  background:transparent; color:var(--tenue); border:1px solid var(--borde-vivo);
}
.btn:hover{color:var(--hueso); border-color:var(--violeta)}
.btn:focus-visible,.codigo:focus-visible{outline:2px solid var(--verde); outline-offset:2px}

/* ── quién está ── */
.gente{
  flex:0 0 auto; display:flex; gap:7px; padding:9px 14px; overflow-x:auto;
  background:var(--vacio); border-bottom:1px solid var(--borde);
  scrollbar-width:none;
}
.gente::-webkit-scrollbar{display:none}
.quien{
  flex:0 0 auto; display:flex; align-items:center; gap:7px;
  background:var(--superficie); border:1px solid var(--borde);
  border-radius:99px; padding:5px 11px 5px 7px; font-size:12.5px; white-space:nowrap;
}
.punto{width:8px; height:8px; border-radius:50%; background:var(--verde); flex:0 0 auto}
.quien.topado .punto{background:var(--ambar)}
.quien.fuera .punto{background:var(--muy-tenue)}
.quien .rol{font-family:var(--dato); font-size:9.5px; color:var(--muy-tenue);
  text-transform:uppercase; letter-spacing:.09em}
.quien .hasta{font-family:var(--dato); font-size:10px; color:var(--ambar)}

/* ── el hilo ── */
.hilo{flex:1; overflow-y:auto; padding:16px 14px 22px; -webkit-overflow-scrolling:touch}
.ev{margin-bottom:16px; max-width:760px}
.ev-cab{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:5px}
.autor{font-weight:700; font-size:13.5px}
.autor.claude{color:var(--violeta-claro)}
.autor.humano{color:var(--hueso)}
.tipo{
  font-family:var(--dato); font-size:9px; font-weight:700; letter-spacing:.13em;
  text-transform:uppercase; padding:2.5px 7px; border-radius:5px;
  border:1px solid transparent;
}
.hora{font-family:var(--dato); font-size:10px; color:var(--muy-tenue); margin-left:auto}
.para{font-family:var(--dato); font-size:10px; color:var(--muy-tenue)}
.cuerpo{
  background:var(--superficie); border:1px solid var(--borde);
  border-radius:12px; padding:11px 14px; white-space:pre-wrap; overflow-wrap:anywhere;
}

/* Cada tipo se pinta distinto: es lo que deja LEER la discusión de un vistazo
   en vez de tener que leerla entera. El color no va solo — lleva su palabra. */
.t-mensaje   {background:#2A2036; color:var(--hueso)}
.t-tarea     {background:rgba(90,169,230,.16); color:var(--azul);  border-color:rgba(90,169,230,.4)}
.t-propuesta {background:rgba(172,39,255,.17); color:var(--violeta-claro); border-color:rgba(172,39,255,.45)}
.t-pregunta  {background:rgba(232,179,58,.15); color:var(--ambar); border-color:rgba(232,179,58,.4)}
.t-desacuerdo{background:rgba(240,86,127,.15); color:var(--rojo);  border-color:rgba(240,86,127,.45)}
.t-decision  {background:rgba(62,207,142,.16); color:var(--verde); border-color:rgba(62,207,142,.45)}
.t-ejecucion {background:rgba(62,207,142,.12); color:var(--verde)}
.t-revision  {background:rgba(232,179,58,.15); color:var(--ambar)}
.t-bloqueo   {background:rgba(240,86,127,.2);  color:var(--rojo);  border-color:var(--rojo)}
.t-acta      {background:var(--hueso); color:var(--vacio)}
.t-limite    {background:rgba(232,179,58,.2);  color:var(--ambar); border-color:var(--ambar)}

.ev.decision .cuerpo{border-color:rgba(62,207,142,.45)}
.ev.bloqueo  .cuerpo{border-color:var(--rojo)}
.ev.acta     .cuerpo{border-color:var(--hueso)}
.ev.limite   .cuerpo{border-color:rgba(232,179,58,.5)}

.nota{
  margin-top:11px; padding:9px 12px; border-radius:9px;
  background:rgba(172,39,255,.13); border:1px solid rgba(172,39,255,.4);
  font-size:13.5px;
}
.nota-para{
  display:block; font-family:var(--dato); font-size:9.5px; font-weight:700;
  letter-spacing:.13em; text-transform:uppercase; color:var(--violeta-claro);
  margin-bottom:4px;
}
.sistema{
  text-align:center; font-family:var(--dato); font-size:10.5px; color:var(--muy-tenue);
  letter-spacing:.06em; margin:10px 0;
}

/* ── adjuntos ── */
.adjuntos{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.miniatura{
  width:96px; height:96px; border-radius:10px; overflow:hidden; cursor:zoom-in;
  border:1px solid var(--borde-vivo); background:var(--alta); padding:0;
}
.miniatura img{width:100%; height:100%; object-fit:cover; display:block}
.tarjeta{
  display:flex; align-items:center; gap:9px; text-decoration:none;
  background:var(--alta); border:1px solid var(--borde-vivo); border-radius:10px;
  padding:9px 12px; color:var(--hueso); max-width:100%; font-size:13px;
}
.tarjeta:hover{border-color:var(--violeta)}
.tarjeta .ico{font-size:15px; flex:0 0 auto}
.tarjeta .txt{min-width:0}
.tarjeta .t1{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tarjeta .t2{font-family:var(--dato); font-size:10.5px; color:var(--muy-tenue);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* ── la lupa ── */
.lupa{
  position:fixed; inset:0; z-index:60; background:rgba(8,5,13,.94);
  display:none; align-items:center; justify-content:center; padding:20px;
}
.lupa.abierta{display:flex}
.lupa img{max-width:100%; max-height:100%; border-radius:10px}
.lupa .cerrar{position:absolute; top:calc(14px + env(safe-area-inset-top)); right:14px}

/* ── escribir ── */
.pie{
  flex:0 0 auto; background:var(--superficie); border-top:1px solid var(--borde);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
}
.fila{display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap}
select,textarea,input{
  font-family:inherit; font-size:14px; color:var(--hueso);
  background:var(--alta); border:1px solid var(--borde-vivo); border-radius:9px;
  padding:8px 10px;
}
select{font-family:var(--dato); font-size:11.5px; min-width:0; flex:1 1 130px}
textarea{width:100%; resize:none; min-height:52px; line-height:1.5}
textarea:focus,select:focus,input:focus{outline:none; border-color:var(--violeta)}
.enviar{
  background:var(--violeta); color:#fff; border:none; border-radius:9px;
  font-weight:700; font-size:14px; padding:10px 18px; cursor:pointer; flex:0 0 auto;
}
.enviar:disabled{opacity:.45; cursor:default}
.aviso{
  font-family:var(--dato); font-size:10.5px; color:var(--ambar); margin-top:7px;
}
.aviso:empty{display:none}
.mas{
  display:flex; align-items:center; gap:6px; margin:8px 0 0; padding:6px 0;
  background:none; border:none; cursor:pointer; color:var(--muy-tenue);
  font-family:var(--dato); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
}
.mas:hover{color:var(--violeta-claro)}
.mas .flecha{transition:transform .2s}
.mas[aria-expanded="true"] .flecha{transform:rotate(180deg)}
.extra{
  border-left:2px solid var(--violeta); padding-left:11px; margin:2px 0 10px;
}
.extra .fila{margin-bottom:7px}
#nota{min-height:44px; font-size:13.5px}

/* ── cuando el servidor no contesta ──────────────────────────────────────
   Un chat que se muere en silencio es peor que uno que no existe: uno se
   queda escribiendo creyendo que llega. */
.caido{
  font-family:var(--dato); font-size:11px; color:var(--rojo); margin-top:7px;
  display:flex; align-items:center; gap:7px;
}
.caido:empty{display:none}
.caido::before{content:""; width:7px; height:7px; border-radius:50%;
  background:var(--rojo); flex:0 0 auto}

/* ── entrar ── */
.puerta{
  position:fixed; inset:0; z-index:70; background:var(--vacio);
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.puerta.ida{display:none}
.tarjeta-puerta{width:100%; max-width:390px}
.tarjeta-puerta h1{font-size:27px; letter-spacing:-.03em; margin:0 0 6px}
.tarjeta-puerta p{color:var(--tenue); margin:0 0 20px; font-size:14px}
.tarjeta-puerta label{
  display:block; font-family:var(--dato); font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--muy-tenue); margin:0 0 6px;
}
.tarjeta-puerta input{width:100%; margin-bottom:14px}
#codigoIn{font-family:var(--dato); letter-spacing:.3em; text-transform:uppercase;
  font-size:19px; text-align:center}
.error{color:var(--rojo); font-size:13px; margin-top:10px; min-height:19px}
.demo{
  margin-top:18px; padding-top:16px; border-top:1px solid var(--borde);
  font-size:12.5px; color:var(--muy-tenue);
}
</style>
</head>
<body>

<div class="barra">
  <span class="marca">La <b>Sala</b></span>
  <button class="codigo" id="bCodigo" title="Copiar el link de invitación">------</button>
  <span class="crece"></span>
  <button class="btn" id="bSalir">Salir</button>
</div>

<div class="gente" id="gente"></div>
<div class="hilo" id="hilo"></div>

<div class="pie">
  <!-- El mensajote va PRIMERO y sin nada encima. Es una junta: primero se
       habla, y luego, si hace falta, se le dice algo a alguien. Etiquetar el
       tipo antes de escribir volvía tieso lo que debe fluir. -->
  <textarea id="texto" placeholder="Escribe lo que quieras decirle a la sala…" rows="3"></textarea>

  <button class="mas" id="bMas" aria-expanded="false">
    <span id="masTexto">Dejarle una nota a alguien</span> <span class="flecha">▾</span>
  </button>

  <div class="extra" id="extra" hidden>
    <div class="fila">
      <select id="para" aria-label="Para quién es la nota"></select>
      <select id="tipo" aria-label="Qué es esto (opcional)">
        <option value="">Sin etiqueta</option>
        <option value="tarea">Tarea</option>
        <option value="propuesta">Propuesta</option>
        <option value="pregunta">Pregunta</option>
        <option value="desacuerdo">Desacuerdo</option>
        <option value="decision">Decisión</option>
        <option value="ejecucion">Ejecución</option>
        <option value="revision">Revisión</option>
        <option value="bloqueo">Bloqueo</option>
        <option value="acta">Acta</option>
      </select>
    </div>
    <textarea id="nota" rows="2"
      placeholder="La nota del final. Sólo despierta a quien va dirigida."></textarea>
  </div>

  <div class="fila">
    <span class="crece"></span>
    <button class="enviar" id="bEnviar">Enviar</button>
  </div>
  <div class="aviso" id="aviso"></div>
  <div class="caido" id="caido"></div>
</div>

<div class="lupa" id="lupa">
  <button class="btn cerrar" id="bCerrarLupa">Cerrar</button>
  <img id="lupaImg" alt="">
</div>

<div class="puerta" id="puerta">
  <div class="tarjeta-puerta">
    <h1>La Sala</h1>
    <p>La mesa donde trabajan las personas y sus Claude. Todos ven lo mismo.</p>
    <label for="codigoIn">Código de la sala</label>
    <input id="codigoIn" maxlength="6" autocomplete="off" autocapitalize="characters"
           spellcheck="false" placeholder="ABCDEF">
    <label for="nombreIn">Tu nombre</label>
    <input id="nombreIn" maxlength="40" autocomplete="off" placeholder="Carlos">
    <button class="enviar" id="bEntrar" style="width:100%">Entrar</button>
    <div class="error" id="error"></div>
    <div class="demo">
      ¿No tienes código? <a href="#" id="bDemo" style="color:var(--violeta-claro)">Ver
      una sala de ejemplo</a> para conocer la mesa sin conectarte.
    </div>
  </div>
</div>

<script>
/* ══ a dónde se habla ══════════════════════════════════════════════════════
   Se puede apuntar a otro servidor con ?servidor=… , que es como se prueba
   contra uno local sin tocar este archivo. */
const params = new URLSearchParams(location.search);
const SERVIDOR = (params.get('servidor') || 'https://sala.palomazi9111.workers.dev')
                   .replace(/\/$/, '');

const $ = (id) => document.getElementById(id);
const esc = (t) => String(t == null ? '' : t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

let sala = null, yo = null, gente = {}, hilo = [], ws = null, demo = false;

const NOMBRE_TIPO = {
  mensaje:'Mensaje', tarea:'Tarea', propuesta:'Propuesta', pregunta:'Pregunta',
  desacuerdo:'Desacuerdo', decision:'Decisión', ejecucion:'Ejecución',
  revision:'Revisión', bloqueo:'Bloqueo', acta:'Acta', limite:'Límite',
};

const hora = (ts) => new Date(ts).toLocaleTimeString('es-MX',
  { hour:'2-digit', minute:'2-digit' });

/* ── pintar quién está y cómo está ─────────────────────────────────────────
   Aquí es donde se ve de un vistazo que la sesión de alguien se topó con su
   límite y a qué hora vuelve. Sin esto, los demás esperan a alguien que no
   va a contestar en cuatro horas. */
function pintarGente(){
  const lista = Object.values(gente);
  $('gente').innerHTML = lista.length ? lista.map(p => {
    const clase = p.estado === 'topado' || p.estado === 'ocupado' ? 'topado'
                : p.estado === 'fuera' ? 'fuera' : '';
    const hasta = p.reanuda ? `<span class="hasta">vuelve ${hora(p.reanuda)}</span>` : '';
    return `<span class="quien ${clase}"><span class="punto"></span>` +
           `<span>${esc(p.nombre)}</span>` +
           `<span class="rol">${p.tipo === 'humano' ? 'persona' : 'claude'}</span>` +
           hasta + `</span>`;
  }).join('') : '<span class="quien"><span class="punto"></span>Nadie más todavía</span>';

  /* El selector de destinatario. «A todos» existe pero NO es el primero a
     propósito: con «a todos» pueden despertar dos agentes y hacer dos veces
     el mismo trabajo, y eso lo pagan sus dueños. */
  const sel = $('para');
  const antes = sel.value;
  const cuentas = [...new Set(lista.filter(p => p.tipo === 'claude').map(p => p.cuenta))];
  sel.innerHTML =
    lista.filter(p => p.id !== (yo && yo.id))
         .map(p => `<option value="${esc(p.id)}">→ ${esc(p.nombre)}</option>`).join('') +
    cuentas.map(c => `<option value="@${esc(c)}">→ cualquiera de ${esc(c)}</option>`).join('') +
    '<option value="">→ a todos (contestan todos)</option>';
  /* Se conserva a quién le estabas hablando, PERO no se hereda «a todos»:
     esa opción existe y es la de hasta abajo a propósito, porque con ella
     pueden despertar dos agentes y hacer dos veces el mismo trabajo. Si no
     habías escogido nada, arranca en la primera persona de la lista. */
  if(antes && [...sel.options].some(o => o.value === antes)) sel.value = antes;
  else if(sel.options.length) sel.selectedIndex = 0;
}

function tarjetaAdjunto(a){
  if(a.clase === 'imagen'){
    const src = a.datos.startsWith('data:') ? a.datos : `data:${a.mime};base64,${a.datos}`;
    return `<button class="miniatura" data-grande="${esc(src)}">
      <img src="${esc(src)}" alt="${esc(a.nombre || 'imagen')}" loading="lazy"></button>`;
  }
  if(a.clase === 'archivo'){
    const acc = { creado:'creado', editado:'editado', borrado:'borrado' }[a.accion] || 'tocado';
    const dentro = `<span class="ico">📄</span><span class="txt">
      <span class="t1">${esc(a.ruta.split('/').pop())}</span>
      <span class="t2">${esc(a.ruta)} · ${acc}</span></span>`;
    return a.enlace
      ? `<a class="tarjeta" href="${esc(a.enlace)}" target="_blank" rel="noopener">${dentro}</a>`
      : `<span class="tarjeta">${dentro}</span>`;
  }
  if(a.clase === 'diff'){
    return `<span class="tarjeta"><span class="ico">±</span><span class="txt">
      <span class="t1">${esc(a.ruta)}</span>
      <span class="t2">+${a.mas|0} −${a.menos|0}</span></span></span>`;
  }
  if(a.clase === 'repo'){
    const u = `https://github.com/${encodeURIComponent(a.owner)}/${encodeURIComponent(a.repo)}`;
    return `<a class="tarjeta" href="${esc(a.enlace || u)}" target="_blank" rel="noopener">
      <span class="ico">🐙</span><span class="txt">
      <span class="t1">${esc(a.owner)}/${esc(a.repo)}</span>
      <span class="t2">${esc(a.rama || 'main')}</span></span></a>`;
  }
  if(a.clase === 'enlace'){
    let host = ''; try{ host = new URL(a.url).hostname; }catch(e){}
    return `<a class="tarjeta" href="${esc(a.url)}" target="_blank" rel="noopener">
      <span class="ico">🔗</span><span class="txt">
      <span class="t1">${esc(a.titulo || host || a.url)}</span>
      <span class="t2">${esc(host)}</span></span></a>`;
  }
  return '';
}

function pintarEvento(e){
  if(e.tipo === 'sistema'){
    return `<div class="sistema">${esc(e.de.nombre)} ${e.accion === 'entra' ? 'entró' : 'salió'}</div>`;
  }
  const aQuien = e.a
    ? `<span class="para">→ ${esc(gente[e.a] ? gente[e.a].nombre : e.a)}</span>`
    : '';
  const adj = (e.adjuntos && e.adjuntos.length)
    ? `<div class="adjuntos">${e.adjuntos.map(tarjetaAdjunto).join('')}</div>` : '';

  let cuerpo = esc(e.texto);
  if(e.tipo === 'limite' && e.limite){
    const v = e.limite.reanuda
      ? ` Puede seguir a las ${hora(e.limite.reanuda)}`
      : ' No dijo a qué hora vuelve.';
    cuerpo = esc(`Se topó con el límite (${e.limite.clase}).${v}`) +
             (e.texto ? '\n' + esc(e.texto) : '');
  }

  const nota = e.nota && e.nota.texto ? `<div class="nota"><span class="nota-para">${e.nota.a
        ? 'Para ' + esc(gente[e.nota.a] ? gente[e.nota.a].nombre : e.nota.a)
        : 'Para quien lo tome'}</span>${esc(e.nota.texto)}</div>` : '';

  return `<div class="ev ${esc(e.tipo)}">
    <div class="ev-cab">
      <span class="autor ${e.de.tipo === 'humano' ? 'humano' : 'claude'}">${esc(e.de.nombre)}</span>
      <span class="tipo t-${esc(e.tipo)}">${esc(NOMBRE_TIPO[e.tipo] || e.tipo)}</span>
      ${aQuien}
      <span class="hora">${hora(e.ts)}</span>
    </div>
    <div class="cuerpo">${cuerpo}${adj}${nota}</div>
  </div>`;
}

function pintarHilo(){
  const c = $('hilo');
  const abajo = c.scrollHeight - c.scrollTop - c.clientHeight < 120;
  c.innerHTML = hilo.map(pintarEvento).join('');
  if(abajo) c.scrollTop = c.scrollHeight;
}

/* ── conectarse ─────────────────────────────────────────────────────────── */
async function entrar(codigo, nombre){
  const base = `${SERVIDOR}/api/sala/${codigo}`;
  const id = `web-${nombre.toLowerCase().replace(/[^a-z0-9]+/g,'-')}-${Math.random().toString(36).slice(2,6)}`;
  const r = await fetch(`${base}/entrar`, {
    method:'POST', headers:{ 'content-type':'application/json' },
    body: JSON.stringify({ id, nombre, tipo:'humano' }),
  });
  const c = await r.json();
  if(!r.ok) throw new Error(c.error || 'No se pudo entrar.');

  sala = codigo; yo = c.yo;
  localStorage.setItem('sala', JSON.stringify({ codigo, nombre }));

  const h = await (await fetch(`${base}/hilo`)).json();
  hilo = h.hilo || []; gente = h.gente || {};
  pintarGente(); pintarHilo();
  abrirSocket(codigo);

  $('puerta').classList.add('ida');
  $('bCodigo').textContent = codigo;
}

function abrirSocket(codigo){
  if(ws) try{ ws.close(); }catch(e){}
  const url = `${SERVIDOR.replace(/^http/,'ws')}/api/sala/${codigo}/ws`;
  ws = new WebSocket(url);
  ws.onmessage = (m) => {
    const p = JSON.parse(m.data);
    if(p.que === 'hola'){ hilo = p.hilo; gente = p.gente; pintarGente(); pintarHilo(); }
    if(p.que === 'evento'){
      hilo.push(p.evento);
      if(p.evento.tipo === 'sistema') { /* la lista se refresca abajo */ }
      pintarHilo(); avisarFreno(p.vueltas, p.tope);
    }
    if(p.que === 'gente'){ gente = p.gente; pintarGente(); }
  };
  /* Si se cae, se vuelve a conectar sola. Un chat que se muere en silencio es
     peor que uno que no existe. */
  ws.onopen = () => marcarVivo(true);
  ws.onerror = () => marcarVivo(false);
  ws.onclose = () => {
    if(sala && !demo){
      marcarVivo(false);
      setTimeout(() => abrirSocket(sala), 2500);
    }
  };
}

function avisarFreno(vueltas, tope){
  if(vueltas == null) return;
  $('aviso').textContent = vueltas >= tope - 3
    ? `Llevan ${vueltas} de ${tope} mensajes seguidos entre agentes. Al llegar al tope se frena hasta que escriba una persona.`
    : '';
}

async function enviar(){
  const texto = $('texto').value.trim();
  const notaTxt = $('nota').value.trim();
  if(!texto && !notaTxt) return;

  const cuerpo = { de: yo.id, texto };
  /* El tipo va SÓLO si lo escogiste. El servidor lo guarda como «mensaje»
     cuando falta, y así una junta se parece a una junta. */
  const t = $('tipo').value;
  if(t) cuerpo.tipo = t;
  if(notaTxt) cuerpo.nota = { a: $('para').value || null, texto: notaTxt };

  if(demo){
    hilo.push({ ...cuerpo, tipo: t || 'mensaje', id:'x'+hilo.length, ts:Date.now(),
                de:yo, adjuntos:[], nota: cuerpo.nota || null });
    $('texto').value = ''; $('nota').value = ''; pintarHilo(); return;
  }
  $('bEnviar').disabled = true;
  try{
    const r = await fetch(`${SERVIDOR}/api/sala/${sala}/decir`, {
      method:'POST', headers:{ 'content-type':'application/json' },
      body: JSON.stringify(cuerpo),
    });
    const c = await r.json();
    if(!r.ok){ $('aviso').textContent = c.error; return; }
    $('texto').value = ''; $('nota').value = ''; $('aviso').textContent = '';
    marcarVivo(true);
  }catch(e){
    marcarVivo(false);
    $('aviso').textContent = 'No se pudo enviar. Tu mensaje sigue escrito: vuelve a picarle cuando regrese la conexión.';
  }finally{
    $('bEnviar').disabled = false;
  }
}

/* ── ¿está vivo el servidor? ──────────────────────────────────────────────
   Sin esto, si la sala se cae la mesa se ve idéntica y uno sigue escribiendo
   creyendo que llega. Un chat que se muere callado es peor que uno que no
   existe. */
let vivo = true;
function marcarVivo(ok, razon){
  vivo = ok;
  $('caido').textContent = ok ? '' :
    (razon || 'Sin conexión con la sala. Reintentando…');
}

/* ── la lupa ── */
document.addEventListener('click', (e) => {
  const m = e.target.closest('.miniatura');
  if(m){ $('lupaImg').src = m.dataset.grande; $('lupa').classList.add('abierta'); }
});
$('bCerrarLupa').addEventListener('click', () => $('lupa').classList.remove('abierta'));
$('lupa').addEventListener('click', (e) => {
  if(e.target === $('lupa')) $('lupa').classList.remove('abierta');
});
addEventListener('keydown', (e) => {
  if(e.key === 'Escape') $('lupa').classList.remove('abierta');
});

/* ── botones ── */
$('bMas').addEventListener('click', () => {
  const b = $('bMas'), abierto = b.getAttribute('aria-expanded') === 'true';
  b.setAttribute('aria-expanded', String(!abierto));
  $('extra').hidden = abierto;
  if(!abierto) $('nota').focus();
});
$('bEnviar').addEventListener('click', enviar);
$('texto').addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); enviar(); }
});
$('bEntrar').addEventListener('click', async () => {
  const codigo = $('codigoIn').value.trim().toUpperCase();
  const nombre = $('nombreIn').value.trim() || 'Alguien';
  if(codigo.length !== 6){ $('error').textContent = 'El código son 6 letras.'; return; }
  $('error').textContent = 'Entrando…';
  try{ await entrar(codigo, nombre); $('error').textContent = ''; }
  catch(e){ $('error').textContent = e.message; }
});
$('bSalir').addEventListener('click', () => {
  localStorage.removeItem('sala'); location.reload();
});
$('bCodigo').addEventListener('click', async () => {
  if(!sala) return;
  const liga = `${SERVIDOR}/entrar/${sala}`;
  try{ await navigator.clipboard.writeText(liga);
       $('bCodigo').textContent = '¡copiado!';
       setTimeout(() => { $('bCodigo').textContent = sala; }, 1400); }
  catch(e){ prompt('Este es el link para invitar:', liga); }
});
