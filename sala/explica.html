<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100A18">
<title>Explica · La Sala</title>
<!-- EXPLICA (Carlos, 12 nov): «que la IA me explique lo que le pida mientras me lo va mostrando, con voz, líneas de
     tiempo, un lápiz que se mueve en tiempo real, referencias y listados», al estilo de Knowunity. Paulina (Gemini) o
     Negro (Groq) arman la clase por pasos; esta página la DIBUJA en el pizarrón al ritmo de la voz. Lógica en explica.js. -->
<style>
  @font-face{ font-family:Mano; src:url(letra/caveat-700.woff2) format("woff2"); font-weight:700; font-display:swap }
  @font-face{ font-family:Texto; src:url(letra/nunito-600.woff2) format("woff2"); font-weight:600; font-display:swap }
  @font-face{ font-family:Texto; src:url(letra/nunito-700.woff2) format("woff2"); font-weight:700; font-display:swap }
  :root{ --vacio:#100A18; --sup:#1E1428; --hueso:#E9E4E4; --violeta:#AC27FF; --violeta2:#C77DFF; --suave:#A99BB8;
    --papel:#FBFAF6; --linea:#E7E3DA; --tinta:#1D1B26; --azul:#2156D9; --rojo:#D9433A; --verde:#178A5C; --naranja:#D97706; --morado:#7C3AED; --marca:#FFE45C }
  *{ box-sizing:border-box; margin:0 }
  html{ -webkit-text-size-adjust:100%; overflow-x:clip }
  body{ overflow-x:clip; background:var(--vacio); color:var(--hueso); font:600 16px/1.5 Texto, -apple-system, system-ui, sans-serif; min-height:100dvh }
  button, input, textarea, select{ font-family:inherit; font-size:16px; color:inherit }
  .i{ width:1.15em; height:1.15em; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none }
  [hidden]{ display:none!important }

  /* barra de arriba */
  .barra{ position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px; padding:calc(10px + env(safe-area-inset-top)) 16px 10px; background:#100A18ee; backdrop-filter:blur(10px); border-bottom:1px solid #ffffff10 }
  .barra h1{ font:700 20px/1 Texto; letter-spacing:-.01em; flex:1 } .barra h1 b{ color:var(--violeta2) }
  .bt{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 14px; border-radius:12px; border:0; background:var(--sup); color:var(--hueso); cursor:pointer }
  .bt:active{ transform:scale(.97) } .bt:focus-visible{ outline:2px solid var(--violeta2); outline-offset:2px }
  .bt.redondo{ width:44px; padding:0 }
  .bt.fuerte{ background:var(--violeta); color:#fff; font-weight:700 }

  /* inicio */
  .inicio{ max-width:720px; margin:0 auto; padding:24px 16px 120px }
  .inicio h2{ font:700 44px/1 Mano; color:#fff; margin:8px 0 6px }
  .inicio p.sub{ color:var(--suave); margin-bottom:18px }
  .caja{ background:var(--sup); border-radius:20px; padding:14px; border:1px solid #ffffff12 }
  .caja textarea{ width:100%; min-height:110px; resize:vertical; background:transparent; border:0; outline:0; color:#fff; line-height:1.45 }
  .caja textarea::placeholder{ color:#8A7C9A }
  .caja .extra{ width:100%; margin:4px 0 10px; padding:12px 14px; border-radius:14px; border:1.5px dashed #AC27FF88; background:#AC27FF14; color:#fff; outline:0 }
  .caja .extra::placeholder{ color:#C9B8DA } .caja .extra:focus{ border-style:solid; border-color:#C77DFF }
  .fila{ display:flex; gap:8px; flex-wrap:wrap; align-items:center }
  .opciones{ display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px; margin-top:12px }
  .opciones label{ display:block; font-size:12px; color:var(--suave); margin-bottom:4px }
  .opciones select{ width:100%; min-height:44px; border-radius:12px; border:1px solid #ffffff18; background:#150E1E; padding:0 10px }
  .fotos{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px } .fotos img{ width:64px; height:64px; object-fit:cover; border-radius:10px }
  .acciones{ display:flex; gap:10px; margin-top:12px } .acciones .fuerte{ flex:1 }
  .ideas{ display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 26px }
  .ideas button{ border:1px solid #ffffff1c; background:transparent; border-radius:999px; padding:10px 14px; min-height:44px; color:var(--hueso); cursor:pointer; font-size:14px }
  .hist h3{ font:700 13px/1 Texto; letter-spacing:.12em; text-transform:uppercase; color:var(--suave); margin:8px 0 10px }
  .hist ul{ list-style:none; padding:0; display:grid; gap:8px }
  .hist li{ display:flex; gap:8px }
  .hist .abrir{ flex:1; text-align:left; justify-content:flex-start; min-width:0 } .hist .abrir span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .hist small{ color:var(--suave); font-size:12px; margin-left:auto; flex:none }
  .aviso{ margin-top:12px; padding:12px 14px; border-radius:12px; background:#3A1420; color:#FFD3DA; font-size:14px }
  .llave{ margin-top:12px } .llave input{ width:100%; min-height:44px; border-radius:12px; border:1px solid #ffffff22; background:#150E1E; padding:0 12px }

  /* preparando */
  .preparando{ max-width:720px; margin:0 auto; padding:80px 16px; text-align:center }
  .preparando .lapiz{ font-size:56px; color:var(--violeta2); animation:garabato 1.1s ease-in-out infinite }
  .preparando .lapiz .i{ fill:var(--violeta); stroke:#fff; stroke-width:1.4 }
  @keyframes garabato{ 0%,100%{ transform:translate(-14px, 4px) rotate(-8deg) } 50%{ transform:translate(14px, -4px) rotate(6deg) } }
  .preparando p{ margin-top:18px; color:var(--suave) } .preparando b{ color:#fff; font:700 30px/1.1 Mano; display:block; margin-top:6px }

  /* ══ EL PIZARRÓN INFINITO (lienzo.js) ══ */
  .clase{ position:fixed; left:0; right:0; bottom:0; top:var(--barra-alto, 64px); z-index:5 }
  .lienzo{ position:absolute; inset:0; overflow:hidden; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none;
    background-color:var(--papel); background-image:radial-gradient(#1D1B2622 1.1px, transparent 1.4px); background-size:24px 24px }
  .lienzo:active{ cursor:grabbing }
  .mundo{ position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform }
  .conectores{ position:absolute; left:0; top:0; overflow:visible; pointer-events:none }
  .cursores{ position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:3 }
  .cur{ position:absolute; left:0; top:0; will-change:transform }
  .cur svg{ position:absolute; left:-4px; top:-4.7px; width:24px; height:24px; overflow:visible; filter:drop-shadow(0 2px 2px #0005) }
  .cur .etq{ position:absolute; left:15px; top:17px; padding:3px 8px 3px 7px; border-radius:3px 10px 10px 10px; color:#fff; font:700 11px/1.2 Texto; white-space:nowrap; box-shadow:0 2px 6px #0003 }
  /* el halo que señala lo que se está explicando (recorrer en lienzo.js) */
  .halo{ position:absolute; left:0; top:0; width:64px; height:64px; margin:-32px 0 0 -32px; border-radius:50%; pointer-events:none; opacity:0;
    background:radial-gradient(#AC27FF2e, #AC27FF10 55%, transparent 72%); border:2px solid #AC27FF55; transition:opacity .35s }
  .halo.v{ opacity:1; animation:late 1.1s cubic-bezier(.3,1.4,.4,1) both }
  @keyframes late{ 0%{ scale:.3 } 55%{ scale:1.12 } 100%{ scale:1 } }
  .clic{ position:absolute; left:0; top:0; width:0; height:0; border-color:var(--violeta) }
  .clic::after{ content:""; position:absolute; left:-10px; top:-10px; width:20px; height:20px; border-radius:50%; border:1.5px solid; border-color:inherit; opacity:.75; animation:clic .32s ease-out forwards }
  @keyframes clic{ from{ transform:scale(.25); opacity:1 } to{ transform:scale(1.35); opacity:0 } }
  .flotan{ position:absolute; right:10px; top:10px; z-index:4; display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end }
  .flotan .bt{ min-height:40px; padding:0 12px; background:#1E1428e6; backdrop-filter:blur(8px); font-size:14px; box-shadow:0 6px 18px #0003 }

  /* los elementos del pizarrón: papel, tinta y letra a mano */
  .el{ position:absolute; color:var(--tinta) }
  .el.fijo{ position:relative }
  .el .trz{ position:absolute; left:0; top:0; width:100%; height:100%; overflow:visible; pointer-events:none }
  .el .cont{ position:relative }
  .el svg.dib{ display:block; overflow:visible }
  .el .guiones{ stroke-dasharray:7 6 }
  .c{ opacity:0; transition:opacity .11s linear }
  .c.v{ opacity:1 }
  .el .t{ font:700 30px/1.08 Mano; margin:0 0 10px }
  .el h2.gran{ font:700 50px/1 Mano; letter-spacing:-.01em; padding:0 0 12px; margin:0 }
  .el .subt{ font:600 17px/1.4 Texto; color:#5E5869; margin-top:4px }
  .el .ico-hueco{ display:block; width:46px; height:46px; margin-bottom:6px }
  .el .con-ico{ display:grid; grid-template-columns:44px minmax(0, 1fr); gap:12px; align-items:start }
  .el .con-ico .ico-hueco{ width:42px; height:42px; margin:2px 0 0 }
  .el .p{ font:600 17.5px/1.55 Texto; margin:0 }
  .el .p.chico{ font-size:15.5px; line-height:1.5 }
  .el .mano{ font:700 27px/1.18 Mano; margin:0 } .el .mano.chica{ font-size:23px }
  .el .lis{ list-style:none; padding:0; margin:0; display:grid; gap:11px }
  .el .lis li{ display:grid; grid-template-columns:30px minmax(0, 1fr); gap:10px; align-items:start; font:600 16.5px/1.45 Texto }
  .el .bala{ width:28px; height:28px; display:grid; place-items:center; font:700 19px/1 Mano }
  .el .tarjeta{ position:relative; padding:18px 18px 20px; border-radius:16px }
  .el .pest{ display:inline-block; font:700 34px/1.05 Mano; margin:0 0 10px; padding:2px 2px; position:relative }
  .el .ico-esq{ position:absolute; right:14px; top:14px; width:36px; height:36px }
  .el .formula .ex{ display:inline-block; font:700 26px/1.3 ui-monospace, Menlo, monospace; margin:6px 8px 12px; overflow-wrap:anywhere }
  .el .vars{ display:grid; gap:8px; margin-top:10px }
  .el .var{ display:grid; grid-template-columns:auto 32px minmax(0, 1fr); align-items:center; gap:8px; font:600 15px/1.35 Texto }
  .el .var b{ font:700 20px/1 ui-monospace, Menlo, monospace } .el .var .fl{ display:block; height:12px }
  .el .cita{ position:relative; padding:4px 6px 6px 22px } .el .ico-cita{ display:block; width:42px; height:42px; margin-bottom:6px }
  .el .cita small{ display:block; margin-top:10px; font:600 14px/1.3 Texto; color:#5E5869 }
  .el .nota-a{ padding:26px 20px 20px }
  .el .ojo-a{ display:grid; grid-template-columns:44px minmax(0, 1fr); gap:12px; padding:16px 16px 18px } .el .ojo-a .ico-hueco{ width:40px; height:40px; margin:2px 0 0 }
  .el .dato-a{ text-align:center; padding:22px 12px 12px } .el .dato-a .num{ display:inline-block; font:700 68px/1 Mano; padding:6px 16px 10px }
  .el .paso-ej{ display:grid; grid-template-columns:32px minmax(0, 1fr); gap:10px; margin:10px 0; font:600 16px/1.45 Texto } .el .paso-ej .bala{ width:28px; height:28px; font-size:18px }
  .el .resul{ display:inline-block; font:700 25px/1.25 Mano; margin-top:12px }
  .el .ver-resp{ margin-top:14px; min-height:44px; border-radius:12px; border:2px solid var(--tinta); background:#fff; color:var(--tinta); padding:0 16px; font:700 15px Texto; cursor:pointer }
  .el .resp{ margin-top:12px }
  .el .codigo-a{ padding:16px 16px 18px } .el .codigo-a pre{ margin:0; font:600 14px/1.55 ui-monospace, Menlo, monospace; color:#F1ECF4; white-space:pre-wrap; overflow-wrap:anywhere }
  .el .codigo-a .len{ font:700 11px/1 Texto; color:#C77DFF; letter-spacing:.1em; text-transform:uppercase; margin-bottom:8px }
  .el .img-a{ margin:0 } .el .marco-img{ aspect-ratio:4 / 3; border-radius:8px; overflow:hidden; background:#ECE7DF }
  .el .marco-img img{ width:100%; height:100%; object-fit:cover; display:block }
  .el .marco-img.dibujo{ background:#F4EFE7; aspect-ratio:4 / 3; padding:0 } .el .marco-img.dibujo .dib-foto{ width:52%; height:auto; fill:none; stroke:#2A1240; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round } .el .marco-img.sin{ display:grid; place-content:center; gap:6px; color:#5E5869; font:600 14px Texto; text-align:center; padding:20px } .el .marco-img.sin a{ color:#1F5BD1; font-weight:700 }
  .el .img-a figcaption{ font:700 24px/1.15 Mano; margin-top:12px } .el .credito{ display:block; font:600 11.5px/1.3 Texto; color:#7A7387; margin-top:4px } .el .credito a{ color:inherit }
  .el .dib-a{ text-align:center } .el .hueco-dib{ margin:14px auto 10px }
  .el .dos{ display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); gap:24px }
  .el .lado{ padding:14px 12px 16px } .el .lado h4{ font:700 27px/1 Mano; margin:0 0 12px; text-align:center }
  .el .lado .lis li{ font-size:15px; grid-template-columns:20px minmax(0, 1fr); gap:6px } .el .lado .bala{ width:20px; height:20px }
  .el .pasos-a{ list-style:none; padding:0; margin:0; display:grid; gap:26px } .el .pasos-a li{ display:grid; grid-template-columns:40px minmax(0, 1fr); gap:12px; align-items:start }
  .el .pasos-a .bala{ width:36px; height:36px; font-size:23px } .el .pasos-a b{ display:block; font:700 17px/1.3 Texto; margin:6px 0 2px }
  .el .eje-a{ position:relative; display:grid; gap:22px; padding-left:46px } .el .ev{ position:relative }
  .el .ev .punto{ position:absolute; left:-46px; top:3px; width:28px; height:20px } .el .fecha{ font:700 28px/1 Mano; margin:0 0 3px }
  .el .tab-a{ width:100%; border-collapse:collapse; font:600 14.5px/1.35 Texto } .el .tab-a th, .el .tab-a td{ padding:10px 10px; text-align:left; vertical-align:top }
  .el .tab-a th{ font:700 21px/1.1 Mano }

  /* ══ LOS APUNTES ══ */
  .apuntes{ max-width:820px; margin:0 auto; padding:16px 12px 120px }
  .barra-ap{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px }
  .hoja-ap{ background:var(--papel); color:var(--tinta); border-radius:22px; overflow:hidden; box-shadow:0 30px 60px -40px #000;
    background-image:linear-gradient(90deg, transparent 0 calc(var(--margen) - 2px), #7E173540 calc(var(--margen) - 2px) var(--margen), transparent var(--margen)), repeating-linear-gradient(transparent 0 31px, #2156D914 31px 32px);
    --margen:64px; padding-bottom:30px }
  .portada-ap{ padding:28px 24px 26px calc(var(--margen) + 14px); background:linear-gradient(135deg, #170A26, #4E0E22 55%, #7E1735); color:#fff; position:relative }
  .portada-ap small{ font:700 12px/1 Texto; letter-spacing:.14em; text-transform:uppercase; color:#E8C7FF }
  .portada-ap h1{ font:700 50px/1 Mano; margin:10px 0 8px } .portada-ap p{ color:#E9DDF3; font-size:15px }
  .indice-ap{ margin:18px 18px 0 calc(var(--margen) + 14px); padding:0; list-style:none; display:flex; flex-wrap:wrap; gap:8px; counter-reset:ap }
  .indice-ap:empty{ display:none }
  .indice-ap li{ counter-increment:ap } .indice-ap a{ display:inline-flex; gap:6px; align-items:center; padding:7px 12px; border-radius:999px; background:#fff; border:1.5px solid #E2DCEA; color:#5E2387; font:700 14px Texto; text-decoration:none }
  .indice-ap a::before{ content:counter(ap); font:700 18px/1 Mano; color:#7E1735 }
  .bloque-ap{ display:grid; grid-template-columns:var(--margen) minmax(0, 1fr); gap:0 14px; padding:18px 18px 6px 0; break-inside:avoid }
  .bloque-ap .margen-ap{ grid-row:1 / span 2; padding:6px 6px 0 10px; text-align:right }
  .bloque-ap .margen-ap b{ display:inline-block; font:700 11px/1.2 Texto; letter-spacing:.06em; text-transform:uppercase; color:#7E1735; background:#F6DCE4; padding:4px 7px; border-radius:6px; overflow-wrap:anywhere }
  .bloque-ap .lugar-ap{ grid-column:2; min-width:0 }
  .bloque-ap .dijo-ap{ grid-column:2; margin:12px 0 4px; padding:10px 14px; border-left:4px solid #AC27FF55; background:#ffffffaa; border-radius:0 12px 12px 0; font:600 15px/1.55 Texto; color:#4A4656 }
  .bloque-ap.es-titulo{ grid-template-columns:var(--margen) minmax(0, 1fr); padding-top:30px }
  .bloque-ap.es-titulo .lugar-ap, .bloque-ap.es-titulo .dijo-ap{ grid-column:2 }
  .dijo-ap.intro{ border-left-color:#7E1735 }
  .fin-ap{ margin:26px 18px 0 calc(var(--margen) + 14px) }
  .fin-ap h2{ font:700 36px/1 Mano; color:#5E2387; margin-bottom:12px }
  .repaso-ap{ display:grid; gap:10px }
  .repaso-ap details{ background:#fff; border:2px solid #E2DCEA; border-radius:14px; padding:12px 14px }
  .repaso-ap summary{ display:flex; gap:10px; align-items:baseline; font:700 16px/1.4 Texto; cursor:pointer; list-style:none }
  .repaso-ap summary span{ font:700 22px/1 Mano; color:#AC27FF; flex:none } .repaso-ap details p{ margin-top:8px; font:600 15px/1.5 Texto; color:#4A4656 }
  .refs-ap{ padding-left:20px; display:grid; gap:8px; font:600 15px/1.45 Texto } .refs-ap a{ color:#1F5BD1; font-weight:700 }
  .ojo-ap{ font-size:13px; color:#6B6677; margin-top:10px }
  /* todo lo que se dijo, en lista */
  .lista-dicho{ list-style:none; margin:18px 18px 0 calc(var(--margen) + 14px); padding:0; display:grid; gap:14px }
  .lista-dicho li{ display:grid; grid-template-columns:30px minmax(0, 1fr); gap:10px; align-items:start }
  .lista-dicho .num-dicho{ width:28px; height:28px; border-radius:50%; display:grid; place-items:center; background:#F6DCE4; color:#7E1735; font:700 17px/1 Mano }
  .lista-dicho p{ font:600 15.5px/1.6 Texto; color:#2B2735 }
  .lista-dicho .sec-dicho{ display:block; font:700 26px/1.1 Mano; color:#5E2387; margin:14px 0 2px }
  .lista-dicho .preg-dicho{ display:block; margin:6px 0 2px; padding:12px 14px; border-radius:14px 14px 14px 4px; background:#1E1428; color:#fff; font:700 15px/1.45 Texto }
  .lista-dicho .preg-dicho small{ display:block; font:700 11px/1 Texto; letter-spacing:.1em; text-transform:uppercase; color:#C77DFF; margin-bottom:5px }
  @media (max-width:560px){ .hoja-ap{ --margen:12px } .lista-dicho{ margin-left:16px; margin-right:14px } .bloque-ap{ grid-template-columns:0 minmax(0, 1fr); gap:0 8px; padding-right:12px } .bloque-ap .margen-ap{ grid-column:2; grid-row:auto; text-align:left; padding:0 0 6px } .bloque-ap .lugar-ap, .bloque-ap .dijo-ap{ grid-column:2 } .portada-ap{ padding-left:22px } .indice-ap, .fin-ap{ margin-left:20px } }
  @media print{
    body{ background:#fff } .barra, .barra-ap, #vInicio, #vClase, #mando{ display:none!important } .apuntes{ padding:0; max-width:none }
    .hoja-ap{ box-shadow:none; border-radius:0 } .bloque-ap, .el, .repaso-ap details{ break-inside:avoid } .repaso-ap details{ open:true }
  }

  /* abajo: subtítulo y controles */
  .mando{ position:fixed; left:0; right:0; bottom:0; z-index:30; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:linear-gradient(transparent, #100A18 22%) }
  .mando .dentro{ max-width:760px; margin:0 auto; background:#1E1428f2; backdrop-filter:blur(12px); border:1px solid #ffffff14; border-radius:20px; padding:10px 12px }
  /* una frase a la vez (pintarSub en explica.js): nunca se corta ni se esconde la palabra de ahorita */
  .sub-voz{ font:600 15px/1.4 Texto; color:#CFC5DC; text-align:center; text-wrap:balance; margin:2px auto 8px; max-width:62ch; min-height:1.4em }
  .sub-voz.entra{ animation:subEntra .25s ease-out }
  @keyframes subEntra{ from{ opacity:.2; transform:translateY(4px) } to{ opacity:1; transform:none } }
  @media (min-width:700px){ .sub-voz{ font-size:17px } }
  .sub-voz[hidden]{ display:none }
  .sub-voz .ya{ color:#fff } .sub-voz .ahora{ color:var(--marca) }
  .barra-pasos{ height:4px; border-radius:2px; background:#ffffff18; margin-bottom:10px; overflow:hidden } .barra-pasos i{ display:block; height:100%; background:var(--violeta2); width:0; transition:width .3s }
  .botones{ display:flex; gap:8px; align-items:center } .botones .crece{ flex:1 }
  .mas{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; padding-top:10px; border-top:1px solid #ffffff12 } .mas[hidden]{ display:none }
  .mas .bt:not(.redondo){ min-height:44px; padding:0 12px; font-size:14px }
  /* los tres que importan, al centro; «más» a la orilla */
  .botones{ position:relative; justify-content:center } .botones .crece{ display:none } #bMas{ position:absolute; right:0; top:50% ; translate:0 -50% }
  #bPlay{ width:56px; height:56px }
  /* LA BARRA REDONDA (Carlos, 13 nov: «más circular y sólo tenga contorno a los botones y se expanda si es necesario»):
     una píldora; los botones son sólo su contorno; con «más» abierto crece hacia arriba y se redondea menos */
  .mando .dentro{ border-radius:999px; padding:8px 14px 10px; background:#140C1Fe6; transition:border-radius .3s cubic-bezier(.2,.8,.2,1), padding .3s }
  .mando .dentro:has(.mas:not([hidden])), .mando .dentro:has(.preg:not([hidden])){ border-radius:28px }
  .mando .barra-pasos{ margin:2px 18px 8px }
  .mando .botones .bt, .mando .mas .bt{ background:transparent; border:1.5px solid #ffffff38; color:var(--hueso) }
  .mando .botones .bt:active, .mando .mas .bt:active{ background:#ffffff12 }
  .mando #bPlay{ border:2px solid var(--violeta2, #C77DFF); color:var(--violeta2, #C77DFF); background:transparent }
  .mando #bMas.activo{ border-color:var(--violeta2, #C77DFF); color:var(--violeta2, #C77DFF); background:transparent }
  .mando .mas{ justify-content:center }
  .mando .bt.redondo{ border-radius:50% } .mando .mas .bt:not(.redondo){ border-radius:999px }
  #bMas .i{ fill:currentColor; stroke:currentColor; stroke-width:2 } #bMas.activo{ background:#AC27FF33 }
  /* dentro de un marco y con la clase corriendo: sin barra de arriba */
  .embebido.en-clase .barra{ display:none }
  .embebido #volver{ display:none }
  .con-flecha .barra{ padding-left:64px }
  .preg{ display:flex; gap:8px; margin-top:10px } .preg input{ flex:1; min-width:0; min-height:44px; border-radius:12px; border:1px solid #ffffff22; background:#150E1E; padding:0 12px }
  @media (prefers-reduced-motion:reduce){ .pal, .lista li, .linea .ev, mark{ transition:none } }
</style>
</head>
<body>
<header class="barra">
  <a class="bt redondo" id="volver" href="./" aria-label="Volver a La Sala"></a>
  <h1>Explica <b id="quien"></b></h1>
  <button class="bt redondo" id="bNueva" aria-label="Nueva explicación" hidden></button>
</header>

<main id="vInicio" class="inicio">
  <h2>¿Qué te explico?</h2>
  <p class="sub">Escribe el tema o sube una foto de tus apuntes. Te lo explico en voz alta mientras lo dibujo en el pizarrón.</p>
  <div class="caja">
    <textarea id="tema" placeholder="Ej. «Explícame la Revolución Mexicana», «cómo se saca la derivada de un producto», «qué es la NOM-251»…"></textarea>
    <input id="extra" class="extra" type="text" autocomplete="off" placeholder="Escribe aquí si quieres agregarle algo (ej. «sólo lo básico», «con ejemplos de fútbol»)…" aria-label="Algo que quieras agregar a lo que se te va a explicar">
    <div class="fotos" id="fotos"></div>
    <div class="opciones">
      <div><label for="motor">Quién explica</label><select id="motor"><option value="groq">Negro · rápido</option><option value="gemini">Paulina · lee fotos, ~2 min</option></select></div>
      <div><label for="nivel">Nivel</label><select id="nivel"><option value="kids">Kids · kínder y primaria</option><option value="secu">Secundaria</option><option value="prepa" selected>Prepa</option><option value="uni">Universidad</option><option value="facil">Muy fácil</option></select></div>
      <div><label for="profundidad">Qué tan a fondo</label><select id="profundidad"><option value="general">Lo general (para el examen)</option><option value="normal" selected>Normal</option><option value="detalle">A detalle</option></select></div>
      <div><label for="largo">Largo</label><select id="largo"><option value="corta">Corta</option><option value="normal" selected>Normal</option><option value="fondo">A fondo</option></select></div>
      <div><label for="cursores">Cursores que dibujan</label><select id="cursores"><option value="monton">Un montón</option><option value="varios">Unos cuantos</option><option value="uno">Sólo uno</option></select></div>
      <div><label for="vozSel">Voz</label><select id="vozSel"></select></div>
      <div><label for="sonidos">Efectos de sonido</label><select id="sonidos"><option value="si">Sí, suavecitos</option><option value="no">No</option></select></div>
    </div>
    <div class="acciones">
      <label class="bt" id="bFoto" aria-label="Agregar foto de tus apuntes"><input type="file" id="archivo" accept="image/*" multiple hidden></label>
      <button class="bt fuerte" id="bExplica"></button>
    </div>
  </div>
  <div class="aviso" id="aviso" hidden></div>
  <div class="llave" id="cajaLlave" hidden><label for="llaveTxt" style="font-size:14px;color:var(--suave)">Pega aquí el link de La Sala (o la llave) una vez y ya:</label><input id="llaveTxt" autocomplete="off"></div>
  <div class="ideas" id="ideas"></div>
  <section class="hist" id="hist" hidden><h3>Lo que ya te expliqué</h3><ul id="histLista"></ul></section>
</main>

<section id="vPrepara" class="preparando" hidden>
  <div class="lapiz" id="lapizEspera"></div>
  <p id="preparaTxt">Armando tu clase…</p>
</section>

<section id="vClase" class="clase" hidden>
  <div id="tablero" aria-label="Pizarrón: muévelo con el dedo y pellizca para acercarte"></div>
  <div class="flotan"><button class="bt" id="bSeguir" hidden></button><button class="bt" id="bTodo" hidden></button></div>
</section>

<section id="vDicho" class="apuntes" hidden>
  <div class="barra-ap"><button class="bt" id="bVolverDicho"></button><button class="bt" id="bApuntesDicho"></button></div>
  <article class="hoja-ap" id="hojaDicho"></article>
</section>

<section id="vApuntes" class="apuntes" hidden>
  <div class="barra-ap"><button class="bt" id="bVolverClase"></button><button class="bt fuerte" id="bImprimir"></button></div>
  <article class="hoja-ap" id="hojaApuntes"></article>
</section>

<div class="mando" id="mando" hidden>
  <div class="dentro">
    <div class="barra-pasos"><i id="avance"></i></div>
    <div class="sub-voz" id="subVoz" aria-live="polite"></div>
    <div class="botones">
      <button class="bt redondo" id="bAtras" aria-label="Paso anterior"></button>
      <button class="bt redondo fuerte" id="bPlay" aria-label="Reproducir o pausar"></button>
      <button class="bt redondo" id="bSig" aria-label="Paso siguiente"></button>
      <span class="crece"></span>
      <button class="bt redondo" id="bMas" aria-label="Más opciones" aria-expanded="false" aria-controls="mas"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
    </div>
    <!-- Lo que no se cambia seguido, guardado (Carlos, 13 nov: «el mute y el tiempo pueden aparecer solamente cuando el usuario lo quiera»).
         A la vista sólo atrás, play/pausa y siguiente. -->
    <div class="mas" id="mas" hidden>
      <button class="bt redondo" id="bSub" aria-label="Subtítulos"></button>
      <button class="bt" id="bVel" aria-label="Velocidad">1×</button>
      <button class="bt redondo" id="bVoz" aria-label="Voz encendida o apagada"></button>
      <button class="bt redondo" id="bPreg" aria-label="Preguntar algo sobre esto"></button>
      <button class="bt" id="bDicho"></button>
      <button class="bt" id="bApuntes"></button>
    </div>
    <form class="preg" id="fPreg" hidden><input id="pregTxt" placeholder="Pregúntale algo sobre esto…" autocomplete="off"><button class="bt fuerte redondo" aria-label="Preguntar"></button></form>
  </div>
</div>
<script>
  /* «más»: se abre y se cierra; se cierra solo al tocar el pizarrón */
  (function(){
    const b = document.getElementById('bMas'), m = document.getElementById('mas');
    const poner = (si) => { m.hidden = !si; b.setAttribute('aria-expanded', String(si)); b.classList.toggle('activo', si); };
    b.addEventListener('click', () => poner(m.hidden));
    document.getElementById('tablero').addEventListener('pointerdown', () => poner(false));
    m.addEventListener('click', (e) => { if(e.target.closest('#bDicho, #bApuntes')) poner(false); });
  })();
  /* DENTRO DE CARYMO (o de cualquier app que lo meta en un marco): mientras corre la clase, la barra de arriba
     se va (la app ya trae su cabecera) y el pizarrón usa toda la pantalla. «Volver a La Sala» no tiene caso ahí. */
  (function(){
    if(window.top === window) return;
    document.documentElement.classList.add('embebido');
    /* CARYMO pone su flechita de cabecera arriba a la izquierda: aquí se le deja su hueco */
    if(new URLSearchParams(location.search).get('en') === 'capa') document.documentElement.classList.add('con-flecha');
    const c = document.getElementById('vClase');
    const ver = () => document.documentElement.classList.toggle('en-clase', !c.hidden);
    new MutationObserver(ver).observe(c, { attributes: true, attributeFilter: ['hidden'] }); ver();
  })();
  /* la altura de la barra de arriba, para que el pizarrón empiece justo debajo */
  (function(){ const b = document.querySelector('.barra'); const poner = () => document.documentElement.style.setProperty('--barra-alto', b.offsetHeight + 'px'); poner(); new ResizeObserver(poner).observe(b); })();
</script>
<script type="module" src="explica.js"></script>
</body>
</html>
