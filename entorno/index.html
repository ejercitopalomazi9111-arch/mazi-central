/* ══ EL CIELO DE NEURONAS ══════════════════════════════════════════════════
   Carlos: «haz que las neuronas se vean como una skybox en el taller 3D y se
   vea cuando hacen sinapsis etc para que se vea bien mamón».

   QUÉ ES: una esfera de neuronas alrededor del cuarto, con sus enlaces, que se
   ENCIENDE por saltos. No es decoración suelta: es el Cerebro de la casa —118
   neuronas en 11 áreas— puesto como cielo del taller. Cuando un agente trabaja
   está literalmente adentro de lo que la casa ya sabe.

   TRES DECISIONES QUE NO SON OBVIAS:

   1 · VA SIN NIEBLA. El cuarto tiene `Fog(9, 26)`, así que cualquier cosa más
       allá de 26 unidades se pinta del color del fondo — o sea, invisible. Un
       cielo dentro del alcance de la niebla no es un cielo: es un techo. Las
       dos materias llevan `fog:false`.

   2 · EL PUNTO SE DIBUJA CON SU PROPIO SOMBREADOR, y no con `PointsMaterial`.
       No es por presumir: `PointsMaterial` tiene UN tamaño para todos los
       puntos, y lo que hace que esto se lea como sinapsis y no como confeti es
       que la neurona que dispara CREZCA. Con un color más brillante y el mismo
       tamaño, a veinte metros no se distingue.

   3 · LOS ENLACES SALEN DE LA DISTANCIA, no de una lista. Cada neurona se une
       a sus tres más cercanas: así el grafo queda conectado sin cruces largos
       que se lean como rayas sueltas, y la señal viaja por vecindad, que es
       como se ve un cerebro de verdad.

   Y RESPETA `prefers-reduced-motion`: se queda quieto y encendido tenue. Un
   cielo que parpadea no es negociable para quien le hace daño.
   ═════════════════════════════════════════════════════════════════════════ */
const CIELO = {
  cuantas: 300,          /* neuronas. Más no se distinguen y sí se pagan */
  vecinas: 3,            /* enlaces por neurona */
  radio: 34,             /* fuera de la niebla y fuera del alcance del mando */
  saltos: 3,             /* hasta dónde llega una señal */
  cadaCuanto: 1.15,      /* segundos entre disparos */
};
const QUIETO = matchMedia('(prefers-reduced-motion: reduce)').matches;

let cielo = null;
function armarCielo(){
  if(!HAY3D) return null;

  /* Reparto en espiral de Fibonacci: puntos separados de verdad sobre la
     esfera. Al azar puro salen grumos y huecos, y los grumos se leen como
     manchas, no como una red. */
  const n = CIELO.cuantas;
  const pos = new Float32Array(n * 3);
  const carga = new Float32Array(n);
  const puntos = [];
  const dorado = Math.PI * (3 - Math.sqrt(5));
  for(let i = 0; i < n; i++){
    const y = 1 - (i / (n - 1)) * 2;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const th = dorado * i;
    /* Aplastado en Y (0.55): el cuarto se mira de frente y casi nunca hacia
       arriba, así que una esfera perfecta gasta la mitad de sus neuronas en
       un cenit que nadie ve. */
    const v = new THREE.Vector3(Math.cos(th) * r, y * 0.55, Math.sin(th) * r)
      .multiplyScalar(CIELO.radio);
    pos[i*3] = v.x; pos[i*3+1] = v.y + 6; pos[i*3+2] = v.z;
    puntos.push(v);
  }

  /* Los enlaces, por cercanía. Se guardan sin repetir: un par unido dos veces
     se pinta doble y se ve más brillante que sus iguales sin razón. */
  const vecinas = Array.from({ length:n }, () => []);
  const pares = new Set();
  const idx = [];
  for(let i = 0; i < n; i++){
    const cerca = [];
    for(let j = 0; j < n; j++){
      if(i === j) continue;
      cerca.push([puntos[i].distanceToSquared(puntos[j]), j]);
    }
    cerca.sort((a, b) => a[0] - b[0]);
    for(let k = 0; k < CIELO.vecinas; k++){
      const j = cerca[k][1];
      vecinas[i].push(j);
      if(!vecinas[j].includes(i)) vecinas[j].push(i);
      const llave = i < j ? i + ':' + j : j + ':' + i;
      if(pares.has(llave)) continue;
      pares.add(llave);
      idx.push(i, j);
    }
  }

  /* ── las neuronas ── */
  const gNeur = new THREE.BufferGeometry();
  gNeur.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  gNeur.setAttribute('carga', new THREE.BufferAttribute(carga, 1));
  const mNeur = new THREE.ShaderMaterial({
    uniforms: {
      escala:  { value: Math.min(devicePixelRatio, 2) },
      apagado: { value: new THREE.Color(0x5B3C7A) },
      vivo:    { value: new THREE.Color(0xE0A8FF) },
    },
    vertexShader: `
      attribute float carga;
      varying float vCarga;
      uniform float escala;
      void main(){
        vCarga = carga;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        /* El tamaño crece con la carga: es lo que hace que un disparo se lea
           como un disparo y no como un cambio de color. */
        gl_PointSize = (2.2 + carga * 7.5) * escala * (260.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying float vCarga;
      uniform vec3 apagado;
      uniform vec3 vivo;
      void main(){
        /* Redondo y con la orilla suave. Un cuadrito duro se ve a pixel y
           delata que son puntos, no luces. */
        vec2 d = gl_PointCoord - vec2(0.5);
        float r = length(d);
        if(r > 0.5) discard;
        float borde = smoothstep(0.5, 0.06, r);
        vec3 c = mix(apagado, vivo, clamp(vCarga, 0.0, 1.0));
        gl_FragColor = vec4(c, borde * (0.34 + vCarga * 0.66));
      }`,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    fog: false,
  });
  const nube = new THREE.Points(gNeur, mNeur);

  /* ── las sinapsis ── */
  /* Van con color por vértice y NO con opacidad global: si toda la red subiera
     de brillo a la vez se vería un destello, no una señal recorriendo. Lo que
     se lee como sinapsis es que se encienda UN camino. */
  const linPos = new Float32Array(idx.length * 3);
  const linCol = new Float32Array(idx.length * 3);
  for(let k = 0; k < idx.length; k++){
    const i = idx[k];
    linPos[k*3] = pos[i*3]; linPos[k*3+1] = pos[i*3+1]; linPos[k*3+2] = pos[i*3+2];
  }
  const gLin = new THREE.BufferGeometry();
  gLin.setAttribute('position', new THREE.BufferAttribute(linPos, 3));
  gLin.setAttribute('color', new THREE.BufferAttribute(linCol, 3));
  const hilos = new THREE.LineSegments(gLin, new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.85,
    depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
  }));

  const grupo = new THREE.Group();
  grupo.add(nube); grupo.add(hilos);
  /* No recibe ni proyecta sombra, y no entra en el `raycast` del mando. */
  grupo.matrixAutoUpdate = true;
  escena.add(grupo);

  return { grupo, nube, hilos, gNeur, gLin, idx, vecinas, carga,
           colorLinea: linCol, n, proximo: 0, quemando: [] };
}

/* Un disparo: se enciende una neurona y la señal salta a sus vecinas. Cada
   salto llega más débil, que es lo que hace que se vea una DIRECCIÓN en vez de
   una mancha creciendo. */
function dispararCielo(c){
  const semilla = (Math.random() * c.n) | 0;
  const vistas = new Set([semilla]);
  let frente = [semilla];
  for(let salto = 0; salto <= CIELO.saltos; salto++){
    const fuerza = 1 - salto / (CIELO.saltos + 1);
    for(const i of frente) c.quemando.push({ i, fuerza, espera: salto * 0.14 });
    const siguiente = [];
    for(const i of frente){
      for(const j of c.vecinas[i]){
        if(vistas.has(j)) continue;
        vistas.add(j); siguiente.push(j);
      }
    }
    frente = siguiente;
    if(!frente.length) break;
  }
}

function moverCielo(c, dt, t){
  if(!c) return;
  /* Gira despacísimo. Lo justo para que no se vea una calcomanía pegada al
     fondo, y no tanto como para marear a quien está viendo trabajar a alguien. */
  c.grupo.rotation.y = t * 0.012;

  const carga = c.carga;
  /* Se apaga todo un poco cada cuadro. Independiente de los cuadros por
     segundo: en un teléfono a 30 fps el apagado tiene que tardar lo mismo que
     en una computadora a 60, o la señal se ve el doble de larga. */
  const apaga = Math.pow(0.12, dt);
  for(let i = 0; i < c.n; i++) carga[i] *= apaga;

  for(let k = c.quemando.length - 1; k >= 0; k--){
    const q = c.quemando[k];
    q.espera -= dt;
    if(q.espera > 0) continue;
    carga[q.i] = Math.max(carga[q.i], q.fuerza);
    c.quemando.splice(k, 1);
  }
  c.gNeur.attributes.carga.needsUpdate = true;

  /* El color de cada extremo de cada hilo sale de la carga de SU neurona. Así
     un enlace entre una encendida y una apagada sale en degradado, que es lo
     que hace que se vea el salto y no un parpadeo. */
  const col = c.colorLinea, idx = c.idx;
  for(let k = 0; k < idx.length; k++){
    const v = carga[idx[k]];
    /* base tenue para que la red se intuya siempre, aunque nadie dispare */
    const g = 0.055 + v * 0.85;
    col[k*3]     = g * 0.72;
    col[k*3 + 1] = g * 0.26;
    col[k*3 + 2] = g;
  }
  c.gLin.attributes.color.needsUpdate = true;

  if(QUIETO) return;
  c.proximo -= dt;
  if(c.proximo <= 0){
    c.proximo = CIELO.cadaCuanto * (0.6 + Math.random() * 0.8);
    dispararCielo(c);
  }
}

/* ── la cámara ────────────────────────────────────────────────────────── */
let siguiendo = true;
function enFocar(id){
  enFoco = id;
  const p = puestos.get(id);
  if(!p) return;
  pintarPanel(Object.values(gente));
  if(!siguiendo || !HAY3D) return;
  /* Se mira POR ENCIMA DEL HOMBRO: el robot de espaldas en primer plano y su
     pantalla enfrente. De frente al robot se ve más bonito el muñeco y NO se
     ve el monitor — que es a lo que se entra aquí. Se probó de las dos formas.

     La altura y la distancia salen de ALTO_AGENTE, no de números sueltos: si
     el muñeco cambia de tamaño, el encuadre se ajusta solo. */
  const v = new THREE.Vector3(0.82, ALTO_AGENTE * 1.32, 2.95)
              .applyQuaternion(p.grupo.quaternion);
  destino.copy(p.grupo.position).add(v);
  mirando.copy(p.grupo.position).add(new THREE.Vector3(-0.1, ALTO_AGENTE * 0.80, -1.0)
    .applyQuaternion(p.grupo.quaternion));
}
const destino = new THREE.Vector3(0, 2.6, 7.2);
const mirando = new THREE.Vector3(0, 1.1, 0);

function marcar(id, prendido){
  const b = $(id); if(!b) return;
  b.setAttribute('aria-pressed', String(!!prendido));
  b.classList.toggle('on', !!prendido);
}
$('bSeguir').addEventListener('click', () => {
  siguiendo = !siguiendo;
  marcar('bSeguir', siguiendo);
  if(siguiendo && enFoco) enFocar(enFoco);
});
marcar('bSeguir', true);

/* El panel lo maneja el ojo de abajo, que tiene TRES estados —completo,
   plegado, oculto— y no dos. Aquí vivía un segundo interruptor de dos estados
   sobre el mismo panel, y los dos se pisaban: el ojo lo dejaba oculto y este
   otro creía que estaba completo.

   Peor todavía: una copia de este mismo bloque estaba pegada DENTRO del
   `else` del botón de vista. O sea que cada vez que apagabas la vista amplia
   se registraba OTRO escuchador sobre el mismo botón, y a partir de ahí un
   clic plegaba y desplegaba en el mismo instante. Desde fuera se ve idéntico a
   un botón muerto, que es como se reportan estas cosas. */

let vistaAmplia = false;
$('bVista').addEventListener('click', () => {
  vistaAmplia = !vistaAmplia;
  marcar('bVista', vistaAmplia);
  if(vistaAmplia){
    siguiendo = false; marcar('bSeguir', false);
    /* La distancia sale del radio del semicírculo, no de un número fijo: con
       dos agentes el cuarto es chico y con ocho es grande, y una cámara fija
       o los deja de estampilla o se mete entre los escritorios. */
    destino.set(0, radioActual * 1.45 + 3.2, radioActual * 2.4 + 5.5);
    mirando.set(0, 0.7, 0);
  }else if(enFoco){
    siguiendo = true; marcar('bSeguir', true); enFocar(enFoco);
  }
});

/* Una manija para poder MEDIR la escena desde fuera. No es depuración
   olvidada: sin esto, revisar el taller es mirar una foto y opinar, que es
   justo lo que la casa no acepta como verificación. */
window.__taller = { escena, camara, puestos, get gente(){ return gente; },
                    get cielo(){ return cielo; }, dispararCielo:() => cielo && dispararCielo(cielo),
                    cuantasPantallas: () => PANTALLAS_TOTAL,
                    /* Poner una pantalla concreta, para poder VERLAS todas en
                       una prueba en vez de esperar setenta segundos. */
                    verPantalla(id, n){
                      const p = puestos.get(id) || [...puestos.values()][0];
                      if(!p) return false;
                      p.mesa.ocio = n % PANTALLAS_TOTAL;
                      pintarPantalla(p.mesa, p.quien, '#' + p.color.getHexString());
                      return true;
                    },
                    /* Repintar con SU estado de verdad. Hace falta para probar el
                       cambio de pantalla en los dos sentidos sin que la prueba
                       se ensucie a sí misma. */
                    /* Embarra el lienzo de un color imposible. Sirve para PROBAR que
                       cada pantalla tapa TODO: se ensucia, se pinta encima, y si
                       queda un solo píxel del color imposible es que esa pantalla
                       deja ver lo de antes por debajo. */
                    ensuciar(id){
                      const p = puestos.get(id) || [...puestos.values()][0];
                      if(!p) return false;
                      const g = p.mesa.lienzo.getContext('2d');
                      g.setTransform(1,0,0,1,0,0); g.globalAlpha = 1;
                      g.fillStyle = '#FF00FF';
                      g.fillRect(0, 0, p.mesa.lienzo.width, p.mesa.lienzo.height);
                      return true;
                    },
                    /* Cuántos píxeles del color imposible quedaron. */
                    manchas(id){
                      const p = puestos.get(id) || [...puestos.values()][0];
                      if(!p) return -1;
                      const c = p.mesa.lienzo;
                      const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
                      let n = 0;
                      for(let i = 0; i < d.length; i += 4){
                        if(d[i] > 240 && d[i+1] < 40 && d[i+2] > 240) n++;
                      }
                      return n;
                    },
                    /* De qué lado tiene su barra cada quien. Es fijo por agente. */
                    ladoDe: (id) => ladoDe(id),
                    congelarReloj(h){ relojFijo = h; },
                    /* Forzar un lado, para poder VER los cuatro en una prueba en vez
                       de esperar a que le toque a alguien el de la derecha. */
                    verBarra(id, lado, pantalla){
                      const p = puestos.get(id) || [...puestos.values()][0];
                      if(!p) return false;
                      p.mesa.ocio = (pantalla == null ? p.mesa.ocio : pantalla);
                      p.mesa.ladoFijo = lado;
                      pintarPantalla(p.mesa, p.quien, '#' + p.color.getHexString());
                      p.mesa.ladoFijo = null;
                      return true;
                    },
                    verTrabajo(id){
                      const p = puestos.get(id) || [...puestos.values()][0];
                      if(!p) return false;
                      pintarPantalla(p.mesa, p.quien, '#' + p.color.getHexString());
                      return true;
                    },
                    lienzoDe(id){
                      const p = puestos.get(id) || [...puestos.values()][0];
                      return p ? p.mesa.lienzo.toDataURL('image/png') : null;
                    } };

/* ── el bucle ─────────────────────────────────────────────────────────── */
/* ── los tres estados del panel ────────────────────────────────────────────
   completo → plegado → oculto → completo. Tres y no dos porque cada uno
   contesta algo distinto: completo es «qué está haciendo cada quien»,
   plegado es «qué está haciendo el que estoy mirando», y oculto es «déjame
   ver el cuarto». Lo tercero es lo que faltaba. */
const ESTADOS_PANEL = ['completo', 'plegado', 'oculto'];
function ponerPanel(cual){
  const el = document.getElementById('panel');
  if(!el) return;
  el.classList.toggle('plegado', cual === 'plegado');
  el.classList.toggle('oculto',  cual === 'oculto');
  const b = document.getElementById('bPanel');
  if(b) b.classList.toggle('on', cual === 'completo');
  const ojo = document.getElementById('bOjo');
  if(ojo) ojo.textContent = cual === 'oculto' ? '🚫' : cual === 'plegado' ? '👁' : '👁';
  try{ localStorage.setItem('taller-panel', cual); }catch(e){}
}
function cicloPanel(){
  const el = document.getElementById('panel');
  const hoy = el.classList.contains('oculto') ? 'oculto'
            : el.classList.contains('plegado') ? 'plegado' : 'completo';
  ponerPanel(ESTADOS_PANEL[(ESTADOS_PANEL.indexOf(hoy) + 1) % 3]);
}
document.getElementById('bOjo').addEventListener('click', cicloPanel);

/* Se recuerda cómo lo dejaste: si lo escondiste una vez es porque querías ver
   el cuarto, y volver a abrirlo en cada visita es hacerte pelear con la
   herramienta cada vez. */
(function panelRecordado(){
  let g = null;
  try{ g = localStorage.getItem('taller-panel'); }catch(e){}
  if(g && ESTADOS_PANEL.includes(g)) ponerPanel(g);
})();

if(DENTRO){
  const barra = document.querySelector('.barra');
  if(barra) barra.hidden = true;
  document.body.classList.add('dentro');
  /* ⚠ Y EL PANEL ARRANCA PLEGADO. Sin esto queda una trampa: el panel tapaba
     dos tercios del cuarto y el botón que lo cierra vive en la barra que
     acabamos de esconder — o sea, algo que estorba y no se puede quitar.
     Adentro el panel además sobra: lo que dice ya está en el chat, a una
     pestaña de distancia. Se despliega tocándolo. */
  /* Empotrado arranca OCULTO —no plegado— salvo que ya hayas elegido otra
     cosa: lo que dice el panel está en el chat, a una pestaña de distancia, y
     lo que no está en ningún otro lado es el cuarto. */
  let elegido = null;
  try{ elegido = localStorage.getItem('taller-panel'); }catch(e){}
  ponerPanel(elegido && ESTADOS_PANEL.includes(elegido) ? elegido : 'oculto');
}

cielo = armarCielo();

/* ── EL RELOJ DEL OCIO ─────────────────────────────────────────────────────
   Los que no tienen trabajo cambian de pantalla cada 7 segundos. NO va en el
   bucle de cuadros: repintar un lienzo de 1024×640 sesenta veces por segundo
   para enseñar una página quieta funde la batería de un teléfono, y es la
   misma razón por la que la pantalla del trabajo se repinta sólo al cambiar.

   Y cambia UNO A LA VEZ, no todos juntos: cuatro monitores parpadeando al
   unísono se lee como un fallo del cuarto. Se pasan el turno. */
let turnoOcio = 0;
setInterval(() => {
  /* ⚠ YA NO SE FILTRA POR «ocioso». Al principio sólo rotaban los que no
     tenían nada que hacer, y eso dejaba fuera justo lo que Carlos quería ver:
     el agente jugando MIENTRAS su tarea avanza en la barra. Rotan todos; la
     pantalla 0 es su trabajo completo y sigue apareciendo en cada vuelta. */
  const todos = [...puestos.values()].filter(p => p.quien);
  if(!todos.length) return;
  const p = todos[turnoOcio++ % todos.length];
  p.mesa.ocio = (p.mesa.ocio + 1) % PANTALLAS_TOTAL;
  pintarPantalla(p.mesa, p.quien, '#' + p.color.getHexString());
}, 7000);

const reloj = new THREE.Clock();
function cuadro(){
  if(!HAY3D) return;                    /* sin 3D no hay nada que pintar */
  requestAnimationFrame(cuadro);
  const dt = reloj.getDelta();
  const t = reloj.elapsedTime;
  for(const p of puestos.values()){
    if(p.mezclador) p.mezclador.update(dt);
    /* ⚠ DESPUÉS del mezclador, nunca antes: el mezclador SOBREESCRIBE la
       rotación de los huesos que anima, así que cualquier ajuste hecho antes
       se borra en el mismo cuadro. Se probó al revés primero y no se movía
       nada — y no había error que lo dijera. */
    moverBrazos(p, t);
  }
  if(siguiendo || vistaAmplia){
    camara.position.lerp(destino, 0.045);
    mando.target.lerp(mirando, 0.045);
  }
  moverCielo(cielo, dt, t);
  mando.update();
  pintor.render(escena, camara);
}

addEventListener('resize', () => {
  if(!HAY3D) return;
  acomodarCamara();
  pintor.setSize(innerWidth, innerHeight);
});

/* ── arranque ─────────────────────────────────────────────────────────── */
async function arrancar(){
  /* ⚠ SIN ESTE try/catch, cualquier tropiezo aquí adentro desaparece: se llama
     desde el callback asíncrono del cargador de modelos, y una promesa rota
     ahí no llega a la consola. El síntoma es el peor posible — un cuarto
     NEGRO, sin error, sin aviso y sin panel — y uno se pone a buscar en el
     3D cuando el problema puede estar en los datos.
     Costó una tarde: el taller empotrado salía en negro y todo lo medible
     (canvas, WebGL, el modelo, el <iframe>) daba bien. */
  try{
    refrescar(await traer());
    if(HAY3D) cuadro();
    setInterval(async () => {
      try{ refrescar(await traer()); }
      catch(e){ $('aviso').textContent = `El taller se atoró: ${e.message}`; }
    }, 2000);
  }catch(e){
    console.error('el taller no arrancó:', e);
    $('aviso').textContent = `El taller no arrancó: ${e.message}`;
  }
}

if(!HAY3D){
  $('cargando').classList.add('ido');
  $('aviso').textContent = 'Este navegador no trae 3D · el taller funciona igual, sin cuarto';
  arrancar();
}else cargador.load('./modelo/RobotExpressive.glb', async (gltf) => {
  plantilla = gltf.scene;
  animaciones = gltf.animations;
  ALTO_CRUDO = new THREE.Box3().setFromObject(plantilla)
                 .getSize(new THREE.Vector3()).y || 1;
  $('cargando').classList.add('ido');
  await arrancar();
}, undefined, (e) => {
  /* Si el modelo no carga, el taller sigue sirviendo: escritorios, pantallas y
     panel. Quedarse en «cargando…» para siempre sería lo peor de los dos
     mundos — ni muñeco ni información. */
  console.warn('el robot no cargó:', e);
  $('cargando').classList.add('ido');
  $('aviso').textContent = 'El modelo 3D no cargó · el taller sigue funcionando sin muñeco';
  arrancar();
});

/* A dónde vuelve: de donde vino, y si no se sabe, al tablero. No es
   `history.back()` porque desde La Sala esto abre en pestaña nueva y ahí no
   hay historia. */
(function elVolver(){
  const b = document.getElementById('volver');
  if(!b) return;
  try{
    const r = document.referrer;
    if(r && new URL(r).origin === location.origin
         && !new URL(r).pathname.startsWith('/entorno')){
      b.href = r;
      if(/\/sala\//.test(new URL(r).pathname)) b.title = 'Volver a La Sala';
    }
  }catch(e){}
})();
</script>
