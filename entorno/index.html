<!-- ══════════════════════════════════════════════════════════════════════════
     EL TALLER — el cuarto donde se ve trabajar a los agentes
     ──────────────────────────────────────────────────────────────────────────
     Lo pidió Carlos así: «un entorno virtual donde pueda verte como un modelo
     3D descargado de la web y ver cómo trabajas en tiempo real, con una
     computadora dentro del entorno que me muestre qué haces».

     DE DÓNDE SALE LO QUE SE VE. De La Sala. No hay servidor nuevo: `/hilo`
     ya devuelve a toda la gente con su `trabajo` —en qué anda, el paso actual,
     los últimos ocho pasos y el avance—, y eso ya está probado con 91 pruebas.
     Este archivo es OTRA CARA del mismo servidor. Inventarle un backend aparte
     habría sido tener dos versiones de la verdad y que se desincronizaran.

     EL MUÑECO ES ARTE REAL, NO DIBUJADO POR CÓDIGO. `RobotExpressive.glb`,
     de Tomás Laulhé (Quaternius), CC0 1.0, con modificaciones de Don McCurdy.
     Es la regla §3 de la casa: para relleno y ambiente se busca real con
     licencia abierta y se baja al repo con crédito. Los muebles sí son cajas
     —una mesa no es «arte», es geometría— pero el personaje no.

     QUIÉN ES QUIÉN. Se reusa la identidad que ya existe en la mesa: el COLOR
     es la cuenta, y el matiz la sesión. Un robot morado es de Carlos, uno
     naranja es de Luis. Así el cuarto y el chat dicen lo mismo.

     TELÉFONO PRIMERO. Carlos trabaja desde el iPhone. Por eso hay dos lecturas
     de lo mismo: el monitor DENTRO de la escena, que es el que se siente, y un
     panel de HTML encima, que es el que de verdad se lee con el pulgar. Una
     pantalla 3D leída en un teléfono es bonita y es ilegible.
     ═════════════════════════════════════════════════════════════════════════ -->
<style>
:root{
  --vacio:#100A18; --superficie:#1B1226; --alta:#241834;
  --borde:#33224A; --borde-vivo:#4A3167;
  --hueso:#E9E4E4; --tenue:#A090B4; --muy-tenue:#7B6B8D;
  --violeta:#AC27FF; --violeta-claro:#C77BFF;
  --verde:#3ECF8E; --ambar:#E8B33A; --rojo:#F0567F;
  --display:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --dato:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--vacio);color:var(--hueso);
  font-family:var(--display);-webkit-text-size-adjust:100%}
canvas{display:block;touch-action:none}

/* ── la barra ─────────────────────────────────────────────────────────── */
.barra{
  position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:10px;
  padding:calc(9px + env(safe-area-inset-top)) 13px 9px;
  background:linear-gradient(var(--vacio),rgba(16,10,24,.82),transparent);
}
.marca{font-weight:700;font-size:15px;letter-spacing:-.01em}
body.dentro .barra{display:none}
.volver{
  display:grid; place-items:center; width:34px; height:34px; margin:-4px 8px -4px -4px;
  border-radius:10px; border:1px solid var(--borde-vivo, rgba(255,255,255,.2));
  color:var(--tenue, #bbb); text-decoration:none; font-size:21px; line-height:1;
  flex:0 0 auto;
}
.volver:active{background:rgba(255,255,255,.12)}
.marca b{color:var(--violeta)}
.crece{flex:1}
.btn{
  font-family:var(--dato);font-size:10px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;padding:7px 11px;border-radius:99px;cursor:pointer;
  background:rgba(27,18,38,.86);color:var(--tenue);border:1px solid var(--borde-vivo);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.btn:hover,.btn.on{color:var(--hueso);border-color:var(--violeta)}
.btn.on{background:rgba(172,39,255,.16)}

/* ── el panel que de verdad se lee ────────────────────────────────────── */
.panel{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  transition:transform .3s ease, opacity .3s ease;
  padding:14px 14px calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,rgba(16,10,24,.86) 22%,var(--vacio));
  max-height:52dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.panel.plegado{transform:translateY(calc(100% - 74px))}
.panel.plegado .ficha:not(.eldelfoco){display:none}
/* ⚠ HACÍA FALTA UN TERCER ESTADO. Lo pidió Carlos: «haz que pueda esconder
   los recuadros que salen hasta el frente de trabajando, porque también
   debería poder verlo en la pantalla del agente». Y tenía razón: `plegado`
   deja 74px asomando y ésos son justo los que tapan el monitor del de
   adelante — que es donde ya está escrito lo mismo que dice la ficha.
   Con `oculto` el cuarto se ve entero. */
.panel.oculto{transform:translateY(105%); opacity:0; pointer-events:none}

/* El botón que los cicla. Va flotando y no en la barra a propósito: cuando el
   taller vive empotrado en La Sala la barra no existe, y sin esto el panel
   sería algo que estorba y no se puede quitar. */
/* Los mandos del cuarto: una columna a la derecha, con el ojo hasta abajo
   porque es el que más se toca. Van encima del cuarto y NO en la barra, para
   que sigan estando cuando el taller va empotrado en La Sala. */
.mandos{
  position:fixed; right:12px; z-index:12;
  bottom:calc(66px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:8px;
}
.ojo{
  width:44px; height:44px; border-radius:50%; padding:0;
  display:grid; place-items:center; cursor:pointer;
  background:rgba(27,18,38,.9); border:1px solid var(--borde-vivo);
  color:var(--tenue); font-size:18px; line-height:1;
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  transition:color .15s, border-color .15s, background .15s;
}
/* El ojo solo —el del panel— se queda pegado abajo; los otros se apilan encima. */
#bOjo{
  position:fixed; right:12px; z-index:12;
  bottom:calc(14px + env(safe-area-inset-bottom));
}
.ojo:hover{color:var(--hueso); border-color:var(--violeta)}
.ojo:focus-visible{outline:2px solid var(--verde); outline-offset:2px}
/* Encendido: un botón de modo tiene que decir en qué modo está. Es la misma
   lección del «Ajustar» de Reportes — uno que no lo dice se ve muerto. */
.ojo[aria-pressed="true"]{
  color:var(--hueso); border-color:var(--violeta);
  background:rgba(76,32,110,.9);
}
.ficha{
  background:rgba(27,18,38,.9);border:1px solid var(--borde);border-radius:15px;
  padding:11px 13px;margin-bottom:8px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
.ficha.eldelfoco{border-color:var(--violeta)}
.cab{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.pastilla{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
.nom{font-weight:700;font-size:13.5px}
.motor{font-family:var(--dato);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muy-tenue)}
.estado{margin-left:auto;font-family:var(--dato);font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;padding:2px 7px;border-radius:99px;border:1px solid var(--borde-vivo);
  color:var(--tenue)}
.estado.trabaja{color:var(--verde);border-color:rgba(62,207,142,.5)}
.estado.dormido{color:var(--muy-tenue)}
.estado.topado{color:var(--ambar);border-color:rgba(232,179,58,.5)}
.enque{font-size:13.5px;line-height:1.45;margin-bottom:3px}
.paso{font-family:var(--dato);font-size:11px;color:var(--violeta-claro);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrita{height:3px;border-radius:2px;background:var(--alta);margin-top:8px;overflow:hidden}
.barrita i{display:block;height:100%;background:var(--violeta);transition:width .5s}
.rastro{margin-top:8px;padding-top:7px;border-top:1px solid var(--borde);
  font-family:var(--dato);font-size:10.5px;color:var(--muy-tenue);line-height:1.6}
.rastro div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rastro div:last-child{color:var(--tenue)}
.nadie{color:var(--muy-tenue);font-size:13px;text-align:center;padding:18px 10px}

.aviso{
  position:fixed;top:calc(50px + env(safe-area-inset-top));left:13px;right:13px;z-index:11;
  font-family:var(--dato);font-size:10.5px;color:var(--ambar);text-align:center;
}
.cargando{
  position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--vacio);
  font-family:var(--dato);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muy-tenue);transition:opacity .6s;
}
.cargando.ido{opacity:0;pointer-events:none}
.credito{
  position:fixed;bottom:calc(4px + env(safe-area-inset-bottom));right:10px;z-index:9;
  font-family:var(--dato);font-size:8.5px;color:rgba(123,107,141,.55);
}
</style>
</head>
<body>

<div class="barra">
  <!-- El mismo botón que faltaba en el Cerebro, por la misma razón: desde La
       Sala esto se abre en pestaña nueva y no había cómo volver. -->
  <a class="volver" id="volver" href="../" title="Volver">‹</a>
  <span class="marca">El <b>Taller</b></span>
  <span class="crece"></span>
</div>

<!-- ⚠ LOS MANDOS VIVEN AQUÍ Y NO EN LA BARRA, Y ÉSE ERA EL BUG.
     Carlos: «en el taller 3D no encuentro cómo acceder a la vista aérea (la
     vista chida)». No es que no la encontrara: es que NO ESTABA. El taller se
     abre dentro de La Sala con ?dentro=1, y esa marca esconde la barra
     entera —«body.dentro .barra{display:none}»— para no repetir la cabecera de
     la mesa. Los tres botones vivían adentro de esa barra, así que empotrado
     —o sea, como él lo usa siempre— la vista aérea era inalcanzable.

     Flotan sobre el cuarto, junto al ojo, y sobreviven a «dentro». -->
<div class="mandos" id="mandos">
  <button class="ojo" id="bVista" title="Vista aérea: ver a todos de un jalón"
          aria-label="Vista aérea: ver a todos de un jalón" aria-pressed="false">⌖</button>
  <button class="ojo" id="bSeguir" title="Seguir al que está en foco"
          aria-label="Seguir al que está en foco" aria-pressed="true">◉</button>
</div>

<div class="aviso" id="aviso"></div>
<div class="panel" id="panel"></div>
<button class="ojo" id="bOjo" title="Enseñar u ocultar las fichas de trabajo"
        aria-label="Enseñar u ocultar las fichas de trabajo">👁</button>
<div class="cargando" id="cargando">armando el taller…</div>
<div class="credito">Robot: Tomás Laulhé · Quaternius · CC0</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/loaders/GLTFLoader.js';
import { OrbitControls } from './vendor/controls/OrbitControls.js';
/* `clone()` de three NO clona el esqueleto de una malla con huesos: los clones
   comparten el mismo Skeleton y se deforman todos con el que se anime último.
   `SkeletonUtils.clone` existe justamente para eso. Con un solo robot no se
   nota; con cuatro en el cuarto se ve como una escena de terror. */
import { clone as clonarConHuesos } from './vendor/utils/SkeletonUtils.js';

const $ = (id) => document.getElementById(id);
const esc = (t) => String(t == null ? '' : t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const params   = new URLSearchParams(location.search);
const SERVIDOR = (params.get('servidor') || 'https://sala.palomazi9111.workers.dev').replace(/\/$/,'');
const SALA     = (params.get('sala') || '').toUpperCase();
const LLAVE    = params.get('llave') || '';
const DEMO     = params.get('demo') === '1' || !SALA;
/* ── empotrado dentro de La Sala ──────────────────────────────────────────
   Cuando el taller vive en una pestaña de la mesa, su propia barra sobra: ya
   hay un encabezado arriba y un botón de volver que es la pestaña «Chat».
   Dos encabezados apilados en un teléfono se comen la mitad del cuarto, que
   es justo lo que uno vino a ver. La marca `?dentro=1` la pone la mesa. */
const DENTRO   = params.get('dentro') === '1';

/* Un agente mide 1.55: alto de persona junto a un escritorio de 0.74. Con
   esto la pantalla le queda a la altura de la cara y el encuadre sale solo. */
const ALTO_AGENTE = 1.55;
/* Dónde queda la cadera del muñeco en la pose `Sitting`. MEDIDO con el
   esqueleto en pantalla, no estimado: es la altura a la que tiene que quedar
   el asiento para que se siente en la silla y no encima de ella. */
const ALTO_ASIENTO = 0.27;
let ALTO_CRUDO = 1;                     /* se mide al cargar el modelo */

/* ══ EL CUARTO ═══════════════════════════════════════════════════════════ */
const escena = new THREE.Scene();
escena.background = new THREE.Color(0x100A18);
escena.fog = new THREE.Fog(0x100A18, 9, 26);

const camara = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 100);
camara.position.set(0, 2.6, 7.2);

/* ── el encuadre en un teléfono parado ────────────────────────────────────
   El `fov` de three es VERTICAL. En una pantalla de 390×844 la relación es
   0.46, así que el campo HORIZONTAL queda en ~22° — todo se ve pegado a la
   cara aunque la cámara esté a tres metros. Es el defecto que sólo aparece en
   teléfono y por eso hay que probarlo en teléfono.

   Se corrige al revés: se fija cuánto se quiere ver de ANCHO y se despeja el
   vertical. En horizontal no cambia nada; en vertical abre el cuarto. */
const FOV_ANCHO = 62 * Math.PI / 180;
function acomodarCamara(){
  camara.aspect = innerWidth / innerHeight;
  const vertical = 2 * Math.atan(Math.tan(FOV_ANCHO/2) / camara.aspect);
  camara.fov = Math.min(78, Math.max(40, vertical * 180 / Math.PI));
  camara.updateProjectionMatrix();
}
acomodarCamara();

/* ── si no hay WebGL, el taller NO se muere ────────────────────────────────
   Salió probándolo: sin contexto WebGL la página se quedaba clavada en
   «armando el taller…» para siempre. Un teléfono viejo, un navegador con la
   aceleración apagada o una vista incrustada dan exactamente eso, y lo peor
   que puede hacer una pantalla de monitoreo es no enseñar nada. Sin 3D se
   pierde el cuarto; la información —que es a lo que se entra— se queda. */
let pintor = null;
try{
  pintor = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
}catch(e){
  console.warn('sin WebGL:', e.message);
}
const HAY3D = !!pintor;
if(HAY3D){
pintor.setSize(innerWidth, innerHeight);
/* Tope de 2 a propósito: en un iPhone el ratio llega a 3 y triplicar los
   píxeles tira los cuadros por segundo sin que se note la diferencia. */
pintor.setPixelRatio(Math.min(devicePixelRatio, 2));
pintor.shadowMap.enabled = true;
pintor.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(pintor.domElement);
}

const mando = HAY3D ? new OrbitControls(camara, pintor.domElement) : null;
if(mando){
mando.enableDamping = true;
mando.dampingFactor = 0.07;
mando.target.set(0, 1.1, 0);
mando.minDistance = 2.2;
mando.maxDistance = 16;
/* Que no se pueda ir debajo del piso: verlo desde abajo se ve roto y no
   aporta nada. */
mando.maxPolarAngle = Math.PI * 0.495;
}

/* ── luz ───────────────────────────────────────────────────────────────
   Poca luz general y un foco violeta por delante: es la paleta de la casa y
   además hace que las pantallas encendidas sean lo más brillante del cuarto,
   que es donde uno quiere que caiga el ojo. */
escena.add(new THREE.HemisphereLight(0x6a4b8f, 0x0d0714, 1.05));
const foco = new THREE.DirectionalLight(0xC9A6FF, 1.5);
foco.position.set(4, 8, 6);
foco.castShadow = true;
foco.shadow.mapSize.set(1024, 1024);
foco.shadow.camera.left = foco.shadow.camera.bottom = -10;
foco.shadow.camera.right = foco.shadow.camera.top = 10;
escena.add(foco);
const relleno = new THREE.DirectionalLight(0x3ECF8E, 0.32);
relleno.position.set(-6, 3, -4);
escena.add(relleno);

/* ── piso ── */
const piso = new THREE.Mesh(
  new THREE.CircleGeometry(16, 64),
  new THREE.MeshStandardMaterial({ color:0x1B1226, roughness:0.92, metalness:0.04 }));
piso.rotation.x = -Math.PI/2;
piso.receiveShadow = true;
escena.add(piso);

const rejilla = new THREE.GridHelper(32, 32, 0x4A3167, 0x2A1C3D);
rejilla.material.transparent = true;
rejilla.material.opacity = 0.35;
rejilla.position.y = 0.002;
escena.add(rejilla);

/* ══ LA COMPUTADORA DE CADA AGENTE ════════════════════════════════════════
   El monitor es una textura de canvas que se repinta cuando cambia el estado
   —no en cada cuadro—. Repintar 1024×640 sesenta veces por segundo funde la
   batería de un teléfono para enseñar un texto que cambia cada dos segundos. */
function hacerEscritorio(color){
  const grupo = new THREE.Group();
  const madera = new THREE.MeshStandardMaterial({ color:0x241834, roughness:0.75, metalness:0.15 });
  const metal  = new THREE.MeshStandardMaterial({ color:0x33224A, roughness:0.4, metalness:0.7 });

  const tabla = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.08, 1.1), madera);
  tabla.position.y = 0.74; tabla.castShadow = tabla.receiveShadow = true;
  grupo.add(tabla);
  for(const x of [-1.1, 1.1]){
    const pata = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.74, 0.9), metal);
    pata.position.set(x, 0.37, 0); pata.castShadow = true;
    grupo.add(pata);
  }

  const lienzo = document.createElement('canvas');
  lienzo.width = 1024; lienzo.height = 640;
  const textura = new THREE.CanvasTexture(lienzo);
  textura.colorSpace = THREE.SRGBColorSpace;

  const marco = new THREE.Mesh(new THREE.BoxGeometry(1.92, 1.2, 0.05), metal);
  marco.position.set(0, 1.46, -0.3); marco.castShadow = true;
  grupo.add(marco);
  const pantalla = new THREE.Mesh(
    new THREE.PlaneGeometry(1.82, 1.1),
    new THREE.MeshBasicMaterial({ map:textura }));   /* Basic: no la ensucia la luz */
  pantalla.position.set(0, 1.46, -0.272);
  grupo.add(pantalla);

  const cuello = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, 0.34, 12), metal);
  cuello.position.set(0, 0.94, -0.3); grupo.add(cuello);

  const teclado = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.03, 0.34), metal);
  teclado.position.set(0, 0.795, 0.24); teclado.castShadow = true;
  grupo.add(teclado);

  /* El resplandor de la pantalla sobre el escritorio. Es el detalle que hace
     que se sienta encendida en vez de pegada. */
  const brillo = new THREE.PointLight(color, 1.5, 4.2, 2);
  brillo.position.set(0, 1.42, 0.25);
  grupo.add(brillo);

  return { grupo, lienzo, textura, brillo, pantalla };
}

/* ── la silla ──────────────────────────────────────────────────────────────
   La pidió Carlos: «quizá podrías darles sillas». Y hacía falta más de lo que
   parece: el modelo ya usaba la animación `Sitting` cuando el agente trabaja,
   así que los robots estaban sentados EN EL AIRE. Nadie lo había notado
   porque de lejos se lee como «encogido».

   Es de oficina y de una sola pieza: base de estrella, poste, asiento y
   respaldo. Sin ruedas — a esta distancia una rueda son tres triángulos que
   nadie ve y cinco por silla que sí se pagan. */
function hacerSilla(color, altoAsiento){
  const g = new THREE.Group();
  const oscuro = new THREE.MeshStandardMaterial({
    color:0x1A1424, roughness:0.75, metalness:0.25 });
  const tela = new THREE.MeshStandardMaterial({
    color: color.clone().multiplyScalar(0.42), roughness:0.9, metalness:0.05 });

  /* ⚠ EL ALTO DEL ASIENTO SE MIDE, NO SE INVENTA. La primera silla se hizo a
     ojo con el asiento a 0.40 y los robots quedaron sentados EN EL AIRE,
     encima de ella. La cadera del muñeco en la pose `Sitting` está a 0.271 —
     se le preguntó al esqueleto, no se estimó mirando la captura, porque en
     una captura de tres cuartos 13 centímetros de error no se ven y en cambio
     se leen como «algo está raro». */
  const grosor = 0.06;
  const yAsiento = altoAsiento - grosor / 2;

  /* La base: cinco brazos en estrella, que es lo que hace que se lea como
     silla de oficina y no como banco. Sin ruedas — a esta distancia una rueda
     son tres triángulos que nadie ve y cinco por silla que sí se pagan. */
  for(let i = 0; i < 5; i++){
    const brazo = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.03, 0.05), oscuro);
    const a = (i / 5) * Math.PI * 2;
    brazo.position.set(Math.cos(a) * 0.11, 0.03, Math.sin(a) * 0.11);
    brazo.rotation.y = -a;
    brazo.castShadow = true;
    g.add(brazo);
  }
  const alturaPoste = Math.max(0.05, yAsiento - 0.04);
  const poste = new THREE.Mesh(
    new THREE.CylinderGeometry(0.03, 0.04, alturaPoste, 10), oscuro);
  poste.position.y = 0.04 + alturaPoste / 2; poste.castShadow = true; g.add(poste);

  const asiento = new THREE.Mesh(new THREE.BoxGeometry(0.36, grosor, 0.34), tela);
  asiento.position.y = yAsiento; asiento.castShadow = true;
  asiento.receiveShadow = true; g.add(asiento);

  const altoRespaldo = 0.38;
  const respaldo = new THREE.Mesh(new THREE.BoxGeometry(0.34, altoRespaldo, 0.06), tela);
  respaldo.position.set(0, altoAsiento + altoRespaldo / 2 - 0.02, 0.16);
  respaldo.rotation.x = -0.14;          /* reclinado, como se sienta uno */
  respaldo.castShadow = true; g.add(respaldo);

  return g;
}

/* ── el dibujo de la pantalla ─────────────────────────────────────────── */
function pintarPantalla(esc_, quien, color){
  const g = esc_.lienzo.getContext('2d');
  const W = 1024, H = 640;
  g.fillStyle = '#0C0714'; g.fillRect(0, 0, W, H);

  /* barra de título */
  g.fillStyle = '#1B1226'; g.fillRect(0, 0, W, 62);
  g.fillStyle = color;     g.fillRect(0, 60, W, 2);
  for(let i = 0; i < 3; i++){
    g.beginPath(); g.arc(34 + i*30, 31, 8, 0, Math.PI*2);
    g.fillStyle = ['#F0567F','#E8B33A','#3ECF8E'][i]; g.fill();
  }
  g.fillStyle = '#A090B4'; g.font = '600 24px ui-monospace, Menlo, monospace';
  g.fillText((quien.nombre || '').slice(0, 30), 140, 40);

  const t = quien.trabajo;
  if(!t){
    g.fillStyle = '#4A3167'; g.font = '600 30px ui-monospace, Menlo, monospace';
    g.fillText('en reposo', 44, 150);
    g.fillStyle = '#2A1C3D'; g.font = '22px ui-monospace, Menlo, monospace';
    g.fillText('sin nada en curso', 44, 196);
    esc_.textura.needsUpdate = true;
    return;
  }

  g.fillStyle = '#7B6B8D'; g.font = '600 19px ui-monospace, Menlo, monospace';
  g.fillText('AHORITA ESTÁ EN', 44, 118);

  /* El título se parte a mano: `fillText` no salta de renglón solo, y un
     encargo largo se salía de la pantalla sin que nadie se enterara. */
  g.fillStyle = '#E9E4E4'; g.font = '700 38px -apple-system, system-ui, sans-serif';
  let y = 168;
  for(const linea of partir(g, t.en || '', W - 88).slice(0, 2)){
    g.fillText(linea, 44, y); y += 46;
  }

  if(t.paso){
    g.fillStyle = color; g.font = '24px ui-monospace, Menlo, monospace';
    g.fillText(recortar(g, '› ' + t.paso, W - 88), 44, y + 12);
  }

  /* avance */
  if(t.total > 0){
    const by = 330, bw = W - 88, p = Math.max(0, Math.min(1, t.va / t.total));
    g.fillStyle = '#241834'; redondo(g, 44, by, bw, 14, 7); g.fill();
    g.fillStyle = color;     redondo(g, 44, by, Math.max(14, bw*p), 14, 7); g.fill();
    g.fillStyle = '#7B6B8D'; g.font = '20px ui-monospace, Menlo, monospace';
    g.fillText(`${t.va} de ${t.total}`, 44, by + 44);
  }

  /* el rastro: los últimos pasos, del más viejo al más nuevo */
  const pasos = (t.pasos || []).slice(-7);
  if(pasos.length){
    g.fillStyle = '#33224A'; g.fillRect(44, 396, W - 88, 1);
    g.font = '21px ui-monospace, Menlo, monospace';
    let py = 432;
    pasos.forEach((p, i) => {
      const ultimo = i === pasos.length - 1;
      g.fillStyle = ultimo ? '#C77BFF' : `rgba(123,107,141,${0.4 + i*0.07})`;
      g.fillText(recortar(g, (ultimo ? '▸ ' : '  ') + p, W - 88), 44, py);
      py += 29;
    });
  }
  esc_.textura.needsUpdate = true;
}

function partir(g, texto, ancho){
  const palabras = String(texto).split(/\s+/), lineas = []; let linea = '';
  for(const p of palabras){
    const intento = linea ? linea + ' ' + p : p;
    if(g.measureText(intento).width > ancho && linea){ lineas.push(linea); linea = p; }
    else linea = intento;
  }
  if(linea) lineas.push(linea);
  return lineas;
}
function recortar(g, texto, ancho){
  let t = String(texto);
  if(g.measureText(t).width <= ancho) return t;
  while(t.length > 4 && g.measureText(t + '…').width > ancho) t = t.slice(0, -1);
  return t + '…';
}
function redondo(g, x, y, w, h, r){
  g.beginPath(); g.moveTo(x+r, y);
  g.arcTo(x+w, y, x+w, y+h, r); g.arcTo(x+w, y+h, x, y+h, r);
  g.arcTo(x, y+h, x, y, r);     g.arcTo(x, y, x+w, y, r);
  g.closePath();
}

/* ══ LOS AGENTES ═════════════════════════════════════════════════════════ */
const cargador = new GLTFLoader();
let plantilla = null, animaciones = [];
const puestos = new Map();          /* id → { grupo, mezclador, acciones, … } */
let enFoco = null;
let radioActual = 0;          /* qué tan abierto quedó el semicírculo */

/* Qué animación toca según lo que esté pasando. Es el traductor entre el
   estado del trabajo y el cuerpo — y es lo que hace que se entienda de reojo,
   sin leer nada. */
function animacionDe(quien){
  if(quien.estado === 'topado' || quien.estado === 'ocupado') return 'No';
  if(quien.estado === 'fuera') return 'Death';
  if(Date.now() - (quien.visto || 0) > 5*60_000) return 'Idle';
  if(quien.trabajo){
    const t = (quien.trabajo.paso || quien.trabajo.en || '').toLowerCase();
    if(/\bprueb|test|verde|pasan\b/.test(t)) return 'ThumbsUp';
    if(/\bfall|error|roto|trueno\b/.test(t))  return 'No';
    if(/\bbusc|le(o|yendo)|revis\b/.test(t))  return 'Walking';
    return 'Sitting';
  }
  return 'Idle';
}

/* ══ TECLEAR Y MOVER EL RATÓN ══════════════════════════════════════════════
   Lo pidió Carlos: «dales animación de escribir y mover el mouse».

   ⚠ EL MODELO NO TRAE NINGUNA DE LAS DOS. Sus catorce clips son Dance, Death,
   Idle, Jump, No, Punch, Running, Sitting, Standing, ThumbsUp, Walking,
   WalkJump, Wave y Yes — se comprobó pidiéndoselos al propio modelo, no
   suponiendo. Así que teclear no se elige: se inventa.

   Cómo, sin salirse de lo que la casa acepta: se deja que `Sitting` siga
   corriendo —da la pose, la espalda, las piernas— y ENCIMA se le mueven a
   mano cuatro huesos de los brazos. El mezclador escribe la rotación en cada
   cuadro y nosotros la corregimos después, así que no pelean: uno pone la
   pose y el otro el temblor.

   Las dos manos NO hacen lo mismo, y ahí está todo el efecto:
     · la izquierda teclea — sube y baja rápido, en ráfagas con pausas, porque
       nadie teclea a ritmo de metrónomo;
     · la derecha lleva el ratón — deriva lento y ancho sobre la mesa.
   Si las dos hicieran lo mismo se ve un muñeco vibrando, no alguien
   trabajando. */
const HUESOS_TECLEO = { UpperArmL:1, LowerArmL:1, UpperArmR:1, LowerArmR:1 };

function moverBrazos(p, t){
  const b = p.brazos;
  if(!b || !b.LowerArmL) return;

  /* Sólo cuando de verdad está en algo. Un agente en reposo con las manos
     tecleando es una mentira que se ve a la primera. */
  const trabajando = !!(p.quien && p.quien.trabajo)
                  && p.quien.estado !== 'topado' && p.quien.estado !== 'fuera';

  /* Se guarda la pose que dejó el mezclador ANTES de tocarla, y se vuelve a
     ella al soltar. Sin esto, al dejar de trabajar los brazos se quedan
     doblados donde los dejamos y el robot parece descompuesto. */
  const suave = (hueso, dx, dy) => {
    hueso.rotation.x += dx;
    hueso.rotation.y += dy;
  };

  if(!trabajando) return;

  const f = t * 9 + p.fase;
  /* Las ráfagas: teclea un rato y para. `Math.max(0, sin)` da pausas de la
     mitad del ciclo, que es lo que hace que se lea como escribir y no como
     temblar. */
  const rafaga = Math.max(0, Math.sin(t * 1.3 + p.fase));
  const golpe  = Math.sin(f) * 0.075 * rafaga;
  const golpe2 = Math.sin(f * 1.17 + 1.1) * 0.065 * rafaga;

  suave(b.LowerArmL, golpe, 0);
  if(b.UpperArmL) suave(b.UpperArmL, golpe * 0.35, 0);
  suave(b.LowerArmR, golpe2 * 0.4, 0);

  /* El ratón: la derecha deriva despacio y ancho, en dos ejes distintos para
     que el recorrido no sea una recta. */
  if(b.UpperArmR){
    suave(b.UpperArmR,
          Math.sin(t * 0.55 + p.fase) * 0.05,
          Math.cos(t * 0.38 + p.fase) * 0.09);
  }
}

function ponerAgente(quien, indice, cuantos){
  if(!HAY3D) return null;
  const g = new THREE.Group();
  /* En semicírculo mirando al centro: así se ven todos desde una sola vista y
     nadie le da la espalda a la cámara de arranque. */
  const radio = cuantos <= 1 ? 0 : 2.3 + cuantos*0.55;
  radioActual = radio;
  /* El abanico abarca 153°, no 223°. Con el arco más abierto los de los
     extremos quedaban DETRÁS de la cámara en la vista amplia: se veía un
     cuarto de dos agentes cuando había cuatro. */
  const ang = cuantos <= 1 ? 0 : (-Math.PI*0.425) + (indice/(cuantos-1)) * Math.PI*0.85;
  g.position.set(Math.sin(ang)*radio, 0, Math.cos(ang)*radio);
  /* ── cómo está armado un puesto, que costó dos intentos ────────────────
     Con `rotation.y = ang`, el -z local apunta al centro del cuarto. Entonces:

        -z  ← el escritorio y su pantalla (hacia el centro)
         0  ← el robot, de espaldas a la cámara
        +z  ← la cámara, por fuera del círculo, mirando hacia adentro

     La primera vez le puse `ang + Math.PI` al puesto y `Math.PI` al escritorio,
     y la pantalla acabó apuntando para AFUERA: salía negra en la captura y yo
     creí que la textura no cargaba. No era la textura — le estaba viendo la
     espalda al monitor. */
  g.rotation.y = ang;

  const color = new THREE.Color(quien.color || '#AC27FF');
  const mesa = hacerEscritorio(color);
  mesa.grupo.position.set(0, 0, -1.05);   /* sin rotar: la pantalla mira a +z */
  g.add(mesa.grupo);

  const muñeco = plantilla ? clonarConHuesos(plantilla) : null;
  let mezclador = null; const acciones = {}, brazos = {};
  if(muñeco){
    /* La escala se MIDE, no se adivina — pero se mide sobre el ORIGINAL y una
       sola vez. Medirla sobre el clon daba 1.49 en vez de 4.79: `setFromObject`
       sobre una malla con huesos que todavía no entra a la escena devuelve la
       caja de la geometría en pose de amarre, no la del cuerpo armado. Con esa
       cuenta el robot salía de casi CINCO metros y la cámara le quedaba entre
       las piernas — se veía un cuarto vacío y yo creí que el clon había fallado. */
    muñeco.scale.setScalar(ALTO_AGENTE / ALTO_CRUDO);
    muñeco.position.set(0, 0, 0);
    muñeco.rotation.y = Math.PI;              /* de cara al escritorio */
    muñeco.traverse(o => {
      if(o.isMesh){
        o.castShadow = true;
        /* El robot viene gris. Se le tiñe con el color de la CUENTA, que es la
           misma señal que usa la mesa: morado es de Carlos, naranja de Luis.
           El material se clona porque si no, teñir a uno los tiñe a todos. */
        o.material = o.material.clone();
        if(o.material.color && o.material.color.getHex() > 0x333333){
          o.material.color.lerp(color, 0.62);
        }
        o.material.emissive = color.clone().multiplyScalar(0.06);
      }
    });
    g.add(muñeco);
    mezclador = new THREE.AnimationMixer(muñeco);
    for(const clip of animaciones) acciones[clip.name] = mezclador.clipAction(clip);
    /* Se apartan los huesos de los brazos: son los que se van a mover a mano
       para teclear. El modelo NO trae animación de teclear —sus catorce clips
       son Dance, Idle, Sitting, Wave y compañía—, así que o se inventa con
       huesos o no hay. Se guardan aquí y no se buscan cada cuadro: recorrer el
       esqueleto sesenta veces por segundo por cada agente es como se calienta
       un teléfono sin que se vea nada distinto. */
    for(const o of [muñeco]) o.traverse(x => {
      if(x.isBone && HUESOS_TECLEO[x.name]) brazos[x.name] = x;
    });
  }

  /* El aro del piso: dice de quién es el puesto aunque el robot esté de
     espaldas. */
  const aro = new THREE.Mesh(
    new THREE.RingGeometry(0.52, 0.62, 40),
    new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.5, side:THREE.DoubleSide }));
  aro.rotation.x = -Math.PI/2; aro.position.y = 0.01;
  g.add(aro);

  /* La silla va DETRÁS del robot (+z local, o sea del lado de la cámara),
     porque el robot mira al escritorio que está en -z. Puesta en el mismo
     sitio que él, se le encajaba en el cuerpo. */
  /* Debajo de la cadera, no detrás: 0.05 en z y el asiento a la altura que se
     midió. El respaldo queda del lado de la cámara, que es la espalda del
     robot — él mira al escritorio, en -z. */
  const silla = hacerSilla(color, ALTO_ASIENTO);
  silla.position.set(0, 0, 0.05);
  g.add(silla);

  const bocadillo = hacerBocadillo();
  g.add(bocadillo.sprite);

  escena.add(g);
  const puesto = { id:quien.id, grupo:g, mesa, mezclador, acciones, aro, silla,
                   bocadillo, brazos, reposo:null, fase: Math.random() * 6.28,
                   actual:null, quien, color };
  puestos.set(quien.id, puesto);
  cambiarAnimacion(puesto, animacionDe(quien));
  pintarPantalla(mesa, quien, '#' + color.getHexString());
  return puesto;
}

/* ══ EL BOCADILLO SOBRE LA CABEZA ══════════════════════════════════════════
   Lo pidió Carlos: «que pueda ver las burbujas de texto de cada integrante
   sobre su cabeza en ese entorno 3D para que esté bien chingón».

   Va como Sprite y no como plano: un Sprite SIEMPRE mira a la cámara sola,
   así que el texto se lee desde cualquier ángulo sin una línea de código que
   lo gire. Un plano habría que orientarlo cuadro por cuadro y se vería de
   canto justo cuando uno rodea el cuarto, que es cuando más se está mirando.

   El lienzo se dibuja al DOBLE de lo que se ve y luego se escala: si se
   dibuja al tamaño final, el texto sale borroso en cuanto uno se acerca —
   que es exactamente lo que uno hace cuando quiere leerlo. */
const BOCADILLO_W = 720, BOCADILLO_H = 300;

function hacerBocadillo(){
  const lienzo = document.createElement('canvas');
  lienzo.width = BOCADILLO_W; lienzo.height = BOCADILLO_H;
  const textura = new THREE.CanvasTexture(lienzo);
  textura.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: textura, transparent:true, depthTest:false,
  }));
  /* `depthTest:false` a propósito: sin eso el bocadillo se mete DENTRO del
     escritorio de quien está adelante y se ve cortado por la mitad. Lo que se
     dice siempre va encima de los muebles. */
  sprite.renderOrder = 10;
  sprite.scale.set(1.5, 0.625, 1);
  sprite.position.set(0, ALTO_AGENTE + 0.62, 0);
  sprite.visible = false;
  return { sprite, lienzo, textura, dice:null };
}

/* Cuánto hace que se dijo, en cristiano. Un bocadillo sin esto miente: se ve
   igual de fresco un mensaje de hace diez segundos que uno de anteayer. */
function haceCuanto(ts){
  const min = Math.round((Date.now() - ts) / 60000);
  if(min < 1)  return 'ahorita';
  if(min < 60) return `hace ${min} min`;
  const h = Math.round(min/60);
  if(h < 24)   return `hace ${h} h`;
  return `hace ${Math.round(h/24)} d`;
}

function pintarBocadillo(b, texto, color, ts){
  const g = b.lienzo.getContext('2d');
  g.clearRect(0, 0, BOCADILLO_W, BOCADILLO_H);

  g.font = '600 30px -apple-system, system-ui, sans-serif';
  const lineas = partir(g, texto, BOCADILLO_W - 84).slice(0, 4);
  /* Si no cabe, se corta el ÚLTIMO renglón con puntos suspensivos en vez de
     tragarse el resto sin avisar: un bocadillo que miente sobre lo que se
     dijo es peor que uno corto. */
  if(partir(g, texto, BOCADILLO_W - 84).length > 4)
    lineas[3] = recortar(g, lineas[3], BOCADILLO_W - 120) ;
  const alto = 92 + lineas.length * 40;
  const y0 = BOCADILLO_H - alto - 34;

  /* la caja */
  g.fillStyle = 'rgba(12,7,20,.93)';
  redondo(g, 12, y0, BOCADILLO_W - 24, alto, 26); g.fill();
  g.strokeStyle = color; g.lineWidth = 4;
  redondo(g, 12, y0, BOCADILLO_W - 24, alto, 26); g.stroke();

  /* el piquito hacia la cabeza */
  g.beginPath();
  g.moveTo(BOCADILLO_W/2 - 20, y0 + alto - 2);
  g.lineTo(BOCADILLO_W/2, y0 + alto + 28);
  g.lineTo(BOCADILLO_W/2 + 20, y0 + alto - 2);
  g.closePath();
  g.fillStyle = 'rgba(12,7,20,.93)'; g.fill();
  g.strokeStyle = color; g.lineWidth = 4; g.stroke();

  /* cuándo */
  g.fillStyle = color; g.font = '600 20px ui-monospace, Menlo, monospace';
  g.fillText(haceCuanto(ts), 42, y0 + 40);

  /* lo dicho */
  g.fillStyle = '#E9E4E4'; g.font = '600 30px -apple-system, system-ui, sans-serif';
  let y = y0 + 82;
  for(const l of lineas){ g.fillText(l, 42, y); y += 40; }

  b.textura.needsUpdate = true;
  b.sprite.visible = true;
}

function cambiarAnimacion(p, nombre){
  if(!p.mezclador || !p.acciones[nombre] || p.actual === nombre) return;
  const nueva = p.acciones[nombre];
  if(p.actual && p.acciones[p.actual]) p.acciones[p.actual].fadeOut(0.35);
  nueva.reset().fadeIn(0.35).play();
  p.actual = nombre;
}

/* ══ LOS DATOS ═══════════════════════════════════════════════════════════ */
let gente = {};
/* Lo último que dijo cada quien, que es lo que va en su bocadillo. */
let ultimoDicho = {};

/* Del hilo completo, el último mensaje DE VERDAD de cada quien. Se saltan los
   de sistema («entró», «salió») porque poner «Carlos entró» flotando sobre la
   cabeza de Carlos no le dice nada a nadie. */
function deLoDicho(hilo){
  const ult = {};
  for(const e of hilo){
    if(!e || !e.de || !e.de.id) continue;
    if(e.tipo === 'sistema') continue;
    const texto = (e.texto || '').trim();
    if(!texto) continue;
    const antes = ult[e.de.id];
    if(!antes || e.ts >= antes.ts) ult[e.de.id] = { texto, ts:e.ts, tipo:e.tipo };
  }
  return ult;
}

/* Cuánto tiempo se queda una burbuja arriba. Media hora: lo bastante para que
   al abrir el taller se vea de qué se está hablando, y lo bastante poco para
   que un cuarto vacío no siga con los globos de anoche puestos. */
const DURA_BOCADILLO = 30 * 60_000;

async function traer(){
  if(DEMO){ ultimoDicho = dichoDemo(); return demo(); }
  try{
    const r = await fetch(`${SERVIDOR}/api/sala/${SALA}/hilo`,
      { headers: LLAVE ? { 'X-Llave': LLAVE } : {} });
    if(!r.ok) throw new Error(`el servidor contestó ${r.status}`);
    const d = await r.json();
    $('aviso').textContent = '';
    /* ⚠ El hilo YA VENÍA en esta misma respuesta y se estaba tirando. No hizo
       falta una petición nueva ni un endpoint nuevo para las burbujas: hacía
       falta dejar de tirar la mitad de lo que ya se pedía. */
    ultimoDicho = deLoDicho(d.hilo || []);
    return d.gente || {};
  }catch(e){
    $('aviso').textContent = `Sin conexión con la sala · ${e.message}`;
    return gente;                       /* se queda con lo último bueno */
  }
}

/* En demostración se inventa también lo dicho: si no, el taller de ejemplo

function dichoDemo(){
  const t = Date.now();
  return {
    'cl-1':{ texto:'Ya quedó el arreglo de las deudas. Falta que alguien lo pruebe con un pedido de verdad.', ts:t-90_000 },
    'cl-2':{ texto:'Encontré 31 defectos en la plantilla. Los tengo ordenados por qué tan feo se ve.', ts:t-260_000 },
    'cl-l':{ texto:'Voy con la privacidad de avisos/. Hay nombres reales publicados.', ts:t-40_000 },
    'gem':{ texto:'Reviso el video cuando terminen.', ts:t-600_000 },
  };
}

function refrescar(nueva){
  gente = nueva;
  const lista = Object.values(gente);

  /* quitar a los que ya no están */
  for(const [id, p] of puestos){
    if(!gente[id]){ escena.remove(p.grupo); puestos.delete(id); }
  }
  /* poner y actualizar */
  lista.forEach((quien, i) => {
    let p = puestos.get(quien.id);
    if(!p) p = ponerAgente(quien, i, lista.length);
    if(!p) return;                       /* sin 3D sólo se pinta el panel */
    p.quien = quien;
    cambiarAnimacion(p, animacionDe(quien));
    pintarPantalla(p.mesa, quien, '#' + p.color.getHexString());
    /* la pantalla apagada cuando no hay nada: se nota de lejos quién trabaja */
    p.mesa.brillo.intensity = quien.trabajo ? 1.5 : 0.35;
    p.aro.material.opacity  = quien.trabajo ? 0.72 : 0.28;

    /* ── su burbuja ── */
    const dijo = ultimoDicho[quien.id];
    if(dijo && Date.now() - dijo.ts < DURA_BOCADILLO){
      /* Se vuelve a dibujar sólo si CAMBIÓ lo dicho. Repintar un lienzo de
         720×300 sesenta veces por segundo para escribir lo mismo es como se
         calienta un teléfono sin que nada se vea distinto. */
      if(p.bocadillo.dice !== dijo.ts){
        pintarBocadillo(p.bocadillo, dijo.texto,
                        '#' + p.color.getHexString(), dijo.ts);
        p.bocadillo.dice = dijo.ts;
      }
    }else{
      p.bocadillo.sprite.visible = false;
      p.bocadillo.dice = null;
    }
  });
  pintarPanel(lista);
  if(!enFoco && lista.length) enFocar(lista[0].id);
}

/* ── el panel de HTML, que es el que se lee ───────────────────────────── */
function pintarPanel(lista){
  if(!lista.length){
    $('panel').innerHTML = '<div class="nadie">El taller está vacío. Nadie ha entrado a la sala.</div>';
    return;
  }
  $('panel').innerHTML = lista.map(q => {
    const t = q.trabajo;
    const callado = Date.now() - (q.visto || 0) > 5*60_000;
    const clase = (q.estado === 'topado' || q.estado === 'ocupado') ? 'topado'
                : t ? 'trabaja' : callado ? 'dormido' : '';
    const dice  = (q.estado === 'topado') ? 'se topó' : t ? 'trabajando'
                : callado ? 'sin señal' : 'en reposo';
    const pct = t && t.total > 0 ? Math.round(100 * t.va / t.total) : 0;
    return `<div class="ficha ${q.id === enFoco ? 'eldelfoco' : ''}" data-ver="${esc(q.id)}">
      <div class="cab">
        <span class="pastilla" style="background:${esc(q.color || '#AC27FF')}"></span>
        <span class="nom">${esc(q.nombre)}</span>
        <span class="motor">${esc(q.motor || (q.tipo === 'humano' ? 'persona' : 'agente'))}</span>
        <span class="estado ${clase}">${dice}</span>
      </div>
      ${t ? `<div class="enque">${esc(t.en)}</div>
        ${t.paso ? `<div class="paso">› ${esc(t.paso)}</div>` : ''}
        ${t.total > 0 ? `<div class="barrita"><i style="width:${pct}%"></i></div>` : ''}
        ${(t.pasos||[]).length ? `<div class="rastro">${
          t.pasos.slice(-4).map(p => `<div>${esc(p)}</div>`).join('')}</div>` : ''}`
        : `<div class="paso" style="color:var(--muy-tenue)">${
            q.reanuda ? 'puede seguir a las ' + new Date(q.reanuda)
              .toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})
            : 'sin nada en curso'}</div>`}
    </div>`;
  }).join('');
}

$('panel').addEventListener('click', (e) => {
  const f = e.target.closest('[data-ver]');
  if(f) enFocar(f.dataset.ver);
});

/* ── la cámara ────────────────────────────────────────────────────────── */
let siguiendo = true;
function enFocar(id){
  enFoco = id;
  const p = puestos.get(id);
  if(!p) return;
  pintarPanel(Object.values(gente));
  if(!siguiendo || !HAY3D) return;
  /* Se mira POR ENCIMA DEL HOMBRO: el robot de espaldas en primer plano y su
     pantalla enfrente. De frente al robot se ve más bonito el muñeco y NO se
     ve el monitor — que es a lo que se entra aquí. Se probó de las dos formas.

     La altura y la distancia salen de ALTO_AGENTE, no de números sueltos: si
     el muñeco cambia de tamaño, el encuadre se ajusta solo. */
  const v = new THREE.Vector3(0.82, ALTO_AGENTE * 1.32, 2.95)
              .applyQuaternion(p.grupo.quaternion);
  destino.copy(p.grupo.position).add(v);
  mirando.copy(p.grupo.position).add(new THREE.Vector3(-0.1, ALTO_AGENTE * 0.80, -1.0)
    .applyQuaternion(p.grupo.quaternion));
}
const destino = new THREE.Vector3(0, 2.6, 7.2);
const mirando = new THREE.Vector3(0, 1.1, 0);

function marcar(id, prendido){
  const b = $(id); if(!b) return;
  b.setAttribute('aria-pressed', String(!!prendido));
  b.classList.toggle('on', !!prendido);
}
$('bSeguir').addEventListener('click', () => {
  siguiendo = !siguiendo;
  marcar('bSeguir', siguiendo);
  if(siguiendo && enFoco) enFocar(enFoco);
});
marcar('bSeguir', true);

/* El panel lo maneja el ojo de abajo, que tiene TRES estados —completo,
   plegado, oculto— y no dos. Aquí vivía un segundo interruptor de dos estados
   sobre el mismo panel, y los dos se pisaban: el ojo lo dejaba oculto y este
   otro creía que estaba completo.

   Peor todavía: una copia de este mismo bloque estaba pegada DENTRO del
   `else` del botón de vista. O sea que cada vez que apagabas la vista amplia
   se registraba OTRO escuchador sobre el mismo botón, y a partir de ahí un
   clic plegaba y desplegaba en el mismo instante. Desde fuera se ve idéntico a
   un botón muerto, que es como se reportan estas cosas. */

let vistaAmplia = false;
$('bVista').addEventListener('click', () => {
  vistaAmplia = !vistaAmplia;
  marcar('bVista', vistaAmplia);
  if(vistaAmplia){
    siguiendo = false; marcar('bSeguir', false);
    /* La distancia sale del radio del semicírculo, no de un número fijo: con
       dos agentes el cuarto es chico y con ocho es grande, y una cámara fija
       o los deja de estampilla o se mete entre los escritorios. */
    destino.set(0, radioActual * 1.45 + 3.2, radioActual * 2.4 + 5.5);
    mirando.set(0, 0.7, 0);
  }else if(enFoco){
    siguiendo = true; marcar('bSeguir', true); enFocar(enFoco);
  }
});

/* Una manija para poder MEDIR la escena desde fuera. No es depuración
   olvidada: sin esto, revisar el taller es mirar una foto y opinar, que es
   justo lo que la casa no acepta como verificación. */
window.__taller = { escena, camara, puestos, get gente(){ return gente; } };

/* ── el bucle ─────────────────────────────────────────────────────────── */
/* ── los tres estados del panel ────────────────────────────────────────────
   completo → plegado → oculto → completo. Tres y no dos porque cada uno
   contesta algo distinto: completo es «qué está haciendo cada quien»,
   plegado es «qué está haciendo el que estoy mirando», y oculto es «déjame
   ver el cuarto». Lo tercero es lo que faltaba. */
const ESTADOS_PANEL = ['completo', 'plegado', 'oculto'];
function ponerPanel(cual){
  const el = document.getElementById('panel');
  if(!el) return;
  el.classList.toggle('plegado', cual === 'plegado');
  el.classList.toggle('oculto',  cual === 'oculto');
  const b = document.getElementById('bPanel');
  if(b) b.classList.toggle('on', cual === 'completo');
  const ojo = document.getElementById('bOjo');
  if(ojo) ojo.textContent = cual === 'oculto' ? '🚫' : cual === 'plegado' ? '👁' : '👁';
  try{ localStorage.setItem('taller-panel', cual); }catch(e){}
}
function cicloPanel(){
  const el = document.getElementById('panel');
  const hoy = el.classList.contains('oculto') ? 'oculto'
            : el.classList.contains('plegado') ? 'plegado' : 'completo';
  ponerPanel(ESTADOS_PANEL[(ESTADOS_PANEL.indexOf(hoy) + 1) % 3]);
}
document.getElementById('bOjo').addEventListener('click', cicloPanel);

/* Se recuerda cómo lo dejaste: si lo escondiste una vez es porque querías ver
   el cuarto, y volver a abrirlo en cada visita es hacerte pelear con la
   herramienta cada vez. */
(function panelRecordado(){
  let g = null;
  try{ g = localStorage.getItem('taller-panel'); }catch(e){}
  if(g && ESTADOS_PANEL.includes(g)) ponerPanel(g);
})();

if(DENTRO){
  const barra = document.querySelector('.barra');
  if(barra) barra.hidden = true;
  document.body.classList.add('dentro');
  /* ⚠ Y EL PANEL ARRANCA PLEGADO. Sin esto queda una trampa: el panel tapaba
     dos tercios del cuarto y el botón que lo cierra vive en la barra que
     acabamos de esconder — o sea, algo que estorba y no se puede quitar.
     Adentro el panel además sobra: lo que dice ya está en el chat, a una
     pestaña de distancia. Se despliega tocándolo. */
  /* Empotrado arranca OCULTO —no plegado— salvo que ya hayas elegido otra
     cosa: lo que dice el panel está en el chat, a una pestaña de distancia, y
     lo que no está en ningún otro lado es el cuarto. */
  let elegido = null;
  try{ elegido = localStorage.getItem('taller-panel'); }catch(e){}
  ponerPanel(elegido && ESTADOS_PANEL.includes(elegido) ? elegido : 'oculto');
}

const reloj = new THREE.Clock();
function cuadro(){
  if(!HAY3D) return;                    /* sin 3D no hay nada que pintar */
  requestAnimationFrame(cuadro);
  const dt = reloj.getDelta();
  const t = reloj.elapsedTime;
  for(const p of puestos.values()){
    if(p.mezclador) p.mezclador.update(dt);
    /* ⚠ DESPUÉS del mezclador, nunca antes: el mezclador SOBREESCRIBE la
       rotación de los huesos que anima, así que cualquier ajuste hecho antes
       se borra en el mismo cuadro. Se probó al revés primero y no se movía
       nada — y no había error que lo dijera. */
    moverBrazos(p, t);
  }
  if(siguiendo || vistaAmplia){
    camara.position.lerp(destino, 0.045);
    mando.target.lerp(mirando, 0.045);
  }
  mando.update();
  pintor.render(escena, camara);
}

addEventListener('resize', () => {
  if(!HAY3D) return;
  acomodarCamara();
  pintor.setSize(innerWidth, innerHeight);
});

/* ── arranque ─────────────────────────────────────────────────────────── */
async function arrancar(){
  /* ⚠ SIN ESTE try/catch, cualquier tropiezo aquí adentro desaparece: se llama
     desde el callback asíncrono del cargador de modelos, y una promesa rota
     ahí no llega a la consola. El síntoma es el peor posible — un cuarto
     NEGRO, sin error, sin aviso y sin panel — y uno se pone a buscar en el
     3D cuando el problema puede estar en los datos.
     Costó una tarde: el taller empotrado salía en negro y todo lo medible
     (canvas, WebGL, el modelo, el <iframe>) daba bien. */
  try{
    refrescar(await traer());
    if(HAY3D) cuadro();
    setInterval(async () => {
      try{ refrescar(await traer()); }
      catch(e){ $('aviso').textContent = `El taller se atoró: ${e.message}`; }
    }, 2000);
  }catch(e){
    console.error('el taller no arrancó:', e);
    $('aviso').textContent = `El taller no arrancó: ${e.message}`;
  }
}

if(!HAY3D){
  $('cargando').classList.add('ido');
  $('aviso').textContent = 'Este navegador no trae 3D · el taller funciona igual, sin cuarto';
  arrancar();
}else cargador.load('./modelo/RobotExpressive.glb', async (gltf) => {
  plantilla = gltf.scene;
  animaciones = gltf.animations;
  ALTO_CRUDO = new THREE.Box3().setFromObject(plantilla)
                 .getSize(new THREE.Vector3()).y || 1;
  $('cargando').classList.add('ido');
  await arrancar();
}, undefined, (e) => {
  /* Si el modelo no carga, el taller sigue sirviendo: escritorios, pantallas y
     panel. Quedarse en «cargando…» para siempre sería lo peor de los dos
     mundos — ni muñeco ni información. */
  console.warn('el robot no cargó:', e);
  $('cargando').classList.add('ido');
  $('aviso').textContent = 'El modelo 3D no cargó · el taller sigue funcionando sin muñeco';
  arrancar();
});

/* A dónde vuelve: de donde vino, y si no se sabe, al tablero. No es
   `history.back()` porque desde La Sala esto abre en pestaña nueva y ahí no
   hay historia. */
(function elVolver(){
  const b = document.getElementById('volver');
  if(!b) return;
  try{
    const r = document.referrer;
    if(r && new URL(r).origin === location.origin
         && !new URL(r).pathname.startsWith('/entorno')){
      b.href = r;
      if(/\/sala\//.test(new URL(r).pathname)) b.title = 'Volver a La Sala';
    }
  }catch(e){}
})();
</script>
