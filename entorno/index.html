/* ── LOS NAVEGADORES, CON SU NOMBRE ────────────────────────────────────────
   Carlos: «igual tú pónselos; recuerda que no es un proyecto que nos deje
   dinero así que no importa, y tampoco es un robo de identidad — muchos juegos
   que sí se venden lo hacen de hecho».

   Es su repositorio y su llamada, y el argumento es correcto: nombrar un
   producto para decir CUÁL es se llama referencia por nombre, y los juegos que
   se venden lo hacen todo el tiempo. Antes estaban sin nombre y el chiste se
   quedaba a medias: «un navegador» no da risa, «Opera GX» sí.

   Lo que SIGUE sin hacerse, y no por miedo sino porque no hay de dónde: aquí
   no se descarga ni un archivo de nadie. Todo son formas dibujadas a mano con
   canvas — el anillo, la cuña, los cuatro colores—, aproximaciones de memoria
   a 1024×640 que se ven a tres metros dentro de una escena en 3D. No hay
   captura, ni logo bajado, ni tipografía ajena.

   Cada pantalla de navegador escoge uno según su número, así que en el cuarto
   se ven los cuatro distintos y no cuatro veces el mismo. */
const NAVEGADORES = [
  { id:'operagx', nombre:'Opera GX', tinte:'#FF1B2D', barra:'#12080C', casa:'#1E0F14' },
  { id:'brave',   nombre:'Brave',    tinte:'#FB542B', barra:'#1B1B1F', casa:'#26262C' },
  { id:'edge',    nombre:'Edge',     tinte:'#0F7FD4', barra:'#1A1D21', casa:'#24282D' },
  { id:'chrome',  nombre:'Chrome',   tinte:'#4285F4', barra:'#202124', casa:'#292A2D' },
];

/* El emblema de cada uno, dibujado a mano. Son cuatro figuras de trazo, no
   copias: lo que hace que se reconozcan a esta distancia es la FORMA general
   —un anillo cortado, una cuña, una media luna, un círculo de cuatro colores—
   y no el detalle, que a 26 px no existe. */
function emblemaNavegador(g, x, y, r, cual){
  g.save();
  if(cual === 'operagx'){
    g.strokeStyle = '#FF1B2D'; g.lineWidth = r * 0.42;
    g.beginPath(); g.arc(x, y, r * 0.66, Math.PI * 0.30, Math.PI * 1.70); g.stroke();
    g.fillStyle = '#FF1B2D';
    g.beginPath(); g.moveTo(x + r*0.30, y - r*0.86);
    g.lineTo(x + r*1.00, y); g.lineTo(x + r*0.30, y + r*0.86); g.closePath(); g.fill();
  } else if(cual === 'brave'){
    g.fillStyle = '#FB542B';
    g.beginPath(); g.moveTo(x, y - r);
    g.lineTo(x + r*0.86, y - r*0.34); g.lineTo(x + r*0.52, y + r);
    g.lineTo(x - r*0.52, y + r); g.lineTo(x - r*0.86, y - r*0.34); g.closePath(); g.fill();
    g.fillStyle = '#FFB01F';
    g.beginPath(); g.moveTo(x, y - r*0.42);
    g.lineTo(x + r*0.34, y + r*0.30); g.lineTo(x - r*0.34, y + r*0.30); g.closePath(); g.fill();
  } else if(cual === 'edge'){
    g.strokeStyle = '#0F7FD4'; g.lineWidth = r * 0.46;
    g.beginPath(); g.arc(x, y, r * 0.66, Math.PI * 0.62, Math.PI * 1.95); g.stroke();
    g.strokeStyle = '#3DD8B0'; g.lineWidth = r * 0.34;
    g.beginPath(); g.arc(x, y, r * 0.66, Math.PI * 1.95, Math.PI * 2.30); g.stroke();
  } else {
    /* Cuatro cuartos de color y un ojo azul en medio. */
    const tonos = ['#EA4335', '#FBBC05', '#34A853'];
    for(let i = 0; i < 3; i++){
      g.fillStyle = tonos[i];
      g.beginPath(); g.moveTo(x, y);
      g.arc(x, y, r, (-0.5 + i * 0.667) * Math.PI, (-0.5 + (i+1) * 0.667) * Math.PI);
      g.closePath(); g.fill();
    }
    g.fillStyle = '#4285F4';
    g.beginPath(); g.arc(x, y, r * 0.46, 0, Math.PI*2); g.fill();
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(x, y, r * 0.30, 0, Math.PI*2); g.fill();
    g.fillStyle = '#4285F4';
    g.beginPath(); g.arc(x, y, r * 0.22, 0, Math.PI*2); g.fill();
  }
  g.restore();
}

/* ── el marco del navegador ────────────────────────────────────────────── */
function marcoNavegador(g, W, color, pestanas, activa, direccion, nav){
  const n = nav || NAVEGADORES[0];
  g.fillStyle = n.barra; g.fillRect(0, 0, W, 106);
  for(let i = 0; i < 3; i++){
    g.beginPath(); g.arc(30 + i*26, 26, 7, 0, Math.PI*2);
    g.fillStyle = ['#F0567F','#E8B33A','#3ECF8E'][i]; g.fill();
  }
  /* pestañas */
  let x = 118;
  g.font = '19px ui-monospace, Menlo, monospace';
  pestanas.forEach((p, i) => {
    const an = Math.min(230, g.measureText(p).width + 44);
    const viva = i === activa;
    g.fillStyle = viva ? n.casa : 'rgba(0,0,0,.30)';
    redondo(g, x, 8, an, 38, 9); g.fill();
    if(viva){ g.fillStyle = n.tinte; g.fillRect(x + 9, 8, an - 18, 2.5); }
    g.fillStyle = viva ? '#E9E4E4' : '#7B6B8D';
    g.fillText(recortar(g, p, an - 30), x + 15, 33);
    x += an + 6;
  });
  /* la barra de dirección, con el emblema del navegador a la izquierda */
  g.fillStyle = 'rgba(0,0,0,.42)'; redondo(g, 26, 58, W - 52, 38, 19); g.fill();
  g.strokeStyle = n.casa; g.lineWidth = 1.5; g.stroke();
  emblemaNavegador(g, 46, 77, 11, n.id);
  g.fillStyle = '#3ECF8E'; g.font = '15px ui-monospace, Menlo, monospace';
  g.fillText('🔒', 66, 83);
  g.fillStyle = '#A090B4'; g.font = '19px ui-monospace, Menlo, monospace';
  g.fillText(recortar(g, direccion, W - 190), 92, 84);
  /* y su nombre en la esquina, que es lo que hace el chiste */
  g.fillStyle = n.tinte; g.font = '700 17px -apple-system, system-ui, sans-serif';
  const anNombre = g.measureText(n.nombre).width;
  g.fillText(n.nombre, W - anNombre - 26, 84);
}

/* ── búsqueda ──────────────────────────────────────────────────────────── */
/* Google, con su nombre y sus colores. La página va en BLANCO y no en oscuro
   a propósito: es lo que la hace reconocible de un vistazo dentro de un cuarto
   que es todo morado. */
function pantallaBusqueda(g, W, H, color, n){
  const b = BUSQUEDAS[n % BUSQUEDAS.length];
  const nav = NAVEGADORES[n % NAVEGADORES.length];
  marcoNavegador(g, W, color, ['Google', 'La Sala', 'GitHub'], 0,
                 'google.com/search?q=' + encodeURIComponent(b.q).slice(0, 48), nav);
  g.fillStyle = '#FFFFFF'; g.fillRect(0, 106, W, H - 106);

  /* El logotipo, letra por letra con sus colores. Dibujado con la tipografía
     del sistema: lo que se reconoce es la secuencia de colores, no la fuente. */
  const letras = [['G','#4285F4'],['o','#EA4335'],['o','#FBBC05'],
                  ['g','#4285F4'],['l','#34A853'],['e','#EA4335']];
  g.font = '700 40px -apple-system, system-ui, Arial, sans-serif';
  let lx = 48;
  for(const [c, tono] of letras){ g.fillStyle = tono; g.fillText(c, lx, 172);
                                  lx += g.measureText(c).width; }

  /* la caja de búsqueda, con el cursor parpadeando al final */
  g.fillStyle = '#FFFFFF'; redondo(g, 48, 196, W - 96, 58, 29); g.fill();
  g.strokeStyle = '#DFE1E5'; g.lineWidth = 1.5; g.stroke();
  g.fillStyle = '#202124'; g.font = '25px -apple-system, system-ui, Arial, sans-serif';
  const q = recortar(g, b.q, W - 230);
  g.fillText(q, 90, 233);
  g.fillStyle = '#4285F4'; g.fillRect(100 + g.measureText(q).width, 212, 2, 26);

  g.fillStyle = '#70757A'; g.font = '17px -apple-system, system-ui, Arial, sans-serif';
  g.fillText('Cerca de 4,120,000 resultados (0.32 segundos)', 50, 290);

  let y = 340;
  for(const r of b.res){
    g.fillStyle = '#202124'; g.font = '15px -apple-system, system-ui, Arial, sans-serif';
    g.fillText('mazi.mx › resultados › ' + (r.split(' ')[0] || '').toLowerCase(), 50, y - 22);
    g.fillStyle = '#1A0DAB'; g.font = '25px -apple-system, system-ui, Arial, sans-serif';
    g.fillText(recortar(g, r, W - 100), 50, y);
    g.fillStyle = '#4D5156'; g.font = '17px -apple-system, system-ui, Arial, sans-serif';
    g.fillText('Lo que estabas buscando, más o menos, aproximadamente…', 50, y + 28);
    y += 96;
  }
}

/* ── un video ──────────────────────────────────────────────────────────── */
/* YouTube. El botón rojo redondeado con el triángulo blanco es lo que lo dice
   todo; el resto —el título grueso, el canal, las vistas— es la forma. */
function pantallaVideo(g, W, H, color, n){
  const v = VIDEOS[n % VIDEOS.length];
  const nav = NAVEGADORES[(n + 2) % NAVEGADORES.length];
  marcoNavegador(g, W, color, ['YouTube', 'Google'], 0,
                 'youtube.com/watch?v=' + (n * 7 + 31) + 'aQxKmZ', nav);
  g.fillStyle = '#0F0F0F'; g.fillRect(0, 106, W, H - 106);

  /* el logotipo */
  g.fillStyle = '#FF0000'; redondo(g, 44, 122, 44, 31, 8); g.fill();
  g.fillStyle = '#FFFFFF';
  g.beginPath(); g.moveTo(60, 130); g.lineTo(76, 137.5); g.lineTo(60, 145); g.closePath(); g.fill();
  g.fillStyle = '#FFFFFF'; g.font = '700 25px -apple-system, system-ui, Arial, sans-serif';
  g.fillText('YouTube', 96, 147);

  /* el reproductor. El «fotograma» es un degradado con una silueta: a esta
     distancia una silueta se lee y un dibujo detallado no. */
  const px = 44, py = 170, pw = W - 88, ph = 268;
  const cielo = g.createLinearGradient(0, py, 0, py + ph);
  cielo.addColorStop(0, '#2A1B4C'); cielo.addColorStop(1, '#0E1A2C');
  g.fillStyle = cielo; g.fillRect(px, py, pw, ph);
  g.fillStyle = '#F0A860';
  g.beginPath(); g.arc(px + pw * 0.72, py + 84, 34, 0, Math.PI*2); g.fill();
  g.fillStyle = '#1A1030';
  g.beginPath(); g.moveTo(px, py + ph);
  g.lineTo(px + pw*0.28, py + 130); g.lineTo(px + pw*0.52, py + ph); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(px + pw*0.34, py + ph);
  g.lineTo(px + pw*0.66, py + 104); g.lineTo(px + pw, py + ph); g.closePath(); g.fill();

  /* los mandos, con la barra roja */
  g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(px, py + ph - 44, pw, 44);
  g.fillStyle = '#FFFFFF';
  g.fillRect(px + 18, py + ph - 32, 5, 20); g.fillRect(px + 29, py + ph - 32, 5, 20);
  const avance = 0.18 + ((n * 37) % 60) / 100;
  g.fillStyle = 'rgba(255,255,255,.28)'; g.fillRect(px + 56, py + ph - 24, pw - 148, 4);
  g.fillStyle = '#FF0000'; g.fillRect(px + 56, py + ph - 24, (pw - 148) * avance, 4);
  g.beginPath(); g.arc(px + 56 + (pw - 148) * avance, py + ph - 22, 8, 0, Math.PI*2); g.fill();
  g.fillStyle = '#DDDDDD'; g.font = '16px -apple-system, system-ui, Arial, sans-serif';
  g.fillText(v.dura, px + pw - 76, py + ph - 17);

  g.fillStyle = '#F1F1F1'; g.font = '700 27px -apple-system, system-ui, Arial, sans-serif';
  let y = py + ph + 44;
  for(const linea of partir(g, v.t, pw - 190).slice(0, 2)){ g.fillText(linea, px, y); y += 34; }
  g.fillStyle = '#AAAAAA'; g.font = '18px -apple-system, system-ui, Arial, sans-serif';
  g.fillText(v.canal + ' · ' + (120 + n * 913) + ' vistas · hace un rato', px, y + 8);
  /* el botón de suscribirse, que es lo último que hace falta para que se lea */
  g.fillStyle = '#FFFFFF'; redondo(g, W - 196, py + ph + 22, 152, 40, 20); g.fill();
  g.fillStyle = '#0F0F0F'; g.font = '700 18px -apple-system, system-ui, Arial, sans-serif';
  g.fillText('Suscribirse', W - 176, py + ph + 48);
}

/* ── imágenes de bichos ────────────────────────────────────────────────── */
/* Dibujados a bloques a propósito: son de 190 px dentro de un lienzo que se
   ve a tres metros en 3D. Un dibujo detallado ahí es trabajo que nadie ve. */
function bicho(g, x, y, w, h, cual){
  g.save();
  g.beginPath(); g.rect(x, y, w, h); g.clip();
  const cx = x + w/2, cy = y + h/2;
  if(cual === 'paloma'){
    g.fillStyle = '#8FA8C8';                                   /* cuerpo */
    g.beginPath(); g.ellipse(cx, cy + 10, w*0.30, h*0.22, -0.15, 0, Math.PI*2); g.fill();
    g.fillStyle = '#B9CBE4';                                   /* ala */
    g.beginPath(); g.ellipse(cx + 6, cy + 4, w*0.20, h*0.12, -0.5, 0, Math.PI*2); g.fill();
    g.fillStyle = '#8FA8C8';                                   /* cabeza */
    g.beginPath(); g.arc(cx - w*0.26, cy - h*0.14, w*0.11, 0, Math.PI*2); g.fill();
    g.fillStyle = '#E8B33A';                                   /* pico */
    g.beginPath(); g.moveTo(cx - w*0.37, cy - h*0.14);
    g.lineTo(cx - w*0.46, cy - h*0.10); g.lineTo(cx - w*0.36, cy - h*0.08); g.fill();
    g.fillStyle = '#1A1030';
    g.beginPath(); g.arc(cx - w*0.29, cy - h*0.17, 3.5, 0, Math.PI*2); g.fill();
  } else if(cual === 'oso'){
    g.fillStyle = '#7A5230';
    g.beginPath(); g.arc(cx - w*0.20, cy - h*0.24, w*0.09, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc(cx + w*0.20, cy - h*0.24, w*0.09, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc(cx, cy, w*0.30, 0, Math.PI*2); g.fill();
    g.fillStyle = '#C89A64';
    g.beginPath(); g.ellipse(cx, cy + h*0.12, w*0.15, h*0.11, 0, 0, Math.PI*2); g.fill();
    g.fillStyle = '#1A1030';
    g.beginPath(); g.arc(cx - w*0.11, cy - h*0.06, 4.5, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc(cx + w*0.11, cy - h*0.06, 4.5, 0, Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(cx, cy + h*0.07, 7, 5, 0, 0, Math.PI*2); g.fill();
  } else if(cual === 'leon'){
    g.fillStyle = '#8A5A22';                                   /* melena */
    for(let i = 0; i < 12; i++){
      const a = (i/12) * Math.PI * 2;
      g.beginPath();
      g.arc(cx + Math.cos(a)*w*0.24, cy + Math.sin(a)*h*0.24, w*0.11, 0, Math.PI*2);
      g.fill();
    }
    g.fillStyle = '#D9A65A';
    g.beginPath(); g.arc(cx, cy, w*0.22, 0, Math.PI*2); g.fill();
    g.fillStyle = '#1A1030';
    g.beginPath(); g.arc(cx - w*0.08, cy - h*0.04, 4.5, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc(cx + w*0.08, cy - h*0.04, 4.5, 0, Math.PI*2); g.fill();
    g.beginPath(); g.moveTo(cx - 7, cy + h*0.06);
    g.lineTo(cx + 7, cy + h*0.06); g.lineTo(cx, cy + h*0.12); g.fill();
  } else {                                                     /* capibara */
    g.fillStyle = '#9A7048';
    g.beginPath(); g.ellipse(cx + w*0.05, cy + h*0.06, w*0.30, h*0.20, 0, 0, Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(cx - w*0.26, cy - h*0.06, w*0.16, h*0.14, 0, 0, Math.PI*2); g.fill();
    g.fillStyle = '#6F4E30';
    g.beginPath(); g.arc(cx - w*0.34, cy - h*0.18, w*0.05, 0, Math.PI*2); g.fill();
    g.fillStyle = '#1A1030';
    g.beginPath(); g.arc(cx - w*0.30, cy - h*0.08, 3.5, 0, Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(cx - w*0.41, cy - h*0.02, 5, 4, 0, 0, Math.PI*2); g.fill();
  }
  g.restore();
}

function pantallaImagenes(g, W, H, color, n){
  const cual = BICHOS[n % BICHOS.length];
  const nav = NAVEGADORES[(n + 1) % NAVEGADORES.length];
  marcoNavegador(g, W, color, ['Google Imágenes', 'YouTube'], 0,
                 'google.com/search?tbm=isch&q=' + cual.id, nav);
  g.fillStyle = '#FFFFFF'; g.fillRect(0, 106, W, H - 106);

  /* el logotipo chico, como en la página de resultados */
  const letras = [['G','#4285F4'],['o','#EA4335'],['o','#FBBC05'],
                  ['g','#4285F4'],['l','#34A853'],['e','#EA4335']];
  g.font = '700 27px -apple-system, system-ui, Arial, sans-serif';
  let lx = 48;
  for(const [c, tono] of letras){ g.fillStyle = tono; g.fillText(c, lx, 152);
                                  lx += g.measureText(c).width; }

  g.fillStyle = '#FFFFFF'; redondo(g, lx + 26, 126, W - lx - 74, 44, 22); g.fill();
  g.strokeStyle = '#DFE1E5'; g.lineWidth = 1.5; g.stroke();
  g.fillStyle = '#202124'; g.font = '21px -apple-system, system-ui, Arial, sans-serif';
  g.fillText(cual.nombre, lx + 48, 155);
  /* la fila de pestañas de Google, con «Imágenes» subrayada en azul */
  g.font = '17px -apple-system, system-ui, Arial, sans-serif';
  let px = 50;
  for(const p of ['Todo', 'Imágenes', 'Videos', 'Noticias', 'Maps']){
    const viva = p === 'Imágenes';
    g.fillStyle = viva ? '#1A73E8' : '#5F6368';
    g.fillText(p, px, 194);
    const an = g.measureText(p).width;
    if(viva){ g.fillStyle = '#1A73E8'; g.fillRect(px, 202, an, 3); }
    px += an + 26;
  }

  /* la rejilla: 4 × 2, con el fondo alternando para que se lea como galería */
  const cols = 4, filas = 2, hx = 44, hy = 222;
  const cw = (W - 88 - (cols-1)*12) / cols, ch = (H - hy - 44 - 12) / filas;
  for(let i = 0; i < cols * filas; i++){
    const x = hx + (i % cols) * (cw + 12), y = hy + ((i / cols) | 0) * (ch + 12);
    g.fillStyle = i % 3 === 0 ? '#F1F3F4' : '#E8EAED';
    redondo(g, x, y, cw, ch, 8); g.fill();
    /* Cada celda con su tamaño y su encuadre. Ocho dibujos idénticos se leen
       como un error de repintado; ocho parecidos se leen como resultados de
       búsqueda, que es lo que son. */
    const z = 0.82 + ((i * 37) % 5) * 0.07;
    const dx = ((i * 53) % 7 - 3) * 5, dy = ((i * 29) % 5 - 2) * 5;
    g.save();
    g.globalAlpha = 0.88 + ((i * 17) % 4) * 0.03;
    bicho(g, x + (cw*(1-z))/2 + dx, y + (ch*(1-z))/2 + dy, cw*z, ch*z, cual.id);
    g.restore();
  }
  g.fillStyle = '#70757A'; g.font = '17px -apple-system, system-ui, Arial, sans-serif';
  g.fillText('2,340,000 resultados · Mostrar más', 48, H - 16);
}

/* ── una hoja de cálculo ───────────────────────────────────────────────── */
function pantallaHoja(g, W, H, color, n){
  const nav = NAVEGADORES[(n + 3) % NAVEGADORES.length];
  marcoNavegador(g, W, color, ['comisiones-agosto.xlsx', 'Google'], 0,
                 'excel.office.com/comisiones-agosto', nav);

  /* La franja verde con el nombre: es lo que dice «Excel» antes de que uno
     lea nada. Y el cuadrito con la X, que es el emblema. */
  g.fillStyle = '#107C41'; g.fillRect(0, 106, W, 44);
  g.fillStyle = '#FFFFFF'; redondo(g, 18, 116, 25, 25, 4); g.fill();
  g.fillStyle = '#107C41'; g.font = '700 19px -apple-system, system-ui, Arial, sans-serif';
  g.fillText('X', 25, 136);
  g.fillStyle = '#FFFFFF'; g.font = '700 19px -apple-system, system-ui, Arial, sans-serif';
  g.fillText('Excel', 54, 136);
  g.font = '17px -apple-system, system-ui, Arial, sans-serif';
  g.fillStyle = 'rgba(255,255,255,.86)';
  g.fillText('comisiones-agosto.xlsx  ·  Guardado', 122, 136);

  /* la barra de fórmula: es lo que hace que se lea «hoja de cálculo» y no
     «tabla». Sin ella son puros cuadritos. */
  g.fillStyle = '#F3F2F1'; g.fillRect(0, 150, W, 40);
  g.fillStyle = '#FFFFFF'; g.fillRect(14, 156, 62, 28);
  g.strokeStyle = '#D2D0CE'; g.lineWidth = 1; g.strokeRect(14.5, 156.5, 62, 28);
  g.fillStyle = '#323130'; g.font = '18px -apple-system, system-ui, Arial, sans-serif';
  g.fillText('D7', 26, 176);
  g.fillStyle = '#8A8886'; g.fillText('fx', 92, 176);
  g.fillStyle = '#FFFFFF'; g.fillRect(120, 156, W - 134, 28);
  g.strokeStyle = '#D2D0CE'; g.strokeRect(120.5, 156.5, W - 134, 28);
  g.fillStyle = '#323130'; g.font = '18px ui-monospace, Menlo, monospace';
  g.fillText('=SUMA(D2:D6)*0.15   ← la comisión, según yo', 132, 176);

  /* Columnas de sobra a la derecha, vacías. Una hoja de cálculo que se acaba
     donde se acaban los datos no es una hoja: es una tabla. Lo que la hace
     reconocible es justamente la cuadrícula que sigue. */
  const cols = ['', 'A', 'B', 'C', 'D', 'E', 'F', 'G'];
  const anchos = [58, 210, 150, 130, 150, 150, 120, 120];
  const filas = [
    ['1', 'proyecto',      'estado',   'horas', 'monto',   'comisión'],
    ['2', 'Ligas Mazi',    'entregado','48',    '24,000',  '3,600'],
    ['3', 'Reportes 3.1',  'vivo',     '31',    '15,500',  '2,325'],
    ['4', 'La Sala',       'vivo',     '62',    '31,000',  '4,650'],
    ['5', 'El Taller',     'vivo',     '19',    '9,500',   '1,425'],
    ['6', 'palomas (?)',   'ehh',      '4',     '0',       '0'],
    ['7', '',              '',         '',      '80,000',  '12,000'],
  ];
  g.fillStyle = '#FFFFFF'; g.fillRect(0, 190, W, H - 190);
  let y = 198;
  const altoF = 42;
  for(let f = 0; f < filas.length; f++){
    let x = 20;
    for(let c = 0; c < cols.length; c++){
      const dato = filas[f][c] == null ? '' : filas[f][c];
      const encabezado = f === 0 || c === 0;
      g.fillStyle = encabezado ? '#F3F2F1' : '#FFFFFF';
      g.fillRect(x, y, anchos[c], altoF);
      g.strokeStyle = '#D0D0D0'; g.lineWidth = 1;
      g.strokeRect(x + 0.5, y + 0.5, anchos[c], altoF);
      g.fillStyle = encabezado ? '#616161'
                  : (c === 5 ? '#107C41' : '#242424');
      g.font = (f === 0 || c === 0 ? '600 ' : '') +
               '19px -apple-system, system-ui, Arial, sans-serif';
      g.fillText(recortar(g, dato, anchos[c] - 16), x + 10, y + 27);
      x += anchos[c];
    }
    y += altoF;
  }
  /* Los renglones vacíos hasta abajo. Una hoja de cálculo es, sobre todo,
     cuadrícula vacía: cortarla a la mitad la vuelve una tabla. */
  while(y < H - 6){
    let x = 20;
    for(let c = 0; c < cols.length; c++){
      g.fillStyle = c === 0 ? '#F3F2F1' : '#FFFFFF';
      g.fillRect(x, y, anchos[c], altoF);
      g.strokeStyle = '#D0D0D0'; g.lineWidth = 1;
      g.strokeRect(x + 0.5, y + 0.5, anchos[c], altoF);
      if(c === 0){
        g.fillStyle = '#616161';
        g.font = '600 19px -apple-system, system-ui, Arial, sans-serif';
        g.fillText(String(8 + (y - 198 - altoF*7) / altoF), x + 10, y + 27);
      }
      x += anchos[c];
    }
    y += altoF;
  }

  /* la celda seleccionada, con su cuadrito de arrastre */
  g.strokeStyle = '#107C41'; g.lineWidth = 2.5;
  g.strokeRect(20 + anchos.slice(0,4).reduce((a,b)=>a+b,0), 198 + altoF*6, anchos[4], altoF);
}

/* ── los juegos ────────────────────────────────────────────────────────── */
function hudJuego(g, W, H, j, color){
  /* Al borde del hueco, no al del lienzo. Ver `HUECO`. */
  const W2 = HUECO.w, H2 = HUECO.h;
  g.fillStyle = 'rgba(10,6,16,.72)'; g.fillRect(0, H2 - 56, W2, 56);
  /* El color del JUEGO, no el del agente: es lo que hace que se distingan de
     un vistazo cuando hay cuatro monitores en el cuarto. */
  g.fillStyle = j.tinte || color;
  g.font = '700 22px -apple-system, system-ui, Arial, sans-serif';
  g.fillText(j.nombre, 28, H2 - 20);
  const anNombre = g.measureText(j.nombre).width;
  g.fillStyle = '#9A8FA8'; g.font = '20px ui-monospace, Menlo, monospace';
  g.fillText(recortar(g, j.hud, W2 - anNombre - 82), 28 + anNombre + 26, H2 - 20);
}

function juegoBloques(g, W, H, color, j){
  /* Primera persona en un mundo de cubos. Se lee por la FORMA —terreno a
     bloques, mano abajo a la derecha, barra de objetos— y no por ninguna
     marca. */
  const cielo = g.createLinearGradient(0, 0, 0, H*0.55);
  cielo.addColorStop(0, '#5AA9E6'); cielo.addColorStop(1, '#A8D8F0');
  g.fillStyle = cielo; g.fillRect(0, 0, W, H*0.55);
  g.fillStyle = '#FFF6CC'; g.fillRect(W*0.74, 54, 62, 62);       /* sol cuadrado */

  const B = 64;
  /* Cuántos bloques hacen falta para llegar al borde de abajo. Con un número
     fijo, el terreno se acababa a media pantalla. */
  const hastaAbajo = Math.ceil((H - H*0.55) / B) + 1;
  for(let cx = 0; cx < W / B + 1; cx++){
    for(let cy = 0; cy < hastaAbajo; cy++){
      const x = cx * B, y = H*0.55 + cy * B;
      const arriba = cy === 0;
      /* Un poco de variación por columna: piedra pareja se lee como piso de
         azulejo, no como cueva. */
      const tono = ((cx * 7919 + cy * 131) % 3) * 6;
      g.fillStyle = arriba ? '#5C9A3C'
                  : cy === 1 ? '#7A5230'
                  : `rgb(${99 + tono},${99 + tono},${99 + tono})`;
      g.fillRect(x, y, B, B);
      g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(x, y, B, 4);
      g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 1;
      g.strokeRect(x + .5, y + .5, B, B);
    }
  }
  /* un árbol, que es lo que termina de decir «mundo de cubos» */
  g.fillStyle = '#6B4423'; g.fillRect(W*0.22, H*0.55 - B*2, B*0.6, B*2);
  g.fillStyle = '#3F7A2E'; g.fillRect(W*0.22 - B*0.7, H*0.55 - B*3.6, B*2, B*1.7);

  /* la mano con un bloque */
  g.fillStyle = '#C89A64';
  g.beginPath(); g.moveTo(W - 210, H); g.lineTo(W - 130, H - 150);
  g.lineTo(W - 40, H - 110); g.lineTo(W - 60, H); g.closePath(); g.fill();
  g.fillStyle = '#7A5230'; g.fillRect(W - 175, H - 205, 90, 90);
  g.fillStyle = '#8F6238'; g.fillRect(W - 175, H - 205, 90, 12);

  /* la mira y la barra de objetos */
  g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(W/2 - 14, H/2); g.lineTo(W/2 + 14, H/2);
  g.moveTo(W/2, H/2 - 14); g.lineTo(W/2, H/2 + 14); g.stroke();
  for(let i = 0; i < 9; i++){
    const x = W/2 - 9*30 + i*60;
    const yb = HUECO.h - 138;
    g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(x, yb, 56, 56);
    g.strokeStyle = i === 2 ? '#fff' : 'rgba(255,255,255,.35)';
    g.lineWidth = i === 2 ? 3 : 2; g.strokeRect(x, yb, 56, 56);
    if(i < 4){ g.fillStyle = ['#5C9A3C','#7A5230','#6B6B6B','#C0C0C8'][i];
               g.fillRect(x + 12, yb + 12, 32, 32); }
  }
  hudJuego(g, W, H, j, color);
}

function juegoArena(g, W, H, color, j){
  /* Vista de arriba, táctico. Un plano con dos bandos y una zona. */
  g.fillStyle = '#0E1218'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#1C2530'; g.lineWidth = 1;
  for(let x = 0; x < W; x += 48){ g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for(let y = 0; y < H; y += 48){ g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  /* los cuartos */
  g.fillStyle = '#161E28';
  for(const [x,y,w,h] of [[90,150,260,180],[420,120,240,150],[700,220,230,200],[180,400,300,150]])
    { redondo(g, x, y, w, h, 6); g.fill(); }
  /* la zona a tomar */
  g.strokeStyle = '#E8B33A'; g.lineWidth = 3; g.setLineDash([12, 8]);
  g.strokeRect(455, 250, 170, 130); g.setLineDash([]);
  g.fillStyle = 'rgba(232,179,58,.12)'; g.fillRect(455, 250, 170, 130);
  g.fillStyle = '#E8B33A'; g.font = '700 34px ui-monospace, Menlo, monospace';
  g.fillText('B', 528, 325);
  /* La Spike plantada, con su cuenta atrás: es lo que dice de qué juego es. */
  g.fillStyle = '#FF4655';
  redondo(g, 556, 292, 14, 26, 4); g.fill();
  g.beginPath(); g.arc(563, 288, 7, 0, Math.PI*2); g.fill();
  g.fillStyle = '#FF4655'; g.font = '700 19px ui-monospace, Menlo, monospace';
  g.fillText('0:31', 580, 312);
  /* los jugadores */
  const nuestros = [[210,240],[300,300],[240,430]];
  const otros    = [[760,300],[820,260],[700,380],[880,340]];
  for(const [x,y] of nuestros){
    g.fillStyle = '#3ECF8E'; g.beginPath(); g.arc(x, y, 12, 0, Math.PI*2); g.fill();
    g.strokeStyle = '#3ECF8E'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + 26, y - 8); g.stroke();
  }
  for(const [x,y] of otros){
    g.fillStyle = '#F0567F'; g.beginPath(); g.arc(x, y, 12, 0, Math.PI*2); g.fill();
  }
  hudJuego(g, W, H, j, color);
}

function juegoCoches(g, W, H, color, j){
  /* Un coche y una pelota enorme en una cancha. La broma se entiende por la
     proporción: la pelota mide como tres coches. */
  const suelo = g.createLinearGradient(0, H*0.30, 0, H);
  suelo.addColorStop(0, '#1B3A6B'); suelo.addColorStop(1, '#0E1B33');
  g.fillStyle = '#0A1020'; g.fillRect(0, 0, W, H*0.30);
  g.fillStyle = suelo; g.fillRect(0, H*0.30, W, H*0.70);
  /* las líneas de la cancha, en perspectiva */
  g.strokeStyle = 'rgba(140,190,255,.35)'; g.lineWidth = 3;
  for(let i = 0; i <= 8; i++){
    const t = i / 8;
    g.beginPath(); g.moveTo(W*0.5 + (t - 0.5) * W * 0.5, H*0.30);
    g.lineTo(W*0.5 + (t - 0.5) * W * 2.4, H); g.stroke();
  }
  for(let i = 1; i <= 4; i++){
    const y = H*0.30 + Math.pow(i/4, 2) * H*0.70;
    g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
  }
  /* la portería */
  g.strokeStyle = '#8CBEFF'; g.lineWidth = 5;
  g.strokeRect(W*0.36, H*0.20, W*0.28, H*0.13);
  /* la pelota, enorme */
  const bx = W*0.56, by = H*0.52, br = 78;
  const luz = g.createRadialGradient(bx - 26, by - 30, 8, bx, by, br);
  luz.addColorStop(0, '#FFFFFF'); luz.addColorStop(1, '#8CA0C0');
  g.fillStyle = luz; g.beginPath(); g.arc(bx, by, br, 0, Math.PI*2); g.fill();
  g.strokeStyle = 'rgba(20,30,50,.45)'; g.lineWidth = 3;
  g.beginPath(); g.arc(bx, by, br, 0, Math.PI*2); g.stroke();
  g.beginPath(); g.ellipse(bx, by, br*0.42, br, 0, 0, Math.PI*2); g.stroke();
  /* el coche, chiquito al lado */
  g.fillStyle = '#F0567F';
  redondo(g, W*0.24, H*0.66, 150, 46, 10); g.fill();
  g.fillStyle = '#2A1B3C'; redondo(g, W*0.27, H*0.63, 78, 30, 8); g.fill();
  g.fillStyle = '#1A1030';
  g.beginPath(); g.arc(W*0.27, H*0.72, 17, 0, Math.PI*2); g.fill();
  g.beginPath(); g.arc(W*0.24 + 122, H*0.72, 17, 0, Math.PI*2); g.fill();
  /* el turbo */
  g.fillStyle = 'rgba(255,140,60,.75)';
  g.beginPath(); g.moveTo(W*0.24, H*0.68); g.lineTo(W*0.24 - 70, H*0.70);
  g.lineTo(W*0.24, H*0.72); g.closePath(); g.fill();
  hudJuego(g, W, H, j, color);
}

function juegoCiudad(g, W, H, color, j){
  /* Una calle de noche con neón. Se lee por el ambiente, no por el mapa. */
  const cielo = g.createLinearGradient(0, 0, 0, H*0.62);
  cielo.addColorStop(0, '#170A2E'); cielo.addColorStop(1, '#3B1352');
  g.fillStyle = cielo; g.fillRect(0, 0, W, H*0.62);
  /* los edificios, con sus ventanitas */
  let x = 0;
  while(x < W){
    const an = 70 + ((x * 131) % 90);
    const al = 130 + ((x * 977) % 220);
    g.fillStyle = '#120A22'; g.fillRect(x, H*0.62 - al, an, al);
    for(let vy = H*0.62 - al + 16; vy < H*0.62 - 20; vy += 26){
      for(let vx = x + 12; vx < x + an - 14; vx += 22){
        if(((vx * vy) % 7) > 3) continue;
        g.fillStyle = ((vx + vy) % 3) ? 'rgba(255,214,120,.85)' : 'rgba(120,220,255,.8)';
        g.fillRect(vx, vy, 9, 13);
      }
    }
    x += an + 6;
  }
  /* dos letreros de neón, que es lo que da el tono */
  g.fillStyle = 'rgba(240,86,127,.9)'; g.fillRect(W*0.12, H*0.20, 8, 130);
  g.fillStyle = 'rgba(120,220,255,.85)'; g.fillRect(W*0.70, H*0.14, 8, 160);
  g.font = '700 30px ui-monospace, Menlo, monospace';
  g.fillStyle = '#F0567F'; g.fillText('RAMEN', W*0.12 + 20, H*0.26);
  g.fillStyle = '#78DCFF'; g.fillText('24 HRS', W*0.70 + 20, H*0.20);
  /* El amarillo es la mitad de lo que hace que se lea como este juego. */
  g.fillStyle = '#FCEE0A'; g.font = '700 26px -apple-system, system-ui, Arial, sans-serif';
  g.fillText('NIGHT CITY', W*0.38, H*0.16);
  g.fillStyle = 'rgba(252,238,10,.5)'; g.fillRect(W*0.38, H*0.17, 168, 3);
  /* la calle mojada, con reflejos */
  g.fillStyle = '#0B0716'; g.fillRect(0, H*0.62, W, H*0.38);
  g.fillStyle = 'rgba(240,86,127,.20)'; g.fillRect(W*0.12, H*0.62, 8, H*0.30);
  g.fillStyle = 'rgba(120,220,255,.18)'; g.fillRect(W*0.70, H*0.62, 8, H*0.26);
  g.strokeStyle = 'rgba(232,179,58,.6)'; g.lineWidth = 6; g.setLineDash([40, 34]);
  g.beginPath(); g.moveTo(0, H*0.86); g.lineTo(W, H*0.80); g.stroke(); g.setLineDash([]);
  hudJuego(g, W, H, j, color);
}


/* ── LA BARRA QUE NUNCA SE VA ──────────────────────────────────────────────
   Carlos: «que las pantallas no dejen de mostrar en la parte de arriba como si
   fuese la barra de búsqueda, o en la de abajo como si fuese la de tareas, o
   en la de tareas pero del lado izquierdo como un psicópata, o peor aún del
   lado derecho jajaja. El chiste es que siga viendo el desarrollo de su tarea
   y me entretenga viendo eso como si realmente hicieran algo».

   Y ahí está el diseño entero en una frase suya: LAS DOS COSAS A LA VEZ. El
   agente está viendo capibaras y su tarea sigue avanzando en la barra, que es
   exactamente lo que uno ve cuando alguien «está trabajando».

   Por eso la rotación de pantallas ya NO espera a que el agente esté ocioso:
   corre siempre, y la barra lleva el trabajo de verdad encima. La pantalla del
   trabajo completo sigue existiendo y es la primera de la vuelta.

   EL LADO ES FIJO POR AGENTE, no al azar en cada pintada: una barra que se
   cambia de lado sola no es una barra, es un parpadeo. Sale del id, así que
   cada quien tiene su manía y se la queda. Los cuatro lados están, incluido el
   derecho. */
let relojFijo = null;

/* Lo que le queda a la escena después de que la barra se lleva su franja. Lo
   pone `pintarPantalla` antes de llamarla.

   ⚠ HACE FALTA POR UNA RAZÓN CONCRETA: el rótulo del juego vive pegado al
   borde de abajo, y con la barra arriba —que corre el lienzo 56 px— ese borde
   queda FUERA del recorte. O sea que desaparecía el nombre del juego, que es
   justamente lo que Carlos pidió que se viera. Se vio en la captura de
   Fortnite: mapa, tormenta, inventario… y sin nombre. */
let HUECO = { w: 1024, h: 640 };

const LADOS = ['abajo', 'arriba', 'izquierda', 'derecha'];
function ladoDe(id){
  let h = 0;
  for(const c of String(id || '')) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return LADOS[h % LADOS.length];
}

/* El grueso de la barra. Las de los lados son más anchas porque el texto va
   girado y necesita respirar. */
const GRUESO = { arriba: 56, abajo: 62, izquierda: 74, derecha: 74 };

function barraDeTarea(g, W, H, quien, color, lado){
  const t = quien.trabajo;
  const grueso = GRUESO[lado];
  const vertical = lado === 'izquierda' || lado === 'derecha';

  /* El fondo. Va casi opaco: media barra transparente sobre un juego de
     colores es una barra que no se lee, y ésta existe justamente para leerse. */
  g.save();
  /* Casi opaca. A .88 se alcanzaba a leer POR DEBAJO el rótulo del juego,
     que también vive abajo — dos textos encimados en la franja que existe
     justamente para leerse. Se vio en la captura. */
  g.fillStyle = 'rgba(10,6,16,.965)';
  if(lado === 'arriba')      g.fillRect(0, 0, W, grueso);
  else if(lado === 'abajo')  g.fillRect(0, H - grueso, W, grueso);
  else if(lado === 'izquierda') g.fillRect(0, 0, grueso, H);
  else                       g.fillRect(W - grueso, 0, grueso, H);

  /* Una línea del color del agente pegada al borde de adentro: es lo que la
     separa del contenido sin gastar espacio. */
  g.fillStyle = color;
  if(lado === 'arriba')      g.fillRect(0, grueso - 2, W, 2);
  else if(lado === 'abajo')  g.fillRect(0, H - grueso, W, 2);
  else if(lado === 'izquierda') g.fillRect(grueso - 2, 0, 2, H);
  else                       g.fillRect(W - grueso, 0, 2, H);

  /* Se dibuja siempre en horizontal y se GIRA el lienzo para los lados. Es la
     mitad de código y, sobre todo, la misma barra en los cuatro lados: escrita
     cuatro veces, la de la derecha se habría quedado atrás a la tercera. */
  const largo = vertical ? H : W;
  if(lado === 'izquierda'){ g.translate(0, H); g.rotate(-Math.PI/2); }
  else if(lado === 'derecha'){ g.translate(W, 0); g.rotate(Math.PI/2); }
  else if(lado === 'abajo'){ g.translate(0, H - grueso); }

  /* De aquí para abajo se pinta como si la barra fuera de arriba y midiera
     `largo` × `grueso`. */
  const my = grueso / 2;
  let x = 14;

  /* El botón de inicio: el cuadrito con el color del agente. Es lo que hace
     que se lea «barra de tareas» y no «letrero». */
  g.fillStyle = color;
  redondo(g, x, my - 13, 26, 26, 7); g.fill();
  g.fillStyle = 'rgba(0,0,0,.55)';
  g.fillRect(x + 7, my - 6, 5, 5); g.fillRect(x + 14, my - 6, 5, 5);
  g.fillRect(x + 7, my + 1, 5, 5); g.fillRect(x + 14, my + 1, 5, 5);
  x += 40;

  if(!t){
    g.fillStyle = '#5B4B6D'; g.font = '20px ui-monospace, Menlo, monospace';
    g.fillText('sin nada en curso · matando el rato', x, my + 7);
    g.restore();
    return;
  }

  /* La «ventana abierta»: el encargo. Ocupa lo que sobre, para que se lea
     completo cuando cabe y se recorte sólo cuando de verdad no. */
  const finReloj = largo - 118;
  const anchoVentana = Math.max(140, finReloj - x - 190);
  g.fillStyle = 'rgba(255,255,255,.06)';
  redondo(g, x, my - 17, anchoVentana, 34, 8); g.fill();
  g.fillStyle = color; g.fillRect(x, my + 13, anchoVentana, 3);
  g.fillStyle = '#E9E4E4'; g.font = '600 20px -apple-system, system-ui, sans-serif';
  g.fillText(recortar(g, t.en || 'trabajando', anchoVentana - 22), x + 11, my + 3);
  x += anchoVentana + 16;

  /* El avance, que es lo que hace que se vea AVANZAR y no sólo estar. */
  if(t.total > 0){
    const p = Math.max(0, Math.min(1, t.va / t.total));
    const bw = 120;
    g.fillStyle = 'rgba(255,255,255,.10)'; redondo(g, x, my - 6, bw, 12, 6); g.fill();
    g.fillStyle = color; redondo(g, x, my - 6, Math.max(12, bw * p), 12, 6); g.fill();
    g.fillStyle = '#9A8FA8'; g.font = '17px ui-monospace, Menlo, monospace';
    g.fillText(`${t.va}/${t.total}`, x + bw + 10, my + 6);
  } else if(t.paso){
    g.fillStyle = '#9A8FA8'; g.font = '18px ui-monospace, Menlo, monospace';
    g.fillText(recortar(g, '› ' + t.paso, 170), x, my + 6);
  }

  /* El reloj, pegado a la esquina. Sin él no se lee como barra de tareas.
     `relojFijo` sólo lo pone una prueba: sin poder congelarlo, dos pintadas
     de la MISMA pantalla salen distintas si el minuto cambió entre una y otra,
     y entonces la prueba de que repintar es idempotente falla sola una vez de
     cada tantas. Una prueba que falla sola se acaba ignorando, y una prueba
     que se ignora es peor que no tenerla. */
  const d = new Date();
  const reloj = relojFijo || (String(d.getHours()).padStart(2,'0') + ':' +
                String(d.getMinutes()).padStart(2,'0'));
  g.fillStyle = '#C0B0D0'; g.font = '19px ui-monospace, Menlo, monospace';
  g.fillText(reloj, largo - 74, my + 6);

  g.restore();
}


function juegoBattle(g, W, H, color, j){
  /* Un mapa de battle royale con el círculo de la tormenta cerrándose. Lo que
     dice el género de un vistazo son tres cosas: el círculo, el autobús que
     cruza y la cuenta de los que quedan. */
  /* Un verde de base y no casi negro: si el suelo es oscuro, lo único que se
     lee es el morado de la tormenta y parece una mancha, no un mapa. */
  g.fillStyle = '#24422A'; g.fillRect(0, 0, W, H);
  /* el terreno: manchas de verde y arena */
  const manchas = [[140,150,190,120,'#2E5A34'],[420,90,240,150,'#3A6B3E'],
                   [720,180,230,170,'#2E5A34'],[200,380,280,150,'#4A5F2E'],
                   [560,330,300,190,'#3A6B3E'],[60,260,150,140,'#4A5F2E']];
  for(const [x,y,w,h,tono] of manchas){
    g.fillStyle = tono; redondo(g, x, y, w, h, 34); g.fill();
  }
  /* caminos */
  g.strokeStyle = '#6B6350'; g.lineWidth = 9;
  g.beginPath(); g.moveTo(0, 300); g.bezierCurveTo(280, 250, 620, 380, W, 320); g.stroke();
  g.beginPath(); g.moveTo(430, 0); g.bezierCurveTo(470, 220, 380, 380, 460, H); g.stroke();

  /* la tormenta: lo de afuera del círculo, morado */
  g.save();
  g.beginPath(); g.rect(0, 0, W, H);
  g.arc(560, 300, 210, 0, Math.PI*2, true);
  g.fillStyle = 'rgba(120,60,220,.42)'; g.fill('evenodd');
  g.restore();
  g.strokeStyle = '#9D4DFF'; g.lineWidth = 4;
  g.beginPath(); g.arc(560, 300, 210, 0, Math.PI*2); g.stroke();
  /* y el círculo siguiente, punteado */
  g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = 3; g.setLineDash([10, 8]);
  g.beginPath(); g.arc(600, 330, 118, 0, Math.PI*2); g.stroke(); g.setLineDash([]);

  /* el autobús cruzando, con su estela */
  g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 2; g.setLineDash([14, 10]);
  g.beginPath(); g.moveTo(60, 96); g.lineTo(W - 40, 190); g.stroke(); g.setLineDash([]);
  g.fillStyle = '#F2C13D';
  g.save(); g.translate(430, 143); g.rotate(0.12);
  redondo(g, -34, -12, 68, 24, 6); g.fill();
  g.fillStyle = '#7EC8E3'; g.fillRect(-24, -8, 40, 9);
  g.restore();
  /* el globo del autobús */
  g.fillStyle = 'rgba(242,193,61,.55)';
  g.beginPath(); g.ellipse(430, 108, 30, 22, 0, 0, Math.PI*2); g.fill();

  /* los que quedan, arriba a la derecha */
  g.fillStyle = 'rgba(0,0,0,.55)'; redondo(g, W - 210, 22, 186, 44, 8); g.fill();
  g.fillStyle = '#FFFFFF'; g.font = '700 22px -apple-system, system-ui, Arial, sans-serif';
  g.fillText('14 quedan', W - 192, 51);
  g.fillStyle = '#9D4DFF'; redondo(g, W - 210, 74, 186, 10, 5); g.fill();

  /* el inventario de abajo, que es la última pista del género */
  for(let i = 0; i < 5; i++){
    const x = W/2 - 5*36 + i*72;
    const yb = HUECO.h - 128;
    g.fillStyle = 'rgba(0,0,0,.5)'; redondo(g, x, yb, 66, 52, 6); g.fill();
    g.strokeStyle = i === 1 ? '#FFFFFF' : 'rgba(255,255,255,.28)';
    g.lineWidth = i === 1 ? 3 : 2; redondo(g, x, yb, 66, 52, 6); g.stroke();
    if(i < 3){
      g.fillStyle = ['#9D4DFF','#F2C13D','#4FC3F7'][i];
      redondo(g, x + 12, yb + 12, 42, 28, 4); g.fill();
    }
  }
  hudJuego(g, W, H, j, color);
}

/* ── el catálogo, y de quién es cada pantalla ──────────────────────────── */
const OCIO = [
  (g,W,H,c,n) => pantallaBusqueda(g, W, H, c, n),
  (g,W,H,c,n) => juegoBloques(g, W, H, c, JUEGOS[0]),
  (g,W,H,c,n) => pantallaVideo(g, W, H, c, n),
  (g,W,H,c,n) => pantallaImagenes(g, W, H, c, n),
  (g,W,H,c,n) => juegoArena(g, W, H, c, JUEGOS[1]),
  (g,W,H,c,n) => pantallaHoja(g, W, H, c, n),
  (g,W,H,c,n) => juegoCoches(g, W, H, c, JUEGOS[2]),
  (g,W,H,c,n) => pantallaBusqueda(g, W, H, c, n + 3),
  (g,W,H,c,n) => juegoCiudad(g, W, H, c, JUEGOS[3]),
  (g,W,H,c,n) => juegoBattle(g, W, H, c, JUEGOS[4]),
  (g,W,H,c,n) => pantallaVideo(g, W, H, c, n + 2),
];

/* ── el dibujo de la pantalla ─────────────────────────────────────────── */
/* Once pantallas en la vuelta. La 0 es EL TRABAJO A PANTALLA COMPLETA; las
   otras diez son las suyas —buscar, ver videos, jugar— y todas llevan la barra
   con el trabajo de verdad encima.

   La vuelta corre TRABAJE O NO, y ése es el encargo de Carlos entero: «el
   chiste es que siga viendo el desarrollo de su tarea y me entretenga viendo
   eso como si realmente hicieran algo». Sin la barra, la parte chistosa
   escondería la parte útil; sin la rotación, la parte útil sería lo único. */
const PANTALLAS_TOTAL = 1 + OCIO.length;

function pintarPantalla(esc_, quien, color){
  const g = esc_.lienzo.getContext('2d');
  const W = 1024, H = 640;
  /* ⚠ SE BORRA TODO ANTES DE CADA PANTALLA, y no dentro de cada una. Cada
     escena pinta su propio fondo, así que parecía innecesario — hasta que en
     la del mundo de bloques, donde el terreno sólo llegaba hasta donde llegaba,
     asomó por abajo el «Lo que estabas buscando…» de la BÚSQUEDA anterior. Se
     vio en la captura. Confiar en que cada escena tape todo es confiar en diez
     funciones a la vez; borrar aquí es una línea. */
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  g.clearRect(0, 0, W, H);
  g.fillStyle = '#0C0714'; g.fillRect(0, 0, W, H);

  const t = quien.trabajo;
  const n = ((esc_.ocio | 0) % PANTALLAS_TOTAL + PANTALLAS_TOTAL) % PANTALLAS_TOTAL;

  /* La 0 con trabajo es la pantalla completa del encargo. Sin trabajo no hay
     pantalla completa que enseñar, así que se va a la primera de las suyas —y
     la barra dirá que anda matando el rato, que es la verdad. */
  if(n === 0 && t){
    pantallaTrabajo(g, W, H, quien, color, t);
    esc_.textura.needsUpdate = true;
    return;
  }

  /* ⚠ LA BARRA LE CORRE EL SITIO A LA PANTALLA, no se le pone encima. Con la
     barra arriba y una página de navegador, la franja tapaba justo las
     PESTAÑAS —lo primero que dice «esto es un navegador»— y la página parecía
     empezar en la barra de dirección. Se vio en la captura.

     Se resuelve una sola vez aquí y no en las doce escenas: se corre el lienzo
     y se recorta al hueco que queda. Cada escena sigue dibujando como si
     tuviera la pantalla entera, y lo que se pierde es la orilla del lado
     contrario — que es lo mismo que hace una barra de tareas de verdad. */
  const lado = esc_.ladoFijo || ladoDe(quien.id);
  const hueco = GRUESO[lado];
  const vertical = lado === 'izquierda' || lado === 'derecha';
  HUECO = { w: W - (vertical ? hueco : 0), h: H - (vertical ? 0 : hueco) };
  g.save();
  g.beginPath();
  if(lado === 'arriba'){        g.rect(0, hueco, W, H - hueco);      g.clip(); g.translate(0, hueco); }
  else if(lado === 'abajo'){    g.rect(0, 0, W, H - hueco);          g.clip(); }
  else if(lado === 'izquierda'){g.rect(hueco, 0, W - hueco, H);      g.clip(); g.translate(hueco, 0); }
  else {                        g.rect(0, 0, W - hueco, H);          g.clip(); }
  OCIO[(n === 0 ? 0 : n - 1) % OCIO.length](g, W, H, color, n);
  g.restore();

  /* `ladoFijo` sólo lo pone la manija de pruebas, para poder ver los cuatro
     lados sin esperar a que le toque a alguien el de la derecha. La primera
     versión de esa manija pintaba la barra ENCIMA de la que ya había puesto
     esta función: salían dos, y en la captura parecía un defecto del producto
     cuando era del andamio. */
  barraDeTarea(g, W, H, quien, color, lado);
  esc_.textura.needsUpdate = true;
}

/* El encargo a pantalla completa, dentro de un navegador. */
function pantallaTrabajo(g, W, H, quien, color, t){
  /* El encargo va como PESTAÑA ABIERTA. Es el detalle que hace que se lea
     «está trabajando en esto» y no «hay un letrero pegado en la pared». */
  marcoNavegador(g, W, color,
    [recortar2(g, t.en || 'trabajo', 200), 'la mesa', 'el repo'], 0,
    'taller.mazi/' + (quien.id || 'agente') + '/en-curso');

  g.fillStyle = '#7B6B8D'; g.font = '600 19px ui-monospace, Menlo, monospace';
  g.fillText('AHORITA ESTÁ EN', 44, 150);

  /* El título se parte a mano: `fillText` no salta de renglón solo, y un
     encargo largo se salía de la pantalla sin que nadie se enterara. */
  g.fillStyle = '#E9E4E4'; g.font = '700 38px -apple-system, system-ui, sans-serif';
  let y = 200;
  for(const linea of partir(g, t.en || '', W - 88).slice(0, 2)){
    g.fillText(linea, 44, y); y += 46;
  }

  if(t.paso){
    g.fillStyle = color; g.font = '24px ui-monospace, Menlo, monospace';
    g.fillText(recortar(g, '› ' + t.paso, W - 88), 44, y + 10);
  }

  /* avance */
  if(t.total > 0){
    const by = 356, bw = W - 88, p = Math.max(0, Math.min(1, t.va / t.total));
    g.fillStyle = '#241834'; redondo(g, 44, by, bw, 14, 7); g.fill();
    g.fillStyle = color;     redondo(g, 44, by, Math.max(14, bw*p), 14, 7); g.fill();
    g.fillStyle = '#7B6B8D'; g.font = '20px ui-monospace, Menlo, monospace';
    g.fillText(`${t.va} de ${t.total}`, 44, by + 40);
  }

  /* el rastro: los últimos pasos, del más viejo al más nuevo */
  const pasos = (t.pasos || []).slice(-6);
  if(pasos.length){
    g.fillStyle = '#33224A'; g.fillRect(44, 424, W - 88, 1);
    g.font = '21px ui-monospace, Menlo, monospace';
    let py = 458;
    pasos.forEach((p, i) => {
      const ultimo = i === pasos.length - 1;
      g.fillStyle = ultimo ? '#C77BFF' : `rgba(123,107,141,${0.4 + i*0.07})`;
      g.fillText(recortar(g, (ultimo ? '▸ ' : '  ') + p, W - 88), 44, py);
      py += 29;
    });
  }
}

/* Recorta a un ancho en píxeles conservando la fuente que ya esté puesta. Va
   aparte de `recortar` porque el marco del navegador cambia la fuente y
   `recortar` mediría con la que quedó, no con la suya. */
function recortar2(g, texto, ancho){
  const antes = g.font;
  g.font = '19px ui-monospace, Menlo, monospace';
  const r = recortar(g, texto, ancho);
  g.font = antes;
  return r;
}

function partir(g, texto, ancho){
  const palabras = String(texto).split(/\s+/), lineas = []; let linea = '';
  for(const p of palabras){
    const intento = linea ? linea + ' ' + p : p;
    if(g.measureText(intento).width > ancho && linea){ lineas.push(linea); linea = p; }
    else linea = intento;
  }
  if(linea) lineas.push(linea);
  return lineas;
}
function recortar(g, texto, ancho){
  let t = String(texto);
  if(g.measureText(t).width <= ancho) return t;
  while(t.length > 4 && g.measureText(t + '…').width > ancho) t = t.slice(0, -1);
  return t + '…';
}
function redondo(g, x, y, w, h, r){
  g.beginPath(); g.moveTo(x+r, y);
  g.arcTo(x+w, y, x+w, y+h, r); g.arcTo(x+w, y+h, x, y+h, r);
  g.arcTo(x, y+h, x, y, r);     g.arcTo(x, y, x+w, y, r);
  g.closePath();
}

/* ══ LOS AGENTES ═════════════════════════════════════════════════════════ */
const cargador = new GLTFLoader();
let plantilla = null, animaciones = [];
const puestos = new Map();          /* id → { grupo, mezclador, acciones, … } */
let enFoco = null;
let radioActual = 0;          /* qué tan abierto quedó el semicírculo */

/* Qué animación toca según lo que esté pasando. Es el traductor entre el
   estado del trabajo y el cuerpo — y es lo que hace que se entienda de reojo,
   sin leer nada. */
function animacionDe(quien){
  /* ⚠ SENTADO ES EL ESTADO NORMAL, Y ANTES ERA LA EXCEPCIÓN. Carlos, e176:
     «los robots no se sientan en sus sillas», y e165: «no hace la animación
     de usar su teclado y mouse».

     Son la MISMA causa y por eso se arreglan juntas: `Sitting` sólo salía si
     el agente estaba reportando trabajo con /trabajando, que en la práctica
     casi nunca pasa. Todo el resto del tiempo devolvía `Idle`, que es la pose
     DE PIE — así que había una silla debajo de cada robot y ninguno sentado
     en ella. Y como teclear y mover el ratón se dibujan sólo sobre la pose
     sentada, tampoco se veían nunca.

     Ahora el sitio de trabajo manda: quien está en su escritorio está
     sentado. De pie se queda sólo quien tiene una razón para estarlo —el que
     anda buscando, que camina— y tumbado el que ya no está. Las reacciones
     que sí son de pie (pulgar arriba, negar) siguen saliendo: son un momento,
     no un estado, y levantarse a decir algo y volver a sentarse es
     exactamente lo que hace una persona. */
  if(quien.estado === 'topado' || quien.estado === 'ocupado') return 'No';
  if(quien.estado === 'fuera') return 'Death';
  if(quien.trabajo){
    const t = (quien.trabajo.paso || quien.trabajo.en || '').toLowerCase();
    if(/\bprueb|test|verde|pasan\b/.test(t)) return 'ThumbsUp';
    if(/\bfall|error|roto|trueno\b/.test(t))  return 'No';
    if(/\bbusc|le(o|yendo)|revis\b/.test(t))  return 'Walking';
  }
  /* Callado hace rato o sin nada reportado: sentado igual. Que lleve un rato
     sin hablar ya lo dice el aro apagado y el globo; no hacía falta además
     ponerlo de pie, que es lo que rompía la escena. */
  return 'Sitting';
}

/* ══ TECLEAR Y MOVER EL RATÓN ══════════════════════════════════════════════
   Lo pidió Carlos: «dales animación de escribir y mover el mouse».

   ⚠ EL MODELO NO TRAE NINGUNA DE LAS DOS. Sus catorce clips son Dance, Death,
   Idle, Jump, No, Punch, Running, Sitting, Standing, ThumbsUp, Walking,
   WalkJump, Wave y Yes — se comprobó pidiéndoselos al propio modelo, no
   suponiendo. Así que teclear no se elige: se inventa.

   Cómo, sin salirse de lo que la casa acepta: se deja que `Sitting` siga
   corriendo —da la pose, la espalda, las piernas— y ENCIMA se le mueven a
   mano cuatro huesos de los brazos. El mezclador escribe la rotación en cada
   cuadro y nosotros la corregimos después, así que no pelean: uno pone la
   pose y el otro el temblor.

   Las dos manos NO hacen lo mismo, y ahí está todo el efecto:
     · la izquierda teclea — sube y baja rápido, en ráfagas con pausas, porque
       nadie teclea a ritmo de metrónomo;
     · la derecha lleva el ratón — deriva lento y ancho sobre la mesa.
   Si las dos hicieran lo mismo se ve un muñeco vibrando, no alguien
   trabajando. */
const HUESOS_TECLEO = { UpperArmL:1, LowerArmL:1, UpperArmR:1, LowerArmR:1 };

function moverBrazos(p, t){
  const b = p.brazos;
  if(!b || !b.LowerArmL) return;

  /* Sólo cuando de verdad está en algo. Un agente en reposo con las manos
     tecleando es una mentira que se ve a la primera. */
  const trabajando = !!(p.quien && p.quien.trabajo)
                  && p.quien.estado !== 'topado' && p.quien.estado !== 'fuera';

  /* Se guarda la pose que dejó el mezclador ANTES de tocarla, y se vuelve a
     ella al soltar. Sin esto, al dejar de trabajar los brazos se quedan
     doblados donde los dejamos y el robot parece descompuesto. */
  const suave = (hueso, dx, dy) => {
    hueso.rotation.x += dx;
    hueso.rotation.y += dy;
  };

  if(!trabajando) return;

  const f = t * 9 + p.fase;
  /* Las ráfagas: teclea un rato y para. `Math.max(0, sin)` da pausas de la
     mitad del ciclo, que es lo que hace que se lea como escribir y no como
     temblar. */
  const rafaga = Math.max(0, Math.sin(t * 1.3 + p.fase));
  const golpe  = Math.sin(f) * 0.075 * rafaga;
  const golpe2 = Math.sin(f * 1.17 + 1.1) * 0.065 * rafaga;

  suave(b.LowerArmL, golpe, 0);
  if(b.UpperArmL) suave(b.UpperArmL, golpe * 0.35, 0);
  suave(b.LowerArmR, golpe2 * 0.4, 0);

  /* El ratón: la derecha deriva despacio y ancho, en dos ejes distintos para
     que el recorrido no sea una recta. */
  if(b.UpperArmR){
    suave(b.UpperArmR,
          Math.sin(t * 0.55 + p.fase) * 0.05,
          Math.cos(t * 0.38 + p.fase) * 0.09);
  }
}

function ponerAgente(quien, indice, cuantos){
  if(!HAY3D) return null;
  const g = new THREE.Group();
  /* En semicírculo mirando al centro: así se ven todos desde una sola vista y
     nadie le da la espalda a la cámara de arranque. */
  const radio = cuantos <= 1 ? 0 : 2.3 + cuantos*0.55;
  radioActual = radio;
  /* El abanico abarca 153°, no 223°. Con el arco más abierto los de los
     extremos quedaban DETRÁS de la cámara en la vista amplia: se veía un
     cuarto de dos agentes cuando había cuatro. */
  const ang = cuantos <= 1 ? 0 : (-Math.PI*0.425) + (indice/(cuantos-1)) * Math.PI*0.85;
  g.position.set(Math.sin(ang)*radio, 0, Math.cos(ang)*radio);
  /* ── cómo está armado un puesto, que costó dos intentos ────────────────
     Con `rotation.y = ang`, el -z local apunta al centro del cuarto. Entonces:

        -z  ← el escritorio y su pantalla (hacia el centro)
         0  ← el robot, de espaldas a la cámara
        +z  ← la cámara, por fuera del círculo, mirando hacia adentro

     La primera vez le puse `ang + Math.PI` al puesto y `Math.PI` al escritorio,
     y la pantalla acabó apuntando para AFUERA: salía negra en la captura y yo
     creí que la textura no cargaba. No era la textura — le estaba viendo la
     espalda al monitor. */
  g.rotation.y = ang;

  const color = new THREE.Color(quien.color || '#AC27FF');
  const mesa = hacerEscritorio(color);
  mesa.grupo.position.set(0, 0, -1.05);   /* sin rotar: la pantalla mira a +z */
  g.add(mesa.grupo);

  const muñeco = plantilla ? clonarConHuesos(plantilla) : null;
  let mezclador = null; const acciones = {}, brazos = {};
  if(muñeco){
    /* La escala se MIDE, no se adivina — pero se mide sobre el ORIGINAL y una
       sola vez. Medirla sobre el clon daba 1.49 en vez de 4.79: `setFromObject`
       sobre una malla con huesos que todavía no entra a la escena devuelve la
       caja de la geometría en pose de amarre, no la del cuerpo armado. Con esa
       cuenta el robot salía de casi CINCO metros y la cámara le quedaba entre
       las piernas — se veía un cuarto vacío y yo creí que el clon había fallado. */
    muñeco.scale.setScalar(ALTO_AGENTE / ALTO_CRUDO);
    muñeco.position.set(0, 0, 0);
    muñeco.rotation.y = Math.PI;              /* de cara al escritorio */
    muñeco.traverse(o => {
      if(o.isMesh){
        o.castShadow = true;
        /* El robot viene gris. Se le tiñe con el color de la CUENTA, que es la
           misma señal que usa la mesa: morado es de Carlos, naranja de Luis.
           El material se clona porque si no, teñir a uno los tiñe a todos. */
        o.material = o.material.clone();
        if(o.material.color && o.material.color.getHex() > 0x333333){
          o.material.color.lerp(color, 0.62);
        }
        o.material.emissive = color.clone().multiplyScalar(0.06);
      }
    });
    g.add(muñeco);
    mezclador = new THREE.AnimationMixer(muñeco);
    /* ⚠ HAY DOS CLASES DE CLIP Y TRATARLOS IGUAL FUE EL DEFECTO. Carlos:
       «los robots se sientan y se paran y se sientan y se paran, parece que es
       error de loop con el inicio de la animación». Tenía razón hasta en el
       diagnóstico.

       Lo MEDÍ en vez de suponerlo, y el corte es limpio: `Idle` dura 3.33 s y
       `Walking` 0.96 — son ciclos, y en bucle se ven bien. `Sitting` y
       `Standing` duran 0.417 y NO son poses: son la TRANSICIÓN de estar de
       pie a estar sentado. En bucle, el robot se sienta y se vuelve a
       levantar dos veces por segundo. Lo confirmé mirando la altura de la
       cadera: oscilaba entre 0.26 y 0.42 sin parar.

       Y lo hice yo: antes `Sitting` casi no salía —sólo con trabajo
       reportado— y al ponerla de estado por defecto, el defecto quedó a la
       vista todo el rato.

       Una transición se toca UNA VEZ y se queda en el último cuadro. `Death`
       igual, por la misma razón y porque un robot no se muere en bucle. */
    const POSES = new Set(['Sitting', 'Standing', 'Death']);
    for(const clip of animaciones){
      const a = mezclador.clipAction(clip);
      if(POSES.has(clip.name)){
        a.setLoop(THREE.LoopOnce, 1);
        a.clampWhenFinished = true;      /* se queda sentado, no rebota */
      }
      acciones[clip.name] = a;
    }
    /* Se apartan los huesos de los brazos: son los que se van a mover a mano
       para teclear. El modelo NO trae animación de teclear —sus catorce clips
       son Dance, Idle, Sitting, Wave y compañía—, así que o se inventa con
       huesos o no hay. Se guardan aquí y no se buscan cada cuadro: recorrer el
       esqueleto sesenta veces por segundo por cada agente es como se calienta
       un teléfono sin que se vea nada distinto. */
    for(const o of [muñeco]) o.traverse(x => {
      if(x.isBone && HUESOS_TECLEO[x.name]) brazos[x.name] = x;
    });
  }

  /* El aro del piso: dice de quién es el puesto aunque el robot esté de
     espaldas. */
  const aro = new THREE.Mesh(
    new THREE.RingGeometry(0.52, 0.62, 40),
    new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.5, side:THREE.DoubleSide }));
  aro.rotation.x = -Math.PI/2; aro.position.y = 0.01;
  g.add(aro);

  /* La silla va DETRÁS del robot (+z local, o sea del lado de la cámara),
     porque el robot mira al escritorio que está en -z. Puesta en el mismo
     sitio que él, se le encajaba en el cuerpo. */
  /* Debajo de la cadera, no detrás: 0.05 en z y el asiento a la altura que se
     midió. El respaldo queda del lado de la cámara, que es la espalda del
     robot — él mira al escritorio, en -z. */
  const silla = hacerSilla(color, ALTO_ASIENTO);
  silla.position.set(0, 0, 0.05);
  g.add(silla);

  const bocadillo = hacerBocadillo();
  g.add(bocadillo.sprite);

  escena.add(g);
  const puesto = { id:quien.id, grupo:g, mesa, mezclador, acciones, aro, silla,
                   bocadillo, brazos, reposo:null, fase: Math.random() * 6.28,
                   actual:null, quien, color };
  puestos.set(quien.id, puesto);
  cambiarAnimacion(puesto, animacionDe(quien));
  pintarPantalla(mesa, quien, '#' + color.getHexString());
  return puesto;
}

/* ══ EL BOCADILLO SOBRE LA CABEZA ══════════════════════════════════════════
   Lo pidió Carlos: «que pueda ver las burbujas de texto de cada integrante
   sobre su cabeza en ese entorno 3D para que esté bien chingón».

   Va como Sprite y no como plano: un Sprite SIEMPRE mira a la cámara sola,
   así que el texto se lee desde cualquier ángulo sin una línea de código que
   lo gire. Un plano habría que orientarlo cuadro por cuadro y se vería de
   canto justo cuando uno rodea el cuarto, que es cuando más se está mirando.

   El lienzo se dibuja al DOBLE de lo que se ve y luego se escala: si se
   dibuja al tamaño final, el texto sale borroso en cuanto uno se acerca —
   que es exactamente lo que uno hace cuando quiere leerlo. */
const BOCADILLO_W = 720, BOCADILLO_H = 300;

function hacerBocadillo(){
  const lienzo = document.createElement('canvas');
  lienzo.width = BOCADILLO_W; lienzo.height = BOCADILLO_H;
  const textura = new THREE.CanvasTexture(lienzo);
  textura.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: textura, transparent:true, depthTest:false,
  }));
  /* `depthTest:false` a propósito: sin eso el bocadillo se mete DENTRO del
     escritorio de quien está adelante y se ve cortado por la mitad. Lo que se
     dice siempre va encima de los muebles. */
  sprite.renderOrder = 10;
  sprite.scale.set(1.5, 0.625, 1);
  sprite.position.set(0, ALTO_AGENTE + 0.62, 0);
  sprite.visible = false;
  return { sprite, lienzo, textura, dice:null };
}

/* Cuánto hace que se dijo, en cristiano. Un bocadillo sin esto miente: se ve
   igual de fresco un mensaje de hace diez segundos que uno de anteayer. */
function haceCuanto(ts){
  const min = Math.round((Date.now() - ts) / 60000);
  if(min < 1)  return 'ahorita';
  if(min < 60) return `hace ${min} min`;
  const h = Math.round(min/60);
  if(h < 24)   return `hace ${h} h`;
  return `hace ${Math.round(h/24)} d`;
}

function pintarBocadillo(b, texto, color, ts){
  const g = b.lienzo.getContext('2d');
  g.clearRect(0, 0, BOCADILLO_W, BOCADILLO_H);

  g.font = '600 30px -apple-system, system-ui, sans-serif';
  const lineas = partir(g, texto, BOCADILLO_W - 84).slice(0, 4);
  /* Si no cabe, se corta el ÚLTIMO renglón con puntos suspensivos en vez de
     tragarse el resto sin avisar: un bocadillo que miente sobre lo que se
     dijo es peor que uno corto. */
  if(partir(g, texto, BOCADILLO_W - 84).length > 4)
    lineas[3] = recortar(g, lineas[3], BOCADILLO_W - 120) ;
  const alto = 92 + lineas.length * 40;
  const y0 = BOCADILLO_H - alto - 34;

  /* la caja */
  g.fillStyle = 'rgba(12,7,20,.93)';
  redondo(g, 12, y0, BOCADILLO_W - 24, alto, 26); g.fill();
  g.strokeStyle = color; g.lineWidth = 4;
  redondo(g, 12, y0, BOCADILLO_W - 24, alto, 26); g.stroke();

  /* el piquito hacia la cabeza */
  g.beginPath();
  g.moveTo(BOCADILLO_W/2 - 20, y0 + alto - 2);
  g.lineTo(BOCADILLO_W/2, y0 + alto + 28);
  g.lineTo(BOCADILLO_W/2 + 20, y0 + alto - 2);
  g.closePath();
  g.fillStyle = 'rgba(12,7,20,.93)'; g.fill();
  g.strokeStyle = color; g.lineWidth = 4; g.stroke();

  /* cuándo */
  g.fillStyle = color; g.font = '600 20px ui-monospace, Menlo, monospace';
  g.fillText(haceCuanto(ts), 42, y0 + 40);

  /* lo dicho */
  g.fillStyle = '#E9E4E4'; g.font = '600 30px -apple-system, system-ui, sans-serif';
  let y = y0 + 82;
  for(const l of lineas){ g.fillText(l, 42, y); y += 40; }

  b.textura.needsUpdate = true;
  b.sprite.visible = true;
}

function cambiarAnimacion(p, nombre){
  if(!p.mezclador || !p.acciones[nombre] || p.actual === nombre) return;
  const nueva = p.acciones[nombre];
  if(p.actual && p.acciones[p.actual]) p.acciones[p.actual].fadeOut(0.35);
  nueva.reset().fadeIn(0.35).play();
  p.actual = nombre;
}

/* ══ LOS DATOS ═══════════════════════════════════════════════════════════ */
let gente = {};
/* Lo último que dijo cada quien, que es lo que va en su bocadillo. */
let ultimoDicho = {};

/* Del hilo completo, el último mensaje DE VERDAD de cada quien. Se saltan los
   de sistema («entró», «salió») porque poner «Carlos entró» flotando sobre la
   cabeza de Carlos no le dice nada a nadie. */
function deLoDicho(hilo){
  const ult = {};
  for(const e of hilo){
    if(!e || !e.de || !e.de.id) continue;
    if(e.tipo === 'sistema') continue;
    const texto = (e.texto || '').trim();
    if(!texto) continue;
    const antes = ult[e.de.id];
    if(!antes || e.ts >= antes.ts) ult[e.de.id] = { texto, ts:e.ts, tipo:e.tipo };
  }
  return ult;
}

/* Cuánto tiempo se queda una burbuja arriba. Media hora: lo bastante para que
   al abrir el taller se vea de qué se está hablando, y lo bastante poco para
   que un cuarto vacío no siga con los globos de anoche puestos. */
const DURA_BOCADILLO = 30 * 60_000;

async function traer(){
  if(DEMO){ ultimoDicho = dichoDemo(); return demo(); }
  try{
    const r = await fetch(`${SERVIDOR}/api/sala/${SALA}/hilo`,
      { headers: LLAVE ? { 'X-Llave': LLAVE } : {} });
    /* Un 401 aquí no es «se cayó la sala»: es que la sala tiene llaves puestas
       y esta pestaña no trae ninguna. Decirlo con el número nada más manda a
       buscar del lado equivocado, que es lo que pasó la primera vez. */
    if(r.status === 401){
      throw new Error('la sala pide llave y esta pestaña no trae ninguna · '
        + 'entra una vez por el link con ?llave=… y queda guardada');
    }
    if(!r.ok) throw new Error(`el servidor contestó ${r.status}`);
    const d = await r.json();
    $('aviso').textContent = '';
    /* ⚠ El hilo YA VENÍA en esta misma respuesta y se estaba tirando. No hizo
       falta una petición nueva ni un endpoint nuevo para las burbujas: hacía
       falta dejar de tirar la mitad de lo que ya se pedía. */
    ultimoDicho = deLoDicho(d.hilo || []);
    return d.gente || {};
  }catch(e){
    $('aviso').textContent = `Sin conexión con la sala · ${e.message}`;
    return gente;                       /* se queda con lo último bueno */
  }
}

function dichoDemo(){

function refrescar(nueva){
  gente = nueva;
  const lista = Object.values(gente);

  /* quitar a los que ya no están */
  for(const [id, p] of puestos){
    if(!gente[id]){ escena.remove(p.grupo); puestos.delete(id); }
  }
  /* poner y actualizar */
  lista.forEach((quien, i) => {
    let p = puestos.get(quien.id);
    if(!p) p = ponerAgente(quien, i, lista.length);
    if(!p) return;                       /* sin 3D sólo se pinta el panel */
    p.quien = quien;
    cambiarAnimacion(p, animacionDe(quien));
    pintarPantalla(p.mesa, quien, '#' + p.color.getHexString());
    /* la pantalla apagada cuando no hay nada: se nota de lejos quién trabaja */
    p.mesa.brillo.intensity = quien.trabajo ? 1.5 : 0.35;
    p.aro.material.opacity  = quien.trabajo ? 0.72 : 0.28;

    /* ── su burbuja ── */
    const dijo = ultimoDicho[quien.id];
    if(dijo && Date.now() - dijo.ts < DURA_BOCADILLO){
      /* Se vuelve a dibujar sólo si CAMBIÓ lo dicho. Repintar un lienzo de
         720×300 sesenta veces por segundo para escribir lo mismo es como se
         calienta un teléfono sin que nada se vea distinto. */
      if(p.bocadillo.dice !== dijo.ts){
        pintarBocadillo(p.bocadillo, dijo.texto,
                        '#' + p.color.getHexString(), dijo.ts);
        p.bocadillo.dice = dijo.ts;
      }
    }else{
      p.bocadillo.sprite.visible = false;
      p.bocadillo.dice = null;
    }
  });
  pintarPanel(lista);
  if(!enFoco && lista.length) enFocar(lista[0].id);
}

/* ── el panel de HTML, que es el que se lee ───────────────────────────── */
function pintarPanel(lista){
  if(!lista.length){
    $('panel').innerHTML = '<div class="nadie">El taller está vacío. Nadie ha entrado a la sala.</div>';
    return;
  }
  $('panel').innerHTML = lista.map(q => {
    const t = q.trabajo;
    const callado = Date.now() - (q.visto || 0) > 5*60_000;
    const clase = (q.estado === 'topado' || q.estado === 'ocupado') ? 'topado'
                : t ? 'trabaja' : callado ? 'dormido' : '';
    const dice  = (q.estado === 'topado') ? 'se topó' : t ? 'trabajando'
                : callado ? 'sin señal' : 'en reposo';
    const pct = t && t.total > 0 ? Math.round(100 * t.va / t.total) : 0;
    return `<div class="ficha ${q.id === enFoco ? 'eldelfoco' : ''}" data-ver="${esc(q.id)}">
      <div class="cab">
        <span class="pastilla" style="background:${esc(q.color || '#AC27FF')}"></span>
        <span class="nom">${esc(q.nombre)}</span>
        <span class="motor">${esc(q.motor || (q.tipo === 'humano' ? 'persona' : 'agente'))}</span>
        <span class="estado ${clase}">${dice}</span>
      </div>
      ${t ? `<div class="enque">${esc(t.en)}</div>
        ${t.paso ? `<div class="paso">› ${esc(t.paso)}</div>` : ''}
        ${t.total > 0 ? `<div class="barrita"><i style="width:${pct}%"></i></div>` : ''}
        ${(t.pasos||[]).length ? `<div class="rastro">${
          t.pasos.slice(-4).map(p => `<div>${esc(p)}</div>`).join('')}</div>` : ''}`
        : `<div class="paso" style="color:var(--muy-tenue)">${
            q.reanuda ? 'puede seguir a las ' + new Date(q.reanuda)
              .toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})
            : 'sin nada en curso'}</div>`}
    </div>`;
  }).join('');
}
