<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Fadori">
  <!--
    El ícono de Fadori · compuesto, no dibujado por un modelo.
    Es el MISMO naranja de la cortinilla y la MISMA crema del logotipo, así que
    tocar el ícono, ver la cortinilla y entrar a la app se siente una sola cosa.
    La "F" es geometría pura —tres barras redondeadas— para que no dependa de
    ninguna tipografía instalada y se vea idéntica en iPhone y en Android.
    El punto es el de "Fadori." y es lo único que no es crema: es el mismo
    rescoldo #FFD9BE que la marca usa en el fondo oscuro.
  -->
  <defs>
    <linearGradient id="ff" x1="0" y1="0" x2=".38" y2="1">
      <stop offset="0" stop-color="#E8590C"/>
      <stop offset=".62" stop-color="#C2410C"/>
      <stop offset="1" stop-color="#A83809"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#ff)"/>
  <!-- maskable: el fondo va a sangre y sólo la F se encoge, para que Android
       pueda recortar en círculo sin comerse nada y sin dejar costura -->
  <g transform="translate(256 256) scale(.78) translate(-256 -256)">
  <g fill="#FFF6EC">
    <rect x="158" y="132" width="66" height="248" rx="18"/>
    <rect x="158" y="132" width="196" height="66" rx="18"/>
    <rect x="158" y="236" width="152" height="62" rx="18"/>
  </g>
  <circle cx="326" cy="345" r="35" fill="#FFD9BE"/>
  </g>
</svg>
