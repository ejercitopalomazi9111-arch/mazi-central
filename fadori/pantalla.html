<!doctype html>
<html lang="es-MX" data-tema="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fadori · turnos</title>
<meta name="theme-color" content="#120A06">
<link rel="icon" href="marca/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="marca/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Turnos">
<link rel="stylesheet" href="estilo.css">

<style>
  /* LA PANTALLA DE TURNOS · se ve DE LEJOS, en el recreo.
     En grande, el podcast de la escuela con su marco de televisión, y cada
     tanto una tanda de anuncios de la escuela. En la esquina, el turno que ya
     puede pasar con LO QUE PIDIÓ (eso sí se recuerda; el número 75 no) y,
     sólo si quien pidió dijo que sí, su primer nombre. Va siempre en oscuro:
     es una tele. */
  :root{ --tv-fondo:#0D0805; --tv-sup:#1A110B; --tv-sup2:#24170F; --tv-linea:#3A271A; --tv-tinta:#FFF4E8; --tv-tenue:#C9AE96;
    --tv-verde:#7CD957; --tv-verde-hondo:#1E3A10; --tv-naranja:#FF7A2E; --tv-rojo:#E0473C }
  html, body{background:var(--tv-fondo); color:var(--tv-tinta)}
  body.tele{margin:0; min-height:100vh; overflow:hidden; font-family:var(--fam, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif)}
  .tv{height:100vh; height:100dvh; display:grid; grid-template-rows:auto minmax(0, 1fr) auto; transform-origin:50% 50%}
  .tv.regresa{animation:tv-regresa .7s cubic-bezier(.2,.9,.3,1) both}
  @keyframes tv-regresa{from{transform:scale(1.35); filter:blur(6px)} to{transform:scale(1); filter:none}}

  .tv-cab{display:flex; align-items:center; gap:clamp(10px,1.6vw,20px); padding:clamp(10px,1.8vh,18px) clamp(16px,2.4vw,32px)}
  .tv-logo{width:clamp(34px,4vw,52px); height:auto; border-radius:12px}
  .tv-marca{font-size:clamp(22px,2.8vw,38px); font-weight:900; letter-spacing:-.04em}
  .tv-marca b{color:var(--tv-naranja)}
  .tv-recreo{display:inline-flex; align-items:center; gap:8px; padding:6px 14px; border-radius:999px; background:var(--tv-sup);
    border:1px solid var(--tv-linea); font-weight:800; color:var(--tv-tenue); font-size:clamp(13px,1.4vw,18px)}
  .tv-recreo[hidden]{display:none}
  .tv-recreo .i{width:1.1em; height:1.1em; color:var(--tv-naranja)}
  .tv-nube{margin-left:auto; max-width:40vw; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; padding:6px 12px; border-radius:999px;
    background:var(--tv-sup); border:1px solid var(--tv-linea); color:var(--tv-tenue); font-weight:800; font-size:clamp(12px,1.2vw,15px)}
  .tv-nube[hidden]{display:none}
  .tv-nube:not([hidden]) + .tv-reloj{margin-left:0}
  .tv-reloj{margin-left:auto; font-size:clamp(24px,3.4vw,46px); font-weight:900; letter-spacing:-.03em; font-variant-numeric:tabular-nums}
  .tv-boton{border:1px solid var(--tv-linea); background:var(--tv-sup); color:var(--tv-tenue); width:44px; height:44px; border-radius:14px;
    display:grid; place-items:center; cursor:pointer; opacity:.55}
  .tv-boton:hover, .tv-boton:focus-visible{opacity:1}
  .tv-boton .i{width:22px; height:22px}

  .tv-cuerpo{display:grid; grid-template-columns:minmax(0, 2.25fr) minmax(260px, 1fr); gap:clamp(12px,1.6vw,22px);
    padding:0 clamp(16px,2.4vw,32px) clamp(10px,1.6vh,18px); min-height:0}
  @media (orientation:portrait){ .tv-cuerpo{grid-template-columns:1fr; grid-template-rows:auto minmax(0, 1fr)} }

  /* ── el escenario: la tele dentro de la tele ── */
  .escenario{min-width:0; min-height:0; display:grid; place-items:center}
  .marco{position:relative; width:100%; max-height:100%; aspect-ratio:16/9; border-radius:clamp(16px,1.8vw,28px); overflow:hidden; background:#000;
    box-shadow:0 0 0 2px rgba(255,122,46,.55), 0 0 0 clamp(5px,.6vw,8px) var(--tv-sup2), 0 0 0 calc(clamp(5px,.6vw,8px) + 2px) var(--tv-linea),
      0 30px 80px rgba(0,0,0,.6), 0 0 120px rgba(255,122,46,.12)}
  @supports not (aspect-ratio:16/9){ .marco{height:0; padding-top:56.25%} }
  .marco video, .marco canvas{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000}
  .marco canvas{object-fit:fill}
  .marco canvas[hidden], .marco video[hidden]{display:none}
  .bicho{position:absolute; top:clamp(10px,1.4vw,18px); right:clamp(12px,1.6vw,22px); display:flex; align-items:center; gap:8px; opacity:.85;
    font-weight:900; font-size:clamp(10px,1vw,14px); letter-spacing:.12em; text-shadow:0 1px 4px #000; pointer-events:none}
  .bicho img{width:clamp(26px,2.6vw,40px); height:auto; filter:drop-shadow(0 1px 3px #000)}
  .tercio{position:absolute; left:clamp(12px,1.6vw,22px); bottom:clamp(12px,1.6vw,22px); right:clamp(12px,1.6vw,22px); display:flex; align-items:center;
    gap:12px; pointer-events:none; transition:opacity .4s}
  .tercio .vivo{flex:none; background:var(--tv-rojo); color:#fff; font-weight:900; font-size:clamp(10px,1vw,14px); letter-spacing:.14em;
    padding:6px 10px; border-radius:8px; display:inline-flex; align-items:center; gap:6px}
  .tercio .vivo i{width:8px; height:8px; border-radius:50%; background:#fff; animation:latido 1.4s ease-in-out infinite}
  @keyframes latido{50%{opacity:.25}}
  .tercio .que{background:rgba(10,6,4,.72); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); padding:8px 14px; border-radius:10px;
    min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-weight:800; font-size:clamp(12px,1.3vw,19px)}
  .tercio .que small{color:var(--tv-tenue); font-weight:700; margin-left:8px}
  .barrita{position:absolute; left:0; right:0; bottom:0; height:4px; background:rgba(255,255,255,.08)}
  .barrita i{display:block; height:100%; width:0; background:var(--tv-naranja)}
  .sin-prog{position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:24px; color:var(--tv-tenue);
    font-weight:800; font-size:clamp(14px,1.6vw,22px)}
  .sin-prog[hidden]{display:none}

  /* el aviso grande: «¡Turno 75, ya está!» encima del programa */
  .llamado{position:absolute; left:4%; right:4%; bottom:6%; border-radius:clamp(16px,1.6vw,26px); padding:clamp(14px,2vw,26px) clamp(18px,2.4vw,32px);
    background:linear-gradient(120deg, #2D5A14, #17330A); box-shadow:0 0 0 3px var(--tv-verde) inset, 0 20px 60px rgba(0,0,0,.6);
    display:flex; align-items:center; gap:clamp(16px,2.2vw,32px); transform:translateY(140%); transition:transform .6s cubic-bezier(.2,1.25,.4,1)}
  .llamado.sale{transform:none}
  .llamado .n{font-size:clamp(56px,8vw,128px); font-weight:900; letter-spacing:-.06em; line-height:.9; color:#F2FFE6; font-variant-numeric:tabular-nums}
  .llamado .t{min-width:0}
  .llamado .t b{display:block; font-size:clamp(18px,2.4vw,36px); letter-spacing:-.02em; color:#C9F0A8}
  .llamado .t span{display:block; font-size:clamp(14px,1.7vw,24px); font-weight:700; color:#fff; margin-top:4px}
  @media (prefers-reduced-motion: reduce){ .llamado{transition:none} .tercio .vivo i{animation:none} }

  /* ── la esquina de los turnos ── */
  .turnos{min-width:0; min-height:0; display:flex; flex-direction:column; gap:clamp(10px,1.4vh,16px); overflow:hidden}
  .llamando{border-radius:clamp(18px,1.8vw,28px); padding:clamp(14px,1.8vw,24px); background:linear-gradient(165deg, #1E3A10, #12260A);
    box-shadow:0 0 0 2px #3F6B23 inset; transition:transform .3s}
  .llamando.brinca{animation:brinca .9s cubic-bezier(.2,1.4,.4,1)}
  @keyframes brinca{30%{transform:scale(1.05)}}
  .llamando h2{margin:0; display:flex; align-items:center; gap:10px; font-size:clamp(14px,1.4vw,20px); color:#C9F0A8; letter-spacing:.02em}
  .llamando h2 .i{width:1.2em; height:1.2em}
  .llamando .n{display:block; font-size:clamp(72px,8vw,140px); font-weight:900; letter-spacing:-.06em; line-height:.95; color:#F2FFE6;
    font-variant-numeric:tabular-nums; margin-top:4px}
  .llamando .quien{display:block; font-size:clamp(18px,1.9vw,28px); font-weight:900; color:#fff}
  .llamando .pidio{display:block; font-size:clamp(14px,1.4vw,20px); font-weight:700; color:#D8F5C2; margin-top:4px; line-height:1.3}
  .llamando .vacio{display:block; margin-top:8px; color:#9FC983; font-weight:700; font-size:clamp(14px,1.4vw,19px)}
  .bloque h3{margin:0 0 8px; display:flex; align-items:center; gap:8px; font-size:clamp(13px,1.25vw,17px); color:var(--tv-tenue)}
  .bloque h3 .i{width:1.1em; height:1.1em; color:var(--tv-naranja)}
  .bloque h3 .cuenta{margin-left:auto; font-variant-numeric:tabular-nums}
  .fichas{display:flex; flex-direction:column; gap:6px}
  .ficha{display:flex; align-items:baseline; gap:10px; padding:8px 12px; border-radius:14px; background:var(--tv-sup); border:1px solid var(--tv-linea); min-width:0}
  .ficha b{font-size:clamp(20px,2vw,30px); font-weight:900; letter-spacing:-.04em; font-variant-numeric:tabular-nums; flex:none; min-width:2.2ch}
  .ficha span{min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; color:var(--tv-tenue); font-weight:700; font-size:clamp(12px,1.15vw,16px)}
  .ficha.lista{background:#1A3110; border-color:#3F6B23} .ficha.lista b{color:#C9F0A8}
  .ficha.prep b{color:var(--tv-naranja)}
  .ficha.nueva{animation:nueva 1.6s ease-out}
  @keyframes nueva{0%{box-shadow:0 0 0 4px var(--tv-naranja); transform:scale(1.06)} 100%{box-shadow:0 0 0 0 transparent}}
  .numeros{display:flex; flex-wrap:wrap; gap:6px}
  .numeros b{padding:4px 10px; border-radius:10px; background:var(--tv-sup); border:1px solid var(--tv-linea); font-size:clamp(16px,1.5vw,22px);
    font-variant-numeric:tabular-nums}
  .numeros b.nueva{animation:nueva 1.6s ease-out}
  .mas{color:var(--tv-tenue); font-weight:700; font-size:14px; margin:6px 0 0}

  .tv-pie{display:flex; align-items:center; gap:clamp(12px,1.6vw,20px); padding:clamp(8px,1.4vh,14px) clamp(16px,2.4vw,32px);
    border-top:1px solid var(--tv-linea); background:var(--tv-sup)}
  .tv-pie img{width:clamp(48px,5vw,72px); height:auto; background:#fff; border-radius:10px; padding:4px}
  .tv-pie b{display:block; font-size:clamp(16px,1.7vw,24px); letter-spacing:-.02em}
  .tv-pie span{font-size:clamp(12px,1.25vw,16px); color:var(--tv-tenue)}
  .toca{margin-left:auto; display:none; align-items:center; gap:10px; padding:10px 18px; border-radius:999px; background:var(--tv-naranja);
    color:#1A0F0A; font-weight:900; font-size:clamp(14px,1.5vw,20px); animation:llama 2.4s ease-in-out infinite}
  .toca .i{width:1.3em; height:1.3em}
  .con-tablet .toca{display:inline-flex}
  @keyframes llama{50%{box-shadow:0 0 0 10px rgba(255,122,46,.18)}}
  .saltos{margin-left:auto; opacity:.3; display:flex; gap:12px; font-size:13px}
  .con-tablet .saltos{display:none}
  .saltos a{color:var(--tv-tenue)}

  /* la primera vez: tocar para que haya sonido (los navegadores lo exigen) */
  .arranque{position:fixed; inset:0; z-index:40; display:grid; place-items:center; background:rgba(13,8,5,.78);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px)}
  .arranque[hidden]{display:none}
  .arranque button{border:0; border-radius:28px; padding:26px 36px; background:var(--tv-naranja); color:#1A0F0A; font:inherit; font-weight:900;
    font-size:clamp(20px,2.6vw,34px); display:flex; flex-direction:column; align-items:center; gap:10px; cursor:pointer}
  .arranque button .i{width:56px; height:56px}
  .arranque small{font-size:15px; font-weight:700; opacity:.8}
  .mudo{position:fixed; right:16px; bottom:16px; z-index:30; display:none}

  /* ── el modo tablet: la app encima, con el turno en chiquito arriba ── */
  .k-capa-tv{position:fixed; inset:0; z-index:50; display:grid; grid-template-rows:auto minmax(0, 1fr); background:var(--fondo, #F3ECE1)}
  .k-capa-tv[hidden]{display:none}
  .k-capa-tv.entra{animation:k-abre .45s cubic-bezier(.2,.9,.3,1) both}
  .k-capa-tv.sale{animation:k-cierra .6s cubic-bezier(.6,0,.8,.4) both}
  @keyframes k-abre{from{transform:scale(.2); opacity:0; border-radius:40px}}
  @keyframes k-cierra{to{transform:scale(.06); opacity:0; border-radius:60px}}
  .k-tira{display:flex; align-items:center; gap:12px; padding:8px 12px; background:#1A0F0A; color:#FFF4E8}
  .k-mini{display:inline-flex; align-items:center; gap:10px; padding:4px 12px 4px 6px; border-radius:999px; background:#1E3A10; box-shadow:0 0 0 1px #3F6B23 inset}
  .k-mini small{font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#C9F0A8; padding-left:8px}
  .k-mini b{font-size:24px; font-weight:900; letter-spacing:-.04em; font-variant-numeric:tabular-nums; color:#F2FFE6}
  .k-mini span{color:#9FC983; font-weight:700; font-size:13px}
  /* el turno chiquito de la tablet con los TRES estados (14 de octubre) */
  .k-mini{gap:6px; padding:4px 6px; overflow:hidden; max-width:calc(100vw - 230px); background:none; box-shadow:none}
  .k-est{display:inline-flex; align-items:center; gap:6px; padding:3px 10px 3px 4px; border-radius:999px; white-space:nowrap}
  .k-est small{padding-left:6px}
  .k-est i{font-style:normal; font-weight:900; font-variant-numeric:tabular-nums; font-size:17px}
  .k-est em{font-style:normal; font-size:12px; opacity:.8}
  .k-est.listo{background:#1E3A10; box-shadow:0 0 0 1px #3F6B23 inset} .k-est.listo i{color:#C9F0A8}
  .k-est.prep{background:#3A2210; box-shadow:0 0 0 1px #6B3F23 inset} .k-est.prep small, .k-est.prep i{color:#FFB37A}
  .k-est.fila{background:#24170F; box-shadow:0 0 0 1px #3A271A inset} .k-est.fila small{color:#C9B6A4} .k-est.fila i{color:#FFF4E8}
  @media (max-width:900px){ .k-est.fila{display:none} }
  .k-tira .crece{flex:1}
  .k-tira button{border:1px solid #3A271A; background:#24170F; color:#FFF4E8; border-radius:12px; min-height:40px; padding:0 14px; font:inherit;
    font-weight:800; font-size:14px; display:inline-flex; align-items:center; gap:6px; cursor:pointer}
  .k-tira button .i{width:18px; height:18px}
  /* el programa en chiquito, en una esquina, mientras alguien pide en la tablet */
  body.con-pip .marco{position:fixed; z-index:60; top:calc(64px + env(safe-area-inset-top)); right:12px; width:min(26vw, 380px) !important; min-width:200px;
    height:auto; border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.45), 0 0 0 2px rgba(255,255,255,.18); pointer-events:none}
  body.con-pip .marco .tercio, body.con-pip .marco .pop-fadori, body.con-pip .marco .bicho{display:none}
  body.con-pip .marco .llamado{transform:scale(.55); transform-origin:left bottom}
  .k-capa-tv iframe{border:0; width:100%; height:100%; background:var(--fondo, #F3ECE1)}

  /* ── los ajustes ── */
  dialog.ajustes{width:min(720px, calc(100vw - 24px)); max-height:calc(100vh - 24px); border:0; border-radius:24px; padding:0;
    background:var(--tv-sup); color:var(--tv-tinta); box-shadow:0 30px 90px rgba(0,0,0,.7)}
  dialog.ajustes::backdrop{background:rgba(0,0,0,.6)}
  .aj-cab{position:sticky; top:0; display:flex; align-items:center; gap:10px; padding:16px 18px; background:var(--tv-sup); border-bottom:1px solid var(--tv-linea); z-index:2}
  .aj-cab h2{margin:0; font-size:20px; flex:1}
  .aj-cuerpo{padding:6px 18px 22px}
  .aj-cuerpo h3{margin:20px 0 8px; font-size:16px; display:flex; align-items:center; gap:8px}
  .aj-cuerpo h3 .i{width:20px; height:20px; color:var(--tv-naranja)}
  .aj-nota{margin:0 0 10px; color:var(--tv-tenue); font-size:14px}
  .aj-lista{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
  .aj-lista li{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:14px; background:var(--tv-sup2); border:1px solid var(--tv-linea)}
  .aj-lista li > span{flex:1; min-width:0}
  .aj-lista input[type=text]{width:100%; min-height:40px; border-radius:10px; border:1px solid var(--tv-linea); background:var(--tv-fondo); color:var(--tv-tinta);
    padding:0 10px; font:inherit; font-size:15px}
  .aj-lista small{display:block; color:var(--tv-tenue); font-size:12.5px; margin-top:2px}
  .aj-lista li > span.aj-color{width:14px; height:14px; border-radius:50%; flex:none}
  .aj-btn{border:1px solid var(--tv-linea); background:var(--tv-sup2); color:var(--tv-tinta); border-radius:12px; min-height:44px; min-width:44px;
    padding:0 14px; font:inherit; font-weight:800; font-size:14px; display:inline-flex; align-items:center; justify-content:center; gap:6px; cursor:pointer}
  .aj-btn.fuerte{background:var(--tv-naranja); color:#1A0F0A; border-color:transparent}
  .aj-btn .i{width:18px; height:18px}
  .aj-btn:disabled{opacity:.4}
  .aj-btn.seguro{background:var(--tv-rojo); color:#fff; border-color:transparent}
  .aj-fila{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .aj-chip{border:1px solid var(--tv-linea); background:var(--tv-sup2); color:var(--tv-tinta); border-radius:999px; min-height:40px; padding:0 14px;
    font:inherit; font-weight:800; font-size:14px; cursor:pointer}
  .aj-chip[aria-pressed="true"]{background:var(--tv-naranja); color:#1A0F0A; border-color:transparent}
  .aj-sw{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--tv-linea); font-weight:700}
  .aj-sw span{flex:1}
  .aj-sw input{width:26px; height:26px; min-height:0; padding:0; flex:none; accent-color:var(--tv-naranja)}
  dialog.ajustes label{margin:0}
  .aj-sw{font-size:15px; color:var(--tv-tinta)}
  .aj-lista input[type=checkbox]{min-height:0; padding:0; flex:none}
  .aj-edita{display:grid; gap:8px; margin:6px 0 4px; padding:10px; border-radius:12px; background:var(--tv-fondo)}
  .aj-edita[hidden]{display:none}
  .aj-edita label{display:flex; flex-direction:column; gap:4px; font-size:13px; font-weight:800; color:var(--tv-tenue)}
  .aj-edita input{min-height:40px; border-radius:10px; border:1px solid var(--tv-linea); background:var(--tv-sup); color:var(--tv-tinta); padding:0 10px; font:inherit}
  .aj-estado{padding:12px 14px; border-radius:14px; background:var(--tv-sup2); border:1px solid var(--tv-linea); font-weight:700; margin-bottom:10px}
  .aj-estado.bien{border-color:#3F6B23; background:#132608; color:#C9F0A8}
  [hidden]{display:none !important}

  /* ── lo que pasa cuando no hay episodio nuevo ── */
  .marco{container-type:inline-size}
  .marco iframe#progWeb{position:absolute; inset:0; width:100%; height:100%; border:0; background:#000}
  .portada{position:absolute; inset:0; display:grid; grid-template-columns:auto minmax(0, 1fr); align-items:center; gap:5cqw; padding:7cqw 8cqw; overflow:hidden; background:#120A06}
  .pt-fondo{position:absolute; inset:-12%; background:center/cover no-repeat; filter:blur(48px) saturate(1.5) brightness(.5); transform:scale(1.1)}
  .portada.sin-tapa .pt-fondo{filter:blur(60px) saturate(1.2) brightness(.35)}
  .pt-tapa{position:relative; width:30cqw; aspect-ratio:1; object-fit:cover; border-radius:1.4cqw; box-shadow:0 2cqw 6cqw rgba(0,0,0,.6);
    animation:pt-respira 6s ease-in-out infinite}
  .portada.sin-tapa .pt-tapa{object-fit:contain; background:#1A110B; padding:3cqw}
  @keyframes pt-respira{50%{transform:scale(1.025)}}
  .pt-datos{position:relative; min-width:0; display:flex; flex-direction:column; gap:.8cqw}
  .pt-datos small{display:flex; align-items:center; gap:.8cqw; font-size:1.6cqw; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--tv-naranja)}
  .pt-datos small .i{width:2cqw; height:2cqw}
  .pt-datos b{font-size:4.6cqw; line-height:1.02; letter-spacing:-.03em; overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical}
  .pt-datos > span{font-size:2.4cqw; font-weight:700; color:var(--tv-tenue)}
  .pt-ondas{display:flex; align-items:flex-end; gap:.6cqw; height:4cqw; margin-top:1.4cqw}
  .pt-ondas i{width:.9cqw; height:100%; border-radius:1cqw; background:var(--tv-naranja); transform-origin:50% 100%; animation:pt-onda 1.1s ease-in-out infinite}
  .pt-ondas i:nth-child(2){animation-delay:-.3s} .pt-ondas i:nth-child(3){animation-delay:-.7s} .pt-ondas i:nth-child(4){animation-delay:-.15s}
  .pt-ondas i:nth-child(5){animation-delay:-.5s} .pt-ondas i:nth-child(6){animation-delay:-.9s} .pt-ondas i:nth-child(7){animation-delay:-.4s}
  @keyframes pt-onda{0%,100%{transform:scaleY(.25)} 50%{transform:scaleY(1)}}

  /* ── el aviso de Fadori a un lado: entra desde la izquierda, a media
     altura, sin tapar el centro ni el letrero de abajo ── */
  .pop-fadori{position:absolute; left:2.2cqw; top:50%; width:30cqw; display:grid; grid-template-columns:minmax(0, 1fr) auto; grid-template-areas:"plato plato" "txt qr";
    gap:1cqw 1.2cqw; align-items:end; padding:1.6cqw; border-radius:2cqw; background:linear-gradient(165deg, #E8590C, #C2410C 62%, #A83809); color:#FFF6EC;
    box-shadow:0 1.6cqw 4cqw rgba(0,0,0,.55), 0 0 0 .25cqw rgba(255,217,190,.35) inset;
    transform:translate(-120%, -50%) rotate(-4deg); opacity:0; pointer-events:none;
    transition:transform .7s cubic-bezier(.2,1.3,.4,1), opacity .3s}
  .pop-fadori.sale{transform:translate(0, -50%) rotate(0); opacity:1}
  .pf-plato{grid-area:plato; display:grid; place-items:center}
  .pop-fadori .burger{width:15cqw}
  .pf-txt{grid-area:txt; min-width:0; display:flex; flex-direction:column; gap:.3cqw}
  .pf-marca{font-size:2.6cqw; font-weight:900; letter-spacing:-.04em; line-height:1}
  .pf-marca i{font-style:normal; color:#FFD9BE}
  .pf-txt b:not(.pf-marca){font-size:1.9cqw; line-height:1.1}
  .pf-txt span{font-size:1.55cqw; font-weight:700; color:rgba(255,246,236,.88); line-height:1.2}
  .pf-qr{grid-area:qr; width:7cqw; height:auto; background:#fff; border-radius:.8cqw; padding:.4cqw}

  /* ══ EN VIVO · el partido encima del programa (transmision.js) ══ */
  .tv-vivo{position:absolute; inset:0; z-index:4; background:#000}
  .tv-vivo[hidden]{display:none}
  .tv-vivo:not(.con-video){background:transparent}
  .tv-vivo-video, .tv-vivo-web{position:absolute; inset:0; width:100%; height:100%; border:0; object-fit:contain; background:#000}
  .tv-vivo:not(.con-video) .tv-vivo-video, .tv-vivo:not(.con-video) .tv-vivo-web, .tv-vivo:not(.con-video) .tv-envivo{display:none}
  .tv-vivo-sin{position:absolute; inset:0; display:grid; place-items:center; padding:8%; text-align:center; color:#FFF4E8; font-weight:800; font-size:clamp(16px,2.6cqw,34px)}
  .tv-vivo-sin[hidden]{display:none}
  .tv-envivo{position:absolute; right:2.5%; top:4%; display:inline-flex; align-items:center; gap:.5em; padding:.35em .8em; border-radius:999px; background:#D7263D; color:#fff;
    font-weight:900; letter-spacing:.12em; font-size:clamp(11px,1.5cqw,20px)}
  .tv-envivo i{width:.6em; height:.6em; border-radius:50%; background:#fff; animation:latido 1.2s ease-in-out infinite}
  @keyframes latido{50%{opacity:.25}}
  .tv-marcador{position:absolute; left:2.5%; top:4%; display:flex; align-items:stretch; border-radius:clamp(8px,1.2cqw,16px); overflow:hidden;
    box-shadow:0 6px 22px rgba(0,0,0,.45); font-size:clamp(13px,2.1cqw,30px); font-weight:900; color:#fff; background:#141018}
  .tv-marcador[hidden]{display:none}
  .tv-marcador .tm-eq{display:flex; align-items:center; gap:.45em; padding:.35em .7em; background:#1E1824; max-width:9em; overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
  .tv-marcador .tm-eq i{width:.5em; align-self:stretch; background:var(--c); border-radius:3px; flex:none}
  .tv-marcador .tm-pts{display:grid; place-items:center; min-width:1.7em; padding:.35em .45em; background:#fff; color:#141018; font-variant-numeric:tabular-nums; font-size:1.15em}
  .tv-marcador .tm-pts + .tm-pts{border-left:2px solid #D9D2C8}
  .tv-marcador .tm-reloj{display:grid; place-items:center; padding:.35em .7em; background:#C2410C; font-variant-numeric:tabular-nums}
  .tv-marcador .tm-per{display:grid; place-items:center; padding:.35em .6em; background:#2A2230; color:#FFD9BE; font-size:.8em}
  .tv-marcador.gol{animation:gol 1.6s cubic-bezier(.2,1.4,.4,1)}
  @keyframes gol{0%{transform:scale(1)} 20%{transform:scale(1.25)} 40%{transform:scale(1); box-shadow:0 0 0 8px rgba(255,200,80,.6)} 100%{transform:scale(1)}}
  .tv-llaves{position:absolute; inset:0; padding:3% 3% 4%; background:radial-gradient(circle at 30% 20%, #2A1A0E, #0E0907 70%); color:#FFF4E8; overflow:hidden; container-type:size}
  .tv-llaves[hidden]{display:none}
  .tv-vivo.con-video .tv-llaves{background:rgba(14,9,7,.9)}
  .tv-ll{height:100%; display:flex; flex-direction:column; gap:2cqh}
  .tv-ll h3{margin:0; font-size:clamp(16px,6cqh,52px); font-weight:900; letter-spacing:-.02em}
  .tv-ll-rondas{flex:1; min-height:0; display:flex; gap:2cqw}
  .tv-ll-ronda{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:space-around; gap:1.2cqh}
  .tv-ll-ronda > small{font-size:clamp(10px,2.6cqh,20px); font-weight:800; text-transform:uppercase; letter-spacing:.1em; color:#FFB37A}
  .tv-ll-p{border-radius:clamp(6px,1.4cqh,14px); overflow:hidden; background:#24170F; box-shadow:0 0 0 1px #3A271A inset}
  .tv-ll-e{display:flex; justify-content:space-between; gap:.6em; padding:.3em .6em; font-size:clamp(11px,3.4cqh,28px); font-weight:800}
  .tv-ll-e + .tv-ll-e{border-top:1px solid #3A271A}
  .tv-ll-e span{min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
  .tv-ll-e b{font-variant-numeric:tabular-nums}
  .tv-ll-e.gano{background:#1E3A10; color:#C9F0A8}
  .tv-ll-e.perdio{opacity:.45}
  .tv-ll-e.hueco{opacity:.4; font-style:italic}
  .tv-ll-ronda.campeon{justify-content:center}
  .tv-ll-copa{padding:.6em .8em; border-radius:clamp(8px,2cqh,18px); background:linear-gradient(160deg,#C8901E,#8A6212); color:#fff; font-weight:900; font-size:clamp(12px,4.4cqh,40px); text-align:center}
  .tv-ll-vacio{display:grid; place-items:center; height:100%; font-size:clamp(14px,4cqh,30px)}
  @media (prefers-reduced-motion: reduce){ .pop-fadori{transition:opacity .3s} .pt-tapa, .pt-ondas i{animation:none} }

  /* ══ EL ACOMODO DE UN VISTAZO (10 de octubre) ══════════════════════════
     Nada de espacio muerto: a la derecha, de arriba abajo, «Ya puede pasar»
     ENORME; debajo del programa, una franja con lo que sigue (en la plancha
     y en la fila) con números grandes. Los tamaños van en vh: en una tele de
     1080 o en la tablet, ocupan lo mismo de la pantalla. */
  .tv-cab{padding-top:clamp(6px,1.2vh,14px); padding-bottom:clamp(6px,1.2vh,14px)}
  /* El programa arriba a lo ancho de su columna, y TODO lo que sobra de alto
     es para lo que sigue: antes el programa se centraba y dejaba dos franjas
     muertas, arriba y abajo. */
  .tv-cuerpo{grid-template-columns:minmax(0, 1.7fr) minmax(0, 1fr); grid-template-rows:auto minmax(0, 1fr);
    grid-template-areas:"escena llamado" "siguen llamado"; gap:clamp(10px,1.6vh,20px) clamp(12px,1.4vw,22px)}
  .escenario{grid-area:escena; display:grid; place-items:start center}
  .marco{width:min(100%, calc(64dvh * 16 / 9)); max-height:none}
  .turnos{grid-area:llamado; gap:clamp(8px,1.4vh,14px)}
  .siguen{grid-area:siguen; display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1.2fr); gap:clamp(10px,1.4vw,20px);
    background:var(--tv-sup); border:1px solid var(--tv-linea); border-radius:clamp(16px,1.6vw,24px); padding:clamp(10px,1.6vh,18px) clamp(12px,1.4vw,22px)}
  .llamando{flex:1; display:flex; flex-direction:column; justify-content:safe center; min-height:0; overflow:hidden}
  .llamando h2{font-size:clamp(16px,2.8vh,30px)}
  .llamando .n{font-size:clamp(90px,24vh,300px); margin:0}
  .llamando .quien{font-size:clamp(20px,4.4vh,48px)}
  .llamando .pidio{font-size:clamp(15px,2.9vh,30px)}
  .llamando .vacio{font-size:clamp(16px,2.8vh,28px)}
  .bloque h3{font-size:clamp(13px,2.3vh,24px)}
  .ficha b{font-size:clamp(22px,4.2vh,46px)}
  .ficha span{font-size:clamp(13px,2.2vh,22px)}
  .numeros b{font-size:clamp(20px,4.6vh,52px); padding:clamp(2px,.5vh,6px) clamp(8px,1vw,16px); border-radius:clamp(8px,1vh,14px)}
  .numeros b.primero{background:var(--tv-naranja); color:#1A0F0A; border-color:transparent}
  /* la franja de lo que sigue llena su alto: números a la medida del espacio */
  .siguen{container-type:size; min-height:clamp(110px,18vh,400px); align-content:start}
  .siguen .numeros{gap:clamp(6px,1.2cqw,14px)}
  .siguen .numeros b{font-size:clamp(20px, min(26cqh, 5.6cqw), 96px); line-height:1.1}
  .siguen .ficha b{font-size:clamp(22px, min(20cqh, 5cqw), 64px)}
  .siguen .ficha span{font-size:clamp(13px, min(9cqh, 2.2cqw), 26px)}
  .siguen .bloque h3{font-size:clamp(13px, min(10cqh, 2.4cqw), 26px)}
  /* sin nadie listo, el recuadro grande dice quién sigue */
  .llamando .sigue{display:block; margin-top:clamp(8px,2vh,24px); font-size:clamp(15px,2.6vh,28px); font-weight:800; color:#9FC983}
  .llamando .sigue small{display:block; font-size:.7em; color:#C9F0A8; margin-top:4px}
  .encaje{display:flex; flex-direction:column; min-width:0; transform-origin:top left}
  .siguen > .bloque{overflow:hidden; min-height:0}
  #bListos{max-height:42%; overflow:hidden; flex:none}
  #bListos:empty{display:none}
  /* LA FILA LIBRE: que se note de lejos que no hay nadie y que se pide en la app */
  .llamando.libre-ya{background:linear-gradient(165deg, #2A1A0E, #1A0F0A); border-color:#5A3A22}
  .llamando.libre-ya h2{color:#FFB37A}
  .llamando .libre{display:block; font-size:clamp(34px,7vh,96px); font-weight:900; letter-spacing:-.03em; line-height:1; color:#FFF4E8; margin-top:clamp(6px,1.4vh,16px)}
  .llamando .qr-libre{display:block; width:clamp(90px,22vh,260px); height:auto; margin-top:clamp(10px,2vh,24px); background:#FFFDF9; border-radius:clamp(10px,1.4vh,18px); padding:clamp(6px,1vh,12px)}
  .llamando .sigue b{display:block; font-size:clamp(60px,15vh,200px); font-weight:900; letter-spacing:-.06em; line-height:.95; color:var(--tv-naranja); font-variant-numeric:tabular-nums}
  /* con una canción, el aviso entra por la derecha y la carátula le hace lugar */
  .portada{transition:padding .6s cubic-bezier(.2,.9,.3,1)}
  .portada.con-pop{padding-right:36cqw}
  .pop-fadori.derecha{left:auto; right:2.2cqw; transform:translate(120%, -50%) rotate(4deg)}
  .pop-fadori.derecha.sale{transform:translate(0, -50%) rotate(0)}
  .siguen .fichas{flex-direction:row; flex-wrap:wrap}
  .siguen .ficha{flex:1 1 220px}
  .tv-pie{padding-top:clamp(6px,1vh,12px); padding-bottom:clamp(6px,1vh,12px)}
  .tv-pie img{width:clamp(44px,7vh,80px)}
  /* SÓLO TURNOS: sin nada que pasar, a la izquierda «Ya puede pasar» enorme y
     a la derecha la plancha y la fila, una arriba de la otra */
  body.solo-turnos .escenario{display:none}
  body.solo-turnos .tv-cuerpo{grid-template-columns:minmax(0, 1.15fr) minmax(0, 1fr); grid-template-rows:minmax(0, 1fr); grid-template-areas:"llamado siguen"}
  body.solo-turnos .siguen{grid-template-columns:minmax(0, 1fr); grid-template-rows:auto minmax(0, 1fr); align-content:stretch; min-height:0}
  body.solo-turnos .llamando .n{font-size:clamp(120px,34vh,420px)}
  body.solo-turnos .llamando .sigue b{font-size:clamp(90px,24vh,300px)}
  body.solo-turnos .siguen > *{min-width:0}
  body.solo-turnos .siguen .fichas{flex-direction:column; gap:clamp(6px,1.4cqh,14px)}
  body.solo-turnos .siguen .ficha{flex:none; padding:clamp(8px,1.6cqh,18px) clamp(12px,2.4cqw,24px); align-items:center}
  /* la columna de la derecha se llena: los números crecen con su caja */
  body.solo-turnos .siguen .bloque h3{font-size:clamp(16px, min(4cqh, 4.4cqw), 36px)}
  body.solo-turnos .siguen .ficha b{font-size:clamp(34px, min(10cqh, 11cqw), 120px)}
  body.solo-turnos .siguen .ficha span{font-size:clamp(15px, min(3.4cqh, 3.8cqw), 34px)}
  body.solo-turnos .siguen .numeros{max-height:none; gap:clamp(8px,1.6cqw,18px)}
  body.solo-turnos .siguen .numeros b{font-size:clamp(34px, min(11cqh, 12cqw), 150px); padding:.06em .32em; border-radius:clamp(10px,1.6cqw,20px)}
  @media (orientation:portrait){
    body.solo-turnos .tv-cuerpo{grid-template-columns:1fr; grid-template-rows:minmax(0, 1.3fr) minmax(0, 1fr); grid-template-areas:"llamado" "siguen"}
    body.solo-turnos .siguen{grid-template-columns:minmax(0, 1fr); grid-template-rows:auto minmax(0, 1fr); container-type:size}
    body.solo-turnos .llamando .n{font-size:clamp(110px, min(20vh, 46vw), 360px)}
    body.solo-turnos .llamando .sigue b{font-size:clamp(80px, min(15vh, 34vw), 260px)}
    body.solo-turnos .llamando .quien{font-size:clamp(22px, 3.6vh, 52px)}
    body.solo-turnos .llamando .pidio{font-size:clamp(16px, 2.4vh, 32px)}
    body.solo-turnos .siguen .ficha b{font-size:clamp(30px, min(11cqh, 9cqw), 96px)}
    body.solo-turnos .siguen .ficha span{font-size:clamp(14px, min(4cqh, 3.4cqw), 30px)}
    body.solo-turnos .siguen .numeros b{font-size:clamp(30px, min(13cqh, 10cqw), 130px)}
  }
  @media (orientation:portrait){
    .tv-cuerpo{grid-template-columns:1fr; grid-template-rows:auto auto minmax(0, 1fr); grid-template-areas:"escena" "siguen" "llamado"}
    .marco{width:100%}
    .siguen{min-height:0; container-type:normal}
    .llamando .n{font-size:clamp(70px,11vh,220px)}
    .llamando .quien{font-size:clamp(18px,3vh,40px)} .llamando .pidio{font-size:clamp(14px,2.2vh,26px)}
    .siguen{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body class="publica tele">

<div class="tv" id="tv">
  <header class="tv-cab">
    <img class="tv-logo" src="marca/icon-192.png" alt="">
    <span class="tv-marca">Fadori<b>.</b></span>
    <span class="tv-recreo" id="recreo" hidden></span>
    <span class="tv-nube" id="nubeChip" hidden></span>
    <span class="tv-reloj" id="reloj">—</span>
    <button class="tv-boton" id="bAjustes" type="button" aria-label="Ajustes de la pantalla"><span data-ico="settings"></span></button>
  </header>

  <main class="tv-cuerpo" id="cuerpo">
    <section class="escenario" aria-label="El programa">
      <div class="marco" id="marco">
        <video id="prog" playsinline preload="auto"></video>
        <iframe id="progWeb" hidden title="Música y videos" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        <div class="portada" id="portada" hidden>
          <div class="pt-fondo" id="ptFondo"></div>
          <img class="pt-tapa" id="ptTapa" alt="">
          <div class="pt-datos"><small><span data-ico="music"></span>Sonando en el recreo</small><b id="ptTitulo"></b><span id="ptArtista"></span>
            <div class="pt-ondas" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
        </div>
        <canvas id="tanda" hidden></canvas>
        <div class="sin-prog" id="sinProg" hidden></div>
        <div class="bicho" aria-hidden="true"><img src="marca/radio-divergentes.png" alt=""><span>RADIO DIVERGENTES</span></div>
        <div class="tercio" id="tercio"><span class="vivo"><i></i>EN EL RECREO</span><span class="que" id="progQue">Radio Divergentes</span></div>
        <div class="barrita"><i id="progBarra"></i></div>
        <aside class="pop-fadori" id="popFadori" aria-hidden="true">
          <div class="pf-plato">
            <div class="burger" aria-hidden="true">
              <img class="cap sombra" src="marca/capa-sombra.png" alt=""><img class="cap pan-abajo" src="marca/capa-pan-abajo.png" alt="">
              <img class="cap carne" src="marca/capa-carne.png" alt=""><img class="cap queso" src="marca/capa-queso.png" alt="">
              <img class="cap jitomate" src="marca/capa-jitomate.png" alt=""><img class="cap lechuga" src="marca/capa-lechuga.png" alt="">
              <img class="cap pan-arriba" src="marca/capa-pan-arriba.png" alt="">
            </div>
          </div>
          <div class="pf-txt"><b class="pf-marca">Fadori<i>.</i></b><b id="popUno">Pide desde tu celular</b><span id="popDos"></span></div>
          <img class="pf-qr" src="qr/abrir.svg" alt="">
        </aside>
        <div class="llamado" id="llamado" aria-live="assertive"><span class="n" id="llN"></span><span class="t"><b id="llQue">¡Ya está tu pedido!</b><span id="llPidio"></span></span></div>
      </div>
    </section>

    <aside class="turnos" aria-live="polite">
      <div class="llamando" id="llamando"></div>
      <div class="bloque" id="bListos"></div>
    </aside>

    <section class="siguen" aria-label="Lo que sigue">
      <div class="bloque" id="bPrep"></div>
      <div class="bloque" id="bFila"></div>
    </section>
  </main>

  <footer class="tv-pie">
    <img src="qr/abrir.svg" alt="Código QR para abrir Fadori">
    <div><b>Pide desde tu teléfono</b><span>Escanea, pide y vuelve cuando tu número salga en verde.</span></div>
    <span class="toca" id="toca"><span data-ico="pointer"></span>o toca aquí para pedir</span>
    <nav class="saltos" aria-label="Pantallas de Fadori"><a href="index.html">Alumno</a><a href="mostrador.html">Mostrador</a><a href="medidor.html">Medidor</a></nav>
  </footer>
</div>

<div class="arranque" id="arranque" hidden>
  <button type="button" id="bArranque"><span data-ico="play"></span>Empezar la transmisión<small>Con sonido, pantalla completa y sin que se apague</small></button>
</div>
<button class="aj-btn mudo" id="bMudo" type="button"><span data-ico="volume-x"></span> Toca una vez para que se oigan los turnos</button>

<div class="k-capa-tv" id="kCapa" hidden>
  <div class="k-tira">
    <span class="k-mini" id="kMini"></span>
    <span class="crece"></span>
    <button type="button" id="kCerrar"><span data-ico="x"></span> Volver a la pantalla</button>
  </div>
  <iframe id="kMarco" title="Pedir aquí" src="about:blank"></iframe>
</div>

<dialog class="ajustes" id="ajustes" aria-labelledby="ajTit">
  <div class="aj-cab"><h2 id="ajTit">La pantalla de turnos</h2><button class="aj-btn" id="ajCerrar" type="button" aria-label="Cerrar"><span data-ico="x"></span></button></div>
  <div class="aj-cuerpo" id="ajCuerpo"></div>
</dialog>

<script src="iconos.js"></script>
<script src="nucleo.js"></script>
<script src="pad.js"></script>
<script type="module" src="tele.js"></script>
</body>
</html>
