<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fadori · turnos</title>
<meta name="theme-color" content="#1A0F0A">
<link rel="icon" href="marca/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="marca/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Turnos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="estilo.css">
<script>
/* El tema, ANTES de pintar. Va aquí y no en nucleo.js —que carga hasta el
   final— porque si no, la página parpadea en claro antes de ponerse oscura y
   eso se ve barato. Son cuatro renglones repetidos a propósito. */
(function(){try{
  var t = localStorage.getItem('fadori_tema') || 'auto';
  var osc = t === 'oscuro' || (t === 'auto' &&
    window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.tema = osc ? 'oscuro' : 'claro';
}catch(e){}})();
</script>

<style>
  /* Esta pantalla se ve DE LEJOS, colgada junto a la cooperativa. Dos zonas
     y nada más: a la izquierda, en verde y en grande, los que ya pueden pasar
     (lo único que alguien busca con urgencia); a la derecha, más chico, lo que
     se está haciendo y la fila. Abajo, el QR para que el que está formado
     deje de estarlo la próxima vez. */
  body.publica{min-height:100vh; display:flex; flex-direction:column}
  .tv-cab{display:flex; align-items:center; gap:clamp(12px,2vw,24px);
    padding:clamp(14px,2.4vh,26px) clamp(18px,3vw,40px)}
  .tv-logo{width:clamp(40px,5vw,64px); height:auto; border-radius:14px}
  .tv-marca{font-size:clamp(26px,3.4vw,46px); font-weight:900; letter-spacing:-.04em; color:var(--cafe)}
  .tv-marca b{color:var(--naranja)}
  .tv-recreo{display:inline-flex; align-items:center; gap:8px; padding:8px 16px; border-radius:999px;
    background:var(--sup); border:1px solid var(--linea); font-weight:800; color:var(--tenue);
    font-size:clamp(14px,1.6vw,20px)}
  .tv-recreo[hidden]{display:none}
  .tv-recreo .i{width:1.1em; height:1.1em; color:var(--naranja)}
  .tv-reloj{margin-left:auto; font-size:clamp(28px,4vw,56px); font-weight:900; letter-spacing:-.03em;
    font-variant-numeric:tabular-nums; color:var(--cafe)}

  .tv-cuerpo{flex:1; display:grid; grid-template-columns:1.35fr 1fr; gap:clamp(14px,2vw,28px);
    padding:0 clamp(18px,3vw,40px) clamp(14px,2vh,24px)}
  @media (max-width:820px){ .tv-cuerpo{grid-template-columns:1fr} }
  .tv-zona{border-radius:28px; padding:clamp(16px,2.4vw,30px); background:var(--sup);
    border:1px solid var(--linea); display:flex; flex-direction:column; min-width:0}
  .tv-zona.listos{background:linear-gradient(165deg, #1E3A10, #16290C); border-color:#3F6B23}
  .tv-zona h2{margin:0 0 clamp(12px,2vh,20px); display:flex; align-items:center; gap:12px;
    font-size:clamp(20px,2.4vw,34px); letter-spacing:-.02em}
  .tv-zona h2 .i{width:1.1em; height:1.1em}
  .tv-zona.listos h2{color:#C9F0A8}
  .tv-zona h3{margin:clamp(14px,2.4vh,26px) 0 12px; display:flex; align-items:center; gap:10px;
    font-size:clamp(16px,1.7vw,24px); color:var(--tenue)}
  .tv-zona h3:first-of-type{margin-top:0}
  .tv-zona h3 .i{width:1.05em; height:1.05em; color:var(--naranja)}
  .tv-zona h3 .cuenta{margin-left:auto; font-variant-numeric:tabular-nums}

  .tv-rej{display:grid; gap:clamp(10px,1.4vw,18px); grid-template-columns:repeat(auto-fill, minmax(clamp(120px,13vw,190px),1fr))}
  .tv-rej.chica{grid-template-columns:repeat(auto-fill, minmax(clamp(74px,7vw,110px),1fr)); gap:10px}
  .num{border-radius:22px; display:grid; place-items:center; aspect-ratio:1.25/1;
    font-weight:900; letter-spacing:-.05em; font-variant-numeric:tabular-nums; line-height:1}
  .tv-rej .num{background:#2F5419; color:#F2FFE6; font-size:clamp(54px,7vw,104px);
    box-shadow:0 0 0 2px #5E9636 inset}
  .tv-rej .num.nuevo{animation:tv-entra .7s cubic-bezier(.2,1.4,.4,1) both, tv-brilla 1.4s ease-in-out .7s 3}
  .tv-rej.chica .num{background:var(--piso); color:var(--cafe); font-size:clamp(28px,3.2vw,46px);
    border-radius:16px; box-shadow:none}
  .tv-rej.chica .num.prep{background:var(--rescoldo); color:var(--naranja-hondo); box-shadow:0 0 0 2px var(--naranja) inset}
  @keyframes tv-entra{from{transform:scale(.4); opacity:0}}
  @keyframes tv-brilla{50%{box-shadow:0 0 0 2px #5E9636 inset, 0 0 0 10px rgba(140,210,90,.25)}}
  @media (prefers-reduced-motion: reduce){ .tv-rej .num.nuevo{animation:none} }

  .tv-vacio{flex:1; display:grid; place-items:center; text-align:center; color:var(--tenue);
    font-size:clamp(16px,1.8vw,24px); font-weight:700; padding:20px; gap:10px}
  .tv-zona.listos .tv-vacio{color:#9FC983}
  .tv-vacio .i{width:clamp(40px,5vw,70px); height:clamp(40px,5vw,70px); stroke-width:1.5; opacity:.7}
  .tv-mas{margin-top:12px; color:var(--tenue); font-weight:800; font-size:clamp(14px,1.5vw,20px)}

  .tv-pie{display:flex; align-items:center; gap:clamp(12px,2vw,22px);
    padding:clamp(10px,1.8vh,18px) clamp(18px,3vw,40px); border-top:1px solid var(--linea); background:var(--sup)}
  .tv-pie img{width:clamp(56px,6vw,84px); height:auto; background:#fff; border-radius:10px; padding:5px}
  .tv-pie b{display:block; font-size:clamp(18px,2vw,28px); letter-spacing:-.02em}
  .tv-pie span{font-size:clamp(13px,1.4vw,18px); color:var(--tenue)}
  .tv-pie .saltos{margin-left:auto; opacity:.35}
  .tv-pie .saltos:hover, .tv-pie .saltos:focus-within{opacity:1}
</style>
</head>
<body class="publica">

<header class="tv-cab">
  <img class="tv-logo" src="marca/icon-192.png" alt="">
  <span class="tv-marca">Fadori<b>.</b></span>
  <span class="tv-recreo" id="recreo" hidden></span>
  <span class="tv-reloj" id="reloj">—</span>
</header>

<main class="tv-cuerpo" id="cuerpo">
  <section class="tv-zona listos" aria-live="polite">
    <h2><span data-ico="circle-check-big"></span>Listos · pasa por él</h2>
    <div id="listos" class="tv-cont"></div>
  </section>
  <section class="tv-zona">
    <h3><span data-ico="chef-hat"></span>Preparando <span class="cuenta" id="nPrep"></span></h3>
    <div id="preparando"></div>
    <h3><span data-ico="hourglass"></span>En la fila <span class="cuenta" id="nFila"></span></h3>
    <div id="fila"></div>
  </section>
</main>

<footer class="tv-pie">
  <img src="qr/abrir.svg" alt="Código QR para abrir Fadori">
  <div><b>Pide desde tu teléfono</b><span>Escanea, pide y vuelve cuando tu número salga en verde.</span></div>
  <nav class="saltos" aria-label="Pantallas de Fadori"><a href="index.html">Alumno</a><a href="mostrador.html">Mostrador</a><a href="medidor.html">Medidor</a></nav>
</footer>

<script src="iconos.js"></script>
<script src="nucleo.js"></script>
<script>
(function(){
'use strict';
const $ = (s) => document.querySelector(s);
const F = window.FADORI;
F.cargar();

/* Números, NUNCA nombres. Una pantalla pública con nombres de alumnos es
   exhibir a un menor, y aquí no hace falta: el número basta. */
document.querySelectorAll('[data-ico]').forEach(el => { el.innerHTML = F.ico(el.dataset.ico); });
let yaListos = null;   /* los que ya estaban en verde: los nuevos entran con brinco */
function pintar(){
  const d = F.estado();
  const listos = d.pedidos.filter(p => p.estado === 'listo')
    .sort((a,b) => a.listoEn - b.listoEn);
  const cola = F.colaOrdenada();
  const prep = cola.filter(p => p.estado === 'preparando');
  const fila = cola.filter(p => p.estado !== 'preparando');
  const antes = yaListos;
  yaListos = new Set(listos.map(p => p.id));

  $('#listos').innerHTML = listos.length
    ? '<div class="tv-rej">'+ listos.slice(0,12).map(p =>
        '<div class="num'+(antes && !antes.has(p.id) ? ' nuevo' : '')+'">'+F.verTurno(p)+'</div>').join('') +'</div>'+
      (listos.length > 12 ? '<p class="tv-mas">y '+(listos.length-12)+' más</p>' : '')
    : '<div class="tv-vacio">'+F.ico('circle-check-big')+'<span>Aquí sale tu número cuando esté listo</span></div>';

  const chicas = (arr, clase, max) => arr.length
    ? '<div class="tv-rej chica">'+ arr.slice(0,max).map(p =>
        '<div class="num'+(clase?' '+clase:'')+'">'+F.verTurno(p)+'</div>').join('') +'</div>'+
      (arr.length > max ? '<p class="tv-mas">y '+(arr.length-max)+' más</p>' : '')
    : '';
  $('#preparando').innerHTML = chicas(prep, 'prep', 8) || '<p class="tv-mas">Nada en la plancha</p>';
  $('#fila').innerHTML = chicas(fila, '', 20) || '<p class="tv-mas">Nadie esperando</p>';
  $('#nPrep').textContent = prep.length || '';
  $('#nFila').textContent = fila.length || '';
}

function reloj(){
  const t = new Date();
  $('#reloj').textContent = t.toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'});
  const r = $('#recreo');
  if(F.enRecreo()){
    r.hidden = false;
    r.innerHTML = F.ico('clock') + 'Quedan ' + Math.ceil(F.quedanSegundosDeRecreo()/60) + ' min de recreo';
  } else r.hidden = true;
}

F.alCambiar(() => { F.cargar(); pintar(); });
setInterval(() => { F.cargar(); pintar(); reloj(); }, 3000);
pintar(); reloj();

/* que la pantalla no se apague sola, si el navegador lo permite */
(async () => {
  try{ if(navigator.wakeLock) await navigator.wakeLock.request('screen'); }catch(e){}
})();

(function(){
  let bien = 0, mal = 0;
  F.pausarSync();   /* que el pedido de prueba no salga al servidor */
  const ok = (q,c) => { if(c) bien++; else { mal++; console.error('✗ '+q); } };
  const guardado = JSON.stringify(F.estado());
  const uno = F.productos(true)[0];
  const p = F.pedir(null, [{prod:uno.id, cant:1}],
    { origen:'mostrador', nombre:'Fulanito Secreto', grupo:'3A' });
  F.cargar(); pintar();
  const texto = $('#cuerpo').textContent;
  /* con servidor el turno llega un parpadeo después y mientras se ve «…» */
  ok('la pantalla pública muestra el número de turno', texto.indexOf(F.verTurno(p)) >= 0);
  ok('la pantalla pública NUNCA muestra nombres', texto.indexOf('Fulanito') < 0);
  ok('tampoco muestra el grupo, que también identifica', texto.indexOf('3A') < 0);
  ok('ni el código del pedido, que va sólo en el ticket', texto.indexOf(p.folio) < 0);
  try{ localStorage.setItem('fadori_v1', guardado); }catch(e){}
  F.cargar(); pintar();
  console.log('%cFadori pantalla · '+bien+'/'+(bien+mal)+' pruebas',
    'color:'+(mal?'#FF7A7A':'#5BD98A')+';font-weight:700');
})();

})();
</script>
</body>
</html>
