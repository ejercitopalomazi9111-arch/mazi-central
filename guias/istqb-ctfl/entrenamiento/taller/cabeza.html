<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrenamiento ISTQB CTFL · Grupo Mazi</title>
<meta name="description" content="Cincuenta niveles para llegar preparado al examen ISTQB Foundation Level. Entrenamiento interno de Grupo Mazi.">
<meta name="theme-color" content="#120C1A">
<style>
/* ══════════════════════════════════════════════════════════════════════════
   ENTRENAMIENTO ISTQB CTFL · Grupo Mazi
   Un archivo, sin build y sin CDN: se abre desde el teléfono y funciona.
   Los colores están medidos del logo (marca/README.md), no inventados.
   ═════════════════════════════════════════════════════════════════════════ */
@font-face{ font-family:"Mazi"; src:url(data:font/woff2;base64,__FUENTE__) format("woff2");
            font-weight:400; font-display:swap }

:root{
  --violeta:#AD21ED;        /* medido: promedio de los píxeles violetas del logo */
  --violeta-hondo:#7A16A8;
  --hueso:#EAE5E3;
  --vacio:#120C1A;
  --panel:#1B1226;
  --panel-alto:#241733;
  --linea:#33244A;
  --tenue:#A99CB8;
  --ok:#3ED598;
  --mal:#FF6B87;
  --aviso:#FFC65C;
  --ui:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radio:14px;
}

*{ box-sizing:border-box }
/* `hidden` es la regla de CSS de menor especificidad que existe: pierde contra
   el `display` de cualquier clase propia. Sin este !important, `.btn.ancho`
   —que pone display:block— dejaba PINTADOS el botón de constancias desde el
   nivel cero y el de «enséñame cómo se resuelve» después de usarlo. Lo cazó la
   prueba, no la lectura del código. */
[hidden]{ display:none !important }
html{ -webkit-text-size-adjust:100% }
body{
  margin:0; background:var(--vacio); color:var(--hueso);
  font:400 17px/1.55 var(--ui);
  padding:0 0 env(safe-area-inset-bottom);
  overflow-x:hidden;
}
h1,h2,h3{ line-height:1.2; margin:0 0 12px }
h1{ font-family:"Mazi", var(--ui); font-size:30px; font-weight:400; letter-spacing:.01em }
h2{ font-size:22px }
h3{ font-size:18px }
p{ margin:0 0 14px }
b,strong{ font-weight:700 }
i,em{ font-style:italic; color:var(--tenue) }

.envoltura{ max-width:720px; margin:0 auto; padding:0 18px }
.pantalla{ display:none; padding:22px 0 40px; animation:entra .28s ease both }
.pantalla.viva{ display:block }
@keyframes entra{ from{ transform:translateY(10px) } to{ transform:none } }
@media (prefers-reduced-motion: reduce){ .pantalla{ animation:none } }

/* ── barra de arriba ─────────────────────────────────────────────────── */
.barra{
  position:sticky; top:0; z-index:20; background:var(--vacio);
  border-bottom:1px solid var(--linea);
  padding-top:env(safe-area-inset-top);
}
.barra .fila{ display:flex; align-items:center; gap:12px; min-height:56px }
.barra .logo{ width:34px; height:34px; flex:none }
.barra .quien{ flex:1; min-width:0; font-size:14px; color:var(--tenue);
               overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.barra .quien b{ color:var(--hueso); font-weight:600 }

/* ── botones ─────────────────────────────────────────────────────────── */
.btn{
  font:600 17px/1 var(--ui); color:#fff; background:var(--violeta);
  border:0; border-radius:var(--radio); padding:16px 22px; min-height:52px;
  cursor:pointer; -webkit-tap-highlight-color:transparent;
  transition:transform .12s ease, background .12s ease;
}
.btn:active{ transform:scale(.98) }
.btn:disabled{ opacity:.45; cursor:not-allowed }
.btn.ancho{ display:block; width:100% }
.btn.calma{ background:var(--panel-alto); color:var(--hueso); border:1px solid var(--linea) }
.btn.chico{ font-size:15px; padding:12px 16px; min-height:46px }
.btn:focus-visible, input:focus-visible, .opcion:focus-visible{
  outline:3px solid var(--violeta); outline-offset:2px }

/* ── formulario de entrada ───────────────────────────────────────────── */
label.campo{ display:block; margin:0 0 16px }
label.campo span{ display:block; font-size:14px; color:var(--tenue); margin-bottom:6px }
input[type=text], input[type=number]{
  width:100%; font:400 17px/1.3 var(--ui);   /* 17px: menos y iOS hace zoom solo */
  color:var(--hueso); background:var(--panel); border:1px solid var(--linea);
  border-radius:var(--radio); padding:15px 16px; min-height:52px;
}
input::placeholder{ color:#6D6080 }

/* ── mapa de niveles ─────────────────────────────────────────────────── */
.avance{ background:var(--panel); border-radius:var(--radio); padding:16px; margin:0 0 20px;
         border:1px solid var(--linea) }
.avance .cifra{ font:700 34px/1 var(--ui); color:var(--violeta) }
.avance .riel{ height:10px; border-radius:6px; background:var(--panel-alto); overflow:hidden; margin:12px 0 8px }
.avance .riel i{ display:block; height:100%; background:var(--violeta); border-radius:6px;
                 transition:width .4s ease }
.avance .nota{ font-size:14px; color:var(--tenue) }

.bloque-tit{ display:flex; align-items:baseline; gap:10px; margin:24px 0 10px }
.bloque-tit h3{ margin:0; font-size:16px; letter-spacing:.04em; text-transform:uppercase; color:var(--tenue) }
.bloque-tit .raya{ flex:1; height:1px; background:var(--linea) }

.rejilla{ display:grid; grid-template-columns:repeat(auto-fill, minmax(58px,1fr)); gap:10px }
.casilla{
  aspect-ratio:1; min-height:58px; border-radius:var(--radio);
  background:var(--panel); border:1px solid var(--linea); color:var(--hueso);
  font:600 17px/1 var(--ui); cursor:pointer; position:relative;
  display:flex; align-items:center; justify-content:center;
  -webkit-tap-highlight-color:transparent; transition:transform .12s ease;
}
.casilla:active{ transform:scale(.95) }
.casilla.hecho{ background:var(--violeta); border-color:var(--violeta); color:#fff }
.casilla.hecho::after{ content:"✓"; position:absolute; top:3px; right:6px; font-size:11px; opacity:.85 }
.casilla.cerrado{ opacity:.55; cursor:not-allowed }
.casilla.siguiente{ border-color:var(--violeta); box-shadow:0 0 0 2px rgba(173,33,237,.35) }

/* ── un nivel ────────────────────────────────────────────────────────── */
.migaja{ font-size:13px; color:var(--tenue); letter-spacing:.06em; text-transform:uppercase; margin-bottom:6px }
.enunciado{ background:var(--panel); border:1px solid var(--linea); border-radius:var(--radio);
            padding:18px; margin:0 0 18px }
.enunciado p:last-child{ margin-bottom:0 }
.enunciado table{ width:100%; border-collapse:collapse; font-size:14px; margin:12px 0 }
.enunciado th, .enunciado td{ border:1px solid var(--linea); padding:7px 9px; text-align:left }
.enunciado th{ background:var(--panel-alto); font-weight:600 }

.codigo{ background:#0B0710; border:1px solid var(--linea); border-radius:var(--radio);
         padding:14px 8px; margin:0 0 18px; overflow-x:auto }
.codigo ol{ margin:0; padding:0 0 0 44px; font:400 15px/1.75 var(--mono); color:#D7CDE4 }
.codigo li{ padding-left:8px }
.codigo li::marker{ color:#6D6080; font-size:13px }
.codigo .sangria{ color:#6D6080 }

.opciones{ display:flex; flex-direction:column; gap:10px; margin:0 0 18px }
.opcion{
  display:flex; gap:12px; align-items:flex-start; text-align:left;
  background:var(--panel); border:1px solid var(--linea); border-radius:var(--radio);
  padding:15px 16px; min-height:52px; color:var(--hueso);
  font:400 16px/1.45 var(--ui); cursor:pointer; width:100%;
  -webkit-tap-highlight-color:transparent;
}
.opcion .marca{ flex:none; width:26px; height:26px; border-radius:8px; border:2px solid var(--linea);
                display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700 }
.opcion.sel{ border-color:var(--violeta) }
.opcion.sel .marca{ background:var(--violeta); border-color:var(--violeta); color:#fff }
.opcion.buena{ border-color:var(--ok) }
.opcion.buena .marca{ background:var(--ok); border-color:var(--ok); color:#0B0710 }
.opcion.mala{ border-color:var(--mal) }
.opcion.mala .marca{ background:var(--mal); border-color:var(--mal); color:#0B0710 }

.acciones{ display:flex; gap:10px; flex-wrap:wrap; margin:0 0 18px }
.acciones .btn{ flex:1; min-width:140px }

.veredicto{ border-radius:var(--radio); padding:16px; margin:0 0 18px; border:1px solid }
.veredicto.bien{ background:rgba(62,213,152,.10); border-color:var(--ok) }
.veredicto.bien h3{ color:var(--ok) }
.veredicto.mal{ background:rgba(255,107,135,.10); border-color:var(--mal) }
.veredicto.mal h3{ color:var(--mal) }
.veredicto p:last-child{ margin-bottom:0 }

.ayuda{ background:var(--panel); border:1px solid var(--linea); border-radius:var(--radio);
        padding:16px; margin:0 0 18px }
.ayuda h3{ font-size:16px; color:var(--violeta) }
.ayuda ol{ margin:0; padding-left:22px }
.ayuda li{ margin:0 0 10px }
.ayuda li:last-child{ margin:0 }
.ayuda .pista{ border-left:3px solid var(--aviso); padding-left:12px; margin:0 0 12px; color:var(--hueso) }
.ayuda .pista:last-child{ margin-bottom:0 }

.pie-nav{ display:flex; gap:10px; margin-top:26px }
.pie-nav .btn{ flex:1 }

/* ── certificados ────────────────────────────────────────────────────── */
.diploma{
  background:#fff; color:#171021; border-radius:var(--radio); padding:30px 26px;
  margin:0 0 20px; border:6px solid var(--violeta); position:relative; overflow:hidden;
}
.diploma .sello{ position:absolute; right:-30px; top:-30px; width:150px; opacity:.07 }
.diploma .casa{ font:400 13px/1 var(--ui); letter-spacing:.22em; text-transform:uppercase;
                color:var(--violeta-hondo); margin:0 0 14px }
.diploma h2{ font-family:"Mazi", var(--ui); font-weight:400; font-size:26px; color:#171021; margin:0 0 6px }
.diploma .nombre{ font-size:25px; font-weight:700; margin:16px 0 6px; line-height:1.2 }
.diploma .raya{ height:3px; background:var(--violeta); width:70px; margin:0 0 16px }
.diploma p{ font-size:15px; line-height:1.55; color:#3B3048 }
.diploma .datos{ display:flex; flex-wrap:wrap; gap:8px 26px; margin-top:20px;
                 padding-top:16px; border-top:1px solid #E2DCE9; font-size:13px; color:#6A5E78 }
.diploma .datos b{ color:#171021; display:block; font-size:14px }
.diploma .letra-chica{ margin-top:16px; font-size:12px; line-height:1.5; color:#6A5E78 }

.aviso-legal{ background:var(--panel); border:1px solid var(--aviso); border-left-width:4px;
              border-radius:var(--radio); padding:14px 16px; margin:0 0 20px; font-size:15px }

@media print{
  body{ background:#fff; color:#000 }
  .barra, .pantalla:not(.viva), .acciones, .pie-nav, .no-imprime{ display:none !important }
  .envoltura{ max-width:none; padding:0 }
  .pantalla{ animation:none; padding:0 }
  .diploma{ break-after:page; border-width:4px; box-shadow:none }
  .diploma:last-of-type{ break-after:auto }
}

@media (min-width:640px){
  body{ font-size:18px }
  h1{ font-size:38px }
  .envoltura{ padding:0 24px }
}
</style>
</head>
<body>
