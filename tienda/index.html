<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F7F3EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
<title>Tienda</title>
<link rel="preload" href="nucleo/letra/atkinson-next.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="nucleo/estilo.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="nucleo/iconos-app/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tienda">
<script>
  /* Tema y tamaño de letra ANTES de pintar: si no, la página parpadea en claro
     y luego salta a oscuro. */
  try{
    var t = localStorage.getItem('tienda-tema'); if(t) document.documentElement.dataset.tema = t;
    var l = localStorage.getItem('tienda-letra'); if(l) document.documentElement.dataset.letra = l;
  }catch(e){}
</script>
<script src="nucleo/vendor/supabase-2.57.4.js"></script>
<script type="module" src="nucleo/app.js"></script>
</head>
<body>
<div id="app" class="app">
  <noscript><p style="padding:24px">Esta tienda necesita JavaScript encendido.</p></noscript>
</div>
<div class="avisos" id="avisos" role="status" aria-live="polite"></div>
</body>
</html>
