<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1714">
<meta name="robots" content="noindex">
<title>Secre</title>
<style>
:root{
  --fondo:#f4f5f2; --hoja:#ffffff; --linea:#dfe3dc; --tinta:#16201b; --suave:#5b665f;
  --acento:#127a52; --acento-tinta:#ffffff; --acento-claro:#e2f2ea; --peligro:#b3261e; --aviso:#8a5a00; --aviso-fondo:#fff3d6;
  --radio:12px; --sombra:0 1px 2px rgba(0,0,0,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-tema="claro"]){
  --fondo:#0f1714; --hoja:#18221e; --linea:#2a3631; --tinta:#e8ede9; --suave:#a3afa8;
  --acento:#3cc68a; --acento-tinta:#06231a; --acento-claro:#1c3a2d; --peligro:#ff8a80; --aviso:#ffd27a; --aviso-fondo:#3a2e10;
  --sombra:none; color-scheme: dark;
}}
*{ box-sizing:border-box; }
html,body{ margin:0; background:var(--fondo); color:var(--tinta); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-text-size-adjust:100%; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
.envoltura{ max-width:720px; margin:0 auto; padding:12px 16px calc(96px + env(safe-area-inset-bottom)); }
.oculto{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); top:0; left:0; }

/* ── arriba ── */
header{ position:sticky; top:0; z-index:5; background:var(--fondo); padding:10px 0 8px; }
.fila{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
h1{ font-size:22px; margin:0; letter-spacing:-.01em; }
h2{ font-size:18px; margin:24px 0 8px; }
.cuentas{ display:flex; gap:8px; overflow-x:auto; padding:8px 0 4px; position:relative; }
.cuenta{ min-height:44px; padding:0 14px; border-radius:999px; border:1px solid var(--linea); background:var(--hoja); display:flex; align-items:center; gap:8px; white-space:nowrap; }
.cuenta[aria-pressed="true"]{ border-color:var(--acento); background:var(--acento-claro); font-weight:600; }
.punto{ width:10px; height:10px; border-radius:50%; background:var(--suave); flex:none; }
.punto.si{ background:var(--acento); }
.pausa{ margin-left:auto; }

/* ── pestañas abajo, al alcance del pulgar ── */
nav.pestanas{ position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--hoja); border-top:1px solid var(--linea);
  display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); padding-bottom:env(safe-area-inset-bottom); }
nav.pestanas button{ min-height:60px; border:0; background:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:12px; color:var(--suave); position:relative; padding:4px 2px; }
nav.pestanas button span.ico{ font-size:20px; line-height:1; }
nav.pestanas button[aria-selected="true"]{ color:var(--acento); font-weight:700; }
.globo{ position:absolute; top:6px; left:calc(50% + 6px); min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--peligro); color:#fff; font-size:11px; font-weight:700; line-height:18px; }
@media (min-width:900px){
  nav.pestanas{ position:sticky; top:auto; bottom:auto; border:1px solid var(--linea); border-radius:var(--radio); margin:4px 0 8px; }
  .envoltura{ padding-bottom:32px; }
}

/* ── piezas ── */
.tarjeta{ background:var(--hoja); border:1px solid var(--linea); border-radius:var(--radio); padding:14px; margin:0 0 12px; box-shadow:var(--sombra); }
.tarjeta .quien{ font-weight:700; }
.tarjeta .meta{ color:var(--suave); font-size:14px; }
.boton{ min-height:44px; padding:0 16px; border-radius:10px; border:1px solid var(--linea); background:var(--hoja); font-weight:600; }
.boton.principal{ background:var(--acento); color:var(--acento-tinta); border-color:var(--acento); }
.boton.peligro{ color:var(--peligro); }
.boton:disabled{ opacity:.5; cursor:default; }
.campo{ width:100%; min-height:44px; padding:10px 12px; border-radius:10px; border:1px solid var(--linea); background:var(--fondo); }
textarea.campo{ min-height:88px; resize:vertical; }
label.etq{ display:block; font-size:14px; color:var(--suave); margin:10px 0 4px; }
.elenco{ border:0; padding:0; margin:8px 0 0; }
.dias{ border:0; padding:0; margin:0; display:flex; flex-wrap:wrap; gap:6px; }
.dias legend{ width:100%; }
.dia{ position:relative; }
.dia input{ position:absolute; opacity:0; inset:0; margin:0; width:100%; height:100%; cursor:pointer; }
.dia span[aria-hidden]{ display:grid; place-items:center; width:44px; height:44px; border-radius:50%; border:1px solid var(--linea); font-weight:600; }
.dia input:checked + span{ background:var(--acento); color:var(--acento-tinta); border-color:var(--acento); }
.dia input:focus-visible + span{ outline:2px solid var(--acento); outline-offset:2px; }
.fila-check{ display:flex; align-items:center; gap:10px; min-height:44px; margin:12px 0 0; font-size:15px; }
.fila-check input{ width:22px; height:22px; accent-color:var(--acento, currentColor); }
.acciones{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.acciones .boton{ flex:1 1 auto; }
.vacio{ color:var(--suave); text-align:center; padding:32px 8px; }
.aviso{ background:var(--aviso-fondo); color:var(--aviso); border-radius:var(--radio); padding:12px 14px; margin:8px 0; }
.codigo{ font:700 28px/1.2 ui-monospace,Menlo,monospace; letter-spacing:.08em; color:var(--tinta); display:block; margin:6px 0; }
.aviso small{ display:block; margin-top:4px; opacity:.8; }
.fila-vinculo{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.chip{ display:inline-block; padding:2px 10px; border-radius:999px; background:var(--acento-claro); font-size:13px; margin:2px 4px 2px 0; }
.motivo{ font-size:14px; color:var(--aviso); margin:8px 0 0; }
.pend{ display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--linea); }
.pend:last-child{ border-bottom:0; }
.pend input{ width:24px; height:24px; margin:2px 0 0; flex:none; accent-color:var(--acento); }
.pend.hecho .txt{ text-decoration:line-through; color:var(--suave); }
.dos{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px; }
details.tarjeta > summary{ list-style:none; display:flex; align-items:center; gap:8px; min-height:32px; cursor:pointer; }
details.tarjeta > summary::-webkit-details-marker{ display:none; }
details.tarjeta > summary .modo{ margin-left:auto; font-size:13px; color:var(--suave); white-space:nowrap; }
/* el cambio rápido de modo, en el renglón mismo (16 de octubre: «una manera más rápida de cambiar tipo de respuesta») */
details.tarjeta > summary{ flex-wrap:wrap; }
.seg{ display:flex; flex-wrap:wrap; gap:6px; width:100%; }
.seg button, .filtros button{ min-height:44px; padding:0 12px; border-radius:999px; border:1px solid var(--linea); background:var(--hoja); font-size:14px; font-weight:600; color:inherit; }
.seg button[aria-pressed="true"], .filtros button[aria-pressed="true"]{ background:var(--acento); color:var(--acento-tinta); border-color:var(--acento); }
.filtros{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
.masivo{ margin:4px 0 12px; }

/* ── la plática ── */
.charla{ display:flex; flex-direction:column; gap:8px; padding-bottom:8px; }
.burbuja{ max-width:85%; padding:10px 12px; border-radius:14px; white-space:pre-wrap; overflow-wrap:anywhere; }
.burbuja.carlos{ align-self:flex-end; background:var(--acento); color:var(--acento-tinta); border-bottom-right-radius:4px; }
.burbuja.secre{ align-self:flex-start; background:var(--hoja); border:1px solid var(--linea); border-bottom-left-radius:4px; }
.burbuja time{ display:block; font-size:11px; opacity:.7; margin-top:4px; }
.escribir{ position:sticky; bottom:calc(68px + env(safe-area-inset-bottom)); display:flex; gap:8px; background:var(--fondo); padding:8px 0; }
@media (min-width:900px){ .escribir{ bottom:0; } }
.escribir .campo{ min-height:48px; }

#avisito{ position:fixed; left:50%; top:calc(12px + env(safe-area-inset-top)); transform:translateX(-50%); background:var(--tinta); color:var(--fondo); padding:10px 16px; border-radius:10px; font-size:15px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:9; max-width:calc(100% - 32px); }
#avisito.ver{ opacity:1; }

/* ── entrar ── */
.entrar{ max-width:360px; margin:18vh auto 0; padding:0 16px; }
.entrar p{ color:var(--suave); }
</style>
</head>
<body>
<div id="app"></div>
<div id="avisito" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════════════
   Panel de Secre. Una sola página, sin nada de fuera: habla con correr.mjs.
   Lo mismo que se puede hacer escribiéndole en «Mensaje a ti mismo», aquí con
   botones, y la pestaña «Platica» es ese mismo chat.
   ═════════════════════════════════════════════════════════════════════════ */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const TZ = 'America/Mexico_City';
const hora = (t) => new Date(t).toLocaleTimeString('es-MX', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
const dia = (t) => new Date(t).toLocaleDateString('es-MX', { timeZone: TZ, day: 'numeric', month: 'short' });
const cuando = (t) => { const d = new Date(t).toLocaleDateString('en-CA', { timeZone: TZ }), h = new Date().toLocaleDateString('en-CA', { timeZone: TZ }); return d === h ? hora(t) : dia(t) + ' ' + hora(t); };

let cuentas = [], actual = '', datos = null, pestana = 'propuestas', huella = '';
try{ pestana = localStorage.getItem('secre-pestana') || pestana; }catch{}

function avisito(t){ const a = $('#avisito'); a.textContent = t; a.classList.add('ver'); clearTimeout(avisito.t); avisito.t = setTimeout(() => a.classList.remove('ver'), 2600); }

async function api(ruta, cuerpo){
  const r = await fetch('/api/' + ruta, cuerpo ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(cuerpo) } : {});
  const j = await r.json().catch(() => ({}));
  if(r.status === 401 && ruta !== 'entrar'){ pintarEntrar(); throw new Error(j.error || 'Entra otra vez'); }
  if(!r.ok) throw new Error(j.error || 'Algo falló (' + r.status + ')');
  return j;
}
const accion = (a) => api(actual + '/accion', a);

/* ── entrar ── */
function pintarEntrar(){
  clearInterval(pintarEntrar.reloj);
  $('#app').innerHTML = `<form class="entrar" id="fEntrar">
    <h1>Secre</h1><p>Tu secretaria de WhatsApp. Escribe la contraseña que pusiste al prenderla.</p>
    <label class="etq" for="clave">Contraseña</label>
    <input class="campo" id="clave" type="password" autocomplete="current-password" required>
    <div class="acciones"><button class="boton principal">Entrar</button></div>
    <p id="errEntrar" role="alert"></p></form>`;
  $('#fEntrar').onsubmit = async (e) => {
    e.preventDefault();
    try{ await api('entrar', { clave: $('#clave').value }); arrancar(); }
    catch(err){ $('#errEntrar').textContent = err.message; }
  };
}

/* ── el armazón ── */
const PESTANAS = [
  ['propuestas', '✉️', 'Por mandar'],
  ['pendientes', '✅', 'Pendientes'],
  ['chats', '👥', 'Chats'],
  ['ajustes', '⚙️', 'Ajustes'],
  ['platica', '💬', 'Platica'],
];
function pintarArmazon(){
  $('#app').innerHTML = `<div class="envoltura">
    <header><div class="fila"><h1 id="titulo">Secre</h1><button class="boton pausa" id="bPausa"></button></div>
      <div class="cuentas" id="cuentas" role="group" aria-label="Cuenta"></div><div id="conexion"></div></header>
    <main id="hoja"></main></div>
    <nav class="pestanas" role="tablist">${PESTANAS.map(([k, i, n]) => `<button role="tab" data-p="${k}" aria-selected="${k === pestana}"><span class="ico" aria-hidden="true">${i}</span>${n}<span class="globo" hidden></span></button>`).join('')}</nav>`;
  document.querySelectorAll('nav.pestanas button').forEach(b => b.onclick = () => {
    pestana = b.dataset.p; try{ localStorage.setItem('secre-pestana', pestana); }catch{}
    document.querySelectorAll('nav.pestanas button').forEach(x => x.setAttribute('aria-selected', x === b));
    huella = ''; pintar(true); window.scrollTo(0, pestana === 'platica' ? document.body.scrollHeight : 0);
  });
  $('#bPausa').onclick = async () => {
    try{
      const pausado = datos && datos.config.pausaHasta > Date.now();
      const r = await accion(pausado ? { accion: 'reanudar' } : { accion: 'pausa', cuanto: '2h' });
      avisito(r.hecho); await cargar(true);
    }catch(e){ avisito(e.message); }
  };
}

async function arrancar(){
  try{ cuentas = (await api('cuentas')).cuentas; }catch{ return; }
  if(!cuentas.find(c => c.id === actual)) actual = cuentas[0] && cuentas[0].id;
  pintarArmazon();
  await cargar(true);
  clearInterval(pintarEntrar.reloj);
  pintarEntrar.reloj = setInterval(() => cargar(false).catch(() => {}), 4000);
}

async function cargar(forzar){
  const [cs, d] = await Promise.all([api('cuentas'), api(actual)]);
  cuentas = cs.cuentas; datos = d;
  pintar(forzar);
}

/* no se repinta lo que no cambió, ni mientras se escribe en un campo de la hoja */
function pintar(forzar){
  if(!datos) return;
  $('#cuentas').innerHTML = cuentas.map(c => `<button class="cuenta" data-c="${esc(c.id)}" aria-pressed="${c.id === actual}"><span class="punto ${c.conectado ? 'si' : ''}" aria-hidden="true"></span>${esc(c.id)}<span class="oculto">${c.conectado ? ' (conectada)' : ' (sin conectar)'}</span></button>`).join('');
  document.querySelectorAll('.cuenta').forEach(b => b.onclick = async () => { actual = b.dataset.c; huella = ''; await cargar(true); });
  const k = datos.conexion || {};
  /* en México la cuenta puede estar como 52… o como 521…: si un formato no deja, el otro */
  const otro = /^521\d{10}$/.test(k.para || '') ? '52' + k.para.slice(3) : /^52\d{10}$/.test(k.para || '') ? '521' + k.para.slice(2) : '';
  const bonito = (t) => '+' + t.replace(/^(52)(1?)(\d{3})(\d{3})(\d{4})$/, (m, a, b, c, d, e) => `${a} ${b ? b + ' ' : ''}${c} ${d} ${e}`).replace(/^(1)(\d{3})(\d{3})(\d{4})$/, '$1 $2 $3 $4');
  const htmlConexion = (k.aviso ? `<div class="aviso">⚠️ ${esc(k.aviso)}</div>` : '') + (k.conectado ? '' : k.codigo
    ? `<div class="aviso"><b>Falta vincular «${esc(datos.cuenta)}».</b> En ese teléfono: WhatsApp → Dispositivos vinculados → Vincular un dispositivo → <b>Vincular con número de teléfono</b>, y escribe:<span class="codigo">${esc(k.codigo)}</span>`
      + `<small>Código para ${esc(bonito(k.para || ''))}. Sirve unos minutos; si cambia aquí, usa el nuevo.</small>`
      + `<div class="fila-vinculo"><button class="boton" id="bOtroCodigo">Pedir otro código</button>${otro ? `<button class="boton" id="bOtroNumero" data-tel="${esc(otro)}">¿No te deja? Probar como ${esc(bonito(otro))}</button>` : ''}</div>`
      + `<form class="fila-vinculo" id="fNumero"><label class="oculto" for="iNumero">Número de esta cuenta</label><input id="iNumero" type="tel" inputmode="tel" autocomplete="tel" placeholder="Otro número: 52 442 883 3786" value=""><button class="boton">Usar este número</button></form></div>`
    : `<div class="aviso">«${esc(datos.cuenta)}» no está conectada${k.error ? ': ' + esc(k.error) : '. Esperando a WhatsApp…'}</div>`);
  /* se repinta cada 4 s: sólo si cambió, y nunca mientras se escribe el número */
  if(htmlConexion !== pintar.conexion && !(document.activeElement && document.activeElement.id === 'iNumero' && $('#iNumero').value)){
    pintar.conexion = htmlConexion; $('#conexion').innerHTML = htmlConexion;
  }
  const pedirCodigo = async (tel, msj) => { try{ await api(actual + '/numero', { tel }); avisito(msj); }catch(e){ avisito(e.message); } };
  if($('#bOtroCodigo')) $('#bOtroCodigo').onclick = () => pedirCodigo(k.para, 'Pidiendo otro código…');
  /* lo que escribe a mano: 10 dígitos son de México (52), si no trae lada de país */
  if($('#fNumero')) $('#fNumero').onsubmit = (ev) => { ev.preventDefault(); let t = $('#iNumero').value.replace(/\D/g, ''); if(t.length === 10) t = '52' + t; pedirCodigo(t, 'Pidiendo código para ' + bonito(t) + '…'); };
  if($('#bOtroNumero')) $('#bOtroNumero').onclick = (ev) => pedirCodigo(ev.currentTarget.dataset.tel, 'Pidiendo código para ' + bonito(ev.currentTarget.dataset.tel) + '…');
  /* quién de las tres (Secre, Paulina, Negro) está de guardia */
  $('#titulo').textContent = datos.deTurno || 'Secre';
  const pausado = datos.config.pausaHasta > Date.now();
  $('#bPausa').textContent = pausado ? `▶ Seguir (pausa hasta ${hora(datos.config.pausaHasta)})` : '⏸ Pausa 2 h';
  const nProp = datos.propuestas.length, nPend = datos.pendientes.filter(p => !p.hecho).length;
  globo('propuestas', nProp); globo('pendientes', nPend);

  const h = pestana + JSON.stringify(pestana === 'platica' ? datos.charla : pestana === 'propuestas' ? [datos.propuestas, (datos.contestadas || [])[0]] : pestana === 'pendientes' ? datos.pendientes : [datos.chats, datos.config]);
  if(!forzar && h === huella) return;
  const enfocado = document.activeElement;
  if(!forzar && enfocado && $('#hoja').contains(enfocado) && /INPUT|TEXTAREA|SELECT/.test(enfocado.tagName)) return;
  if(!forzar && $('#hoja details[open]') && pestana === 'chats') return;
  huella = h;
  ({ propuestas: hojaPropuestas, pendientes: hojaPendientes, chats: hojaChats, ajustes: hojaAjustes, platica: hojaPlatica })[pestana]();
}
function globo(p, n){ const g = $(`nav.pestanas [data-p="${p}"] .globo`); if(!g) return; g.hidden = !n; g.textContent = n > 99 ? '99+' : n; }
const nombreDe = (jid) => (datos.chats.find(c => c.id === jid) || {}).nombre || String(jid).split('@')[0];

/* ══ Por mandar ══════════════════════════════════════════════════════════ */
/* lo que llegó, qué hizo Secre y por qué (Carlos, 16 de octubre: «que en por enviar
   también muestre qué recibió, qué respondió y por qué») */
const QUE = { contesto: ['✓', 'Contesté'], decide: ['⚠️', 'Te toca decidir'], nada: ['·', 'No hacía falta contestar'], freno: ['⏸', 'No contesté sola'], propuesta: ['✎', 'Te lo dejé de propuesta'], error: ['!', 'Falló la IA'] };
function hojaBitacora(){
  const l = datos.contestadas || [];
  return `<h2 style="margin-top:28px">Lo que llegó y lo que hice</h2>` + (l.length ? l.map(x => { const [i, n] = QUE[x.que] || ['·', x.que];
    return `<article class="tarjeta bitacora" data-que="${esc(x.que)}">
      <div class="fila"><span class="quien">${esc(x.nombre)}</span><span class="meta">${i} ${n} · ${cuando(x.t)}</span></div>
      <p class="meta">Te escribió: «${esc(x.dijo)}»</p>
      ${x.resp ? `<p>${x.que === 'propuesta' ? 'Te propuse (no se ha mandado)' : 'Contesté'}: «${esc(x.resp)}»</p>` : ''}
      ${x.porque ? `<p class="motivo">Por qué: ${esc(x.porque)}</p>` : ''}
    </article>`; }).join('') : '<p class="vacio">Todavía no ha llegado nada desde que se prendió.</p>');
}
function hojaPropuestas(){
  const ps = [...datos.propuestas].sort((a, b) => b.t - a.t);
  $('#hoja').innerHTML = `<h2>Por mandar</h2>` + (ps.length > 1 ? `<button class="boton principal" id="bTodas" style="width:100%;margin-bottom:12px">Mandar todas (${ps.length})</button>` : '') + (ps.length ? ps.map(p => `
    <article class="tarjeta" data-n="${p.n}">
      <div class="fila"><span class="quien">${esc(p.nombre)}</span><span class="meta">#${p.n} · ${p.tipo === 'manana' ? 'buenos días' : p.tipo === 'noche' ? 'buenas noches' : 'respuesta'} · ${cuando(p.t)}</span></div>
      ${p.dijo ? `<p class="meta">Te escribió: «${esc(p.dijo)}»</p>` : ''}
      <label class="etq" for="t${p.n}">Lo que se mandaría (puedes cambiarlo)</label>
      <textarea class="campo" id="t${p.n}">${esc(p.texto)}</textarea>
      ${p.motivo ? `<p class="motivo">⚠️ ${esc(p.motivo)}</p>` : ''}
      <div class="acciones"><button class="boton principal" data-mandar>Mandar</button><button class="boton peligro" data-tirar>Tirar</button></div>
    </article>`).join('') : `<p class="vacio">Nada por mandar. Lo que necesite tu número aparece aquí.</p>`) + hojaBitacora();
  document.querySelectorAll('#hoja article[data-n]').forEach(el => {
    const n = +el.dataset.n, p = datos.propuestas.find(x => x.n === n);
    $('[data-mandar]', el).onclick = async (e) => {
      const texto = $('textarea', el).value.trim(); if(!texto) return avisito('Está vacío');
      e.target.disabled = true;
      try{ await api(actual + '/propuesta', { n, texto: texto === p.texto ? '' : texto }); avisito('Mandado a ' + p.nombre); await cargar(true); }
      catch(err){ e.target.disabled = false; avisito(err.message); }
    };
    $('[data-tirar]', el).onclick = async () => { try{ await api(actual + '/propuesta', { n, tirar: true }); avisito('Tirada'); await cargar(true); }catch(err){ avisito(err.message); } };
  });
  /* «Mandar todas»: las que cambiaste aquí salen con TU texto; las demás, como están */
  if($('#bTodas')) $('#bTodas').onclick = async (e) => {
    e.target.disabled = true;
    try{
      for(const el of document.querySelectorAll('#hoja article[data-n]')){
        const n = +el.dataset.n, p = datos.propuestas.find(x => x.n === n), t = $('textarea', el).value.trim();
        if(p && t && t !== p.texto) await api(actual + '/propuesta', { n, texto: t });
      }
      await api(actual + '/propuesta', { todas: true });
      avisito('Mandadas'); await cargar(true);
    }catch(err){ e.target.disabled = false; avisito(err.message); }
  };
}

/* ══ Chats ═══════════════════════════════════════════════════════════════ */
const NOMBRE_MODO = { borrador: 'te propongo respuestas', callado: 'sólo anoto pendientes', auto: 'contesto sola', rol: 'sigo la historia sola' };
const modoDe = (c) => c.modo === 'auto' && c.rol ? 'rol' : c.modo;
const RAPIDOS = { persona: [['auto', 'Sola'], ['borrador', 'Propone'], ['callado', 'Callada']], grupo: [['auto', 'Si me hablan'], ['rol', 'Rol'], ['borrador', 'Propone'], ['callado', 'Callada']] };
let filtroChats = 'todos', buscaChats = '';
const sinAc = (t) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function chatsVisibles(){
  const q = sinAc(buscaChats.trim());
  return datos.chats.filter(c => (filtroChats === 'todos' || (filtroChats === 'grupos') === !!c.grupo) && (!q || sinAc(c.nombre).includes(q) || c.id.startsWith(q.replace(/\D/g, '') || '¬')));
}
function hojaChats(){
  const todos = chatsVisibles(), cs = todos.slice(0, 80);
  const tipo = filtroChats === 'grupos' ? 'grupo' : filtroChats === 'personas' ? 'persona' : '';
  $('#hoja').innerHTML = `<h2>Chats</h2><p class="meta">${datos.chats.length} chats. Toca un botón para cambiar cómo contesta Secre; abre el chat para más.</p>
    <div class="acciones" style="margin-top:0"><button class="boton" id="bContactos">📇 Cargar contactos y grupos</button></div>
    <label class="oculto" for="busChats">Buscar chat</label><input class="campo" id="busChats" type="search" placeholder="Buscar por nombre o número…" value="${esc(buscaChats)}" autocomplete="off">
    <div class="filtros" role="group" aria-label="Qué chats ver">${[['todos', 'Todos'], ['personas', 'Personas'], ['grupos', 'Grupos']].map(([k, n]) => `<button data-filtro="${k}" aria-pressed="${filtroChats === k}">${n}</button>`).join('')}</div>
    ${tipo ? `<div class="tarjeta masivo"><span class="meta">${tipo === 'grupo' ? 'Todos estos grupos' : 'Todas estas personas'} (${todos.length}), de un toque:</span>
      <div class="seg" style="margin-top:8px">${RAPIDOS[tipo].filter(([m]) => m !== 'rol').map(([m, n]) => `<button data-masivo="${m}">${n}</button>`).join('')}</div>
      ${tipo === 'grupo' ? `<p class="meta" style="margin:10px 0 4px">Grupos nuevos que no tengan modo:</p><div class="seg">${[['callado', 'Callada'], ['borrador', 'Propone']].map(([m, n]) => `<button data-defgrupos="${m}" aria-pressed="${datos.config.grupos === m}">${n}</button>`).join('')}</div>` : ''}</div>` : ''}
    <details class="tarjeta comunidad" id="dCom"><summary><span class="quien">🎭 Comunidad de rol</span><span class="modo">todos sus grupos de un jalón</span></summary>
      <div id="comCuerpo"><p class="meta">Buscando tus comunidades…</p></div></details>` + (cs.length ? cs.map(c => `
    <details class="tarjeta" data-id="${esc(c.id)}"><summary><span class="quien">${c.grupo ? '👥 ' : ''}${esc(c.nombre)}</span><span class="modo">${NOMBRE_MODO[c.modoAhora === 'auto' && c.rol ? 'rol' : c.modoAhora] || c.modoAhora}</span>
      <span class="seg" role="group" aria-label="Cómo contesta en ${esc(c.nombre)}">${RAPIDOS[c.grupo ? 'grupo' : 'persona'].map(([m, n]) => `<button type="button" data-rapido="${m}" aria-pressed="${(c.modoAhora === 'auto' && c.rol ? 'rol' : c.modoAhora) === m}">${n}</button>`).join('')}</span></summary>
      <label class="etq">Qué hace Secre con este chat</label>
      <select class="campo" data-modo>
        <option value="" ${!c.modo ? 'selected' : ''}>Lo normal (${NOMBRE_MODO[c.grupo ? datos.config.grupos : datos.config.porDefecto]})</option>
        <option value="borrador" ${c.modo === 'borrador' ? 'selected' : ''}>Proponerme respuestas</option>
        <option value="callado" ${c.modo === 'callado' ? 'selected' : ''}>Sólo anotar pendientes</option>
        <option value="auto" ${modoDe(c) === 'auto' ? 'selected' : ''}>${c.grupo ? 'Contestar sola cuando me hablen' : 'Contestarle sola, como mi asistente'}</option>
        ${c.grupo ? `<option value="rol" ${modoDe(c) === 'rol' ? 'selected' : ''}>Seguir la historia sola (rol)</option>` : ''}</select>
      ${c.grupo ? `<label class="etq">Tu personaje (para el rol)</label>
      <textarea class="campo" data-personaje placeholder="ej. Kael, mercenario callado que odia a los magos">${esc(c.personaje || '')}</textarea>
      <label class="etq">Marca de tu personaje (lo que dice sale con ella; lo que hace, con «> »)</label>
      <input class="campo" data-marca maxlength="30" placeholder="ej. 🌌⚛️-" value="${esc(c.marca || '')}">
      <p class="meta">${c.nStickers ? `Tengo ${c.nStickers} sticker(s) tuyos de aquí y los uso de vez en cuando.` : 'Manda stickers en el grupo y los aprendo para usarlos de vez en cuando.'}</p>
      <fieldset class="elenco"><legend class="etq">También juegan aquí, cada una con su personaje (aunque tú estés jugando)</legend>${elencoChecks(c.elenco, 'data-elenco')}</fieldset>
      <label class="etq">El mundo y la historia (lo lee antes de cada jugada)</label>
      <textarea class="campo" data-mundo rows="6" maxlength="4000" placeholder="ej. Reino de Valdor. La magia está prohibida. Ana juega a Lyra, la ladrona. Lo último: el rey murió y nadie sabe quién fue.">${esc(c.mundo || '')}</textarea>` : ''}
      <label class="etq">Quién es (para que las respuestas le hablen bien)</label>
      <textarea class="campo" data-nota placeholder="ej. es mi novia, háblale bonito · es el profe de mate, de usted">${esc(c.nota || '')}</textarea>
      <label class="etq">Grupos (separados por coma)</label>
      <input class="campo" data-etq value="${esc((c.etiquetas || []).join(', '))}" placeholder="escuela, familia">
      <div class="acciones"><button class="boton principal" data-guardar>Guardar</button></div>
    </details>`).join('') + (todos.length > cs.length ? `<p class="meta">Y ${todos.length - cs.length} más: búscalos por nombre.</p>` : '') : `<p class="vacio">${datos.chats.length ? 'Nada con ese nombre.' : 'Todavía no hay chats. Toca «Cargar contactos y grupos».'}</p>`);
  $('#busChats').oninput = () => { buscaChats = $('#busChats').value; const pos = $('#busChats').selectionStart; huella = ''; hojaChats(); const b = $('#busChats'); b.focus(); try{ b.setSelectionRange(pos, pos); }catch{} };
  document.querySelectorAll('[data-filtro]').forEach(b => b.onclick = () => { filtroChats = b.dataset.filtro; huella = ''; hojaChats(); });
  $('#bContactos').onclick = async () => {
    $('#bContactos').disabled = true; $('#bContactos').textContent = 'Cargando…';
    try{ const r = await api(actual + '/contactos', {}); avisito(`Listo: ${r.total} chats (${r.grupos} grupos y ${r.personas} contactos de tu agenda)`); huella = ''; await cargar(true); }
    catch(e){ avisito(e.message); $('#bContactos').disabled = false; $('#bContactos').textContent = '📇 Cargar contactos y grupos'; }
  };
  const cambiar = async (ids, modo, extra = {}) => { try{ const r = await api(actual + '/modos', { ids, modo, ...extra }); avisito(extra.porDefectoGrupos ? `Listo: los grupos nuevos quedan en «${extra.porDefectoGrupos === 'callado' ? 'Callada' : 'Propone'}»` : `Listo: ${r.n} chat(s)`); huella = ''; await cargar(true); }catch(e){ avisito(e.message); } };
  document.querySelectorAll('[data-rapido]').forEach(b => b.onclick = (e) => { e.preventDefault(); e.stopPropagation(); cambiar([b.closest('details').dataset.id], b.dataset.rapido); });
  document.querySelectorAll('[data-masivo]').forEach(b => b.onclick = () => cambiar(chatsVisibles().map(c => c.id), b.dataset.masivo));
  document.querySelectorAll('[data-defgrupos]').forEach(b => b.onclick = () => cambiar([], '', { porDefectoGrupos: b.dataset.defgrupos }));
  $('#dCom').ontoggle = () => { if($('#dCom').open) abrirComunidad(); };
  document.querySelectorAll('#hoja details[data-id]').forEach(el => {
    $('[data-guardar]', el).onclick = async () => {
      try{ await api(actual + '/chat', { id: el.dataset.id, modo: $('[data-modo]', el).value, nota: $('[data-nota]', el).value, etiquetas: $('[data-etq]', el).value, ...($('[data-personaje]', el) ? { personaje: $('[data-personaje]', el).value, mundo: $('[data-mundo]', el).value, marca: $('[data-marca]', el).value, elenco: [...el.querySelectorAll('[data-elenco]:checked')].map(x => x.dataset.elenco) } : {}) }); el.open = false; avisito('Guardado'); await cargar(true); }
      catch(err){ avisito(err.message); }
    };
  });
}

/* ══ Comunidad de rol ════════════════════════════════════════════════════
   Carlos, 16 de octubre: «en un botón aparte pon todo para seleccionar la
   comunidad donde están todos los grupos del rol y darle contexto e
   instrucciones». Lo que se pone aquí lo heredan todos los grupos; lo que un
   grupo tenga en su propia tarjeta le gana. */
let comLista = [], comGuardadas = {};
async function abrirComunidad(){
  const caja = $('#comCuerpo');
  try{ const r = await api(actual + '/comunidades', {}); comLista = r.comunidades || []; comGuardadas = r.guardadas || {}; }
  catch(e){ caja.innerHTML = `<p class="meta">${esc(e.message)}</p>`; return; }
  if(!comLista.length){ caja.innerHTML = '<p class="meta">No encontré comunidades en esta cuenta. Si tus grupos de rol están en una, revisa que sigas dentro.</p>'; return; }
  const ya = comLista.find(c => comGuardadas[c.id]) || comLista[0];
  caja.innerHTML = `<label class="etq" for="comSel">Comunidad</label>
    <select class="campo" id="comSel">${comLista.map(c => `<option value="${esc(c.id)}" ${c.id === ya.id ? 'selected' : ''}>${esc(c.nombre)} (${c.grupos.length} grupos)</option>`).join('')}</select>
    <div id="comForma"></div>`;
  $('#comSel').onchange = () => pintarComunidad($('#comSel').value);
  pintarComunidad(ya.id);
}
function pintarComunidad(id){
  const com = comLista.find(c => c.id === id), g = comGuardadas[id] || {};
  const prendido = (gid) => { const c = datos.chats.find(x => x.id === gid); return !!(c && c.rol && c.modo === 'auto'); };
  const nuevo = !comGuardadas[id];
  $('#comForma').innerHTML = `<label class="etq">En qué grupos sigo la historia sola</label>
    <label class="pend"><input type="checkbox" id="comTodos"><span><b>Todos los grupos</b></span></label>
    <div id="comGrupos">${com.grupos.map(x => `<label class="pend"><input type="checkbox" data-g="${esc(x.id)}" ${nuevo || prendido(x.id) ? 'checked' : ''}><span>👥 ${esc(x.nombre)}</span></label>`).join('') || '<p class="meta">Esta comunidad no tiene grupos donde estés.</p>'}</div>
    <label class="etq" for="comPersonaje">Tu personaje (vale para todos sus grupos)</label>
    <textarea class="campo" id="comPersonaje" maxlength="800" placeholder="ej. Kael, mercenario callado que odia a los magos">${esc(g.personaje || '')}</textarea>
    <label class="etq" for="comMarca">Marca de tu personaje</label>
    <input class="campo" id="comMarca" maxlength="30" placeholder="ej. 🌌⚛️-" value="${esc(g.marca || '')}">
    <label class="etq" for="comMundo">El mundo y la historia (lo lee en cada grupo antes de jugar)</label>
    <textarea class="campo" id="comMundo" rows="7" maxlength="6000" placeholder="ej. Reino de Valdor. La magia está prohibida. Taberna = el pueblo, Bosque = la frontera. Ana juega a Lyra, la ladrona.">${esc(g.mundo || '')}</textarea>
    <label class="etq" for="comInstr">Instrucciones (cómo quieres que juegue)</label>
    <textarea class="campo" id="comInstr" rows="5" maxlength="3000" placeholder="ej. Nunca ataques primero. Respeta los turnos del narrador. Nada de romance. Si te retan a duelo, acepta pero no mates a nadie.">${esc(g.instrucciones || '')}</textarea>
    <fieldset class="elenco"><legend class="etq">En todos sus grupos juegan también</legend>${elencoChecks(g.elenco, 'data-comelenco')}</fieldset>
    <p class="meta">Si un grupo tiene su propio personaje, marca o mundo en su tarjeta, eso le gana o se suma a esto.</p>
    <div class="acciones"><button class="boton principal" id="bComGuardar">Guardar la comunidad</button></div>`;
  const marcas = () => [...document.querySelectorAll('#comGrupos input')];
  const alTodos = () => { const m = marcas(); $('#comTodos').checked = m.length > 0 && m.every(x => x.checked); };
  $('#comTodos').onchange = () => { marcas().forEach(x => x.checked = $('#comTodos').checked); };
  marcas().forEach(x => x.onchange = alTodos); alTodos();
  $('#bComGuardar').onclick = async () => {
    try{
      const r = await api(actual + '/comunidad', { id: com.id, nombre: com.nombre, grupos: com.grupos,
        activos: marcas().filter(x => x.checked).map(x => x.dataset.g),
        personaje: $('#comPersonaje').value, marca: $('#comMarca').value, mundo: $('#comMundo').value, instrucciones: $('#comInstr').value,
        elenco: [...document.querySelectorAll('[data-comelenco]:checked')].map(x => x.dataset.comelenco) });
      $('#dCom').open = false; avisito(r.hecho); await cargar(true);
    }catch(e){ avisito(e.message); }
  };
}

/* ══ Saludos, reglas y ajustes ═══════════════════════════════════════════ */
function opcionesChats(sel){ return datos.chats.filter(c => !c.grupo).map(c => `<option value="${esc(c.id)}" ${c.id === sel ? 'selected' : ''}>${esc(c.nombre)}</option>`).join(''); }
function textoRegla(r){
  const p = [];
  if(r.palabras) p.push('si hablan de ' + r.palabras.join(', '));
  if(r.etiquetas) p.push('con los de ' + r.etiquetas.join(', '));
  if(r.chats) p.push('con ' + r.chats.map(nombreDe).join(', '));
  if(r.de) p.push(`de ${r.de} a ${r.a}`);
  if(r.hasta) p.push('hasta el ' + dia(r.hasta - 1));
  return `<b>${r.modo === 'callado' ? 'No proponer' : r.modo === 'auto' ? 'Contestar sola' : 'Proponer'}</b> ${esc(p.join(' · '))}`;
}
/* el elenco del rol: Paulina y Negro con sus personajes */
const elencoChecks = (sel, attr) => ['Paulina', 'Negro'].map(q => { const P = (datos.config.personajes || {})[q] || {}; return `<label class="fila-check"><input type="checkbox" ${attr}="${q}" ${(sel || []).includes(q) ? 'checked' : ''}> ${q} juega como <b>${esc(P.nombre || q)}</b> <span class="meta">${esc(P.marca || '')}</span></label>`; }).join('');
const DIAS_CORTOS = ['D', 'L', 'M', 'M', 'J', 'V', 'S'];
const DIAS_LARGOS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
function textoDias(d){
  const x = (d && d.length ? d : [0, 1, 2, 3, 4, 5, 6]).slice().sort((a, b) => a - b).join(',');
  return x === '0,1,2,3,4,5,6' ? 'diario' : x === '1,2,3,4,5' ? 'de lunes a viernes' : x === '0,6' ? 'fines de semana' : 'los ' + d.map(i => DIAS_LARGOS[i]).join(', ');
}
const diasChecks = (marcados) => [1, 2, 3, 4, 5, 6, 0].map(i => `<label class="dia"><input type="checkbox" value="${i}" ${marcados.includes(i) ? 'checked' : ''}><span aria-hidden="true">${DIAS_CORTOS[i]}</span><span class="oculto">${DIAS_LARGOS[i]}</span></label>`).join('');
const nombreChat = (id) => ((datos.chats || []).find(c => c.id === id) || {}).nombre || id.split('@')[0];
const opcionesTodos = () => (datos.chats || []).map(c => `<option value="${esc(c.id)}">${c.grupo ? '👥 ' : ''}${esc(c.nombre)}</option>`).join('');
function hojaAjustes(){
  const c = datos.config;

    ${datosV.map(d => `<div class="tarjeta fila" style="flex-wrap:nowrap"><span style="flex:1">${esc(d.texto)}${d.hasta ? `<br><span class="meta">hasta el ${dia(d.hasta - 1)}</span>` : ''}</span><button class="boton peligro" data-olvida="${d.n}">Olvidar</button></div>`).join('') || '<p class="meta">Todavía no le has contado nada.</p>'}
    <div class="tarjeta"><label class="etq" for="dTexto">Cuéntale algo</label>
      <textarea class="campo" id="dTexto" placeholder="ej. el viernes 17 hay examen de mate a las 8, temas: derivadas"></textarea>
      <label class="etq" for="dHasta">Deja de servir el día (vacío = siempre)</label><input class="campo" id="dHasta" type="date">
      <div class="acciones"><button class="boton principal" id="bDato">Guardar</button></div></div>

    <h2>Buenos días y buenas noches</h2>
    <p class="meta">A la hora que pongas, Secre te deja el saludo listo en «Por mandar». Tú lo mandas con un toque.</p>
    ${c.saludos.map((s, i) => `<div class="tarjeta" data-i="${i}"><div class="fila"><span class="quien">${esc(nombreDe(s.chat))}</span></div>
      <div class="dos"><div><label class="etq">Buenos días</label><input class="campo" type="time" data-m value="${esc(s.manana)}"></div>
      <div><label class="etq">Buenas noches</label><input class="campo" type="time" data-n value="${esc(s.noche)}"></div></div>
      <label class="etq">Que varíe hasta ± minutos (para que no sea siempre la misma hora)</label><input class="campo" type="number" min="0" max="60" data-v value="${s.variacion ?? 10}">
      <div class="acciones"><button class="boton principal" data-g>Guardar</button><button class="boton peligro" data-q>Quitar</button></div></div>`).join('')}
    <div class="tarjeta"><label class="etq" for="sChat">Agregar saludos para…</label>
      ${datos.chats.some(x => !x.grupo) ? `<select class="campo" id="sChat">${opcionesChats()}</select>
      <div class="dos"><div><label class="etq" for="sM">Buenos días</label><input class="campo" id="sM" type="time" value="07:00"></div><div><label class="etq" for="sN">Buenas noches</label><input class="campo" id="sN" type="time" value="22:30"></div></div>
      <div class="acciones"><button class="boton principal" id="bSaludo">Agregar</button></div>` : '<p class="meta">Primero tiene que escribirte esa persona (o tú a ella) para que Secre la conozca.</p>'}</div>

    <h2>Reglas</h2>
    <p class="meta">Para cambiar lo que hace Secre según el tema, el grupo o la hora. La más nueva gana.</p>
    ${c.reglas.map(r => `<div class="tarjeta fila" style="flex-wrap:nowrap"><span style="flex:1">${textoRegla(r)}</span><button class="boton peligro" data-quitar="${esc(r.id)}">Quitar</button></div>`).join('') || '<p class="meta">Sin reglas.</p>'}
    <details class="tarjeta"><summary><span class="quien">＋ Nueva regla</span></summary>
      <label class="etq" for="rModo">Qué hacer</label><select class="campo" id="rModo"><option value="callado">No proponer respuestas (sólo pendientes)</option><option value="borrador">Sí proponer respuestas</option><option value="auto">Contestar sola (menos en grupos)</option></select>
      <label class="etq" for="rPal">Si hablan de… (palabras separadas por coma)</label><input class="campo" id="rPal" placeholder="tarea, examen">
      <label class="etq" for="rEtq">Con los de estos grupos</label><input class="campo" id="rEtq" placeholder="escuela">
      <div class="dos"><div><label class="etq" for="rDe">Desde las</label><input class="campo" id="rDe" type="time"></div><div><label class="etq" for="rA">Hasta las</label><input class="campo" id="rA" type="time"></div></div>
      <label class="etq" for="rHasta">Vale hasta el día (vacío = siempre)</label><input class="campo" id="rHasta" type="date">
      <div class="acciones"><button class="boton principal" id="bRegla">Crear regla</button></div></details>

    <h2>Los personajes de Paulina y Negro</h2>
    <p class="meta">En los grupos de rol donde los prendas, cada una juega su personaje aparte del tuyo.</p>
    ${['Paulina', 'Negro'].map(q => { const P = (c.personajes || {})[q] || {}; return `<details class="tarjeta"><summary>${q} · <b>${esc(P.nombre || q)}</b> <span class="meta">${esc(P.marca || '')}</span></summary>
      <label class="etq" for="pn${q}">Nombre del personaje</label><input class="campo" id="pn${q}" maxlength="40" value="${esc(P.nombre || '')}">
      <label class="etq" for="pm${q}">Marca (lo que dice sale con ella)</label><input class="campo" id="pm${q}" maxlength="30" value="${esc(P.marca || '')}">
      <label class="etq" for="pf${q}">Ficha (edad, poderes, historia, apariencia…)</label><textarea class="campo" id="pf${q}" rows="6" maxlength="1500">${esc(P.ficha || '')}</textarea>
      <div class="acciones"><button class="boton principal" data-guardapers="${q}">Guardar a ${esc(P.nombre || q)}</button></div></details>`; }).join('')}

    <h2>Lo que sale solo</h2>
    <p class="meta">Mensajes que manda a su hora (la clase que toca, recordatorios…) y fotos de tu banco que publica sola con su nombre.</p>
    ${(c.programados || []).map(p => `<div class="tarjeta fila" style="flex-wrap:nowrap"><span style="flex:1">⏰ <b>${esc(nombreChat(p.chat))}</b> · ${esc(p.hora)} ${esc(textoDias(p.dias))}<br><span class="meta">${p.texto ? esc(p.texto) : 'sobre: ' + esc(p.tema)}</span></span><button class="boton peligro" data-quitaprog="${esc(p.id)}">Quitar</button></div>`).join('')}
    ${(c.publicar || []).map(p => `<div class="tarjeta fila" style="flex-wrap:nowrap"><span style="flex:1">📷 <b>${esc(nombreChat(p.chat))}</b> · ${esc(p.hora)} ${esc(textoDias(p.dias))}<br><span class="meta">${p.cuantas || 3} foto(s)${p.carpeta ? ' de «' + esc(p.carpeta) + '»' : ''}${p.buscar ? ' de ' + esc(p.buscar) : ''}</span></span><button class="boton peligro" data-quitapub="${esc(p.id)}">Quitar</button></div>`).join('')}
    ${!(c.programados || []).length && !(c.publicar || []).length ? '<p class="meta">Nada programado todavía.</p>' : ''}
    <details class="tarjeta"><summary>⏰ Nuevo mensaje programado</summary>
      <label class="etq" for="pChat">A qué chat</label><select class="campo" id="pChat">${opcionesTodos()}</select>
      <label class="etq" for="pHora">A qué hora</label><input class="campo" id="pHora" type="time" value="07:00">
      <fieldset class="dias" id="pDias"><legend class="etq">Qué días</legend>${diasChecks([1, 2, 3, 4, 5])}</fieldset>
      <label class="etq" for="pTexto">Qué dice (tal cual)</label><textarea class="campo" id="pTexto" placeholder="📚 Ahorita toca Matemáticas"></textarea>
      <label class="etq" for="pTema">…o sobre qué tema lo escribe Secre cada vez (si dejas vacío lo de arriba)</label><input class="campo" id="pTema" placeholder="recordar la tarea de la semana">
      <div class="acciones"><button class="boton principal" id="bProg">Programar</button></div></details>
    <details class="tarjeta"><summary>📷 Publicar fotos del banco cada día</summary>
      <label class="etq" for="uChat">En qué chat</label><select class="campo" id="uChat">${opcionesTodos()}</select>
      <label class="etq" for="uCarpeta">De qué carpeta del banco</label><input class="campo" id="uCarpeta" placeholder="All's fashion">
      <label class="etq" for="uBuscar">…o de qué (palabras)</label><input class="campo" id="uBuscar" placeholder="sudaderas, termos">
      <label class="etq" for="uCuantas">Cuántas fotos</label><input class="campo" id="uCuantas" type="number" min="1" max="10" value="3" inputmode="numeric">
      <label class="etq" for="uHora">A qué hora</label><input class="campo" id="uHora" type="time" value="10:00">
      <fieldset class="dias" id="uDias"><legend class="etq">Qué días</legend>${diasChecks([0, 1, 2, 3, 4, 5, 6])}</fieldset>
      <label class="etq" for="uIntro">Texto antes de las fotos (vacío = lo escribe Secre; «-» = sin texto)</label><input class="campo" id="uIntro">
      <div class="acciones"><button class="boton principal" id="bPub">Programar publicación</button></div></details>

    <h2>Lo general</h2>
    <div class="tarjeta">
      <label class="etq" for="gDef">Chats sin ajuste propio</label>
      <select class="campo" id="gDef"><option value="borrador" ${c.porDefecto === 'borrador' ? 'selected' : ''}>Proponerme respuestas</option><option value="callado" ${c.porDefecto === 'callado' ? 'selected' : ''}>Sólo anotar pendientes</option><option value="auto" ${c.porDefecto === 'auto' ? 'selected' : ''}>Contestarles sola (menos grupos)</option></select>
      <label class="etq" for="gFirma">Cuando contesta sola, firma como</label><input class="campo" id="gFirma" value="${esc((c.auto || {}).firma ?? 'Asistente de Carlos')}" placeholder="Asistente de Carlos">
      <p class="meta">Lo que necesite tu decisión (dinero, citas, compromisos) no lo contesta: le dice a la persona que ya te pasó su mensaje y te lo deja aquí. Máximo ${(c.auto || {}).porHora || 4} por hora y ${(c.auto || {}).alDia || 20} al día con cada quien, y nunca a otro bot.</p>
      <label class="etq" for="gRes">Resumen de pendientes del día, a las</label><input class="campo" id="gRes" type="time" value="${esc(c.resumen)}">
      <label class="etq" for="gAvisos">Dónde te escribo</label>
      <select class="campo" id="gAvisos"><option value="otra" ${c.avisarA !== 'yo' ? 'selected' : ''}>Desde tu otra cuenta (te suena la notificación)</option><option value="yo" ${c.avisarA === 'yo' ? 'selected' : ''}>En tu chat propio (no suena)</option></select>
      <label class="etq" for="gRepaso">Repaso de qué hice y qué falta</label>
      <select class="campo" id="gRepaso">${[0, 1, 2, 3, 4, 6].map(k => `<option value="${k}" ${((c.repaso || {}).cada ?? 3) === k ? 'selected' : ''}>${k ? `Cada ${k} h (9:00 a 22:00, sólo si pasó algo)` : 'Apagado'}</option>`).join('')}</select>
      <p class="meta">Para que te escriba desde la otra cuenta, las dos tienen que estar vinculadas aquí. Contéstale ahí mismo («3», «pendientes», «repaso»…).</p>
      <label class="etq" for="gVoz">Voz de los audios que manda</label>
      <select class="campo" id="gVoz">${['Kore', 'Aoede', 'Leda', 'Despina', 'Callirrhoe', 'Puck', 'Charon', 'Orus'].map(v => `<option ${c.voz === v || (!c.voz && v === 'Kore') ? 'selected' : ''}>${v}</option>`).join('')}</select>
      <label class="fila-check"><input type="checkbox" id="gLlamar" ${(c.llamar || {}).activo ? 'checked' : ''}> Llámame por teléfono cuando algo sea urgente</label>
      <label class="etq" for="gTel">A qué número (vacío = el de tu otra cuenta)</label><input class="campo" id="gTel" inputmode="tel" value="${esc((c.llamar || {}).tel || '')}" placeholder="4421234567">
      <p class="meta" id="mLlamadas">${datos.llamadas && datos.llamadas.listas ? 'Las llamadas están listas. De 8:00 a 23:00 y máximo una cada 20 min.' : 'Para que pueda llamarte falta la cuenta de llamadas (Twilio) en Render: ' + esc(((datos.llamadas || {}).falta || ['TWILIO_ACCOUNT_SID', 'TWILIO_AUTH_TOKEN', 'TWILIO_FROM']).join(', ')) + '.'}</p>
      <div class="acciones"><button class="boton principal" id="bGeneral">Guardar</button></div></div>`;

  $('#bDato').onclick = async () => {
    const t = $('#dTexto').value.trim(); if(!t) return avisito('Escribe qué quieres que sepa');
    try{ const r = await accion({ accion: 'dato', texto: t, hasta: $('#dHasta').value }); avisito(r.hecho); await cargar(true); }catch(e){ avisito('Eso ya lo sabía'); }
  };
  document.querySelectorAll('#hoja [data-olvida]').forEach(b => b.onclick = async () => { try{ await accion({ accion: 'olvidaDato', n: +b.dataset.olvida }); avisito('Olvidado'); await cargar(true); }catch(e){ avisito(e.message); } });
  document.querySelectorAll('#hoja [data-i]').forEach(el => {
    const s = c.saludos[+el.dataset.i];
    $('[data-g]', el).onclick = async () => { try{ const r = await accion({ accion: 'saludos', chat: s.chat, manana: $('[data-m]', el).value, noche: $('[data-n]', el).value, variacion: +$('[data-v]', el).value }); avisito(r.hecho); await cargar(true); }catch(e){ avisito(e.message); } };
    $('[data-q]', el).onclick = async () => { try{ await accion({ accion: 'quitarSaludos', chat: s.chat }); await cargar(true); }catch(e){ avisito(e.message); } };
  });
  const bS = $('#bSaludo'); if(bS) bS.onclick = async () => { try{ const r = await accion({ accion: 'saludos', chat: $('#sChat').value, manana: $('#sM').value, noche: $('#sN').value, variacion: 10 }); avisito(r.hecho); await cargar(true); }catch(e){ avisito(e.message); } };
  document.querySelectorAll('#hoja [data-quitar]').forEach(b => b.onclick = async () => { try{ await accion({ accion: 'quitarRegla', id: b.dataset.quitar }); await cargar(true); }catch(e){ avisito(e.message); } });
  const lista = (v) => v.split(',').map(x => x.trim()).filter(Boolean);
  $('#bRegla').onclick = async () => {
    const a = { accion: 'regla', modo: $('#rModo').value, palabras: lista($('#rPal').value), etiquetas: lista($('#rEtq').value), de: $('#rDe').value, a: $('#rA').value, hasta: $('#rHasta').value };
    try{ const r = await accion(a); avisito(r.hecho); await cargar(true); }catch(e){ avisito('Ponle al menos un tema, un grupo o un horario'); }
  };
  document.querySelectorAll('[data-guardapers]').forEach(b => b.onclick = async () => { const q = b.dataset.guardapers;
    try{ const r = await accion({ accion: 'personaje', quien: q, nombre: $('#pn' + q).value.trim(), marca: $('#pm' + q).value.trim(), ficha: $('#pf' + q).value.trim() }); avisito(r.hecho); await cargar(true); }catch(e){ avisito(e.message); } });
  const diasDe = (id) => [...document.querySelectorAll(`#${id} input:checked`)].map(i => +i.value);
  $('#bProg').onclick = async () => {
    const texto = $('#pTexto').value.trim(), tema = $('#pTema').value.trim();
    if(!texto && !tema) return avisito('Escribe qué dice o sobre qué tema');
    try{ const r = await accion({ accion: 'programar', chat: $('#pChat').value, hora: $('#pHora').value, dias: diasDe('pDias'), texto, tema }); avisito(r.hecho); await cargar(true); }catch(e){ avisito('No pude programarlo: revisa el chat y la hora'); }
  };
  $('#bPub').onclick = async () => {
    if(!$('#uCarpeta').value.trim() && !$('#uBuscar').value.trim()) return avisito('Pon la carpeta o de qué son las fotos');
    try{ const r = await accion({ accion: 'publicar', chat: $('#uChat').value, carpeta: $('#uCarpeta').value.trim(), buscar: $('#uBuscar').value.trim(), cuantas: +$('#uCuantas').value || 3, hora: $('#uHora').value, dias: diasDe('uDias'), intro: $('#uIntro').value.trim() }); avisito(r.hecho); await cargar(true); }catch(e){ avisito('No pude programarla'); }
  };
  document.querySelectorAll('[data-quitaprog]').forEach(b => b.onclick = async () => { try{ await accion({ accion: 'quitarProgramado', id: b.dataset.quitaprog }); await cargar(true); }catch(e){ avisito(e.message); } });
  document.querySelectorAll('[data-quitapub]').forEach(b => b.onclick = async () => { try{ await accion({ accion: 'quitarPublicacion', id: b.dataset.quitapub }); await cargar(true); }catch(e){ avisito(e.message); } });
  $('#bGeneral').onclick = async () => {
    try{ await accion({ accion: 'porDefecto', modo: $('#gDef').value }); await accion({ accion: 'auto', firma: $('#gFirma').value.trim() }); await accion({ accion: 'resumen', hora: $('#gRes').value }); await accion({ accion: 'avisos', a: $('#gAvisos').value }); await accion({ accion: 'repaso', cada: +$('#gRepaso').value }); await accion({ accion: 'voz', voz: $('#gVoz').value }); await accion({ accion: 'llamar', activo: $('#gLlamar').checked, tel: $('#gTel').value }); avisito('Guardado'); await cargar(true); }catch(e){ avisito(e.message); }
  };
}

/* ══ Platica: lo mismo que escribirle en «Mensaje a ti mismo» ═══════════ */
function hojaPlatica(){
  const ch = datos.charla;
  $('#hoja').innerHTML = `<h2>Platica con Secre</h2>
    <div class="charla">${ch.length ? ch.map(m => `<div class="burbuja ${m.de === 'carlos' ? 'carlos' : 'secre'}">${esc(m.texto)}<time>${cuando(m.t)}</time></div>`).join('') : `<div class="burbuja secre">${esc(datos.ayuda)}</div>`}</div>
    <form class="escribir" id="fOrden"><label class="oculto" for="orden">Escríbele a Secre</label><input class="campo" id="orden" placeholder="ej. a Ana dale buenos días a las 7" autocomplete="off" enterkeyhint="send"><button class="boton principal">Enviar</button></form>`;
  $('#fOrden').onsubmit = async (e) => {
    e.preventDefault(); const t = $('#orden').value.trim(); if(!t) return;
    const b = $('#fOrden button'); b.disabled = true; $('#orden').value = '';
    try{ await api(actual + '/orden', { texto: t }); await cargar(true); window.scrollTo(0, document.body.scrollHeight); $('#orden').focus(); }
    catch(err){ $('#orden').value = t; avisito(err.message); }
    finally{ b.disabled = false; }
  };
}

arrancar().catch(() => pintarEntrar());
