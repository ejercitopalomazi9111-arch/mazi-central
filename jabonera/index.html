<title>Jabonera · control de jabón en baños escolares</title>

<!-- ══════════════════════════════════════════════════════════════════════
     JABONERA
     Todo funciona SIN INTERNET y sin servidor: se puede abrir desde una
     memoria USB, desde el teléfono en modo avión o desde la web. Por eso los
     scripts van con <script src> clásico y no como módulos — un módulo ES
     no carga desde `file://` por la política de origen del navegador, y ahí
     se acaba el «lo abro en la compu del salón».
     ═════════════════════════════════════════════════════════════════════ -->
