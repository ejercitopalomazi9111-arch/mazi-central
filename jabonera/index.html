<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NERA · control de jabón en baños escolares</title>
<meta name="description" content="Registro y análisis del consumo de jabón en los baños de una escuela. Proyecto STEAM.">
<meta name="theme-color" content="#0B4F5C">
<link rel="stylesheet" href="estilo.css">

<!-- ══════════════════════════════════════════════════════════════════════
     JABONERA
     Todo funciona SIN INTERNET y sin servidor: se abre desde una memoria
     USB, desde el teléfono en modo avión o desde la web. Por eso los
     scripts van con <script src> clásico y no como módulos — un módulo ES
     no carga desde `file://` por la política de origen del navegador, y ahí
     se acaba el «lo abro en la compu del salón».
     ═════════════════════════════════════════════════════════════════════ -->

<!-- La portada trae su propio campo de marca a sangre, así que esta cabecera
     se esconde ahí. Es la diferencia entre abrir como producto y abrir como
     panel de administración. -->
<header class="cabecera" id="cabecera" hidden>
  <div class="dentro">
    <button class="marca-ir" type="button" data-ir="inicio" aria-label="Ir a Inicio">
      <svg class="gota" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 2.5c3.6 4.2 6.5 7.7 6.5 11.1A6.5 6.5 0 0 1 5.5 13.6C5.5 10.2 8.4 6.7 12 2.5Z"
              fill="rgba(255,255,255,.22)" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
        <circle cx="9.6" cy="13.8" r="1.5" fill="#fff" opacity=".85"/>
      </svg>
      <span class="nom">NERA</span>
    </button>
    <div class="der">
      <button type="button" data-abrir-ajustes="1" aria-label="Ajustes" title="Ajustes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1 2 2 0 1 1-4 0 1.6 1.6 0 0 0-2.7-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 15a2 2 0 1 1 0-4 1.6 1.6 0 0 0 1.5-2.5l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 10 4a2 2 0 1 1 4 0 1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.6 1.6 0 0 0 21 11a2 2 0 1 1 0 4Z"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- La portada se pinta a sangre y sin `main`, para que el color llegue al
     borde de la pantalla; el resto de pestañas sí va dentro de `main`. -->
<section class="panel" id="p-inicio"></section>

<main>
  <div id="letreroDemo"></div>
  <section class="panel" id="p-registrar" hidden></section>
  <section class="panel" id="p-analisis"  hidden></section>
  <section class="panel" id="p-almacen"   hidden></section>
  <section class="panel" id="p-proyecto"  hidden></section>
  <section class="panel" id="p-ajustes"   hidden></section>
</main>

<nav class="pestanas no-imprimir" role="tablist" aria-label="Secciones">
  <button role="tab" data-tab="inicio" aria-selected="true" aria-controls="p-inicio">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    Inicio</button>
  <button role="tab" data-tab="registrar" aria-selected="false" aria-controls="p-registrar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    Registrar</button>
  <button role="tab" data-tab="analisis" aria-selected="false" aria-controls="p-analisis">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    Análisis</button>
  <button role="tab" data-tab="almacen" aria-selected="false" aria-controls="p-almacen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-5 9 5v11H3z"/><path d="M3 9h18M9 20V13h6v7"/></svg>
    Almacén</button>
  <button role="tab" data-tab="proyecto" aria-selected="false" aria-controls="p-proyecto">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.8-4.4 4.2 1.1 6L12 16.8 6.6 19.6l1.1-6L3.3 9.4l6.1-.8z"/></svg>
    Proyecto</button>
</nav>

<script src="motor.js"></script>
<script src="excel.js"></script>
<script src="datos.js"></script>
<script src="reporte.js"></script>
<script src="app.js"></script>
</html>
