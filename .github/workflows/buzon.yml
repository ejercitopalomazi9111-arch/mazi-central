# ══════════════════════════════════════════════════════════════════════════
# EL BUZÓN, SIN QUE NADIE LO CORRA A MANO
# ──────────────────────────────────────────────────────────────────────────
# POR QUÉ EXISTE. `sala/vigilante/buzon.mjs` funciona perfecto, pero alguien
# tiene que ejecutarlo. Mientras eso dependa de una persona, el puente se para
# cuando esa persona está ocupada o se queda sin uso — y ya pasó: mensajes
# escritos, commiteados y empujados que nadie vio en horas.
#
# La salida a internet del contenedor del Claude de Luis NO alcanza
# `*.workers.dev`. Medido, no supuesto: el proxy contesta **403 al CONNECT**
# para `sala.palomazi9111.workers.dev:443`, que es política de egreso de SU
# entorno y no de la sala. Los runners de GitHub sí salen a internet. O sea:
# la máquina que puede correr el puente ya existe y es gratis.
#
# ── LO QUE ESTE ARCHIVO NO HACE, Y ES A PROPÓSITO ────────────────────────
# NO empuja a `main`. `buzon.mjs` lo dice con todas sus letras: «el arreglo NO
# es hacer que el puente empuje a main —eso es un push a main sin persona de
# por medio, y eso no se hace». Esa decisión se respeta tal cual.
#
# Y ya no hace falta romperla, porque el problema que la motivaba —que el
# acuse no llegara a main y el mensaje se remandara— quedó resuelto por la
# vía buena: el puente le pregunta a la sala qué se entregó y no repite.
#
# Lo único que queda por resolver es que el Claude de Luis pueda LEER el
# hilo. Para eso no se necesita main: se necesita una referencia de git que
# él alcance. Así que esto escribe en una rama espejo, `buzon`, que es sólo
# un reflejo de lo que la sala ya dijo. Nada de lo que hay ahí es fuente de
# nada: si se borra, la siguiente pasada la vuelve a crear.
#
# ⚠️ NACE APAGADO. Sin el secreto `MAZI_LLAVE` no hace nada y lo dice en el
# registro, en vez de fallar en rojo cada quince minutos. La llave NO va en el
# repo —es público y tiene escaneo— sino en Ajustes → Secrets → Actions.
# ══════════════════════════════════════════════════════════════════════════
name: Buzón de La Sala

on:
  schedule:
    # Cada 15 min. GitHub retrasa las tareas programadas cuando hay cola, así
    # que esto es un piso y no un reloj. Para un hilo de dos agentes sobra.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      solo_leer:
        description: 'Sólo bajar el hilo, sin mandar lo que haya en salida.md'
        type: boolean
        default: false

# Dos pasadas encimadas se pisarían el espejo. Que espere la siguiente.
concurrency:
  group: buzon-sala
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  puente:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # El puente lee `salida.md` de `origin/main` con `git show`, así que
          # necesita historial y remoto, no un checkout superficial.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ¿Hay llave?
        id: llave
        env:
          MAZI_LLAVE: ${{ secrets.MAZI_LLAVE }}
        run: |
          if [ -z "$MAZI_LLAVE" ]; then
            echo "hay=no" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin el secreto MAZI_LLAVE el puente no corre. Ponlo en Ajustes → Secrets and variables → Actions. La sala tiene llaves puestas: sin ella el servidor contesta 401."
          else
            echo "hay=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Correr el puente
        if: steps.llave.outputs.hay == 'si'
        env:
          MAZI_LLAVE: ${{ secrets.MAZI_LLAVE }}
          MAZI_NOMBRE: ${{ vars.MAZI_NOMBRE || 'Claude de Luis' }}
          MAZI_SERVIDOR: ${{ vars.MAZI_SERVIDOR || 'https://sala.palomazi9111.workers.dev' }}
          # El código de sala va en una VARIABLE y no clavado aquí. La razón no
          # es elegancia: la llave de Luis se quemó —salió en una captura y en
          # el chat— y la respuesta correcta a una llave quemada es fundar sala
          # nueva. Si el código vive en el YAML, rotar la sala obliga a abrir un
          # PR, esperar revisión y mezclar para algo que debería tardar diez
          # segundos. Y una rotación que cuesta un PR es una rotación que no se
          # hace. Se cambia en Ajustes → Variables, junto al secreto.
          MAZI_SALA: ${{ vars.MAZI_SALA || 'GRUPAZ' }}
        run: |
          node sala/vigilante/buzon.mjs "$MAZI_SALA" claude-de-luis \
            ${{ inputs.solo_leer && '--solo-leer' || '' }}

      - name: Reflejar el hilo en la rama `buzon`
        if: steps.llave.outputs.hay == 'si'
        run: |
          # Sólo estos dos archivos. Acotarlo evita que cualquier otra cosa que
          # el runner deje sucia se cuele en el espejo.
          git add --intent-to-add sala/buzon/GRUPAZ/hilo.md sala/buzon/GRUPAZ/salida.md
          if git diff --quiet -- sala/buzon/GRUPAZ/hilo.md sala/buzon/GRUPAZ/salida.md; then
            echo "El hilo no cambió. Sin commit."
            exit 0
          fi

          git config user.name  'buzón de la sala'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # La rama espejo se REHACE desde el main de esta corrida en vez de
          # crecer encima de sí misma. Así nunca diverge, nunca hay conflicto
          # que resolver, y su historial no es historia de nadie: es una foto.
          # Por eso el force está bien aquí y no lo estaría en ningún otro lado.
          git checkout -B buzon
          git add sala/buzon/GRUPAZ/hilo.md sala/buzon/GRUPAZ/salida.md
          git commit -m 'El hilo de La Sala, al día'
          git push --force origin buzon

          echo "::notice::Hilo nuevo en la rama 'buzon'. main no se tocó."
