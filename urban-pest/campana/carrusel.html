<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Urban Pest · carrusel</title>
<!-- Las láminas de un carrusel de la campaña (plan.js), una debajo de otra, de 1080 × 1350.
     ?n=1..8 elige el carrusel. armar.mjs les toma foto una por una. -->
<style>
  @font-face{ font-family:M; src:url(../web/fuentes/montserrat.woff2) format("woff2"); font-weight:100 900; font-display:block }
  @font-face{ font-family:I; src:url(../web/fuentes/inter-400-800-normal.woff2) format("woff2"); font-weight:400 800; font-display:block }
  :root{ --marina:#143361; --marina-2:#0E2549; --azul:#165D9B; --sol:#F29923; --sol-claro:#F7E93F; --gris:#EEF2F6; --tinta:#14213A; --suave:#5C6879 }
  *{ box-sizing:border-box; margin:0 }
  body{ background:#888; font-family:I, sans-serif; color:var(--tinta) }
  .lam{ position:relative; width:1080px; height:1350px; overflow:hidden; background:var(--gris); margin-bottom:20px }
  .lam.oscura{ background:radial-gradient(120% 90% at 30% 20%, #1C4580 0%, var(--marina) 45%, var(--marina-2) 100%); color:#fff }
  .lam svg.i{ width:1em; height:1em; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round }
  /* arriba: logo chico y número de lámina */
  .top{ position:absolute; left:84px; right:84px; top:72px; display:flex; justify-content:space-between; align-items:center }
  .top img{ height:76px }
  .top .pag{ font:700 26px/1 M; letter-spacing:.12em; color:var(--suave) }
  .oscura .top .pag{ color:#9DB7DC }
  /* tapa */
  .tapa .t{ position:absolute; left:84px; right:84px; top:420px; font:800 112px/1.0 M; letter-spacing:-.035em }
  .tapa .s{ position:absolute; left:84px; right:120px; bottom:250px; font:500 44px/1.3 I; color:#C9D8EE }
  .tapa .barra{ position:absolute; left:84px; top:340px; width:120px; height:14px; border-radius:7px; background:var(--sol-claro) }
  .tapa .desliza{ position:absolute; right:84px; bottom:110px; font:700 28px/1 M; letter-spacing:.14em; text-transform:uppercase; color:var(--sol-claro); display:flex; gap:14px; align-items:center }
  /* interior */
  .tarj{ position:absolute; left:84px; right:84px; top:230px; bottom:200px; background:#fff; border-radius:48px; padding:96px 84px; box-shadow:0 40px 80px -50px #14213A66 }
  .ic{ width:176px; height:176px; border-radius:48px; background:#FFF3DF; color:var(--sol); display:grid; place-items:center; font-size:104px }
  .numero{ font:300 210px/0.8 M; color:var(--sol); letter-spacing:-.04em }
  .tarj .t{ margin-top:84px; font:800 84px/1.05 M; letter-spacing:-.03em; color:var(--marina) }
  .tarj .s{ margin-top:40px; font:500 46px/1.35 I; color:var(--suave) }
  .pie{ position:absolute; left:84px; right:84px; bottom:96px; display:flex; justify-content:space-between; font:700 28px/1 M; color:var(--suave); letter-spacing:.02em }
  .pie b{ color:var(--marina) }
  /* cita */
  .cita .q{ position:absolute; left:84px; right:84px; top:300px; font:600 60px/1.3 I; letter-spacing:-.01em; color:var(--marina) }
  .cita .q::before{ content:"“"; display:block; font:800 220px/0.6 M; color:var(--sol); margin-bottom:24px }
  .cita .quien{ position:absolute; left:84px; bottom:200px; font:700 40px/1.2 M; color:var(--tinta) }
  .cita .quien span{ display:block; font:500 30px/1.4 I; color:var(--suave) }
  /* cierre */
  .cierre .t{ position:absolute; left:84px; right:84px; top:380px; font:800 104px/1.02 M; letter-spacing:-.035em }
  .cierre .s{ position:absolute; left:84px; right:84px; top:640px; font:500 46px/1.35 I; color:#C9D8EE }
  .cierre .wa{ position:absolute; left:84px; right:84px; bottom:250px; height:150px; border-radius:40px; background:var(--sol-claro); color:var(--marina); display:flex; align-items:center; gap:30px; padding:0 48px; font:800 66px/1 M; letter-spacing:-.01em }
  .cierre .wa .i{ font-size:72px }
  .cierre .web{ position:absolute; left:84px; bottom:120px; font:600 32px/1 I; color:#9DB7DC }
</style>
</head>
<body>
<div id="laminas"></div>
<script type="module">
import { CARRUSELES, CONTACTO } from './plan.js';
window.listo = (async () => {
  const L = (await (await fetch('../../presentaciones/vendor/lucide-1.48.0.json')).json()).iconos;
  const ico = (n) => `<svg class="i" viewBox="0 0 24 24">${L[n] || ''}</svg>`;
  const n = +(new URLSearchParams(location.search).get('n') || 1), C = CARRUSELES.find((c) => c.n === n);
  const total = C.laminas.length;
  const logo = (blanco) => `<img src="../web/img/${blanco ? 'logo-entero' : 'logo-entero'}.webp" alt="" ${blanco ? 'style="filter:brightness(0) invert(1)"' : ''}>`;
  document.getElementById('laminas').innerHTML = C.laminas.map((l, i) => {
    const pag = `<span class="pag">${i + 1}/${total}</span>`;
    if(l.tapa) return `<section class="lam oscura tapa"><div class="top">${logo(true)}${pag}</div><div class="barra"></div><div class="t">${l.t}</div><div class="s">${l.s}</div><div class="desliza">Desliza ${ico('arrow-right')}</div></section>`;
    if(l.cierre) return `<section class="lam oscura cierre"><div class="top">${logo(true)}${pag}</div><div class="t">${l.t}</div><div class="s">${l.s}</div><div class="wa">${ico('message-circle')}${CONTACTO.tel}</div><div class="web">${CONTACTO.web}</div></section>`;
    if(l.cita) return `<section class="lam cita"><div class="top">${logo(false)}${pag}</div><div class="q">${l.cita}</div><div class="quien">${l.quien}<span>Cliente de Urban Pest Control</span></div><div class="pie"><span>Control de plagas · Querétaro</span><b>${CONTACTO.tel}</b></div></section>`;
    return `<section class="lam"><div class="top">${logo(false)}${pag}</div><div class="tarj">${l.num ? `<div class="numero">${l.num}</div>` : `<div class="ic">${ico(l.ico)}</div>`}<div class="t">${l.t}</div><div class="s">${l.s}</div></div><div class="pie"><span>Control de plagas · Querétaro</span><b>${CONTACTO.tel}</b></div></section>`;
  }).join('');
  await document.fonts.ready;
  await Promise.all([...document.images].map((im) => im.decode().catch(() => {})));
  /* que ningún título se salga: se achica hasta caber */
  for(const el of document.querySelectorAll('.tapa .t, .cierre .t, .tarj .t, .cita .q')){
    let px = parseFloat(getComputedStyle(el).fontSize);
    const tope = el.classList.contains('q') ? 760 : el.closest('.tarj') ? 380 : 420;
    while((el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > tope) && px > 30){ px -= 2; el.style.fontSize = px + 'px'; }
  }
  return true;
})();
</script>
</body>
</html>
