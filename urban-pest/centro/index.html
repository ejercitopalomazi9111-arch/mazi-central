<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#143361">
<script>/* la entrada con el logo sale una vez por sesión */(function(d){try{if(!sessionStorage.getItem("up-visto")){sessionStorage.setItem("up-visto","1");d.classList.add("up-abre")}}catch(e){}})(document.documentElement)</script>
<title>Centro · Urban Pest</title>
<link rel="icon" href="../web/img/sello.png">
<link rel="stylesheet" href="../chat/estilo.css">
<style>
/* EL CENTRO DE OPERACIONES (BRIEF §C): hoy, servicios, inventario y vehículo. Mismo sistema que el chat central
   (../chat/estilo.css), teléfono primero. Rutas en urban-pest/servidor/RUTAS.md. */
body{ min-height:100%; }
.env{ max-width:880px; margin:0 auto; padding:0 16px calc(96px + env(safe-area-inset-bottom)) }
.top{ position:sticky; top:0; z-index:5; background:var(--fondo); padding:14px 0 10px; display:flex; align-items:center; justify-content:space-between; gap:12px }
.top b{ font-size:20px } .top small{ display:block; color:var(--tenue); font-size:13px }
.atajos{ display:flex; gap:8px; overflow-x:auto; padding:2px 0 14px; scrollbar-width:none }
.atajos a{ flex:none; display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 14px; border-radius:999px; background:var(--sup); box-shadow:var(--elev1); color:var(--tinta); text-decoration:none; font-weight:600; font-size:14px }
.ic{ width:20px; height:20px; flex:none }
h2{ font-size:17px; margin:26px 0 10px; display:flex; align-items:center; gap:8px } h2 .n{ color:var(--tenue); font-weight:500 }
.cifras{ display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:10px }
.cifra{ background:var(--sup); border-radius:var(--r); padding:14px 16px; box-shadow:var(--elev1) }
.cifra b{ display:block; font-size:28px; line-height:1.1; font-variant-numeric:tabular-nums } .cifra small{ color:var(--tenue); font-size:13px }
.cifra.alerta b{ color:var(--aviso) }
.lista-c{ list-style:none; padding:0; margin:0; display:grid; gap:10px }
.item{ background:var(--sup); border-radius:var(--r); padding:14px 16px; box-shadow:var(--elev1); display:grid; gap:8px }
.item .t{ display:flex; justify-content:space-between; gap:12px; align-items:baseline } .item .t b{ font-size:16px } .item .t span{ color:var(--tenue); font-size:14px; white-space:nowrap; font-variant-numeric:tabular-nums }
.item p{ color:var(--tenue); font-size:14px; margin:0 }
.chip{ display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:12.5px; font-weight:700; background:var(--sup2); color:var(--tenue) }
.chip.aviso{ background:var(--aviso-suave); color:var(--aviso) } .chip.ok{ background:var(--acento-suave); color:var(--acento-texto) }
.acc{ display:flex; flex-wrap:wrap; gap:8px }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 16px; border-radius:var(--r2); background:var(--acento); color:var(--acento-tinta); font-weight:700; font-size:15px; text-decoration:none }
.btn.b2{ background:var(--sup2); color:var(--tinta) } .btn:disabled{ opacity:.5 }
.vacio{ color:var(--tenue); font-size:14px; padding:6px 2px }
details.nuevo{ background:var(--sup); border-radius:var(--r); box-shadow:var(--elev1); margin:6px 0 4px }
details.nuevo > summary{ list-style:none; min-height:52px; display:flex; align-items:center; gap:10px; padding:0 16px; font-weight:700; cursor:pointer; color:var(--acento-texto) }
details.nuevo > summary::-webkit-details-marker{ display:none }
.f{ display:grid; gap:12px; padding:0 16px 16px }
.f label{ display:grid; gap:6px; font-weight:600; font-size:14px }
.f input, .f select, .f textarea{ width:100%; min-height:48px; padding:12px; border-radius:var(--r2); border:1.5px solid var(--linea); background:var(--fondo); color:var(--tinta); font-size:16px }
.f textarea{ min-height:80px; resize:vertical }
.dos{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px }
.msj{ font-weight:600; font-size:14px; min-height:1.2em } .msj.mal{ color:#C0392B } .msj.bien{ color:var(--acento-texto) }
.filtro{ display:flex; gap:8px; overflow-x:auto; margin:4px 0 12px; scrollbar-width:none }
.filtro button{ flex:none; min-height:44px; padding:0 14px; border-radius:999px; background:var(--sup2); font-weight:600; font-size:14px; color:var(--tenue) }
.filtro button[aria-pressed="true"]{ background:var(--acento); color:var(--acento-tinta) }
.mov{ display:grid; grid-template-columns:minmax(0,1fr) 92px; gap:8px; align-items:end }
.barra-inf{ position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--sup); box-shadow:0 -1px 0 var(--linea); padding:6px 4px calc(6px + env(safe-area-inset-bottom)); display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)) }
.desg{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; font-size:14px; margin:0; padding:10px 12px; border-radius:var(--r2); background:var(--sup2) }
.desg dt{ color:var(--tenue) } .desg dd{ margin:0; text-align:right; font-variant-numeric:tabular-nums; font-weight:600 }
.desg .sep{ grid-column:1/-1; height:1px; background:var(--linea); margin:4px 0 }
.gana{ color:var(--acento-texto) }
.item details > summary{ cursor:pointer; color:var(--acento-texto); font-weight:700; font-size:14px; min-height:36px; display:flex; align-items:center }
.barra-inf button{ display:grid; justify-items:center; gap:2px; min-height:52px; font-size:12px; font-weight:600; color:var(--tenue); position:relative }
.barra-inf button[aria-current="page"]{ color:var(--acento-texto) }
.barra-inf i{ position:absolute; top:4px; right:calc(50% - 22px); min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--aviso); color:#fff; font:700 11px/18px var(--letra); font-style:normal }
/* la franja de estado: sin internet, cambios por enviar, datos de muestra (sin-red.js) */
.red{ position:sticky; top:0; z-index:5; margin:0 0 8px; padding:10px 14px; border-radius:0 0 var(--r) var(--r); background:var(--sup); box-shadow:var(--elev2); border-left:4px solid var(--aviso); font-size:14px; line-height:1.4 }
.red p{ margin:0 } .red p + p{ margin-top:6px } .red .btn{ margin-top:6px; min-height:44px }
.entrar{ max-width:440px; margin:12vh auto 0; background:var(--sup); border-radius:var(--r); padding:24px; box-shadow:var(--elev2) }
.entrar p{ color:var(--tenue); margin:8px 0 16px }
/* MOVIMIENTO Y ACABADO (Godines, 13 nov; lo pidió Luis: «llénalo de animaciones, premium y agradable»).
   Nombres con «up» porque en CSS todo es global y esta página comparte ../chat/estilo.css.
   Sólo transform: nada de opacidad sobre texto, y nada que cambie el tamaño de un botón al medirlo.
   Con «reducir movimiento» se mueve igual, más corto y sin lo que se repite: muchas compus lo traen
   encendido sin saberlo (Windows con «Efectos de animación» apagado) y quieto del todo parecía roto. */
.env{ overflow-x:clip }
.cifra{ position:relative; overflow:hidden; background-image:linear-gradient(160deg, color-mix(in srgb, var(--acento) 9%, transparent), transparent 58%) }
.cifra.alerta{ background-image:linear-gradient(160deg, color-mix(in srgb, var(--aviso) 16%, transparent), transparent 62%) }
.item{ transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s }
.item.up-ojo{ box-shadow:inset 3px 0 0 var(--aviso), var(--elev1) }
.btn, .filtro button, .atajos a{ transition:transform .14s ease, background-color .2s, color .2s }
.btn:active, .filtro button:active, .atajos a:active{ transform:scale(.96) }
.btn:not(.b2){ background-image:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0)); box-shadow:0 8px 18px -10px var(--acento) }
/* el nivel de cada insumo; la raya marca su mínimo */
.up-nivel{ position:relative; height:8px; border-radius:99px; background:var(--sup2); overflow:hidden }
.up-nivel span{ display:block; height:100%; border-radius:inherit; background:var(--acento); transform-origin:left; transform:scaleX(var(--n)) }
.up-nivel.bajo span{ background:var(--aviso) }
.up-nivel::after{ content:""; position:absolute; left:33.33%; top:0; bottom:0; width:2px; background:var(--sup) }
/* la luz que se desliza a la pestaña activa */
.barra-inf{ isolation:isolate }
.up-luz{ position:absolute; z-index:-1; left:0; top:6px; height:52px; width:0; border-radius:16px; background:var(--acento-suave); transition:transform .45s cubic-bezier(.3,1.3,.5,1), width .3s }
/* el aviso de «listo»: sube desde abajo y se va solo */
.up-aviso{ position:fixed; z-index:7; left:16px; right:16px; bottom:calc(84px + env(safe-area-inset-bottom)); max-width:520px; margin:0 auto; padding:12px 16px; border-radius:var(--r2); background:var(--tinta); color:var(--fondo); font-weight:600; font-size:14px; box-shadow:var(--elev2); transform:translateY(calc(100% + 150px)); transition:transform .4s cubic-bezier(.2,.9,.3,1.15); pointer-events:none }
.up-aviso.ve{ transform:none }
/* esqueleto mientras llega lo primero */
.up-esq{ display:grid; gap:10px; padding-top:64px } .up-esq i{ display:block; height:74px; border-radius:var(--r); background:linear-gradient(100deg, var(--sup2) 30%, var(--sup) 50%, var(--sup2) 70%) 0 0 / 300% 100% }
.up-esq i:first-child{ height:40px; width:52% }
.up-solo-lector{ position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%) }
@media screen{
  .env > *, .cifra, .lista-c > .item, .atajos a{ animation:upEntra .55s cubic-bezier(.2,.85,.25,1) both; animation-delay:calc(var(--up-t0, 0s) + var(--up-i, 0) * 45ms) }
  .env > *:nth-child(2){ animation-delay:calc(var(--up-t0, 0s) + 40ms) } .env > *:nth-child(3){ animation-delay:calc(var(--up-t0, 0s) + 80ms) } .env > *:nth-child(n+4){ animation-delay:calc(var(--up-t0, 0s) + 120ms) }
  @keyframes upEntra{ from{ transform:translateY(18px) } }
  .up-nivel span{ animation:upLlena .9s cubic-bezier(.2,.8,.2,1) .15s both } @keyframes upLlena{ from{ transform:scaleX(0) } }
  .barra-inf button[aria-current="page"] .ic{ animation:upBrinca .45s cubic-bezier(.3,1.6,.5,1) } @keyframes upBrinca{ 40%{ transform:translateY(-4px) scale(1.14) } }
  .barra-inf i{ animation:upLate 2.6s ease-in-out infinite } @keyframes upLate{ 50%{ transform:scale(1.14) } }
  .red:not([hidden]){ animation:upBaja .45s cubic-bezier(.2,.85,.25,1) } @keyframes upBaja{ from{ transform:translateY(-110%) } }
  .up-sale{ animation:upSale .23s ease-in forwards !important } @keyframes upSale{ to{ transform:translateX(110%) } }
  .up-esq i{ animation:upBrilla 1.3s linear infinite } @keyframes upBrilla{ to{ background-position:-150% 0 } }
  @media (hover:hover){ .item:hover{ transform:translateY(-2px); box-shadow:var(--elev2) } }
}
/* ══ LA MARCA DE URBAN PEST (Godines, 15 nov; Luis: «se ve muy mal, hazlo de acuerdo a la estética, con
   animaciones e imágenes»). Colores, logo y letras de su página (urbanpest.mx, ver urban-pest/web/LEEME.md):
   marino #143361, azul #165D9B, naranja #F29923; Archivo para títulos e Inter para leer. El logo va en piezas
   (marca/, las cortó Luna) y se arma al entrar, una vez por sesión. Fotos: las dos de la página nueva (Pexels)
   en duotono marino; nada de insectos ni de fumigadores (Carlos, 11 nov). Los dibujos de cada sección son SVG
   hechos aquí. Todo viaja con el centro (sw.js lo guarda): abre igual sin internet. ══ */
@font-face{ font-family:"Archivo UP"; src:url(fuentes/archivo-400-900-normal.woff2) format("woff2"); font-weight:400 900; font-display:swap }
@font-face{ font-family:"Inter UP"; src:url(fuentes/inter-400-800-normal.woff2) format("woff2"); font-weight:400 800; font-display:swap }
:root{
  --fondo:#F2F5FA; --sup:#FFFFFF; --sup2:#E8EEF6; --tinta:#0E1E3A; --tenue:#56657E; --linea:#DAE2EE;
  --acento:#165D9B; --acento-tinta:#FFFFFF; --acento-suave:#E2EDF8; --acento-texto:#143361;
  --aviso:#A35A00; --aviso-suave:#FDEFD9;
  --up-marino:#143361; --up-naranja:#F29923; --up-sol:#FFC94D;
  --elev1:0 1px 2px rgba(20,51,97,.06), 0 8px 20px -10px rgba(20,51,97,.22);
  --elev2:0 2px 6px rgba(20,51,97,.08), 0 20px 44px -18px rgba(20,51,97,.4);
  --letra:"Inter UP", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --up-titulo:"Archivo UP", "Inter UP", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-tema="claro"]){
  --fondo:#09152B; --sup:#0F2141; --sup2:#16294D; --tinta:#E6EDF8; --tenue:#9DB0CC; --linea:#21375C;
  --acento:#4F9BE3; --acento-tinta:#06142B; --acento-suave:#163560; --acento-texto:#9CCBFF;
  --aviso:#F6AE48; --aviso-suave:#3A2A12;
  --elev1:0 1px 2px rgba(0,0,0,.3), 0 10px 22px -12px rgba(0,0,0,.7); --elev2:0 20px 44px -18px rgba(0,0,0,.8);
}}
body{ font-family:var(--letra) }
h1, h2, .cifra b, .item .t b, details.nuevo > summary, .btn{ font-family:var(--up-titulo) }
.env{ padding-bottom:calc(116px + env(safe-area-inset-bottom)) }
.red{ border-left-color:var(--up-naranja) }

/* la entrada: el logo se arma pieza por pieza y la cortina sube */
.up-apertura{ position:fixed; inset:0; z-index:50; display:none; place-items:center; overflow:hidden; pointer-events:none;
  background:radial-gradient(120% 80% at 50% 40%, #1E5596 0%, #143361 46%, #0A1A38 100%) }
.up-abre .up-apertura{ display:grid; animation:upAbSube .75s cubic-bezier(.76,0,.24,1) 1.75s forwards }
@keyframes upAbSube{ to{ transform:translateY(-102%); visibility:hidden } }
.up-apertura::after{ content:""; position:absolute; width:min(92vw, 440px); aspect-ratio:1; border-radius:50%; border:2px solid rgba(242,153,35,.55); transform:scale(.3); opacity:0 }
.up-abre .up-apertura::after{ animation:upAbOnda 1.4s ease-out .5s both }
@keyframes upAbOnda{ from{ transform:scale(.3); opacity:.9 } to{ transform:scale(1.2); opacity:0 } }
.up-logo{ position:relative; width:min(66vw, 300px); aspect-ratio:512 / 396 }
.up-logo img{ position:absolute; inset:0; width:100%; height:100% }
.up-abre .p-globo{ transform-origin:46.4% 29.3%; animation:upAbGlobo .7s cubic-bezier(.2,.9,.3,1.25) .05s both }
.up-abre .p-sol{ transform-origin:46.4% 29.3%; animation:upAbSol .8s cubic-bezier(.2,.8,.2,1) .3s both }
.up-abre .p-personita{ animation:upAbPersona .6s cubic-bezier(.2,.85,.25,1.2) .6s both }
.up-abre .p-chorro{ transform-origin:55% 45%; animation:upAbChorro .45s cubic-bezier(.3,1.4,.5,1) .85s both }
.up-abre .p-urban{ animation:upAbIzq .6s cubic-bezier(.2,.85,.25,1) 1s both }
.up-abre .p-pest{ animation:upAbDer .6s cubic-bezier(.2,.85,.25,1) 1.08s both }
.up-abre .p-control{ animation:upAbArriba .5s ease-out 1.2s both }
@keyframes upAbGlobo{ from{ transform:scale(.2) rotate(-50deg); opacity:0 } }
@keyframes upAbSol{ from{ transform:rotate(-140deg) scale(.5); opacity:0 } }
@keyframes upAbPersona{ from{ transform:translateY(16%) scale(.9); opacity:0 } }
@keyframes upAbChorro{ from{ transform:scale(0) rotate(-20deg) } }
@keyframes upAbIzq{ from{ transform:translateX(-24%); opacity:0 } }
@keyframes upAbDer{ from{ transform:translateX(24%); opacity:0 } }
@keyframes upAbArriba{ from{ transform:translateY(10%); opacity:0 } }

/* «Hoy»: portada con foto, logo y saludo */
.up-hero{ position:relative; isolation:isolate; overflow:hidden; margin:0 -16px 0; padding:20px 20px 58px; display:grid; align-content:start; gap:2px;
  color:#fff; background:#143361; border-radius:0 0 30px 30px }
.up-hero__foto{ position:absolute; inset:0; z-index:-3; width:100%; height:100%; object-fit:cover }
.up-hero::before{ content:""; position:absolute; inset:0; z-index:-2; background:linear-gradient(165deg, rgba(12,32,68,.97) 0%, rgba(20,51,97,.84) 46%, rgba(22,93,155,.5) 100%) }
.up-hero__sol{ position:absolute; z-index:-1; right:-92px; bottom:-84px; width:330px; height:auto; transform-origin:46% 29% }
.up-hero__marca{ display:flex; align-items:center; gap:10px; margin-bottom:16px }
.up-hero__marca img:first-child{ width:50px; height:auto } .up-hero__marca img + img{ width:148px; height:auto }
.up-hero__eti{ font:700 11.5px/1.2 var(--letra); letter-spacing:.14em; text-transform:uppercase; color:#FFC66B }
.up-hero__saludo{ margin:10px 0 0; font-size:15px; color:#CFE0F5 }
.up-hero__t{ margin:0; font:800 clamp(28px, 8.6vw, 38px)/1.04 var(--up-titulo); letter-spacing:-.015em; text-wrap:balance }
.up-hero__s{ margin:8px 0 0; font-size:14.5px; color:#DCE8F7; font-variant-numeric:tabular-nums }
.up-hero + .cifras{ position:relative; z-index:1; margin-top:-40px }

/* el encabezado de cada sección: azul de la marca, su dibujo y, en Inventario, la nave */
.top.up-cab{ position:relative; top:auto; z-index:0; isolation:isolate; overflow:hidden; margin:0 -16px 14px; padding:22px 18px 24px 20px; min-height:132px;
  display:grid; grid-template-columns:minmax(0, 1fr) 124px; align-items:center; gap:8px; color:#fff;
  background:linear-gradient(135deg, #143361 0%, #1A4A84 60%, #165D9B 100%); border-radius:0 0 26px 26px }
.up-cab::before{ content:""; position:absolute; z-index:-1; right:-96px; top:-80px; width:290px; height:224px; background:url(marca/sol.webp) center / contain no-repeat; opacity:.26; transform:rotate(18deg) }
.up-cab__foto{ position:absolute; inset:0; z-index:-2; width:100%; height:100%; object-fit:cover; opacity:.3 }
.up-cab__t{ margin:0; font:800 28px/1.05 var(--up-titulo); letter-spacing:-.01em; color:#fff }
.up-cab small{ display:block; margin-top:6px; color:#CFE0F5; font-size:13.5px; line-height:1.35 }
.up-cab__arte svg{ display:block; width:124px; height:auto; overflow:visible }

/* cifras, tarjetas y botones con la marca */
.cifras{ gap:12px }
.cifra{ display:grid; gap:6px; align-content:start; padding:14px 14px 13px; border:1px solid var(--linea); border-radius:18px; box-shadow:var(--elev1);
  background:var(--sup); background-image:radial-gradient(140px 90px at 100% 0%, color-mix(in srgb, var(--acento) 10%, transparent), transparent) }
.cifra.alerta{ background-image:radial-gradient(140px 90px at 100% 0%, color-mix(in srgb, var(--up-naranja) 18%, transparent), transparent) }
.cifra .up-ico{ display:grid; place-items:center; width:34px; height:34px; border-radius:11px; background:var(--acento-suave); color:var(--acento) }
.cifra.alerta .up-ico{ background:var(--aviso-suave); color:var(--aviso) }
.cifra b{ font-weight:800; font-size:clamp(22px, 7vw, 28px); line-height:1.05; color:var(--acento-texto); letter-spacing:-.01em }
.cifra.alerta b{ color:var(--aviso) } .cifra b.gana{ color:var(--acento) }
.cifra small{ font-size:12.5px; line-height:1.25 }
.atajos{ padding:16px 0 2px } .atajos a{ border:1px solid var(--linea); box-shadow:none } .atajos a .ic{ color:var(--acento) }
h2{ font-weight:700; font-size:18px; margin:28px 2px 12px }
h2::before{ content:""; flex:none; width:8px; height:8px; border-radius:50%; background:var(--up-naranja); box-shadow:0 0 0 4px color-mix(in srgb, var(--up-naranja) 22%, transparent) }
h2 .n{ font-family:var(--letra); font-size:15px }
.item{ border:1px solid var(--linea); border-radius:18px; padding:16px }
.item .t b{ font-weight:700; font-size:16.5px; line-height:1.25 }
.item.up-ojo{ box-shadow:inset 4px 0 0 var(--up-naranja), var(--elev1) }
.btn{ border-radius:14px; letter-spacing:.01em }
.btn:not(.b2){ background-image:linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0) 60%); box-shadow:0 10px 18px -12px var(--acento), inset 0 -2px 0 rgba(0,0,0,.14) }
.btn.b2{ border:1px solid var(--linea) }
details.nuevo{ border:1.5px dashed color-mix(in srgb, var(--acento) 40%, var(--linea)); box-shadow:none; background:color-mix(in srgb, var(--acento-suave) 50%, var(--sup)) }
details.nuevo[open]{ border-style:solid; background:var(--sup); box-shadow:var(--elev1) }
details.nuevo > summary > [data-ic]{ display:grid; place-items:center; width:34px; height:34px; border-radius:11px; background:var(--acento); color:var(--acento-tinta) }
.vacio{ padding:14px 16px; border-radius:16px; background:var(--sup); border:1px dashed var(--linea) }
.up-esq i:first-child{ height:220px; width:auto; margin:-64px -16px 0; border-radius:0 0 30px 30px; background:#143361 }

/* la barra de abajo flota, marino con naranja */
.barra-inf{ left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto; padding:6px; border-radius:24px;
  background:#143361; box-shadow:0 20px 40px -16px rgba(8,22,48,.65), inset 0 0 0 1px rgba(255,255,255,.07) }
.barra-inf button{ color:#B9C9E3 }
.barra-inf button[aria-current="page"]{ color:#FFFFFF } .barra-inf button[aria-current="page"] .ic{ color:#FFC66B }
.up-luz{ background:rgba(255,255,255,.12); box-shadow:inset 0 0 0 1px rgba(255,201,77,.35) }
.barra-inf i{ background:var(--up-naranja); color:#143361 }
.up-aviso{ bottom:calc(96px + env(safe-area-inset-bottom)); background:#143361; color:#fff; border-left:4px solid var(--up-naranja) }
@media (prefers-color-scheme: dark){ :root:not([data-tema="claro"]) .barra-inf{ background:#13284D } }

/* los dibujos: entran, y lo que se mueve se mueve poco */
.up-arte .a-traza{ stroke-dasharray:1; stroke-dashoffset:1 }
@media screen{
  .up-hero__foto{ transform:scale(1.12); animation:upHeroFoto 16s cubic-bezier(.2,.7,.2,1) var(--up-t0, 0s) both }
  @keyframes upHeroFoto{ to{ transform:scale(1) } }
  .up-hero__sol{ animation:upHeroSol 1.3s cubic-bezier(.2,.8,.2,1) calc(var(--up-t0, 0s) + .15s) both, upHeroFlota 8s ease-in-out calc(var(--up-t0, 0s) + 1.5s) infinite alternate }
  @keyframes upHeroSol{ from{ transform:rotate(-75deg) scale(.7); opacity:0 } }
  @keyframes upHeroFlota{ to{ transform:rotate(-6deg) translateY(-6px) } }
  .up-hero__marca, .up-hero__eti, .up-hero__saludo, .up-hero__t, .up-hero__s, .up-cab__t, .up-cab small{ animation:upTexto .7s cubic-bezier(.2,.85,.25,1) calc(var(--up-t0, 0s) + var(--up-r, 0s)) both }
  .up-hero__eti{ --up-r:.06s } .up-hero__saludo{ --up-r:.12s } .up-hero__t{ --up-r:.18s } .up-hero__s{ --up-r:.26s } .up-cab small{ --up-r:.1s }
  @keyframes upTexto{ from{ clip-path:inset(0 0 100% 0); transform:translateY(14px) } to{ clip-path:inset(-4px -4px -6px -4px) } }
  .up-cab__arte{ animation:upArteEntra .8s cubic-bezier(.2,.85,.25,1.1) calc(var(--up-t0, 0s) + .1s) both }
  @keyframes upArteEntra{ from{ transform:translateX(26px) scale(.9) rotate(-4deg) } }
  .up-arte .a-traza{ animation:upTraza .9s ease-out calc(var(--up-t0, 0s) + .6s) forwards }
  @keyframes upTraza{ to{ stroke-dashoffset:0 } }
  .up-arte .a-flota{ animation:upFlotaArte 4.5s ease-in-out infinite alternate } @keyframes upFlotaArte{ to{ transform:translateY(-4px) } }
  .up-arte .a-pin{ animation:upPin 2.4s cubic-bezier(.3,1.6,.5,1) calc(var(--up-t0, 0s) + .8s) infinite } @keyframes upPin{ 0%, 55%, 100%{ transform:none } 28%{ transform:translateY(-7px) } }
  .up-arte .a-llena, .up-arte .a-barra{ transform-box:fill-box; transform-origin:50% 100%; animation:upLlenaArte .9s cubic-bezier(.2,.9,.3,1.15) calc(var(--up-t0, 0s) + .3s + var(--d, 0s)) both }
  @keyframes upLlenaArte{ from{ transform:scaleY(0) } }
  .up-arte .a-llega{ animation:upLlega 1s cubic-bezier(.2,.85,.25,1) calc(var(--up-t0, 0s) + .15s) both } @keyframes upLlega{ from{ transform:translateX(-120px) } }
  .up-arte .a-bota{ animation:upBota .5s ease-in-out infinite alternate } @keyframes upBota{ to{ transform:translateY(1.5px) } }
  .up-arte .a-rueda{ animation:upRueda .9s linear infinite } @keyframes upRueda{ to{ transform:rotate(360deg) } }
  .up-arte .a-camino{ animation:upCamino .7s linear infinite } @keyframes upCamino{ to{ transform:translateX(-28px) } }
  .up-arte .a-moneda{ transform-box:fill-box; transform-origin:50% 50%; animation:upMoneda 3.2s ease-in-out calc(var(--up-t0, 0s) + 1.4s) infinite } @keyframes upMoneda{ 0%, 70%, 100%{ transform:none } 85%{ transform:scaleX(.12) } }
}
/* «reducir movimiento» reduce, no apaga: entrada más corta, el logo sólo aparece, y nada se repite */
@media (prefers-reduced-motion: reduce){
  .env > *, .cifra, .lista-c > .item, .atajos a{ animation-name:upEntraSuave; animation-duration:.4s }
  @keyframes upEntraSuave{ from{ transform:translateY(8px) } }
  .barra-inf i, .up-esq i, .up-arte .a-flota, .up-arte .a-pin, .up-arte .a-bota, .up-arte .a-rueda, .up-arte .a-camino, .up-arte .a-moneda{ animation:none }
  .up-hero__foto{ animation:none; transform:none }
  .up-hero__sol{ animation:upHeroSol .8s cubic-bezier(.2,.8,.2,1) both }
  .up-arte .a-llega{ animation:none }
  .item:hover{ transform:none }
  .up-abre .up-apertura{ animation:upAbFunde .45s ease 1.2s forwards } .up-apertura::after{ display:none }
  .up-abre .up-logo img{ animation:upAbAparece .5s ease both }
  .up-abre .up-logo .p-sol{ animation-delay:.2s } .up-abre .up-logo .p-personita{ animation-delay:.35s } .up-abre .up-logo .p-chorro{ animation-delay:.45s }
  .up-abre .up-logo .p-urban, .up-abre .up-logo .p-pest, .up-abre .up-logo .p-control{ animation-delay:.6s }
  @keyframes upAbFunde{ to{ opacity:0; visibility:hidden } }
  @keyframes upAbAparece{ from{ opacity:0 } }
}
</style>

<script type="module">
/* SIN INTERNET (Godines, 13 nov): toda llamada pasa por sin-red.js. Con señal va al servidor; sin señal
   contesta la réplica del teléfono con las mismas reglas (motor.js) y lo hecho se manda al volver.
   Con ?muestra no toca la red: datos de muestra para probarlo de pie. Pruebas: node urban-pest/centro/pruebas.mjs */
import { crearRed, LLAVE_MUESTRA } from './sin-red.js';
import * as motor from './motor.js';
import { muestra } from './muestra.js';
const q = new URLSearchParams(location.search);
const DE_MUESTRA = q.has('muestra');
const guarda = { leer: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, poner: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const SERVIDOR = q.get('servidor') || guarda.leer('up_servidor') || 'https://sala.palomazi9111.workers.dev/api/urban';
if(q.get('acceso')){ guarda.poner('up_acceso', q.get('acceso')); q.delete('acceso'); history.replaceState(null, '', '?' + q.toString()); }
const app = document.getElementById('app'), barra = document.getElementById('barra');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pesos = (n) => n == null ? '' : '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: Number.isInteger(+n) ? 0 : 2, maximumFractionDigits: 2 });
const DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'], MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const dia = (s) => { if(!s) return ''; const d = new Date(s + 'T12:00:00'); return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}`; };
const hoyISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };

/* íconos: Lucide (ISC), los mismos del resto de sus páginas */
let L = {};
try { L = (await (await fetch('../../presentaciones/vendor/lucide-1.48.0.json')).json()).iconos; } catch {}
const ic = (n) => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${L[n] || ''}</svg>`;
const pintaIconos = (raiz = document) => raiz.querySelectorAll('[data-ic]').forEach(e => { if(!e.firstChild) e.innerHTML = ic(e.dataset.ic); });

async function apiRed(metodo, ruta, cuerpo){
  try {
    const r = await fetch(SERVIDOR + ruta, { method: metodo, headers: { 'content-type': 'application/json', 'x-llave': guarda.leer('up_llave') || guarda.leer('salaLlave') || '', 'x-acceso': guarda.leer('up_acceso') || '' }, body: cuerpo ? JSON.stringify(cuerpo) : undefined });
    const j = await r.json().catch(() => ({ bien: false, error: 'El servidor no contestó bien (' + r.status + ').' }));
    if(!r.ok && j.bien !== false) j.bien = false; j.status = r.status; return j;
  } catch { return { bien: false, sinRed: true, error: 'Sin conexión. Revisa tu internet.' }; }
}
const caja = { leer: (k) => localStorage.getItem(k), poner: (k, v) => localStorage.setItem(k, v) };
const R = crearRed({ red: apiRed, motor, caja, hoy: hoyISO, soloLocal: DE_MUESTRA, ...(DE_MUESTRA ? { llave: LLAVE_MUESTRA, semilla: muestra(hoyISO()) } : {}) });
function api(metodo, ruta, cuerpo){ return R.api(metodo, ruta, cuerpo); }
const HORA = (t) => { const d = new Date(t); return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}, ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; };
function pintaRed(){
  const s = R.estado(), el = document.getElementById('red'), p = [];
  if(s.muestra) p.push('<b>Datos de muestra.</b> Nada de esto es del cliente ni se envía a ningún lado.');
  else {
    if(s.sinRed) p.push(`<b>Sin internet.</b> Ves lo guardado${s.al ? ' el ' + HORA(s.al) : ''}. Lo que hagas se envía solo cuando vuelva la señal.`);
    if(s.pendientes) p.push(`<b>${s.pendientes} ${s.pendientes === 1 ? 'cambio por enviar' : 'cambios por enviar'}:</b> ${s.cola.slice(0, 3).map(esc).join(' · ')}${s.pendientes > 3 ? ' · y más' : ''}`);
    if(s.detenida) p.push(`No se pudieron enviar todavía: ${esc(s.detenida)}`);
    if(s.pendientes && !s.sinRed) p.push('<button class="btn b2" type="button" data-enviar>Enviar ahora</button>');
    for(const r of s.rechazados) p.push(`<b>No entró:</b> ${esc(r.que)}. ${esc(r.error)}`);
    if(s.rechazados.length) p.push('<button class="btn b2" type="button" data-entendido>Entendido</button>');
    if(s.sinEspacio) p.push('<b>El teléfono no tiene espacio para guardar.</b> Lo que hagas sin internet se puede perder: libera espacio.');
    if(s.cajaRota) p.push('Lo que estaba guardado en este teléfono no se pudo leer y se apartó. Con señal se vuelve a bajar.');
  }
  el.hidden = !p.length; el.innerHTML = p.map(x => x.startsWith('<button') ? x : `<p>${x}</p>`).join('');
}
document.getElementById('red').addEventListener('click', async (e) => {
  if(e.target.closest('[data-enviar]')){ await R.enviarCola(); ir(actual); }
  if(e.target.closest('[data-entendido]')){ R.olvidarRechazados(); pintaRed(); }
});
addEventListener('online', async () => { await R.enviarCola(); ir(actual); });
addEventListener('offline', () => ir(actual));
if('serviceWorker' in navigator && !DE_MUESTRA) navigator.serviceWorker.register('./sw.js').catch(() => {});

/* los dibujos de cada sección (SVG hecho aquí: sin insectos ni personas) */
const ARTE = {
  servicios: `<svg class="up-arte" viewBox="0 0 160 120"><g class="a-flota">
    <rect x="30" y="24" width="96" height="82" rx="14" fill="rgba(255,255,255,.12)" stroke="#fff" stroke-width="3"/><path d="M30 48h96" stroke="#fff" stroke-width="3"/>

    <circle cx="97" cy="86" r="16" fill="#F29923"/><path class="a-traza" pathLength="1" d="M89 86l6 6 11-12" fill="none" stroke="#143361" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g class="a-pin"><path d="M138 12c-8 0-14 6-14 14 0 10 14 24 14 24s14-14 14-24c0-8-6-14-14-14z" fill="#FFC94D"/><circle cx="138" cy="26" r="5" fill="#143361"/></g></svg>`,
  inventario: `<svg class="up-arte" viewBox="0 0 160 120"><g class="a-flota">
    <path d="M12 58h136M12 106h136" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M20 58v48M140 58v48" stroke="rgba(255,255,255,.4)" stroke-width="3"/>

    <rect x="84" y="30" width="46" height="28" rx="4" fill="#fff"/><path d="M84 40h46" stroke="#143361" stroke-width="2"/><rect x="101" y="34" width="12" height="4" rx="1" fill="#F29923"/>
    <rect x="28" y="72" width="34" height="34" rx="4" fill="rgba(255,255,255,.85)"/><path d="M28 82h34" stroke="#143361" stroke-width="2"/>

  vehiculo: `<svg class="up-arte" viewBox="0 0 160 120"><g class="a-camino"><path d="M-30 110H190" stroke="rgba(255,255,255,.55)" stroke-width="3" stroke-dasharray="16 12" stroke-linecap="round"/></g>
    <g class="a-llega"><g class="a-bota">
    <path d="M14 90V48a10 10 0 0 1 10-10h70l24 22h20a10 10 0 0 1 10 10v20z" fill="#fff"/><path d="M98 44h6l17 16H98z" fill="#9CC3EA"/><rect x="24" y="46" width="30" height="16" rx="3" fill="#9CC3EA"/><rect x="62" y="46" width="26" height="16" rx="3" fill="#9CC3EA"/>
    <rect x="14" y="72" width="134" height="6" fill="#F29923"/></g>
    <g class="a-rueda" style="transform-origin:42px 94px"><circle cx="42" cy="94" r="12" fill="#0A1A38" stroke="#fff" stroke-width="3"/><circle cx="42" cy="94" r="4.5" fill="#fff"/><path d="M42 94v-9" stroke="#F29923" stroke-width="3" stroke-linecap="round"/></g>
    <g class="a-rueda" style="transform-origin:120px 94px"><circle cx="120" cy="94" r="12" fill="#0A1A38" stroke="#fff" stroke-width="3"/><circle cx="120" cy="94" r="4.5" fill="#fff"/><path d="M120 94v-9" stroke="#F29923" stroke-width="3" stroke-linecap="round"/></g></g></svg>`,
  numeros: `<svg class="up-arte" viewBox="0 0 160 120"><path d="M16 106h126" stroke="rgba(255,255,255,.55)" stroke-width="3" stroke-linecap="round"/>
    <rect class="a-barra" x="24" y="72" width="18" height="34" rx="4" fill="rgba(255,255,255,.55)"/><rect class="a-barra" style="--d:.1s" x="50" y="56" width="18" height="50" rx="4" fill="rgba(255,255,255,.75)"/>
    <rect class="a-barra" style="--d:.2s" x="76" y="64" width="18" height="42" rx="4" fill="#fff"/><rect class="a-barra" style="--d:.3s" x="102" y="36" width="18" height="70" rx="4" fill="#F29923"/>
    <path class="a-traza" pathLength="1" d="M26 62L58 44 84 52 112 22" fill="none" stroke="#FFC94D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="a-moneda"><circle cx="140" cy="24" r="14" fill="#FFC94D" stroke="#fff" stroke-width="2.5"/><path d="M140 15v18M144.5 18.5c-1-1.6-2.6-2.3-4.5-2.3-2.7 0-4.6 1.4-4.6 3.4 0 4.8 9.3 2.6 9.3 7.4 0 2-1.9 3.6-4.7 3.6-2.1 0-3.9-.9-4.9-2.6" fill="none" stroke="#143361" stroke-width="2.2" stroke-linecap="round"/></g></svg>`,
};
const ARTE_DE = { 'Servicios': 'servicios', 'Inventario': 'inventario', 'Vehículo': 'vehiculo', 'Números': 'numeros' }, FOTO_DE = { 'Inventario': 'marca/planta.webp' };
const cab = (t, s) => `<header class="top up-cab">${FOTO_DE[t] ? `<img class="up-cab__foto" src="${FOTO_DE[t]}" alt="" width="900" height="601" decoding="async">` : ''}

const fechaLarga = (s) => { const d = new Date(s + 'T12:00:00'), n = DIAS_L[d.getDay()]; return `${n[0].toUpperCase() + n.slice(1)} ${d.getDate()} de ${MESES_L[d.getMonth()]}`; };
const saludo = () => { const h = new Date().getHours(); return h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches'; };
const cuenta = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
const heroHoy = (t) => `<header class="up-hero">
  <img class="up-hero__foto" src="marca/ciudad.webp" alt="" width="900" height="502" decoding="async">

  <span class="up-hero__eti">Centro de operaciones</span>
  <p class="up-hero__saludo">${saludo()}</p>
  <h1 class="up-hero__t">${fechaLarga(t.hoy)}</h1>
  <p class="up-hero__s">${[cuenta(t.servicios_hoy.length, 'servicio hoy', 'servicios hoy'), t.seguimientos.length ? cuenta(t.seguimientos.length, 'seguimiento', 'seguimientos') : '', t.por_cobrar.length ? `${t.por_cobrar.length} por cobrar` : ''].filter(Boolean).join(' · ')}</p>
</header>`;
const formEnvio = (f, alListo) => f.addEventListener('submit', async (e) => {
  e.preventDefault(); const msj = f.querySelector('.msj'), boton = f.querySelector('[type=submit]');
  boton.disabled = true; msj.className = 'msj'; msj.textContent = 'Guardando…';
  const j = await alListo(Object.fromEntries(new FormData(f)));
  boton.disabled = false;
  if(!j.bien){ msj.className = 'msj mal'; msj.textContent = j.error; return; }
  msj.className = 'msj bien'; msj.textContent = 'Listo.'; setTimeout(() => ir(actual), 500);
});

let actual = q.get('p') || 'hoy';
/* ── movimiento y acabado ── */
let tAviso;
function avisa(texto){ const a = document.getElementById('upAviso'); a.textContent = texto; a.classList.add('ve'); clearTimeout(tAviso); tAviso = setTimeout(() => a.classList.remove('ve'), 3200); }
function moverLuz(){ const b = barra.querySelector('[aria-current="page"]'), l = document.getElementById('upLuz'); if(!b || !l) return; l.style.width = b.offsetWidth + 'px'; l.style.transform = `translateX(${b.offsetLeft}px)`; }
addEventListener('resize', moverLuz);
function acabado(el){
  /* cada tarjeta entra un poco después que la anterior */
  el.querySelectorAll('.cifras, .lista-c, .atajos').forEach(g => [...g.children].forEach((h, i) => h.style.setProperty('--up-i', Math.min(i, 9))));
  moverLuz();
  /* las cifras suben contando */
  el.querySelectorAll('.cifra b').forEach(b => { const m = /^(\$?)([\d,]+)$/.exec(b.textContent.trim()); if(!m) return; const n = Number(m[2].replace(/,/g, '')); if(n < 1) return;
    const t0 = performance.now() + (el.style.getPropertyValue('--up-t0') ? 1700 : 0), dura = 450 + Math.min(n, 20) * 18, final = b.textContent;
    (function paso(t){ const k = Math.min(1, Math.max(0, (t - t0) / dura)); b.textContent = k < 1 ? m[1] + Math.round(n * (1 - Math.pow(1 - k, 3))).toLocaleString('en-US') : final; if(k < 1) requestAnimationFrame(paso); })(t0); });
}
async function ir(p){
  actual = p; barra.querySelectorAll('button').forEach(b => b.dataset.p === p ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  /* el contenedor se recrea en cada pantalla: así no se juntan oyentes viejos (CLAUDE.md, «innerHTML deja la pantalla limpia») */
  const primera = !window.__app, viejo = raiz(), nuevo = viejo.cloneNode(false); viejo.replaceWith(nuevo); window.__app = nuevo;
  /* la primera pantalla entra cuando sube la cortina del logo; las demás, de inmediato */
  if(primera && document.documentElement.classList.contains('up-abre')) nuevo.style.setProperty('--up-t0', '1.7s'); else nuevo.style.removeProperty('--up-t0');
  await PANTALLAS[p](nuevo); pintaIconos(nuevo); pintaIconos(barra); pintaRed(); acabado(nuevo);
  /* los globitos de la barra van al día en cualquier pantalla, no sólo en «Hoy» */
  if(p !== 'hoy') api('GET', '/api/tablero').then(t => { if(t.bien){ marca('nHoy', t.servicios_hoy.length + t.atrasados.length + t.seguimientos.length); marca('nInv', t.insumos_bajos.length); marca('nVeh', t.vehiculo.length); } });
}
const raiz = () => window.__app || app;

const citaItem = (c, acciones = true) => `<li class="item" data-id="${c.id}">
  <div class="t"><b>${esc(c.cliente)}</b><span>${dia(c.fecha)}${c.hora ? ' · ' + esc(c.hora) : ''}</span></div>
  <p>${[c.plaga && esc(c.plaga), c.zona && esc(c.zona), c.direccion && esc(c.direccion), c.tecnico && 'Técnico: ' + esc(c.tecnico)].filter(Boolean).join(' · ') || 'Sin detalles'}</p>
  <div class="acc">${c.precio != null ? `<span class="chip">${c.precio === 0 ? 'Garantía · sin costo' : pesos(c.precio)}</span>` : ''}<span class="chip ${c.estado === 'pendiente' ? 'aviso' : c.estado === 'cerrado' ? 'ok' : ''}">${c.estado === 'hecho' ? 'Hecho · por cobrar' : c.estado}</span>
    ${c.telefono ? `<a class="chip" href="https://wa.me/52${esc(String(c.telefono).replace(/\D/g, '').slice(-10))}">WhatsApp</a>` : ''}</div>
  ${acciones ? `<div class="acc">${c.estado === 'pendiente' ? `<button class="btn" data-est="hecho">Ya se hizo</button><button class="btn b2" data-est="cancelado">Cancelar</button>` : ''}${c.estado === 'hecho' ? `<button class="btn" data-est="cerrado">Ya se cobró</button>` : ''}</div>` : ''}</li>`;
const conAcciones = (el) => el.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-est],[data-seg]'); if(!b) return;
  const id = b.closest('[data-id]').dataset.id; b.disabled = true;
  const j = b.dataset.est ? await api('POST', '/api/citas/estado', { id, estado: b.dataset.est }) : await api('POST', '/api/citas/seguimiento', { id, sigue_plaga: b.dataset.seg === 'sigue' });
  if(!j.bien){ b.disabled = false; alert(j.error); return; }
  avisa((b.dataset.est === 'hecho' ? `Hecho. Seguimiento el ${dia(j.cita?.seguimiento?.fecha)}.` : b.dataset.est === 'cerrado' ? 'Cobrado.' : b.dataset.est === 'cancelado' ? 'Cancelado.'
    : j.garantia ? `Garantía agendada para el ${dia(j.garantia.fecha)}.` : 'Seguimiento cerrado.') + (j.pendiente ? ' Se envía al volver la señal.' : ''));
  const tarjeta = b.closest('.item'); if(tarjeta){ tarjeta.classList.add('up-sale'); await new Promise(r => setTimeout(r, 230)); }
  ir(actual);
});

function marca(id, n){ const e = document.getElementById(id); e.hidden = !n; e.textContent = n; }
function falla(el, j){
  if(j.status === 401){
    el.innerHTML = `<div class="entrar"><b>Entra a tu centro</b><p>Abre el link de acceso que te mandó Grupo Mazi, o pega aquí tu código.</p>
      <form class="f" style="padding:0" id="fEnt"><label>Código<input name="c" autocomplete="off" required></label><button class="btn" type="submit">Entrar</button></form></div>`;
    barra.hidden = true;
    el.querySelector('#fEnt').onsubmit = (e) => { e.preventDefault(); guarda.poner('up_acceso', new FormData(e.target).get('c').trim()); location.reload(); };
    return;
  }
  el.innerHTML = `<p class="vacio" style="padding:40px 0">${esc(j.error)} <button class="btn b2" type="button" onclick="location.reload()">Reintentar</button></p>`;
}
barra.addEventListener('click', (e) => { const b = e.target.closest('[data-p]'); if(b) ir(b.dataset.p); });
barra.hidden = false;
ir(actual);
/* la cortina del logo ya subió: se quita del todo */
if(document.documentElement.classList.contains('up-abre')) setTimeout(() => { document.getElementById('upApertura')?.remove(); document.documentElement.classList.remove('up-abre'); }, 3200);
</script>
