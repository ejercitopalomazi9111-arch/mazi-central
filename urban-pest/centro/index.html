<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#143361">
<script>/* la entrada con el logo sale una vez por sesión */(function(d){try{if(!sessionStorage.getItem("up-visto")){sessionStorage.setItem("up-visto","1");d.classList.add("up-abre")}}catch(e){}})(document.documentElement)</script>
<title>Centro · Urban Pest</title>
<link rel="icon" href="../web/img/sello.png">
<link rel="stylesheet" href="../chat/estilo.css">
<style>
/* EL CENTRO DE OPERACIONES (BRIEF §C): hoy, servicios, inventario y vehículo. Mismo sistema que el chat central
   (../chat/estilo.css), teléfono primero. Rutas en urban-pest/servidor/RUTAS.md. */
body{ min-height:100%; }
.env{ max-width:880px; margin:0 auto; padding:0 16px calc(96px + env(safe-area-inset-bottom)) }
.top{ position:sticky; top:0; z-index:5; background:var(--fondo); padding:14px 0 10px; display:flex; align-items:center; justify-content:space-between; gap:12px }
.top b{ font-size:20px } .top small{ display:block; color:var(--tenue); font-size:13px }
.atajos{ display:flex; gap:8px; overflow-x:auto; padding:2px 0 14px; scrollbar-width:none }
.atajos a{ flex:none; display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 14px; border-radius:999px; background:var(--sup); box-shadow:var(--elev1); color:var(--tinta); text-decoration:none; font-weight:600; font-size:14px }
.ic{ width:20px; height:20px; flex:none }
h2{ font-size:17px; margin:26px 0 10px; display:flex; align-items:center; gap:8px } h2 .n{ color:var(--tenue); font-weight:500 }
.cifras{ display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:10px }
.cifra{ background:var(--sup); border-radius:var(--r); padding:14px 16px; box-shadow:var(--elev1) }
.cifra b{ display:block; font-size:28px; line-height:1.1; font-variant-numeric:tabular-nums } .cifra small{ color:var(--tenue); font-size:13px }
.cifra.alerta b{ color:var(--aviso) }
.lista-c{ list-style:none; padding:0; margin:0; display:grid; gap:10px }
.item{ background:var(--sup); border-radius:var(--r); padding:14px 16px; box-shadow:var(--elev1); display:grid; gap:8px }
.item .t{ display:flex; justify-content:space-between; gap:12px; align-items:baseline } .item .t b{ font-size:16px } .item .t span{ color:var(--tenue); font-size:14px; white-space:nowrap; font-variant-numeric:tabular-nums }
.item p{ color:var(--tenue); font-size:14px; margin:0 }
.chip{ display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:12.5px; font-weight:700; background:var(--sup2); color:var(--tenue) }
.chip.aviso{ background:var(--aviso-suave); color:var(--aviso) } .chip.ok{ background:var(--acento-suave); color:var(--acento-texto) }
.acc{ display:flex; flex-wrap:wrap; gap:8px }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 16px; border-radius:var(--r2); background:var(--acento); color:var(--acento-tinta); font-weight:700; font-size:15px; text-decoration:none }
.btn.b2{ background:var(--sup2); color:var(--tinta) } .btn:disabled{ opacity:.5 }
.vacio{ color:var(--tenue); font-size:14px; padding:6px 2px }
details.nuevo{ background:var(--sup); border-radius:var(--r); box-shadow:var(--elev1); margin:6px 0 4px }
details.nuevo > summary{ list-style:none; min-height:52px; display:flex; align-items:center; gap:10px; padding:0 16px; font-weight:700; cursor:pointer; color:var(--acento-texto) }
details.nuevo > summary::-webkit-details-marker{ display:none }
.f{ display:grid; gap:12px; padding:0 16px 16px }
.f label{ display:grid; gap:6px; font-weight:600; font-size:14px }
.f input, .f select, .f textarea{ width:100%; min-height:48px; padding:12px; border-radius:var(--r2); border:1.5px solid var(--linea); background:var(--fondo); color:var(--tinta); font-size:16px }
.f textarea{ min-height:80px; resize:vertical }
.dos{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px }
.msj{ font-weight:600; font-size:14px; min-height:1.2em } .msj.mal{ color:#C0392B } .msj.bien{ color:var(--acento-texto) }
.filtro{ display:flex; gap:8px; overflow-x:auto; margin:4px 0 12px; scrollbar-width:none }
.filtro button{ flex:none; min-height:44px; padding:0 14px; border-radius:999px; background:var(--sup2); font-weight:600; font-size:14px; color:var(--tenue) }
.filtro button[aria-pressed="true"]{ background:var(--acento); color:var(--acento-tinta) }
.mov{ display:grid; grid-template-columns:minmax(0,1fr) 92px; gap:8px; align-items:end }
.barra-inf{ position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--sup); box-shadow:0 -1px 0 var(--linea); padding:6px 4px calc(6px + env(safe-area-inset-bottom)); display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)) }
.desg{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; font-size:14px; margin:0; padding:10px 12px; border-radius:var(--r2); background:var(--sup2) }
.desg dt{ color:var(--tenue) } .desg dd{ margin:0; text-align:right; font-variant-numeric:tabular-nums; font-weight:600 }
.desg .sep{ grid-column:1/-1; height:1px; background:var(--linea); margin:4px 0 }
.gana{ color:var(--acento-texto) }
.item details > summary{ cursor:pointer; color:var(--acento-texto); font-weight:700; font-size:14px; min-height:36px; display:flex; align-items:center }
.barra-inf button{ display:grid; justify-items:center; gap:2px; min-height:52px; font-size:12px; font-weight:600; color:var(--tenue); position:relative }
.barra-inf button[aria-current="page"]{ color:var(--acento-texto) }
.barra-inf i{ position:absolute; top:4px; right:calc(50% - 22px); min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--aviso); color:#fff; font:700 11px/18px var(--letra); font-style:normal }
/* la franja de estado: sin internet, cambios por enviar, datos de muestra (sin-red.js) */
.red{ position:sticky; top:0; z-index:5; margin:0 0 8px; padding:10px 14px; border-radius:0 0 var(--r) var(--r); background:var(--sup); box-shadow:var(--elev2); border-left:4px solid var(--aviso); font-size:14px; line-height:1.4 }
.red p{ margin:0 } .red p + p{ margin-top:6px } .red .btn{ margin-top:6px; min-height:44px }
.entrar{ max-width:440px; margin:12vh auto 0; background:var(--sup); border-radius:var(--r); padding:24px; box-shadow:var(--elev2) }
.entrar p{ color:var(--tenue); margin:8px 0 16px }
/* MOVIMIENTO Y ACABADO (Godines, 13 nov; lo pidió Luis: «llénalo de animaciones, premium y agradable»).
   Nombres con «up» porque en CSS todo es global y esta página comparte ../chat/estilo.css.
   Sólo transform: nada de opacidad sobre texto, y nada que cambie el tamaño de un botón al medirlo.
   Con «reducir movimiento» se mueve igual, más corto y sin lo que se repite: muchas compus lo traen
   encendido sin saberlo (Windows con «Efectos de animación» apagado) y quieto del todo parecía roto. */
.env{ overflow-x:clip }
.cifra{ position:relative; overflow:hidden; background-image:linear-gradient(160deg, color-mix(in srgb, var(--acento) 9%, transparent), transparent 58%) }
.cifra.alerta{ background-image:linear-gradient(160deg, color-mix(in srgb, var(--aviso) 16%, transparent), transparent 62%) }
.item{ transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s }
.item.up-ojo{ box-shadow:inset 3px 0 0 var(--aviso), var(--elev1) }
.btn, .filtro button, .atajos a{ transition:transform .14s ease, background-color .2s, color .2s }
.btn:active, .filtro button:active, .atajos a:active{ transform:scale(.96) }
.btn:not(.b2){ background-image:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0)); box-shadow:0 8px 18px -10px var(--acento) }
/* el nivel de cada insumo; la raya marca su mínimo */
.up-nivel{ position:relative; height:8px; border-radius:99px; background:var(--sup2); overflow:hidden }
.up-nivel span{ display:block; height:100%; border-radius:inherit; background:var(--acento); transform-origin:left; transform:scaleX(var(--n)) }
.up-nivel.bajo span{ background:var(--aviso) }
.up-nivel::after{ content:""; position:absolute; left:33.33%; top:0; bottom:0; width:2px; background:var(--sup) }
/* la luz que se desliza a la pestaña activa */
.barra-inf{ isolation:isolate }
.up-luz{ position:absolute; z-index:-1; left:0; top:6px; height:52px; width:0; border-radius:16px; background:var(--acento-suave); transition:transform .45s cubic-bezier(.3,1.3,.5,1), width .3s }
/* el aviso de «listo»: sube desde abajo y se va solo */
.up-aviso{ position:fixed; z-index:7; left:16px; right:16px; bottom:calc(84px + env(safe-area-inset-bottom)); max-width:520px; margin:0 auto; padding:12px 16px; border-radius:var(--r2); background:var(--tinta); color:var(--fondo); font-weight:600; font-size:14px; box-shadow:var(--elev2); transform:translateY(calc(100% + 150px)); transition:transform .4s cubic-bezier(.2,.9,.3,1.15); pointer-events:none }
.up-aviso.ve{ transform:none }
/* esqueleto mientras llega lo primero */
.up-esq{ display:grid; gap:10px; padding-top:64px } .up-esq i{ display:block; height:74px; border-radius:var(--r); background:linear-gradient(100deg, var(--sup2) 30%, var(--sup) 50%, var(--sup2) 70%) 0 0 / 300% 100% }
.up-esq i:first-child{ height:40px; width:52% }
.up-solo-lector{ position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%) }
@media screen{
  .env > *, .cifra, .lista-c > .item, .atajos a{ animation:upEntra .55s cubic-bezier(.2,.85,.25,1) both; animation-delay:calc(var(--up-t0, 0s) + var(--up-i, 0) * 45ms) }
  .env > *:nth-child(2){ animation-delay:calc(var(--up-t0, 0s) + 40ms) } .env > *:nth-child(3){ animation-delay:calc(var(--up-t0, 0s) + 80ms) } .env > *:nth-child(n+4){ animation-delay:calc(var(--up-t0, 0s) + 120ms) }
  @keyframes upEntra{ from{ transform:translateY(18px) } }
  .up-nivel span{ animation:upLlena .9s cubic-bezier(.2,.8,.2,1) .15s both } @keyframes upLlena{ from{ transform:scaleX(0) } }
  .barra-inf button[aria-current="page"] .ic{ animation:upBrinca .45s cubic-bezier(.3,1.6,.5,1) } @keyframes upBrinca{ 40%{ transform:translateY(-4px) scale(1.14) } }
  .barra-inf i{ animation:upLate 2.6s ease-in-out infinite } @keyframes upLate{ 50%{ transform:scale(1.14) } }
  .red:not([hidden]){ animation:upBaja .45s cubic-bezier(.2,.85,.25,1) } @keyframes upBaja{ from{ transform:translateY(-110%) } }
  .up-sale{ animation:upSale .23s ease-in forwards !important } @keyframes upSale{ to{ transform:translateX(110%) } }
  .up-esq i{ animation:upBrilla 1.3s linear infinite } @keyframes upBrilla{ to{ background-position:-150% 0 } }
  @media (hover:hover){ .item:hover{ transform:translateY(-2px); box-shadow:var(--elev2) } }
}
/* ══ LA MARCA DE URBAN PEST (Godines, 15 nov; Luis: «se ve muy mal, hazlo de acuerdo a la estética, con
   animaciones e imágenes»). Colores, logo y letras de su página (urbanpest.mx, ver urban-pest/web/LEEME.md):
   marino #143361, azul #165D9B, naranja #F29923; Archivo para títulos e Inter para leer. El logo va en piezas
   (marca/, las cortó Luna) y se arma al entrar, una vez por sesión. Fotos: las dos de la página nueva (Pexels)
   en duotono marino; nada de insectos ni de fumigadores (Carlos, 11 nov). Los dibujos de cada sección son SVG
   hechos aquí. Todo viaja con el centro (sw.js lo guarda): abre igual sin internet. ══ */
@font-face{ font-family:"Archivo UP"; src:url(fuentes/archivo-400-900-normal.woff2) format("woff2"); font-weight:400 900; font-display:swap }
@font-face{ font-family:"Inter UP"; src:url(fuentes/inter-400-800-normal.woff2) format("woff2"); font-weight:400 800; font-display:swap }
:root{
  --fondo:#F2F5FA; --sup:#FFFFFF; --sup2:#E8EEF6; --tinta:#0E1E3A; --tenue:#56657E; --linea:#DAE2EE;
  --acento:#165D9B; --acento-tinta:#FFFFFF; --acento-suave:#E2EDF8; --acento-texto:#143361;
  --aviso:#A35A00; --aviso-suave:#FDEFD9;
  --up-marino:#143361; --up-naranja:#F29923; --up-sol:#FFC94D;
  --elev1:0 1px 2px rgba(20,51,97,.06), 0 8px 20px -10px rgba(20,51,97,.22);
  --elev2:0 2px 6px rgba(20,51,97,.08), 0 20px 44px -18px rgba(20,51,97,.4);
  --letra:"Inter UP", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --up-titulo:"Archivo UP", "Inter UP", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-tema="claro"]){
  --fondo:#09152B; --sup:#0F2141; --sup2:#16294D; --tinta:#E6EDF8; --tenue:#9DB0CC; --linea:#21375C;
  --acento:#4F9BE3; --acento-tinta:#06142B; --acento-suave:#163560; --acento-texto:#9CCBFF;
  --aviso:#F6AE48; --aviso-suave:#3A2A12;
  --elev1:0 1px 2px rgba(0,0,0,.3), 0 10px 22px -12px rgba(0,0,0,.7); --elev2:0 20px 44px -18px rgba(0,0,0,.8);
}}
body{ font-family:var(--letra) }
h1, h2, .cifra b, .item .t b, details.nuevo > summary, .btn{ font-family:var(--up-titulo) }
.env{ padding-bottom:calc(116px + env(safe-area-inset-bottom)) }
.red{ border-left-color:var(--up-naranja) }

/* la entrada: el logo se arma pieza por pieza y la cortina sube */
.up-apertura{ position:fixed; inset:0; z-index:50; display:none; place-items:center; overflow:hidden; pointer-events:none;
  background:radial-gradient(120% 80% at 50% 40%, #1E5596 0%, #143361 46%, #0A1A38 100%) }
.up-abre .up-apertura{ display:grid; animation:upAbSube .75s cubic-bezier(.76,0,.24,1) 1.75s forwards }
@keyframes upAbSube{ to{ transform:translateY(-102%); visibility:hidden } }
.up-apertura::after{ content:""; position:absolute; width:min(92vw, 440px); aspect-ratio:1; border-radius:50%; border:2px solid rgba(242,153,35,.55); transform:scale(.3); opacity:0 }
.up-abre .up-apertura::after{ animation:upAbOnda 1.4s ease-out .5s both }
@keyframes upAbOnda{ from{ transform:scale(.3); opacity:.9 } to{ transform:scale(1.2); opacity:0 } }
.up-logo{ position:relative; width:min(66vw, 300px); aspect-ratio:512 / 396 }
.up-logo img{ position:absolute; inset:0; width:100%; height:100% }
.up-abre .p-globo{ transform-origin:46.4% 29.3%; animation:upAbGlobo .7s cubic-bezier(.2,.9,.3,1.25) .05s both }
.up-abre .p-sol{ transform-origin:46.4% 29.3%; animation:upAbSol .8s cubic-bezier(.2,.8,.2,1) .3s both }
.up-abre .p-personita{ animation:upAbPersona .6s cubic-bezier(.2,.85,.25,1.2) .6s both }
.up-abre .p-chorro{ transform-origin:55% 45%; animation:upAbChorro .45s cubic-bezier(.3,1.4,.5,1) .85s both }
.up-abre .p-urban{ animation:upAbIzq .6s cubic-bezier(.2,.85,.25,1) 1s both }
.up-abre .p-pest{ animation:upAbDer .6s cubic-bezier(.2,.85,.25,1) 1.08s both }
.up-abre .p-control{ animation:upAbArriba .5s ease-out 1.2s both }
@keyframes upAbGlobo{ from{ transform:scale(.2) rotate(-50deg); opacity:0 } }
@keyframes upAbSol{ from{ transform:rotate(-140deg) scale(.5); opacity:0 } }
@keyframes upAbPersona{ from{ transform:translateY(16%) scale(.9); opacity:0 } }
@keyframes upAbChorro{ from{ transform:scale(0) rotate(-20deg) } }
@keyframes upAbIzq{ from{ transform:translateX(-24%); opacity:0 } }
@keyframes upAbDer{ from{ transform:translateX(24%); opacity:0 } }
@keyframes upAbArriba{ from{ transform:translateY(10%); opacity:0 } }

/* «Hoy»: portada con foto, logo y saludo */
.up-hero{ position:relative; isolation:isolate; overflow:hidden; margin:0 -16px 0; padding:20px 20px 58px; display:grid; align-content:start; gap:2px;
  color:#fff; background:#143361; border-radius:0 0 30px 30px }
.up-hero__foto{ position:absolute; inset:0; z-index:-3; width:100%; height:100%; object-fit:cover }
.up-hero::before{ content:""; position:absolute; inset:0; z-index:-2; background:linear-gradient(165deg, rgba(12,32,68,.97) 0%, rgba(20,51,97,.84) 46%, rgba(22,93,155,.5) 100%) }
.up-hero__sol{ position:absolute; z-index:-1; right:-92px; bottom:-84px; width:330px; height:auto; transform-origin:46% 29% }
.up-hero__marca{ display:flex; align-items:center; gap:10px; margin-bottom:16px }
.up-hero__marca img:first-child{ width:50px; height:auto } .up-hero__marca img + img{ width:148px; height:auto }
.up-hero__eti{ font:700 11.5px/1.2 var(--letra); letter-spacing:.14em; text-transform:uppercase; color:#FFC66B }
.up-hero__saludo{ margin:10px 0 0; font-size:15px; color:#CFE0F5 }
.up-hero__t{ margin:0; font:800 clamp(28px, 8.6vw, 38px)/1.04 var(--up-titulo); letter-spacing:-.015em; text-wrap:balance }
.up-hero__s{ margin:8px 0 0; font-size:14.5px; color:#DCE8F7; font-variant-numeric:tabular-nums }
.up-hero + .cifras{ position:relative; z-index:1; margin-top:-40px }

/* el encabezado de cada sección: azul de la marca, su dibujo y, en Inventario, la nave */
.top.up-cab{ position:relative; top:auto; z-index:0; isolation:isolate; overflow:hidden; margin:0 -16px 14px; padding:22px 18px 24px 20px; min-height:132px;
  display:grid; grid-template-columns:minmax(0, 1fr) 124px; align-items:center; gap:8px; color:#fff;
  background:linear-gradient(135deg, #143361 0%, #1A4A84 60%, #165D9B 100%); border-radius:0 0 26px 26px }
.up-cab::before{ content:""; position:absolute; z-index:-1; right:-96px; top:-80px; width:290px; height:224px; background:url(marca/sol.webp) center / contain no-repeat; opacity:.26; transform:rotate(18deg) }
.up-cab__foto{ position:absolute; inset:0; z-index:-2; width:100%; height:100%; object-fit:cover; opacity:.3 }
.up-cab__t{ margin:0; font:800 28px/1.05 var(--up-titulo); letter-spacing:-.01em; color:#fff }
.up-cab small{ display:block; margin-top:6px; color:#CFE0F5; font-size:13.5px; line-height:1.35 }
.up-cab__arte svg{ display:block; width:124px; height:auto; overflow:visible }

/* cifras, tarjetas y botones con la marca */
.cifras{ gap:12px }
.cifra{ display:grid; gap:6px; align-content:start; padding:14px 14px 13px; border:1px solid var(--linea); border-radius:18px; box-shadow:var(--elev1);
  background:var(--sup); background-image:radial-gradient(140px 90px at 100% 0%, color-mix(in srgb, var(--acento) 10%, transparent), transparent) }
.cifra.alerta{ background-image:radial-gradient(140px 90px at 100% 0%, color-mix(in srgb, var(--up-naranja) 18%, transparent), transparent) }
.cifra .up-ico{ display:grid; place-items:center; width:34px; height:34px; border-radius:11px; background:var(--acento-suave); color:var(--acento) }
.cifra.alerta .up-ico{ background:var(--aviso-suave); color:var(--aviso) }
.cifra b{ font-weight:800; font-size:clamp(22px, 7vw, 28px); line-height:1.05; color:var(--acento-texto); letter-spacing:-.01em }
.cifra.alerta b{ color:var(--aviso) } .cifra b.gana{ color:var(--acento) }
.cifra small{ font-size:12.5px; line-height:1.25 }
.atajos{ padding:16px 0 2px } .atajos a{ border:1px solid var(--linea); box-shadow:none } .atajos a .ic{ color:var(--acento) }
h2{ font-weight:700; font-size:18px; margin:28px 2px 12px }
h2::before{ content:""; flex:none; width:8px; height:8px; border-radius:50%; background:var(--up-naranja); box-shadow:0 0 0 4px color-mix(in srgb, var(--up-naranja) 22%, transparent) }
h2 .n{ font-family:var(--letra); font-size:15px }
.item{ border:1px solid var(--linea); border-radius:18px; padding:16px }
.item .t b{ font-weight:700; font-size:16.5px; line-height:1.25 }
.item.up-ojo{ box-shadow:inset 4px 0 0 var(--up-naranja), var(--elev1) }
.btn{ border-radius:14px; letter-spacing:.01em }
.btn:not(.b2){ background-image:linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0) 60%); box-shadow:0 10px 18px -12px var(--acento), inset 0 -2px 0 rgba(0,0,0,.14) }
.btn.b2{ border:1px solid var(--linea) }
details.nuevo{ border:1.5px dashed color-mix(in srgb, var(--acento) 40%, var(--linea)); box-shadow:none; background:color-mix(in srgb, var(--acento-suave) 50%, var(--sup)) }
details.nuevo[open]{ border-style:solid; background:var(--sup); box-shadow:var(--elev1) }
details.nuevo > summary > [data-ic]{ display:grid; place-items:center; width:34px; height:34px; border-radius:11px; background:var(--acento); color:var(--acento-tinta) }
.vacio{ padding:14px 16px; border-radius:16px; background:var(--sup); border:1px dashed var(--linea) }
.up-esq i:first-child{ height:220px; width:auto; margin:-64px -16px 0; border-radius:0 0 30px 30px; background:#143361 }

/* la barra de abajo flota, marino con naranja */
.barra-inf{ left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto; padding:6px; border-radius:24px;
  background:#143361; box-shadow:0 20px 40px -16px rgba(8,22,48,.65), inset 0 0 0 1px rgba(255,255,255,.07) }

/* los dibujos: entran, y lo que se mueve se mueve poco */

  @keyframes upHeroSol{ from{ transform:rotate(-75deg) scale(.7); opacity:0 } }

  .up-hero__eti{ --up-r:.06s } .up-hero__saludo{ --up-r:.12s } .up-hero__t{ --up-r:.18s } .up-hero__s{ --up-r:.26s } .up-cab small{ --up-r:.1s }

  @keyframes upArteEntra{ from{ transform:translateX(26px) scale(.9) rotate(-4deg) } }
  .up-arte .a-traza{ animation:upTraza .9s ease-out calc(var(--up-t0, 0s) + .6s) forwards }
  @keyframes upTraza{ to{ stroke-dashoffset:0 } }
  .up-arte .a-flota{ animation:upFlotaArte 4.5s ease-in-out infinite alternate } @keyframes upFlotaArte{ to{ transform:translateY(-4px) } }
  .up-arte .a-pin{ animation:upPin 2.4s cubic-bezier(.3,1.6,.5,1) calc(var(--up-t0, 0s) + .8s) infinite } @keyframes upPin{ 0%, 55%, 100%{ transform:none } 28%{ transform:translateY(-7px) } }
  .up-arte .a-llena, .up-arte .a-barra{ transform-box:fill-box; transform-origin:50% 100%; animation:upLlenaArte .9s cubic-bezier(.2,.9,.3,1.15) calc(var(--up-t0, 0s) + .3s + var(--d, 0s)) both }
  @keyframes upLlenaArte{ from{ transform:scaleY(0) } }
  .up-arte .a-llega{ animation:upLlega 1s cubic-bezier(.2,.85,.25,1) calc(var(--up-t0, 0s) + .15s) both } @keyframes upLlega{ from{ transform:translateX(-120px) } }
  .up-arte .a-bota{ animation:upBota .5s ease-in-out infinite alternate } @keyframes upBota{ to{ transform:translateY(1.5px) } }
  .up-arte .a-rueda{ animation:upRueda .9s linear infinite } @keyframes upRueda{ to{ transform:rotate(360deg) } }
  .up-arte .a-camino{ animation:upCamino .7s linear infinite } @keyframes upCamino{ to{ transform:translateX(-28px) } }
  .up-arte .a-moneda{ transform-box:fill-box; transform-origin:50% 50%; animation:upMoneda 3.2s ease-in-out calc(var(--up-t0, 0s) + 1.4s) infinite } @keyframes upMoneda{ 0%, 70%, 100%{ transform:none } 85%{ transform:scaleX(.12) } }
}
/* «reducir movimiento» reduce, no apaga: entrada más corta, el logo sólo aparece, y nada se repite */
@media (prefers-reduced-motion: reduce){

  @keyframes upEntraSuave{ from{ transform:translateY(8px) } }
  .barra-inf i, .up-esq i, .up-arte .a-flota, .up-arte .a-pin, .up-arte .a-bota, .up-arte .a-rueda, .up-arte .a-camino, .up-arte .a-moneda{ animation:none }
  .up-hero__foto{ animation:none; transform:none }
  .up-hero__sol{ animation:upHeroSol .8s cubic-bezier(.2,.8,.2,1) both }
  .up-arte .a-llega{ animation:none }
  .item:hover{ transform:none }
  .up-abre .up-apertura{ animation:upAbFunde .45s ease 1.2s forwards } .up-apertura::after{ display:none }
  .up-abre .up-logo img{ animation:upAbAparece .5s ease both }
  .up-abre .up-logo .p-sol{ animation-delay:.2s } .up-abre .up-logo .p-personita{ animation-delay:.35s } .up-abre .up-logo .p-chorro{ animation-delay:.45s }
  .up-abre .up-logo .p-urban, .up-abre .up-logo .p-pest, .up-abre .up-logo .p-control{ animation-delay:.6s }
  @keyframes upAbFunde{ to{ opacity:0; visibility:hidden } }
  @keyframes upAbAparece{ from{ opacity:0 } }
}

/* ── COTIZAR (Godines, 17 nov): su Excel dentro del centro. Seis pestañas: la letra baja un punto ── */
.barra-inf{ grid-template-columns:repeat(6, minmax(0, 1fr)) } .barra-inf button{ font-size:11px; letter-spacing:-.01em }
.up-cot h2{ margin:14px 0 2px }
.up-renglon{ gap:10px } .up-renglon .dos{ grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)) }
.up-renglon__abajo{ display:grid; grid-template-columns:minmax(0,1fr) auto 44px; gap:10px; align-items:end }
.up-con{ display:flex; align-items:center; gap:8px } .up-con input{ flex:1; min-width:0 } .up-con small{ color:var(--tenue); font-weight:600; white-space:nowrap }
.up-importe{ font-variant-numeric:tabular-nums; font-size:16px; min-height:48px; display:flex; align-items:center }

.up-precio{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:14px 16px; border-radius:var(--r2);
  background:#143361; color:#fff } .up-precio small{ font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#B9C9E3; font-size:12px }
.up-precio b{ font-size:34px; line-height:1; font-variant-numeric:tabular-nums; color:#FFC66B } .up-precio span{ width:100%; color:#B9C9E3; font-size:13px }
.up-jadp{ margin:0; font-size:14px; color:var(--tenue) } .up-jadp b{ color:var(--tinta) }
.up-cot-acc{ margin:4px 0 6px }
/* la distancia (23 nov): «Calcular» debajo de los km y de dónde sale la camioneta */
.up-km{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px } .up-km .msj{ flex:1 1 180px; margin:0 }
.up-salida{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:end } .up-salida + .msj{ margin:-4px 0 0 }
.up-subir{ cursor:pointer }
.up-catalogo{ list-style:none; margin:0; padding:0 16px 14px; display:grid; gap:0; max-height:420px; overflow:auto }
.up-catalogo li{ display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid var(--linea); font-size:14px }
.up-catalogo span{ color:var(--tenue); white-space:nowrap; font-variant-numeric:tabular-nums }
.up-formula{ margin:0; padding:0 16px 16px; font-size:14px; color:var(--tenue); line-height:1.5 } .up-formula b{ color:var(--tinta) }

/* ══ FÁCIL DE USAR (23 nov; Luis: «que lo use perfectamente un señor de 45 hasta 70, 80 o 90 años, e incluso un niño»).
   Medido con Playwright a 360, 390 y 768 px y con la letra al 200 %: antes, 58 textos de «Hoy» quedaban abajo de 16 px
   (hasta 11 px en la barra), los botones medían 44 px y la barra de seis pestañas no cabía con letra grande.
   Ahora: cuerpo de 17 px, nada que se lea abajo de 15 px (la barra, 13-14 px con su ícono), botones de 52 px con 12 px
   entre uno y otro, y la barra se desliza de lado si de plano no cabe. Las pruebas lo vigilan (pruebas-pantalla.mjs). ══ */
body{ font-size:17px; line-height:1.5 }
:focus-visible{ outline:3px solid var(--acento-texto); outline-offset:3px; border-radius:10px }
.barra-inf :focus-visible, .up-hero :focus-visible, .up-cab :focus-visible, .up-precio :focus-visible{ outline-color:#FFC66B }
.red{ font-size:16px }
.up-hero__eti{ font-size:15px } .up-hero__saludo{ font-size:17px } .up-hero__s{ font-size:17px }
.up-cab small{ font-size:16px }
.cifra small{ font-size:15.5px; line-height:1.3 } .cifra b{ font-size:clamp(26px, 8vw, 32px) }
.atajos{ gap:12px } .atajos a{ min-height:52px; padding:0 18px; font-size:16px }
h2{ font-size:20px } h2 .n{ font-size:17px }
.item{ gap:10px; padding:18px 16px }
.item .t{ flex-wrap:wrap; gap:2px 12px } .item .t b{ font-size:18.5px } .item .t span{ font-size:16px; white-space:normal }
.item p{ font-size:17px; line-height:1.45 }
.chip{ font-size:15px; padding:4px 12px; line-height:1.35 }
.acc{ gap:12px }
.btn{ min-height:52px; padding:0 20px; font-size:17px }
.btn .ic{ width:22px; height:22px }
.vacio{ font-size:17px }
/* los filtros y los atajos se ven todos, en dos renglones si hace falta: nada escondido a la derecha */
.filtro, .atajos{ flex-wrap:wrap; overflow:visible } .filtro{ gap:10px } .filtro button{ min-height:48px; padding:0 18px; font-size:16px }
details.nuevo{ margin:8px 0 14px } details.nuevo > summary{ min-height:56px; font-size:17px }
.item details > summary{ min-height:48px; font-size:16px }
.f{ gap:16px } .f label{ font-size:16px; gap:8px }
.f input, .f select, .f textarea{ min-height:52px; font-size:17px; min-width:0; max-width:100% }
.dos{ grid-template-columns:repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap:16px } .dos > *{ min-width:0 }
.msj{ font-size:16px }
.desg{ font-size:16px; gap:6px 12px }
.up-catalogo li{ font-size:16px } .up-formula, .up-jadp{ font-size:16px }
.up-con small{ font-size:15px }
.up-precio small{ font-size:15px } .up-precio span{ font-size:15px; line-height:1.4 }
.up-renglon__abajo{ grid-template-columns:minmax(0,1fr) auto 52px } .up-quitar{ width:52px }
.up-aviso{ font-size:16px; padding:14px 18px }
.acc a.chip{ min-height:48px; padding:0 16px } .mov{ grid-template-columns:minmax(0,1fr) 128px }
/* con la letra al 200 % (un teléfono de 390 queda de 195) lo que iba lado a lado va uno abajo del otro */
@media (max-width:300px){ .mov, .up-salida, .up-renglon__abajo{ grid-template-columns:minmax(0,1fr) } .up-renglon__abajo .up-quitar{ width:100% } }  .mov .acc .btn{ flex:1 1 0 }
.entrar b{ font-size:20px }
/* la barra: cada pestaña del ancho de su nombre y con su letra a 13-14 px; si no cabe, se desliza de lado */
.barra-inf{ display:flex; left:6px; right:6px; padding:4px; overflow-x:auto; overscroll-behavior-x:contain; scrollbar-width:none }
.barra-inf::-webkit-scrollbar{ display:none }
.barra-inf button{ flex:1 0 auto; min-width:52px; min-height:56px; padding:0 3px; font-size:clamp(12px, 3.6vw, 14px); letter-spacing:-.01em; align-content:center }
.up-luz{ top:4px; height:56px }
.barra-inf i{ top:3px; right:auto; left:calc(50% + 4px); height:20px; min-width:20px; border-radius:10px; font-size:12.5px; line-height:20px }
.env{ padding-bottom:calc(124px + env(safe-area-inset-bottom)) }
/* una pregunta antes de lo que no tiene vuelta (cancelar un servicio) */
.up-pregunta{ margin:0; font-weight:700; color:var(--tinta) !important; font-size:17px }
.btn.up-peligro{ background:#B42318; color:#fff; box-shadow:none }
.msj.mal, .up-error{ color:#B42318 } .up-error{ margin:0; font-weight:600; font-size:16px }
@media (prefers-color-scheme: dark){ :root:not([data-tema="claro"]) .msj.mal, :root:not([data-tema="claro"]) .up-error{ color:#FF8A80 } }

/* ══ NADA APARECE DE LA NADA (23 nov; Luis: «todo elemento se convierte y se transforma en su siguiente fase»).
   Al cambiar de pestaña la pantalla se desliza hacia el lado de la pestaña; al tocar algo en la misma pestaña, cada
   tarjeta es la MISMA y viaja a su lugar nuevo (la que se va sale de lado, la nueva entra), las cifras cuentan desde
   lo que decían y el nivel del insumo baja o sube desde donde estaba. View Transitions donde existe (Chrome, Safari 18)
   y, donde no, FLIP a mano con transform. Todo de 150 a 250 ms. Con «reducir movimiento» nada de esto corre: lo
   decide transicion() en el código y, aquí, la media query de abajo. ══ */
.barra-inf{ view-transition-name:up-barra } .red{ view-transition-name:up-red } .up-aviso{ view-transition-name:up-aviso }
::view-transition-group(*){ animation-duration:.22s; animation-timing-function:cubic-bezier(.2,.8,.2,1) }
::view-transition-old(root), ::view-transition-new(root){ animation-duration:.16s }
::view-transition-group(up-barra), ::view-transition-group(up-aviso){ animation:none }
::view-transition-old(up-barra), ::view-transition-old(up-aviso){ display:none }
::view-transition-new(up-barra), ::view-transition-new(up-aviso){ animation:none }
html[data-up-vt="der"]::view-transition-old(root){ animation:upVtSaleIzq .2s cubic-bezier(.4,0,.6,1) both }
html[data-up-vt="der"]::view-transition-new(root){ animation:upVtEntraDer .24s cubic-bezier(.2,.8,.2,1) both }
html[data-up-vt="izq"]::view-transition-old(root){ animation:upVtSaleDer .2s cubic-bezier(.4,0,.6,1) both }
html[data-up-vt="izq"]::view-transition-new(root){ animation:upVtEntraIzq .24s cubic-bezier(.2,.8,.2,1) both }
/* el texto llega con su contraste completo a la mitad del viaje: nada se queda medio transparente */
@keyframes upVtSaleIzq{ to{ transform:translateX(-28px); opacity:0 } }
@keyframes upVtSaleDer{ to{ transform:translateX(28px); opacity:0 } }
@keyframes upVtEntraDer{ from{ transform:translateX(36px); opacity:0 } 45%{ opacity:1 } }
@keyframes upVtEntraIzq{ from{ transform:translateX(-36px); opacity:0 } 45%{ opacity:1 } }
/* lo que se va sin tener a dónde ir sale de lado; lo que llega sin venir de ningún lado crece desde abajo */
::view-transition-old(*):only-child{ animation:upVtFuera .2s cubic-bezier(.4,0,1,1) both }
::view-transition-new(*):only-child{ animation:upVtDentro .24s cubic-bezier(.2,.8,.2,1) both }
@keyframes upVtFuera{ to{ transform:translateX(45%) scale(.96); opacity:0 } }
@keyframes upVtDentro{ from{ transform:translateY(14px) scale(.96); opacity:0 } 50%{ opacity:1 } }
/* una pantalla que se vuelve a pintar por un cambio NO vuelve a entrar: se transforma desde la anterior */
.up-quieto > *, .up-quieto .cifra, .up-quieto .lista-c > .item, .up-quieto .atajos a, .up-quieto .up-nivel span,
.up-quieto .up-hero__foto, .up-quieto .up-hero__sol, .up-quieto .up-hero__marca, .up-quieto .up-hero__eti, .up-quieto .up-hero__saludo,
.up-quieto .up-hero__t, .up-quieto .up-hero__s, .up-quieto .up-cab__t, .up-quieto .up-cab small, .up-quieto .up-cab__arte,
.up-quieto .up-arte .a-traza, .up-quieto .up-arte .a-llena, .up-quieto .up-arte .a-barra, .up-quieto .up-arte .a-llega{ animation:none !important }
.up-quieto .up-arte .a-traza{ stroke-dashoffset:0 } .up-quieto .up-hero__foto{ transform:none }
/* lo que se abre se despliega desde su renglón (y con su alto, donde el navegador sabe animarlo) */
@media (prefers-reduced-motion: no-preference){
  details.nuevo[open] > :not(summary), .item details[open] > :not(summary){ animation:upDespliega .24s cubic-bezier(.2,.8,.2,1) both }
  @keyframes upDespliega{ from{ clip-path:inset(0 0 100% 0); transform:translateY(-10px) } to{ clip-path:inset(0 0 -40px 0) } }
  details.up-cierra > :not(summary){ animation:upPliega .18s cubic-bezier(.4,0,1,1) both !important }
  @keyframes upPliega{ to{ clip-path:inset(0 0 100% 0); transform:translateY(-10px) } }
  @supports (interpolate-size: allow-keywords){
    :root{ interpolate-size:allow-keywords }
    details.nuevo::details-content, .item details::details-content{ block-size:0; overflow:clip; transition:block-size .24s cubic-bezier(.2,.8,.2,1), content-visibility .24s allow-discrete }
    details.nuevo[open]::details-content, .item details[open]::details-content{ block-size:auto }
  }
  .up-cambia{ animation:upMsj .2s cubic-bezier(.2,.8,.2,1) both } @keyframes upMsj{ from{ transform:translateY(8px) } }
  .up-precio b.up-cambia{ animation:upPrecio .22s cubic-bezier(.2,.8,.2,1) both } @keyframes upPrecio{ from{ transform:translateY(35%) scale(.92) } }
}
</style>

<div class="up-apertura" id="upApertura" aria-hidden="true"><div class="up-logo"><img class="p-globo" src="marca/globo.webp" alt="" width="512" height="396"><img class="p-sol" src="marca/sol.webp" alt="" width="512" height="396"><img class="p-personita" src="marca/personita.webp" alt="" width="512" height="396"><img class="p-chorro" src="marca/chorro.webp" alt="" width="512" height="396"><img class="p-urban" src="marca/urban-claro.webp" alt="" width="512" height="396"><img class="p-pest" src="marca/pest.webp" alt="" width="512" height="396"><img class="p-control" src="marca/control-claro.webp" alt="" width="512" height="396"></div></div>

<script type="module">
/* SIN INTERNET (Godines, 13 nov): toda llamada pasa por sin-red.js. Con señal va al servidor; sin señal
   contesta la réplica del teléfono con las mismas reglas (motor.js) y lo hecho se manda al volver.
   Con ?muestra no toca la red: datos de muestra para probarlo de pie. Pruebas: node urban-pest/centro/pruebas.mjs */
import { crearRed, LLAVE_MUESTRA } from './sin-red.js';
import * as motor from './motor.js';
import { muestra, EXCEL_MUESTRA } from './muestra.js';
import { leerXlsx, deExcel, aTarifas } from './excel.js';
import { corrida, unidadDe, concepto } from './cotizar.js';
const q = new URLSearchParams(location.search);
const DE_MUESTRA = q.has('muestra');
const guarda = { leer: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, poner: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const SERVIDOR = q.get('servidor') || guarda.leer('up_servidor') || 'https://sala.palomazi9111.workers.dev/api/urban';
if(q.get('acceso')){ guarda.poner('up_acceso', q.get('acceso')); q.delete('acceso'); history.replaceState(null, '', '?' + q.toString()); }
const app = document.getElementById('app'), barra = document.getElementById('barra');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pesos = (n) => n == null ? '' : '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: Number.isInteger(+n) ? 0 : 2, maximumFractionDigits: 2 });
const DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'], MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const dia = (s) => { if(!s) return ''; const d = new Date(s + 'T12:00:00'); return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}`; };
const hoyISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };

/* íconos: Lucide (ISC), los mismos del resto de sus páginas */
let L = {};

/* ── NADA APARECE DE LA NADA (23 nov) ──
   transicion(hacer, lado): corre `hacer` (que cambia la pantalla) dentro de una View Transition; sin ella, o con
   «reducir movimiento», lo corre y ya. claves(): qué cosas de la pantalla son «la misma» antes y después (la tarjeta
   de cada servicio, cada cifra, cada título), para que viajen a su lugar en vez de desaparecer y volver a salir. */
const QUIETO = matchMedia('(prefers-reduced-motion: reduce)');
const puedeVT = () => !!document.startViewTransition && !QUIETO.matches && !document.hidden;
const nombreVT = (s) => 'up-' + String(s).normalize('NFD').replace(/[^\w-]/g, '_').slice(0, 60);
function claves(raiz){
  const m = new Map(), poner = (e, k) => { if(!m.has(k) && m.size < 40) m.set(k, e); };
  raiz.querySelectorAll('.cifra').forEach((e, i) => poner(e, 'up-cifra-' + i));
  raiz.querySelectorAll('.item[data-id]').forEach(e => poner(e, nombreVT('i-' + e.dataset.id)));
  raiz.querySelectorAll('h2').forEach(e => poner(e, nombreVT('h-' + (e.firstChild?.textContent || '').trim())));
  raiz.querySelectorAll('details.nuevo').forEach((e, i) => poner(e, 'up-d-' + i));
  raiz.querySelectorAll('.vacio').forEach((e, i) => poner(e, 'up-v-' + i));
  raiz.querySelectorAll('.filtro, .atajos').forEach((e, i) => poner(e, 'up-b-' + i));
  return m;
}
const nombrar = (raiz) => { for(const [k, e] of claves(raiz)) e.style.viewTransitionName = k; };
const desnombrar = (raiz) => raiz.querySelectorAll('[style*="view-transition-name"]').forEach(e => { e.style.viewTransitionName = ''; });
let vtTurno = 0;
async function transicion(hacer, lado = ''){
  if(!puedeVT()){ hacer(); return null; }
  const mio = ++vtTurno, h = document.documentElement;
  if(lado) h.dataset.upVt = lado; else delete h.dataset.upVt;
  const t = document.startViewTransition(hacer);
  t.ready.catch(() => {});
  t.finished.catch(() => {}).finally(() => { if(mio === vtTurno) delete h.dataset.upVt; });
  await t.updateCallbackDone.catch(() => {});
  return t;
}
/* FLIP a mano donde no hay View Transitions: cada cosa sale de donde estaba y llega a donde quedó, sólo con transform */
function flip(antes, raiz){
  for(const [k, e] of claves(raiz)){
    const r1 = e.getBoundingClientRect(), r0 = antes.get(k);
    if(r1.bottom < 0 || r1.top > innerHeight) continue;
    if(r0){ const dx = r0.left - r1.left, dy = r0.top - r1.top; if(Math.abs(dx) + Math.abs(dy) > 1) e.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: 220, easing: 'cubic-bezier(.2,.8,.2,1)' }); }
    else e.animate([{ transform: 'translateY(14px) scale(.97)' }, { transform: 'none' }], { duration: 240, easing: 'cubic-bezier(.2,.8,.2,1)' });
  }
}
/* lo que hay que recordar de la pantalla de antes para que la nueva salga de ahí */
function fotografia(raiz){
  const rects = new Map(); for(const [k, e] of claves(raiz)) rects.set(k, e.getBoundingClientRect());
  const cifras = [...raiz.querySelectorAll('.cifra b')].map(b => b.dataset.final || b.textContent);
  const niveles = new Map([...raiz.querySelectorAll('.item[data-id] .up-nivel span')].map(s => [s.closest('[data-id]').dataset.id, parseFloat(s.style.getPropertyValue('--n')) || 0]));
  return { rects, cifras, niveles };
}

function acabado(el, foto, conVT){
  /* cada tarjeta entra un poco después que la anterior */
  el.querySelectorAll('.cifras, .lista-c, .atajos').forEach(g => [...g.children].forEach((h, i) => h.style.setProperty('--up-i', Math.min(i, 9))));
  moverLuz();
  if(foto && !conVT && !QUIETO.matches) flip(foto.rects, el);
  /* el nivel de cada insumo baja o sube desde donde estaba, no desde cero */
  if(foto && !QUIETO.matches) el.querySelectorAll('.item[data-id] .up-nivel span').forEach(s => { const n0 = foto.niveles.get(s.closest('[data-id]').dataset.id), n1 = parseFloat(s.style.getPropertyValue('--n')) || 0;
    if(n0 != null && n0 !== n1) s.animate([{ transform: `scaleX(${n0})` }, { transform: `scaleX(${n1})` }], { duration: 420, easing: 'cubic-bezier(.2,.8,.2,1)' }); });
  /* las cifras suben contando: desde cero al entrar, y desde lo que decían cuando algo cambió */
  el.querySelectorAll('.cifra b').forEach((b, i) => { const m = /^(\$?)([\d,]+)$/.exec(b.textContent.trim()); if(!m) return; const n = Number(m[2].replace(/,/g, ''));
    const previo = foto ? /^(\$?)([\d,]+)$/.exec(String(foto.cifras[i] || '').trim()) : null, desde = previo ? Number(previo[2].replace(/,/g, '')) : 0;
    if(n === desde || (!previo && n < 1) || (foto && QUIETO.matches)) return;
    const t0 = performance.now() + (el.style.getPropertyValue('--up-t0') ? 1700 : 0), dura = foto ? 380 : 450 + Math.min(n, 20) * 18, final = b.textContent; b.dataset.final = final;
    (function paso(t){ const k = Math.min(1, Math.max(0, (t - t0) / dura)); b.textContent = k < 1 ? m[1] + Math.round(desde + (n - desde) * (1 - Math.pow(1 - k, 3))).toLocaleString('en-US') : final; if(k < 1) requestAnimationFrame(paso); })(t0); });
}
const ORDEN = ['hoy', 'servicios', 'inventario', 'vehiculo', 'cotizar', 'numeros'];

     Se arma escondido ANTES del de ahora (así un getElementById encuentra el nuevo) y se cambia de un jalón cuando ya está listo:

function preguntar(tarjeta, b){
  const acc = b.closest('.acc'), otro = [...acc.querySelectorAll('.btn')].find(x => x !== b);
  b.style.viewTransitionName = 'up-si'; if(otro) otro.style.viewTransitionName = 'up-no'; tarjeta.style.viewTransitionName = 'up-tarjeta';
  transicion(() => {
    if(otro) otro.hidden = true; b.dataset.seguro = '1'; b.dataset.texto = b.textContent; b.textContent = 'Sí, cancelarlo'; b.classList.replace('b2', 'up-peligro');
    acc.insertAdjacentHTML('beforebegin', `<p class="up-pregunta" style="view-transition-name:up-preg">¿Seguro que quieres cancelar el servicio de ${esc(tarjeta.querySelector('.t b')?.textContent || 'este cliente')}?</p>`);
    acc.insertAdjacentHTML('beforeend', '<button class="btn b2" type="button" data-no style="view-transition-name:up-no">No, déjalo así</button>');

}
function noPreguntar(tarjeta){

  if(b) b.style.viewTransitionName = 'up-si'; if(no) no.style.viewTransitionName = 'up-no'; tarjeta.style.viewTransitionName = 'up-tarjeta';

        guarda.poner(CLAVE_BORRADOR, JSON.stringify(borrador)); ir('cotizar'); } });
  },
  async cotizar(el){
    const [r, sj] = await Promise.all([tarifasDelExcel(), DE_MUESTRA ? null : apiRed('GET', '/api/salida')]); if(r.falla) return falla(el, r.falla);
    /* de dónde sale la camioneta (POST /api/salida): con copia en el teléfono para enseñarla sin internet */
    if(sj?.bien) guarda.poner('up_salida', JSON.stringify(sj.salida || null));
    const salida = DE_MUESTRA ? null : sj?.bien ? sj.salida : leerJSON('up_salida');
    const ex = r.t?.excel || null;
    const cargar = (b2) => `<label class="btn ${b2 ? 'b2 ' : ''}up-subir"><span data-ic="file-spreadsheet"></span>${ex && !ex.muestra ? 'Volver a cargar tu Excel' : 'Cargar tu Excel'}<input type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden></label>`;
    if(!ex){
      el.innerHTML = cab('Cotizar', 'Tu Excel de cotizaciones, dentro del centro') + `<div class="item"><div class="t"><b>Carga tu «CorridaCotizacion.xlsx»</b></div>
        <p>Se lee aquí, en tu teléfono. Del Excel sólo se guardan tus productos con su costo y tu fórmula. Tu lista de clientes no se lee ni se sube.</p>
        <div class="acc">${cargar(false)}</div><p class="msj" id="msjCarga" role="status"></p></div>`;
      return engancharCarga(el, r.t);
    }
    if(!borrador?.renglones) borrador = borradorNuevo(ex);
    const v = ex.convencional, pct = (n) => Math.round(n * 100) + ' %';
    el.innerHTML = cab('Cotizar', ex.muestra ? 'Con productos y números DE MUESTRA' : `Tu Excel · ${ex.catalogo.length} productos`) + (r.aviso ? `<p class="vacio">${esc(r.aviso)}</p>` : '') + `
      <form class="f up-cot" id="fCot" style="padding:0" autocomplete="off">
        <div class="dos"><label>Cliente o lugar<input name="cliente" value="${esc(borrador.cliente)}" placeholder="Casa en Juriquilla, Planta…"></label><label>Zona<input name="zona" value="${esc(borrador.zona)}" placeholder="Juriquilla, Centro…"></label></div>
        <div class="dos"><label>Horas del técnico<input name="horas" inputmode="decimal" value="${esc(borrador.horas)}"></label><label>Kilómetros<input name="km" inputmode="decimal" value="${esc(borrador.km)}"></label></div>
        <div class="up-km"><button class="btn b2" type="button" id="calcKm" aria-label="Calcular los kilómetros a la zona"><span data-ic="map-pin"></span>Calcular</button><p class="msj" id="msjKm" role="status"></p></div>
        <div class="up-salida"><label>La camioneta sale de<input name="salida" id="salida" value="${esc(salida?.direccion || '')}" placeholder="Calle, número y colonia de tu bodega"></label><button class="btn b2" type="button" id="guardaSalida"><span data-ic="truck"></span>Guardar</button></div>
        <p class="msj" id="msjSalida" role="status">${salida ? '' : 'Falta tu bodega: con ella, «Calcular» saca los km por carretera.'}</p>
        <h2>Lo que se va a aplicar</h2>
        <ul class="lista-c" id="renglones"></ul>
        <div class="dos"><button class="btn b2" type="button" id="masR"><span data-ic="plus"></span>Agregar producto</button><label>Otro material, en pesos<input name="extra" inputmode="decimal" value="${esc(borrador.extra || '')}" placeholder="monitoreo, trampas…"></label></div>
      </form>
      <section class="up-total" id="total" aria-live="polite"></section>
      <div class="acc up-cot-acc"><button class="btn" type="button" id="hoja"><span data-ic="file-text"></span>Hacer la hoja para el cliente</button><button class="btn b2" type="button" id="otra">Empezar otra</button></div>
      <p class="msj" id="msjHoja" role="status"></p>
      <details class="nuevo"><summary><span data-ic="package"></span>Tus productos (${ex.catalogo.length})</summary>
        <ul class="up-catalogo">${[...ex.catalogo].sort((a, b) => a.nombre.localeCompare(b.nombre, 'es')).map(p => `<li><b>${esc(p.nombre)}</b><span>${pesos(Math.round(p.por_unidad * 100) / 100)} · ${esc(unidadDe(p).replace(/s$/, '').replace('L de mezcla', 'L de mezcla'))}</span></li>`).join('')}</ul></details>
      <details class="nuevo"><summary><span data-ic="sigma"></span>Tu fórmula</summary>
        <p class="up-formula">Cotización = (químicos + técnico) <b>× ${v.x} ÷ ${v.entre}</b> + camioneta. Técnico a <b>${pesos(v.mano_hora)} la hora</b>, camioneta a <b>${pesos(v.km)} el km</b>${v.costos != null ? `; luego la parte en <b>${pct(v.costos)} costos</b> y <b>${pct(1 - v.costos)} utilidad</b>` : ''}.
        ${ex.muestra ? 'Son números de muestra: carga tu Excel para usar los tuyos.' : `Leída de tus últimas ${ex.cotizaciones_leidas} cotizaciones, del Excel cargado el ${dia(ex.cargado)}.`}${ex.jadp ? ` También trae tu hoja JADP, para comparar.` : ''}</p></details>
      <div class="acc" style="margin-top:12px">${cargar(true)}</div><p class="msj" id="msjCarga" role="status"></p>`;
    const f = el.querySelector('#fCot'), lista = el.querySelector('#renglones'), total = el.querySelector('#total');
    const opcionesPlaga = (sel) => [...ex.columnas.map(c => c.nombre), 'Otro'].map(n => `<option${n === sel ? ' selected' : ''}>${esc(n)}</option>`).join('');
    const catalogoOrden = [...ex.catalogo].sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
    const opcionesProd = (sel) => catalogoOrden.map(p => `<option value="${p.id}"${p.id === sel ? ' selected' : ''}>${esc(p.nombre)}</option>`).join('');
    const prod = (id) => ex.catalogo.find(p => p.id === id);
    const pintaRenglones = () => {
      lista.innerHTML = borrador.renglones.map((g, i) => `<li class="item up-renglon" data-i="${i}">
        <div class="dos"><label>Plaga<select name="plaga">${opcionesPlaga(g.plaga)}</select></label><label>Producto<select name="producto">${opcionesProd(g.producto)}</select></label></div>
        <div class="up-renglon__abajo"><label>Cantidad<span class="up-con"><input name="cantidad" inputmode="decimal" value="${esc(g.cantidad)}" placeholder="0"><small>${esc(unidadDe(prod(g.producto)))}</small></span></label>
          <b class="up-importe" data-imp>$0</b><button class="btn b2 up-quitar" type="button" data-quitar aria-label="Quitar este producto">×</button></div></li>`).join('');
    };
    const leer = () => {
      const d = Object.fromEntries(new FormData(f));
      borrador = { ...borrador, cliente: d.cliente, zona: d.zona, horas: d.horas, km: d.km, extra: d.extra,
        renglones: [...lista.children].map(li => ({ plaga: li.querySelector('[name=plaga]').value, producto: li.querySelector('[name=producto]').value, cantidad: li.querySelector('[name=cantidad]').value })) };
      guarda.poner(CLAVE_BORRADOR, JSON.stringify(borrador));
    };
    const numero = (s) => Number(String(s ?? '').replace(/[^\d.]/g, '')) || 0;
    const calcula = () => corrida({ horas: numero(borrador.horas), km: numero(borrador.km),
      renglones: [...borrador.renglones.map(g => ({ ...g, cantidad: numero(g.cantidad) })), { extra: numero(borrador.extra) }] }, ex);
    const pintaTotal = () => {
      const c = calcula(), fila = (t, x, k = '') => `<dt>${t}</dt><dd class="${k}">${x}</dd>`;
      [...lista.children].forEach((li, i) => { li.querySelector('[data-imp]').textContent = pesos(c.lineas[i]?.importe || 0); });
      total.innerHTML = `<div class="up-precio"><small>Cotización</small><b>${pesos(c.cotizacion)}</b><span>${c.cotizacion ? 'Lo mismo que da tu Excel con estos datos, al centavo. El bot cotiza con esta misma cuenta.' : 'Pon horas, kilómetros y lo que se va a aplicar.'}</span></div>
        <dl class="desg">${fila('Químicos', pesos(c.quimicos))}${fila(`Técnico · ${c.horas} h × ${pesos(v.mano_hora)}`, pesos(c.mano))}${fila(`Camioneta · ${c.km} km × ${pesos(v.km)}`, pesos(c.traslado))}
          <span class="sep"></span>${fila('Lo que te cuesta hacerlo', pesos(c.directo))}${c.costos != null ? fila(`Costos (${pct(v.costos)})`, pesos(c.costos)) + fila(`Utilidad (${pct(1 - v.costos)})`, pesos(c.utilidad), 'gana') : ''}</dl>
        ${c.jadp ? `<p class="up-jadp">Con tu hoja JADP saldría <b>${pesos(c.jadp.cotizacion)}</b> (utilidad ${pesos(c.jadp.utilidad)}).</p>` : ''}`;
      return c;
    };
    pintaRenglones(); pintaTotal();
    f.addEventListener('input', () => { leer(); pintaTotal(); });
    /* «Calcular»: la zona del cliente → GET /api/distancia → los km de ida por carretera desde la bodega (como su Excel) */
    el.querySelector('#calcKm').addEventListener('click', async (e) => {
      const msj = el.querySelector('#msjKm'), b = e.currentTarget, zona = f.zona.value.trim();
      if(!zona){ msj.className = 'msj mal'; msj.textContent = 'Escribe arriba la zona o colonia del cliente.'; f.zona.focus(); return; }
      if(DE_MUESTRA){ msj.className = 'msj'; msj.textContent = 'En la muestra no se calcula. Con tu cuenta, aquí sale la zona y los km desde tu bodega.'; return; }
      b.disabled = true; msj.className = 'msj'; msj.textContent = 'Buscando la zona…';
      const j = await apiRed('GET', '/api/distancia?donde=' + encodeURIComponent(zona));
      b.disabled = false;
      if(!j.bien){ msj.className = 'msj mal'; msj.textContent = j.sinRed ? 'Sin internet: pon los km a mano.' : (j.error || 'No se pudo calcular.'); return; }
      const donde = [j.lugar + (j.municipio && j.municipio !== 'Querétaro' ? ', ' + j.municipio : ''), j.rumbo].filter(Boolean).join(' · ');
      if(j.km == null){ msj.className = 'msj mal'; msj.textContent = `${donde}. Falta de dónde sale la camioneta: guárdala abajo y vuelve a calcular.`; el.querySelector('#salida').focus(); return; }
      f.km.value = String(j.km); leer(); pintaTotal();
      msj.className = 'msj bien'; msj.textContent = `${donde} · ${j.km} km ${j.por === 'carretera' ? 'por carretera' : 'aproximados (el mapa no contestó)'}`;
    });
    /* «La camioneta sale de»: se ubica en el mapa y se guarda en su servidor; se le enseña lo que entendió para que confirme */
    const guardaSalida = async () => {
      const msj = el.querySelector('#msjSalida'), b = el.querySelector('#guardaSalida'), direccion = el.querySelector('#salida').value.trim();
      if(!direccion){ msj.className = 'msj mal'; msj.textContent = 'Escribe la dirección de tu bodega: calle, número y colonia.'; return; }
      if(DE_MUESTRA){ msj.className = 'msj'; msj.textContent = 'En la muestra no se guarda. Con tu cuenta, aquí te dice qué dirección entendió el mapa.'; return; }
      b.disabled = true; msj.className = 'msj'; msj.textContent = 'Buscándola en el mapa…';
      const j = await apiRed('POST', '/api/salida', { direccion });
      b.disabled = false;
      if(!j.bien){ msj.className = 'msj mal'; msj.textContent = j.sinRed ? 'Sin internet: guárdala cuando tengas señal.' : (j.error || 'No se pudo guardar.'); return; }
      guarda.poner('up_salida', JSON.stringify(j.salida));
      msj.className = 'msj bien'; msj.textContent = `Guardada. Entendí: ${j.entendi}. Si no es tu bodega, escríbela más completa.`;
    };
    el.querySelector('#guardaSalida').addEventListener('click', guardaSalida);
    el.querySelector('#salida').addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); guardaSalida(); } });
    f.addEventListener('change', (e) => {
      const li = e.target.closest('.up-renglon'); if(!li) return;
      if(e.target.name === 'plaga'){ const col = ex.columnas.find(c => c.nombre === e.target.value); if(col?.producto) li.querySelector('[name=producto]').value = col.producto; }
      li.querySelector('.up-con small').textContent = unidadDe(prod(li.querySelector('[name=producto]').value));
      leer(); pintaTotal();
    });
    lista.addEventListener('click', (e) => { const b = e.target.closest('[data-quitar]'); if(!b) return; leer(); borrador.renglones.splice(+b.closest('[data-i]').dataset.i, 1); if(!borrador.renglones.length) borrador.renglones.push(renglonDe(ex)); guarda.poner(CLAVE_BORRADOR, JSON.stringify(borrador)); pintaRenglones(); pintaTotal(); });
    el.querySelector('#masR').addEventListener('click', () => { leer(); borrador.renglones.push(renglonDe(ex)); pintaRenglones(); pintaTotal(); lista.lastElementChild?.querySelector('[name=cantidad]')?.focus(); });
    el.querySelector('#otra').addEventListener('click', () => { borrador = borradorNuevo(ex); guarda.poner(CLAVE_BORRADOR, JSON.stringify(borrador)); ir('cotizar'); });
    el.querySelector('#hoja').addEventListener('click', async (e) => {
      leer(); const c = pintaTotal(), msj = el.querySelector('#msjHoja'), b = e.currentTarget;
      if(!(c.precio > 0)){ msj.className = 'msj mal'; msj.textContent = 'Todavía no hay precio: pon horas y lo que se va a aplicar.'; return; }
      if(!String(borrador.cliente || '').trim()){ msj.className = 'msj mal'; msj.textContent = 'Pon a nombre de quién va (cliente o lugar).'; f.cliente.focus(); return; }
      if(DE_MUESTRA || ex.muestra){ msj.className = 'msj'; msj.textContent = `En la muestra no se hace la hoja. Con tu cuenta, aquí sale el link para mandársela al cliente por ${pesos(c.precio)}.`; return; }
      b.disabled = true; msj.className = 'msj'; msj.textContent = 'Haciendo la hoja…';
      const j = await apiRed('POST', '/api/cotizaciones', { cliente: borrador.cliente.trim(), zona: borrador.zona || undefined,
        renglones: [{ concepto: concepto(borrador, ex), cantidad: 1, precio: c.precio }], nota: 'Incluye material, mano de obra y traslado.' });
      b.disabled = false;
      if(!j.bien){ msj.className = 'msj mal'; msj.textContent = j.error || 'No se pudo hacer la hoja.'; return; }
      const url = new URL('../cotizacion/?c=' + encodeURIComponent(j.cotizacion.codigo), location.href).href;
      msj.className = 'msj bien'; msj.innerHTML = `Lista. <a href="${esc(url)}">Ver la hoja</a> · <a href="https://wa.me/?text=${encodeURIComponent('Te comparto tu cotización de Urban Pest Control: ' + url)}">Mandarla por WhatsApp</a>`;
    });
    engancharCarga(el, r.t);
  },
  async vehiculo(el){
    const j = await api('GET', '/api/vehiculos'); if(!j.bien) return falla(el, j);
    const TIPOS = ['aceite', 'llantas', 'frenos', 'afinación', 'verificación', 'seguro', 'tenencia', 'otro'];
    el.innerHTML = cab('Vehículo', 'Revisiones y lo que viene') + `
      <details class="nuevo"><summary><span data-ic="plus"></span>Agregar un vehículo</summary>
        <form class="f" id="fVeh"><div class="dos"><label>Nombre<input name="nombre" required placeholder="Camioneta blanca"></label><label>Placas<input name="placas"></label></div>
          <label>Kilometraje de hoy<input name="km" inputmode="numeric"></label><button class="btn" type="submit">Agregar</button><p class="msj" role="status"></p></form></details>
      ${j.vehiculos.map(v => `<h2>${esc(v.nombre)} <span class="n">${v.placas ? esc(v.placas) + ' · ' : ''}${v.km != null ? Number(v.km).toLocaleString('en-US') + ' km' : ''}</span></h2>
        ${v.proximas.length ? `<ul class="lista-c">${v.proximas.map(p => `<li class="item${p.urge ? ' up-ojo' : ''}"><div class="t"><b>${esc(p.tipo)}</b><span>${p.fecha ? dia(p.fecha) : ''}${p.km ? ' · a los ' + Number(p.km).toLocaleString('en-US') + ' km' : ''}</span></div>${p.urge ? '<div class="acc"><span class="chip aviso">Ya toca</span></div>' : ''}</li>`).join('')}</ul>` : '<p class="vacio">Sin próximas revisiones apuntadas.</p>'}
        <details class="nuevo"><summary><span data-ic="wrench"></span>Apuntar una revisión</summary>
          <form class="f" data-v="${v.id}"><div class="dos"><label>Qué se hizo<select name="tipo">${TIPOS.map(t => `<option>${t}</option>`).join('')}</select></label><label>Fecha<input name="fecha" type="date" required value="${hoyISO()}"></label></div>
            <div class="dos"><label>Kilometraje<input name="km" inputmode="numeric"></label><label>Costo<input name="costo" inputmode="decimal"></label></div>
            <div class="dos"><label>Próxima revisión: fecha<input name="proxima_fecha" type="date"></label><label>Próxima revisión: a los km<input name="proxima_km" inputmode="numeric"></label></div>
            <label>Nota<input name="nota"></label><button class="btn" type="submit">Guardar</button><p class="msj" role="status"></p></form></details>`).join('') || '<p class="vacio">Agrega la camioneta para llevar aceite, llantas, verificación y seguro.</p>'}`;
    formEnvio(el.querySelector('#fVeh'), (d) => api('POST', '/api/vehiculos', d));
    el.querySelectorAll('form[data-v]').forEach(f => formEnvio(f, (d) => api('POST', '/api/vehiculos/revision', { ...d, vehiculo: f.dataset.v })));
  },
};

/* ── COTIZAR: de dónde salen su catálogo y su fórmula ──
   De su servidor (POST /api/tarifas guarda lo que se sacó del Excel), con copia en el teléfono para
   cotizar sin internet. Con ?muestra, el catálogo de muestra, o su Excel cargado SÓLO en ese teléfono. */
const CLAVE_T = DE_MUESTRA ? 'up_tarifas_muestra' : 'up_tarifas', CLAVE_BORRADOR = DE_MUESTRA ? 'up_corrida_muestra' : 'up_corrida';
const leerJSON = (k) => { try { return JSON.parse(guarda.leer(k) || 'null'); } catch { return null; } };
let borrador = leerJSON(CLAVE_BORRADOR);
const renglonDe = (ex, col = ex?.columnas?.find(c => /rastrero/i.test(c.nombre)) || ex?.columnas?.[0]) => ({ plaga: col?.nombre || 'Otro', producto: col?.producto || ex?.catalogo?.[0]?.id || '', cantidad: '' });
const borradorNuevo = (ex) => ({ cliente: '', zona: '', horas: '1', km: ex?.km_tipico != null ? String(ex.km_tipico) : '', extra: '', renglones: [renglonDe(ex)] });
async function tarifasDelExcel(){
  if(DE_MUESTRA) return { t: leerJSON(CLAVE_T) || { excel: EXCEL_MUESTRA } };
  const j = await apiRed('GET', '/api/tarifas');
  if(j.bien){ guarda.poner(CLAVE_T, JSON.stringify(j.tarifas || null)); return { t: j.tarifas || null }; }
  if(j.status === 401) return { falla: j };
  const t = leerJSON(CLAVE_T);
  return { t, aviso: j.sinRed ? (t ? 'Sin internet: cotizas con lo último guardado en este teléfono.' : 'Sin internet. La primera vez hace falta señal para bajar tu catálogo.') : (j.error || null) };
}
function engancharCarga(el, previas){
  const input = el.querySelectorAll('input[type=file]'), msj = el.querySelector('#msjCarga');
  input.forEach(i => i.addEventListener('change', async () => {
    const a = i.files?.[0]; if(!a) return;
    msj.className = 'msj'; msj.textContent = 'Leyendo tu Excel…';
    try {
      const ex = deExcel(await leerXlsx(await a.arrayBuffer()), a.name);
      const t = aTarifas(ex, previas?.excel?.muestra ? {} : (previas || {}));
      if(DE_MUESTRA) guarda.poner(CLAVE_T, JSON.stringify(t));
      else {
        msj.textContent = 'Guardando en tu servidor…';
        const j = await apiRed('POST', '/api/tarifas', { tarifas: t });
        if(!j.bien){ msj.className = 'msj mal'; msj.textContent = (j.sinRed ? 'Sin internet: ' : '') + 'no se pudo guardar. ' + (j.error || '') + ' Vuelve a intentarlo con señal.'; return; }
        guarda.poner(CLAVE_T, JSON.stringify(t));
      }
      borrador = borradorNuevo(ex); guarda.poner(CLAVE_BORRADOR, JSON.stringify(borrador));
      avisa(`Listo: ${ex.catalogo.length} productos y tu fórmula (× ${ex.convencional.x} ÷ ${ex.convencional.entre}).` + (DE_MUESTRA ? ' Sólo en este teléfono.' : ' El bot ya cotiza con esto.'));
      ir('cotizar');
    } catch(err){ msj.className = 'msj mal'; msj.textContent = err.message || 'No se pudo leer ese archivo.'; }
    finally { i.value = ''; }
  }));
}
function marca(id, n){ const e = document.getElementById(id); e.hidden = !n; e.textContent = n; }
function falla(el, j){
  if(j.status === 401){
    el.innerHTML = `<div class="entrar"><b>Entra a tu centro</b><p>Abre el link de acceso que te mandó Grupo Mazi, o pega aquí tu código.</p>
      <form class="f" style="padding:0" id="fEnt"><label>Código<input name="c" autocomplete="off" required></label><button class="btn" type="submit">Entrar</button></form></div>`;
    barra.hidden = true;
    el.querySelector('#fEnt').onsubmit = (e) => { e.preventDefault(); guarda.poner('up_acceso', new FormData(e.target).get('c').trim()); location.reload(); };
    return;
  }
  el.innerHTML = `<p class="vacio" style="padding:40px 0">${esc(j.error)} <button class="btn b2" type="button" onclick="location.reload()">Reintentar</button></p>`;
}
barra.addEventListener('click', (e) => { const b = e.target.closest('[data-p]'); if(b) ir(b.dataset.p); });
barra.hidden = false;
ir(actual);
/* la cortina del logo ya subió: se quita del todo */
if(document.documentElement.classList.contains('up-abre')) setTimeout(() => { document.getElementById('upApertura')?.remove(); document.documentElement.classList.remove('up-abre'); }, 3200);
</script>
