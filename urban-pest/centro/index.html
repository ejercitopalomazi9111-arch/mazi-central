<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F7F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1412" media="(prefers-color-scheme: dark)">
<title>Centro · Urban Pest</title>
<link rel="icon" href="../web/img/sello.png">
<link rel="stylesheet" href="../chat/estilo.css">
<style>
/* EL CENTRO DE OPERACIONES (BRIEF §C): hoy, servicios, inventario y vehículo. Mismo sistema que el chat central
   (../chat/estilo.css), teléfono primero. Rutas en urban-pest/servidor/RUTAS.md. */
body{ min-height:100%; }
.env{ max-width:880px; margin:0 auto; padding:0 16px calc(96px + env(safe-area-inset-bottom)) }
.top{ position:sticky; top:0; z-index:5; background:var(--fondo); padding:14px 0 10px; display:flex; align-items:center; justify-content:space-between; gap:12px }
.top b{ font-size:20px } .top small{ display:block; color:var(--tenue); font-size:13px }
.atajos{ display:flex; gap:8px; overflow-x:auto; padding:2px 0 14px; scrollbar-width:none }
.atajos a{ flex:none; display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 14px; border-radius:999px; background:var(--sup); box-shadow:var(--elev1); color:var(--tinta); text-decoration:none; font-weight:600; font-size:14px }
.ic{ width:20px; height:20px; flex:none }
h2{ font-size:17px; margin:26px 0 10px; display:flex; align-items:center; gap:8px } h2 .n{ color:var(--tenue); font-weight:500 }
.cifras{ display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:10px }
.cifra{ background:var(--sup); border-radius:var(--r); padding:14px 16px; box-shadow:var(--elev1) }
.cifra b{ display:block; font-size:28px; line-height:1.1; font-variant-numeric:tabular-nums } .cifra small{ color:var(--tenue); font-size:13px }
.cifra.alerta b{ color:var(--aviso) }
.lista-c{ list-style:none; padding:0; margin:0; display:grid; gap:10px }
.item{ background:var(--sup); border-radius:var(--r); padding:14px 16px; box-shadow:var(--elev1); display:grid; gap:8px }
.item .t{ display:flex; justify-content:space-between; gap:12px; align-items:baseline } .item .t b{ font-size:16px } .item .t span{ color:var(--tenue); font-size:14px; white-space:nowrap; font-variant-numeric:tabular-nums }
.item p{ color:var(--tenue); font-size:14px; margin:0 }
.chip{ display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:12.5px; font-weight:700; background:var(--sup2); color:var(--tenue) }
.chip.aviso{ background:var(--aviso-suave); color:var(--aviso) } .chip.ok{ background:var(--acento-suave); color:var(--acento-texto) }
.acc{ display:flex; flex-wrap:wrap; gap:8px }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 16px; border-radius:var(--r2); background:var(--acento); color:var(--acento-tinta); font-weight:700; font-size:15px; text-decoration:none }
.btn.b2{ background:var(--sup2); color:var(--tinta) } .btn:disabled{ opacity:.5 }
.vacio{ color:var(--tenue); font-size:14px; padding:6px 2px }
details.nuevo{ background:var(--sup); border-radius:var(--r); box-shadow:var(--elev1); margin:6px 0 4px }
details.nuevo > summary{ list-style:none; min-height:52px; display:flex; align-items:center; gap:10px; padding:0 16px; font-weight:700; cursor:pointer; color:var(--acento-texto) }
details.nuevo > summary::-webkit-details-marker{ display:none }
.f{ display:grid; gap:12px; padding:0 16px 16px }
.f label{ display:grid; gap:6px; font-weight:600; font-size:14px }
.f input, .f select, .f textarea{ width:100%; min-height:48px; padding:12px; border-radius:var(--r2); border:1.5px solid var(--linea); background:var(--fondo); color:var(--tinta); font-size:16px }
.f textarea{ min-height:80px; resize:vertical }
.dos{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px }
.msj{ font-weight:600; font-size:14px; min-height:1.2em } .msj.mal{ color:#C0392B } .msj.bien{ color:var(--acento-texto) }
.filtro{ display:flex; gap:8px; overflow-x:auto; margin:4px 0 12px; scrollbar-width:none }
.filtro button{ flex:none; min-height:44px; padding:0 14px; border-radius:999px; background:var(--sup2); font-weight:600; font-size:14px; color:var(--tenue) }
.filtro button[aria-pressed="true"]{ background:var(--acento); color:var(--acento-tinta) }
.mov{ display:grid; grid-template-columns:minmax(0,1fr) 92px; gap:8px; align-items:end }
.barra-inf{ position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--sup); box-shadow:0 -1px 0 var(--linea); padding:6px 4px calc(6px + env(safe-area-inset-bottom)); display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)) }
.desg{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; font-size:14px; margin:0; padding:10px 12px; border-radius:var(--r2); background:var(--sup2) }
.desg dt{ color:var(--tenue) } .desg dd{ margin:0; text-align:right; font-variant-numeric:tabular-nums; font-weight:600 }
.desg .sep{ grid-column:1/-1; height:1px; background:var(--linea); margin:4px 0 }
.gana{ color:var(--acento-texto) }
.item details > summary{ cursor:pointer; color:var(--acento-texto); font-weight:700; font-size:14px; min-height:36px; display:flex; align-items:center }
.barra-inf button{ display:grid; justify-items:center; gap:2px; min-height:52px; font-size:12px; font-weight:600; color:var(--tenue); position:relative }
.barra-inf button[aria-current="page"]{ color:var(--acento-texto) }
.barra-inf i{ position:absolute; top:4px; right:calc(50% - 22px); min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--aviso); color:#fff; font:700 11px/18px var(--letra); font-style:normal }
/* la franja de estado: sin internet, cambios por enviar, datos de muestra (sin-red.js) */
.red{ position:sticky; top:0; z-index:5; margin:0 0 8px; padding:10px 14px; border-radius:0 0 var(--r) var(--r); background:var(--sup); box-shadow:var(--elev2); border-left:4px solid var(--aviso); font-size:14px; line-height:1.4 }
.red p{ margin:0 } .red p + p{ margin-top:6px } .red .btn{ margin-top:6px; min-height:44px }
.entrar{ max-width:440px; margin:12vh auto 0; background:var(--sup); border-radius:var(--r); padding:24px; box-shadow:var(--elev2) }
.entrar p{ color:var(--tenue); margin:8px 0 16px }
/* MOVIMIENTO Y ACABADO (Godines, 13 nov; lo pidió Luis: «llénalo de animaciones, premium y agradable»).
   Nombres con «up» porque en CSS todo es global y esta página comparte ../chat/estilo.css.
   Sólo transform: nada de opacidad sobre texto, y nada que cambie el tamaño de un botón al medirlo. */
.env{ overflow-x:clip }
.cifra{ position:relative; overflow:hidden; background-image:linear-gradient(160deg, color-mix(in srgb, var(--acento) 9%, transparent), transparent 58%) }
.cifra.alerta{ background-image:linear-gradient(160deg, color-mix(in srgb, var(--aviso) 16%, transparent), transparent 62%) }
.item{ transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s }
.item.up-ojo{ box-shadow:inset 3px 0 0 var(--aviso), var(--elev1) }
.btn, .filtro button, .atajos a{ transition:transform .14s ease, background-color .2s, color .2s }
.btn:active, .filtro button:active, .atajos a:active{ transform:scale(.96) }
.btn:not(.b2){ background-image:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0)); box-shadow:0 8px 18px -10px var(--acento) }
/* el nivel de cada insumo; la raya marca su mínimo */
.up-nivel{ position:relative; height:8px; border-radius:99px; background:var(--sup2); overflow:hidden }
.up-nivel span{ display:block; height:100%; border-radius:inherit; background:var(--acento); transform-origin:left; transform:scaleX(var(--n)) }
.up-nivel.bajo span{ background:var(--aviso) }
.up-nivel::after{ content:""; position:absolute; left:33.33%; top:0; bottom:0; width:2px; background:var(--sup) }
/* la luz que se desliza a la pestaña activa */
.barra-inf{ isolation:isolate }
.up-luz{ position:absolute; z-index:-1; left:0; top:6px; height:52px; width:0; border-radius:16px; background:var(--acento-suave); transition:transform .45s cubic-bezier(.3,1.3,.5,1), width .3s }
/* el aviso de «listo»: sube desde abajo y se va solo */
.up-aviso{ position:fixed; z-index:7; left:16px; right:16px; bottom:calc(84px + env(safe-area-inset-bottom)); max-width:520px; margin:0 auto; padding:12px 16px; border-radius:var(--r2); background:var(--tinta); color:var(--fondo); font-weight:600; font-size:14px; box-shadow:var(--elev2); transform:translateY(calc(100% + 150px)); transition:transform .4s cubic-bezier(.2,.9,.3,1.15); pointer-events:none }
.up-aviso.ve{ transform:none }
/* esqueleto mientras llega lo primero */
.up-esq{ display:grid; gap:10px; padding-top:64px } .up-esq i{ display:block; height:74px; border-radius:var(--r); background:linear-gradient(100deg, var(--sup2) 30%, var(--sup) 50%, var(--sup2) 70%) 0 0 / 300% 100% }
.up-esq i:first-child{ height:40px; width:52% }
.up-solo-lector{ position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%) }
@media (prefers-reduced-motion: no-preference){
  .env > *, .cifra, .lista-c > .item, .atajos a{ animation:upEntra .55s cubic-bezier(.2,.85,.25,1) both; animation-delay:calc(var(--up-i, 0) * 45ms) }
  .env > *:nth-child(2){ animation-delay:40ms } .env > *:nth-child(3){ animation-delay:80ms } .env > *:nth-child(n+4){ animation-delay:120ms }
  @keyframes upEntra{ from{ transform:translateY(18px) } }
  .up-nivel span{ animation:upLlena .9s cubic-bezier(.2,.8,.2,1) .15s both } @keyframes upLlena{ from{ transform:scaleX(0) } }
  .barra-inf button[aria-current="page"] .ic{ animation:upBrinca .45s cubic-bezier(.3,1.6,.5,1) } @keyframes upBrinca{ 40%{ transform:translateY(-4px) scale(1.14) } }
  .barra-inf i{ animation:upLate 2.6s ease-in-out infinite } @keyframes upLate{ 50%{ transform:scale(1.14) } }
  .red:not([hidden]){ animation:upBaja .45s cubic-bezier(.2,.85,.25,1) } @keyframes upBaja{ from{ transform:translateY(-110%) } }
  .up-sale{ animation:upSale .23s ease-in forwards !important } @keyframes upSale{ to{ transform:translateX(110%) } }
  .up-esq i{ animation:upBrilla 1.3s linear infinite } @keyframes upBrilla{ to{ background-position:-150% 0 } }
  @media (hover:hover){ .item:hover{ transform:translateY(-2px); box-shadow:var(--elev2) } }
}
</style>
</head>
<body>
<div class="red" id="red" role="status" hidden></div>
<div class="env" id="app"><div class="up-esq" aria-hidden="true"><i></i><i></i><i></i><i></i></div><p class="up-solo-lector">Cargando…</p></div>
<nav class="barra-inf" id="barra" hidden aria-label="Secciones">
  <span class="up-luz" id="upLuz" aria-hidden="true"></span>
  <button type="button" data-p="hoy" aria-current="page"><span data-ic="sun"></span>Hoy<i id="nHoy" hidden></i></button>
  <button type="button" data-p="servicios"><span data-ic="calendar-days"></span>Servicios</button>
  <button type="button" data-p="inventario"><span data-ic="package"></span>Inventario<i id="nInv" hidden></i></button>
  <button type="button" data-p="vehiculo"><span data-ic="truck"></span>Vehículo<i id="nVeh" hidden></i></button>
  <button type="button" data-p="numeros"><span data-ic="wallet"></span>Números</button>
</nav>
<div class="up-aviso" id="upAviso" role="status" aria-live="polite"></div>
<script type="module">
/* SIN INTERNET (Godines, 13 nov): toda llamada pasa por sin-red.js. Con señal va al servidor; sin señal
   contesta la réplica del teléfono con las mismas reglas (motor.js) y lo hecho se manda al volver.
   Con ?muestra no toca la red: datos de muestra para probarlo de pie. Pruebas: node urban-pest/centro/pruebas.mjs */
import { crearRed, LLAVE_MUESTRA } from './sin-red.js';
import * as motor from './motor.js';
import { muestra } from './muestra.js';
const q = new URLSearchParams(location.search);
const DE_MUESTRA = q.has('muestra');
const guarda = { leer: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, poner: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const SERVIDOR = q.get('servidor') || guarda.leer('up_servidor') || 'https://sala.palomazi9111.workers.dev/api/urban';
if(q.get('acceso')){ guarda.poner('up_acceso', q.get('acceso')); q.delete('acceso'); history.replaceState(null, '', '?' + q.toString()); }
const app = document.getElementById('app'), barra = document.getElementById('barra');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pesos = (n) => n == null ? '' : '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: Number.isInteger(+n) ? 0 : 2, maximumFractionDigits: 2 });
const DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'], MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const dia = (s) => { if(!s) return ''; const d = new Date(s + 'T12:00:00'); return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}`; };
const hoyISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };

/* íconos: Lucide (ISC), los mismos del resto de sus páginas */
let L = {};
try { L = (await (await fetch('../../presentaciones/vendor/lucide-1.48.0.json')).json()).iconos; } catch {}
const ic = (n) => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${L[n] || ''}</svg>`;
const pintaIconos = (raiz = document) => raiz.querySelectorAll('[data-ic]').forEach(e => { if(!e.firstChild) e.innerHTML = ic(e.dataset.ic); });

async function apiRed(metodo, ruta, cuerpo){
  try {
    const r = await fetch(SERVIDOR + ruta, { method: metodo, headers: { 'content-type': 'application/json', 'x-llave': guarda.leer('up_llave') || guarda.leer('salaLlave') || '', 'x-acceso': guarda.leer('up_acceso') || '' }, body: cuerpo ? JSON.stringify(cuerpo) : undefined });
    const j = await r.json().catch(() => ({ bien: false, error: 'El servidor no contestó bien (' + r.status + ').' }));
    if(!r.ok && j.bien !== false) j.bien = false; j.status = r.status; return j;
  } catch { return { bien: false, sinRed: true, error: 'Sin conexión. Revisa tu internet.' }; }
}
const caja = { leer: (k) => localStorage.getItem(k), poner: (k, v) => localStorage.setItem(k, v) };
const R = crearRed({ red: apiRed, motor, caja, hoy: hoyISO, soloLocal: DE_MUESTRA, ...(DE_MUESTRA ? { llave: LLAVE_MUESTRA, semilla: muestra(hoyISO()) } : {}) });
function api(metodo, ruta, cuerpo){ return R.api(metodo, ruta, cuerpo); }
const HORA = (t) => { const d = new Date(t); return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}, ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; };
function pintaRed(){
  const s = R.estado(), el = document.getElementById('red'), p = [];
  if(s.muestra) p.push('<b>Datos de muestra.</b> Nada de esto es del cliente ni se envía a ningún lado.');
  else {
    if(s.sinRed) p.push(`<b>Sin internet.</b> Ves lo guardado${s.al ? ' el ' + HORA(s.al) : ''}. Lo que hagas se envía solo cuando vuelva la señal.`);
    if(s.pendientes) p.push(`<b>${s.pendientes} ${s.pendientes === 1 ? 'cambio por enviar' : 'cambios por enviar'}:</b> ${s.cola.slice(0, 3).map(esc).join(' · ')}${s.pendientes > 3 ? ' · y más' : ''}`);
    if(s.detenida) p.push(`No se pudieron enviar todavía: ${esc(s.detenida)}`);
    if(s.pendientes && !s.sinRed) p.push('<button class="btn b2" type="button" data-enviar>Enviar ahora</button>');
    for(const r of s.rechazados) p.push(`<b>No entró:</b> ${esc(r.que)}. ${esc(r.error)}`);
    if(s.rechazados.length) p.push('<button class="btn b2" type="button" data-entendido>Entendido</button>');
    if(s.sinEspacio) p.push('<b>El teléfono no tiene espacio para guardar.</b> Lo que hagas sin internet se puede perder: libera espacio.');
    if(s.cajaRota) p.push('Lo que estaba guardado en este teléfono no se pudo leer y se apartó. Con señal se vuelve a bajar.');
  }
  el.hidden = !p.length; el.innerHTML = p.map(x => x.startsWith('<button') ? x : `<p>${x}</p>`).join('');
}
document.getElementById('red').addEventListener('click', async (e) => {
  if(e.target.closest('[data-enviar]')){ await R.enviarCola(); ir(actual); }
  if(e.target.closest('[data-entendido]')){ R.olvidarRechazados(); pintaRed(); }
});
addEventListener('online', async () => { await R.enviarCola(); ir(actual); });
addEventListener('offline', () => ir(actual));
if('serviceWorker' in navigator && !DE_MUESTRA) navigator.serviceWorker.register('./sw.js').catch(() => {});

const atajos = `<nav class="atajos" aria-label="Atajos">
  <a href="../chat/"><span data-ic="message-circle"></span>Chat central</a>
  <a href="../cotizacion/?nueva"><span data-ic="file-text"></span>Cotización a mano</a>
  <a href="../carpeta/?registrar"><span data-ic="clipboard-check"></span>Carpeta de plantas</a></nav>`;
const cab = (t, s) => `<header class="top"><div><b>${t}</b><small>${s}</small></div></header>`;
const formEnvio = (f, alListo) => f.addEventListener('submit', async (e) => {
  e.preventDefault(); const msj = f.querySelector('.msj'), boton = f.querySelector('[type=submit]');
  boton.disabled = true; msj.className = 'msj'; msj.textContent = 'Guardando…';
  const j = await alListo(Object.fromEntries(new FormData(f)));
  boton.disabled = false;
  if(!j.bien){ msj.className = 'msj mal'; msj.textContent = j.error; return; }
  msj.className = 'msj bien'; msj.textContent = 'Listo.'; setTimeout(() => ir(actual), 500);
});

let actual = q.get('p') || 'hoy';
/* ── movimiento y acabado ── */
const QUIETO = matchMedia('(prefers-reduced-motion: reduce)').matches;
let tAviso;
function avisa(texto){ const a = document.getElementById('upAviso'); a.textContent = texto; a.classList.add('ve'); clearTimeout(tAviso); tAviso = setTimeout(() => a.classList.remove('ve'), 3200); }
function moverLuz(){ const b = barra.querySelector('[aria-current="page"]'), l = document.getElementById('upLuz'); if(!b || !l) return; l.style.width = b.offsetWidth + 'px'; l.style.transform = `translateX(${b.offsetLeft}px)`; }
addEventListener('resize', moverLuz);
function acabado(el){
  /* cada tarjeta entra un poco después que la anterior */
  el.querySelectorAll('.cifras, .lista-c, .atajos').forEach(g => [...g.children].forEach((h, i) => h.style.setProperty('--up-i', Math.min(i, 9))));
  moverLuz();
  if(QUIETO) return;
  /* las cifras suben contando */
  el.querySelectorAll('.cifra b').forEach(b => { const m = /^(\$?)([\d,]+)$/.exec(b.textContent.trim()); if(!m) return; const n = Number(m[2].replace(/,/g, '')); if(n < 1) return;
    const t0 = performance.now(), dura = 450 + Math.min(n, 20) * 18, final = b.textContent;
    (function paso(t){ const k = Math.min(1, Math.max(0, (t - t0) / dura)); b.textContent = k < 1 ? m[1] + Math.round(n * (1 - Math.pow(1 - k, 3))).toLocaleString('en-US') : final; if(k < 1) requestAnimationFrame(paso); })(t0); });
}
async function ir(p){
  actual = p; barra.querySelectorAll('button').forEach(b => b.dataset.p === p ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  /* el contenedor se recrea en cada pantalla: así no se juntan oyentes viejos (CLAUDE.md, «innerHTML deja la pantalla limpia») */
  const viejo = raiz(), nuevo = viejo.cloneNode(false); viejo.replaceWith(nuevo); window.__app = nuevo;
  await PANTALLAS[p](nuevo); pintaIconos(nuevo); pintaIconos(barra); pintaRed(); acabado(nuevo);
  /* los globitos de la barra van al día en cualquier pantalla, no sólo en «Hoy» */
  if(p !== 'hoy') api('GET', '/api/tablero').then(t => { if(t.bien){ marca('nHoy', t.servicios_hoy.length + t.atrasados.length + t.seguimientos.length); marca('nInv', t.insumos_bajos.length); marca('nVeh', t.vehiculo.length); } });
}
const raiz = () => window.__app || app;

const citaItem = (c, acciones = true) => `<li class="item" data-id="${c.id}">
  <div class="t"><b>${esc(c.cliente)}</b><span>${dia(c.fecha)}${c.hora ? ' · ' + esc(c.hora) : ''}</span></div>
  <p>${[c.plaga && esc(c.plaga), c.zona && esc(c.zona), c.direccion && esc(c.direccion), c.tecnico && 'Técnico: ' + esc(c.tecnico)].filter(Boolean).join(' · ') || 'Sin detalles'}</p>
  <div class="acc">${c.precio != null ? `<span class="chip">${c.precio === 0 ? 'Garantía · sin costo' : pesos(c.precio)}</span>` : ''}<span class="chip ${c.estado === 'pendiente' ? 'aviso' : c.estado === 'cerrado' ? 'ok' : ''}">${c.estado === 'hecho' ? 'Hecho · por cobrar' : c.estado}</span>
    ${c.telefono ? `<a class="chip" href="https://wa.me/52${esc(String(c.telefono).replace(/\D/g, '').slice(-10))}">WhatsApp</a>` : ''}</div>

const conAcciones = (el) => el.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-est],[data-seg]'); if(!b) return;
  const id = b.closest('[data-id]').dataset.id; b.disabled = true;
  const j = b.dataset.est ? await api('POST', '/api/citas/estado', { id, estado: b.dataset.est }) : await api('POST', '/api/citas/seguimiento', { id, sigue_plaga: b.dataset.seg === 'sigue' });
  if(!j.bien){ b.disabled = false; alert(j.error); return; }
  avisa((b.dataset.est === 'hecho' ? `Hecho. Seguimiento el ${dia(j.cita?.seguimiento?.fecha)}.` : b.dataset.est === 'cerrado' ? 'Cobrado.' : b.dataset.est === 'cancelado' ? 'Cancelado.'
    : j.garantia ? `Garantía agendada para el ${dia(j.garantia.fecha)}.` : 'Seguimiento cerrado.') + (j.pendiente ? ' Se envía al volver la señal.' : ''));
  const tarjeta = b.closest('.item'); if(tarjeta && !QUIETO){ tarjeta.classList.add('up-sale'); await new Promise(r => setTimeout(r, 230)); }
  ir(actual);
});

  async inventario(el){

  async numeros(el){

function marca(id, n){ const e = document.getElementById(id); e.hidden = !n; e.textContent = n; }
function falla(el, j){
  if(j.status === 401){
    el.innerHTML = `<div class="entrar"><b>Entra a tu centro</b><p>Abre el link de acceso que te mandó Grupo Mazi, o pega aquí tu código.</p>
      <form class="f" style="padding:0" id="fEnt"><label>Código<input name="c" autocomplete="off" required></label><button class="btn" type="submit">Entrar</button></form></div>`;
    barra.hidden = true;
    el.querySelector('#fEnt').onsubmit = (e) => { e.preventDefault(); guarda.poner('up_acceso', new FormData(e.target).get('c').trim()); location.reload(); };
    return;
  }
  el.innerHTML = `<p class="vacio" style="padding:40px 0">${esc(j.error)} <button class="btn b2" type="button" onclick="location.reload()">Reintentar</button></p>`;
}
barra.addEventListener('click', (e) => { const b = e.target.closest('[data-p]'); if(b) ir(b.dataset.p); });
barra.hidden = false;
ir(actual);
</script>
