<!doctype html><html lang="es-MX">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página sin defectos medibles</title>
<!-- La otra mitad de la prueba, y la que más falta hace: si el medidor sólo se
     probara contra la página rota, un medidor que dijera «🔴» a todo pasaría
     con honores. Ésta comprueba que SEPA CALLARSE. -->
<style>
  :root { --vacio:#100A18; --hueso:#E9E4E4; --violeta:#AC27FF; }
  body { margin:0; padding:16px; background:var(--vacio); color:var(--hueso);
         font:16px/1.5 system-ui; }
  button { min-height:44px; min-width:44px; padding:0 20px; font-size:16px;
           background:var(--violeta); color:var(--vacio); border:0; }
  input { min-height:44px; font-size:16px; width:100%; box-sizing:border-box; }
  /* Un carrusel BIEN hecho: sus hijos se salen de la pantalla a propósito y
     eso NO debe reportarse. */
  .tira { overflow-x:auto; display:flex; gap:12px; }
  .tira > div { flex:0 0 300px; height:80px; background:#1E1428; }
</style>
<button>Guardar</button>
<button>Guardar los cambios</button>
<input value="hola" aria-label="prueba">
<img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="" width="30" height="30">
<div class="tira"><div></div><div></div><div></div><div></div></div>
