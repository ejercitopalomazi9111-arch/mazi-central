<style>
*{box-sizing:border-box}
html,body{margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--sans); -webkit-text-size-adjust:100%; overflow-x:hidden}

  cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; touch-action:manipulation}
button[disabled]{opacity:.45}
:focus-visible{outline:2px solid var(--accent-ink); outline-offset:2px}
.ico{width:20px; height:20px}
main{max-width:1000px; margin:0 auto; padding:calc(14px + env(safe-area-inset-top)) 16px 40px}

.subir{background:var(--ink); color:var(--bg); box-shadow:none; font:600 16px var(--sans); min-height:52px}

<script type="module">
import { icono } from './iconos.js';
import { pintarMuelle } from './muelle.js';
import { importar, todos, uno, guardar, quitar, aPortada } from './libros.js';
import { apuntar } from './biblioteca.js';
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const leer = (k, d) => { try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch{ return d; } };
const escribir = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} };

pintarMuelle($('#nav'), { raiz: './', actual: 'biblioteca' });
document.querySelectorAll('.ic[data-ic]').forEach((e) => { e.outerHTML = icono(e.dataset.ic); });
$('#cerrar').innerHTML = icono('x'); $('#botonOpciones').innerHTML = icono('settings'); $('#escuchar').innerHTML = icono('headphones');
$('#vozPausa').innerHTML = icono('pause'); $('#vozParar').innerHTML = icono('x');

/* ── el librero ── */
const urls = [];
const pct = (l) => l.tipo === 'pdf' ? null : Math.round(100 * ((l.avance?.cap || 0) + (l.avance?.y || 0)) / l.capitulos.length);
async function pintar(){
  urls.splice(0).forEach((u) => URL.revokeObjectURL(u));
  const ls = await todos();
  $('#librero').innerHTML = ls.length ? ls.map((l) => {
    const u = l.portada ? URL.createObjectURL(l.portada) : ''; if(u) urls.push(u);
    const p = pct(l);
    return `<article class="libro" data-id="${l.id}">
      ${(() => { const tapa = `<span class="tapa">${u ? `<img src="${u}" alt="">` : ''}<b>${esc(l.titulo)}</b><span class="tipo">${l.tipo.toUpperCase()}</span></span>`;
        /* el PDF es una liga directa: el navegador sólo abre otra pestaña si el toque la abre en ese mismo instante */
        if(l.tipo === 'pdf'){ const pu = URL.createObjectURL(l.pdf); urls.push(pu); return `<a class="abrir" href="${pu}" target="_blank" rel="noopener" aria-label="Abrir ${esc(l.titulo)}">${tapa}</a>`; }
        return `<button type="button" class="abrir" aria-label="Leer ${esc(l.titulo)}">${tapa}</button>`; })()}
      <button type="button" class="quitar" aria-label="Quitar ${esc(l.titulo)}">${icono('x')}</button>
      <button type="button" class="cambiar-portada" aria-label="Ponerle portada a ${esc(l.titulo)}">${icono('image')}</button>
      <div class="pie"><b>${esc(l.titulo)}</b><span>${esc(l.autor || (l.tipo === 'pdf' ? 'Documento PDF' : `${l.capitulos.length} capítulo${l.capitulos.length === 1 ? '' : 's'}`))}</span>
        ${p == null ? '' : `<div class="avance" aria-label="Llevas ${p} %"><i style="width:${p}%"></i></div>`}</div>
    </article>`; }).join('')
    : '<p class="vacio"><b>Tu librero está vacío</b>Toca «Agregar libro» y elige un EPUB, PDF o TXT de tu teléfono.</p>';
}
$('#archivo').addEventListener('change', async (e) => {
  const fs = [...e.target.files]; e.target.value = '';
  let bien = 0; const mal = [], sinTapa = [];
  for(const [i, f] of fs.entries()){
    $('#estado').textContent = `Agregando ${f.name}${fs.length > 1 ? ` (${i + 1} de ${fs.length})` : ''}…`;
    try{ const l = await importar(f); await guardar(l); bien++; if(!l.portada) sinTapa.push(l.titulo); }catch(er){ mal.push(er.message); }
  }
  $('#estado').textContent = [bien ? `Listo: ${bien} libro${bien > 1 ? 's' : ''} agregado${bien > 1 ? 's' : ''}.` : '',
    sinTapa.length ? `${sinTapa.length === 1 ? `«${sinTapa[0]}» no trae` : `${sinTapa.length} no traen`} portada: toca el ícono de imagen para ponerle una.` : '', ...mal].filter(Boolean).join(' ');
  pintar();
});
/* portada propia: muchos libros no traen la suya, o Inkwell no la encuentra */
let portadaDe = null;
$('#archivoPortada').addEventListener('change', async (e) => {
  const f = e.target.files[0]; e.target.value = ''; if(!f || !portadaDe) return;
  try{ const l = await uno(portadaDe); l.portada = await aPortada(f); await guardar(l); $('#estado').textContent = `Listo: «${l.titulo}» ya tiene tu portada.`; pintar(); }
  catch(er){ $('#estado').textContent = 'No se pudo usar esa imagen: ' + er.message; }
});
$('#librero').addEventListener('click', async (e) => {
  const art = e.target.closest('.libro'); if(!art) return;
  if(e.target.closest('.cambiar-portada')){ portadaDe = art.dataset.id; $('#archivoPortada').click(); return; }
  if(e.target.closest('.quitar')){
    const l = await uno(art.dataset.id);
    if(confirm(`¿Quitar «${l.titulo}» de tu librero?`)){ await quitar(l.id); $('#estado').textContent = `Quitaste «${l.titulo}».`; pintar(); }
    return;
  }
  const ab = e.target.closest('.abrir'); if(!ab) return;
  if(ab.tagName === 'A'){ uno(art.dataset.id).then((l) => { l.abierto = Date.now(); guardar(l); }); return; }
  abrirLibro(art.dataset.id);
});

/* ── el lector ── */
let libro = null, cap = 0, tam = leer('libros.tam', 20), tema = leer('libros.tema', 'claro'), guardaT = 0;
function pintarTema(){
  $('#lector').dataset.tema = tema; $('#texto').style.setProperty('--tam', tam + 'px');
  document.querySelectorAll('[data-tema]').forEach((b) => { if(b.tagName === 'BUTTON') b.setAttribute('aria-pressed', String(b.dataset.tema === tema)); });
}
async function abrirLibro(id){
  libro = await uno(id); if(!libro) return;
  libro.abierto = Date.now(); guardar(libro);
  $('#lTitulo').textContent = libro.titulo;
  $('#capitulos').innerHTML = libro.capitulos.map((c, i) => `<option value="${i}">${esc(c.titulo)}</option>`).join('');
  $('#lector').hidden = false; $('#lector').classList.add('sinbarra'); $('#opciones').hidden = true; document.body.style.overflow = 'hidden';
  pintarTema(); irA(libro.avance?.cap || 0, libro.avance?.y || 0);
}
function irA(n, y = 0){
  cap = Math.max(0, Math.min(libro.capitulos.length - 1, n));
  $('#texto').innerHTML = libro.capitulos[cap].html;      // ya viene limpio desde libros.js
  $('#lCap').textContent = `${libro.capitulos[cap].titulo} · ${cap + 1} de ${libro.capitulos.length}`;
  $('#capitulos').value = String(cap);
  $('#anterior').disabled = cap === 0; $('#siguiente').disabled = cap === libro.capitulos.length - 1;
  const h = $('#hoja'); requestAnimationFrame(() => { h.scrollTop = y * Math.max(0, h.scrollHeight - h.clientHeight); });
  guardarAvance();
}
function guardarAvance(){
  if(!libro || libro.tipo === 'pdf') return;
  const h = $('#hoja'), y = h.scrollHeight > h.clientHeight ? h.scrollTop / (h.scrollHeight - h.clientHeight) : 0;
  libro.avance = { cap, y: Math.min(1, Math.max(0, y)) }; guardar(libro);
  /* para tus estadísticas: un capítulo cuenta como leído al pasar al siguiente, o al llegar al final del último */
  if(cap > 0) apuntar('libro:' + libro.id, cap);
  if(y > .97 && cap === libro.capitulos.length - 1) apuntar('libro:' + libro.id, cap + 1);
}
$('#hoja').addEventListener('scroll', () => { clearTimeout(guardaT); guardaT = setTimeout(guardarAvance, 400); }, { passive: true });
$('#anterior').addEventListener('click', () => { pararVoz(); irA(cap - 1); });
$('#siguiente').addEventListener('click', () => { pararVoz(); irA(cap + 1); });
$('#capitulos').addEventListener('change', (e) => { pararVoz(); irA(+e.target.value); });
$('#botonOpciones').addEventListener('click', (e) => { const o = $('#opciones'); o.hidden = !o.hidden; e.currentTarget.setAttribute('aria-expanded', String(!o.hidden)); });
document.querySelectorAll('button[data-tema]').forEach((b) => b.addEventListener('click', () => { tema = b.dataset.tema; escribir('libros.tema', tema); pintarTema(); }));
$('#menos').addEventListener('click', () => { tam = Math.max(14, tam - 2); escribir('libros.tam', tam); pintarTema(); });
$('#mas').addEventListener('click', () => { tam = Math.min(32, tam + 2); escribir('libros.tam', tam); pintarTema(); });
$('#cerrar').addEventListener('click', () => { pararVoz(); clearTimeout(guardaT); guardarAvance(); $('#lector').hidden = true; document.body.style.overflow = ''; libro = null; pintar(); });
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') guardarAvance(); });


/* ── la barra: sale con un toque y se va con otro (Carlos, 10 nov) ── */
$('#hoja').addEventListener('click', (e) => {
  if(e.target.closest('button, select, a')) return;
  /* con la voz prendida, tocar un párrafo la manda a leer desde ahí */
  const b = vozActiva && e.target.closest('#texto p, #texto li, #texto h1, #texto h2, #texto h3, #texto h4, #texto blockquote');
  if(b){ const i = bloques().indexOf(b); if(i >= 0){ hablar(i); return; } }
  $('#lector').classList.toggle('sinbarra');
  if($('#lector').classList.contains('sinbarra')) $('#opciones').hidden = true;
});

/* ── texto a voz: lee párrafo por párrafo, marca el que va, sigue al siguiente
   capítulo y guarda dónde se quedó. Se escoge desde dónde: tocando un párrafo,
   o, si no, empieza donde se quedó la última vez (o en lo que tengas en pantalla). ── */
const VELS = [1, 1.25, 1.5, 0.8];
let vozActiva = false, vozPausada = false, vozI = 0, vozVel = leer('libros.vel', 1), vozTurno = 0;
const sintes = window.speechSynthesis;
const bloques = () => [...$('#texto').querySelectorAll('p, li, h1, h2, h3, h4, blockquote')].filter((x) => x.textContent.trim() && !x.querySelector('p, li'));
function vozEsp(){
  const vs = sintes?.getVoices?.() || [];
  return vs.find((v) => /es[-_]MX/i.test(v.lang)) || vs.find((v) => /^es/i.test(v.lang)) || null;
}
function primeroEnPantalla(){
  const h = $('#hoja').getBoundingClientRect();
  const bs = bloques(); const i = bs.findIndex((b) => b.getBoundingClientRect().bottom > h.top + 60);
  return Math.max(0, i);
}
function pintarVoz(){
  $('#voz').hidden = !vozActiva; $('#lector').classList.toggle('con-voz', vozActiva);
  $('#vozPausa').innerHTML = icono(vozPausada ? 'play' : 'pause'); $('#vozPausa').setAttribute('aria-label', vozPausada ? 'Seguir escuchando' : 'Pausar la voz');
  $('#vozVel').textContent = String(vozVel).replace('.', ',') + '×';
  const n = bloques().length; $('#vozDonde').textContent = `${libro?.capitulos[cap].titulo || ''} · párrafo ${Math.min(vozI + 1, n)} de ${n}`;
}
function hablar(i){
  if(!sintes || !libro) { $('#estado').textContent = 'Este navegador no puede leer en voz alta.'; return; }
  const bs = bloques();
  if(i >= bs.length){                                  // se acabó el capítulo: sigue con el próximo
    if(cap < libro.capitulos.length - 1){ irA(cap + 1); setTimeout(() => hablar(0), 60); }
    else pararVoz();
    return;
  }
  const turno = ++vozTurno;
  sintes.cancel(); vozActiva = true; vozPausada = false; vozI = i;
  bs.forEach((b) => b.classList.remove('leyendo')); const b = bs[i]; b.classList.add('leyendo');
  b.scrollIntoView({ block: 'center', behavior: 'smooth' });
  libro.voz = { cap, p: i }; guardar(libro);
  const u = new SpeechSynthesisUtterance(b.textContent.trim());
  u.lang = 'es-MX'; const v = vozEsp(); if(v) u.voice = v; u.rate = vozVel;
  u.onend = () => { if(turno === vozTurno && vozActiva && !vozPausada) hablar(vozI + 1); };
  sintes.speak(u); pintarVoz();
}
function pararVoz(){
  vozTurno++; vozActiva = false; vozPausada = false; try{ sintes?.cancel(); }catch{}
  $('#texto').querySelectorAll('.leyendo').forEach((b) => b.classList.remove('leyendo')); pintarVoz();
}
$('#escuchar').addEventListener('click', () => {
  if(vozActiva){ pararVoz(); return; }
  const v = libro.voz;
  hablar(v && v.cap === cap ? v.p : primeroEnPantalla());
  $('#lector').classList.add('sinbarra'); $('#opciones').hidden = true;
});
$('#vozPausa').addEventListener('click', () => {
  if(vozPausada){ vozPausada = false; hablar(vozI); }       // se retoma desde el párrafo: más confiable que resume() en iPhone
  else { vozPausada = true; vozTurno++; sintes.cancel(); pintarVoz(); }
});
$('#vozParar').addEventListener('click', pararVoz);
$('#vozVel').addEventListener('click', () => { vozVel = VELS[(VELS.indexOf(vozVel) + 1) % VELS.length]; escribir('libros.vel', vozVel); if(vozActiva && !vozPausada) hablar(vozI); else pintarVoz(); });
sintes?.addEventListener?.('voiceschanged', () => {});

navigator.storage?.persist?.().catch(() => {});
if('serviceWorker' in navigator && !location.search.includes('pruebas')) navigator.serviceWorker.register('sw.js').catch(() => {});
window.__libros = { todos };
pintar();
{ const q = new URLSearchParams(location.search).get('abrir'); if(q){ history.replaceState(null, '', location.pathname + (location.search.includes('pruebas') ? '?pruebas' : '')); abrirLibro(q); } }
</script>
