  S.cast.forEach(a=>{
    st.alive[a.k]=true;
    st.power[a.k]= a.k==='lead'?15:ri(RNG(hash(S.id+a.k)),30,60);
    st.rel[a.k]={};
    S.cast.forEach(b=>{ if(a.k!==b.k) st.rel[a.k][b.k]= (a.k==='lead'&&b.k==='love')?25:0; });
  });
  return st;
}
const bump=(st,a,b,d)=>{ if(st.rel[a]&&st.rel[a][b]!=null) st.rel[a][b]=clamp(st.rel[a][b]+d,-100,100); };

function step(S,st,n,r){
  st.arcIdx=Math.floor((n-1)/15)%S.arcs.length;
  st.season=Math.floor((n-1)/150)+1;
  const inArc=((n-1)%15)+1;
  const phase= inArc<=4?'setup': inArc<=9?'escala': inArc<=12?'climax':'secuela';
  const cast=S.cast.filter(c=>st.alive[c.k]);

  if(st.threads.filter(t=>t.status!=='resuelto').length<3 && chance(r, phase==='setup'?.75:.28))
    st.threads.push({what:pick(r,THREADS), who:pick(r,cast).k, status:'abierto', born:n, heat:1});

  const open=st.threads.filter(t=>t.status!=='resuelto');
  let focus=null;
  if(open.length){
    focus=pick(r,open); focus.heat++;
    if(phase==='climax'&&focus.heat>2&&chance(r,.5)){ focus.status='resuelto'; focus.closed=n; }
    else if(focus.heat>=3) focus.status='hirviendo';
  }
  st.tension=clamp(st.tension + (phase==='climax'?ri(r,6,14): phase==='secuela'?-ri(r,8,18): ri(r,-2,7)),0,100);

  const [a,b]=picks(r,cast,2);
  let rel=null;
  if(a&&b){
    const roll=r();
    if(roll<S.tone.romance){ bump(st,a.k,b.k,ri(r,4,12)); bump(st,b.k,a.k,ri(r,2,9)); rel={kind:'acerca',a,b}; }
    else if(roll<S.tone.romance+.30){ bump(st,a.k,b.k,-ri(r,5,15)); rel={kind:'choca',a,b}; }
    else if(roll<S.tone.romance+.40){ rel={kind:'descubre',a,b}; }
  }
  if(chance(r,.3)) st.power.lead=clamp(st.power.lead+ri(r,1,3),0,100);

  let death=null;
  const killable=cast.filter(c=>c.k!=='lead'&&c.k!=='love'&&c.k!=='rival');
  if(phase==='climax'&&n>60&&killable.length>1&&chance(r,.04)){
    death=pick(r,killable); st.alive[death.k]=false; st.tension=clamp(st.tension+30,0,100);
  }

  const ev={n,arc:S.arcs[st.arcIdx],phase,focus,rel,death,
            place:pick(r,S.world.places), threat:pick(r,S.world.threats)};
  st.events.push({n,summary:sumUp(ev)});
  if(st.events.length>300) st.events.splice(0,st.events.length-300);
  return ev;
}
function sumUp(ev){
  if(ev.death) return `Murió ${ev.death.n}.`;
  if(ev.rel){ const{kind,a,b}=ev.rel;
    if(kind==='acerca')   return `${a.n} y ${b.n} se acercaron más de lo prudente.`;
    if(kind==='choca')    return `${a.n} y ${b.n} chocaron feo.`;
    if(kind==='descubre') return `${a.n} descubrió algo sobre ${b.n}.`; }
  if(ev.focus) return `Se movió el asunto de ${ev.focus.what}.`;
  return `Algo pasó en ${ev.place}.`;
}
const cache={};
function stateBefore(S,n){
  cache[S.id]=cache[S.id]||{};
  const C=cache[S.id];
  const anchor=Math.floor((n-1)/50)*50;
  let st,start;
  if(anchor>0&&C[anchor]){ st=JSON.parse(JSON.stringify(C[anchor])); start=anchor+1; }
  else { st=initState(S); start=1; }
  for(let i=start;i<n;i++){
    step(S,st,i,RNG(hash(S.id)+i*2654435761));
    if(i%50===0) C[i]=JSON.parse(JSON.stringify(st));
  }
  return st;
}

const G={
 hora:['Al amanecer','Pasada la medianoche','A media tarde','Antes de que saliera el sol','Con la última luz del día','A las tres de la mañana','Dos días después','Esa misma noche','Cuando todos dormían','Al tercer día'],
 clima:['con una lluvia fina que no terminaba de caer','bajo un cielo del color del plomo','con un frío que se metía en los huesos','con el aire quieto, como conteniendo el aliento','entre una niebla que borraba las orillas','con un calor que pesaba','bajo un silencio que daba miedo'],
 gesto:['apretó la mandíbula','se tronó los dedos','soltó el aire despacio','no movió un músculo','ladeó la cabeza','cerró los ojos un segundo de más','se acomodó el cuello del abrigo','tragó saliva','contó hasta tres'],
 emo:['con una calma que no sentía','con el corazón golpeándole las costillas','sin una gota de miedo, y eso era lo raro','con las manos frías','con una rabia vieja','con algo parecido al alivio','con ganas de reírse en el peor momento posible'],
 sens:['ceniza','metal mojado','ozono','flores marchitas','humo','tierra recién movida','papel viejo','sangre'],
 cuerpo:['el pulso','la nuca','el estómago','los dientes','las costillas','las palmas'],
 aviso:['Algo estaba mal.','Eso no debía estar ahí.','La cuenta no daba.','Faltaba alguien.','Sobraba alguien.','Nadie decía nada, y eso era lo peor.','Ya lo había visto antes. En un sueño, o en otra vida.'],
 reac:['Nadie se movió.','El silencio duró demasiado.','Alguien, atrás, empezó a rezar.','Se oyó un vidrio romperse muy lejos.','El suelo vibró apenas.','Una risa. Una sola. Y nadie supo de quién.'],
};
const J=(...p)=>p.filter(Boolean).join(' ');
const POV=S=>S.cast[0];

function bOpen(S,st,ev,r){
  const L=POV(S), p=[];
  p.push(J(`${pick(r,G.hora)}, ${ev.place},`, pick(r,G.clima)+'.'));
  p.push(J(`${L.n} ${pick(r,G.gesto)}`, pick(r,G.emo)+'.', pick(r,G.aviso)));
  if(S.world.system.length && chance(r,.5)) p.push(pick(r,S.world.system));
  p.push(st.tension>60
    ? `El aire olía a ${pick(r,G.sens)}. En ${S.world.name}, eso nunca significaba nada bueno.`
    : `Llevaba ${ri(r,2,9)} días sin dormir bien. Se le empezaba a notar en ${pick(r,G.cuerpo)}.`);
  return p;
}
function bCallback(S,st,r){
  const past=st.events.slice(-70); if(!past.length) return [];
  const e=pick(r,past);
  return [pick(r,[
    `Todavía pensaba en lo del capítulo ${e.n}. ${e.summary} Nadie lo había vuelto a mencionar, y ese silencio pesaba más que el hecho.`,
    `${e.summary} Eso fue en el ${e.n}. Desde entonces nada volvió a acomodarse del todo.`,
    `Habían pasado cosas desde el ${e.n}. ${e.summary} ${POV(S).n} no olvidaba. Nunca olvidaba nada.`,
  ])];
}
function bDialogue(S,st,r,mood){
  const cast=S.cast.filter(c=>st.alive[c.k]);
  const [a,b]=picks(r,cast,2); if(!a||!b) return null;
  const rel=(st.rel[a.k]&&st.rel[a.k][b.k])||0;
  const t=st.threads.filter(x=>x.status!=='resuelto')[0];
  const L=[];
  L.push({w:b, t: rel>40 ? pick(r,[`—¿Otra vez sin dormir?`,`—Te esperé. No sé por qué, pero te esperé.`])
              : rel<-30 ? pick(r,[`—No te quiero aquí —y no levantó la voz. Eso era lo peligroso.`,`—Cada vez que apareces, alguien sangra.`])
              : pick(r,[`—Tenemos que hablar.`,`—Sé lo que vas a decir. Dilo de todos modos.`])});
  L.push({w:a, t: mood==='comedy' ? pick(r,[`—Puedo explicarlo.`,`—Eso depende mucho de a qué le llames "eso".`,`—Técnicamente no fue culpa mía. Técnicamente.`])
              : mood==='romance' ? pick(r,[`—No me pidas que me vaya. Hoy no.`,`—Si te digo la verdad, ¿te quedas?`,`—Odio que siempre tengas razón.`])
              : mood==='horror'  ? pick(r,[`—¿Escuchaste eso? Otra vez.`,`—No abras esa puerta.`,`—Hay algo aquí. Y lleva rato con nosotros.`])
              : pick(r,[`—Lo sé. Por eso vine.`,`—Nadie más lo va a hacer. Así que lo hago yo.`,`—Pregunta lo que de verdad quieres preguntar.`])});
  if(t){
    L.push({w:b, t:`—Es por ${t.what}, ¿verdad? —no lo preguntaba. Lo confirmaba.`});
    L.push({w:a, t:pick(r,[`—Es por eso y por todo lo que viene después.`,`—Si te lo cuento, te vuelves parte. Y no quiero eso para ti.`,`—Ya no importa quién empezó. Importa quién lo termina.`])});
  }
  if(mood==='comedy'&&chance(r,.6)) L.push({w:b, t:pick(r,[`—Voy a fingir que eso tuvo sentido.`,`—Odio que funcione.`,`—...¿Y el plan B?`])});
  return {type:'dlg', lines:L};
}
function bAction(S,st,ev,r){
  const L=POV(S), p=[];
  p.push(pick(r,[
    `Y entonces ${ev.threat} entró en escena, y se acabó el tiempo de pensar.`,
    `${ev.threat} no avisó. Nunca avisan.`,
    `Lo que vino después duró once segundos. ${L.n} los contó todos.`,
  ]));
  p.push(J(pick(r,[`${L.n} se movió primero.`,`${L.n} no esquivó: calculó, y decidió recibir el golpe.`,`El primer golpe lo paró de milagro. El segundo, de pura rabia.`]), pick(r,G.reac)));
  const al=pick(r,S.cast.filter(c=>st.alive[c.k]&&c.k!=='lead'));
  if(al) p.push(pick(r,[
    `${al.n} llegó tarde, como siempre, y justo a tiempo, como siempre.`,
    `Alguien gritó su nombre. Era ${al.n}. No volteó: si volteaba, moría.`,
    `${al.n} se metió en medio sin pensarlo. Después habría tiempo de reclamárselo.`,
  ]));
  return p;
}
function bRomance(S,st,r){
  const a=POV(S), b=S.cast.find(c=>c.k==='love');
  if(!b||!st.alive[b.k]) return [];
  const rel=(st.rel[a.k]&&st.rel[a.k][b.k])||0;
  if(rel<10) return [pick(r,[
    `${b.n} pasó a su lado sin mirarlo. ${a.n} se dijo que no le importaba, y se mintió fatal.`,
    `Todavía no eran nada. Ese "todavía" le pesaba a ${a.n} más de lo que iba a admitir.`])];
  if(rel<55) return [pick(r,[
    `La distancia entre ellos era de un paso. Ninguno lo dio. Todavía.`,
    `${b.n} le acomodó el cuello del abrigo, sin decir nada. ${a.n} lo dejó. Ese fue el error de los dos.`,
    `—No te confundas —dijo ${a.n}, con las orejas ardiendo—. Solo te necesito vivo. Por ahora.`])];
  return [pick(r,[
    `—Quédate —pidió ${b.n}. Una palabra, y a ${a.n} se le olvidó cómo respirar.`,
    `Se quedaron así, sin decir nada, mucho más tiempo del que ninguno de los dos iba a admitir después.`,
    `—Si me traicionas —murmuró ${a.n}—, esta vez me voy a asegurar de que duela.\n—Lo sé —dijo ${b.n}—. Cuento con eso.`])];
}
function bComedy(S,st,r){
  const [a,b]=picks(r,S.cast.filter(c=>st.alive[c.k]),2); if(!a||!b) return [];
  return [pick(r,[
    `${b.n} lo miró con la cara de quien ya vio esta película y sabe exactamente cómo termina. —No lo hagas.\n${a.n} lo hizo.`,
    `El plan tenía tres pasos. En el paso uno ya se había ido a la basura. ${a.n} improvisó los otros dos con una convicción admirable y absolutamente infundada.`,
    `—¿Y si sale mal? —preguntó ${b.n}.\n—Entonces sale mal —dijo ${a.n}, como si eso resolviera algo. Curiosamente, lo resolvió.`,
    `Hubo un silencio largo, digno, casi solemne. Lo rompió ${b.n}: —Eso fue lo más estúpido que te he visto hacer. Y te he visto hacer mucho.`])];
}
function bHorror(S,st,ev,r){
  const L=POV(S);
  return [pick(r,[
    `El pasillo estaba igual que siempre. Ese era el problema: exactamente igual que siempre, y ${L.n} habría jurado que la puerta del fondo antes no estaba ahí.`,
    `No se oía nada. Ni viento, ni pasos, ni la respiración de nadie. ${L.n} se dio cuenta, con un frío que le subió por ${pick(r,G.cuerpo)}, de que tampoco se oía la suya.`,
    `Contó las siluetas. Siete. Volvió a contar. Ocho. Ninguna se había movido.`,
    `Lo peor no fue verlo. Lo peor fue que la cosa lo vio a él primero, y esperó, con paciencia, a que se diera cuenta.`])];
}
function bReveal(S,st,ev,r){
  const L=POV(S);
  const who=S.cast.find(c=>c.k===(ev.focus?ev.focus.who:'shadow'))||L;
  return [pick(r,[
    `Y entonces encajó todo de golpe, como huesos rotos: ${ev.focus?ev.focus.what:'lo que estaba pasando'} nunca fue lo que parecía. Y ${who.n} lo sabía desde el principio.`,
    `El nombre estaba ahí, escrito con una letra que ${L.n} conocía demasiado bien. La de ${who.n}.`,
    `No fue casualidad. Nada de esto lo era. ${who.n} llevaba capítulos moviendo las piezas, y ${L.n} había sido la más obediente de todas.`])];
}
function bCliff(S,st,ev,r){
  const L=POV(S);
  if(ev.death) return `${ev.death.n} no se levantó. Y ${L.n} entendió, tarde, que este mundo sí cobra las cosas.`;
  if(ev.focus&&ev.focus.status==='resuelto') return `Se acabó lo de ${ev.focus.what}. Pero al cerrar esa puerta, ${L.n} oyó cómo se abría otra, mucho más adentro.`;
  return pick(r,[
    `Y justo cuando creyó que había ganado, las puertas se abrieron de golpe.`,
    `La voz detrás de él dijo tres palabras que lo cambiaron todo: —Te estaba esperando.`,
    `Afuera empezaron a sonar las campanas. Todas a la vez. Eso solo pasaba cuando moría alguien importante.`,
    `En el suelo, junto a la puerta, había una segunda huella. Y no era de nadie que estuviera vivo.`,
    `${L.n} sonrió. El juego de verdad apenas empezaba.`]);
}

function moodRoll(S,r,st){
  const t={...S.tone};
  if(st.tension>70){ t.action*=1.6; t.horror*=1.5; t.comedy*=.5; }
  if(st.tension<25){ t.comedy*=1.5; t.romance*=1.4; }
  const k=Object.keys(t), sum=k.reduce((s,x)=>s+t[x],0);
  let x=r()*sum;
  for(const key of k){ x-=t[key]; if(x<=0) return key; }
  return 'action';
}

/* ---------- construir capítulo LARGO ---------- */
function buildChapter(S,n){
  const r=RNG(hash(S.id)+n*2654435761);
  const st=stateBefore(S,n);
  const ev=step(S,st,n,RNG(hash(S.id)+n*2654435761));
  const B=[];
  const add=(t,v,x)=>B.push(Object.assign({t,v},x||{}));
  const recap=st.events.filter(e=>e.n<n).slice(-2).map(e=>e.summary).join(' ')||null;

  bOpen(S,st,ev,r).forEach(p=>add('p',p));
  add('img','',{mood:'wide', cap:ev.place});

  const nSc=ri(r,6,9);
  for(let i=0;i<nSc;i++){
    const mood=moodRoll(S,r,st);
    if(i>0) add('br','');
    if(chance(r,.42)) bCallback(S,st,r).forEach(p=>add('p',p));

    const fn={comedy:bComedy, romance:bRomance, horror:bHorror, action:bAction, mystery:bReveal}[mood];
    (fn===bAction||fn===bHorror||fn===bReveal ? fn(S,st,ev,r) : fn(S,st,r)).forEach(p=>add('p',p));

    const d=bDialogue(S,st,r,mood); if(d) B.push(d);
    if(mood==='action'&&chance(r,.5)) add('sfx', pick(r,['CRAC','TUMP','SHHHK','BOOM','CLANG','ZAS']));
    if(chance(r,.40)) add('img','',{mood, cap:ev.place});
    if(chance(r,.5)) add('p', J(`${POV(S).n} ${pick(r,G.gesto)}`, pick(r,G.emo)+'.'));
  }

  if(((n-1)%15)+1>=13){ add('br',''); bReveal(S,st,ev,r).forEach(p=>add('p',p)); }
  add('img','',{mood:'group', cap:ev.place});

  return {n, arc:ev.arc, season:st.season, title:titleOf(S,ev,n,r),
          recap, blocks:B, cliff:bCliff(S,st,ev,r), state:st};
}
function titleOf(S,ev,n,r){
  const f=[ev.arc, `${ev.arc} — parte ${((n-1)%15)+1}`,
    ev.death?'Nadie Dijo Que Sería Gratis':null,
    ev.focus&&ev.focus.status==='resuelto'?'Se Paga lo que Se Debe':null].filter(Boolean);
  return pick(r,f);
}

function artFor(S, mood, seed){

}

          <div class="say"><b style="color:${l.w.c}">${l.w.n}</b>${l.t.replace(/\n/g,'<br>')}</div>`;
        d.appendChild(row);
      });
      w.appendChild(d);
    } else if(b.t==='img'){
      const a=artFor(S,b.mood, ch.n*7+(imgN++));
      if(!a) return;
      const box=document.createElement('div'); box.className='illus';
      box.innerHTML=`<img loading="lazy" src="arte/img/${a.f}" alt="">
        <div class="grad"></div>
        <div class="cred">${a.artist}</div>
        <div class="cap">${b.cap}</div>`;
      w.appendChild(box);
    }
  });

  const cl=document.createElement('div'); cl.className='cliff';
  cl.innerHTML=`<div class="lbl">Y entonces…</div><p>${ch.cliff}</p>`;
  w.appendChild(cl);

  body.appendChild(w);
  store[cur.id]=cur.n; save();
  $('prevBtn').disabled=cur.n<=1;
  $('nextBtn').disabled=cur.n>=1500;
  scrollTo(0,0);
}
const go=d=>{ cur.n=clamp(cur.n+d,1,1500); render(); };

addEventListener('scroll',()=>{
  const m=document.body.scrollHeight-innerHeight;
  $('progress').style.width= m>0 ? (scrollY/m*100)+'%' : '0';
},{passive:true});

/* ---------- TTS (iPhone: voces de iOS) ---------- */
const synth=window.speechSynthesis;
let voices=[], on=false, Q=[], qi=0;
function vScore(v){
  const n=(v.name||'').toLowerCase(), l=(v.lang||'').toLowerCase();
  let s=0;
  if(l.startsWith('es')) s+=60;
  if(l==='es-mx') s+=30;
  if(/premium|enhanced|mejorada|neural|natural|online/.test(n)) s+=100;
  if(/paulina|mónica|monica|jorge|juan|angelica/.test(n)) s+=25;
  if(/novelty|eloquence|compact/.test(n)) s-=40;
  return s;
}
function loadVoices(){
  voices=(synth?synth.getVoices():[]).slice().sort((a,b)=>vScore(b)-vScore(a));
  const sel=$('voiceSel'); sel.innerHTML='';
  voices.forEach((v,i)=>{
    const o=document.createElement('option'); o.value=i;
    o.textContent=(vScore(v)>=100?'★ ':'')+v.name+' · '+v.lang;
    sel.appendChild(o);
  });
  if(store.voice!=null && voices[store.voice]) sel.value=store.voice;
}
if(synth){ loadVoices(); synth.onvoiceschanged=loadVoices; }
$('voiceSel').onchange=e=>{ store.voice=e.target.value; save(); };

function speak(i){
  if(!synth||i>=Q.length){ stopTTS(); return; }
  qi=i;
  document.querySelectorAll('.reading').forEach(n=>n.classList.remove('reading'));
  Q[i].el.classList.add('reading');
  Q[i].el.scrollIntoView({block:'center',behavior:'smooth'});
  const u=new SpeechSynthesisUtterance(Q[i].txt);
  const v=voices[$('voiceSel').value];
  if(v){ u.voice=v; u.lang=v.lang; } else u.lang='es-MX';
  u.rate=parseFloat($('rateSel').value)||1;
  u.onend=()=>{ if(on) speak(i+1); };
  u.onerror=()=>{ if(on) speak(i+1); };
  synth.speak(u);
}
function startTTS(){
  if(!synth){ alert('Este navegador no trae voces.'); return; }
  Q=[...document.querySelectorAll('#chapterBody .para, #chapterBody .dline, .cliff p')]
      .filter(n=>n.textContent.trim()).map(n=>({el:n,txt:n.textContent.trim()}));
  if(!Q.length) return;
  on=true; $('ttsPlay').textContent='⏸'; speak(0);
}
function stopTTS(){ on=false; if(synth) synth.cancel(); $('ttsPlay').textContent='▶';
  document.querySelectorAll('.reading').forEach(n=>n.classList.remove('reading')); }
$('ttsBtn').onclick=()=>{
  const b=$('ttsbar'); b.classList.toggle('on'); $('ttsBtn').classList.toggle('on');
  if(!b.classList.contains('on')) stopTTS();
};
$('ttsPlay').onclick=()=>{
  if(!on) startTTS();
  else if(synth.paused){ synth.resume(); $('ttsPlay').textContent='⏸'; }
  else { synth.pause(); $('ttsPlay').textContent='▶'; }
};
$('ttsStop').onclick=stopTTS;
$('rateSel').onchange=()=>{ if(on){ const i=qi; synth.cancel(); speak(i); } };

/* ---------- CONFIG: tipografía, tamaño, interlineado, tema ---------- */
function openCfg(){
  const c=store.cfg;
  $('cfgInner').innerHTML=`
    <h3>Lectura</h3>
    <div class="sub">Ajusta cómo se ve el texto. Se guarda solo.</div>
    <div class="grp"><h4>Tipografía</h4><div class="opts" id="fOpts">
      ${Object.entries(FONTS).map(([k,f])=>
        `<div class="opt ${c.font===k?'on':''}" data-f="${k}" style="font-family:${f.v}">${f.n}</div>`).join('')}
    </div></div>
    <div class="grp"><h4>Tamaño · <span id="szV">${c.size}px</span></h4>
      <input class="slider" type="range" min="14" max="26" step="1" value="${c.size}" id="szS"></div>
    <div class="grp"><h4>Interlineado · <span id="lhV">${c.lh}</span></h4>
      <input class="slider" type="range" min="1.4" max="2.2" step="0.05" value="${c.lh}" id="lhS"></div>
    <div class="grp"><h4>Tema</h4><div class="opts" id="tOpts">
      ${[['dark','Oscuro'],['sepia','Sepia'],['light','Claro']].map(([k,n])=>
        `<div class="opt ${c.theme===k?'on':''}" data-t="${k}">${n}</div>`).join('')}
    </div></div>
    <div class="sample" id="sample">Contó las siluetas. Siete. Volvió a contar. Ocho. Ninguna se había movido.</div>
    <button class="bigbtn ghost" id="cfgClose">Listo</button>`;
  $('cfgSheet').classList.add('on');

  const refresh=()=>{ applyCfg(); save(); if(cur.id&&$('reader').classList.contains('on')) {} };
  $('fOpts').onclick=e=>{ const o=e.target.closest('.opt'); if(!o)return;
    store.cfg.font=o.dataset.f; [...$('fOpts').children].forEach(x=>x.classList.toggle('on',x===o)); refresh(); };
  $('tOpts').onclick=e=>{ const o=e.target.closest('.opt'); if(!o)return;
    store.cfg.theme=o.dataset.t; [...$('tOpts').children].forEach(x=>x.classList.toggle('on',x===o)); refresh(); };
  $('szS').oninput=e=>{ store.cfg.size=+e.target.value; $('szV').textContent=e.target.value+'px'; refresh(); };
  $('lhS').oninput=e=>{ store.cfg.lh=+e.target.value; $('lhV').textContent=e.target.value; refresh(); };
  $('cfgClose').onclick=()=>$('cfgSheet').classList.remove('on');
}
$('cfgBtn').onclick=openCfg;
$('cfgBtn2').onclick=openCfg;

/* ---------- TRAMA ---------- */
$('plotBtn').onclick=()=>{
  const S=SERIES.find(s=>s.id===cur.id), st=cur.ch.state, L=S.cast[0];
  const rel=S.cast.filter(c=>c.k!=='lead').map(c=>{
    const v=(st.rel[L.k]&&st.rel[L.k][c.k])||0, pct=(v+100)/2;
    const col=v>35?'#50b080':v<-35?'#e05050':'#9a92ab';
    return `<div class="row"><div class="r-name"><span class="chip" style="background:${c.c}"></span>
      <span>${c.n}${st.alive[c.k]?'':' <span style="color:#e05050">†</span>'} <span style="color:var(--dim);font-size:11px">· ${c.r}</span></span></div>
      <div class="bar"><i style="width:${pct}%;background:${col}"></i></div></div>`;}).join('');
  const th=st.threads.slice(-8).reverse().map(t=>{
    const cls=t.status==='resuelto'?'tag-done':t.status==='hirviendo'?'tag-hot':'tag-open';
    return `<div class="row"><div class="r-name"><span>${t.what}</span></div>
      <div class="r-val ${cls}">${t.status} · cap ${t.born}</div></div>`;}).join('')||'<div class="ev">Sin hilos abiertos.</div>';
  const ev=st.events.slice(-14).reverse().map(e=>`<div class="ev"><b>Cap. ${e.n}</b> — ${e.summary}</div>`).join('');
  $('plotInner').innerHTML=`<h3>${S.title}</h3>
    <div class="sub">Temporada ${st.season} · ${cur.ch.arc} · Tensión ${st.tension}/100</div>
    <div class="grp"><h4>Cómo ve ${L.n} a los demás</h4>${rel}</div>
    <div class="grp"><h4>Hilos de la trama</h4>${th}</div>
    <div class="grp"><h4>Lo que ha pasado</h4>${ev}</div>
    <button class="bigbtn ghost" id="pc">Cerrar</button>`;
  $('pc').onclick=()=>$('plotSheet').classList.remove('on');
  $('plotSheet').classList.add('on');
};

    <div class="sub">INKWELL no descarga capítulos: los <b>genera</b> en tu teléfono. No hay servidor. Una vez instalada, funciona en el camión sin una sola barra de señal.</div>

      :'1. Toca <b>Compartir</b> (el cuadrito con la flecha ↑)<br>2. Baja y toca <b>“Añadir a pantalla de inicio”</b><br>3. Ábrela desde el ícono. Ya funciona sin internet.'}</div></div>
    <div class="grp"><h4>Voz más humana</h4>
      <div class="ev">Ajustes → Accesibilidad → Contenido hablado → Voces → Español (México) → descarga <b>Paulina (Mejorada)</b>. La de fábrica suena a robot; esa no.</div></div>
    <div class="grp"><h4>El arte</h4>
      <div class="ev">Son <b>pinturas reales de dominio público</b> (Wikimedia Commons): Goya, Kuniyoshi, ukiyo-e, románticos. Se guardan con la app — 14 MB en total.</div></div>
    <button class="bigbtn ghost" id="oc">Entendido</button>`;

[['plotSheet'],['cfgSheet'],['offSheet']].forEach(([id])=>{

});

$('backBtn').onclick=back;
$('prevBtn').onclick=()=>go(-1);
$('nextBtn').onclick=()=>go(1);
$('jumpBtn').onclick=()=>{ const v=+$('jumpInput').value; if(v>=1&&v<=1500){ cur.n=v; render(); } };

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
renderLibrary();
