# Fadori · el servidor
# ─────────────────────────────────────────────────────────────────────────────
# Un Durable Object por escuela. Es lo que hace que el turno 7 sea el turno 7
# en los doscientos teléfonos a la vez: un solo lugar que ordena, con memoria
# propia y consistencia fuerte. No hay base de datos aparte que administrar.
#
# Corre en el plan GRATIS de Cloudflare Workers: los Durable Objects con
# almacenamiento SQLite están incluidos ahí (los de key-value no, y por eso
# este usa SQLite — está en la migración de abajo).

name = "fadori"
main = "src/index.js"
compatibility_date = "2026-08-01"

# El sitio se sirve por Cloudflare Pages y la API por aquí. Si algún día viven
# en el mismo dominio, se le pone una ruta y se acabaron los CORS.
workers_dev = true

[observability]
enabled = true

[[durable_objects.bindings]]
name = "COOPERATIVA"
class_name = "Cooperativa"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Cooperativa"]

[vars]
# De dónde se acepta que llamen. En claro y sin comodín: un "*" aquí sería
# dejarle la puerta abierta a cualquier página del mundo.
ORIGENES = "https://fadori.pages.dev,http://localhost:8777,http://127.0.0.1:8777"
